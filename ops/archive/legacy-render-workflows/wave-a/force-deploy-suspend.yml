name: Force Deploy (Suspend + Deploy)

# ============================================================
# EMERGENCY: Force deploy by suspending old container first
# ------------------------------------------------------------
# The old sanad-backend container holds all 15 Supabase DB
# connections. New deploys can't connect because the pool is
# exhausted. This workflow:
#   1. Suspends sanad-backend (releases all DB connections)
#   2. Waits 30s for connections to be released
#   3. Triggers a deploy (new container can now connect)
#   4. Waits for deploy to become live
#   5. Verifies health + login
# ============================================================

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "force-deploy" to confirm (backend will be DOWN during deploy)'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  force-deploy:
    name: Suspend + Deploy sanad-backend
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    if: github.event.inputs.confirm == 'force-deploy'

    steps:
      - name: Suspend sanad-backend to release DB connections
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          set -euo pipefail
          echo "=== Suspending sanad-backend ==="
          STATUS=$(curl -sS -o /tmp/suspend.json -w "%{http_code}" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/suspend" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json")
          echo "Suspend HTTP ${STATUS}"
          cat /tmp/suspend.json || true
          echo ""
          echo "Waiting 30s for DB connections to be released..."
          sleep 30

      - name: Trigger deploy on suspended service
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          set -euo pipefail
          echo "=== Triggering deploy ==="
          STATUS=$(curl -sS -o /tmp/deploy.json -w "%{http_code}" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{"clearCache":"do_not_clear"}')
          echo "Deploy trigger HTTP ${STATUS}"
          cat /tmp/deploy.json
          DEPLOY_ID=$(python3 -c "import json; print(json.load(open('/tmp/deploy.json')).get('id',''))")
          echo "Deploy ID: ${DEPLOY_ID}"
          echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          set -euo pipefail
          DEPLOY_ID="${{ steps.deploy.outputs.deploy_id }}"
          echo "Waiting for deploy ${DEPLOY_ID}..."
          for i in $(seq 1 100); do
            sleep 15
            STATUS=$(curl -sS --max-time 30 \
              "https://api.render.com/v1/services/${BACKEND_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" | python3 -c "import json, sys; print(json.load(sys.stdin).get('status','unknown'))")
            echo "  Attempt ${i}: ${STATUS}"
            if [ "${STATUS}" = "live" ]; then echo "✓ DEPLOY LIVE!"; exit 0; fi
            if echo "${STATUS}" | grep -qE "failed|canceled|deactivated"; then
              echo "::error::Deploy ${STATUS}"
              exit 1
            fi
          done
          echo "::error::Timeout"
          exit 1

      - name: Verify health and login
        run: |
          sleep 15
          echo "=== Health ==="
          curl -sS --max-time 15 "https://sanad-backend-mcrj.onrender.com/actuator/health"
          echo ""
          echo "=== Login test (wrong password → expect 401) ==="
          curl -sS --max-time 15 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -H "Origin: https://snad-app.vercel.app" \
            -d '{"email":"admin@snad.ai","password":"wrong"}' \
            -w "\nHTTP %{http_code}\n"
          echo ""
          echo "=== Access-check ==="
          curl -sS --max-time 10 "https://sanad-backend-mcrj.onrender.com/api/v1/control-plane/access-check"
