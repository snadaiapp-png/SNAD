name: Render Fix Flyway Creds (USER/PASSWORD) + Deploy + Verify

# SPRING_FLYWAY_URL=session pooler (:6543) is set, but Supavisor requires the
# tenant identifier in the username (postgres.<ref>). Spring Boot does NOT
# inherit spring.flyway.user/password from the datasource when spring.flyway.url
# is set. Fix: copy DATABASE_USERNAME -> SPRING_FLYWAY_USER and
# DATABASE_PASSWORD -> SPRING_FLYWAY_PASSWORD. Then deploy + verify.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    name: Set SPRING_FLYWAY_USER/PASSWORD + clear + deploy + verify
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    steps:
      - name: Configure Flyway creds, clear orphans, deploy, verify
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          BASE="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"
          fv() { curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/env-vars/$1" | jq -r '(.envVar // .).value // empty'; }
          put() { # $1=key $2=value
            jq -n --arg v "$2" '{value:$v}' > /tmp/b.json
            local h; h=$(curl -s -o /tmp/rr.json -w "%{http_code}" --max-time 45 -X PUT \
              -H "$AUTH" -H 'Accept: application/json' -H 'Content-Type: application/json' \
              --data @/tmp/b.json "$BASE/env-vars/$1")
            echo "PUT $1 -> HTTP $h"; test "$h" -ge 200 -a "$h" -lt 300 || { cat /tmp/rr.json; return 1; }
          }

          echo "=== STEP 1: Copy DB creds -> SPRING_FLYWAY_USER / SPRING_FLYWAY_PASSWORD ==="
          DB_USER="$(fv DATABASE_USERNAME)"; DB_PASS="$(fv DATABASE_PASSWORD)"
          echo "::add-mask::$DB_USER"; echo "::add-mask::$DB_PASS"
          [ -n "$DB_USER" ] && [ -n "$DB_PASS" ] || { echo "::error::missing DB creds"; exit 1; }
          put SPRING_FLYWAY_USER "$DB_USER"
          put SPRING_FLYWAY_PASSWORD "$DB_PASS"
          echo "Verify SPRING_FLYWAY_USER present: $([ -n "$(fv SPRING_FLYWAY_USER)" ] && echo yes || echo no)"

          echo ""
          echo "=== STEP 2: Clear orphaned JDBC sessions (release advisory lock) ==="
          DB_URL="$(fv DATABASE_URL)"
          HOST="$(printf '%s\n' "$DB_URL" | sed -E 's#.*://##; s#/.*##; s#:.*##; s#\?.*##')"
          SES_URL="postgresql://$HOST:6543/postgres"; export PGPASSWORD="$DB_PASS"
          echo "advisory locks BEFORE:"; psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -c "SELECT pid, granted FROM pg_locks WHERE locktype='advisory';" || true
          psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -c "SELECT pid, pg_terminate_backend(pid) FROM pg_stat_activity WHERE application_name='PostgreSQL JDBC Driver' AND state IN ('idle','idle in transaction') AND pid <> pg_backend_pid();" || true
          sleep 3
          echo "advisory locks AFTER:"; psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -c "SELECT count(*) FROM pg_locks WHERE locktype='advisory';" || true

          echo ""
          echo "=== STEP 3: Deploy + poll until LIVE ==="
          HTTP=$(curl -s -o /tmp/d.json -w "%{http_code}" --max-time 30 -X POST "$BASE/deploys" \
            -H "$AUTH" -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"clearCache":"do_not_clear"}')
          DEPLOY_ID=$(jq -r '.id // empty' /tmp/d.json); echo "POST /deploys HTTP $HTTP  Deploy ID: $DEPLOY_ID"
          STATUS="unknown"
          for i in $(seq 1 95); do
            sleep 15
            STATUS=$(curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/deploys/$DEPLOY_ID" | jq -r '.status // "unknown"')
            echo "  Attempt $i ($((i*15))s): $STATUS"
            [ "$STATUS" = "live" ] && { echo "::notice::DEPLOY LIVE"; break; }
            echo "$STATUS" | grep -qiE 'failed|canceled|deactivated' && { echo "::error::terminal $STATUS"; exit 1; }
          done
          [ "$STATUS" = "live" ] || { echo "::error::not LIVE ($STATUS)"; exit 1; }

          echo ""
          echo "=== STEP 4: Health check ==="
          sleep 12
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /tmp/h.json -w "%{http_code}" --max-time 30 https://sanad-backend-mcrj.onrender.com/actuator/health || echo 000)
            B=$(jq -r '.status // empty' /tmp/h.json 2>/dev/null || echo "")
            echo "  Attempt $i: HTTP $CODE status=$B"
            [ "$CODE" = "200" ] && [ "$B" = "UP" ] && { echo "::notice::HEALTHY"; break; }
            sleep 10
          done

          echo ""
          echo "=== STEP 5: Verify G7 tables + flyway_schema_history ==="
          psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -c "SELECT count(*) AS flyway_history_rows FROM public.flyway_schema_history;" || true
          psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('mobile_device_registry','mobile_sync_cursor','mobile_sync_log','mobile_conflict_log') ORDER BY table_name;" || true
          psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -c "SELECT count(*) AS public_tables FROM information_schema.tables WHERE table_schema='public';" || true
