# ============================================================
# SANAD Platform — `pg-acceptance` TEST profile
# ------------------------------------------------------------
# THIS PROFILE LIVES IN src/test/resources AND IS NOT PACKAGED
# INTO THE PRODUCTION JAR / DOCKER IMAGE.
# (PG_ACCEPTANCE_PROFILE_NOT_PACKAGED_IN_PRODUCTION=PASS)
#
# Used exclusively by CommerceOrderPostgresConcurrencyTest to
# run PostgreSQL-direct concurrency certification against a
# dedicated ISOLATED acceptance database — NEVER against the
# production Supabase / Render managed database.
# (PG_ACCEPTANCE_DB_ISOLATED=PASS, PRODUCTION_DB_TARGET_GUARD=PASS)
#
# Dedicated credentials are required — the profile does NOT
# fall back to DATABASE_URL / SPRING_DATASOURCE_URL /
# DATABASE_USERNAME / DATABASE_PASSWORD. A fail-fast guard
# (PgAcceptanceDatabaseGuard) aborts startup if the configured
# JDBC URL matches the production database host / database
# name.
# ============================================================

spring:
  datasource:
    # Dedicated acceptance credentials ONLY — no fallback to prod env vars.
    url: ${PG_ACCEPTANCE_JDBC_URL:}
    username: ${PG_ACCEPTANCE_USERNAME:}
    password: ${PG_ACCEPTANCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: "classpath:db/migration,classpath:db/vendor/postgresql"
    baseline-on-migrate: true
    clean-disabled: true
    validate-on-migrate: true
    out-of-order: false

  h2:
    console:
      enabled: false

# RLS is ENABLED for the pg-acceptance profile so that
# TenantRlsDataSourcePostProcessor wraps the DataSource and
# TenantRlsConnectionHandler applies SET LOCAL app.tenant_id
# inside @Transactional service boundaries (the canonical RLS
# pattern used by all production code paths).
#
# The test class installs a tenant-aware SecurityContext
# (via RlsTestSupport.setSecurityContext) before each
# checkoutService.checkout(...) call so that the GUC is set
# correctly for the FORCE-RLS commerce_order_number_sequences
# INSERT. Fixture INSERTs into ENABLE-RLS (non-FORCE) tables
# (tenants, commerce_stores, etc.) continue to work because
# sanad is the table owner and ENABLE RLS does not apply to
# the owner.
#
# PRODUCTION_RLS_NEVER_DISABLED=PASS — the prod profile never
# disables RLS; this test profile now MATCHES production RLS
# semantics rather than the previous invalid assumption that
# sanad.rls.enabled=false would disable DB-level FORCE RLS
# (it cannot — FORCE RLS is enforced at the PostgreSQL level
# regardless of any Spring config flag).
sanad:
  security:
    jwt:
      secret: ${JWT_SECRET:}
  rls:
    enabled: true
  commerce:
    payment:
      # Activate SimulatedPaymentAdapter for the pg-acceptance profile
      # so the concurrency tests exercise the full payment side-effect
      # path (createPaymentIntent → verifyPayment → payment_ref status
      # history row). The production-safe default remains
      # DefaultNoOpPaymentAdapter (returns null → PENDING order) when
      # no provider is configured. This setting is TEST-ONLY — it lives
      # in src/test/resources and is NOT packaged into production.
      # (SIMULATED_PAYMENT_ACTIVE_IN_PROD=NO — prod never sets this.)
      provider: simulated

logging:
  level:
    root: INFO
    com.sanad.platform: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
