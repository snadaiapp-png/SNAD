# ============================================================
# SNAD Platform — `perf-test` profile
# ------------------------------------------------------------
# Deterministic PostgreSQL performance-test environment used by CRM-033.
# NEVER used in production. The CI workflow migrates its isolated PostgreSQL
# database before web startup; the web runtime itself keeps Flyway disabled.
# ============================================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${PERF_TEST_DB_POOL_MAX:40}
      minimum-idle: ${PERF_TEST_DB_POOL_MIN:10}
      connection-timeout: 30000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

sanad:
  security:
    jwt:
      secret: ${PERF_TEST_JWT_SECRET:${JWT_SECRET:}}
  crm:
    import-worker-enabled: false
    custom-field-encryption-key: ${CRM_CUSTOM_FIELD_ENCRYPTION_KEY:}
  rls:
    enabled: false

logging:
  level:
    root: INFO
    com.sanad.platform: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
