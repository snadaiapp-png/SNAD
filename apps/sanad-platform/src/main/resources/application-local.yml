# ============================================================
# SANAD Platform — `local` profile
# ------------------------------------------------------------
# Activated with: --spring.profiles.active=local
#                or SPRING_PROFILES_ACTIVE=local
#
# Used for developer laptops and for automated backend integration
# tests. The local profile now uses PostgreSQL Direct (the same
# engine used in production and in CI) so that FORCE RLS, gen_random_uuid,
# JSONB, PL/pgSQL triggers, and partial indexes are exercised under
# their real runtime semantics. H2 is no longer used as a backend
# acceptance runtime.
#
# A disposable PostgreSQL 16 instance must be running on
# localhost:5432 with database `sanad` accessible to role `sanad`
# (same version and contract as the CI postgres:16-alpine service).
# ============================================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sanad}
    username: ${SPRING_DATASOURCE_USERNAME:sanad}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway stays enabled so local and integration tests exercise the
  # complete migration chain, including vendor-specific migrations.
  flyway:
    enabled: true
    locations: "classpath:db/migration,classpath:db/vendor/{vendor}"
    baseline-on-migrate: true
    clean-disabled: false
    validate-on-migrate: false

sanad:
  security:
    jwt:
      # No committed secret — JwtTokenProvider generates an ephemeral HMAC key
      # at startup when the secret is empty. This is safe for local development
      # because tokens are not shared across restarts or between machines.
      # Production must set JWT_SECRET via environment variable.
      secret: ${JWT_SECRET:}
  crm:
    # Tests invoke the import worker explicitly to avoid scheduler races.
    import-worker-enabled: false
    # CRM-032 HIGH-01 remediation: no committed key default. When unset in a
    # non-production environment, CrmEncryptionKeyValidator generates an
    # ephemeral random AES-256 key at startup (same pattern as JwtTokenProvider).
    # The well-known test key is rejected unconditionally. Production must set
    # CRM_CUSTOM_FIELD_ENCRYPTION_KEY through the deployment secret manager.
    custom-field-encryption-key: ${CRM_CUSTOM_FIELD_ENCRYPTION_KEY:}
  # Row-Level Security — enabled in local profile now that PostgreSQL Direct
  # is the backend runtime. FORCE RLS + fail-closed policies are exercised
  # under their real semantics. Tests that need to write to FORCE-RLS tables
  # must establish a transaction-local tenant GUC via TenantRlsTransactionContext
  # or set SecurityContextHolder so TenantRlsConnectionHandler applies
  # SET LOCAL app.tenant_id automatically.
  rls:
    enabled: true

logging:
  level:
    root: INFO
    com.sanad.platform: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,beans,env,loggers,metrics

springdoc:
  swagger-ui:
    enabled: true
