# ============================================================
# SANAD Platform — `pg-acceptance` profile
# ------------------------------------------------------------
# Used by CommerceOrderPostgresConcurrencyTest and other
# PostgreSQL-direct acceptance tests. Activated with:
#   SPRING_PROFILES_ACTIVE=pg-acceptance
#
# Requires a real PostgreSQL instance. The JDBC URL is read
# from the same env vars as the prod profile (DATABASE_URL /
# SPRING_DATASOURCE_URL) so the same Supabase / Render managed
# instance can be pointed at for production-grade concurrency
# certification.
#
# This profile MUST NOT be used in production runtime. It is
# a test-only profile that disables RLS (to allow test
# fixtures to seed tenants without escalating privileges) and
# uses HBM create-drop semantics off (validate) so that the
# Flyway-managed schema is the source of truth.
# ============================================================

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: "classpath:db/migration,classpath:db/vendor/postgresql"
    baseline-on-migrate: true
    clean-disabled: true
    validate-on-migrate: true
    out-of-order: false

  # H2 console disabled — we are on PostgreSQL
  h2:
    console:
      enabled: false

sanad:
  security:
    jwt:
      secret: ${JWT_SECRET:}
  rls:
    # RLS is disabled for the pg-acceptance profile so test
    # fixtures can seed cross-tenant data. The tenant-isolation
    # logic is still enforced at the application layer
    # (SecurityContextUtils.tenantId(auth)).
    enabled: false

logging:
  level:
    root: INFO
    com.sanad.platform: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
