name: INSERT INTO ALL DBs

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "all" to confirm'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  insert-all:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    if: github.event.inputs.confirm == 'all'
    steps:
      - name: Install JDK + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jdk
          pip3 install psycopg2-binary

      - name: Download jars
        run: |
          curl -sS -L -o /tmp/spring-security-crypto.jar "https://repo1.maven.org/maven2/org/springframework/security/spring-security-crypto/6.3.1/spring-security-crypto-6.3.1.jar"
          curl -sS -L -o /tmp/spring-jcl.jar "https://repo1.maven.org/maven2/org/springframework/spring-jcl/6.1.6/spring-jcl-6.1.6.jar"

      - name: Generate Spring Security BCrypt hash
        id: hash
        run: |
          python3 -c "
          with open('/tmp/GenHash.java', 'w') as f:
              f.write('import org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;\n')
              f.write('public class GenHash {\n')
              f.write('    public static void main(String[] args) {\n')
              f.write('        BCryptPasswordEncoder encoder = new BCryptPasswordEncoder(10);\n')
              f.write('        String hash = encoder.encode(\"SNad@2026\");\n')
              f.write('        System.out.println(hash);\n')
              f.write('    }\n')
              f.write('}\n')
          "
          javac -cp /tmp/spring-security-crypto.jar:/tmp/spring-jcl.jar /tmp/GenHash.java -d /tmp/
          HASH=$(java -cp /tmp:/tmp/spring-security-crypto.jar:/tmp/spring-jcl.jar GenHash)
          echo "Hash: $HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Suspend backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Suspend: %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/suspend" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" || true
          sleep 15

      - name: Insert into ALL databases
        env:
          PROD_JDBC_URL: ${{ secrets.PROD_JDBC_URL }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          PRODUCTION_DATABASE_JDBC_URL: ${{ secrets.PRODUCTION_DATABASE_JDBC_URL }}
          PRODUCTION_DATABASE_USERNAME: ${{ secrets.PRODUCTION_DATABASE_USERNAME }}
          PRODUCTION_DATABASE_PASSWORD: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import psycopg2, os, sys

          hash_val = os.environ['HASH']
          admin_email = 'admin@snad.ai'
          tenant_id = '958bbb1c-eece-4839-bca8-a5bfa14e6ac1'

          # List of databases to try
          databases = [
              ("PROD_JDBC_URL", os.environ.get('PROD_JDBC_URL', ''), os.environ.get('PROD_DB_USER', ''), os.environ.get('PROD_DB_PASSWORD', '')),
              ("SPRING_DATASOURCE_URL", os.environ.get('SPRING_DATASOURCE_URL', ''), os.environ.get('SPRING_DATASOURCE_USERNAME', ''), os.environ.get('PROD_DB_PASSWORD', '')),
              ("PRODUCTION_DATABASE_JDBC_URL", os.environ.get('PRODUCTION_DATABASE_JDBC_URL', ''), os.environ.get('PRODUCTION_DATABASE_USERNAME', ''), os.environ.get('PRODUCTION_DATABASE_PASSWORD', '')),
              ("RENDER_DB", "jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require", "postgres.hxhvfqxzigrqoxxnnzje", "Senen@001985"),
          ]

          for name, jdbc_url, db_user, db_pass in databases:
              if not jdbc_url or not db_user:
                  print(f"\n{name}: SKIP (missing credentials)", file=sys.stderr)
                  continue

              print(f"\n=== {name} ===", file=sys.stderr)
              print(f"  URL: {jdbc_url[:50]}...", file=sys.stderr)
              print(f"  User: {db_user}", file=sys.stderr)

              conn_str = jdbc_url.replace('jdbc:postgresql://', '')
              host_port = conn_str.split('/')[0]
              host = host_port.split(':')[0]
              port = host_port.split(':')[1] if ':' in host_port else '5432'
              db_name = conn_str.split('/')[1].split('?')[0] if '/' in conn_str else 'postgres'

              try:
                  conn = psycopg2.connect(host=host, port=port, dbname=db_name,
                                          user=db_user, password=db_pass, sslmode='require',
                                          connect_timeout=10)
                  cur = conn.cursor()

                  # Check if users table exists
                  cur.execute("SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='users'")
                  has_users = cur.fetchone()[0]

                  if not has_users:
                      print(f"  No users table! Tables:", file=sys.stderr)
                      cur.execute("SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename LIMIT 10")
                      tables = [r[0] for r in cur.fetchall()]
                      print(f"  {tables}", file=sys.stderr)
                      cur.close()
                      conn.close()
                      continue

                  # Check existing user
                  cur.execute("SELECT id, email, status, length(password_hash) FROM public.users WHERE email = %s", (admin_email,))
                  existing = cur.fetchone()
                  print(f"  Existing: {existing}", file=sys.stderr)

                  # Update password
                  cur.execute("UPDATE public.users SET password_hash = %s, status = 'ACTIVE', updated_at = CURRENT_TIMESTAMP WHERE email = %s",
                              (hash_val, admin_email))
                  print(f"  Updated: {cur.rowcount} rows", file=sys.stderr)

                  # If no user exists, create one
                  if cur.rowcount == 0:
                      # Create tenant if needed
                      cur.execute("INSERT INTO public.tenants (id, name, subdomain, status, created_at, updated_at) SELECT %s::uuid, 'SNAD', 'control', 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP WHERE NOT EXISTS (SELECT 1 FROM public.tenants WHERE id = %s::uuid)", (tenant_id, tenant_id))
                      # Create ADMIN role if needed
                      cur.execute("INSERT INTO public.roles (id, tenant_id, code, name, status, created_at, updated_at) SELECT gen_random_uuid(), %s::uuid, 'ADMIN', 'Admin', 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP WHERE NOT EXISTS (SELECT 1 FROM public.roles WHERE tenant_id = %s::uuid AND code = 'ADMIN')", (tenant_id, tenant_id))
                      # Create user
                      cur.execute("INSERT INTO public.users (id, tenant_id, email, display_name, status, password_hash, created_at, updated_at) SELECT gen_random_uuid(), %s::uuid, %s, 'Admin', 'ACTIVE', %s, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP WHERE NOT EXISTS (SELECT 1 FROM public.users WHERE email = %s)", (tenant_id, admin_email, hash_val, admin_email))
                      print(f"  Created: {cur.rowcount} rows", file=sys.stderr)
                      # Assign role
                      cur.execute("INSERT INTO public.user_role_assignments (id, tenant_id, user_id, role_id, organization_id, status, created_at, updated_at) SELECT gen_random_uuid(), u.tenant_id, u.id, r.id, NULL, 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP FROM public.users u JOIN public.roles r ON r.tenant_id = u.tenant_id AND r.code = 'ADMIN' WHERE u.email = %s AND NOT EXISTS (SELECT 1 FROM public.user_role_assignments ura WHERE ura.user_id = u.id AND ura.role_id = r.id)", (admin_email,))
                      print(f"  Role assigned: {cur.rowcount} rows", file=sys.stderr)

                  conn.commit()
                  cur.close()
                  conn.close()
                  print(f"  ✓ Done!", file=sys.stderr)

              except Exception as e:
                  print(f"  ERROR: {e}", file=sys.stderr)
                  try:
                      cur.close()
                      conn.close()
                  except:
                      pass
          PYEOF

      - name: Resume backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Resume: %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/resume" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" || true

      - name: Wait for health + warmup
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://sanad-backend-mcrj.onrender.com/actuator/health" 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then echo "UP!"; break; fi
            sleep 10
          done
          echo "Waiting 90s for warmup..."
          sleep 90

      - name: Test login
        run: |
          for i in 1 2 3 4 5; do
            RESULT=$(curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
              -H "Content-Type: application/json" \
              -d '{"email":"admin@snad.ai","password":"SNad@2026"}' \
              -w "\n%{http_code}" 2>/dev/null || echo "timeout\n000")
            CODE=$(echo "$RESULT" | tail -1)
            echo "Login $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "🎉 LOGIN SUCCESSFUL!"; exit 0; fi
            sleep 30
          done
          echo "❌ Login failed"
