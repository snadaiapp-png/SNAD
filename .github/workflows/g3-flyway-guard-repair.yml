name: G3 Flyway Guard Repair

on:
  push:
    branches:
      - feat/workflow-y2-task16-typed-api

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: feat/workflow-y2-task16-typed-api
          fetch-depth: 0

      - name: Patch Flyway inventory guards fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Canonical ordered Flyway history inventory.
          p = Path('apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmFlywayHistoryAssertionTest.java')
          s = p.read_text()
          old = '            , "20260906.1"   // workflow task 15 remediation (T15-D1): notification intent dedup unique index\n    );'
          new = '            , "20260906.1"   // workflow task 15 remediation (T15-D1): notification intent dedup unique index\n            , "20260908.1"   // workflow incident optimistic lock\n    );'
          if s.count(old) != 1:
              raise SystemExit(f'FAIL_CLOSED: expected exactly one terminal history anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new))

          # 2) CRM foundation terminal version pin.
          p = Path('apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/Crm008bFoundationAcceptanceTest.java')
          s = p.read_text()
          old = 'private static final String CRM_LATEST_VERSION = "20260906.1";'
          new = 'private static final String CRM_LATEST_VERSION = "20260908.1";'
          if s.count(old) != 1:
              raise SystemExit(f'FAIL_CLOSED: expected exactly one CRM latest-version anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new))

          # 3) Staged migration inventory and terminal constant.
          p = Path('apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmPostgresMigrationTest.java')
          s = p.read_text()
          old_const = '    private static final String WF_NOTIFICATION_DEDUP_VERSION = "20260906.1";\n    private static final String LATEST_MIGRATION_VERSION = WF_NOTIFICATION_DEDUP_VERSION;'
          new_const = '    private static final String WF_NOTIFICATION_DEDUP_VERSION = "20260906.1";\n    private static final String WORKFLOW_INCIDENT_OPTIMISTIC_LOCK_VERSION = "20260908.1";\n    private static final String LATEST_MIGRATION_VERSION = WORKFLOW_INCIDENT_OPTIMISTIC_LOCK_VERSION;'
          if s.count(old_const) != 1:
              raise SystemExit(f'FAIL_CLOSED: expected exactly one migration terminal constant anchor, found {s.count(old_const)}')
          s = s.replace(old_const, new_const)

          old_tail = '                        MigrationVersion.fromVersion(WF_NOTIFICATION_DEDUP_VERSION));'
          new_tail = '                        MigrationVersion.fromVersion(WF_NOTIFICATION_DEDUP_VERSION),\n                        MigrationVersion.fromVersion(WORKFLOW_INCIDENT_OPTIMISTIC_LOCK_VERSION));'
          if s.count(old_tail) != 2:
              raise SystemExit(f'FAIL_CLOSED: expected exactly two staged-upgrade tails, found {s.count(old_tail)}')
          s = s.replace(old_tail, new_tail)
          p.write_text(s)
          PY

          # The helper is transient and must not remain in the product branch.
          git rm .github/workflows/g3-flyway-guard-repair.yml

          # Fail closed on scope: exactly the three guard tests plus self-deletion.
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/g3-flyway-guard-repair.yml' \
            'apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/Crm008bFoundationAcceptanceTest.java' \
            'apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmFlywayHistoryAssertionTest.java' \
            'apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmPostgresMigrationTest.java' | sort)"
          test "$changed" = "$expected" || { echo 'FAIL_CLOSED: unexpected changed-file set'; printf 'ACTUAL:\n%s\nEXPECTED:\n%s\n' "$changed" "$expected"; exit 1; }

          grep -q '"20260908.1"   // workflow incident optimistic lock' apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmFlywayHistoryAssertionTest.java
          grep -q 'CRM_LATEST_VERSION = "20260908.1"' apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/Crm008bFoundationAcceptanceTest.java
          grep -q 'WORKFLOW_INCIDENT_OPTIMISTIC_LOCK_VERSION = "20260908.1"' apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmPostgresMigrationTest.java

      - name: Commit surgical guard repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'snad-g3-closure-bot'
          git config user.email 'snad.ai.app@gmail.com'
          git add -A
          git commit -m 'test(migrations): track workflow incident lock migration'
          git push origin HEAD:feat/workflow-y2-task16-typed-api
