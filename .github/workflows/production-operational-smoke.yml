name: Production Operational Smoke

on:
  workflow_run:
    workflows: ["Vercel Main Production Reconcile"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-operational-smoke-main
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Production Live Route Gate
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      PRODUCTION_WEB_BASE_URL: ${{ vars.WEB_PRODUCTION_BASE_URL || 'https://snad-app.vercel.app' }}

    steps:
      - name: Checkout reconciled exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify reconciled SHA is still current main
        id: current_main
        shell: bash
        run: |
          set -euo pipefail
          echo "superseded=false" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA" || {
            echo "::error::PRODUCTION_SMOKE_CHECKOUT_SHA_MISMATCH expected=$TARGET_SHA actual=$(git rev-parse HEAD)"
            exit 1
          }

          remote_main="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')"
          if [ "$remote_main" != "$TARGET_SHA" ]; then
            echo "PRODUCTION_SMOKE_SUPERSEDED reconciled_sha=$TARGET_SHA current_main=$remote_main"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "PRODUCTION_SMOKE_TARGET_SHA=$TARGET_SHA"

      - name: Mint GitHub OIDC token for protected Vercel probes
        if: steps.current_main.outputs.superseded != 'true'
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Verify production alias exact release identity
        if: steps.current_main.outputs.superseded != 'true'
        shell: bash
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          release_file="$RUNNER_TEMP/production-release.json"
          observed_sha=""
          observed_ref=""
          observed_env=""
          observed_status=""

          for attempt in $(seq 1 12); do
            observed_status="$(curl --silent --show-error --location --max-time 20 \
              --output "$release_file" \
              --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
              "$PRODUCTION_WEB_BASE_URL/api/system/release" || true)"

            if [ "$observed_status" = "200" ]; then
              observed_sha="$(jq -r '.commitSha // empty' "$release_file")"
              observed_ref="$(jq -r '.commitRef // empty' "$release_file")"
              observed_env="$(jq -r '.environment // empty' "$release_file")"
              echo "attempt=$attempt status=$observed_status sha=$observed_sha ref=$observed_ref env=$observed_env"

              if [ "$observed_sha" = "$TARGET_SHA" ] && [ "$observed_ref" = "main" ]; then
                case "$observed_env" in
                  production|prod)
                    echo "Production alias matches the reconciled exact main SHA."
                    exit 0
                    ;;
                esac
              fi
            else
              echo "attempt=$attempt release-http-status=$observed_status"
            fi

            sleep 5
          done

          echo "::error::PRODUCTION_RELEASE_IDENTITY_MISMATCH expected_sha=$TARGET_SHA actual_sha=${observed_sha:-none} actual_ref=${observed_ref:-none} actual_env=${observed_env:-none}"
          exit 1

      - name: Capture production route diagnostics
        if: steps.current_main.outputs.superseded != 'true'
        shell: bash
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/production-route-diagnostics"
          for path in / /hr/employees /hr/assignments /hr/performance/goals /hr/performance/reviews; do
            slug="$(printf '%s' "$path" | sed 's#^/##; s#[^A-Za-z0-9._-]#-#g')"
            [ -n "$slug" ] || slug=root
            headers="$RUNNER_TEMP/production-route-diagnostics/$slug.headers"
            body="$RUNNER_TEMP/production-route-diagnostics/$slug.body"
            status="$(curl --silent --show-error --location --max-time 30 \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
              "$PRODUCTION_WEB_BASE_URL$path" || true)"
            echo "=== ROUTE $path HTTP $status ==="
            grep -Ei '^(server:|content-type:|cache-control:|x-vercel-|x-matched-path:|x-nextjs-|location:)' "$headers" || true
          done

      - name: Verify production HRM G3 routes
        if: steps.current_main.outputs.superseded != 'true'
        shell: bash
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check-production-readiness.py \
            --frontend-routes-only \
            --attempts 6 \
            --delay-seconds 5 \
            --timeout-seconds 20 \
            --production-url "$PRODUCTION_WEB_BASE_URL" \
            --evidence-file "$RUNNER_TEMP/hrm-g3-production-routes.json"

      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-operational-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/production-release.json
            ${{ runner.temp }}/production-route-diagnostics
            ${{ runner.temp }}/hrm-g3-production-routes.json
          if-no-files-found: warn
          retention-days: 90
