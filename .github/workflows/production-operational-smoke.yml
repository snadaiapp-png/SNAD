name: Production Operational Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-operational-smoke-main
  cancel-in-progress: true

jobs:
  production-smoke:
    name: Production Live Route Gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_WEB_BASE_URL: ${{ vars.WEB_PRODUCTION_BASE_URL || 'https://snad-app.vercel.app' }}

    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable current main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          remote_main="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$GITHUB_SHA" || {
            echo "::error::PRODUCTION_SMOKE_NOT_CURRENT_MAIN expected=$GITHUB_SHA actual=$remote_main"
            exit 1
          }

      - name: Wait for production alias exact release identity
        shell: bash
        run: |
          set -euo pipefail
          release_file="$RUNNER_TEMP/production-release.json"
          observed_sha=""
          observed_ref=""
          observed_env=""
          observed_status=""

          for attempt in $(seq 1 60); do
            observed_status="$(curl --silent --show-error --location --max-time 20 \
              --output "$release_file" \
              --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              "$PRODUCTION_WEB_BASE_URL/api/system/release" || true)"

            if [ "$observed_status" = "200" ]; then
              observed_sha="$(jq -r '.commitSha // empty' "$release_file")"
              observed_ref="$(jq -r '.commitRef // empty' "$release_file")"
              observed_env="$(jq -r '.environment // empty' "$release_file")"
              echo "attempt=$attempt status=$observed_status sha=$observed_sha ref=$observed_ref env=$observed_env"

              if [ "$observed_sha" = "$GITHUB_SHA" ] && [ "$observed_ref" = "main" ]; then
                case "$observed_env" in
                  production|prod)
                    echo "Production alias converged to exact main."
                    exit 0
                    ;;
                esac
              fi
            else
              echo "attempt=$attempt release-http-status=$observed_status"
            fi

            sleep 10
          done

          echo "::error::PRODUCTION_RELEASE_DID_NOT_CONVERGE expected_sha=$GITHUB_SHA actual_sha=${observed_sha:-none} actual_ref=${observed_ref:-none} actual_env=${observed_env:-none}"
          exit 1

      - name: Capture production route diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/production-route-diagnostics"
          for path in / /hr/employees /hr/assignments /hr/performance/goals /hr/performance/reviews; do
            slug="$(printf '%s' "$path" | sed 's#^/##; s#[^A-Za-z0-9._-]#-#g')"
            [ -n "$slug" ] || slug=root
            headers="$RUNNER_TEMP/production-route-diagnostics/$slug.headers"
            body="$RUNNER_TEMP/production-route-diagnostics/$slug.body"
            status="$(curl --silent --show-error --location --max-time 30 \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              "$PRODUCTION_WEB_BASE_URL$path" || true)"
            echo "=== ROUTE $path HTTP $status ==="
            grep -Ei '^(server:|content-type:|cache-control:|x-vercel-|x-matched-path:|x-nextjs-|location:)' "$headers" || true
          done

      - name: Verify production HRM G3 routes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check-production-readiness.py \
            --frontend-routes-only \
            --attempts 6 \
            --delay-seconds 5 \
            --timeout-seconds 20 \
            --production-url "$PRODUCTION_WEB_BASE_URL" \
            --evidence-file "$RUNNER_TEMP/hrm-g3-production-routes.json"

      - name: Upload production smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-operational-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/production-release.json
            ${{ runner.temp }}/production-route-diagnostics
            ${{ runner.temp }}/hrm-g3-production-routes.json
          if-no-files-found: warn
          retention-days: 90
