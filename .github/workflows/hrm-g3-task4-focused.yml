name: HRM G3 Task 4 Focused TDD

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/hr/**'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/hr/**'
      - 'apps/sanad-platform/src/main/resources/db/migration/**'
      - 'docs/hrm/contracts/openapi/**'
      - '.github/workflows/hrm-g3-task4-focused.yml'

permissions:
  contents: read

jobs:
  task4-focused:
    name: HRM G3 Task 4 focused contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: sanad
      SPRING_PROFILES_ACTIVE: default
      FLYWAY_ENABLED: 'true'
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
    defaults:
      run:
        working-directory: apps/sanad-platform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Generate ephemeral PostgreSQL Direct credential
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          test -n "$password"
          echo "::add-mask::$password"
          echo "SPRING_DATASOURCE_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Start PostgreSQL Direct
        run: |
          set -euo pipefail
          sudo systemctl start postgresql
          pg_isready -h 127.0.0.1 -p 5432
          : "${SPRING_DATASOURCE_PASSWORD:?ephemeral PostgreSQL password missing}"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -v sanad_password="$SPRING_DATASOURCE_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE sanad WITH LOGIN PASSWORD %L', :'sanad_password')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad')\gexec
          ALTER ROLE sanad WITH LOGIN PASSWORD :'sanad_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          -- Isolated runner migration preflight (never grant migrator to runtime).
          SELECT 'CREATE ROLE sanad_migrator NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='sanad_migrator')\gexec
          ALTER ROLE sanad_migrator NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;

          -- P0 V20261111_1 (service_callback_replay RLS closure): the chain
          -- requires the dedicated expired-row cleanup role cluster-wide, with a
          -- NON-INHERITING (SET-only) membership for the runtime identity — the
          -- scheduled sweep switches to it inside its own transaction, but the
          -- runtime must never inherit its cross-tenant expired-row visibility.
          SELECT 'CREATE ROLE sanad_callback_replay_cleanup NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad_callback_replay_cleanup')\gexec
          ALTER ROLE sanad_callback_replay_cleanup NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_auth_members m
                             JOIN pg_roles g ON g.oid = m.roleid
                             JOIN pg_roles r ON r.oid = m.member
                            WHERE g.rolname = 'sanad_callback_replay_cleanup'
                              AND r.rolname = 'sanad') THEN
              GRANT sanad_callback_replay_cleanup TO sanad WITH INHERIT FALSE;
            END IF;
          END $$;

          DO $migration_guard$
          BEGIN
            IF pg_has_role('sanad', 'sanad_migrator', 'MEMBER') THEN
              RAISE EXCEPTION 'CI_ROLE_SEPARATION_FAILED: sanad inherits migrator';
            END IF;
          END $migration_guard$;
          SELECT 'CREATE DATABASE sanad OWNER sanad'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'sanad')\gexec
          SELECT 'CREATE DATABASE test_migration OWNER sanad'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'test_migration')\gexec
          GRANT CONNECT ON DATABASE postgres TO sanad;
          \c sanad
          GRANT USAGE, CREATE ON SCHEMA public TO sanad;
          \c test_migration
          GRANT USAGE, CREATE ON SCHEMA public TO sanad;
          SQL
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run Task 4 RED/GREEN contract
        run: |
          mvn test -B -ntp -Dsurefire.useFile=false -DfailIfNoTests=true \
            -Dtest='HrApiV2AuthorizationTest,HrG3OpenApiContractTest,HrG3PerformanceControllerTest,HrG3AuthorizationScopeTest,HrEmploymentScopeResolverPostgresTest'
      - name: Generate runtime HR OpenAPI evidence and verify committed contract
        run: |
          set -euo pipefail
          mvn test -B -ntp -Dsurefire.useFile=false -DfailIfNoTests=true \
            -Dtest='HrOpenApiContractTest' -Dhrm.openapi.generate=true
          cp ../../docs/hrm/contracts/openapi/hrm-openapi.json /tmp/hrm-openapi-runtime.json
          echo '---HRM_OPENAPI_ARTIFACT_BEGIN---'
          cat /tmp/hrm-openapi-runtime.json
          echo '---HRM_OPENAPI_ARTIFACT_END---'
          git restore ../../docs/hrm/contracts/openapi/hrm-openapi.json
          mvn test -B -ntp -Dsurefire.useFile=false -DfailIfNoTests=true \
            -Dtest='HrOpenApiContractTest'
