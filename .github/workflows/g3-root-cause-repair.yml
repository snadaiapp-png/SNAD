name: G3 Root Cause Repair

on:
  push:
    branches:
      - feat/hrm-g3-performance-reviews-goals
    paths:
      - '.github/workflows/g3-root-cause-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hrm-g3-performance-reviews-goals
          fetch-depth: 0

      - name: Apply evidence-driven G3 repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # 1) Migration: enforce tenant-safe canonical Person -> Employment binding.
          migration = Path('apps/sanad-platform/src/main/resources/db/migration/V20260930_1__hr_g3_performance_goals_foundation.sql')
          migration.write_text('''-- HRM G3 — first GREEN slice only: performance goals persistence.\n-- PostgreSQL Direct. No Docker/Testcontainers.\n-- Scope intentionally limited to the G3 performance-goal persistence contracts.\n--\n-- Canonical identity invariant:\n--   goal.tenant_id + goal.employment_id + goal.person_id must resolve to the\n--   same canonical hr_employees row. This prevents cross-tenant references and\n--   prevents attaching a goal to a Person different from the Employment owner.\n\n-- hr_employees already has a tenant-safe (tenant_id, id) unique index. G3 needs\n-- the Person binding in the FK target as well, so add the exact additive target\n-- required by the canonical relationship.\nCREATE UNIQUE INDEX IF NOT EXISTS uq_hr_employees_tenant_id_person\n    ON hr_employees (tenant_id, id, person_id);\n\nCREATE TABLE hr_performance_goals (\n    id              UUID         NOT NULL DEFAULT gen_random_uuid(),\n    tenant_id       UUID         NOT NULL,\n    person_id       UUID         NOT NULL,\n    employment_id   UUID         NOT NULL,\n    title           VARCHAR(255) NOT NULL,\n    metric          VARCHAR(128) NOT NULL,\n    target_value    VARCHAR(255) NOT NULL,\n    progress        INTEGER      NOT NULL DEFAULT 0,\n    status          VARCHAR(32)  NOT NULL DEFAULT 'DRAFT',\n    starts_on       DATE         NOT NULL,\n    ends_on         DATE         NOT NULL,\n    created_at      TIMESTAMPTZ  NOT NULL DEFAULT NOW(),\n    updated_at      TIMESTAMPTZ  NOT NULL DEFAULT NOW(),\n\n    CONSTRAINT pk_hr_performance_goals PRIMARY KEY (id),\n    CONSTRAINT fk_hr_performance_goals_tenant\n        FOREIGN KEY (tenant_id) REFERENCES tenants (id),\n    CONSTRAINT fk_hr_performance_goals_canonical_employment\n        FOREIGN KEY (tenant_id, employment_id, person_id)\n        REFERENCES hr_employees (tenant_id, id, person_id),\n    CONSTRAINT ck_hr_performance_goals_progress\n        CHECK (progress BETWEEN 0 AND 100),\n    CONSTRAINT ck_hr_performance_goals_period\n        CHECK (ends_on >= starts_on)\n);\n\nCREATE INDEX ix_hr_performance_goals_tenant_employment\n    ON hr_performance_goals (tenant_id, employment_id);\n\nCREATE INDEX ix_hr_performance_goals_tenant_person\n    ON hr_performance_goals (tenant_id, person_id);\n\nALTER TABLE hr_performance_goals ENABLE ROW LEVEL SECURITY;\nALTER TABLE hr_performance_goals FORCE ROW LEVEL SECURITY;\n\nCREATE POLICY tenant_isolation ON hr_performance_goals FOR ALL\n    USING (tenant_id = NULLIF(current_setting('app.tenant_id', true), '')::uuid)\n    WITH CHECK (tenant_id = NULLIF(current_setting('app.tenant_id', true), '')::uuid);\n''')

          # 2) G3 PostgreSQL contract: no external seed dependency; prove both
          # tenant isolation and canonical Person/Employment mismatch rejection.
          g3 = Path('apps/sanad-platform/src/test/java/com/sanad/platform/hr/performance/HrG3PostgresIntegrationTest.java')
          g3.write_text(r'''package com.sanad.platform.hr.performance;

import org.junit.jupiter.api.Assumptions;
import org.junit.jupiter.api.BeforeAll;
import org.junit.jupiter.api.Test;
import org.junit.jupiter.api.TestInstance;
import org.springframework.jdbc.datasource.DriverManagerDataSource;

import javax.sql.DataSource;
import java.sql.Connection;
import java.sql.PreparedStatement;
import java.sql.ResultSet;
import java.sql.SQLException;
import java.sql.Statement;
import java.util.UUID;

import static org.assertj.core.api.Assertions.assertThat;
import static org.assertj.core.api.Assertions.assertThatThrownBy;

/**
 * HRM-G3 PostgreSQL Direct contract.
 *
 * <p>Runs against host-native PostgreSQL only. The fixture is self-contained:
 * every test creates its own tenant + canonical Person/Employment graph, so a
 * missing external seed can never turn a security assertion into SKIPPED.
 */
@TestInstance(TestInstance.Lifecycle.PER_CLASS)
class HrG3PostgresIntegrationTest {

    private static final String DB_URL = System.getenv().getOrDefault(
            "SPRING_DATASOURCE_URL", "jdbc:postgresql://localhost:5432/sanad");
    private static final String DB_USER = System.getenv().getOrDefault(
            "SPRING_DATASOURCE_USERNAME", "sanad");
    private static final String DB_PASSWORD = System.getenv().getOrDefault(
            "SPRING_DATASOURCE_PASSWORD", "");

    @BeforeAll
    void requirePostgres() {
        Assumptions.assumeTrue(
                System.getenv("SPRING_DATASOURCE_URL") != null
                        || "sanad".equals(System.getenv().getOrDefault("SPRING_DATASOURCE_USERNAME", "")),
                "PostgreSQL Direct tests require SPRING_DATASOURCE_URL"
        );
    }

    @Test
    void foreignTenantCannotReadPerformanceGoal() throws Exception {
        DataSource ds = new DriverManagerDataSource(DB_URL, DB_USER, DB_PASSWORD);
        try (Connection conn = ds.getConnection()) {
            assertThat(tableExists(conn, "hr_performance_goals"))
                    .as("G3 must create hr_performance_goals before tenant isolation can be certified")
                    .isTrue();

            UUID tenantA = UUID.randomUUID();
            UUID tenantB = UUID.randomUUID();
            seedTenant(conn, tenantA);
            seedTenant(conn, tenantB);

            setTenant(conn, tenantA);
            UUID personId = seedPerson(conn, tenantA, "Tenant", "A");
            UUID legalEntityId = seedLegalEntity(conn, tenantA);
            UUID employmentId = seedEmployment(conn, tenantA, personId, legalEntityId);

            UUID goalId = UUID.randomUUID();
            insertGoal(conn, goalId, tenantA, personId, employmentId);

            setTenant(conn, tenantB);
            try (PreparedStatement query = conn.prepareStatement(
                    "SELECT COUNT(*) FROM hr_performance_goals WHERE id = ?")) {
                query.setObject(1, goalId);
                try (ResultSet rs = query.executeQuery()) {
                    rs.next();
                    assertThat(rs.getInt(1))
                            .as("A foreign tenant must never see another tenant's performance goal")
                            .isZero();
                }
            }
        }
    }

    @Test
    void goalRequiresCanonicalEmployment() throws Exception {
        DataSource ds = new DriverManagerDataSource(DB_URL, DB_USER, DB_PASSWORD);
        try (Connection conn = ds.getConnection()) {
            assertThat(tableExists(conn, "hr_performance_goals"))
                    .as("G3 goal persistence must exist before canonical-employment enforcement can be certified")
                    .isTrue();

            UUID tenantId = UUID.randomUUID();
            seedTenant(conn, tenantId);
            setTenant(conn, tenantId);

            UUID employmentOwner = seedPerson(conn, tenantId, "Employment", "Owner");
            UUID differentPerson = seedPerson(conn, tenantId, "Different", "Person");
            UUID legalEntityId = seedLegalEntity(conn, tenantId);
            UUID employmentId = seedEmployment(conn, tenantId, employmentOwner, legalEntityId);

            assertThatThrownBy(() -> insertGoal(
                    conn, UUID.randomUUID(), tenantId, differentPerson, employmentId))
                    .as("A goal must not bind an Employment to a different canonical Person")
                    .isInstanceOf(SQLException.class)
                    .extracting(t -> ((SQLException) t).getSQLState())
                    .isEqualTo("23503");
        }
    }

    private void seedTenant(Connection conn, UUID tenantId) throws Exception {
        try (PreparedStatement ps = conn.prepareStatement(
                "INSERT INTO tenants (id, name, subdomain, status, created_at, updated_at) " +
                "VALUES (?, 'G3 Test', ?, 'ACTIVE', NOW(), NOW())")) {
            ps.setObject(1, tenantId);
            ps.setString(2, "g3-" + tenantId.toString().substring(0, 8));
            ps.executeUpdate();
        }
    }

    private UUID seedPerson(Connection conn, UUID tenantId, String firstName, String lastName) throws Exception {
        UUID personId = UUID.randomUUID();
        try (PreparedStatement ps = conn.prepareStatement(
                "INSERT INTO hr_people " +
                "(id, tenant_id, user_id, first_name, last_name, display_name, version, created_at, updated_at) " +
                "VALUES (?, ?, NULL, ?, ?, ?, 0, NOW(), NOW())")) {
            ps.setObject(1, personId);
            ps.setObject(2, tenantId);
            ps.setString(3, firstName);
            ps.setString(4, lastName);
            ps.setString(5, firstName + " " + lastName);
            ps.executeUpdate();
        }
        return personId;
    }

    private UUID seedLegalEntity(Connection conn, UUID tenantId) throws Exception {
        UUID legalEntityId = UUID.randomUUID();
        String code = "G3-" + legalEntityId.toString().substring(0, 8);
        try (PreparedStatement ps = conn.prepareStatement(
                "INSERT INTO legal_entities " +
                "(id, tenant_id, code, name, registered_country_code, statutory_country_code, status, created_at, updated_at) " +
                "VALUES (?, ?, ?, ?, 'SA', 'SA', 'ACTIVE', NOW(), NOW())")) {
            ps.setObject(1, legalEntityId);
            ps.setObject(2, tenantId);
            ps.setString(3, code);
            ps.setString(4, "G3 Legal Entity " + code);
            ps.executeUpdate();
        }
        return legalEntityId;
    }

    private UUID seedEmployment(
            Connection conn,
            UUID tenantId,
            UUID personId,
            UUID legalEntityId) throws Exception {
        UUID employmentId = UUID.randomUUID();
        try (PreparedStatement ps = conn.prepareStatement(
                "INSERT INTO hr_employees " +
                "(id, tenant_id, person_id, legal_entity_id, employee_number, first_name, last_name, display_name, " +
                "employment_type, status, hire_date, version, created_at, updated_at) " +
                "VALUES (?, ?, ?, ?, ?, 'G3', 'Employee', 'G3 Employee', 'FULL_TIME', 'ACTIVE', DATE '2026-01-01', 0, NOW(), NOW())")) {
            ps.setObject(1, employmentId);
            ps.setObject(2, tenantId);
            ps.setObject(3, personId);
            ps.setObject(4, legalEntityId);
            ps.setString(5, "G3-EMP-" + employmentId.toString().substring(0, 8));
            ps.executeUpdate();
        }
        return employmentId;
    }

    private void insertGoal(
            Connection conn,
            UUID goalId,
            UUID tenantId,
            UUID personId,
            UUID employmentId) throws Exception {
        try (PreparedStatement insert = conn.prepareStatement(
                "INSERT INTO hr_performance_goals " +
                "(id, tenant_id, person_id, employment_id, title, metric, target_value, progress, status, starts_on, ends_on) " +
                "VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, CURRENT_DATE, CURRENT_DATE + 30)")) {
            insert.setObject(1, goalId);
            insert.setObject(2, tenantId);
            insert.setObject(3, personId);
            insert.setObject(4, employmentId);
            insert.setString(5, "G3 canonical goal");
            insert.setString(6, "percent");
            insert.setString(7, "100");
            insert.setInt(8, 10);
            insert.setString(9, "ACTIVE");
            insert.executeUpdate();
        }
    }

    private void setTenant(Connection conn, UUID tenantId) throws Exception {
        try (Statement stmt = conn.createStatement()) {
            stmt.execute("SELECT set_config('app.tenant_id', '" + tenantId + "', false)");
        }
    }

    private boolean tableExists(Connection conn, String tableName) throws Exception {
        try (PreparedStatement ps = conn.prepareStatement(
                "SELECT EXISTS (SELECT 1 FROM information_schema.tables " +
                "WHERE table_schema = 'public' AND table_name = ?)")) {
            ps.setString(1, tableName);
            try (ResultSet rs = ps.executeQuery()) {
                rs.next();
                return rs.getBoolean(1);
            }
        }
    }
}
''')

          # 3) Canonical migration ledger guards: the new version is expected and
          # remains ordered between 20260925.2 and the pre-existing 20261001 wave.
          replace_once(
              'apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmFlywayHistoryAssertionTest.java',
              '            , "20260925.2"   // subscription operating units\n            , "20261001.1"',
              '            , "20260925.2"   // subscription operating units\n            , "20260930.1"   // HRM G3 performance goals foundation\n            , "20261001.1"')

          crm = Path('apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmPostgresMigrationTest.java')
          text = crm.read_text()
          old = '    private static final String SUBSCRIPTION_OPERATING_UNITS_VERSION = "20260925.2";\n    private static final String UAC_OVERRIDES_RELATIONSHIPS_EVENTS_VERSION = "20261001.1";'
          new = '    private static final String SUBSCRIPTION_OPERATING_UNITS_VERSION = "20260925.2";\n    private static final String HR_G3_PERFORMANCE_GOALS_VERSION = "20260930.1";\n    private static final String UAC_OVERRIDES_RELATIONSHIPS_EVENTS_VERSION = "20261001.1";'
          if text.count(old) != 1:
              raise SystemExit(f'CrmPostgresMigrationTest constant anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          anchor = '                        MigrationVersion.fromVersion(SUBSCRIPTION_OPERATING_UNITS_VERSION),\n                        MigrationVersion.fromVersion(UAC_OVERRIDES_RELATIONSHIPS_EVENTS_VERSION),'
          count = text.count(anchor)
          if count < 1:
              raise SystemExit('CrmPostgresMigrationTest sequence anchor not found')
          text = text.replace(
              anchor,
              '                        MigrationVersion.fromVersion(SUBSCRIPTION_OPERATING_UNITS_VERSION),\n'
              '                        MigrationVersion.fromVersion(HR_G3_PERFORMANCE_GOALS_VERSION),\n'
              '                        MigrationVersion.fromVersion(UAC_OVERRIDES_RELATIONSHIPS_EVENTS_VERSION),')
          crm.write_text(text)

          # 4) HR RLS inventory: register the new tenant table and provide a real
          # canonical fixture so all positive/wrong/no-context parameterized tests
          # execute against it instead of merely making the inventory assertion pass.
          rls = Path('apps/sanad-platform/src/test/java/com/sanad/platform/hr/rls/HrRlsFailClosedIntegrationTest.java')
          text = rls.read_text()
          old = '                "hr_people",\n                "hr_person_identifiers",'
          new = '                "hr_people",\n                // G3 performance goals — tenant-scoped and canonical Employment-bound.\n                "hr_performance_goals",\n                "hr_person_identifiers",'
          if text.count(old) != 1:
              raise SystemExit(f'HrRls inventory anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          helper_anchor = '    // --- Generic seed dispatch ---\n'
          helper = '''    // --- G3 performance-goal seed helper ---\n\n    private void insertG3PerformanceGoal(UUID tenantId) throws Exception {\n        UUID personId = insertHrPerson(tenantId, "G3", "RLS");\n        UUID legalEntityId = seedLegalEntity(tenantId, "LE-G3-" + UUID.randomUUID().toString().substring(0, 6));\n        UUID employmentId = UUID.randomUUID();\n        try (PreparedStatement ps = conn.prepareStatement(\n                "INSERT INTO hr_employees " +\n                "(id, tenant_id, person_id, legal_entity_id, employee_number, first_name, last_name, display_name, " +\n                "employment_type, status, hire_date, version, created_at, updated_at) " +\n                "VALUES (?, ?, ?, ?, ?, 'G3', 'RLS', 'G3 RLS', 'FULL_TIME', 'ACTIVE', DATE '2026-01-01', 0, NOW(), NOW())")) {\n            ps.setObject(1, employmentId);\n            ps.setObject(2, tenantId);\n            ps.setObject(3, personId);\n            ps.setObject(4, legalEntityId);\n            ps.setString(5, "G3-RLS-" + employmentId.toString().substring(0, 8));\n            ps.executeUpdate();\n        }\n        try (PreparedStatement ps = conn.prepareStatement(\n                "INSERT INTO hr_performance_goals " +\n                "(id, tenant_id, person_id, employment_id, title, metric, target_value, progress, status, starts_on, ends_on) " +\n                "VALUES (?, ?, ?, ?, 'G3 RLS Goal', 'percent', '100', 10, 'ACTIVE', CURRENT_DATE, CURRENT_DATE + 30)")) {\n            ps.setObject(1, UUID.randomUUID());\n            ps.setObject(2, tenantId);\n            ps.setObject(3, personId);\n            ps.setObject(4, employmentId);\n            ps.executeUpdate();\n        }\n    }\n\n'''
          if text.count(helper_anchor) != 1:
              raise SystemExit(f'HrRls helper anchor count={text.count(helper_anchor)}')
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          case_anchor = '            case "hr_people" -> insertHrPerson(tenantId, "RLS", "Test");\n'
          if text.count(case_anchor) != 1:
              raise SystemExit(f'HrRls case anchor count={text.count(case_anchor)}')
          text = text.replace(
              case_anchor,
              case_anchor + '            case "hr_performance_goals" -> insertG3PerformanceGoal(tenantId);\n',
              1)
          rls.write_text(text)
          PY

      - name: Verify patch scope
        shell: bash
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | wc -l)" -eq 5
          git diff -- apps/sanad-platform/src/main/resources/db/migration/V20260930_1__hr_g3_performance_goals_foundation.sql
          git diff -- apps/sanad-platform/src/test/java/com/sanad/platform/hr/performance/HrG3PostgresIntegrationTest.java

      - name: Commit scoped repair
        shell: bash
        run: |
          git config user.name "snad-g3-repair-bot"
          git config user.email "snad.ai.app@gmail.com"
          git add \
            apps/sanad-platform/src/main/resources/db/migration/V20260930_1__hr_g3_performance_goals_foundation.sql \
            apps/sanad-platform/src/test/java/com/sanad/platform/hr/performance/HrG3PostgresIntegrationTest.java \
            apps/sanad-platform/src/test/java/com/sanad/platform/hr/rls/HrRlsFailClosedIntegrationTest.java \
            apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmFlywayHistoryAssertionTest.java \
            apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmPostgresMigrationTest.java
          git commit -m "fix(hrm-g3): enforce canonical goal tenant identity"
          git push origin HEAD:feat/hrm-g3-performance-reviews-goals
