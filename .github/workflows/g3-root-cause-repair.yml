name: G3 Root Cause Repair

on:
  push:
    branches:
      - feat/hrm-g3-performance-reviews-goals
    paths:
      - '.github/workflows/g3-root-cause-repair.yml'
      - '.github/scripts/g3_root_cause_repair.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hrm-g3-performance-reviews-goals
          fetch-depth: 0

      - name: Apply evidence-driven G3 repair
        run: python3 .github/scripts/g3_root_cause_repair.py

      - name: Verify patch scope
        shell: bash
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | wc -l)" -eq 5

      - name: Commit scoped repair
        shell: bash
        run: |
          git config user.name "snad-g3-repair-bot"
          git config user.email "snad.ai.app@gmail.com"
          git add \
            apps/sanad-platform/src/main/resources/db/migration/V20260930_1__hr_g3_performance_goals_foundation.sql \
            apps/sanad-platform/src/test/java/com/sanad/platform/hr/performance/HrG3PostgresIntegrationTest.java \
            apps/sanad-platform/src/test/java/com/sanad/platform/hr/rls/HrRlsFailClosedIntegrationTest.java \
            apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmFlywayHistoryAssertionTest.java \
            apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmPostgresMigrationTest.java
          git commit -m "fix(hrm-g3): enforce canonical goal tenant identity"
          git push origin HEAD:feat/hrm-g3-performance-reviews-goals
