name: G09 Security and Secret Verification

on:
  push:
    branches:
      - exec/subscriptions-r0c13-g09-t2-focused

permissions:
  contents: read

jobs:
  g09-security:
    name: G09 Security and Secret Scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove checked-out SHA
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git rev-parse HEAD
      - name: Baseline-aware Gitleaks gate without containers
        env:
          G09_RED_SHA: 9841ecb2544447e67140735f917994c5399dad74
        run: |
          set -euo pipefail
          chmod +x ./gitleaks
          BASE_DIR="$RUNNER_TEMP/g09-red-tree"
          rm -rf "$BASE_DIR"
          mkdir -p "$BASE_DIR"
          git archive "$G09_RED_SHA" | tar -x -C "$BASE_DIR"

          set +e
          (
            cd "$BASE_DIR"
            "$GITHUB_WORKSPACE/gitleaks" detect --source=. --config=.gitleaks.toml --no-git --redact --report-format=json --report-path="$RUNNER_TEMP/g09-red-gitleaks.json" --exit-code=1
          )
          BASE_STATUS=$?
          (
            cd "$GITHUB_WORKSPACE"
            ./gitleaks detect --source=. --config=.gitleaks.toml --no-git --redact --report-format=json --report-path="$RUNNER_TEMP/g09-head-gitleaks.json" --exit-code=1
          )
          HEAD_STATUS=$?
          HEAD_STATUS=$?
          set -e

          python3 - "$RUNNER_TEMP/g09-red-gitleaks.json" "$RUNNER_TEMP/g09-head-gitleaks.json" <<'PY'
          import json
          import pathlib
          import sys

          def load(path):
              p = pathlib.Path(path)
              return json.loads(p.read_text(encoding="utf-8")) if p.exists() else []

          baseline = load(sys.argv[1])
          head = load(sys.argv[2])

          def key(item):
              return (
                  item.get("RuleID"),
                  item.get("File"),
                  item.get("StartLine"),
                  item.get("EndLine"),
              )

          baseline_keys = {key(item) for item in baseline}
          new_findings = [item for item in head if key(item) not in baseline_keys]

          print(f"G09 RED baseline findings: {len(baseline)}")
          print(f"G09 HEAD findings: {len(head)}")
          print(f"G09 new findings: {len(new_findings)}")
          for item in new_findings:
              print(
                  "NEW finding: "
                  f"RuleID={item.get('RuleID')} "
                  f"File={item.get('File')} "
                  f"StartLine={item.get('StartLine')}"
              )

          if new_findings:
              raise SystemExit(1)
          PY

          echo "Base raw status: $BASE_STATUS"
          echo "Head raw status: $HEAD_STATUS"
          echo "No new G09 secret findings relative to the captured RED baseline."
      - name: Supplemental secret policy regression and scan
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/ci -p 'test_scan_secrets*.py' -v
          python3 -m py_compile scripts/ci/scan_secrets.py
          python3 scripts/ci/scan_secrets.py             --repository-root .             --report "$RUNNER_TEMP/g09-supplemental-secret-scan.json"             --commit-sha "${{ github.sha }}"             --workflow-run-id "${{ github.run_id }}"
      - name: Workflow security policy
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml pytest
          python3 -m pytest             tests/ci/test_workflow_security_policy.py             tests/ci/test_post_merge_collect_all.py             -q
          python3 scripts/ci/check_workflow_security.py > "$RUNNER_TEMP/g09-workflow-security.txt"
      - name: Upload G09 security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g09-security-evidence
          path: |
            ${{ runner.temp }}/g09-red-gitleaks.json
            ${{ runner.temp }}/g09-head-gitleaks.json
            ${{ runner.temp }}/g09-supplemental-secret-scan.json
            ${{ runner.temp }}/g09-workflow-security.txt
          if-no-files-found: warn
          retention-days: 7
