name: SCP Smoke Identity Reconcile

# Forensic + healing tool for the SCP contract smoke identity.
#
# mode=diagnose (default, READ-ONLY): validates the GitHub smoke credentials
# against Render and derives the authoritative control-plane tenant from
# production DB invariants without printing tenant identity data.
#
# mode=reconcile (confirm-gated, SURGICAL): derives exactly one ACTIVE
# platform-admin tenant with an ACTIVE ADMIN role, syncs that masked tenant +
# smoke credentials to Render, invokes the canonical token-gated bootstrap
# endpoint, verifies login, disables bootstrap, redeploys and verifies
# steady-state login.
#
# Dependency ordering (SCP-935 closure): a reconcile that re-runs bootstrap on
# the service's previously configured image re-arms forced rotation when that
# image predates the bootstrap fix. The optional image_ref input therefore lets
# the operator pin the EXACT immutable image (ghcr.io/.../<40-hex sha>) that must
# be live before bootstrap is invoked, and the post-bootstrap verification now
# proves a protected /api/** route answers 200 (i.e. forced rotation is NOT
# armed) before bootstrap is disabled. When image_ref is empty the previous
# behavior (deploy the service's currently configured image) is preserved.
#
# Render remains authoritative for runtime DB material; PROD_DB_USER is only a
# compatibility fallback if the Render username key is absent. No duplicated
# CONTROL_PLANE_TENANT_ID GitHub secret is trusted.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose (read-only) or reconcile (surgical re-provisioning)'
        required: false
        default: 'diagnose'
        type: choice
        options:
          - diagnose
          - reconcile
      confirm:
        description: "Type 'reconcile' to authorize the surgical re-provisioning (required when mode=reconcile)"
        required: false
        default: ''
        type: string
      image_ref:
        description: 'Exact immutable image (ghcr.io/snadaiapp-png/snad-backend:<40-hex sha>) to deploy during reconcile; empty = the service currently configured image (legacy behavior)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: scp-smoke-identity-reconcile
  cancel-in-progress: false

jobs:
  scp-smoke-identity:
    name: Diagnose / reconcile SCP smoke identity
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Guard inputs
        env:
          MODE_INPUT: ${{ inputs.mode }}
          CONFIRM_INPUT: ${{ inputs.confirm }}
          IMAGE_REF_INPUT: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail
          MODE="$MODE_INPUT"
          CONFIRM="$CONFIRM_INPUT"
          if [ "$MODE" != "diagnose" ] && [ "$MODE" != "reconcile" ]; then
            echo "::error::mode must be 'diagnose' or 'reconcile'"
            exit 1
          fi
          if [ "$MODE" = "reconcile" ] && [ "$CONFIRM" != "reconcile" ]; then
            echo "::error::mode=reconcile requires the confirm input to be the literal string 'reconcile'"
            exit 1
          fi
          if [ -n "$IMAGE_REF_INPUT" ]; then
            if [ "$MODE" != "reconcile" ]; then
              echo "::error::image_ref is only valid together with mode=reconcile (diagnose is read-only)"
              exit 1
            fi
            image_regex='^ghcr\.io/snadaiapp-png/snad-backend:[0-9a-f]{40}$'
            if ! [[ "$IMAGE_REF_INPUT" =~ $image_regex ]]; then
              echo "::error::image_ref must match ghcr.io/snadaiapp-png/snad-backend:<40-hex sha> (got ${#IMAGE_REF_INPUT} chars)"
              exit 1
            fi
            echo "Reconcile will deploy the exact immutable image: $IMAGE_REF_INPUT"
          fi
          echo "Mode accepted: ${MODE}"

      - name: Run identity diagnostics / reconcile
        env:
          MODE: ${{ inputs.mode }}
          IMAGE_REF: ${{ inputs.image_ref }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DATABASE_USERNAME: ${{ secrets.PROD_DB_USER }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          CONTROL_PLANE_ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          CONTROL_PLANE_ADMIN_PASSWORD: ${{ secrets.CONTROL_PLANE_ADMIN_PASSWORD }}
          CONTROL_PLANE_BOOTSTRAP_TOKEN: ${{ secrets.CONTROL_PLANE_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/production/scp-smoke-identity-reconcile.sh "$MODE"
