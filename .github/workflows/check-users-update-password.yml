name: Check Users & Update Password

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "check" to confirm'
        required: true
        default: ''
        type: string
      password:
        description: 'New password (leave empty to just check)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    if: github.event.inputs.confirm == 'check'
    steps:
      - name: Suspend backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Suspend HTTP %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/suspend" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" || true
          sleep 15

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          pip3 install bcrypt > /dev/null 2>&1

      - name: Check users and update password
        env:
          PROD_JDBC_URL: ${{ secrets.PROD_JDBC_URL }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          CONTROL_PLANE_TENANT_ID: ${{ secrets.CONTROL_PLANE_TENANT_ID }}
          ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          NEW_PASSWORD: ${{ inputs.password }}
        run: |
          set -euo pipefail
          JDBC_URL="$PROD_JDBC_URL"
          CONN_STR="${JDBC_URL#jdbc:postgresql://}"
          HOST_PORT="${CONN_STR%%/*}"
          HOST="${HOST_PORT%%:*}"
          PORT="${HOST_PORT##*:}"
          DB_PART="${CONN_STR#*/}"
          DB_NAME="${DB_PART%%\?*}"

          # Generate hash if password provided
          HASH=""
          if [ -n "$NEW_PASSWORD" ]; then
            HASH=$(python3 -c "
            import bcrypt, sys
            print(bcrypt.hashpw(sys.argv[1].encode('utf-8'), bcrypt.gensalt(rounds=10)).decode('utf-8'))
            " "$NEW_PASSWORD")
            echo "Generated BCrypt hash"
          fi

          # Build SQL
          if [ -n "$HASH" ]; then
            printf '%s\n' \
              "SET search_path TO public;" \
              "SELECT '=== All users ===' AS info;" \
              "SELECT id, tenant_id, email, status, (password_hash IS NOT NULL) AS has_password FROM users;" \
              "SELECT '=== Updating ALL users passwords ===' AS info;" \
              "UPDATE users SET password_hash = '$HASH', status = 'ACTIVE', updated_at = CURRENT_TIMESTAMP;" \
              "SELECT '=== After update ===' AS info;" \
              "SELECT email, status, (password_hash IS NOT NULL) AS has_password FROM users;" \
              "SELECT '=== Roles ===' AS info;" \
              "SELECT r.code, r.status FROM roles r WHERE r.tenant_id = '$CONTROL_PLANE_TENANT_ID'::uuid;" \
              "SELECT '=== Role assignments ===' AS info;" \
              "SELECT u.email, r.code FROM user_role_assignments ura JOIN users u ON u.id = ura.user_id JOIN roles r ON r.id = ura.role_id;" \
              > /tmp/check.sql
          else
            printf '%s\n' \
              "SET search_path TO public;" \
              "SELECT '=== All users ===' AS info;" \
              "SELECT id, tenant_id, email, status, (password_hash IS NOT NULL) AS has_password FROM users;" \
              "SELECT '=== Roles ===' AS info;" \
              "SELECT r.code, r.status FROM roles r WHERE r.tenant_id = '$CONTROL_PLANE_TENANT_ID'::uuid;" \
              "SELECT '=== Role assignments ===' AS info;" \
              "SELECT u.email, r.code FROM user_role_assignments ura JOIN users u ON u.id = ura.user_id JOIN roles r ON r.id = ura.role_id;" \
              > /tmp/check.sql
          fi

          for attempt in 1 2 3 4 5; do
            echo "=== Attempt $attempt ==="
            if PGPASSWORD="$PROD_DB_PASSWORD" psql -h "$HOST" -p "$PORT" -U "$PROD_DB_USER" -d "$DB_NAME" -f /tmp/check.sql; then
              echo "✓ Done!"
              break
            fi
            echo "Attempt $attempt failed. Waiting 10s..."
            sleep 10
          done

      - name: Resume backend
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Resume HTTP %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/resume" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" || true

      - name: Verify login
        env:
          ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          NEW_PASSWORD: ${{ inputs.password }}
        run: |
          echo "Waiting 30s..."
          sleep 30
          if [ -n "$NEW_PASSWORD" ]; then
            echo "=== Login test ==="
            curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"admin@snad.ai\",\"password\":\"$NEW_PASSWORD\"}" \
              -w "\nHTTP %{http_code}\n" || true
          fi
