# G1 production-derived backup/restore rehearsal. Manual and protected.
# IMPORTANT: This does NOT authorize production schema changes or certify recovery.
#
# v20261108.2 — RUN 5 FIX (run 42525547844, exit 1 after 1m36s):
#   sudo -u postgres pg_restore failed: could not open
#   "/tmp/tmp.XXX/production.restore.dump": Permission denied. Root cause:
#   mktemp -d under umask 077 creates a 0700 runner-owned directory, so the
#   postgres user could not TRAVERSE the directory to reach the postgres-owned
#   0400 restore copy and the 0644 toc inside it (file permissions were already
#   correct; the directory was not). Fix: chmod 0711 on the work directory —
#   traverse-only for non-owners, listing still denied; the private
#   production.dump archive remains 0600 runner-only. The green preflight
#   never hit this because it wrote its dump directly into /tmp.
#
#
# v20261108.4 — RUN 8 FIX (run 42597788638, exit 1 after ~3m):
#   v20261108.3 fixed the TOC filter and the restore then proceeded into real
#   public-schema objects, failing at the first EXCLUDE USING gist constraint:
#   "data type uuid has no default operator class for access method gist".
#   The application's own migrations require the btree_gist extension
#   (CREATE EXTENSION IF NOT EXISTS btree_gist) for temporal no-overlap
#   constraints on uuid tenant columns. The allowlist drops the dump's
#   EXTENSION entries (most are Supabase-only, not available on vanilla
#   PostgreSQL 17), so the gist uuid opclass was missing at restore time.
#   Fix: pre-create btree_gist in the disposable restored database before
#   pg_restore — it ships in PGDG contrib on the runner (same source as
#   pgcrypto, which run 7 already created successfully). Validated locally
#   against a PG 17 simulation: without it, run 8's exact error; with it,
#   restore exit 0 with both EXCLUDE constraints intact.
# v20261108.3 — RUN 7 FIX (run 42587205803, exit 1 after 2m19s):
#   The v20261108.1 "selective TOC" filter never actually filtered anything.
#   It parsed pg_restore -l lines with split('; ') expecting >=3 parts, but a
#   real TOC line contains exactly ONE semicolon —
#     <dumpid>; <tableoid> <oid> <DESC...> <namespace|-> <tag...> [<owner>]
#   — so every entry hit the len(parts)<3 guard and toc.filtered ended up the
#   FULL TOC. pg_restore therefore died at the first extension unavailable on
#   vanilla PostgreSQL 17: CREATE EXTENSION supabase_vault → "extension
#   supabase_vault is not available" (run 7). Fix: parse the one-semicolon
#   format (skip leading integer catalog oids, DESC, namespace, tag) and
#   switch to a public-schema ALLOWLIST: keep an entry iff its namespace is
#   'public'; drop EXTENSION, SCHEMA (public already exists; Supabase
#   platform schemas are not restorable), ACL/DEFAULT PRIVILEGES, and all
#   non-public objects (incl. publications and extension comments). Multi-
#   word TOC descs handled (TABLE DATA, SEQUENCE OWNED BY / SEQUENCE SET,
#   ROW SECURITY, PUBLICATION TABLE, FK CONSTRAINT, ...). Validated end-to-
#   end on a local PG 17 simulation with an unavailable extension: the old
#   filter fails exactly like run 7; the new filter restores the public
#   schema, data, RLS policies and flyway_schema_history with exit 0.
# v20261108.1 — RESTORE REHEARSAL FIXES (after run failures 42426903432 et al.):
#   1. Install step hardened: curl --retry, apt -o Acquire::Retries=5, retry loops
#      (fixes transient curl(56) key-fetch and apt exit-100 libicu74 index failures).
#   2. Restore step no longer streams the custom-format archive through stdin;
#      pg_restore now receives a filename via a postgres-owned 0400 copy — the exact
#      pattern already proven green by g1-pg17-runner-preflight.yml.
#   3. Restore is now a selective TOC restore of the public schema: Supabase
#      platform schemas (auth/storage/extensions/vault/net/graphql/...), ALL
#      EXTENSION entries, and ACL/default-privilege entries are excluded — they
#      cannot exist on vanilla PostgreSQL 17 and abort any full --exit-on-error
#      restore (CREATE EXTENSION pgsodium/pg_net/pg_graphql, policies TO
#      authenticated/anon, "schema public already exists" on Supabase-altered
#      public ownership). The public schema uses only built-in gen_random_uuid(),
#      so it restores cleanly.
#   4. Restore-only stub roles (sanad, sanad_migrator, service_role) are created
#      NOLOGIN before restore: public RLS policies name them in TO clauses.
#   5. On restore failure the first object-level pg_restore error lines are
#      printed (object names only; DETAIL/CONTEXT/HINT lines are suppressed so
#      no row data reaches the log).
#   6. evidence.json records restore_scope + stubbed roles as explicit
#      limitations. The rehearsal result key is unchanged:
#      RESTORE_REHEARSAL_SUCCESS_NOT_G1_CERTIFIED.
name: G1 Production Backup Restore Proof

on:
  workflow_dispatch:
    inputs:
      change_ticket:
        description: 'Approved backup and isolated-restore ticket ID'
        required: true
        type: string
      expected_flyway:
        description: 'Expected production Flyway version before backup'
        required: true
        default: '20261021.1'
        type: string

permissions:
  contents: read

concurrency:
  group: g1-production-backup-restore-proof
  cancel-in-progress: false

jobs:
  backup-restore:
    name: Production read-only dump to disposable local restore
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: Production
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      EXPECTED_FLYWAY: ${{ inputs.expected_flyway }}
      CHANGE_TICKET: ${{ inputs.change_ticket }}
    steps:
      - name: Check approved change reference and protected credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHANGE_TICKET" =~ ^G1-CHG-[0-9]+$ ]] || { echo "::error::INVALID_CHANGE_TICKET_FORMAT"; exit 1; }
          echo "CHANGE_REFERENCE_FORMAT_VALID=yes"
          # A valid change reference is not an approval. Production protection reviewers
          # must independently verify explicit approval and rotated credentials.
          test -n "${PRODUCTION_DATABASE_URL:-}" || { echo "::error::NO_PROTECTED_PRODUCTION_DB_URL"; exit 1; }
          echo "CHANGE_REFERENCE_PRESENT=yes"
          echo "NOTE=Production environment reviewer must authorize this run"

      - name: Install matching native PostgreSQL 17 clients and server
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=5 update -qq; then break; fi
            echo "APT update attempt ${attempt} failed; retrying in 15s"
            test "$attempt" -eq 3 && { echo "::error::APT_UPDATE_FAILED_AFTER_RETRIES"; exit 1; }
            sleep 15
          done
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=5 install -y -qq postgresql-client-17 postgresql-17; then break; fi
            echo "APT install attempt ${attempt} failed; retrying in 20s"
            test "$attempt" -eq 3 && { echo "::error::APT_INSTALL_FAILED_AFTER_RETRIES"; exit 1; }
            sleep 20
          done
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          pg_dump --version | grep -E 'PostgreSQL[)] 17[.]'
          if ! pg_lsclusters --no-header | awk '$1=="17" && $2=="main" {found=1} END {exit !found}'; then
            sudo pg_createcluster 17 main
          fi
          if ! sudo pg_ctlcluster 17 main status >/dev/null 2>&1; then
            sudo pg_ctlcluster 17 main start
          fi
          local_port="$(pg_lsclusters --no-header | awk '$1=="17" && $2=="main" {print $3}')"
          test -n "$local_port" || { echo "::error::PG17_CLUSTER_PORT_MISSING"; exit 1; }
          sudo -u postgres psql -p "$local_port" -Atqc "SHOW server_version" | grep -E '^17[.]'
          echo "LOCAL_PGPORT=$local_port" >> "$GITHUB_ENV"

      - name: Production read-only backup and isolated restore rehearsal
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          # postgres (via sudo -u postgres pg_restore) must traverse this directory
          # to reach its postgres-owned 0400 restore copy and the 0644 toc. 0711 grants
          # traverse-only to non-owners: listing stays denied and the private
          # production.dump archive remains 0600 runner-only (run 5 fix).
          chmod 0711 "$work"
          trap 'rm -rf "$work"' EXIT
          # PostgreSQL connection URL comes only from protected Actions secret.
          # Do not print the URL, password, query results containing user data, or dump.
          python3 - "$work" <<'PY'
          import os, sys
          from urllib.parse import urlsplit, parse_qs, unquote
          raw=os.environ['PRODUCTION_DATABASE_URL']
          if raw.startswith('jdbc:'): raw=raw[5:]
          p=urlsplit(raw)
          if p.scheme not in ('postgresql','postgres'): raise SystemExit('INVALID_CONNECTION_SCHEME')
          host=p.hostname or ''
          u=unquote(p.username or '')
          query=parse_qs(p.query)
          if not u: u=query.get('user',[''])[0]
          password=unquote(p.password or '') or query.get('password',[''])[0]
          # Exact production-project binding; accept Supabase pooler username postgres.<project-ref>.
          ref='tkbrvupemreqabwzdpyq'
          if ref not in host and ref not in u: raise SystemExit('PRODUCTION_IDENTITY_NOT_MATCHED')
          if not (host and u and password): raise SystemExit('INCOMPLETE_DATABASE_CONNECTION')
          env=os.environ.copy()
          env.update(PGHOST=host, PGPORT=str(p.port or 5432),
                     PGUSER=u, PGPASSWORD=password,
                     PGDATABASE=unquote((p.path or '/postgres').lstrip('/')),
                     PGSSLMODE='require', PGCONNECT_TIMEOUT='15')
          # Never export or print credentials to downstream steps.
          import subprocess, hashlib, json
          def cmd(args,env=env,capture=False):
              return subprocess.run(args,env=env,check=True,
                                    stdout=subprocess.PIPE if capture else subprocess.DEVNULL,
                                    stderr=subprocess.PIPE)
          sql="SELECT version FROM public.flyway_schema_history WHERE success AND version IS NOT NULL ORDER BY installed_rank DESC LIMIT 1"
          head=cmd(['psql','-X','-A','-t','-v','ON_ERROR_STOP=1','-c',sql],capture=True).stdout.decode().strip()
          if head!=os.environ['EXPECTED_FLYWAY']: raise SystemExit('FLYWAY_HEAD_MISMATCH')
          archive=os.path.join(sys.argv[1],'production.dump')
          cmd(['pg_dump','-Fc','-f',archive])
          if os.path.getsize(archive)==0: raise SystemExit('EMPTY_BACKUP')
          sha=hashlib.sha256(open(archive,'rb').read()).hexdigest()
          # Isolated destination is a new PostgreSQL database on the ephemeral runner;
          # there is no write access to production in this step.
          local=os.environ.copy()
          for k in ('PGHOST','PGPORT','PGUSER','PGPASSWORD','PGDATABASE','PGSSLMODE'):local.pop(k,None)
          port=os.environ['LOCAL_PGPORT']
          def sudo_pg(args, **kw):
              return subprocess.run(['sudo','-u','postgres']+args, env=local, **kw)
          # 1) Fresh destination database on the disposable local cluster.
          sudo_pg(['dropdb','-p',port,'--if-exists','snad_g1_restored'], check=True)
          sudo_pg(['createdb','-p',port,'snad_g1_restored'], check=True)
          # 2) Restore-only stub roles (NOLOGIN): public RLS policies name them in
          #    TO clauses; production ACLs are intentionally not restored (--no-acl).
          stub_sql=("DO $do$ DECLARE r text; BEGIN "
                    "FOREACH r IN ARRAY ARRAY['sanad','sanad_migrator','service_role'] LOOP "
                    "IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname=r) THEN "
                    "EXECUTE format('CREATE ROLE %I NOLOGIN', r); END IF; END LOOP; END $do$;")
          sudo_pg(['psql','-p',port,'-X','-v','ON_ERROR_STOP=1','-d','postgres','-c',stub_sql], check=True)
          # 2b) Pre-create btree_gist in the disposable restore target: the application's
          #     own migrations require it for EXCLUDE USING gist temporal no-overlap
          #     constraints on uuid columns, and it ships in PGDG contrib on the runner.
          #     All other EXTENSION entries stay dropped (not available on vanilla PG 17).
          sudo_pg(['psql','-p',port,'-X','-v','ON_ERROR_STOP=1','-d','snad_g1_restored',
                   '-c','CREATE EXTENSION IF NOT EXISTS btree_gist'], check=True)
          # 3) Selective TOC restore: keep the public schema (all application tables,
          #    data, and flyway_schema_history); drop Supabase platform schemas, ALL
          #    EXTENSION entries, and ACL/default-privilege entries — none of these can
          #    exist on vanilla PostgreSQL 17 and each aborts a full --exit-on-error
          #    restore. The public schema only uses built-in gen_random_uuid().
          platform={'auth','storage','extensions','vault','net','graphql','graphql_public',
                    'supabase_functions','pgsodium','pgsodium_keys','cron','realtime','_realtime',
                    '_analytics','_supabase','supabase_admin'}
          toc=subprocess.run(['pg_restore','-l',archive],
                             stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True).stdout.decode()
          kept=[]
          dropped={'extension':0,'platform_schema_object':0,'acl':0,'out_of_public_scope':0}
          # Real pg_restore -l lines have exactly ONE semicolon:
          #   <dumpid>; <tableoid> <oid> <DESC...> <namespace|-> <tag...> [<owner>]
          # Multi-word descs must be matched before single-word ones.
          multi=('TABLE DATA ','MATERIALIZED VIEW DATA ','MATERIALIZED VIEW ',
                 'FK CONSTRAINT ','DEFAULT PRIVILEGES','DEFAULT ACL','LARGE OBJECT ',
                 'SEQUENCE OWNED BY ','SEQUENCE SET ','PUBLICATION TABLE ',
                 'ROW SECURITY ','EVENT TRIGGER ','TEXT SEARCH ',
                 'OPERATOR CLASS ','OPERATOR FAMILY ')
          for line in toc.splitlines():
              if not line.strip() or line.lstrip().startswith(';'):
                  kept.append(line); continue      # header/comment/blank lines
              if ';' not in line:
                  kept.append(line); continue      # unrecognized line: keep verbatim
              fields=line.split(';',1)[1].split()
              k=0
              while k<len(fields) and fields[k].isdigit():
                  k+=1                             # skip leading integer catalog oids
              if k>=len(fields):
                  kept.append(line); continue
              desc=' '.join(fields[k:])
              typ=''; after=[]
              for pref in multi:
                  if desc.startswith(pref):
                      typ=pref.strip(); after=desc[len(pref):].split(); break
              if not typ:
                  w=desc.split()
                  typ=w[0] if w else ''
                  after=w[1:]
              ns=after[0] if after else ''              # namespace; '-' = database-level
              tag=after[1] if len(after)>1 else ''     # first tag word (schema name for SCHEMA)
              if typ=='EXTENSION':
                  dropped['extension']+=1; continue
              if typ=='SCHEMA':
                  # tag is the schema name: public already exists in a fresh database
                  # and Supabase platform schemas are not restorable on vanilla PG 17.
                  if tag=='public' or tag in platform:
                      dropped['platform_schema_object']+=1
                  else:
                      dropped['out_of_public_scope']+=1
                  continue
              if typ in ('ACL','DEFAULT PRIVILEGES','DEFAULT ACL'):
                  dropped['acl']+=1; continue
              if ns=='public':
                  kept.append(line); continue      # application scope: public schema only
              dropped['out_of_public_scope']+=1
          toc_path=os.path.join(sys.argv[1],'toc.filtered')
          with open(toc_path,'w') as f: f.write('\n'.join(kept)+'\n')
          os.chmod(toc_path,0o644)  # object names only; postgres user must be able to read it
          # 4) Restore by filename (preflight-proven pattern) via a postgres-owned
          #    0400 copy of the private archive; never streamed through stdin.
          arch_restore=os.path.join(sys.argv[1],'production.restore.dump')
          subprocess.run(['sudo','install','-o','postgres','-g','postgres','-m','0400',
                          archive,arch_restore], check=True)
          res=sudo_pg(['pg_restore','--exit-on-error','--no-owner','--no-acl',
                       '-p',port,'-L',toc_path,'-d','snad_g1_restored',arch_restore],
                      stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          try:
              if res.returncode:
                  err_lines=res.stderr.decode('utf-8','replace').splitlines()
                  shown=[l[:240] for l in err_lines
                         if l.startswith('pg_restore: error:')
                         and not l.startswith(('pg_restore: error: DETAIL',
                                               'pg_restore: error: CONTEXT',
                                               'pg_restore: error: HINT'))][:10]
                  print('RESTORE_ERROR_SUMMARY (object names only; data values suppressed):')
                  for l in shown: print(l)
                  raise SystemExit('RESTORE_FAILED: see RESTORE_ERROR_SUMMARY above')
          finally:
              subprocess.run(['sudo','rm','-f',arch_restore], check=False)
          restored=subprocess.run(['sudo','-u','postgres','psql','-d','snad_g1_restored',
                                   '-p',port,'-X','-A','-t','-v','ON_ERROR_STOP=1','-c',sql],
                                   check=True,capture_output=True).stdout.decode().strip()
          if restored!=head: raise SystemExit('RESTORED_FLYWAY_MISMATCH')
          summary={'result':'RESTORE_REHEARSAL_SUCCESS_NOT_G1_CERTIFIED',
                   'source_project':'tkbrvupemreqabwzdpyq','source_flyway':head,
                   'restored_flyway':restored,'archive_size_bytes':os.path.getsize(archive),
                   'archive_sha256':sha,'scope':'logical full database archive',
                   'restore_scope':'public schema only - Supabase platform schemas/extensions '
                                   'and ACLs excluded by design for vanilla PostgreSQL 17 rehearsal',
                   'restore_roles_stubbed':['sanad','sanad_migrator','service_role'],
                   'restore_extensions_precreated':['btree_gist'],
                   'toc_dropped':dropped,
                   'limitations':['ephemeral runner backup removed at job end',
                                  'restored with no-owner/no-acl: ownership and ACL not certified',
                                  'platform schemas (auth/storage/extensions) not restorable on '
                                  'vanilla PostgreSQL and excluded from the rehearsal',
                                  'not a durable or independently verified recovery backup']}
          with open(os.path.join(sys.argv[1],'evidence.json'),'w') as f:json.dump(summary,f,indent=2)
          print('PRODUCTION_BACKUP_RESTORE_REHEARSAL=PASS')
          print('ARCHIVE_SHA256='+sha)
          print('NOTE=NOT_A_DURABLE_BACKUP_AND_NOT_AN_ACL_CERTIFICATION')
          PY

      - name: State certification limitations
        if: always()
        run: |
          echo "Backup Gate remains OPEN until durable encrypted offsite backup, full ACL/RLS verification and independent approval."
          echo "G1_SECURITY_HOLD=ACTIVE"
          echo "PRODUCTION_RELEASE=NO-GO"
          echo "PAYMENTS=OFF"
