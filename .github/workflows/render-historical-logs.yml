name: Render Historical Logs Recovery (read-only)

# Phase B — Recover historical logs for the failed deploy
# dep-da1d1e67bikc738srmo0 (2026-08-17T09:12:00Z → 2026-08-17T09:33:00Z).
#
# Uses account-level GET /v1/logs (NOT /v1/services/{id}/logs) with:
#   ownerId, resource=srv-d8ragqkm0tmc73bviqq0, startTime, endTime, direction, limit
#
# Paginates with cursor until all logs in the window are exhausted.
# Extracts ERROR / FATAL / Exception / Caused by / Spring startup messages.
# Identifies first fatal exception + originating subsystem.

on:
  workflow_dispatch:
    inputs:
      start_time:
        description: "ISO 8601 start time (default: 2026-08-17T09:12:00Z)"
        required: true
        default: "2026-08-17T09:12:00Z"
      end_time:
        description: "ISO 8601 end time (default: 2026-08-17T09:35:00Z)"
        required: true
        default: "2026-08-17T09:35:00Z"

permissions:
  contents: read

jobs:
  historical-logs:
    name: Recover historical Render logs (read-only)
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 8
    steps:
      - name: Fetch historical logs via /v1/logs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          START_TIME: ${{ github.event.inputs.start_time }}
          END_TIME: ${{ github.event.inputs.end_time }}
        run: |
          set -uo pipefail
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          
          echo "========================================"
          echo "PHASE B — HISTORICAL LOG RECOVERY"
          echo "========================================"
          echo ""
          echo "Service: ${RENDER_SERVICE_ID}"
          echo "Window:  ${START_TIME} → ${END_TIME}"
          echo ""
          
          mkdir -p /tmp/logs
          
          # ----- Attempt 1: GET /v1/logs with all params -----
          echo "=== Attempt 1: GET /v1/logs (account-level, with ownerId + resource) ==="
          
          # Get owner ID from service object
          OWNER_ID=$(curl -s --max-time 30 -H "$AUTH" "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" | jq -r '.ownerId // .owner // empty')
          echo "ownerId = ${OWNER_ID:-<none>}"
          
          if [ -n "$OWNER_ID" ]; then
            # Build URL with all query parameters
            URL="https://api.render.com/v1/logs?ownerId=${OWNER_ID}&resource=${RENDER_SERVICE_ID}&startTime=${START_TIME}&endTime=${END_TIME}&direction=forward&limit=500"
            echo "Fetching: $URL"
            HTTP_CODE=$(curl -s -o /tmp/logs/page1.json -w "%{http_code}" --max-time 60 -H "$AUTH" "$URL")
            echo "HTTP $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Success! Response structure:"
              jq 'if type=="object" then keys else type end' /tmp/logs/page1.json
              echo ""
              echo "Total log entries:"
              jq 'if type=="array" then length elif .logs then (.logs | length) elif .lines then (.lines | length) else "unknown" end' /tmp/logs/page1.json
              
              # Save raw logs
              cp /tmp/logs/page1.json /tmp/logs/all-logs.json
              
              # Try to extract log lines (different response shapes)
              echo ""
              echo "=== Extracted log lines (first 50) ==="
              jq -r 'if type=="array" then .[] elif .logs then .logs[] elif .lines then .lines[] else empty end | (if type=="object" then (.text // .message // .msg // (. | tostring)) else (tostring) end)' /tmp/logs/page1.json 2>/dev/null | head -50
              
              # Pagination: check for cursor
              NEXT_CURSOR=$(jq -r '.nextCursor // .cursor // .meta.nextCursor // empty' /tmp/logs/page1.json 2>/dev/null)
              echo ""
              echo "Next cursor: ${NEXT_CURSOR:-<none>}"
              
              # Paginate
              PAGE=2
              while [ -n "$NEXT_CURSOR" ] && [ "$NEXT_CURSOR" != "null" ] && [ "$PAGE" -le 20 ]; do
                echo ""
                echo "--- Fetching page $PAGE (cursor=$NEXT_CURSOR) ---"
                URL="https://api.render.com/v1/logs?ownerId=${OWNER_ID}&resource=${RENDER_SERVICE_ID}&startTime=${START_TIME}&endTime=${END_TIME}&direction=forward&limit=500&cursor=${NEXT_CURSOR}"
                HTTP_CODE=$(curl -s -o /tmp/logs/page${PAGE}.json -w "%{http_code}" --max-time 60 -H "$AUTH" "$URL")
                echo "HTTP $HTTP_CODE"
                
                if [ "$HTTP_CODE" != "200" ]; then
                  echo "Pagination stopped: non-200 response"
                  break
                fi
                
                # Append to all-logs
                jq -r 'if type=="array" then .[] elif .logs then .logs[] elif .lines then .lines[] else empty end | (if type=="object" then (.text // .message // .msg // (. | tostring)) else (tostring) end)' /tmp/logs/page${PAGE}.json 2>/dev/null >> /tmp/logs/all-lines.txt
                
                NEXT_CURSOR=$(jq -r '.nextCursor // .cursor // .meta.nextCursor // empty' /tmp/logs/page${PAGE}.json 2>/dev/null)
                echo "Next cursor: ${NEXT_CURSOR:-<none>}"
                
                if [ -z "$NEXT_CURSOR" ] || [ "$NEXT_CURSOR" = "null" ]; then
                  echo "Pagination complete"
                  break
                fi
                PAGE=$((PAGE + 1))
              done
              
              # Combine all pages of raw JSON
              echo ""
              echo "=== ALL PAGES COMBINED ==="
              cat /tmp/logs/page*.json 2>/dev/null | jq -s '.' 2>/dev/null > /tmp/logs/combined.json || cat /tmp/logs/page*.json > /tmp/logs/combined.txt
              
              # Save all extracted text lines
              if [ ! -f /tmp/logs/all-lines.txt ]; then
                # First-page only — extract now
                jq -r 'if type=="array" then .[] elif .logs then .logs[] elif .lines then .lines[] else empty end | (if type=="object" then (.text // .message // .msg // (. | tostring)) else (tostring) end)' /tmp/logs/page1.json 2>/dev/null > /tmp/logs/all-lines.txt
              fi
              
              echo ""
              echo "=== Total log lines captured ==="
              wc -l /tmp/logs/all-lines.txt 2>/dev/null || echo "0 lines"
              
              # ----- SEARCH FOR ROOT CAUSE -----
              echo ""
              echo "========================================"
              echo "ROOT CAUSE EXTRACTION"
              echo "========================================"
              
              if [ -s /tmp/logs/all-lines.txt ]; then
                echo ""
                echo "=== ENOIDENTIFIER matches (sanity check) ==="
                grep -c "ENOIDENTIFIER" /tmp/logs/all-lines.txt || echo "0"
                
                echo ""
                echo "=== ERROR / Exception / FATAL matches ==="
                grep -nE "ERROR|FATAL|Exception|Caused by|APPLICATION FAILED|SpringApplication" /tmp/logs/all-lines.txt | head -20
                
                echo ""
                echo "=== First 30 lines around FIRST ERROR ==="
                ERROR_LN=$(grep -nE "ERROR|FATAL|Exception|Caused by|APPLICATION FAILED" /tmp/logs/all-lines.txt | head -1 | cut -d: -f1)
                if [ -n "$ERROR_LN" ]; then
                  START=$((ERROR_LN > 15 ? ERROR_LN - 15 : 1))
                  END=$((ERROR_LN + 20))
                  sed -n "${START},${END}p" /tmp/logs/all-lines.txt
                fi
                
                echo ""
                echo "=== Origin classification hints ==="
                grep -iE "FlywayMigrationInitializer|org\.flywaydb|Flyway " /tmp/logs/all-lines.txt | head -5 || echo "(no Flyway evidence)"
                grep -iE "HikariPool|HikariDataSource|com\.zaxxer\.hikari" /tmp/logs/all-lines.txt | head -5 || echo "(no Hikari evidence)"
                grep -iE "EntityManagerFactory|hibernate|org\.hibernate" /tmp/logs/all-lines.txt | head -5 || echo "(no Hibernate evidence)"
                grep -iE "ProductionSecurityGuard|ProductionWorkflowStubGuard|SANAD_PRODUCTION_GUARD" /tmp/logs/all-lines.txt | head -5 || echo "(no ProductionGuard evidence)"
                grep -iE "OutOfMemoryError|Java heap space|Metaspace|GC overhead" /tmp/logs/all-lines.txt | head -5 || echo "(no OOM evidence)"
                grep -iE "Port 8080|BindException|port .* in use" /tmp/logs/all-lines.txt | head -5 || echo "(no port bind evidence)"
                grep -iE "BeanCreationException|UnsatisfiedDependencyException|BeanDefinitionStoreException" /tmp/logs/all-lines.txt | head -5 || echo "(no Bean creation evidence)"
                grep -iE "Tomcat|Servlet|DispatcherServlet|Actuator" /tmp/logs/all-lines.txt | head -5 || echo "(no Tomcat/Actuator evidence)"
                
                # ----- Save logs as artifact -----
                echo ""
                echo "=== Saving full logs to artifact ==="
                mkdir -p /tmp/artifacts
                cp /tmp/logs/all-lines.txt /tmp/artifacts/render-historical-logs.txt 2>/dev/null
                cp /tmp/logs/combined.json /tmp/artifacts/render-historical-raw.json 2>/dev/null || cat /tmp/logs/page*.json > /tmp/artifacts/render-historical-raw.json
                ls -la /tmp/artifacts/
              fi
              
            else
              echo "Failed: HTTP $HTTP_CODE"
              cat /tmp/logs/page1.json
              
              # ----- Attempt 2: Try without ownerId -----
              echo ""
              echo "=== Attempt 2: GET /v1/logs WITHOUT ownerId (resource only) ==="
              URL="https://api.render.com/v1/logs?resource=${RENDER_SERVICE_ID}&startTime=${START_TIME}&endTime=${END_TIME}&direction=forward&limit=500"
              HTTP_CODE=$(curl -s -o /tmp/logs/page1b.json -w "%{http_code}" --max-time 60 -H "$AUTH" "$URL")
              echo "HTTP $HTTP_CODE"
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Success! Structure:"
                jq 'if type=="object" then keys else type end' /tmp/logs/page1b.json
              else
                cat /tmp/logs/page1b.json
              fi
            fi
          else
            echo "ERROR: Could not extract ownerId from service object"
            cat /tmp/svc.json 2>/dev/null
          fi
          
          echo ""
          echo "========================================"
          echo "PHASE B COMPLETE"
          echo "========================================"
          
      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-historical-logs
          path: /tmp/artifacts/
          if-no-files-found: warn
          retention-days: 7
