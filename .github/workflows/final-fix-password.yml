name: Final Fix — Reset Password & Verify

# ============================================================
# Final solution:
# 1. Reset admin password to @Snad@2026
# 2. Verify login works end-to-end
# 3. Test control-plane access
# ============================================================

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "final-fix" to confirm'
        required: true
        default: ''
        type: string
      admin_password:
        description: 'New admin password (default: @Snad@2026)'
        required: false
        default: '@Snad@2026'
        type: string

permissions:
  contents: read

jobs:
  final-fix:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    if: github.event.inputs.confirm == 'final-fix'

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          pip3 install bcrypt > /dev/null 2>&1

      - name: Generate BCrypt hash
        id: bcrypt
        env:
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
        run: |
          HASH=$(python3 -c "
          import bcrypt, sys
          password = sys.argv[1].encode('utf-8')
          print(bcrypt.hashpw(password, bcrypt.gensalt(rounds=10)).decode('utf-8'))
          " "$ADMIN_PASSWORD")
          echo "::add-mask::$HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "BCrypt hash generated (length: ${#HASH})"

      - name: Update admin password in DB
        env:
          PROD_JDBC_URL: ${{ secrets.PROD_JDBC_URL }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          CONTROL_PLANE_TENANT_ID: ${{ secrets.CONTROL_PLANE_TENANT_ID }}
          ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          PASSWORD_HASH: ${{ steps.bcrypt.outputs.hash }}
        run: |
          set -euo pipefail
          JDBC_URL="$PROD_JDBC_URL"
          CONN_STR="${JDBC_URL#jdbc:postgresql://}"
          HOST_PORT="${CONN_STR%%/*}"
          HOST="${HOST_PORT%%:*}"
          PORT="${HOST_PORT##*:}"
          DB_PART="${CONN_STR#*/}"
          DB_NAME="${DB_PART%%\?*}"

          printf '%s\n' \
            "SET search_path TO public;" \
            "UPDATE users SET password_hash = '${PASSWORD_HASH}', status = 'ACTIVE', updated_at = CURRENT_TIMESTAMP WHERE tenant_id = '${CONTROL_PLANE_TENANT_ID}'::uuid AND email = '${ADMIN_EMAIL}';" \
            "SELECT id, email, status, (password_hash IS NOT NULL) AS has_password FROM users WHERE email = '${ADMIN_EMAIL}';" \
            "SELECT r.code, r.status FROM roles r WHERE r.tenant_id = '${CONTROL_PLANE_TENANT_ID}'::uuid AND r.code = 'ADMIN';" \
            "SELECT count(*) AS admin_caps FROM role_capabilities rc JOIN roles r ON r.id = rc.role_id WHERE r.code = 'ADMIN' AND r.tenant_id = '${CONTROL_PLANE_TENANT_ID}'::uuid;" \
            "SELECT count(*) AS user_roles FROM user_role_assignments ura JOIN users u ON u.id = ura.user_id WHERE u.email = '${ADMIN_EMAIL}';" \
            > /tmp/fix.sql

          for attempt in 1 2 3 4 5; do
            echo "=== Attempt $attempt ==="
            if PGPASSWORD="$PROD_DB_PASSWORD" psql -h "$HOST" -p "$PORT" -U "$PROD_DB_USER" -d "$DB_NAME" -f /tmp/fix.sql; then
              echo "✓ Password updated!"
              exit 0
            fi
            echo "Attempt $attempt failed. Waiting 10s..."
            sleep 10
          done
          echo "All attempts failed"
          exit 1

      - name: Test login directly
        env:
          ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
        run: |
          echo "=== Direct backend login ==="
          curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -H "Origin: https://snad-app.vercel.app" \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            -w "\nHTTP %{http_code} | time=%{time_total}s\n" | head -c 500
          echo ""

      - name: Test login via BFF
        env:
          ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
        run: |
          echo "=== BFF login ==="
          curl -sS --max-time 30 -X POST "https://snad-app.vercel.app/api/platform/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -H "Origin: https://snad-app.vercel.app" \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            -w "\nHTTP %{http_code} | time=%{time_total}s\n" | head -c 500
          echo ""
