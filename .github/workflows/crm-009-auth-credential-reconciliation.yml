name: CRM-009 Auth Credential Reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-009-auth-credential-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile two controlled production acceptance identities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    env:
      PRODUCTION_WEB_BASE_URL: ${{ vars.PRODUCTION_WEB_BASE_URL || 'https://snad-app.vercel.app' }}
      PROD_JDBC_URL: ${{ secrets.PROD_JDBC_URL }}
      PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
      PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      CRM_TENANT_A_ID: ${{ secrets.AUTH_SMOKE_TENANT_A_ID }}
      CRM_TENANT_A_EMAIL: ${{ secrets.AUTH_SMOKE_TENANT_A_EMAIL }}
      CRM_TENANT_A_PASSWORD: ${{ secrets.AUTH_SMOKE_TENANT_A_PASSWORD }}
      CRM_TENANT_B_ID: ${{ secrets.AUTH_SMOKE_TENANT_B_ID }}
      CRM_TENANT_B_EMAIL: ${{ secrets.AUTH_SMOKE_TENANT_B_EMAIL }}
      CRM_TENANT_B_PASSWORD: ${{ secrets.AUTH_SMOKE_TENANT_B_PASSWORD }}
      CRM_RECONCILIATION_MODE: credential-only
      CRM_RECONCILIATION_EVIDENCE_DIR: ${{ runner.temp }}/crm-009-credential-reconciliation
      SANAD_SERVICE_AUTH_JWT_SECRET: ${{ secrets.SANAD_SERVICE_AUTH_JWT_SECRET }}
      SANAD_WORKFLOW_ENGINE_BASE_URL: ${{ secrets.SANAD_WORKFLOW_ENGINE_BASE_URL || vars.SANAD_WORKFLOW_ENGINE_BASE_URL }}
      SANAD_AI_GATEWAY_BASE_URL: ${{ secrets.SANAD_AI_GATEWAY_BASE_URL || vars.SANAD_AI_GATEWAY_BASE_URL }}

    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify protected production inputs
        shell: bash
        run: |
          set -euo pipefail
          for value in \
            "$PROD_JDBC_URL" "$PROD_DB_USER" "$PROD_DB_PASSWORD" \
            "$CRM_TENANT_A_ID" "$CRM_TENANT_A_EMAIL" "$CRM_TENANT_A_PASSWORD" \
            "$CRM_TENANT_B_ID" "$CRM_TENANT_B_EMAIL" "$CRM_TENANT_B_PASSWORD" \
            "$SANAD_SERVICE_AUTH_JWT_SECRET" "$SANAD_WORKFLOW_ENGINE_BASE_URL" "$SANAD_AI_GATEWAY_BASE_URL"; do
            test -n "$value" || { echo '::error::A required Production reconciliation value is missing'; exit 1; }
            echo "::add-mask::$value"
          done
          [[ "$PROD_JDBC_URL" == jdbc:postgresql://* ]]
          [[ "$PRODUCTION_WEB_BASE_URL" == https://* ]]
          [[ "$SANAD_WORKFLOW_ENGINE_BASE_URL" == https://* ]]
          [[ "$SANAD_AI_GATEWAY_BASE_URL" == https://* ]]
          test "$CRM_TENANT_A_ID" != "$CRM_TENANT_B_ID"
          test "${CRM_TENANT_A_EMAIL,,}" != "${CRM_TENANT_B_EMAIL,,}"
          test "${#SANAD_SERVICE_AUTH_JWT_SECRET}" -ge 32

      - name: Build ephemeral credential bootstrap JAR
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -DskipTests package
          jar_path="$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' | sort | head -n 1)"
          test -n "$jar_path" && test -f "$jar_path"
          echo "CRM_BOOTSTRAP_JAR=$(realpath "$jar_path")" >> "$GITHUB_ENV"

      - name: Execute supported credential reconciliation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CRM_RECONCILIATION_EVIDENCE_DIR"
          python3 scripts/operations/crm_g1_credential_reconcile.py

      - name: Validate sanitized reconciliation evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$CRM_RECONCILIATION_EVIDENCE_DIR/credential-reconciliation.json"
          jq -e '.result == "PASS" and .accountsReconciled == 2 and .distinctTenants == 2 and .bootstrapDisabled == true and .bootstrapSecretsCleared == true' "$evidence" >/dev/null
          for value in \
            "$PROD_JDBC_URL" "$PROD_DB_USER" "$PROD_DB_PASSWORD" \
            "$CRM_TENANT_A_EMAIL" "$CRM_TENANT_A_PASSWORD" \
            "$CRM_TENANT_B_EMAIL" "$CRM_TENANT_B_PASSWORD" \
            "$SANAD_SERVICE_AUTH_JWT_SECRET"; do
            if grep -R -Fq -- "$value" "$CRM_RECONCILIATION_EVIDENCE_DIR"; then
              echo '::error::Protected value leaked into reconciliation evidence'
              exit 1
            fi
          done

      - name: Upload immutable credential reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: crm-009-auth-reconciliation-${{ github.run_id }}
          path: ${{ runner.temp }}/crm-009-credential-reconciliation
          if-no-files-found: error
          retention-days: 90
