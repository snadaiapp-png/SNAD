name: Final Fix v3

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "final" to confirm'
        required: true
        default: ''
        type: string
      admin_password:
        description: 'Admin password'
        required: false
        default: '@Snad@2026'
        type: string

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    if: github.event.inputs.confirm == 'final'
    steps:
      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          pip3 install bcrypt > /dev/null 2>&1

      - name: Generate hash
        id: bcrypt
        env:
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
        run: |
          HASH=$(python3 -c "import bcrypt,sys; print(bcrypt.hashpw(sys.argv[1].encode(),bcrypt.gensalt(10)).decode())" "$ADMIN_PASSWORD")
          echo "::add-mask::$HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Inspect and fix DB
        env:
          PROD_JDBC_URL: ${{ secrets.PROD_JDBC_URL }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          CONTROL_PLANE_TENANT_ID: ${{ secrets.CONTROL_PLANE_TENANT_ID }}
          ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          PASSWORD_HASH: ${{ steps.bcrypt.outputs.hash }}
        run: |
          set -euo pipefail
          JDBC_URL="$PROD_JDBC_URL"
          CONN_STR="${JDBC_URL#jdbc:postgresql://}"
          HOST_PORT="${CONN_STR%%/*}"
          HOST="${HOST_PORT%%:*}"
          PORT="${HOST_PORT##*:}"
          DB_PART="${CONN_STR#*/}"
          DB_NAME="${DB_PART%%\?*}"

          echo "Tenant ID: $CONTROL_PLANE_TENANT_ID"
          echo "Admin email: $ADMIN_EMAIL"

          # Write SQL using psql variable substitution
          cat > /tmp/fix.sql << 'SQLEOF'
          \set tenant_id '\'' :tenant_id '\''
          \set admin_email '\'' :admin_email '\''
          \set pwd_hash '\'' :pwd_hash '\''
          SET search_path TO public;
          SELECT '=== ALL USERS ===' AS info;
          SELECT id, tenant_id, email, status FROM users;
          SELECT '=== ALL TENANTS ===' AS info;
          SELECT id, name, subdomain, status FROM tenants;
          SELECT '=== ALL ROLES ===' AS info;
          SELECT id, tenant_id, code, status FROM roles;
          SELECT '=== CREATE/UPDATE ADMIN ===' AS info;
          INSERT INTO tenants (id, name, subdomain, status, created_at, updated_at)
          SELECT :tenant_id::uuid, 'SNAD Control Plane', 'control-plane', 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
          WHERE NOT EXISTS (SELECT 1 FROM tenants WHERE id = :tenant_id::uuid);
          INSERT INTO roles (id, tenant_id, code, name, description, status, created_at, updated_at)
          SELECT gen_random_uuid(), :tenant_id::uuid, 'ADMIN', 'Administrator', 'Full access', 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
          WHERE NOT EXISTS (SELECT 1 FROM roles WHERE tenant_id = :tenant_id::uuid AND code = 'ADMIN');
          INSERT INTO role_capabilities (id, tenant_id, role_id, capability_id, created_at)
          SELECT gen_random_uuid(), r.tenant_id, r.id, ac.id, CURRENT_TIMESTAMP
          FROM roles r CROSS JOIN access_capabilities ac
          WHERE r.tenant_id = :tenant_id::uuid AND r.code = 'ADMIN' AND ac.status = 'ACTIVE'
            AND NOT EXISTS (SELECT 1 FROM role_capabilities rc WHERE rc.tenant_id = r.tenant_id AND rc.role_id = r.id AND rc.capability_id = ac.id);
          INSERT INTO users (id, tenant_id, email, display_name, status, password_hash, created_at, updated_at)
          SELECT gen_random_uuid(), :tenant_id::uuid, :admin_email, 'SNAD Admin', 'ACTIVE', :pwd_hash, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
          WHERE NOT EXISTS (SELECT 1 FROM users WHERE email = :admin_email);
          UPDATE users SET password_hash = :pwd_hash, status = 'ACTIVE', updated_at = CURRENT_TIMESTAMP WHERE email = :admin_email;
          INSERT INTO user_role_assignments (id, tenant_id, user_id, role_id, organization_id, status, created_at, updated_at)
          SELECT gen_random_uuid(), u.tenant_id, u.id, r.id, NULL, 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
          FROM users u JOIN roles r ON r.tenant_id = u.tenant_id AND r.code = 'ADMIN'
          WHERE u.email = :admin_email
            AND NOT EXISTS (SELECT 1 FROM user_role_assignments ura WHERE ura.tenant_id = u.tenant_id AND ura.user_id = u.id AND ura.role_id = r.id);
          SELECT '=== VERIFY ===' AS info;
          SELECT id, tenant_id, email, status, (password_hash IS NOT NULL) AS has_pwd FROM users WHERE email = :admin_email;
          SELECT count(*) AS admin_caps FROM role_capabilities rc JOIN roles r ON r.id = rc.role_id WHERE r.code = 'ADMIN';
          SELECT count(*) AS role_assigns FROM user_role_assignments ura JOIN users u ON u.id = ura.user_id WHERE u.email = :admin_email;
          SQLEOF

          for attempt in 1 2 3 4 5; do
            if PGPASSWORD="$PROD_DB_PASSWORD" psql -h "$HOST" -p "$PORT" -U "$PROD_DB_USER" -d "$DB_NAME" \
              -v tenant_id="$CONTROL_PLANE_TENANT_ID" \
              -v admin_email="$ADMIN_EMAIL" \
              -v pwd_hash="$PASSWORD_HASH" \
              -f /tmp/fix.sql; then
              echo "✓ Done!"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Test login
        env:
          ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
        run: |
          echo "=== Login ==="
          curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
            -H "Content-Type: application/json" -H "Origin: https://snad-app.vercel.app" \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            -w "\nHTTP %{http_code}\n" | head -c 500
