name: Render Deploy Status Quick Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Quick status check
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 3
    steps:
      - name: Check deploy status
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          BASE="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"
          
          echo "=== Service status ==="
          curl -s --max-time 30 -H "$AUTH" "$BASE" | jq '{status, suspended: (.suspended // "unknown"), activeInstances: .serviceDetails.activeInstances}'
          
          echo ""
          echo "=== Latest 5 deploys ==="
          curl -s --max-time 30 -H "$AUTH" "$BASE/deploys?limit=5" | jq -r '.[]? | "  id=\(.id) status=\(.status) created=\(.createdAt // .created // "?") finished=\(.finishedAt // .finished // "?")"'
          
          echo ""
          echo "=== Health probe ==="
          curl -s -o /tmp/health.json -w "HTTP=%{http_code}\n" --max-time 20 "https://sanad-backend-mcrj.onrender.com/actuator/health" || echo "HTTP=000"
          cat /tmp/health.json 2>/dev/null || echo "(no body)"
