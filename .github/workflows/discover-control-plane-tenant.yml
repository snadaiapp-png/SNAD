name: Discover Control Plane Tenant (One-Time)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Fetch DB credentials from Render and discover tenant
        shell: bash
        run: |
          set -euo pipefail
          # Fetch env vars from Render
          RENDER_ENV=$(curl --silent --show-error \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100")

          DATABASE_URL=$(echo "$RENDER_ENV" | jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "DATABASE_URL") | .value // empty')
          DATABASE_PASSWORD=$(echo "$RENDER_ENV" | jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "DATABASE_PASSWORD") | .value // empty')
          DATABASE_USERNAME=$(echo "$RENDER_ENV" | jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "DATABASE_USERNAME") | .value // empty')

          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL not found"; exit 1; }
          test -n "$DATABASE_PASSWORD" || { echo "::error::DATABASE_PASSWORD not found"; exit 1; }
          test -n "$DATABASE_USERNAME" || { echo "::error::DATABASE_USERNAME not found"; exit 1; }

          # Parse DATABASE_URL (format: jdbc:postgresql://host:port/db?params)
          RAW_URL="$DATABASE_URL"
          RAW_URL="${RAW_URL#jdbc:}"
          RAW_URL="${RAW_URL#postgresql://}"
          RAW_URL="${RAW_URL#https://}"
          HOST_PORT="${RAW_URL%%/*}"
          DB_PART="${RAW_URL#*/}"
          DB_NAME="${DB_PART%%\?*}"
          PGHOST="${HOST_PORT%%:*}"
          PGPORT="${HOST_PORT#*:}"
          PGPORT="${PGPORT:-5432}"

          echo "::add-mask::$DATABASE_USERNAME"
          echo "::add-mask::$DATABASE_PASSWORD"
          echo "Connecting to: host=$PGHOST port=$PGPORT dbname=$DB_NAME"

          # Query for authoritative control plane tenant
          TENANT_ID=$(PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h "$PGHOST" -p "$PGPORT" -U "$DATABASE_USERNAME" -d "$DB_NAME" \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="SELECT t.id FROM tenants t WHERE t.name = 'SNAD Control Plane' AND t.subdomain = 'control-plane' AND t.status = 'ACTIVE' AND EXISTS (SELECT 1 FROM roles r WHERE r.tenant_id = t.id AND r.code = 'ADMIN' AND r.status = 'ACTIVE');")

          echo "::add-mask::$TENANT_ID"
          echo "TENANT_DISCOVERED=$TENANT_ID" >> "$GITHUB_ENV"

          if [ -z "$TENANT_ID" ]; then
            echo "::error::No matching Control Plane tenant found"
            exit 1
          fi

          echo "AUTHORITATIVE_CONTROL_PLANE_TENANT_ID found and masked."

      - name: Set SANAD_CONTROL_PLANE_TENANT_ID in Render
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg value "$TENANT_DISCOVERED" '{value:$value}' > /tmp/env-update.json
          curl --fail-with-body --silent --show-error --max-time 45 \
            -X PUT \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data @/tmp/env-update.json \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/SANAD_CONTROL_PLANE_TENANT_ID" \
            > /tmp/env-response.json
          echo "SANAD_CONTROL_PLANE_TENANT_ID updated in Render"
          jq '{key: .envVar.key, value_present: ((.envVar.value // "") | length > 0)}' /tmp/env-response.json

      - name: Verify the tenant ID was set
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 45 \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/SANAD_CONTROL_PLANE_TENANT_ID" \
            > /tmp/verify.json
          VALUE=$(jq -r '(.envVar // .).value // empty' /tmp/verify.json)
          echo "::add-mask::$VALUE"
          if [ "$VALUE" = "$TENANT_DISCOVERED" ]; then
            echo "VERIFIED: SANAD_CONTROL_PLANE_TENANT_ID matches authoritative DB tenant"
          else
            echo "::error::SANAD_CONTROL_PLANE_TENANT_ID does not match"
            exit 1
          fi
