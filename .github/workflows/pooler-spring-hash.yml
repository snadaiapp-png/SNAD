name: POOLER + Spring Hash + Login

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "go" to confirm'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    if: github.event.inputs.confirm == 'go'
    steps:
      - name: Install JDK + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jdk
          pip3 install psycopg2-binary

      - name: Download jars
        run: |
          curl -sS -L -o /tmp/spring-security-crypto.jar "https://repo1.maven.org/maven2/org/springframework/security/spring-security-crypto/6.3.1/spring-security-crypto-6.3.1.jar"
          curl -sS -L -o /tmp/spring-jcl.jar "https://repo1.maven.org/maven2/org/springframework/spring-jcl/6.1.6/spring-jcl-6.1.6.jar"

      - name: Generate Spring Security BCrypt hash
        id: hash
        run: |
          python3 -c "
          with open('/tmp/GenHash.java', 'w') as f:
              f.write('import org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;\n')
              f.write('public class GenHash {\n')
              f.write('    public static void main(String[] args) {\n')
              f.write('        BCryptPasswordEncoder encoder = new BCryptPasswordEncoder(10);\n')
              f.write('        String hash = encoder.encode(\"SNad@2026\");\n')
              f.write('        System.out.println(hash);\n')
              f.write('    }\n')
              f.write('}\n')
          "
          javac -cp /tmp/spring-security-crypto.jar:/tmp/spring-jcl.jar /tmp/GenHash.java -d /tmp/
          HASH=$(java -cp /tmp:/tmp/spring-security-crypto.jar:/tmp/spring-jcl.jar GenHash)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Suspend backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Suspend: %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/suspend" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" || true
          sleep 15

      - name: Insert via POOLER with user's project credentials
        env:
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import psycopg2, os, sys

          # Use the POOLER (accessible from GitHub Actions)
          # with the user's EXACT project ref
          host = "aws-0-eu-central-1.pooler.supabase.com"
          port = "5432"
          database_name = "postgres"
          user = "postgres.hxhvfqxzigrqoxxnnzje"
          password = "Senen@001985"
          admin_email = "admin@snad.ai"
          tenant_id = "958bbb1c-eece-4839-bca8-a5bfa14e6ac1"
          hash_val = os.environ['HASH']

          print(f"Connecting via POOLER to project hxhvfqxzigrqoxxnnzje", file=sys.stderr)

          for attempt in range(5):
              try:
                  conn = psycopg2.connect(host=host, port=port, dbname=database_name,
                                          user=user, password=password, sslmode='require')
                  break
              except Exception as e:
                  print(f"Attempt {attempt+1}: {e}", file=sys.stderr)
                  if attempt < 4: import time; time.sleep(10)
                  else: raise

          cur = conn.cursor()

          # Find ALL tables
          cur.execute("SELECT schemaname, tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename")
          tables = [(r[0], r[1]) for r in cur.fetchall()]
          print(f"Tables in public ({len(tables)}):", file=sys.stderr)
          for s, t in tables[:20]:
              print(f"  {s}.{t}", file=sys.stderr)

          # Check for users table
          has_users = any(t == 'users' for _, t in tables)
          print(f"Has 'users' table: {has_users}", file=sys.stderr)

          if has_users:
              cur.execute("SELECT id, email, status FROM public.users WHERE email = %s", (admin_email,))
              existing = cur.fetchone()
              print(f"Existing: {existing}", file=sys.stderr)

              cur.execute("UPDATE public.users SET password_hash = %s, status = 'ACTIVE', updated_at = CURRENT_TIMESTAMP WHERE email = %s",
                          (hash_val, admin_email))
              print(f"Updated: {cur.rowcount} rows", file=sys.stderr)
          else:
              print("No users table - listing ALL tables:", file=sys.stderr)
              cur.execute("SELECT schemaname, tablename FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema') ORDER BY schemaname, tablename")
              for r in cur.fetchall():
                  print(f"  {r[0]}.{r[1]}", file=sys.stderr)

          conn.commit()
          cur.close()
          conn.close()
          print("Done!", file=sys.stderr)
          PYEOF

      - name: Resume backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Resume: %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/resume" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" || true

      - name: Wait for health + warmup
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://sanad-backend-mcrj.onrender.com/actuator/health" 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then echo "UP!"; break; fi
            sleep 10
          done
          echo "Waiting 90s..."
          sleep 90

      - name: Test login
        run: |
          for i in 1 2 3 4 5; do
            RESULT=$(curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
              -H "Content-Type: application/json" \
              -d '{"email":"admin@snad.ai","password":"SNad@2026"}' \
              -w "\n%{http_code}" 2>/dev/null || echo "timeout\n000")
            CODE=$(echo "$RESULT" | tail -1)
            echo "Login $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "🎉 LOGIN SUCCESSFUL!"; exit 0; fi
            sleep 30
          done
          echo "❌ Login failed"
