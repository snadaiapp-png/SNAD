# REM-P0-006 Internal Technical Security Verification
name: Internal Technical Security Verification
#
# GOVERNANCE NOTE — DEC-SEC-CERT-REVOCATION-REM-P0-006-001 (2026-10-24):
# Project-wide decision DEC-SEC-ASSURANCE-REQUIREMENTS-REVOCATION-2026-10-25-001:
# Independent reviewer/assessor appointment and certificate issuance are not internal
# project-completion requirements. The readiness job remains an evidence-integrity check.
# The closure job is a manual, optional legacy path only; it is not a required check and
# must never be treated as a project/module completion prerequisite. Technical security
# controls and standing release holds remain governed by their own policies.

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/security/independent-assurance/**'
      - 'docs/governance/SANAD-GOV-SEC-SELF-ASSESSMENT-EXCEPTION-POLICY.md'
      - 'scripts/ci/validate_independent_security_assurance.py'
      - 'scripts/ci/validate_trust_policy.py'
      - 'scripts/ci/verify_rem_p0_006_runtime_trust.py'
      - 'tests/ci/test_validate_independent_security_assurance.py'
      - 'tests/ci/test_validate_trust_policy.py'
      - 'tests/ci/test_verify_rem_p0_006_runtime_trust.py'
      - '.github/workflows/independent-security-assurance.yml'
  workflow_dispatch:
    inputs:
      gate_mode:
        description: 'readiness validates internal evidence; closure is an optional manual legacy path and never a project-completion prerequisite'
        required: true
        type: choice
        default: readiness
        options:
          - readiness
          - closure
      release_sha:
        description: 'Exact assessed release SHA; mandatory for closure mode'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rem-p0-006-${{ github.event_name }}-${{ github.ref }}-${{ inputs.gate_mode || 'readiness' }}
  cancel-in-progress: false

jobs:
  readiness:
    name: REM-P0-006 Readiness Validation
    if: ${{ github.event_name == 'pull_request' || inputs.gate_mode == 'readiness' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test fail-closed validator
        run: python3 -m unittest tests/ci/test_validate_independent_security_assurance.py -v

      - name: Test closure workflow integrity
        run: python3 -m unittest tests/ci/test_rem_p0_006_workflow_integrity.py -v

      - name: Test trust policy validator
        run: python3 -m unittest tests/ci/test_validate_trust_policy.py -v

      - name: Test runtime trust verifier
        run: python3 -m unittest tests/ci/test_verify_rem_p0_006_runtime_trust.py -v

      - name: Validate readiness package and assessed release reference
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('docs/security/independent-assurance/assessment-manifest.json').read_text())
          print(data.get('assessed_release', {}).get('repository_sha', ''))
          PY
          )"
          args=(--mode readiness)
          if [[ -n "$release_sha" ]]; then
            [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid assessed release SHA"; exit 1; }
            git cat-file -e "${release_sha}^{commit}"
            git merge-base --is-ancestor "$release_sha" HEAD
            args+=(--expected-release-sha "$release_sha")
          fi
          python3 scripts/ci/validate_independent_security_assurance.py "${args[@]}"

      - name: Publish temporary external-assurance deferral boundary
        if: always()
        run: |
          {
            echo '## Internal Technical Security Verification'
            echo ''
            echo '- Independent reviewer appointment and certificate issuance are not project-completion requirements under the current project-wide governance decision.'
            echo '- Internal reviews and attestations during development are internal only; they are not independent or accredited certification.'
            echo '- This deferral does not waive mandatory legal, regulatory, contractual, customer, scheme-specific, incident-response, or release-gate requirements.'
            echo '- The manual closure job is an optional legacy path, not a required check or completion prerequisite; if used, its own technical trust and evidence checks remain fail-closed.'
            echo '- This workflow does not close REM-P0-006 or lift P0/G1/NO DEPLOY/PAYMENTS holds; technical verification and release gates remain in force.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish readiness boundary
        if: always()
        run: |
          {
            echo '## REM-P0-006 Readiness Boundary'
            echo ''
            echo "- Tested repository ref: ${{ github.sha }}"
            echo '- This job validates package structure, cross-file reconciliation and evidence integrity.'
            echo '- It does not appoint an assessor, authorize active testing, approve residual risk or close REM-P0-006.'
            echo '- Broad commercial go-live remains NOT_APPROVED.'
          } >> "$GITHUB_STEP_SUMMARY"

  closure:
    name: REM-P0-006 Environment-Gated Closure Validation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gate_mode == 'closure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: rem-p0-006-closure
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cryptographic OIDC verifier
        run: python3 -m pip install 'PyJWT[crypto]>=2.8,<3'

      - name: Enforce configured closure authority, main branch and exact release
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CLOSURE_AUTHORITY_TOKEN: ${{ secrets.REM_P0_006_CLOSURE_AUTHORITY_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$CLOSURE_AUTHORITY_TOKEN" ]] || { echo '::error::The rem-p0-006-closure environment authority secret is not configured'; exit 1; }
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo '::error::Closure mode is allowed only on main'; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Closure requires an exact 40-character release SHA'; exit 1; }
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" "$GITHUB_SHA"

      - name: Test fail-closed validator
        run: python3 -m unittest tests/ci/test_validate_independent_security_assurance.py -v

      - name: Test closure workflow integrity
        run: python3 -m unittest tests/ci/test_rem_p0_006_workflow_integrity.py -v

      - name: Test trust policy validator
        run: python3 -m unittest tests/ci/test_validate_trust_policy.py -v

      - name: Verify live OIDC, protected environment and signed SHA range
        id: runtime-trust
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          GITHUB_ENVIRONMENT_AUDIT_TOKEN: ${{ secrets.REM_P0_006_ENVIRONMENT_AUDIT_TOKEN }}
          CLOSURE_AUTHORITY_TOKEN: ${{ secrets.REM_P0_006_CLOSURE_AUTHORITY_TOKEN }}
          REM_P0_006_ALLOWED_SIGNER_FINGERPRINTS: ${{ vars.REM_P0_006_ALLOWED_SIGNER_FINGERPRINTS }}
          REM_P0_006_ALLOWED_ENVIRONMENT_REVIEWER_LOGINS: ${{ vars.REM_P0_006_ALLOWED_ENVIRONMENT_REVIEWER_LOGINS }}
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_rem_p0_006_runtime_trust.py

      - name: Validate policy from cryptographically verified runtime claims
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          OIDC_ISSUER: ${{ steps.runtime-trust.outputs.oidc_issuer }}
          OIDC_AUDIENCE: ${{ steps.runtime-trust.outputs.oidc_audience }}
          OIDC_SUBJECT: ${{ steps.runtime-trust.outputs.oidc_subject }}
          REPOSITORY_OWNER: ${{ steps.runtime-trust.outputs.repository_owner }}
          REPOSITORY_NAME: ${{ steps.runtime-trust.outputs.repository_name }}
          HEAD_SHA: ${{ steps.runtime-trust.outputs.head_sha }}
          ENVIRONMENT_NAME: ${{ steps.runtime-trust.outputs.environment_name }}
          REF_NAME: ${{ steps.runtime-trust.outputs.ref }}
          REM_P0_006_ALLOWED_SIGNER_FINGERPRINTS: ${{ vars.REM_P0_006_ALLOWED_SIGNER_FINGERPRINTS }}
        run: |
          set -euo pipefail
          python3 scripts/ci/validate_trust_policy.py \
            --mode closure \
            --oidc-issuer "$OIDC_ISSUER" \
            --oidc-audience "$OIDC_AUDIENCE" \
            --oidc-subject "$OIDC_SUBJECT" \
            --repository-owner "$REPOSITORY_OWNER" \
            --repository-name "$REPOSITORY_NAME" \
            --head-sha "$HEAD_SHA" \
            --assessed-release-sha "$RELEASE_SHA" \
            --environment-name "$ENVIRONMENT_NAME" \
            --is-protected-environment \
            --authority-token-present \
            --ref "$REF_NAME"

      - name: Validate canonical evidence package without mutation
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          # Closure must evaluate evidence that already exists in the repository.
          # This workflow must never manufacture evidence, approvals, findings, or PASS states.
          python3 scripts/ci/validate_independent_security_assurance.py \
            --mode closure \
            --expected-release-sha "$RELEASE_SHA" \
            --manifest docs/security/independent-assurance/assessment-manifest.json

      - name: Assert closure workflow did not mutate governance evidence
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- docs/security/independent-assurance; then
            echo "::error::Closure workflow mutated the canonical governance evidence package"
            git diff -- docs/security/independent-assurance
            exit 1
          fi
          echo "Canonical evidence package remained unchanged."

      - name: Publish closure boundary
        if: always()
        run: |
          {
            echo '## REM-P0-006 Environment-Gated Closure Validation'
            echo ''
            echo "- Package SHA: ${{ github.sha }}"
            echo "- Assessed release SHA input: ${{ inputs.release_sha }}"
            echo "- Canonical evidence package: validated in place; no runtime package was generated"
            echo '- This manual legacy path requires the rem-p0-006-closure GitHub Environment and its authority secret only if explicitly run; it is not a required project-completion check.'
            echo '- This workflow validates existing evidence only; it does not manufacture evidence, approve findings, set ACCEPTED, persist a runtime package, merge with admin override, or close governance issues.'
            echo '- A successful validation run is not itself the formal closure decision.'
            echo '- P0 remains on hold until the separately authorized, evidence-backed governance decision is recorded.'
          } >> "$GITHUB_STEP_SUMMARY"
