# REM-P0-006 Independent Security Assurance Gate
name: Independent Security Assurance Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/security/independent-assurance/**'
      - 'scripts/ci/validate_independent_security_assurance.py'
      - 'scripts/ci/validate_trust_policy.py'
      - 'scripts/ci/verify_rem_p0_006_crypto.py'
      - 'tests/ci/test_validate_independent_security_assurance.py'
      - 'tests/ci/test_validate_trust_policy.py'
      - 'tests/ci/test_verify_rem_p0_006_crypto.py'
      - 'tests/ci/test_rem_p0_006_workflow_integrity.py'
      - '.github/workflows/independent-security-assurance.yml'
  workflow_dispatch:
    inputs:
      gate_mode:
        description: 'readiness validates the package; closure requires the environment-gated main-branch decision gate'
        required: true
        type: choice
        default: readiness
        options:
          - readiness
          - closure
      release_sha:
        description: 'Exact assessed release SHA; mandatory for closure mode'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rem-p0-006-${{ github.event_name }}-${{ github.ref }}-${{ inputs.gate_mode || 'readiness' }}
  cancel-in-progress: false

jobs:
  readiness:
    name: REM-P0-006 Readiness Validation
    if: ${{ github.event_name == 'pull_request' || inputs.gate_mode == 'readiness' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cryptographic verifier dependency
        run: python3 -m pip install --disable-pip-version-check 'PyJWT[crypto]>=2.8,<3'

      - name: Test fail-closed validator
        run: python3 -m unittest tests/ci/test_validate_independent_security_assurance.py -v

      - name: Test closure workflow integrity
        run: python3 -m unittest tests/ci/test_rem_p0_006_workflow_integrity.py -v

      - name: Test trust policy validator
        run: python3 -m unittest tests/ci/test_validate_trust_policy.py -v

      - name: Test cryptographic OIDC and Git signature verifier
        run: python3 -m unittest tests/ci/test_verify_rem_p0_006_crypto.py -v

      - name: Validate readiness package and assessed release reference
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('docs/security/independent-assurance/assessment-manifest.json').read_text())
          print(data.get('assessed_release', {}).get('repository_sha', ''))
          PY
          )"
          args=(--mode readiness)
          if [[ -n "$release_sha" ]]; then
            [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid assessed release SHA"; exit 1; }
            git cat-file -e "${release_sha}^{commit}"
            git merge-base --is-ancestor "$release_sha" HEAD
            args+=(--expected-release-sha "$release_sha")
          fi
          python3 scripts/ci/validate_independent_security_assurance.py "${args[@]}"

      - name: Publish readiness boundary
        if: always()
        run: |
          {
            echo '## REM-P0-006 Readiness Boundary'
            echo ''
            echo "- Tested repository ref: ${{ github.sha }}"
            echo '- This job validates package structure, cross-file reconciliation and evidence integrity.'
            echo '- It does not appoint an assessor, authorize active testing, approve residual risk or close REM-P0-006.'
            echo '- Broad commercial go-live remains NOT_APPROVED.'
          } >> "$GITHUB_STEP_SUMMARY"

  closure:
    name: REM-P0-006 Environment-Gated Closure Validation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.gate_mode == 'closure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: rem-p0-006-closure
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cryptographic verifier dependency
        run: python3 -m pip install --disable-pip-version-check 'PyJWT[crypto]>=2.8,<3'

      - name: Enforce configured closure authority, main branch and exact release
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          CLOSURE_AUTHORITY_TOKEN: ${{ secrets.REM_P0_006_CLOSURE_AUTHORITY_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$CLOSURE_AUTHORITY_TOKEN" ]] || { echo '::error::The rem-p0-006-closure environment authority secret is not configured'; exit 1; }
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || { echo '::error::Closure mode is allowed only on main'; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Closure requires an exact 40-character release SHA'; exit 1; }
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" "$GITHUB_SHA"

      - name: Test fail-closed validator
        run: python3 -m unittest tests/ci/test_validate_independent_security_assurance.py -v

      - name: Test closure workflow integrity
        run: python3 -m unittest tests/ci/test_rem_p0_006_workflow_integrity.py -v

      - name: Test trust policy validator
        run: python3 -m unittest tests/ci/test_validate_trust_policy.py -v

      - name: Test cryptographic OIDC and Git signature verifier
        run: python3 -m unittest tests/ci/test_verify_rem_p0_006_crypto.py -v

      - name: Verify OIDC JWT and assessed commit signatures cryptographically
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_rem_p0_006_crypto.py \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha "$RELEASE_SHA" \
            --head-sha "$GITHUB_SHA" \
            --environment rem-p0-006-closure

      - name: Fail closed until validator consumes verified trust evidence
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          # The independent cryptographic preflight above is necessary but not sufficient.
          # The canonical policy validator still has no verified-evidence handoff contract;
          # until that contract is implemented, closure must fail closed rather than accept
          # caller-supplied claim strings or boolean signature assertions.
          python3 scripts/ci/validate_trust_policy.py \
            --mode closure \
            --head-sha "$GITHUB_SHA" \
            --assessed-release-sha "$RELEASE_SHA" \
            --environment-name "rem-p0-006-closure" \
            --ref "$GITHUB_REF"

      - name: Validate canonical evidence package without mutation
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/validate_independent_security_assurance.py \
            --mode closure \
            --expected-release-sha "$RELEASE_SHA" \
            --manifest docs/security/independent-assurance/assessment-manifest.json

      - name: Assert closure workflow did not mutate governance evidence
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- docs/security/independent-assurance; then
            echo "::error::Closure workflow mutated the canonical governance evidence package"
            git diff -- docs/security/independent-assurance
            exit 1
          fi
          echo "Canonical evidence package remained unchanged."

      - name: Publish closure boundary
        if: always()
        run: |
          {
            echo '## REM-P0-006 Environment-Gated Closure Validation'
            echo ''
            echo "- Package SHA: ${{ github.sha }}"
            echo "- Assessed release SHA input: ${{ inputs.release_sha }}"
            echo '- Canonical evidence package: validated in place; no runtime package was generated'
            echo '- This workflow requires the rem-p0-006-closure GitHub Environment and its authority secret.'
            echo '- This workflow validates existing evidence only; it does not manufacture evidence, approvals, or PASS states.'
            echo '- A successful validation run is not itself the formal closure decision.'
            echo '- P0 remains on hold until the separately authorized, evidence-backed governance decision is recorded.'
          } >> "$GITHUB_STEP_SUMMARY"
