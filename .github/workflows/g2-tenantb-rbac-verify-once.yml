name: G2 Tenant B RBAC Verify Once

on:
  push:
    branches:
      - chore/tenant-b-credential-sync-once

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
      TENANT_ID: 2c6149d8-e109-4ad5-9fbc-692327e675c2
      ADMIN_EMAIL: ${{ secrets.AUTH_SMOKE_TENANT_B_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.AUTH_SMOKE_TENANT_B_PASSWORD }}
    steps:
      - name: Verify Tenant B login and all G2 capabilities
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            -X POST "${BASE_URL%/}/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg e "$ADMIN_EMAIL" --arg p "$ADMIN_PASSWORD" --arg t "$TENANT_ID" '{email:$e,password:$p,tenantId:$t}')")
          token=$(jq -r '.accessToken // empty' <<<"$response")
          tenant=$(jq -r '.user.tenantId // empty' <<<"$response")
          test -n "$token"
          test "$tenant" = "$TENANT_ID"
          echo "::add-mask::$token"
          me=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $token" \
            "${BASE_URL%/}/api/v1/auth/me")
          for cap in \
            HRM.ATTENDANCE.SELF_RECORD HRM.ATTENDANCE.SELF_VIEW HRM.ATTENDANCE.TEAM_VIEW \
            HRM.ATTENDANCE.ADMIN HRM.ATTENDANCE.CORRECT HRM.LEAVE.SELF_REQUEST \
            HRM.LEAVE.SELF_VIEW HRM.LEAVE.TEAM_APPROVE HRM.LEAVE.HR_APPROVE \
            HRM.LEAVE.POLICY_ADMIN HRM.TIMESHEET.SELF_VIEW HRM.TIMESHEET.SELF_SUBMIT \
            HRM.TIMESHEET.TEAM_APPROVE; do
            jq -e --arg cap "$cap" '.capabilities | index($cap) != null' <<<"$me" >/dev/null
          done
          echo 'TENANT_B_LOGIN=PASS'
          echo 'G2_CAPABILITIES=13/13 PASS'
