name: Production Lifecycle Repository Secret Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Verify repository-level lifecycle inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail closed on required repository secrets
        shell: bash
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SANAD_ADMIN_EMAIL: ${{ secrets.SANAD_ADMIN_EMAIL }}
          CRM_SECOND_TENANT_BEARER_TOKEN: ${{ secrets.CRM_SMOKE_SECOND_TENANT_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in RESEND_API_KEY SANAD_ADMIN_EMAIL CRM_SECOND_TENANT_BEARER_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository-level secret: $name"
              missing=$((missing + 1))
            else
              echo "::add-mask::${!name}"
              echo "PRESENT: $name"
            fi
          done
          test "$missing" -eq 0 || exit 1
          case "${SANAD_ADMIN_EMAIL,,}" in
            *@gmail.com|*@googlemail.com) ;;
            *) echo '::error::SANAD_ADMIN_EMAIL is not a Gmail/Googlemail address; plus-address delivery cannot be assumed.'; exit 1 ;;
          esac
          echo 'REPOSITORY_LIFECYCLE_INPUTS=PASS'
