name: Insert with Spring Security Hash

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "insert" to confirm'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  insert:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    if: github.event.inputs.confirm == 'insert'
    steps:
      - name: Install JDK + deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq default-jdk > /dev/null 2>&1
          pip3 install psycopg2-binary > /dev/null 2>&1

      - name: Download Spring Security crypto jar
        run: |
          curl -sS -L -o /tmp/spring-security-crypto.jar "https://repo1.maven.org/maven2/org/springframework/security/spring-security-crypto/6.3.1/spring-security-crypto-6.3.1.jar"

      - name: Generate BCrypt hash using Spring Security's encoder
        id: hash
        run: |
          # Write Java file WITHOUT indentation
          printf 'import org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;\npublic class GenHash {\npublic static void main(String[] args) {\nBCryptPasswordEncoder encoder = new BCryptPasswordEncoder(10);\nString hash = encoder.encode("SNad@2026");\nSystem.out.println(hash);\nSystem.err.println("Verify: " + encoder.matches("SNad@2026", hash));\n}\n}\n' > /tmp/GenHash.java

          javac -cp /tmp/spring-security-crypto.jar /tmp/GenHash.java -d /tmp/
          HASH=$(java -cp /tmp:/tmp/spring-security-crypto.jar GenHash 2>/dev/null)
          echo "Hash: $HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Insert admin using Spring Security hash
        env:
          PROD_JDBC_URL: ${{ secrets.PROD_JDBC_URL }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          CONTROL_PLANE_TENANT_ID: ${{ secrets.CONTROL_PLANE_TENANT_ID }}
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import psycopg2
          import os
          import sys

          jdbc_url = os.environ['PROD_JDBC_URL']
          db_user = os.environ['PROD_DB_USER']
          db_pass = os.environ['PROD_DB_PASSWORD']
          tenant_id = os.environ['CONTROL_PLANE_TENANT_ID']
          hash_val = os.environ['HASH']
          admin_email = 'admin@snad.ai'

          print(f"Hash from Spring Security: {hash_val}", file=sys.stderr)

          conn_str = jdbc_url.replace('jdbc:postgresql://', '')
          host_port = conn_str.split('/')[0]
          host = host_port.split(':')[0]
          port = host_port.split(':')[1] if ':' in host_port else '5432'
          db_name = conn_str.split('/')[1].split('?')[0] if '/' in conn_str else 'postgres'

          conn = psycopg2.connect(host=host, port=port, dbname=db_name,
                                  user=db_user, password=db_pass, sslmode='require')
          cur = conn.cursor()

          # Update password for existing user
          cur.execute("UPDATE public.users SET password_hash = %s, status = 'ACTIVE', updated_at = CURRENT_TIMESTAMP WHERE email = %s",
                      (hash_val, admin_email))
          print(f"Updated: {cur.rowcount} rows", file=sys.stderr)

          conn.commit()
          cur.close()
          conn.close()
          print("Done!", file=sys.stderr)
          PYEOF

      - name: Test login
        run: |
          echo "=== Login test ==="
          curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@snad.ai","password":"SNad@2026"}' \
            -w "\nHTTP %{http_code}\n" 2>&1 || true
