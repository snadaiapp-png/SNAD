name: TEMP R0C12 Production Flyway Remediation

on:
  push:
    branches:
      - fix/r0c12-production-flyway-forward-reconciliation

permissions:
  contents: write

jobs:
  apply-exact-remediation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/r0c12-production-flyway-forward-reconciliation
          fetch-depth: 0

      - name: Import previously TDD-proven migration and regression guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/flyway-hrm-prerequisite-forward-reconciliation
          git show origin/fix/flyway-hrm-prerequisite-forward-reconciliation:apps/sanad-platform/src/main/resources/db/migration/V20260904_2__reconcile_hrm_platform_country_and_employer_prerequisites.sql > apps/sanad-platform/src/main/resources/db/migration/V20260904_2__reconcile_hrm_platform_country_and_employer_prerequisites.sql
          git show origin/fix/flyway-hrm-prerequisite-forward-reconciliation:apps/sanad-platform/src/test/java/com/sanad/platform/hr/foundation/HrmPlatformPrerequisiteFlywayOrderingTest.java > apps/sanad-platform/src/test/java/com/sanad/platform/hr/foundation/HrmPlatformPrerequisiteFlywayOrderingTest.java
          git rm apps/sanad-platform/src/main/resources/db/migration/V20260827_1__create_hrm_platform_country_and_employer_prerequisites.sql

      - name: Update current-main migration assertions without discarding later SCP changes
        shell: python
        run: |
          from pathlib import Path

          postgres = Path('apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmPostgresMigrationTest.java')
          text = postgres.read_text()
          old_constant = 'private static final String HRM_PLATFORM_PREREQUISITES_VERSION = "20260827.1";'
          new_constant = 'private static final String HRM_PLATFORM_PREREQUISITES_VERSION = "20260904.2";'
          assert text.count(old_constant) == 1
          text = text.replace(old_constant, new_constant, 1)

          old_early = (
              '                        MigrationVersion.fromVersion(PARTICIPANT_ROLE_EXCLUSIVITY_VERSION),\n'
              '                        MigrationVersion.fromVersion(HRM_PLATFORM_PREREQUISITES_VERSION),\n'
              '                        MigrationVersion.fromVersion(OWNER_EMAIL_CANONICALIZATION_VERSION),\n'
          )
          new_early = (
              '                        MigrationVersion.fromVersion(PARTICIPANT_ROLE_EXCLUSIVITY_VERSION),\n'
              '                        MigrationVersion.fromVersion(OWNER_EMAIL_CANONICALIZATION_VERSION),\n'
          )
          assert text.count(old_early) == 2
          text = text.replace(old_early, new_early)

          old_forward = (
              '                        MigrationVersion.fromVersion(WORKFLOW_Y2_PRODUCTION_RECONCILIATION_VERSION),\n'
              '                        MigrationVersion.fromVersion(HR_PERSON_IDENTITY_SCHEMA_VERSION),\n'
          )
          new_forward = (
              '                        MigrationVersion.fromVersion(WORKFLOW_Y2_PRODUCTION_RECONCILIATION_VERSION),\n'
              '                        MigrationVersion.fromVersion(HRM_PLATFORM_PREREQUISITES_VERSION),\n'
              '                        MigrationVersion.fromVersion(HR_PERSON_IDENTITY_SCHEMA_VERSION),\n'
          )
          assert text.count(old_forward) == 2
          text = text.replace(old_forward, new_forward)
          postgres.write_text(text)

          history = Path('apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmFlywayHistoryAssertionTest.java')
          text = history.read_text()
          old_item = '            , "20260827.1"   // hrm-g0 ws1 platform country and employer prerequisites\n'
          assert text.count(old_item) == 1
          text = text.replace(old_item, '', 1)
          anchor = '            , "20260904.1"   // forward-only idempotent production reconciliation of the Y2 wave\n'
          forward_item = '            , "20260904.2"   // forward-only reconciliation of HRM-G0 WS1 platform prerequisites\n'
          assert text.count(anchor) == 1
          assert forward_item not in text
          text = text.replace(anchor, anchor + forward_item, 1)
          history.write_text(text)

      - name: Prove intended staged and net scope, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA=4c0098aa67371edf37fd095eaffe66eeb120c0dc
          WORKFLOW=.github/workflows/tmp-r0c12-production-flyway-remediation.yml

          git rm "$WORKFLOW"
          git add apps/sanad-platform/src/main/resources/db/migration/V20260904_2__reconcile_hrm_platform_country_and_employer_prerequisites.sql
          git add apps/sanad-platform/src/test/java/com/sanad/platform/hr/foundation/HrmPlatformPrerequisiteFlywayOrderingTest.java
          git add apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmPostgresMigrationTest.java
          git add apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmFlywayHistoryAssertionTest.java

          changed="$(git diff --cached --no-renames --name-only | sort)"
          expected_staged="$(printf '%s\n' \
            "$WORKFLOW" \
            'apps/sanad-platform/src/main/resources/db/migration/V20260827_1__create_hrm_platform_country_and_employer_prerequisites.sql' \
            'apps/sanad-platform/src/main/resources/db/migration/V20260904_2__reconcile_hrm_platform_country_and_employer_prerequisites.sql' \
            'apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmFlywayHistoryAssertionTest.java' \
            'apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmPostgresMigrationTest.java' \
            'apps/sanad-platform/src/test/java/com/sanad/platform/hr/foundation/HrmPlatformPrerequisiteFlywayOrderingTest.java' | sort)"
          printf '%s\n' '--- staged actual ---' "$changed" '--- staged expected ---' "$expected_staged"
          test "$changed" = "$expected_staged"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(flyway): forward-reconcile late HRM prerequisite on current main'

          net="$(git diff --no-renames --name-only "$BASE_SHA"...HEAD | sort)"
          expected_net="$(printf '%s\n' \
            'apps/sanad-platform/src/main/resources/db/migration/V20260827_1__create_hrm_platform_country_and_employer_prerequisites.sql' \
            'apps/sanad-platform/src/main/resources/db/migration/V20260904_2__reconcile_hrm_platform_country_and_employer_prerequisites.sql' \
            'apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmFlywayHistoryAssertionTest.java' \
            'apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmPostgresMigrationTest.java' \
            'apps/sanad-platform/src/test/java/com/sanad/platform/hr/foundation/HrmPlatformPrerequisiteFlywayOrderingTest.java' | sort)"
          printf '%s\n' '--- net actual ---' "$net" '--- net expected ---' "$expected_net"
          test "$net" = "$expected_net"
          ! git diff --no-renames --name-only "$BASE_SHA"...HEAD | grep -Fqx "$WORKFLOW"

          git push origin HEAD:fix/r0c12-production-flyway-forward-reconciliation
