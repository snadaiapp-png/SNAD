name: Restore Render DB env vars (Phase 5 fix)

# Restores the missing DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD on
# the Render service (root cause of update_failed deploys).
# Proven credential combination (Candidate B):
#   DATABASE_URL      = SPRING_DATASOURCE_URL      (Supabase pooler)
#   DATABASE_USERNAME = SPRING_DATASOURCE_USERNAME
#   DATABASE_PASSWORD = PRODUCTION_DATABASE_PASSWORD
# SAFETY: verifies creds with a READ-ONLY connection + SANAD schema presence
# check BEFORE writing anything to Render. No deploy in this workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    name: Verify SANAD DB creds + restore Render env vars
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 8
    steps:
      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null

      - name: Verify production DB credentials (read-only, SANAD schema check)
        id: verify
        env:
          DB_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          DB_USER: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          DB_PASS: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DB_URL"  || { echo "::error::SPRING_DATASOURCE_URL empty"; exit 1; }
          test -n "$DB_USER" || { echo "::error::SPRING_DATASOURCE_USERNAME empty"; exit 1; }
          test -n "$DB_PASS" || { echo "::error::PRODUCTION_DATABASE_PASSWORD empty"; exit 1; }
          PG_URL="${DB_URL#jdbc:}"
          echo "=== READ-ONLY connectivity ==="
          PGPASSWORD="$DB_PASS" psql "$PG_URL" -U "$DB_USER" -v ON_ERROR_STOP=1 -tAc "SELECT 1;"
          echo "=== SANAD schema presence (read-only) ==="
          TABLES=$(PGPASSWORD="$DB_PASS" psql "$PG_URL" -U "$DB_USER" -tAc "
            SELECT string_agg(table_name, ', ' ORDER BY table_name)
            FROM information_schema.tables
            WHERE table_schema='public' AND table_name IN
              ('flyway_schema_history','tenants','users','crm_accounts','crm_contacts');")
          echo "Core tables found: $TABLES"
          echo "$TABLES" | grep -q 'flyway_schema_history' || { echo "::error::Not SANAD DB (no flyway_schema_history)"; exit 1; }
          echo "$TABLES" | grep -q 'tenants' || { echo "::error::Not SANAD DB (no tenants)"; exit 1; }
          echo "=== Current Flyway head ==="
          PGPASSWORD="$DB_PASS" psql "$PG_URL" -U "$DB_USER" -tAc "SELECT version FROM flyway_schema_history WHERE success=true ORDER BY installed_rank DESC LIMIT 3;" || true
          echo "VERIFY=PASS" >> "$GITHUB_OUTPUT"

      - name: Set DATABASE_URL / USERNAME / PASSWORD on Render
        if: steps.verify.outputs.VERIFY == 'PASS'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DB_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          DB_USER: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          DB_PASS: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          BASE="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"
          set_env() {
            local key="$1" val="$2"
            jq -n --arg value "$val" '{value:$value}' > /tmp/body.json
            curl -s --fail-with-body --max-time 45 -X PUT \
              -H "$AUTH" -H 'Accept: application/json' -H 'Content-Type: application/json' \
              --data @/tmp/body.json "$BASE/env-vars/$key" > /tmp/resp.json
            echo "Set $key -> OK"
          }
          set_env DATABASE_URL "$DB_URL"
          set_env DATABASE_USERNAME "$DB_USER"
          set_env DATABASE_PASSWORD "$DB_PASS"
          echo "=== Verify env vars now present on Render ==="
          for key in DATABASE_URL DATABASE_USERNAME DATABASE_PASSWORD; do
            v=$(curl -s --max-time 30 -H "$AUTH" "$BASE/env-vars/$key" | jq -r '(.envVar // .).value // empty')
            [ -n "$v" ] && echo "$key = PRESENT (len=${#v})" || { echo "::error::$key still MISSING"; exit 1; }
          done
          echo "RESTORE=COMPLETE"
