name: Flyway production migrate (apply pending)

# Applies the pending Flyway migrations (V20260716.1 -> V20260813.1, including
# G7 V20260812_1/2/3) to the sanad-production-v2 database so that the backend's
# validate-on-migrate passes and startup succeeds. All migrations are additive
# and idempotent (CREATE TABLE IF NOT EXISTS / ADD COLUMN IF NOT EXISTS).
# validateOnMigrate=false here to force the apply past the pending-gap failure.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Apply pending migrations to production
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 12
    steps:
      - name: Checkout migrations
        uses: actions/checkout@v4

      - name: Flyway migrate (portable + vendor locations)
        env:
          DB_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          DB_USER: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          DB_PASS: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
        run: |
          set -euo pipefail
          MIGRATIONS="$(pwd)/apps/sanad-platform/src/main/resources/db/migration"
          VENDOR="$(pwd)/apps/sanad-platform/src/main/resources/db/vendor/postgresql"
          echo "=== INFO BEFORE ==="
          docker run --rm \
            -v "$MIGRATIONS:/flyway/sql:ro" \
            -v "$VENDOR:/flyway/vendorpg:ro" \
            flyway/flyway:10 \
            -url="$DB_URL" -user="$DB_USER" -password="$DB_PASS" \
            -connectRetries=8 -table=flyway_schema_history \
            -locations="filesystem:/flyway/sql,filesystem:/flyway/vendorpg" \
            info
          echo ""
          echo "=== MIGRATE (apply pending) ==="
          docker run --rm \
            -v "$MIGRATIONS:/flyway/sql:ro" \
            -v "$VENDOR:/flyway/vendorpg:ro" \
            flyway/flyway:10 \
            -url="$DB_URL" -user="$DB_USER" -password="$DB_PASS" \
            -connectRetries=8 -table=flyway_schema_history \
            -locations="filesystem:/flyway/sql,filesystem:/flyway/vendorpg" \
            -validateOnMigrate=false -baselineOnMigrate=false \
            migrate
          echo ""
          echo "=== INFO AFTER (expect schema version at latest, no pending) ==="
          docker run --rm \
            -v "$MIGRATIONS:/flyway/sql:ro" \
            -v "$VENDOR:/flyway/vendorpg:ro" \
            flyway/flyway:10 \
            -url="$DB_URL" -user="$DB_USER" -password="$DB_PASS" \
            -connectRetries=8 -table=flyway_schema_history \
            -locations="filesystem:/flyway/sql,filesystem:/flyway/vendorpg" \
            info
