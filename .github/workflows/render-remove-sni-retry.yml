name: Render Remove SNI Factory + Retry Deploy

# Discovery: SNI factory actually HURTS — when pgJDBC sends SNI=project_ref,
# Supavisor tries to match it as a hostname, fails, and doesn't fall back to
# the username's external_id. Result: ENOIDENTIFIER despite correct username.
#
# Without SNI factory: Supavisor uses the username's external_id directly.
# This is intermittent (~25-33% success rate) but works sometimes.
#
# Fix:
#   1. Remove sslfactory= and sslfactoryarg= from DATABASE_URL + SPRING_FLYWAY_URL
#   2. Retry deploy up to 5 times — wait for intermittent success
#   3. On each retry, capture live logs to detect success/failure
#   4. If HEALTH=UP at any point, stop and declare success

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'remove-sni-retry' to confirm"
        required: true
        default: "no"
      max_retries:
        description: "Max retry attempts (default 5)"
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  remove-sni-and-retry:
    name: Remove SNI factory + retry deploy until live
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 35
    steps:
      - name: Confirm
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "remove-sni-retry" ]; then
            echo "::error::Confirmation input must be 'remove-sni-retry'"
            exit 1
          fi
          echo "Max retries: ${{ github.event.inputs.max_retries }}"

      - name: Remove SNI factory + retry deploy until success
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          MAX_RETRIES: ${{ github.event.inputs.max_retries }}
        run: |
          set -uo pipefail
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          BASE="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"
          BACKEND_URL="https://sanad-backend-mcrj.onrender.com"
          POOLER_HOST="aws-0-eu-central-1.pooler.supabase.com"
          # Standard URL: no sslfactory, no sslfactoryarg
          CLEAN_URL="jdbc:postgresql://${POOLER_HOST}:5432/postgres?prepareThreshold=0&sslmode=require"

          echo "========================================"
          echo "REMOVE SNI FACTORY + RETRY DEPLOY"
          echo "========================================"
          echo "Clean URL (no SNI): $CLEAN_URL"
          echo "Max retries: $MAX_RETRIES"
          echo ""

          # ----- STEP 1: Suspend + PUT clean URL + Resume -----
          echo "=== STEP 1: Suspend service ==="
          HTTP=$(curl -s -o /tmp/suspend.json -w "%{http_code}" --max-time 30 -X POST -H "$AUTH" "$BASE/suspend")
          echo "POST /suspend -> HTTP $HTTP"
          sleep 15
          echo ""

          echo "=== STEP 2: PUT DATABASE_URL (clean, no SNI) ==="
          HTTP=$(curl -s -o /tmp/db-resp.json -w "%{http_code}" --max-time 45 -X PUT \
            -H "$AUTH" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data "$(jq -n --arg v "$CLEAN_URL" '{value:$v}')" "$BASE/env-vars/DATABASE_URL")
          echo "PUT DATABASE_URL -> HTTP $HTTP"
          test "$HTTP" -ge 200 -a "$HTTP" -lt 300 || { echo "::error::PUT DATABASE_URL failed"; cat /tmp/db-resp.json; exit 1; }
          echo ""

          echo "=== STEP 3: PUT SPRING_FLYWAY_URL (clean, no SNI) ==="
          HTTP=$(curl -s -o /tmp/sf-resp.json -w "%{http_code}" --max-time 45 -X PUT \
            -H "$AUTH" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data "$(jq -n --arg v "$CLEAN_URL" '{value:$v}')" "$BASE/env-vars/SPRING_FLYWAY_URL")
          echo "PUT SPRING_FLYWAY_URL -> HTTP $HTTP"
          test "$HTTP" -ge 200 -a "$HTTP" -lt 300 || { echo "::error::PUT SPRING_FLYWAY_URL failed"; cat /tmp/sf-resp.json; exit 1; }
          echo ""

          echo "=== STEP 4: Resume service ==="
          HTTP=$(curl -s -o /tmp/resume.json -w "%{http_code}" --max-time 30 -X POST -H "$AUTH" "$BASE/resume")
          echo "POST /resume -> HTTP $HTTP"
          sleep 5
          echo ""

          # ----- RETRY LOOP -----
          OWNER_ID=$(curl -s --max-time 30 -H "$AUTH" "$BASE" | jq -r '.ownerId // .owner // empty')
          mkdir -p /tmp/live-logs
          > /tmp/live-logs/all.txt

          FINAL_STATUS="FAILED"
          FINAL_DEPLOY_ID=""
          FINAL_HEALTH_HTTP="000"
          FINAL_HEALTH_STATUS="unknown"

          for retry in $(seq 1 $MAX_RETRIES); do
            echo ""
            echo "========================================"
            echo "RETRY #$retry / $MAX_RETRIES"
            echo "========================================"

            # Trigger deploy
            echo "--- Triggering deploy (retry #$retry) ---"
            HTTP=$(curl -s -o /tmp/deploy.json -w "%{http_code}" --max-time 30 -X POST \
              -H "$AUTH" -H 'Content-Type: application/json' -H 'Accept: application/json' \
              --data '{"clearCache":"do_not_clear"}' "$BASE/deploys")
            DEPLOY_ID=$(jq -r '.id // empty' /tmp/deploy.json)
            echo "Deploy ID: $DEPLOY_ID (HTTP $HTTP)"
            test -n "$DEPLOY_ID" || { echo "::error::no deploy id"; cat /tmp/deploy.json; continue; }
            FINAL_DEPLOY_ID=$DEPLOY_ID

            # Wait for deploy to reach terminal state
            START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            DEPLOY_STATUS="update_in_progress"
            ITERATION=0

            while [ "$DEPLOY_STATUS" = "update_in_progress" ] && [ "$ITERATION" -lt 80 ]; do
              ITERATION=$((ITERATION + 1))
              sleep 10

              DEPLOY_STATUS=$(curl -s --max-time 15 -H "$AUTH" "$BASE/deploys/$DEPLOY_ID" | jq -r '.deploy.status // .status // "unknown"')
              echo "  [retry $retry iter $ITERATION] deploy status: $DEPLOY_STATUS"

              # Capture live logs
              if [ -n "$OWNER_ID" ]; then
                URL="https://api.render.com/v1/logs?ownerId=${OWNER_ID}&resource=${RENDER_SERVICE_ID}&startTime=${START_TIME}&direction=forward&limit=200"
                curl -s --max-time 15 -H "$AUTH" "$URL" > /tmp/live-logs/page.json
                jq -r 'if type=="array" then .[] elif .logs then .logs[] elif .lines then .lines[] else empty end | (if type=="object" then (.text // .message // .msg // (. | tostring)) else (tostring) end)' /tmp/live-logs/page.json 2>/dev/null >> /tmp/live-logs/all.txt
              fi

              if [ "$DEPLOY_STATUS" = "live" ]; then
                echo "::notice::DEPLOY LIVE on retry #$retry after $((ITERATION * 10))s"
                break
              fi
              if echo "$DEPLOY_STATUS" | grep -qiE 'failed|canceled|deactivated'; then
                echo "::warning::Deploy terminal: $DEPLOY_STATUS on retry #$retry"
                break
              fi
            done

            # Check health
            echo "--- Health probe after retry #$retry ---"
            HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 "$BACKEND_URL/actuator/health")
            HEALTH_STATUS=$(jq -r '.status // "unknown"' /tmp/health.json 2>/dev/null || echo "unknown")
            echo "HTTP_CODE: $HTTP_CODE, STATUS: $HEALTH_STATUS"
            FINAL_HEALTH_HTTP=$HTTP_CODE
            FINAL_HEALTH_STATUS=$HEALTH_STATUS

            if [ "$DEPLOY_STATUS" = "live" ] && [ "$HTTP_CODE" = "200" ] && [ "$HEALTH_STATUS" = "UP" ]; then
              echo "::notice::SUCCESS on retry #$retry!"
              FINAL_STATUS="SUCCESS"
              break
            fi

            # Quick error summary for this retry
            echo "--- Retry #$retry error summary ---"
            echo "  ENOIDENTIFIER: $(grep -c 'ENOIDENTIFIER' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
            echo "  Application run failed: $(grep -c 'Application run failed' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
            echo "  Started SanadPlatform: $(grep -c 'Started SanadPlatformApplication' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
            echo "  Tomcat started: $(grep -c 'Tomcat started on port' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"

            # If deploy was live but health not UP, check why
            if [ "$DEPLOY_STATUS" = "live" ] && [ "$HEALTH_STATUS" != "UP" ]; then
              echo "::warning::Deploy live but health not UP — checking recent logs"
              tail -20 /tmp/live-logs/all.txt
            fi
          done

          # ----- FINAL SUMMARY -----
          echo ""
          echo "========================================"
          echo "FINAL RESULT"
          echo "========================================"
          echo "FINAL_STATUS=$FINAL_STATUS"
          echo "FINAL_DEPLOY_ID=$FINAL_DEPLOY_ID"
          echo "FINAL_HEALTH_HTTP=$FINAL_HEALTH_HTTP"
          echo "FINAL_HEALTH_STATUS=$FINAL_HEALTH_STATUS"
          echo "TOTAL_LOG_LINES=$(wc -l < /tmp/live-logs/all.txt)"
          echo ""
          echo "=== Last 30 log lines ==="
          tail -30 /tmp/live-logs/all.txt

      - name: Upload live logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-remove-sni-retry-logs
          path: /tmp/live-logs/
          if-no-files-found: warn
          retention-days: 14
