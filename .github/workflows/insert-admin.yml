name: Insert Admin (psql variables)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "insert" to confirm'
        required: true
        default: ''
        type: string
      password:
        description: 'Password for admin user'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  insert:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    if: github.event.inputs.confirm == 'insert'
    steps:
      - name: Suspend backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Suspend HTTP %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/suspend" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" || true
          sleep 15

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          pip3 install bcrypt > /dev/null 2>&1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate hash and execute SQL
        env:
          PROD_JDBC_URL: ${{ secrets.PROD_JDBC_URL }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          CONTROL_PLANE_TENANT_ID: ${{ secrets.CONTROL_PLANE_TENANT_ID }}
          ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          NEW_PASSWORD: ${{ inputs.password }}
        run: |
          set -euo pipefail

          # Generate BCrypt hash and write SQL file
          python3 scripts/insert_admin.py

          # Read hash from file
          HASH=$(cat /tmp/hash_value.txt)
          echo "Hash length: ${#HASH}"

          # Parse JDBC URL
          JDBC_URL="$PROD_JDBC_URL"
          CONN_STR="${JDBC_URL#jdbc:postgresql://}"
          HOST_PORT="${CONN_STR%%/*}"
          HOST="${HOST_PORT%%:*}"
          PORT="${HOST_PORT##*:}"
          DB_PART="${CONN_STR#*/}"
          DB_NAME="${DB_PART%%\?*}"

          echo "Host: $HOST:$PORT"
          echo "DB: $DB_NAME"

          # Execute SQL using psql with -v to pass hash as variable
          # psql's :'hash' syntax properly quotes the value
          for attempt in 1 2 3 4 5; do
            echo "=== Attempt $attempt ==="
            if PGPASSWORD="$PROD_DB_PASSWORD" psql -h "$HOST" -p "$PORT" -U "$PROD_DB_USER" -d "$DB_NAME" -v hash="$HASH" -f /tmp/insert_admin.sql; then
              echo "✓ Done!"
              break
            fi
            echo "Attempt $attempt failed. Waiting 10s..."
            sleep 10
          done

      - name: Resume backend
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Resume HTTP %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/resume" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" || true

      - name: Verify login
        env:
          ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          NEW_PASSWORD: ${{ inputs.password }}
        run: |
          echo "Waiting 30s for backend..."
          sleep 30
          echo "=== Login test ==="
          curl -sS --max-time 60 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"admin@snad.ai\",\"password\":\"$NEW_PASSWORD\"}" \
            -w "\nHTTP %{http_code}\n" || true
