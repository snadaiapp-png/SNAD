# ============================================================
# SANAD — NVD Snapshot Publisher (Incremental, Datafeed)
# ============================================================
name: NVD Snapshot Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: snad-nvd-snapshot-single-writer
  cancel-in-progress: false

env:
  DEPENDENCY_CHECK_VERSION: "12.1.0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  NVD_SNAPSHOT_BACKEND: github-releases
  NVD_SOURCE_MODE: datafeed

jobs:
  publish:
    name: Publish Incremental NVD Snapshot (Datafeed)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: nvd-publisher

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml pytest
          sudo apt-get install -y zstd || true

      - name: Verify NVD publisher regression tests
        shell: bash
        run: |
          python3 -m pytest tests/security/test_nvd_github_releases_idempotency.py -q
          python3 -m pytest tests/security/test_nvd_datafeed_runtime_hardening.py -q

      - name: Run Incremental Publisher (Datafeed Mode)
        shell: bash
        env:
          NVD_SNAPSHOT_BACKEND: github-releases
          NVD_SOURCE_MODE: datafeed
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          WORK_DIR="${{ runner.temp }}/nvd-work"
          CANONICAL_DIR="${{ runner.temp }}/nvd-canonical"
          LKG_DIR="${{ runner.temp }}/nvd-lkg"
          LOG_DIR="${{ runner.temp }}/nvd-diagnostics"
          rm -rf "$WORK_DIR" "$CANONICAL_DIR" "$LKG_DIR" "$LOG_DIR"
          mkdir -p "$WORK_DIR" "$CANONICAL_DIR" "$LKG_DIR" "$LOG_DIR"

          python3 -c 'from scripts.security.nvd_github_releases_idempotency import install_github_releases_idempotency_patch; install_github_releases_idempotency_patch(); from scripts.security.nvd_datafeed_runtime_hardening import install; install(); import runpy; runpy.run_path("scripts/security/publish_nvd_snapshot.py", run_name="__main__")' \
            --mode incremental \
            --source-mode datafeed \
            --update-timeout-minutes 180 \
            --work-dir "$WORK_DIR" \
            --canonical-dir "$CANONICAL_DIR" \
            --lkg-dir "$LKG_DIR" \
            --publisher-commit-sha "${{ github.sha }}" \
            --publisher-run-id "${{ github.run_id }}" 2>&1 | tee "$LOG_DIR/publisher.log"

      - name: Upload NVD publisher diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nvd-publisher-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/nvd-diagnostics/
          if-no-files-found: warn
          retention-days: 30

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NVD Snapshot Publisher — hardened datafeed mode"
            echo ""
            echo "**Run ID:** ${{ github.run_id }}"
            echo "**SHA:** \`${{ github.sha }}\`"
            echo "**Backend:** GitHub Releases"
            echo "**Runtime metadata hardening:** ENABLED"
            echo "**Complete diagnostic artifact:** ENABLED"
            echo "**Latest pointer promotion:** retry-safe and payload-verified"
          } >> "$GITHUB_STEP_SUMMARY"
