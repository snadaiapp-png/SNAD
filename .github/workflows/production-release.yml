name: SANAD Production Release

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact current main commit to deploy
        required: true
      change_ticket:
        description: 'Actual independently approved CAB ticket ID (G1-CHG-NNN); format alone does not grant approval'
        required: true
        type: string
      pull_request_number:
        description: Pull request used for release evidence
        required: true
        default: "222"
      rollback_on_failure:
        description: Redeploy the previous successful image when verification fails
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: sanad-production-release
  cancel-in-progress: false

env:
  PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
  WEB_PRODUCTION_BASE_URL: ${{ vars.WEB_PRODUCTION_BASE_URL || 'https://snad-app.vercel.app' }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/snad-backend

jobs:
  deploy-and-verify:
    name: Deploy exact image and verify production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 75
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Dedicated production-only G2 identities. These are role-scoped QA
      # principals; never substitute Control Plane or Tenant B admin credentials.
      E2E_EMPLOYEE_EMAIL: ${{ secrets.G2_PROD_EMPLOYEE_EMAIL }}
      E2E_EMPLOYEE_PASSWORD: ${{ secrets.G2_PROD_EMPLOYEE_PASSWORD }}
      E2E_MANAGER_EMAIL: ${{ secrets.G2_PROD_MANAGER_EMAIL }}
      E2E_MANAGER_PASSWORD: ${{ secrets.G2_PROD_MANAGER_PASSWORD }}
      E2E_HR_EMAIL: ${{ secrets.G2_PROD_HR_EMAIL }}
      E2E_HR_PASSWORD: ${{ secrets.G2_PROD_HR_PASSWORD }}
    steps:
      - name: Validate protected release inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in RENDER_API_KEY RENDER_SERVICE_ID PRODUCTION_BASE_URL WEB_PRODUCTION_BASE_URL \
            E2E_EMPLOYEE_EMAIL E2E_EMPLOYEE_PASSWORD \
            E2E_MANAGER_EMAIL E2E_MANAGER_PASSWORD \
            E2E_HR_EMAIL E2E_HR_PASSWORD; do
            test -n "${!name:-}" || { echo "::error::$name is required"; exit 1; }
          done
          [[ "${{ inputs.commit_sha }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ inputs.change_ticket }}" =~ ^G1-CHG-[0-9]+$ ]] || {
            echo "::error::CAB ticket must be actual G1-CHG-NNN; format check does not establish authorization"
            exit 1
          }
          echo 'CAB_TICKET_FORMAT_ONLY: Production reviewer must independently confirm approved ticket and exact SHA.'
          [[ "$PRODUCTION_BASE_URL" == https://* ]]
          [[ "$WEB_PRODUCTION_BASE_URL" == https://* ]]

      - name: Verify target is current main head
        id: target
        shell: bash
        run: |
          set -euo pipefail
          remote_main=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')
          test "$remote_main" = "${{ inputs.commit_sha }}" || {
            echo "::error::Requested commit is not the current main head"
            exit 1
          }
          echo "sha=$remote_main" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client skopeo >/dev/null

      - name: Verify exact immutable OCI image and digest without Docker
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${REGISTRY}/${IMAGE_NAME}:${{ steps.target.outputs.sha }}"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          umask 077
          auth_file="$RUNNER_TEMP/g1-registry-auth.json"
          manifest="$RUNNER_TEMP/g1-exact-manifest.json"
          trap 'rm -f "$auth_file"' EXIT
          printf '%s' "$GITHUB_TOKEN" | skopeo login --authfile "$auth_file" -u "$GITHUB_ACTOR" --password-stdin "$REGISTRY" >/dev/null
          skopeo inspect --raw --authfile "$auth_file" "docker://$IMAGE_REF" > "$manifest" || {
            echo "::error::Exact SHA-tagged OCI image is absent or cannot be authenticated"
            exit 1
          }
          jq -e '.schemaVersion == 2' "$manifest" >/dev/null || {
            echo "::error::Unexpected OCI manifest contract"
            exit 1
          }
          immutable_digest="sha256:$(sha256sum "$manifest" | awk '{print $1}')"
          [[ "$immutable_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          skopeo inspect --authfile "$auth_file" "docker://$IMAGE_REF" | jq -e --arg sha "${{ steps.target.outputs.sha }}" '.Labels["org.opencontainers.image.revision"] == $sha' >/dev/null || {
            echo "::error::OCI source label does not match exact release SHA"
            exit 1
          }
          echo "digest=$immutable_digest" >> "$GITHUB_OUTPUT"
          echo "EXACT_IMAGE_AVAILABLE=YES" >> "$GITHUB_ENV"
          echo "OCI_REGISTRY_DIGEST=$immutable_digest (Docker CLI/daemon not used)"

      - name: Validate Render runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100" \
            > /tmp/render-env.json
          test "$(jq 'length' /tmp/render-env.json)" -lt 100 || {
            echo "::error::Cannot prove complete Render environment pagination"
            exit 1
          }
          jq '[.[]? | (.envVar // .)]' /tmp/render-env.json > /tmp/render-env-normalized.json
          required=(SPRING_PROFILES_ACTIVE DATABASE_URL DATABASE_USERNAME DATABASE_PASSWORD JWT_SECRET BOOTSTRAP_ENABLED SANAD_CONTROL_PLANE_TENANT_ID)
          for key in "${required[@]}"; do
            jq -e --arg key "$key" 'any(.[]; .key == $key and ((.value // "") | length > 0))' /tmp/render-env-normalized.json >/dev/null || {
              echo "::error::Required Render environment value is missing: $key"
              exit 1
            }
          done
          test "$(jq -r '.[] | select(.key == "BOOTSTRAP_ENABLED") | .value' /tmp/render-env-normalized.json)" = "false"
          control_tenant_id=$(jq -r '.[] | select(.key == "SANAD_CONTROL_PLANE_TENANT_ID") | .value' /tmp/render-env-normalized.json)
          database_username=$(jq -r '.[] | select(.key == "DATABASE_USERNAME") | .value' /tmp/render-env-normalized.json)
          # Canonical UUID shape (8-4-4-4-12): accepts the deterministic
          # control-plane sentinel tenant and every RFC version, while still
          # rejecting structurally invalid ids.
          [[ "$control_tenant_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          echo "::add-mask::$control_tenant_id"
          echo "::add-mask::$database_username"
          echo "CONTROL_PLANE_TENANT_ID=$control_tenant_id" >> "$GITHUB_ENV"
          echo "DATABASE_USERNAME=$database_username" >> "$GITHUB_ENV"

      - name: Verify Control Plane tenant in production database
        run: bash scripts/production/verify-control-plane-tenant.sh

      - name: Verify Flyway is disabled in the backend runtime
        shell: bash
        run: |
          set -euo pipefail
          # G1 separation contract: only the independently authorized
          # sanad_migrator workflow may migrate; the backend runtime may not.
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100" \
            > "$RUNNER_TEMP/g1-render-live-env.json"
          jq -e 'type == "array" and length < 100' "$RUNNER_TEMP/g1-render-live-env.json" >/dev/null || {
            echo "::error::Render env query incomplete"
            exit 1
          }
          flyway_state="$(jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "FLYWAY_ENABLED") | .value // empty' "$RUNNER_TEMP/g1-render-live-env.json")"
          [ "$flyway_state" = "false" ] || {
            echo "::error::FLYWAY_ENABLED must explicitly equal false on the backend runtime; migrations require protected sanad_migrator"
            exit 1
          }
          out_of_order="$(jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "FLYWAY_OUT_OF_ORDER") | .value // empty' "$RUNNER_TEMP/g1-render-live-env.json")"
          [ -z "$out_of_order" ] || [ "$out_of_order" = "false" ] || {
            echo "::error::FLYWAY_OUT_OF_ORDER must be false/unset"
            exit 1
          }
          echo "RUNTIME_FLYWAY_DISABLED=PASS (separate migrator workflow mandatory)"

      - name: Preflight exact Vercel production release identity before Render mutation
        shell: bash
        env:
          EXPECTED_RELEASE_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          release_url="${WEB_PRODUCTION_BASE_URL%/}/api/system/release"
          response_file="$RUNNER_TEMP/vercel-release-identity.json"
          http_code=$(curl --silent --show-error --location --output "$response_file" --write-out '%{http_code}' --max-time 60 "$release_url") || {
            echo "::error::VERCEL_RELEASE_IDENTITY_UNREACHABLE"
            exit 1
          }
          if [ "$http_code" != "200" ]; then
            echo "::error::VERCEL_RELEASE_IDENTITY_HTTP_STATUS=$http_code expected=200"
            exit 1
          fi
          if ! jq -e 'type=="object" and (.commitSha | type=="string") and (.environment | type=="string")' "$response_file" >/dev/null; then
            echo "::error::VERCEL_RELEASE_IDENTITY_INVALID_CONTRACT"
            exit 1
          fi
          actual_sha=$(jq -r '.commitSha' "$response_file")
          actual_env=$(jq -r '.environment' "$response_file")
          echo "VERCEL_RELEASE_IDENTITY expected_sha=$EXPECTED_RELEASE_SHA observed_sha=$actual_sha environment=$actual_env"
          if [ "$actual_sha" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "::error::VERCEL_RELEASE_SHA_MISMATCH expected=$EXPECTED_RELEASE_SHA observed=$actual_sha. Reconcile protected Vercel production to exact current main before attempting Render deployment."
            exit 1
          fi
          case "$actual_env" in
            production|prod) ;;
            *) echo "::error::VERCEL_RELEASE_ENVIRONMENT_MISMATCH observed=$actual_env"; exit 1 ;;
          esac
          echo 'VERCEL_EXACT_RELEASE_PREFLIGHT=PASS'

      - name: Verify Flyway production compatibility
        run: bash scripts/production/verify-flyway.sh

      - name: Capture previous live image reference
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20" > /tmp/render-deploys.json
          # Extract the previous live IMAGE reference (not commit ID)
          previous_image=$(jq -r '[.[]? | (.deploy // .) | select((.status // "") == "live")] | .[0].image.ref // empty' /tmp/render-deploys.json)
          echo "image_ref=$previous_image" >> "$GITHUB_OUTPUT"
          echo "Previous live image: ${previous_image:-none}"

      - name: Deploy exact image to Render
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${{ steps.image.outputs.image_ref }}"
          # Image-backed deployment: use imageUrl (NOT commitId)
          jq -n --arg image "$IMAGE_REF" '{imageUrl:$image,clearCache:"do_not_clear"}' > render-request.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data @render-request.json \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" > render-deployment.json
          deploy_id=$(jq -r '(.deploy // .).id // empty' render-deployment.json)
          test -n "$deploy_id"
          echo "id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for Render deployment
        shell: bash
        run: |
          set -euo pipefail
          deploy_id='${{ steps.deploy.outputs.id }}'
          for attempt in $(seq 1 270); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" > render-deployment-state.json
            status=$(jq -r '(.deploy // .).status // "pending"' render-deployment-state.json)
            echo "Render status: $status"
            case "$status" in
              live)
                # Verify deployed image matches the exact requested image
                deployed_image=$(jq -r '(.deploy // .).image.ref // empty' render-deployment-state.json)
                test -n "$deployed_image" || {
                  echo "::error::Render live deployment returned no image reference"
                  exit 1
                }
                test "$deployed_image" = "${{ steps.image.outputs.image_ref }}" || {
                  echo "::error::Render deployed image does not match requested immutable image"
                  echo "  Requested: ${{ steps.image.outputs.image_ref }}"
                  echo "  Deployed:   $deployed_image"
                  exit 1
                }
                live_digest=$(jq -r '(.deploy // .).image.sha // empty' render-deployment-state.json)
                test "$live_digest" = "${{ steps.image.outputs.digest }}" || {
                  echo "::error::Render deployed OCI digest does not match exact registry digest"
                  exit 1
                }
                echo "Deployed image: $deployed_image (exact tag and digest match)"
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                jq '{id,status,createdAt,finishedAt,reason}' render-deployment-state.json || true
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Render deployment timed out"
          exit 1

      - name: Wait for production readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            code=$(curl --silent --show-error --output /tmp/readiness.json --write-out '%{http_code}' --max-time 20 "$PRODUCTION_BASE_URL/actuator/health/readiness" || true)
            if [ "$code" = "200" ] && jq -e '.status == "UP"' /tmp/readiness.json >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production readiness did not become UP"
          exit 1

      - name: Verify production security boundary
        run: bash scripts/production/verify-auth-contract.sh

      - name: Verify SCP production contract smoke
        env:
          SCP_SMOKE_BASE_URL: ${{ env.PRODUCTION_BASE_URL }}
          CONTROL_PLANE_ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          CONTROL_PLANE_ADMIN_PASSWORD: ${{ secrets.CONTROL_PLANE_ADMIN_PASSWORD }}
          CONTROL_PLANE_TENANT_ID: ${{ env.CONTROL_PLANE_TENANT_ID }}
          DEPLOYED_COMMIT_SHA: ${{ steps.target.outputs.sha }}
          SCP_SMOKE_EVIDENCE_FILE: scp-contract-smoke.json
        run: bash scripts/production/verify-scp-contract-smoke.sh

      - name: Verify R0C13 G11 production-disabled payment boundary
        env:
          PRODUCTION_BASE_URL: ${{ env.PRODUCTION_BASE_URL }}
          CONTROL_PLANE_ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          CONTROL_PLANE_ADMIN_PASSWORD: ${{ secrets.CONTROL_PLANE_ADMIN_PASSWORD }}
          CONTROL_PLANE_TENANT_ID: ${{ env.CONTROL_PLANE_TENANT_ID }}
        run: |
          set -euo pipefail
          bash scripts/production/verify-r0c13-g11-disabled.sh
          cp "$RUNNER_TEMP/r0c13-g11/r0c13-g11-runtime-evidence.json" r0c13-g11-runtime-evidence.json

      - name: Verify Vercel Control Plane and BFF
        shell: bash
        run: |
          set -euo pipefail
          control_status=$(curl --silent --show-error --location --output /tmp/control-plane.html --write-out '%{http_code}' --max-time 60 "$WEB_PRODUCTION_BASE_URL/control-plane")
          test "$control_status" = "200"
          bff_status=$(curl --silent --show-error --output /tmp/control-plane-api.json --write-out '%{http_code}' --max-time 90 "$WEB_PRODUCTION_BASE_URL/api/platform/api/v1/control-plane/dashboard" || true)
          case "$bff_status" in 401|403) ;; *) exit 1 ;; esac

      - name: Set up Node.js 24 for G2 production visual smoke
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies and Chromium for G2 production visual smoke
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install chromium --with-deps

      - name: Reconcile governed G2 production identities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Employee SELF surfaces require the canonical Person -> Employment
          # binding. Reconcile through the dedicated governed provisioning
          # workflow instead of widening runtime authorization fallbacks.
          before_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow g2-production-identity-provisioning.yml \
            --limit 1 --json databaseId --jq '.[0].databaseId // 0')

          gh workflow run g2-production-identity-provisioning.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

          run_id=""
          for _ in $(seq 1 30); do
            candidate=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow g2-production-identity-provisioning.yml \
              --limit 1 --json databaseId,headSha,status \
              --jq '.[0] | select(.databaseId > '"$before_id"') | .databaseId // empty')
            if [ -n "$candidate" ]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          test -n "$run_id" || {
            echo "::error::G2 production identity provisioning run was not created"
            exit 1
          }

          echo "G2_IDENTITY_PROVISIONING_RUN_ID=$run_id" >> "$GITHUB_ENV"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

      - name: Verify authenticated G2 production visual smoke
        working-directory: apps/web
        shell: bash
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.WEB_PRODUCTION_BASE_URL }}
          GITHUB_HEAD_SHA: ${{ steps.target.outputs.sha }}
          CI: '1'
        run: |
          set -euo pipefail

          # Bind frontend evidence to the exact release SHA before authenticating.
          release_status=$(curl --silent --show-error --location \
            --output "$RUNNER_TEMP/g2-production-release.json" \
            --write-out '%{http_code}' --max-time 60 \
            "$PLAYWRIGHT_BASE_URL/api/system/release")
          test "$release_status" = "200"
          jq -e --arg sha "$GITHUB_HEAD_SHA" \
            '.commitSha==$sha and (.environment=="production" or .environment=="prod")' \
            "$RUNNER_TEMP/g2-production-release.json" >/dev/null

          # Never allow stale local evidence to satisfy the production gate.
          rm -rf test-results/g2-visual-evidence playwright-g2-visual-report
          npx playwright test --config=playwright-g2-visual.config.ts

          MANIFEST='test-results/g2-visual-evidence/manifest.ndjson'
          test -s "$MANIFEST"
          EXPECTED=60
          ACTUAL=$(wc -l < "$MANIFEST" | tr -d ' ')
          test "$ACTUAL" = "$EXPECTED" || {
            echo "::error::G2 production visual evidence rows=$ACTUAL expected=$EXPECTED"
            exit 1
          }
          if grep -v "\"sha\":\"$GITHUB_HEAD_SHA\"" "$MANIFEST"; then
            echo "::error::G2 production visual evidence contains non-release SHA"
            exit 1
          fi
          for role in employee manager hr; do
            grep -q "\"role\":\"$role\"" "$MANIFEST"
          done
          for project in g2-visual-ar-desktop g2-visual-ar-mobile g2-visual-en-desktop g2-visual-en-mobile; do
            grep -q "\"viewport\":\"$project\"" "$MANIFEST"
          done
          echo 'g2-production-visual=PASS'

      - name: Write sanitized release evidence
        if: success()
        shell: bash
        run: |
          jq -n \
            --arg commit "${{ steps.target.outputs.sha }}" \
            --arg imageRef "${{ steps.image.outputs.image_ref }}" \
            --arg deployment "${{ steps.deploy.outputs.id }}" \
            --arg previousImage "${{ steps.previous.outputs.image_ref }}" \
            --arg backendUrl "$PRODUCTION_BASE_URL" \
            --arg webUrl "$WEB_PRODUCTION_BASE_URL" \
            '{result:"DEPLOYMENT_VERIFIED",commit:$commit,imageRef:$imageRef,deploymentId:$deployment,previousImageRef:$previousImage,backendUrl:$backendUrl,webUrl:$webUrl,health:"UP",readiness:"UP",flyway:"PASS",securityBoundary:"PASS",r0c13G11:"PASS",providerMode:"DISABLED",livePaymentCollection:"OFF",vercelControlPlane:"UP",vercelBff:"CONNECTED",g2ProductionVisual:"PASS"}' \
            > production-release-evidence.json

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.run_id }}
          path: |
            render-deployment.json
            render-deployment-state.json
            production-release-evidence.json
            render-rollback.json
            scp-contract-smoke.json
            r0c13-g11-runtime-evidence.json
            apps/web/test-results/g2-visual-evidence/
            apps/web/playwright-g2-visual-report/
          if-no-files-found: warn
          retention-days: 90

      - name: Record verified deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Render production deployment passed for exact image \`${{ steps.image.outputs.image_ref }}\` (commit \`${{ steps.target.outputs.sha }}\`), deployment \`${{ steps.deploy.outputs.id }}\`. Readiness, Control Plane tenant, Flyway, security boundary, R0C13 G11 provider DISABLED / live-payment OFF negative smoke, Vercel Control Plane/BFF and authenticated G2 Employee/Manager/HR desktop+mobile visual smoke passed."

      - name: Roll back failed release
        if: failure() && inputs.rollback_on_failure && steps.previous.outputs.image_ref != ''
        shell: bash
        run: |
          # Image-based rollback: deploy the previous live image reference
          jq -n --arg image '${{ steps.previous.outputs.image_ref }}' '{imageUrl:$image,clearCache:"do_not_clear"}' > rollback-request.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data @rollback-request.json \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" > render-rollback.json

      - name: Record failed release
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Production release verification FAILED for commit \`${{ inputs.commit_sha }}\` (image \`${{ steps.image.outputs.image_ref }}\`). Rollback was requested when a previous live image was available. Evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
