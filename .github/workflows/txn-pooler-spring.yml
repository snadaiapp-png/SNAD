name: TXN POOLER + Spring Hash

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "go" to confirm'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    if: github.event.inputs.confirm == 'go'
    steps:
      - name: Install JDK + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jdk
          pip3 install psycopg2-binary

      - name: Download jars
        run: |
          curl -sS -L -o /tmp/spring-security-crypto.jar "https://repo1.maven.org/maven2/org/springframework/security/spring-security-crypto/6.3.1/spring-security-crypto-6.3.1.jar"
          curl -sS -L -o /tmp/spring-jcl.jar "https://repo1.maven.org/maven2/org/springframework/spring-jcl/6.1.6/spring-jcl-6.1.6.jar"

      - name: Generate Spring Security BCrypt hash
        id: hash
        run: |
          python3 -c "
          with open('/tmp/GenHash.java', 'w') as f:
              f.write('import org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;\n')
              f.write('public class GenHash {\n')
              f.write('    public static void main(String[] args) {\n')
              f.write('        BCryptPasswordEncoder encoder = new BCryptPasswordEncoder(10);\n')
              f.write('        String hash = encoder.encode(\"SNad@2026\");\n')
              f.write('        System.out.println(hash);\n')
              f.write('    }\n')
              f.write('}\n')
          "
          javac -cp /tmp/spring-security-crypto.jar:/tmp/spring-jcl.jar /tmp/GenHash.java -d /tmp/
          HASH=$(java -cp /tmp:/tmp/spring-security-crypto.jar:/tmp/spring-jcl.jar GenHash)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Suspend backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Suspend: %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/suspend" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" || true
          sleep 15

      - name: Insert via TRANSACTION-MODE pooler (port 6543)
        env:
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import psycopg2, os, sys

          # TRANSACTION-MODE pooler (port 6543) — handles search_path correctly
          host = "aws-0-eu-central-1.pooler.supabase.com"
          port = "6543"
          database_name = "postgres"
          user = "postgres.hxhvfqxzigrqoxxnnzje"
          password = "Senen@001985"
          admin_email = "admin@snad.ai"
          tenant_id = "958bbb1c-eece-4839-bca8-a5bfa14e6ac1"
          hash_val = os.environ['HASH']

          print(f"Connecting via TXN POOLER (port 6543)", file=sys.stderr)

          for attempt in range(5):
              try:
                  conn = psycopg2.connect(host=host, port=port, dbname=database_name,
                                          user=user, password=password, sslmode='require')
                  break
              except Exception as e:
                  print(f"Attempt {attempt+1}: {e}", file=sys.stderr)
                  if attempt < 4: import time; time.sleep(10)
                  else: raise

          cur = conn.cursor()

          # Set search_path
          cur.execute("SET search_path TO public")

          # Query WITHOUT schema prefix
          cur.execute("SELECT id, email, status FROM users WHERE email = %s", (admin_email,))
          existing = cur.fetchone()
          print(f"Existing: {existing}", file=sys.stderr)

          # UPDATE password
          cur.execute("UPDATE users SET password_hash = %s, status = 'ACTIVE', updated_at = CURRENT_TIMESTAMP WHERE email = %s",
                      (hash_val, admin_email))
          print(f"Updated: {cur.rowcount} rows", file=sys.stderr)

          if cur.rowcount == 0:
              print("Creating user...", file=sys.stderr)
              cur.execute("INSERT INTO tenants (id, name, subdomain, status, created_at, updated_at) SELECT %s::uuid, 'SNAD', 'control', 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP WHERE NOT EXISTS (SELECT 1 FROM tenants WHERE id = %s::uuid)", (tenant_id, tenant_id))
              cur.execute("INSERT INTO roles (id, tenant_id, code, name, status, created_at, updated_at) SELECT gen_random_uuid(), %s::uuid, 'ADMIN', 'Admin', 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP WHERE NOT EXISTS (SELECT 1 FROM roles WHERE tenant_id = %s::uuid AND code = 'ADMIN')", (tenant_id, tenant_id))
              cur.execute("INSERT INTO role_capabilities (id, tenant_id, role_id, capability_id, created_at) SELECT gen_random_uuid(), r.tenant_id, r.id, ac.id, CURRENT_TIMESTAMP FROM roles r CROSS JOIN access_capabilities ac WHERE r.tenant_id = %s::uuid AND r.code = 'ADMIN' AND ac.status = 'ACTIVE' AND NOT EXISTS (SELECT 1 FROM role_capabilities rc WHERE rc.tenant_id = r.tenant_id AND rc.role_id = r.id AND rc.capability_id = ac.id)", (tenant_id,))
              cur.execute("INSERT INTO users (id, tenant_id, email, display_name, status, password_hash, created_at, updated_at) SELECT gen_random_uuid(), %s::uuid, %s, 'Admin', 'ACTIVE', %s, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP", (tenant_id, admin_email, hash_val))
              print(f"Created: {cur.rowcount} rows", file=sys.stderr)
              cur.execute("INSERT INTO user_role_assignments (id, tenant_id, user_id, role_id, organization_id, status, created_at, updated_at) SELECT gen_random_uuid(), u.tenant_id, u.id, r.id, NULL, 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP FROM users u JOIN roles r ON r.tenant_id = u.tenant_id AND r.code = 'ADMIN' WHERE u.email = %s AND NOT EXISTS (SELECT 1 FROM user_role_assignments ura WHERE ura.user_id = u.id AND ura.role_id = r.id)", (admin_email,))
              print(f"Role: {cur.rowcount} rows", file=sys.stderr)

          # Verify
          cur.execute("SELECT email, status, length(password_hash) FROM users WHERE email = %s", (admin_email,))
          result = cur.fetchone()
          print(f"Final: {result}", file=sys.stderr)

          conn.commit()
          cur.close()
          conn.close()
          print("Done!", file=sys.stderr)
          PYEOF

      - name: Resume backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Resume: %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/resume" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" || true

      - name: Wait + Test login
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://sanad-backend-mcrj.onrender.com/actuator/health" 2>/dev/null || echo "000")
            if [ "$CODE" = "200" ]; then echo "UP!"; break; fi
            sleep 10
          done
          echo "Waiting 90s..."
          sleep 90
          for i in 1 2 3 4 5; do
            RESULT=$(curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
              -H "Content-Type: application/json" \
              -d '{"email":"admin@snad.ai","password":"SNad@2026"}' \
              -w "\n%{http_code}" 2>/dev/null || echo "timeout\n000")
            CODE=$(echo "$RESULT" | tail -1)
            echo "Login $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "🎉 LOGIN SUCCESSFUL!"; exit 0; fi
            sleep 30
          done
          echo "❌ Login failed"
