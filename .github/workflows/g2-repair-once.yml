name: G2 Canonical Repair

on:
  push:
    branches:
      - hr/g2-time-attendance-leave
    paths:
      - .github/workflows/g2-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hr/g2-time-attendance-leave
          fetch-depth: 8

      - name: Guard exact diagnosed baseline
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 027f2fbd00a38659938d4d13fb21c2cf22521e54 HEAD
          unexpected="$(git diff --name-only 027f2fbd00a38659938d4d13fb21c2cf22521e54..HEAD | grep -Ev '^\.github/(workflows/g2-repair-once\.yml|scripts/g2_repair_once\.py)$' || true)"
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }

      - name: Apply diagnosed repair
        run: python3 .github/scripts/g2_repair_once.py

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/g2-repair-once.yml .github/scripts/g2_repair_once.py
          git diff --check
          git diff --name-only 027f2fbd00a38659938d4d13fb21c2cf22521e54..HEAD >/dev/null

      - name: Commit repair to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(hr): align G2 outbox and governance tests"
          git push origin HEAD:hr/g2-time-attendance-leave
