name: DIRECT DB — Spring Hash + Login

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "direct" to confirm'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  direct:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    if: github.event.inputs.confirm == 'direct'
    steps:
      - name: Install JDK + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jdk
          pip3 install psycopg2-binary

      - name: Download jars
        run: |
          curl -sS -L -o /tmp/spring-security-crypto.jar "https://repo1.maven.org/maven2/org/springframework/security/spring-security-crypto/6.3.1/spring-security-crypto-6.3.1.jar"
          curl -sS -L -o /tmp/spring-jcl.jar "https://repo1.maven.org/maven2/org/springframework/spring-jcl/6.1.6/spring-jcl-6.1.6.jar"

      - name: Generate Spring Security BCrypt hash
        id: hash
        run: |
          python3 -c "
          with open('/tmp/GenHash.java', 'w') as f:
              f.write('import org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;\n')
              f.write('public class GenHash {\n')
              f.write('    public static void main(String[] args) {\n')
              f.write('        BCryptPasswordEncoder encoder = new BCryptPasswordEncoder(10);\n')
              f.write('        String hash = encoder.encode(\"SNad@2026\");\n')
              f.write('        System.out.println(hash);\n')
              f.write('        System.err.println(\"Verify: \" + encoder.matches(\"SNad@2026\", hash));\n')
              f.write('    }\n')
              f.write('}\n')
          "
          javac -cp /tmp/spring-security-crypto.jar:/tmp/spring-jcl.jar /tmp/GenHash.java -d /tmp/
          HASH=$(java -cp /tmp:/tmp/spring-security-crypto.jar:/tmp/spring-jcl.jar GenHash)
          echo "Hash: $HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Connect DIRECTLY to Supabase DB (bypass pooler)
        env:
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import psycopg2, os, sys

          # DIRECT connection (not via pooler)
          # This bypasses the 15-connection pooler limit
          host = "db.hxhvfqxzigrqoxxnnzje.supabase.co"
          port = "5432"
          dbname = "postgres"
          user = "postgres"
          password = "Senen@001985"
          admin_email = "admin@snad.ai"
          tenant_id = "958bbb1c-eece-4839-bca8-a5bfa14e6ac1"
          hash_val = os.environ['HASH']

          print(f"Connecting DIRECTLY to: {host}:{port}", file=sys.stderr)
          print(f"User: {user}", file=sys.stderr)
          print(f"Hash: {hash_val}", file=sys.stderr)

          conn = psycopg2.connect(host=host, port=port, dbname=dbname,
                                  user=user, password=password, sslmode='require')
          cur = conn.cursor()

          # Check tables
          cur.execute("SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          table_count = cur.fetchone()[0]
          print(f"Tables in public: {table_count}", file=sys.stderr)

          # Check if users table exists
          cur.execute("SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='users'")
          has_users = cur.fetchone()[0]
          print(f"Has users table: {has_users}", file=sys.stderr)

          if not has_users:
              print("ERROR: No users table!", file=sys.stderr)
              # List some tables
              cur.execute("SELECT tablename FROM pg_tables WHERE schemaname='public' ORDER BY tablename LIMIT 20")
              tables = [r[0] for r in cur.fetchall()]
              print(f"Tables: {tables}", file=sys.stderr)
              sys.exit(1)

          # Check existing user
          cur.execute("SELECT id, email, status, length(password_hash) FROM public.users WHERE email = %s", (admin_email,))
          existing = cur.fetchone()
          print(f"Existing user: {existing}", file=sys.stderr)

          # UPDATE password with Spring Security hash
          cur.execute("UPDATE public.users SET password_hash = %s, status = 'ACTIVE', updated_at = CURRENT_TIMESTAMP WHERE email = %s",
                      (hash_val, admin_email))
          print(f"Updated: {cur.rowcount} rows", file=sys.stderr)

          if cur.rowcount == 0:
              # User doesn't exist - create it
              print("Creating new user...", file=sys.stderr)
              # Create tenant
              cur.execute("INSERT INTO public.tenants (id, name, subdomain, status, created_at, updated_at) SELECT %s::uuid, 'SNAD', 'control', 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP WHERE NOT EXISTS (SELECT 1 FROM public.tenants WHERE id = %s::uuid)", (tenant_id, tenant_id))
              # Create ADMIN role
              cur.execute("INSERT INTO public.roles (id, tenant_id, code, name, status, created_at, updated_at) SELECT gen_random_uuid(), %s::uuid, 'ADMIN', 'Admin', 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP WHERE NOT EXISTS (SELECT 1 FROM public.roles WHERE tenant_id = %s::uuid AND code = 'ADMIN')", (tenant_id, tenant_id))
              # Grant all capabilities
              cur.execute("INSERT INTO public.role_capabilities (id, tenant_id, role_id, capability_id, created_at) SELECT gen_random_uuid(), r.tenant_id, r.id, ac.id, CURRENT_TIMESTAMP FROM public.roles r CROSS JOIN public.access_capabilities ac WHERE r.tenant_id = %s::uuid AND r.code = 'ADMIN' AND ac.status = 'ACTIVE' AND NOT EXISTS (SELECT 1 FROM public.role_capabilities rc WHERE rc.tenant_id = r.tenant_id AND rc.role_id = r.id AND rc.capability_id = ac.id)", (tenant_id,))
              # Create user
              cur.execute("INSERT INTO public.users (id, tenant_id, email, display_name, status, password_hash, created_at, updated_at) SELECT gen_random_uuid(), %s::uuid, %s, 'Admin', 'ACTIVE', %s, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP", (tenant_id, admin_email, hash_val))
              print(f"Created: {cur.rowcount} rows", file=sys.stderr)
              # Assign role
              cur.execute("INSERT INTO public.user_role_assignments (id, tenant_id, user_id, role_id, organization_id, status, created_at, updated_at) SELECT gen_random_uuid(), u.tenant_id, u.id, r.id, NULL, 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP FROM public.users u JOIN public.roles r ON r.tenant_id = u.tenant_id AND r.code = 'ADMIN' WHERE u.email = %s AND NOT EXISTS (SELECT 1 FROM public.user_role_assignments ura WHERE ura.user_id = u.id AND ura.role_id = r.id)", (admin_email,))
              print(f"Role: {cur.rowcount} rows", file=sys.stderr)

          # Verify
          cur.execute("SELECT email, status, length(password_hash) FROM public.users WHERE email = %s", (admin_email,))
          result = cur.fetchone()
          print(f"Final: {result}", file=sys.stderr)

          conn.commit()
          cur.close()
          conn.close()
          print("Done!", file=sys.stderr)
          PYEOF

      - name: Test login
        run: |
          echo "=== Login test ==="
          for i in 1 2 3 4 5; do
            RESULT=$(curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
              -H "Content-Type: application/json" \
              -d '{"email":"admin@snad.ai","password":"SNad@2026"}' \
              -w "\n%{http_code}" 2>/dev/null || echo "timeout\n000")
            CODE=$(echo "$RESULT" | tail -1)
            BODY=$(echo "$RESULT" | head -n -1)
            echo "  Attempt $i: HTTP $CODE"
            echo "  Body: $BODY"
            if [ "$CODE" = "200" ]; then
              echo "🎉🎉🎉 LOGIN SUCCESSFUL! 🎉🎉🎉"
              exit 0
            fi
            sleep 30
          done
          echo "❌ Login failed"
