name: Temporary Web Full Dependency Security Completion

on:
  push:
    branches:
      - fix/web-production-dependency-security-complete

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: RED — reproduce remaining full-tree advisories
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          set +e
          npm audit --audit-level=low > /tmp/full-audit-red.txt 2>&1
          rc=$?
          set -e
          cat /tmp/full-audit-red.txt
          if [ "$rc" -eq 0 ]; then
            echo "RED invalid: full dependency tree is already clean"
            exit 1
          fi
          grep -Eq '@vitest/mocker|brace-expansion|browserslist|js-yaml|undici' /tmp/full-audit-red.txt
          echo "RED proven: dev-tooling advisories are reproducible"

      - name: Apply conservative full-tree remediation
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const p = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (pkg.dependencies?.next !== '^16.3.3') throw new Error(`Unexpected Next.js baseline: ${pkg.dependencies?.next}`);
          if (pkg.overrides?.sharp !== '0.35.4') throw new Error(`Unexpected sharp baseline: ${pkg.overrides?.sharp}`);
          if (pkg.overrides?.['baseline-browser-mapping'] !== '2.11.21') throw new Error(`Unexpected baseline-browser-mapping baseline: ${pkg.overrides?.['baseline-browser-mapping']}`);
          pkg.overrides = pkg.overrides || {};
          pkg.overrides['js-yaml'] = '4.3.2';
          fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts

      - name: Verify locked install
        working-directory: apps/web
        run: npm ci

      - name: GREEN — zero vulnerabilities across full dependency tree
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=low
          npm audit --omit=dev --audit-level=low
          npm ls next sharp baseline-browser-mapping js-yaml vitest @vitest/mocker browserslist undici brace-expansion --all

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: TypeScript
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: apps/web
        run: npm test

      - name: Production build
        working-directory: apps/web
        run: npm run build

      - name: Commit full dependency remediation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-web-full-dependency-security-complete.yml
          git add apps/web/package.json apps/web/package-lock.json
          git diff --cached --check
          git commit -m "fix(web): clear full dependency audit findings"
          git push origin HEAD:fix/web-production-dependency-security-complete
