name: FINAL — Create Admin (Python Direct)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "go" to create admin'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    if: github.event.inputs.confirm == 'go'
    steps:
      - name: Suspend backend to free DB connections
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Suspend HTTP %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/suspend" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" || true
          echo "Waiting 20s for connections to be released..."
          sleep 20

      - name: Create admin and test login
        env:
          PROD_JDBC_URL: ${{ secrets.PROD_JDBC_URL }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          TENANT_ID: ${{ secrets.CONTROL_PLANE_TENANT_ID }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          pip3 install bcrypt psycopg2-binary > /dev/null 2>&1

          # Run everything in Python to avoid bash $ expansion issues
          python3 << 'PYEOF'
          import os
          import bcrypt
          import subprocess
          import psycopg2

          tenant_id = os.environ['TENANT_ID']
          email = 'admin@snad.ai'
          password = '@Snad@2026'

          # Generate BCrypt hash
          pwd_hash = bcrypt.hashpw(password.encode(), bcrypt.gensalt(10)).decode()
          print(f"Generated hash (length: {len(pwd_hash)})")

          # Parse JDBC URL
          jdbc_url = os.environ['PROD_JDBC_URL']
          # jdbc:postgresql://host:port/db?params
          conn_str = jdbc_url.replace('jdbc:postgresql://', '')
          host_port, db_part = conn_str.split('/', 1)
          if ':' in host_port:
              host, port = host_port.split(':')
          else:
              host, port = host_port, '5432'
          db_name = db_part.split('?')[0]

          print(f"Connecting to {host}:{port}/{db_name}")

          # Connect and execute SQL
          conn = psycopg2.connect(
              host=host,
              port=port,
              dbname=db_name,
              user=os.environ['PROD_DB_USER'],
              password=os.environ['PROD_DB_PASSWORD'],
              sslmode='require'
          )
          conn.autocommit = False
          cur = conn.cursor()

          # Set search_path
          cur.execute("SET search_path TO public")

          # Create tenant
          cur.execute("""
              INSERT INTO tenants (id, name, subdomain, status, created_at, updated_at)
              SELECT %s, 'SNAD', 'snad', 'ACTIVE', now(), now()
              WHERE NOT EXISTS (SELECT 1 FROM tenants WHERE id = %s)
          """, (tenant_id, tenant_id))
          print(f"Tenant: {cur.rowcount} row(s) affected")

          # Create ADMIN role
          cur.execute("""
              INSERT INTO roles (id, tenant_id, code, name, description, status, created_at, updated_at)
              SELECT gen_random_uuid(), %s, 'ADMIN', 'Administrator', 'Full access', 'ACTIVE', now(), now()
              WHERE NOT EXISTS (SELECT 1 FROM roles WHERE tenant_id = %s AND code = 'ADMIN')
          """, (tenant_id, tenant_id))
          print(f"ADMIN role: {cur.rowcount} row(s) affected")

          # Assign all capabilities to ADMIN
          cur.execute("""
              INSERT INTO role_capabilities (id, tenant_id, role_id, capability_id, created_at)
              SELECT gen_random_uuid(), r.tenant_id, r.id, c.id, now()
              FROM roles r CROSS JOIN access_capabilities c
              WHERE r.tenant_id = %s AND r.code = 'ADMIN' AND c.status = 'ACTIVE'
                AND NOT EXISTS (SELECT 1 FROM role_capabilities x WHERE x.tenant_id = r.tenant_id AND x.role_id = r.id AND x.capability_id = c.id)
          """, (tenant_id,))
          print(f"Capabilities: {cur.rowcount} row(s) affected")

          # Create admin user
          cur.execute("""
              INSERT INTO users (id, tenant_id, email, display_name, status, password_hash, created_at, updated_at)
              SELECT gen_random_uuid(), %s, %s, 'SNAD Admin', 'ACTIVE', %s, now(), now()
              WHERE NOT EXISTS (SELECT 1 FROM users WHERE email = %s)
          """, (tenant_id, email, pwd_hash, email))
          print(f"User: {cur.rowcount} row(s) affected")

          # Update password (in case user exists)
          cur.execute("""
              UPDATE users SET password_hash = %s, status = 'ACTIVE' WHERE email = %s
          """, (pwd_hash, email))
          print(f"Password update: {cur.rowcount} row(s) affected")

          # Assign ADMIN role to user
          cur.execute("""
              INSERT INTO user_role_assignments (id, tenant_id, user_id, role_id, organization_id, status, created_at, updated_at)
              SELECT gen_random_uuid(), u.tenant_id, u.id, r.id, NULL, 'ACTIVE', now(), now()
              FROM users u JOIN roles r ON r.tenant_id = u.tenant_id AND r.code = 'ADMIN'
              WHERE u.email = %s
                AND NOT EXISTS (SELECT 1 FROM user_role_assignments x WHERE x.tenant_id = u.tenant_id AND x.user_id = u.id AND x.role_id = r.id)
          """, (email,))
          print(f"Role assignment: {cur.rowcount} row(s) affected")

          # Verify
          cur.execute("SELECT email, status FROM users WHERE email = %s", (email,))
          row = cur.fetchone()
          print(f"Verify: {row}")

          cur.execute("SELECT count(*) FROM role_capabilities rc JOIN roles r ON r.id = rc.role_id WHERE r.code = 'ADMIN'")
          caps = cur.fetchone()[0]
          print(f"ADMIN capabilities: {caps}")

          conn.commit()
          cur.close()
          conn.close()
          print("✓ Admin created successfully!")
          PYEOF

          echo ""
          echo "=== Login test ==="
          curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@snad.ai","password":"@Snad@2026"}' \
            -w "\nHTTP %{http_code}\n" | head -c 500

      - name: Resume backend
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Resume HTTP %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/resume" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" || true
          echo "Waiting 60s for backend to resume..."
          sleep 60
          echo "=== Final health check ==="
          curl -sS --max-time 30 "https://sanad-backend-mcrj.onrender.com/actuator/health" || true
          echo ""
          echo "=== Final login test ==="
          curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@snad.ai","password":"@Snad@2026"}' \
            -w "\nHTTP %{http_code}\n" | head -c 500
