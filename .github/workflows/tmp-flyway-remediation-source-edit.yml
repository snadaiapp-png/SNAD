name: TEMP Flyway Remediation Source Edit

on:
  push:
    branches:
      - fix/flyway-hrm-prerequisite-forward-reconciliation

permissions:
  contents: write

jobs:
  one-shot-edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/flyway-hrm-prerequisite-forward-reconciliation
      - name: Update exact Flyway version assertions
        shell: python
        run: |
          from pathlib import Path

          postgres = Path('apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmPostgresMigrationTest.java')
          text = postgres.read_text()
          old = 'private static final String HRM_PLATFORM_PREREQUISITES_VERSION = "20260827.1";'
          new = 'private static final String HRM_PLATFORM_PREREQUISITES_VERSION = "20260904.2";'
          assert text.count(old) == 1, f'expected one PostgreSQL assertion, got {text.count(old)}'
          postgres.write_text(text.replace(old, new, 1))

          history = Path('apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmFlywayHistoryAssertionTest.java')
          text = history.read_text()
          old_item = '            , "20260827.1"   // hrm-g0 ws1 platform country and employer prerequisites\n'
          assert text.count(old_item) == 1, f'expected one historical item, got {text.count(old_item)}'
          text = text.replace(old_item, '', 1)

          anchor = '            , "20260904.1"   // forward-only idempotent production reconciliation of the Y2 wave\n'
          forward_item = '            , "20260904.2"   // forward-only reconciliation of HRM-G0 WS1 platform prerequisites\n'
          assert text.count(anchor) == 1, f'expected one reconciliation anchor, got {text.count(anchor)}'
          assert forward_item not in text
          text = text.replace(anchor, anchor + forward_item, 1)
          history.write_text(text)
      - name: Remove one-shot workflow and commit exact edits
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-flyway-remediation-source-edit.yml
          git add apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmPostgresMigrationTest.java
          git add apps/sanad-platform/src/test/java/com/sanad/platform/crm/web/CrmFlywayHistoryAssertionTest.java
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(flyway): align assertions with forward HRM prerequisite'
          git push origin HEAD:fix/flyway-hrm-prerequisite-forward-reconciliation
