name: REM-P0-006 Evidence Reconciliation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/security/independent-assurance/EVIDENCE-RECONCILIATION-TRIGGER.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: rem-p0-006-evidence-reconciliation
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}
  ASSESSED_RELEASE_SHA: f34f2dd71743e6361a49e86643944c089622bd4c
  ASSESSOR_LOGIN: abdulrhmansenan1985-creator
  ENGAGEMENT_ID: REM-P0-006-2026-07-27

jobs:
  reconcile:
    name: Verify root Artifact and open independent-assessment package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout governed main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve successful root assessment and immutable Artifact
        id: root
        shell: bash
        run: |
          set -euo pipefail
          runs_json="$(gh run list \
            --workflow rem-p0-006-root-closure-assessment.yml \
            --branch rem-p0-006-assessment-execution-v2 \
            --limit 50 \
            --json databaseId,status,conclusion,headSha,headBranch,url,createdAt,updatedAt,event)"
          run_json="$(jq -c --arg branch 'rem-p0-006-assessment-execution-v2' \
            '[.[] | select(.conclusion == "success" and .headBranch == $branch)] | sort_by(.createdAt) | last' <<< "$runs_json")"
          test -n "$run_json" && test "$run_json" != null
          run_id="$(jq -r '.databaseId' <<< "$run_json")"
          run_url="$(jq -r '.url' <<< "$run_json")"
          controller_sha="$(jq -r '.headSha' <<< "$run_json")"

          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          artifact_record="$(jq -c '[.artifacts[] | select(.name | startswith("rem-p0-006-root-assessment-"))] | sort_by(.created_at) | last' <<< "$artifact_json")"
          test -n "$artifact_record" && test "$artifact_record" != null
          artifact_id="$(jq -r '.id' <<< "$artifact_record")"
          artifact_name="$(jq -r '.name' <<< "$artifact_record")"
          artifact_digest="$(jq -r '.digest // ""' <<< "$artifact_record")"
          artifact_url="$(jq -r '.archive_download_url' <<< "$artifact_record")"
          artifact_expires="$(jq -r '.expires_at' <<< "$artifact_record")"
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo '::error::Root Artifact has no valid GitHub digest'
            exit 1
          }

          root_dir="$RUNNER_TEMP/rem-p0-006-root"
          rm -rf "$root_dir"
          mkdir -p "$root_dir"
          gh run download "$run_id" --name "$artifact_name" --dir "$root_dir"

          {
            echo "run_id=$run_id"
            echo "run_url=$run_url"
            echo "controller_sha=$controller_sha"
            echo "artifact_id=$artifact_id"
            echo "artifact_name=$artifact_name"
            echo "artifact_digest=$artifact_digest"
            echo "artifact_url=$artifact_url"
            echo "artifact_expires=$artifact_expires"
            echo "root_dir=$root_dir"
          } >> "$GITHUB_OUTPUT"

      - name: Verify Artifact and generate truthful package
        env:
          ROOT_RUN_ID: ${{ steps.root.outputs.run_id }}
          ROOT_RUN_URL: ${{ steps.root.outputs.run_url }}
          CONTROLLER_SHA: ${{ steps.root.outputs.controller_sha }}
          ARTIFACT_ID: ${{ steps.root.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.root.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.root.outputs.artifact_digest }}
          ARTIFACT_URL: ${{ steps.root.outputs.artifact_url }}
          ARTIFACT_EXPIRES: ${{ steps.root.outputs.artifact_expires }}
          ROOT_DIR: ${{ steps.root.outputs.root_dir }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/reconcile_rem_p0_006_evidence.py \
            --package-dir docs/security/independent-assurance \
            --root-dir "$ROOT_DIR" \
            --assessed-release-sha "$ASSESSED_RELEASE_SHA" \
            --root-run-id "$ROOT_RUN_ID" \
            --root-run-url "$ROOT_RUN_URL" \
            --controller-sha "$CONTROLLER_SHA" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --artifact-url "$ARTIFACT_URL" \
            --artifact-expires "$ARTIFACT_EXPIRES" \
            --assessor-login "$ASSESSOR_LOGIN" \
            --engagement-id "$ENGAGEMENT_ID"

          python3 scripts/ci/validate_independent_security_assurance.py \
            --mode readiness \
            --expected-release-sha "$ASSESSED_RELEASE_SHA"

      - name: Commit candidate and open independent-assessment PR
        env:
          ROOT_RUN_ID: ${{ steps.root.outputs.run_id }}
          ROOT_RUN_URL: ${{ steps.root.outputs.run_url }}
          ARTIFACT_ID: ${{ steps.root.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.root.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.root.outputs.artifact_digest }}
          ARTIFACT_EXPIRES: ${{ steps.root.outputs.artifact_expires }}
        shell: bash
        run: |
          set -euo pipefail
          branch="rem-p0-006-independent-assessment-${ROOT_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B "$branch" origin/main
          git add docs/security/independent-assurance
          git commit -m 'security: reconcile REM-P0-006 root evidence for independent assessment'
          git push --force-with-lease origin "$branch"

          pr_number="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            body_file="$RUNNER_TEMP/rem-p0-006-pr-body.md"
            cat > "$body_file" <<EOF
          ## Governed purpose

          This PR contains a machine-reconciled, integrity-verified **IN_PROGRESS** evidence package for REM-P0-006.

          ### Verified automated inputs

          - Assessed Production SHA: \`${ASSESSED_RELEASE_SHA}\`
          - Root assessment run: ${ROOT_RUN_URL}
          - Root Artifact: \`${ARTIFACT_ID}\` / \`${ARTIFACT_NAME}\`
          - GitHub Artifact digest: \`${ARTIFACT_DIGEST}\`
          - Internal \`SHA256SUMS.txt\`: verified successfully
          - Artifact expiry: \`${ARTIFACT_EXPIRES}\`

          ### Current truthful state

          - \`closure_state=NOT_READY\`
          - assessor appointment recorded; independence remains \`PENDING_VERIFICATION\`
          - automated and partial evidence is indexed with real local SHA-256 digests
          - uncovered or partially covered cases remain \`NOT_STARTED\` / \`IN_PROGRESS\`
          - approvals remain \`PENDING\`
          - broad commercial go-live remains \`NOT_APPROVED\`

          ### Required independent action

          \`@${ASSESSOR_LOGIN}\` must provide the explicit independence attestation, execute or review every governed coverage case, publish findings and independent retest evidence on the exact release, and approve only after all material findings are closed.

          This PR is the controlled independent-assessment workspace. It must not be merged as a closure record. Security Governance and Project Owner approvals are requested only after a separate package reaches \`READY_FOR_APPROVAL\`.

          Refs #516 #749 #763.
          EOF
            pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title 'security: execute REM-P0-006 independent assessment' \
              --body-file "$body_file")"
            pr_number="${pr_url##*/}"
          fi

          gh pr comment "$pr_number" --body "@${ASSESSOR_LOGIN} — formal independent-assessment execution is requested for engagement \`${ENGAGEMENT_ID}\`. Review the appointment and execution checklist, explicitly attest independence, then submit reproducible case results and findings against \`${ASSESSED_RELEASE_SHA}\`. A generic approval without the required evidence does not satisfy REM-P0-006."
          gh pr edit "$pr_number" --add-reviewer "$ASSESSOR_LOGIN" || true
          gh issue comment 516 --body "## REM-P0-006 independent assessment workspace opened

          - PR: #${pr_number}
          - Root run: \`${ROOT_RUN_ID}\`
          - Root Artifact: \`${ARTIFACT_ID}\` / \`${ARTIFACT_NAME}\`
          - Artifact digest: \`${ARTIFACT_DIGEST}\`
          - Assessed release: \`${ASSESSED_RELEASE_SHA}\`
          - Appointed assessor: \`@${ASSESSOR_LOGIN}\`
          - Package state: \`NOT_READY / IN_PROGRESS\`

          The Artifact and internal SHA256SUMS were verified before package generation. Final closure remains blocked pending explicit independence attestation, complete independent evidence for all 19 cases, findings and retest completion, three formal approvals and the protected environment-gated closure run."
