name: REM-P0-006 Evidence Reconciliation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/security/independent-assurance/EVIDENCE-RECONCILIATION-TRIGGER.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: rem-p0-006-evidence-reconciliation
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}
  ASSESSED_RELEASE_SHA: f34f2dd71743e6361a49e86643944c089622bd4c
  ASSESSOR_LOGIN: abdulrhmansenan1985-creator
  ENGAGEMENT_ID: REM-P0-006-2026-07-27

jobs:
  reconcile:
    name: Verify root Artifact and open independent-assessment package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout governed main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve successful root assessment and immutable Artifact
        id: root
        shell: bash
        run: |
          set -euo pipefail
          runs_json="$(gh run list \
            --workflow rem-p0-006-root-closure-assessment.yml \
            --branch rem-p0-006-assessment-execution-v2 \
            --limit 50 \
            --json databaseId,status,conclusion,headSha,headBranch,url,createdAt,updatedAt,event)"
          run_json="$(jq -c --arg branch 'rem-p0-006-assessment-execution-v2' \
            '[.[] | select(.conclusion == "success" and .headBranch == $branch)] | sort_by(.createdAt) | last' <<< "$runs_json")"
          test -n "$run_json" && test "$run_json" != null
          run_id="$(jq -r '.databaseId' <<< "$run_json")"
          run_url="$(jq -r '.url' <<< "$run_json")"
          controller_sha="$(jq -r '.headSha' <<< "$run_json")"

          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          artifact_record="$(jq -c '[.artifacts[] | select(.name | startswith("rem-p0-006-root-assessment-"))] | sort_by(.created_at) | last' <<< "$artifact_json")"
          test -n "$artifact_record" && test "$artifact_record" != null
          artifact_id="$(jq -r '.id' <<< "$artifact_record")"
          artifact_name="$(jq -r '.name' <<< "$artifact_record")"
          artifact_digest="$(jq -r '.digest // ""' <<< "$artifact_record")"
          artifact_url="$(jq -r '.archive_download_url' <<< "$artifact_record")"
          artifact_expires="$(jq -r '.expires_at' <<< "$artifact_record")"
          [[ "$artifact_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo '::error::Root Artifact has no valid GitHub digest'; exit 1; }

          root_dir="$RUNNER_TEMP/rem-p0-006-root"
          rm -rf "$root_dir"
          mkdir -p "$root_dir"
          gh run download "$run_id" --name "$artifact_name" --dir "$root_dir"

          sums="$(find "$root_dir" -type f -name SHA256SUMS.txt -print -quit)"
          test -n "$sums"
          (cd "$(dirname "$sums")" && sha256sum --check "$(basename "$sums")")

          context="$(find "$root_dir" -type f -name run-context.json -print -quit)"
          index="$(find "$root_dir" -type f -name workflow-run-index.json -print -quit)"
          safe_http="$(find "$root_dir" -type f -name safe-http.json -print -quit)"
          zap_web_summary="$(find "$root_dir" -type f -name zap-web-summary.json -print -quit)"
          zap_backend_summary="$(find "$root_dir" -type f -name zap-backend-summary.json -print -quit)"
          zap_web_execution="$(find "$root_dir" -type f -name zap-web-execution.json -print -quit)"
          zap_backend_execution="$(find "$root_dir" -type f -name zap-backend-execution.json -print -quit)"
          crm_smoke="$(find "$root_dir" -type f -name crm008r-production-smoke-sanitized.json -print -quit)"
          for required in "$context" "$index" "$safe_http" "$zap_web_summary" "$zap_backend_summary" "$zap_web_execution" "$zap_backend_execution" "$crm_smoke"; do
            test -n "$required" && test -s "$required"
          done

          jq -e --arg sha "$ASSESSED_RELEASE_SHA" '.status == "success" and .target_sha == $sha' "$context" >/dev/null
          jq -e --arg sha "$ASSESSED_RELEASE_SHA" '
            .target_sha == $sha and
            ([.workflow_runs[]] | length == 7) and
            ([.workflow_runs[] | select(. <= 0)] | length == 0)
          ' "$index" >/dev/null
          jq -e --arg sha "$ASSESSED_RELEASE_SHA" '.target_sha == $sha and (.findings | length) == 0' "$safe_http" >/dev/null
          jq -e '.fail_new == 0 and (.warn_new | type) == "number"' "$zap_web_summary" >/dev/null
          jq -e '.fail_new == 0 and (.warn_new | type) == "number"' "$zap_backend_summary" >/dev/null
          jq -e '.container_exit_code | type == "number"' "$zap_web_execution" >/dev/null
          jq -e '.container_exit_code | type == "number"' "$zap_backend_execution" >/dev/null
          jq -e --arg sha "$ASSESSED_RELEASE_SHA" '
            .result == "PASS" and .releaseSha == $sha and
            .checks.authenticatedTwoTenantLogin == "PASS" and
            .checks.crossTenantCursorRejected400 == "PASS" and
            .checks.crossTenantEntityReadRejected404 == "PASS" and
            .checks.sameEtagRaceExactlyOneWinner == "PASS" and
            .checks.missingIfMatchRejected428 == "PASS" and
            .checks.temporaryDataArchived == "PASS"
          ' "$crm_smoke" >/dev/null

          for key in crm nvd security_baseline development_security owasp provenance business_e2e; do
            run_file="$(find "$root_dir" -type f -path "*/workflows/${key}-run.json" -print -quit)"
            test -n "$run_file" && test -s "$run_file"
            jq -e --arg sha "$ASSESSED_RELEASE_SHA" '.conclusion == "success" and .head_sha == $sha' "$run_file" >/dev/null
          done

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "controller_sha=$controller_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "artifact_url=$artifact_url" >> "$GITHUB_OUTPUT"
          echo "artifact_expires=$artifact_expires" >> "$GITHUB_OUTPUT"
          echo "root_dir=$root_dir" >> "$GITHUB_OUTPUT"
          echo "context=$context" >> "$GITHUB_OUTPUT"
          echo "index=$index" >> "$GITHUB_OUTPUT"
          echo "safe_http=$safe_http" >> "$GITHUB_OUTPUT"
          echo "zap_web_summary=$zap_web_summary" >> "$GITHUB_OUTPUT"
          echo "zap_backend_summary=$zap_backend_summary" >> "$GITHUB_OUTPUT"
          echo "zap_web_execution=$zap_web_execution" >> "$GITHUB_OUTPUT"
          echo "zap_backend_execution=$zap_backend_execution" >> "$GITHUB_OUTPUT"
          echo "crm_smoke=$crm_smoke" >> "$GITHUB_OUTPUT"

      - name: Build truthful IN_PROGRESS package from verified evidence
        env:
          ROOT_RUN_ID: ${{ steps.root.outputs.run_id }}
          ROOT_RUN_URL: ${{ steps.root.outputs.run_url }}
          CONTROLLER_SHA: ${{ steps.root.outputs.controller_sha }}
          ARTIFACT_ID: ${{ steps.root.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.root.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.root.outputs.artifact_digest }}
          ARTIFACT_URL: ${{ steps.root.outputs.artifact_url }}
          ARTIFACT_EXPIRES: ${{ steps.root.outputs.artifact_expires }}
          ROOT_DIR: ${{ steps.root.outputs.root_dir }}
          CONTEXT_FILE: ${{ steps.root.outputs.context }}
          INDEX_FILE: ${{ steps.root.outputs.index }}
          SAFE_HTTP_FILE: ${{ steps.root.outputs.safe_http }}
          ZAP_WEB_SUMMARY_FILE: ${{ steps.root.outputs.zap_web_summary }}
          ZAP_BACKEND_SUMMARY_FILE: ${{ steps.root.outputs.zap_backend_summary }}
          ZAP_WEB_EXECUTION_FILE: ${{ steps.root.outputs.zap_web_execution }}
          ZAP_BACKEND_EXECUTION_FILE: ${{ steps.root.outputs.zap_backend_execution }}
          CRM_SMOKE_FILE: ${{ steps.root.outputs.crm_smoke }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          package = Path('docs/security/independent-assurance')
          evidence_dir = package / 'evidence'
          evidence_dir.mkdir(parents=True, exist_ok=True)
          for path in evidence_dir.iterdir():
              if path.is_file() and path.name.startswith('EV-ROOT-'):
                  path.unlink()

          target = os.environ['ASSESSED_RELEASE_SHA']
          root_dir = Path(os.environ['ROOT_DIR'])
          context = json.loads(Path(os.environ['CONTEXT_FILE']).read_text())
          run_index = json.loads(Path(os.environ['INDEX_FILE']).read_text())
          safe_http = json.loads(Path(os.environ['SAFE_HTTP_FILE']).read_text())
          zap_web_summary = json.loads(Path(os.environ['ZAP_WEB_SUMMARY_FILE']).read_text())
          zap_backend_summary = json.loads(Path(os.environ['ZAP_BACKEND_SUMMARY_FILE']).read_text())
          zap_web_execution = json.loads(Path(os.environ['ZAP_WEB_EXECUTION_FILE']).read_text())
          zap_backend_execution = json.loads(Path(os.environ['ZAP_BACKEND_EXECUTION_FILE']).read_text())
          crm_smoke = json.loads(Path(os.environ['CRM_SMOKE_FILE']).read_text())
          generated_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')

          workflow_results = {}
          for key, run_id in run_index['workflow_runs'].items():
              run_file = next(root_dir.rglob(f'workflows/{key}-run.json'))
              data = json.loads(run_file.read_text())
              workflow_results[key] = {
                  'run_id': run_id,
                  'name': data.get('name'),
                  'event': data.get('event'),
                  'head_sha': data.get('head_sha'),
                  'status': data.get('status'),
                  'conclusion': data.get('conclusion'),
                  'html_url': data.get('html_url'),
                  'created_at': data.get('created_at'),
                  'updated_at': data.get('updated_at'),
              }

          documents = {
              'EV-ROOT-INTEGRITY.json': {
                  'schema': 'snad.rem-p0-006.root-artifact-integrity.v1',
                  'assessed_release_sha': target,
                  'controller_sha': os.environ['CONTROLLER_SHA'],
                  'root_run_id': int(os.environ['ROOT_RUN_ID']),
                  'root_run_url': os.environ['ROOT_RUN_URL'],
                  'artifact_id': int(os.environ['ARTIFACT_ID']),
                  'artifact_name': os.environ['ARTIFACT_NAME'],
                  'artifact_digest': os.environ['ARTIFACT_DIGEST'],
                  'artifact_download_api': os.environ['ARTIFACT_URL'],
                  'artifact_expires_at': os.environ['ARTIFACT_EXPIRES'],
                  'internal_sha256sums_verified': True,
                  'verified_at': generated_at,
                  'boundary': 'Automated technical evidence; not independent certification.',
              },
              'EV-ROOT-WORKFLOWS.json': {
                  'schema': 'snad.rem-p0-006.workflow-results.v1',
                  'assessed_release_sha': target,
                  'workflow_results': workflow_results,
              },
              'EV-ROOT-SAFE-HTTP.json': safe_http,
              'EV-ROOT-ZAP.json': {
                  'schema': 'snad.rem-p0-006.zap-summary.v1',
                  'assessed_release_sha': target,
                  'web': {'summary': zap_web_summary, 'execution': zap_web_execution},
                  'backend': {'summary': zap_backend_summary, 'execution': zap_backend_execution},
                  'boundary': 'Complete passive ZAP summaries from the immutable root Artifact; manual penetration testing remains required.',
              },
              'EV-ROOT-TENANT-CRM.json': crm_smoke,
              'EV-ROOT-GAP-ANALYSIS.json': {
                  'schema': 'snad.rem-p0-006.independent-gap-analysis.v1',
                  'assessed_release_sha': target,
                  'status': 'INDEPENDENT_ASSESSMENT_REQUIRED',
                  'not_proven_by_automation': [
                      'PEN-03 injection, SSRF, unsafe parsing, import and stored-content testing',
                      'TEN-03 horizontal and vertical privilege escalation across platform scope',
                      'TEN-04 revoked, stale and conflicting role/capability behavior',
                      'CFG-03 Production IAM, break-glass and audit configuration review',
                      'PRI-01 personal-data inventory, minimization, retention and deletion',
                      'PRI-02 independent threat-model challenge and abuse-case review',
                      'RET-01 independent retest or explicit no-material-findings statement',
                  ],
                  'partially_evidenced_cases_require_independent_judgment': [
                      'PEN-01', 'PEN-02', 'TEN-01', 'TEN-02', 'CFG-01', 'CFG-02',
                      'SUP-01', 'SUP-02', 'BUS-01', 'BUS-02', 'AUD-01', 'RET-02'
                  ],
                  'decision': 'Do not set READY_FOR_APPROVAL until every required case has independent PASS evidence.',
              },
          }
          for name, value in documents.items():
              (evidence_dir / name).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          checklist = package / 'INDEPENDENT-ASSESSOR-EXECUTION-CHECKLIST.md'
          checklist.write_text(f'''# REM-P0-006 Independent Assessor Execution Checklist

**Engagement:** `{os.environ['ENGAGEMENT_ID']}`  
**Assessor:** `@{os.environ['ASSESSOR_LOGIN']}`  
**Exact assessed release:** `{target}`  
**Root run:** `{os.environ['ROOT_RUN_ID']}`  
**Root Artifact:** `{os.environ['ARTIFACT_ID']}` / `{os.environ['ARTIFACT_NAME']}`  
**Artifact digest:** `{os.environ['ARTIFACT_DIGEST']}`

The committed automated evidence has been integrity-checked. It is input evidence only. The assessor must independently execute or review every case in `TEST-COVERAGE-MATRIX.json`, publish reproducible evidence and findings, and provide an explicit independence attestation.

## Mandatory outputs

1. Independence attestation satisfying `APPOINTMENT-REM-P0-006-2026-07-27.md`.
2. Independent PASS/FAIL decision and evidence for all 19 coverage cases.
3. Findings register with reproduction evidence, owner, remediation reference and retest evidence.
4. Explicit no-material-findings statement when applicable; absence of automated findings is not sufficient.
5. Final independent retest on `{target}`.
6. Independent Assessor approval only after every material finding is closed.

## Current blocking gaps

- `PEN-03`, `TEN-03`, `TEN-04`, `CFG-03`, `PRI-01`, `PRI-02`, `RET-01`: no complete independent evidence.
- Remaining cases have automated evidence only or partial scope and require independent judgment.
- Security Governance and Project Owner approvals are not yet requested because the package is not `READY_FOR_APPROVAL`.

Do not merge this PR as closure evidence. It is the controlled independent-assessment workspace.
''', encoding='utf-8')

          def digest(path: Path) -> str:
              return 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()

          appointment = package / 'APPOINTMENT-REM-P0-006-2026-07-27.md'
          records = [
              ('EV-APPOINTMENT', 'APPOINTMENT', 'Independent assessor appointment', 'governance', [], appointment, 'Project Owner'),
              ('EV-ROOT-INTEGRITY', 'REPORT', 'Immutable root Artifact identity and SHA256SUMS verification', 'cross_cutting', [], evidence_dir / 'EV-ROOT-INTEGRITY.json', 'REM-P0-006 Evidence Reconciler'),
              ('EV-PEN-AUTOMATED', 'TEST_OUTPUT', 'Automated safe-HTTP and passive DAST evidence', 'penetration_testing', ['PEN-01', 'PEN-02'], evidence_dir / 'EV-ROOT-ZAP.json', 'REM-P0-006 Root Assessment'),
              ('EV-TENANT-CRM', 'TEST_OUTPUT', 'Authenticated two-tenant CRM Production evidence', 'tenant_boundary_and_object_authorization', ['TEN-01', 'TEN-02'], evidence_dir / 'EV-ROOT-TENANT-CRM.json', 'CRM Production Closure Gate'),
              ('EV-CONFIG-HTTP', 'TEST_OUTPUT', 'Production release identity, health, CORS and header checks', 'production_configuration_and_secrets', ['CFG-01'], evidence_dir / 'EV-ROOT-SAFE-HTTP.json', 'REM-P0-006 Root Assessment'),
              ('EV-SUPPLY-CHAIN', 'TEST_OUTPUT', 'NVD, OWASP, baseline and provenance workflow results', 'dependency_and_supply_chain', ['SUP-01', 'SUP-02'], evidence_dir / 'EV-ROOT-WORKFLOWS.json', 'REM-P0-006 Root Assessment'),
              ('EV-PRIVACY-GAP', 'REPORT', 'Privacy and threat-model independent evidence gap', 'privacy_and_threat_model', ['PRI-01', 'PRI-02'], evidence_dir / 'EV-ROOT-GAP-ANALYSIS.json', 'REM-P0-006 Evidence Reconciler'),
              ('EV-RETEST-AUTOMATED', 'RETEST_STATEMENT', 'Automated exact-release regression and retest input', 'remediation_retest', ['RET-02'], evidence_dir / 'EV-ROOT-INTEGRITY.json', 'REM-P0-006 Root Assessment'),
          ]
          evidence_index = {
              'schema_version': '2.0',
              'finding_id': 'REM-P0-006',
              'status': 'IN_PROGRESS',
              'evidence': [],
          }
          for evidence_id, typ, title, stream, cases, path, creator in records:
              evidence_index['evidence'].append({
                  'id': evidence_id,
                  'type': typ,
                  'title': title,
                  'workstream': stream,
                  'coverage_case_ids': cases,
                  'location': 'file:' + str(path.relative_to(package)),
                  'sha256': digest(path),
                  'created_at': generated_at,
                  'created_by': creator,
                  'classification': 'INTERNAL',
                  'sanitized': True,
                  'assessed_release_sha': target,
              })
          (package / 'evidence-index.json').write_text(json.dumps(evidence_index, indent=2, sort_keys=True) + '\n')

          coverage = json.loads((package / 'TEST-COVERAGE-MATRIX.json').read_text())
          coverage['status'] = 'IN_PROGRESS'
          mapping = {
              'PEN-01': ['EV-PEN-AUTOMATED'], 'PEN-02': ['EV-PEN-AUTOMATED'],
              'TEN-01': ['EV-TENANT-CRM'], 'TEN-02': ['EV-TENANT-CRM'],
              'CFG-01': ['EV-CONFIG-HTTP'], 'SUP-01': ['EV-SUPPLY-CHAIN'],
              'SUP-02': ['EV-SUPPLY-CHAIN'], 'PRI-01': ['EV-PRIVACY-GAP'],
              'PRI-02': ['EV-PRIVACY-GAP'], 'RET-02': ['EV-RETEST-AUTOMATED'],
          }
          partially_evidenced = {'PEN-01', 'PEN-02', 'TEN-01', 'TEN-02', 'CFG-01', 'SUP-01', 'SUP-02', 'RET-02'}
          for case in coverage['cases']:
              case['status'] = 'IN_PROGRESS' if case['id'] in partially_evidenced else 'NOT_STARTED'
              case['evidence_ids'] = mapping.get(case['id'], [])
          (package / 'TEST-COVERAGE-MATRIX.json').write_text(json.dumps(coverage, indent=2, sort_keys=True) + '\n')

          findings = json.loads((package / 'findings-register.json').read_text())
          findings['assessment_status'] = 'IN_PROGRESS'
          findings['findings'] = []
          (package / 'findings-register.json').write_text(json.dumps(findings, indent=2, sort_keys=True) + '\n')

          manifest = json.loads((package / 'assessment-manifest.json').read_text())
          manifest['closure_state'] = 'NOT_READY'
          manifest['commercial_go_live'] = 'NOT_APPROVED'
          manifest['assessor'] = {
              'independence_status': 'PENDING_VERIFICATION',
              'organization': 'External independent individual assessor',
              'lead_assessor': os.environ['ASSESSOR_LOGIN'],
              'engagement_id': os.environ['ENGAGEMENT_ID'],
              'appointment_evidence_id': 'EV-APPOINTMENT',
              'independence_evidence_id': '',
          }
          manifest['assessed_release'] = {
              'repository_sha': target,
              'deployment_id': 'snad-production-vercel-render-f34f2dd7',
              'environment': 'production',
              'started_at': context['started_at_utc'],
              'completed_at': context['completed_at_utc'],
          }
          stream_evidence = {
              'penetration_testing': ['EV-PEN-AUTOMATED'],
              'tenant_boundary_and_object_authorization': ['EV-TENANT-CRM'],
              'production_configuration_and_secrets': ['EV-CONFIG-HTTP'],
              'dependency_and_supply_chain': ['EV-SUPPLY-CHAIN'],
              'privacy_and_threat_model': ['EV-PRIVACY-GAP'],
              'remediation_retest': ['EV-RETEST-AUTOMATED'],
          }
          for stream in manifest['workstreams']:
              stream['status'] = 'IN_PROGRESS'
              stream['evidence_ids'] = stream_evidence[stream['id']]
          manifest['findings_summary'] = {
              severity: {'open': 0, 'closed': 0, 'residual_accepted': 0}
              for severity in ('critical', 'high', 'medium', 'low')
          }
          manifest['residual_risks'] = []
          manifest['approvals'] = {
              role: {'decision': 'PENDING', 'name': '', 'approved_at': '', 'evidence_id': ''}
              for role in ('independent_assessor', 'security_governance', 'project_owner')
          }
          manifest['closure_decision_evidence_id'] = ''
          (package / 'assessment-manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY

          python3 scripts/ci/validate_independent_security_assurance.py \
            --mode readiness \
            --expected-release-sha "$ASSESSED_RELEASE_SHA"

      - name: Commit candidate and open independent-assessment PR
        env:
          ROOT_RUN_ID: ${{ steps.root.outputs.run_id }}
          ROOT_RUN_URL: ${{ steps.root.outputs.run_url }}
          ARTIFACT_ID: ${{ steps.root.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ steps.root.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ steps.root.outputs.artifact_digest }}
          ARTIFACT_EXPIRES: ${{ steps.root.outputs.artifact_expires }}
        shell: bash
        run: |
          set -euo pipefail
          branch="rem-p0-006-independent-assessment-${ROOT_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B "$branch" origin/main
          git add docs/security/independent-assurance
          git commit -m "security: reconcile REM-P0-006 root evidence for independent assessment"
          git push --force-with-lease origin "$branch"

          pr_number="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create \
              --base main \
              --head "$branch" \
              --title 'security: execute REM-P0-006 independent assessment' \
              --body "## Governed purpose

This PR contains a machine-reconciled, integrity-verified **IN_PROGRESS** evidence package for REM-P0-006.

### Verified automated inputs

- Assessed Production SHA: \`${ASSESSED_RELEASE_SHA}\`
- Root assessment run: ${ROOT_RUN_URL}
- Root Artifact: \`${ARTIFACT_ID}\` / \`${ARTIFACT_NAME}\`
- GitHub Artifact digest: \`${ARTIFACT_DIGEST}\`
- Internal \`SHA256SUMS.txt\`: verified successfully
- Artifact expiry: \`${ARTIFACT_EXPIRES}\`

### Current truthful state

- \`closure_state=NOT_READY\`
- assessor appointment recorded; independence remains \`PENDING_VERIFICATION\`
- automated and partial evidence is indexed with real local SHA-256 digests
- uncovered or partially covered cases remain \`NOT_STARTED\` / \`IN_PROGRESS\`
- approvals remain \`PENDING\`
- broad commercial go-live remains \`NOT_APPROVED\`

### Required action by appointed independent assessor

\`@${ASSESSOR_LOGIN}\` must provide the explicit independence attestation, execute/review every one of the 19 governed coverage cases, publish findings and independent retest evidence on the exact release, and approve only after all material findings are closed.

This PR must not be merged as a closure record. It is the controlled independent-assessment workspace. Security Governance and Project Owner approvals are requested only after a separate package reaches \`READY_FOR_APPROVAL\`.

Refs #516 #749 #763." )"
            pr_number="${pr_url##*/}"
          fi

          gh pr comment "$pr_number" --body "@${ASSESSOR_LOGIN} — formal independent-assessment execution is requested for engagement \`${ENGAGEMENT_ID}\`. Review the appointment and execution checklist, explicitly attest independence, then submit reproducible case results and findings against \`${ASSESSED_RELEASE_SHA}\`. A generic approval without the required evidence does not satisfy REM-P0-006."
          gh pr edit "$pr_number" --add-reviewer "$ASSESSOR_LOGIN" || true
          gh issue comment 516 --body "## REM-P0-006 independent assessment workspace opened

- PR: #${pr_number}
- Root run: \`${ROOT_RUN_ID}\`
- Root Artifact: \`${ARTIFACT_ID}\` / \`${ARTIFACT_NAME}\`
- Artifact digest: \`${ARTIFACT_DIGEST}\`
- Assessed release: \`${ASSESSED_RELEASE_SHA}\`
