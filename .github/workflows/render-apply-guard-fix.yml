name: Render Apply Guard Fix + Live Deploy + Log Capture

# Phase 7 fix + Phase C live log capture.
#
# Root cause (proven via historical log run 32016982612):
#   Boot 1 succeeds (110s) but ApplicationReadyEvent fires
#   ProductionWorkflowStubGuard which throws:
#     "sanad.service-auth.jwt-secret is missing or <32 chars"
#   Boot 2 fails (intermittent Supavisor ENOIDENTIFIER)
#
# Fix (per Phase E authorization):
#   - Set SANAD_SERVICE_AUTH_JWT_SECRET (new 64-char secret, generated)
#   - Set SANAD_WORKFLOW_ENGINE_BASE_URL=https://sanad-backend-mcrj.onrender.com
#   - Set SANAD_AI_GATEWAY_BASE_URL=https://sanad-backend-mcrj.onrender.com
#   - Set SANAD_PRODUCTION_GUARD_ENABLED=true (re-enable guard)
#
# Then trigger deploy on SAME service + capture logs LIVE during boot.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'apply-guard-fix' to confirm env var updates + deploy"
        required: true
        default: "no"

permissions:
  contents: read

jobs:
  apply-and-deploy:
    name: Apply guard fix + deploy + capture live logs
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    steps:
      - name: Confirm
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "apply-guard-fix" ]; then
            echo "::error::Confirmation input must be 'apply-guard-fix'"
            exit 1
          fi

      - name: Apply env vars + suspend + resume + capture live logs
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -uo pipefail
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          BASE="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"
          BACKEND_URL="https://sanad-backend-mcrj.onrender.com"

          echo "========================================"
          echo "PHASE E — PRODUCTION GUARD FIX"
          echo "========================================"
          echo ""
          echo "Service: ${RENDER_SERVICE_ID}"
          echo "Backend URL: ${BACKEND_URL}"
          echo ""

          # ----- STEP 1: Suspend service (ensure clean state) -----
          echo "=== STEP 1: Suspend service ==="
          HTTP=$(curl -s -o /tmp/suspend.json -w "%{http_code}" --max-time 30 -X POST -H "$AUTH" "$BASE/suspend")
          echo "POST /suspend -> HTTP $HTTP"
          sleep 15
          echo ""

          # ----- STEP 2: Generate a secure 64-char secret (NOT printed) -----
          echo "=== STEP 2: Generate SANAD_SERVICE_AUTH_JWT_SECRET (64 hex chars, not printed) ==="
          JWT_SERVICE_SECRET=$(openssl rand -hex 32)
          echo "  generated secret length: ${#JWT_SERVICE_SECRET} (value REDACTED)"
          echo ""

          # ----- STEP 3: PUT all 4 env vars -----
          echo "=== STEP 3: PUT env vars ==="

          put_env() {
            local key="$1"
            local val="$2"
            local body
            body=$(jq -n --arg v "$val" '{value:$v}')
            HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" --max-time 45 -X PUT \
              -H "$AUTH" -H 'Accept: application/json' -H 'Content-Type: application/json' \
              --data "$body" "$BASE/env-vars/$key")
            echo "  PUT $key -> HTTP $HTTP"
            if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
              echo "::error::PUT $key failed"
              cat /tmp/resp.json
              return 1
            fi
          }

          put_env "SANAD_SERVICE_AUTH_JWT_SECRET" "$JWT_SERVICE_SECRET"
          put_env "SANAD_WORKFLOW_ENGINE_BASE_URL" "$BACKEND_URL"
          put_env "SANAD_AI_GATEWAY_BASE_URL" "$BACKEND_URL"
          put_env "SANAD_PRODUCTION_GUARD_ENABLED" "true"
          echo ""

          # ----- STEP 4: Verify env vars are set -----
          echo "=== STEP 4: Verify env vars (sanity — no values printed) ==="
          for key in SANAD_SERVICE_AUTH_JWT_SECRET SANAD_WORKFLOW_ENGINE_BASE_URL SANAD_AI_GATEWAY_BASE_URL SANAD_PRODUCTION_GUARD_ENABLED; do
            val=$(curl -s --max-time 30 -H "$AUTH" "$BASE/env-vars/$key" | jq -r '(.envVar // .).value // empty')
            if [ -n "$val" ]; then
              if [ "$key" = "SANAD_SERVICE_AUTH_JWT_SECRET" ]; then
                echo "  $key = PRESENT (length=${#val} — value REDACTED)"
              else
                echo "  $key = $val"
              fi
            else
              echo "  $key = MISSING ❌"
            fi
          done
          echo ""

          # ----- STEP 5: Trigger deploy on SAME service -----
          echo "=== STEP 5: Trigger deploy (POST /deploys, clearCache=do_not_clear) ==="
          HTTP=$(curl -s -o /tmp/deploy.json -w "%{http_code}" --max-time 30 -X POST \
            -H "$AUTH" -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data '{"clearCache":"do_not_clear"}' "$BASE/deploys")
          echo "POST /deploys -> HTTP $HTTP"
          DEPLOY_ID=$(jq -r '.id // empty' /tmp/deploy.json)
          echo "Deploy ID: $DEPLOY_ID"
          test -n "$DEPLOY_ID" || { echo "::error::no deploy id"; cat /tmp/deploy.json; exit 1; }
          echo ""

          # ----- STEP 6: Capture live logs during deploy -----
          echo "=== STEP 6: Capture live logs (poll /v1/logs every 10s for up to 18 min) ==="
          OWNER_ID=$(curl -s --max-time 30 -H "$AUTH" "$BASE" | jq -r '.ownerId // .owner // empty')
          echo "ownerId: ${OWNER_ID:-<none>}"

          # Save deploy start time (used as startTime for log query)
          START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Log capture start: $START_TIME"
          echo ""

          mkdir -p /tmp/live-logs
          > /tmp/live-logs/all.txt

          DEPLOY_STATUS="update_in_progress"
          PREV_LOGS_COUNT=0
          ITERATION=0
          MAX_ITERATIONS=100  # 100 * 10s = 16.7 min

          while [ "$DEPLOY_STATUS" = "update_in_progress" ] && [ "$ITERATION" -lt "$MAX_ITERATIONS" ]; do
            ITERATION=$((ITERATION + 1))
            sleep 10

            # Poll deploy status
            DEPLOY_STATUS=$(curl -s --max-time 15 -H "$AUTH" "$BASE/deploys/$DEPLOY_ID" | jq -r '.deploy.status // .status // "unknown"')
            echo "[iter $ITERATION] deploy status: $DEPLOY_STATUS"

            # Poll logs (use /v1/logs with startTime + resource)
            if [ -n "$OWNER_ID" ]; then
              URL="https://api.render.com/v1/logs?ownerId=${OWNER_ID}&resource=${RENDER_SERVICE_ID}&startTime=${START_TIME}&direction=forward&limit=200"
              curl -s --max-time 15 -H "$AUTH" "$URL" > /tmp/live-logs/page.json
              jq -r 'if type=="array" then .[] elif .logs then .logs[] elif .lines then .lines[] else empty end | (if type=="object" then (.text // .message // .msg // (. | tostring)) else (tostring) end)' /tmp/live-logs/page.json 2>/dev/null >> /tmp/live-logs/all.txt
              CURR_COUNT=$(wc -l < /tmp/live-logs/all.txt)
              NEW_LINES=$((CURR_COUNT - PREV_LOGS_COUNT))
              if [ "$NEW_LINES" -gt 0 ]; then
                echo "  +$NEW_LINES new log lines (total: $CURR_COUNT)"
                # Show last 5 new lines
                tail -$NEW_LINES /tmp/live-logs/all.txt | head -5 | sed 's/^/    /'
                PREV_LOGS_COUNT=$CURR_COUNT
              fi
            fi

            # Check for terminal states
            if [ "$DEPLOY_STATUS" = "live" ]; then
              echo "::notice::DEPLOY LIVE after $((ITERATION * 10))s"
              break
            fi
            if echo "$DEPLOY_STATUS" | grep -qiE 'failed|canceled|deactivated'; then
              echo "::error::Deploy terminal: $DEPLOY_STATUS"
              break
            fi
          done
          echo ""

          # ----- STEP 7: Final logs dump -----
          echo "=== STEP 7: FINAL LOG DUMP (last 50 lines) ==="
          tail -50 /tmp/live-logs/all.txt
          echo ""

          # ----- STEP 8: Search for key error patterns -----
          echo "=== STEP 8: ERROR PATTERN SEARCH ==="
          echo "ENOIDENTIFIER count: $(grep -c 'ENOIDENTIFIER' /tmp/live-logs/all.txt || echo 0)"
          echo "BeanCreationException count: $(grep -c 'BeanCreationException' /tmp/live-logs/all.txt || echo 0)"
          echo "ProductionGuard count: $(grep -c 'ProductionWorkflowStubGuard\|Production startup refused' /tmp/live-logs/all.txt || echo 0)"
          echo "Application run failed count: $(grep -c 'Application run failed' /tmp/live-logs/all.txt || echo 0)"
          echo "Started SanadPlatformApplication count: $(grep -c 'Started SanadPlatformApplication' /tmp/live-logs/all.txt || echo 0)"
          echo ""

          # ----- STEP 9: Health probe -----
          echo "=== STEP 9: Health probe ==="
          HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 "$BACKEND_URL/actuator/health")
          HEALTH_STATUS=$(jq -r '.status // "unknown"' /tmp/health.json 2>/dev/null || echo "unknown")
          echo "HTTP_CODE: $HTTP_CODE"
          echo "STATUS: $HEALTH_STATUS"
          echo ""

          # ----- STEP 10: Summary -----
          echo "========================================"
          echo "PHASE E COMPLETE"
          echo "========================================"
          echo "DEPLOY_ID=$DEPLOY_ID"
          echo "DEPLOY_STATUS=$DEPLOY_STATUS"
          echo "HEALTH_HTTP=$HTTP_CODE"
          echo "HEALTH_STATUS=$HEALTH_STATUS"
          echo "TOTAL_LOG_LINES_CAPTURED=$(wc -l < /tmp/live-logs/all.txt)"
          if [ "$DEPLOY_STATUS" = "live" ] && [ "$HTTP_CODE" = "200" ] && [ "$HEALTH_STATUS" = "UP" ]; then
            echo "FINAL_RESULT=SUCCESS ✅"
          elif [ "$DEPLOY_STATUS" = "live" ]; then
            echo "FINAL_RESULT=PARTIAL (live but health not UP)"
          else
            echo "FINAL_RESULT=FAILED — investigate Phase 11 next-error"
          fi
          echo "========================================"

      - name: Upload live logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-live-logs
          path: /tmp/live-logs/
          if-no-files-found: warn
          retention-days: 14
