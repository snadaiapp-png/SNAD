name: CRM-006 Final Production Closure Trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crm-006-final-production-closure-trigger.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: crm-006-final-production-closure-trigger
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch exact-main CRM-G1 production closure
    runs-on: ubuntu-latest
    steps:
      - name: Capture exact protected main SHA
        id: release
        shell: bash
        run: |
          set -euo pipefail
          echo "release_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Dispatch governed production closure workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/crm-g1-production-closure.yml/dispatches" \
            -f ref=main

      - name: Record dispatch evidence
        shell: bash
        run: |
          {
            echo '## CRM-006 final Production closure dispatch'
            echo "- Requested release SHA: ${{ steps.release.outputs.release_sha }}"
            echo '- Dispatched workflow: crm-g1-production-closure.yml'
            echo '- Closure remains prohibited until the dispatched workflow succeeds on the same current main SHA.'
          } >> "$GITHUB_STEP_SUMMARY"
