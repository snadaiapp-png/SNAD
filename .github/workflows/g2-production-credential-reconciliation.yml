name: G2 Production Credential Reconciliation

on:
  workflow_run:
    workflows:
      - SANAD Production Release
    types:
      - completed

permissions:
  contents: read
  actions: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      G2_TENANT_ID: ${{ secrets.AUTH_SMOKE_TENANT_B_ID }}
      G2_ADMIN_EMAIL: ${{ secrets.AUTH_SMOKE_TENANT_B_EMAIL }}
      G2_ADMIN_PASSWORD: ${{ secrets.AUTH_SMOKE_TENANT_B_PASSWORD }}
      BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
      G2_EMPLOYEE_EMAIL: ${{ secrets.G2_PROD_EMPLOYEE_EMAIL }}
      G2_EMPLOYEE_PASSWORD: ${{ secrets.G2_PROD_EMPLOYEE_PASSWORD }}
      G2_MANAGER_EMAIL: ${{ secrets.G2_PROD_MANAGER_EMAIL }}
      G2_MANAGER_PASSWORD: ${{ secrets.G2_PROD_MANAGER_PASSWORD }}
      G2_HR_EMAIL: ${{ secrets.G2_PROD_HR_EMAIL }}
      G2_HR_PASSWORD: ${{ secrets.G2_PROD_HR_PASSWORD }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/snad-backend

    steps:
      - name: Verify triggering SHA is explicitly recovery-authorized
        id: authorization
        shell: bash
        run: |
          set -euo pipefail
          message="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA" --jq '.commit.message')"
          if grep -q 'PRODUCTION-RECOVERY-G2-AUTHORIZED' <<<"$message"; then
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
          else
            echo 'authorized=false' >> "$GITHUB_OUTPUT"
            echo 'Triggering release is not an authorized G2 recovery release; no recovery action taken.'
          fi

      - name: Verify triggering failure is G2 credential drift
        id: scope
        if: steps.authorization.outputs.authorized == 'true' && github.event.workflow_run.conclusion == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$TRIGGER_RUN_ID" --repo "$GITHUB_REPOSITORY" --log > "$RUNNER_TEMP/trigger-release.log" || true
          if grep -q 'Login failed for .*: 401' "$RUNNER_TEMP/trigger-release.log" \
             && grep -q 'g2-visual.spec.ts' "$RUNNER_TEMP/trigger-release.log"; then
            echo 'credential_drift=true' >> "$GITHUB_OUTPUT"
          else
            echo 'credential_drift=false' >> "$GITHUB_OUTPUT"
            echo 'Trigger failure is not the governed G2 credential-drift signature; no credential mutation will run.'
          fi

      - name: Checkout exact recovery release SHA
        if: steps.authorization.outputs.authorized == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify target remains current main
        if: steps.authorization.outputs.authorized == 'true'
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$TARGET_SHA" || { echo '::error::Recovery target is no longer current main'; exit 1; }

      - name: Mask governed values
        if: steps.authorization.outputs.authorized == 'true' && steps.scope.outputs.credential_drift == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for var in G2_TENANT_ID G2_ADMIN_EMAIL G2_ADMIN_PASSWORD G2_EMPLOYEE_EMAIL G2_EMPLOYEE_PASSWORD G2_MANAGER_EMAIL G2_MANAGER_PASSWORD G2_HR_EMAIL G2_HR_PASSWORD RENDER_API_KEY RENDER_SERVICE_ID; do
            test -n "${!var}" || { echo "::error::$var is required"; exit 1; }
            echo "::add-mask::${!var}"
          done

      - name: Reconcile and prove governed identities
        id: reconcile
        if: steps.authorization.outputs.authorized == 'true' && steps.scope.outputs.credential_drift == 'true'
        run: python3 scripts/operations/g2_credential_reconciliation.py

      - name: Close recovery surface and redeploy exact image
        id: close
        if: always() && steps.authorization.outputs.authorized == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # ------------------------------------------------------------
          # Stage 0: Required-inputs verification with explicit markers
          # ------------------------------------------------------------
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo '::error::RENDER_API_KEY is required (present=NO)'
            echo 'RECOVERY_CLOSE_RENDER_API_KEY_PRESENT=NO'
            exit 1
          fi
          if [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo '::error::RENDER_SERVICE_ID is required (present=NO)'
            echo 'RECOVERY_CLOSE_RENDER_SERVICE_ID_PRESENT=NO'
            exit 1
          fi
          echo "RECOVERY_CLOSE_RENDER_API_KEY_PRESENT=YES"
          echo "RECOVERY_CLOSE_RENDER_SERVICE_ID_PRESENT=YES"
          echo "RECOVERY_CLOSE_TARGET_SHA=$TARGET_SHA"

          # ------------------------------------------------------------
          # Helper: sanitize a Render API response body for log output.
          # Removes any auth header values, API keys, and known secret
          # patterns. Only structural fields (status, message, id,
          # serviceId, deploy, envVar) are preserved.
          # ------------------------------------------------------------
          sanitize_render_response() {
            local body="$1"
            if [ -z "$body" ]; then
              echo '(empty body)'
              return
            fi
            # Strip common secret patterns first (defensive — Render never
            # returns secrets in env-var PUT responses, but be fail-closed).
            local sanitized
            sanitized="$(printf '%s' "$body" \
              | sed -E 's/(Bearer [A-Za-z0-9._-]+)/Bearer ***/g' \
              | sed -E 's/(rndr_[A-Za-z0-9_-]+)/rndr_***/g' \
              | sed -E 's/(sk_[A-Za-z0-9_-]+)/sk_***/g' \
              | sed -E 's/(ghp_[A-Za-z0-9_-]+)/ghp_***/g' \
              | sed -E 's/(gho_[A-Za-z0-9_-]+)/gho_***/g' \
              | sed -E 's/(github_pat_[A-Za-z0-9_-]+)/github_pat_***/g' \
              | sed -E 's/("password"[[:space:]]*:[[:space:]]*")[^"]+/\1***/g' \
              | sed -E 's/("value"[[:space:]]*:[[:space:]]*")[^"]+/\1***/g' \
              | sed -E 's/("authorization"[[:space:]]*:[[:space:]]*")[^"]+/\1***/g')"
            # Truncate to a safe log length.
            printf '%s' "$sanitized" | head -c 2000
          }

          # ------------------------------------------------------------
          # Stage 1: Disable recovery surface env var on Render service.
          # Captures HTTP status code AND sanitized response body for
          # auditability. Does NOT redirect to /dev/null — fail-closed
          # diagnosis is required when this step previously failed in 3s.
          # ------------------------------------------------------------
          echo '::group::Stage 1: Disable SNAD_SECURITY_G2_RECONCILIATION_ENABLED on Render'
          env_update_response_file="$RUNNER_TEMP/recovery-close-env-update-response.json"
          env_update_http="$(curl --silent --show-error \
            -o "$env_update_response_file" \
            -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"value":"false"}' \
            --max-time 30 \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/SNAD_SECURITY_G2_RECONCILIATION_ENABLED" \
            || echo "000")"
          echo "RECOVERY_CLOSE_ENV_UPDATE_REQUEST_STAGE=PUT_ENV_VAR"
          echo "RECOVERY_CLOSE_ENV_UPDATE_HTTP_METHOD=PUT"
          echo "RECOVERY_CLOSE_ENV_UPDATE_HTTP_STATUS=$env_update_http"
          echo "RECOVERY_CLOSE_ENV_UPDATE_TARGET=SNAD_SECURITY_G2_RECONCILIATION_ENABLED"
          echo "RECOVERY_CLOSE_ENV_UPDATE_SANITIZED_RESPONSE_BODY=$(sanitize_render_response "$(cat "$env_update_response_file" 2>/dev/null || echo '')")"
          if [ "$env_update_http" != "200" ] && [ "$env_update_http" != "204" ]; then
            echo "::error::Recovery surface env-var update failed (HTTP $env_update_http). Sanitized response body shown above for diagnosis."
            echo "RECOVERY_CLOSE_ENV_UPDATE_RESULT=FAIL"
            exit 1
          fi
          echo "RECOVERY_CLOSE_ENV_UPDATE_RESULT=PASS"
          echo '::endgroup::'

          # ------------------------------------------------------------
          # Stage 2: Trigger exact-image redeploy on Render.
          # Uses the same TARGET_SHA image as the recovery release so
          # DEPLOYED_SHA == AUTHORIZED_SHA after the redeploy completes.
          # ------------------------------------------------------------
          echo '::group::Stage 2: Dispatch exact-image redeploy on Render'
          image_ref="${REGISTRY}/${IMAGE_NAME}:${TARGET_SHA}"
          echo "RECOVERY_CLOSE_IMAGE_REF=$image_ref"
          echo "RECOVERY_CLOSE_DEPLOY_REQUEST_STAGE=POST_DEPLOY"
          echo "RECOVERY_CLOSE_DEPLOY_HTTP_METHOD=POST"
          deploy_request_file="$RUNNER_TEMP/recovery-close-deploy-request.json"
          deploy_response_file="$RUNNER_TEMP/recovery-close-deployment.json"
          jq -n --arg image "$image_ref" '{imageUrl:$image,clearCache:"do_not_clear"}' > "$deploy_request_file"
          deploy_http="$(curl --silent --show-error \
            -o "$deploy_response_file" \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data @"$deploy_request_file" \
            --max-time 30 \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            || echo "000")"
          echo "RECOVERY_CLOSE_DEPLOY_HTTP_STATUS=$deploy_http"
          echo "RECOVERY_CLOSE_DEPLOY_SANITIZED_RESPONSE_BODY=$(sanitize_render_response "$(cat "$deploy_response_file" 2>/dev/null || echo '')")"
          if [ "$deploy_http" != "200" ] && [ "$deploy_http" != "201" ] && [ "$deploy_http" != "202" ]; then
            echo "::error::Recovery close deploy dispatch failed (HTTP $deploy_http). Sanitized response body shown above for diagnosis."
            echo "RECOVERY_CLOSE_DEPLOY_RESULT=FAIL"
            exit 1
          fi
          deploy_id="$(jq -r '(.deploy // .).id // empty' "$deploy_response_file" 2>/dev/null || echo '')"
          if [ -z "$deploy_id" ]; then
            echo "::error::Recovery close deploy dispatch response missing id field. Sanitized body shown above."
            echo "RECOVERY_CLOSE_DEPLOY_RESULT=FAIL"
            exit 1
          fi
          echo "RECOVERY_CLOSE_DEPLOY_ID=$deploy_id"
          echo "RECOVERY_CLOSE_DEPLOY_RESULT=DISPATCHED"
          echo '::endgroup::'

          # ------------------------------------------------------------
          # Stage 3: Poll deploy status until live (or terminal failure).
          # Up to 180 attempts × 5s = 15 min (unchanged ceiling).
          # ------------------------------------------------------------
          echo '::group::Stage 3: Poll Render deploy status until live'
          state_file="$RUNNER_TEMP/recovery-close-state.json"
          for attempt in $(seq 1 180); do
            poll_http="$(curl --silent --show-error \
              -o "$state_file" \
              -w '%{http_code}' \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H 'Accept: application/json' \
              --max-time 15 \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" \
              || echo "000")"
            status="$(jq -r '(.deploy // .).status // "pending"' "$state_file" 2>/dev/null || echo "unknown")"
            echo "[poll attempt=$attempt] poll_http=$poll_http status=$status"
            case "$status" in
              live)
                deployed_image="$(jq -r '(.deploy // .).image.ref // empty' "$state_file" 2>/dev/null || echo '')"
                echo "RECOVERY_CLOSE_DEPLOY_STATUS=live"
                echo "RECOVERY_CLOSE_DEPLOYED_IMAGE=$deployed_image"
                if [ "$deployed_image" != "$image_ref" ]; then
                  echo "::error::Recovery close deployed wrong image (expected=$image_ref actual=$deployed_image)"
                  exit 1
                fi
                echo 'RECOVERY_SURFACE_CONFIGURED=false'
                echo '::endgroup::'
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "::error::Recovery close deployment failed: $status"
                echo "RECOVERY_CLOSE_DEPLOY_STATUS=$status"
                echo "RECOVERY_CLOSE_DEPLOY_SANITIZED_STATE_BODY=$(sanitize_render_response "$(cat "$state_file" 2>/dev/null || echo '')")"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo '::error::Recovery close deployment timed out'
          echo "RECOVERY_CLOSE_DEPLOY_STATUS=timeout"
          exit 1

      - name: Prove recovery endpoint is disabled before final release
        id: disabled
        if: always() && steps.authorization.outputs.authorized == 'true' && steps.close.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          auth_api="${BASE_URL%/}/api/v1/auth"
          for attempt in $(seq 1 36); do
            health="$(curl --silent --show-error -o /dev/null -w '%{http_code}' --max-time 15 "${BASE_URL%/}/actuator/health/readiness" || true)"
            [ "$health" = '200' ] && break
            sleep 5
          done

          response="$(curl --silent --show-error --fail-with-body \
            -X POST "$auth_api/login" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg e "$G2_ADMIN_EMAIL" --arg p "$G2_ADMIN_PASSWORD" --arg t "$G2_TENANT_ID" '{email:$e,password:$p,tenantId:$t}')")"
          token="$(jq -r '.accessToken // empty' <<<"$response")"
          test -n "$token"
          echo "::add-mask::$token"
          code="$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
            -X POST "$auth_api/admin-reconcile-credential/00000000-0000-0000-0000-000000000000" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"credential":"disabled-proof-value"}' || true)"
          test "$code" = '404' || {
            echo "::error::Recovery endpoint is not proven disabled (HTTP $code)"
            exit 1
          }
          echo 'RECOVERY_ENDPOINT_DISABLED=PASS'

      - name: Dispatch final exact-SHA production release
        if: >-
          github.event.workflow_run.conclusion == 'failure' &&
          steps.authorization.outputs.authorized == 'true' &&
          steps.scope.outputs.credential_drift == 'true' &&
          steps.reconcile.outcome == 'success' &&
          steps.close.outcome == 'success' &&
          steps.disabled.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-release.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            -f commit_sha="$TARGET_SHA" \
            -f pull_request_number='1196' \
            -f rollback_on_failure='true'
