name: G2 Production Credential Reconciliation

on:
  workflow_run:
    workflows:
      - SANAD Production Release
    types:
      - completed

permissions:
  contents: read
  actions: write

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      G2_TENANT_ID: ${{ secrets.AUTH_SMOKE_TENANT_B_ID }}
      G2_ADMIN_EMAIL: ${{ secrets.AUTH_SMOKE_TENANT_B_EMAIL }}
      G2_ADMIN_PASSWORD: ${{ secrets.AUTH_SMOKE_TENANT_B_PASSWORD }}
      BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
      G2_EMPLOYEE_EMAIL: ${{ secrets.G2_PROD_EMPLOYEE_EMAIL }}
      G2_EMPLOYEE_PASSWORD: ${{ secrets.G2_PROD_EMPLOYEE_PASSWORD }}
      G2_MANAGER_EMAIL: ${{ secrets.G2_PROD_MANAGER_EMAIL }}
      G2_MANAGER_PASSWORD: ${{ secrets.G2_PROD_MANAGER_PASSWORD }}
      G2_HR_EMAIL: ${{ secrets.G2_PROD_HR_EMAIL }}
      G2_HR_PASSWORD: ${{ secrets.G2_PROD_HR_PASSWORD }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/snad-backend

    steps:
      - name: Verify triggering SHA is explicitly recovery-authorized
        id: authorization
        shell: bash
        run: |
          set -euo pipefail
          message="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA" --jq '.commit.message')"
          if grep -q 'PRODUCTION-RECOVERY-G2-AUTHORIZED' <<<"$message"; then
            echo 'authorized=true' >> "$GITHUB_OUTPUT"
          else
            echo 'authorized=false' >> "$GITHUB_OUTPUT"
            echo 'Triggering release is not an authorized G2 recovery release; no recovery action taken.'
          fi

      - name: Verify triggering failure is G2 credential drift
        id: scope
        if: steps.authorization.outputs.authorized == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$TRIGGER_RUN_ID" --repo "$GITHUB_REPOSITORY" --log > "$RUNNER_TEMP/trigger-release.log" || true
          if grep -q 'Login failed for .*: 401' "$RUNNER_TEMP/trigger-release.log" \
             && grep -q 'g2-visual.spec.ts' "$RUNNER_TEMP/trigger-release.log"; then
            echo 'credential_drift=true' >> "$GITHUB_OUTPUT"
          else
            echo 'credential_drift=false' >> "$GITHUB_OUTPUT"
            echo 'Trigger failure is not the governed G2 credential-drift signature; no credential mutation will run.'
          fi

      - name: Checkout exact failed release SHA
        if: steps.authorization.outputs.authorized == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify target remains current main
        if: steps.authorization.outputs.authorized == 'true'
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$TARGET_SHA" || { echo '::error::Recovery target is no longer current main'; exit 1; }

      - name: Mask governed values
        if: steps.authorization.outputs.authorized == 'true' && steps.scope.outputs.credential_drift == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for var in G2_TENANT_ID G2_ADMIN_EMAIL G2_ADMIN_PASSWORD G2_EMPLOYEE_EMAIL G2_EMPLOYEE_PASSWORD G2_MANAGER_EMAIL G2_MANAGER_PASSWORD G2_HR_EMAIL G2_HR_PASSWORD RENDER_API_KEY RENDER_SERVICE_ID; do
            test -n "${!var}" || { echo "::error::$var is required"; exit 1; }
            echo "::add-mask::${!var}"
          done

      - name: Reconcile and prove governed identities
        id: reconcile
        if: steps.authorization.outputs.authorized == 'true' && steps.scope.outputs.credential_drift == 'true'
        run: python3 scripts/operations/g2_credential_reconciliation.py

      - name: Close recovery surface and redeploy exact image
        id: close
        if: always() && steps.authorization.outputs.authorized == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY:-}" || { echo '::error::RENDER_API_KEY is required'; exit 1; }
          test -n "${RENDER_SERVICE_ID:-}" || { echo '::error::RENDER_SERVICE_ID is required'; exit 1; }

          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data '{"value":"false"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/SNAD_SECURITY_G2_RECONCILIATION_ENABLED" \
            >/dev/null

          image_ref="${REGISTRY}/${IMAGE_NAME}:${TARGET_SHA}"
          jq -n --arg image "$image_ref" '{imageUrl:$image,clearCache:"do_not_clear"}' > "$RUNNER_TEMP/recovery-close-deploy.json"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data @"$RUNNER_TEMP/recovery-close-deploy.json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            > "$RUNNER_TEMP/recovery-close-deployment.json"
          deploy_id="$(jq -r '(.deploy // .).id // empty' "$RUNNER_TEMP/recovery-close-deployment.json")"
          test -n "$deploy_id"

          for attempt in $(seq 1 180); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H 'Accept: application/json' \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" \
              > "$RUNNER_TEMP/recovery-close-state.json"
            status="$(jq -r '(.deploy // .).status // "pending"' "$RUNNER_TEMP/recovery-close-state.json")"
            case "$status" in
              live)
                deployed_image="$(jq -r '(.deploy // .).image.ref // empty' "$RUNNER_TEMP/recovery-close-state.json")"
                test "$deployed_image" = "$image_ref" || { echo '::error::Recovery close deployed wrong image'; exit 1; }
                echo 'RECOVERY_SURFACE_CONFIGURED=false'
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "::error::Recovery close deployment failed: $status"
                exit 1
                ;;
            esac
            sleep 5
          done
          echo '::error::Recovery close deployment timed out'
          exit 1

      - name: Prove recovery endpoint is disabled before final release
        id: disabled
        if: always() && steps.authorization.outputs.authorized == 'true' && steps.close.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          auth_api="${BASE_URL%/}/api/v1/auth"
          for attempt in $(seq 1 36); do
            health="$(curl --silent --show-error -o /dev/null -w '%{http_code}' --max-time 15 "${BASE_URL%/}/actuator/health/readiness" || true)"
            [ "$health" = '200' ] && break
            sleep 5
          done

          response="$(curl --silent --show-error --fail-with-body \
            -X POST "$auth_api/login" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg e "$G2_ADMIN_EMAIL" --arg p "$G2_ADMIN_PASSWORD" --arg t "$G2_TENANT_ID" '{email:$e,password:$p,tenantId:$t}')")"
          token="$(jq -r '.accessToken // empty' <<<"$response")"
          test -n "$token"
          echo "::add-mask::$token"
          code="$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
            -X POST "$auth_api/admin-reconcile-credential/00000000-0000-0000-0000-000000000000" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"credential":"disabled-proof-value"}' || true)"
          test "$code" = '404' || {
            echo "::error::Recovery endpoint is not proven disabled (HTTP $code)"
            exit 1
          }
          echo 'RECOVERY_ENDPOINT_DISABLED=PASS'

      - name: Dispatch final exact-SHA production release
        if: >-
          steps.authorization.outputs.authorized == 'true' &&
          steps.scope.outputs.credential_drift == 'true' &&
          steps.reconcile.outcome == 'success' &&
          steps.close.outcome == 'success' &&
          steps.disabled.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-release.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            -f commit_sha="$TARGET_SHA" \
            -f pull_request_number='1196' \
            -f rollback_on_failure='true'
