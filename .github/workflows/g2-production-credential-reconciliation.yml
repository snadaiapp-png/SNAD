name: G2 Production Credential Reconciliation

on:
  workflow_run:
    workflows:
      - SANAD Production Release
    types:
      - completed

permissions:
  contents: read
  actions: write

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      G2_TENANT_ID: ${{ secrets.AUTH_SMOKE_TENANT_B_ID }}
      G2_ADMIN_EMAIL: ${{ secrets.AUTH_SMOKE_TENANT_B_EMAIL }}
      G2_ADMIN_PASSWORD: ${{ secrets.AUTH_SMOKE_TENANT_B_PASSWORD }}
      BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
      G2_EMPLOYEE_EMAIL: ${{ secrets.G2_PROD_EMPLOYEE_EMAIL }}
      G2_EMPLOYEE_PASSWORD: ${{ secrets.G2_PROD_EMPLOYEE_PASSWORD }}
      G2_MANAGER_EMAIL: ${{ secrets.G2_PROD_MANAGER_EMAIL }}
      G2_MANAGER_PASSWORD: ${{ secrets.G2_PROD_MANAGER_PASSWORD }}
      G2_HR_EMAIL: ${{ secrets.G2_PROD_HR_EMAIL }}
      G2_HR_PASSWORD: ${{ secrets.G2_PROD_HR_PASSWORD }}

    steps:
      - name: Verify triggering failure is G2 credential drift
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$TRIGGER_RUN_ID" --repo "$GITHUB_REPOSITORY" --log > "$RUNNER_TEMP/trigger-release.log" || true
          if grep -q 'Login failed for .*: 401' "$RUNNER_TEMP/trigger-release.log" \
             && grep -q 'g2-visual.spec.ts' "$RUNNER_TEMP/trigger-release.log"; then
            echo 'credential_drift=true' >> "$GITHUB_OUTPUT"
          else
            echo 'credential_drift=false' >> "$GITHUB_OUTPUT"
            echo 'Trigger failure is not the governed G2 credential-drift signature; no recovery action taken.'
          fi

      - name: Checkout exact failed release SHA
        if: steps.scope.outputs.credential_drift == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Verify target remains current main
        if: steps.scope.outputs.credential_drift == 'true'
        shell: bash
        run: |
          set -euo pipefail
          remote_main="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$TARGET_SHA" || { echo '::error::Recovery target is no longer current main'; exit 1; }

      - name: Mask governed values
        if: steps.scope.outputs.credential_drift == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for var in G2_TENANT_ID G2_ADMIN_EMAIL G2_ADMIN_PASSWORD G2_EMPLOYEE_EMAIL G2_EMPLOYEE_PASSWORD G2_MANAGER_EMAIL G2_MANAGER_PASSWORD G2_HR_EMAIL G2_HR_PASSWORD; do
            test -n "${!var}" || { echo "::error::$var is required"; exit 1; }
            echo "::add-mask::${!var}"
          done

      - name: Reconcile and prove governed identities
        if: steps.scope.outputs.credential_drift == 'true'
        run: python3 scripts/operations/g2_credential_reconciliation.py

      - name: Prove recovery endpoint is disabled before final release
        if: steps.scope.outputs.credential_drift == 'true'
        shell: bash
        run: |
          set -euo pipefail
          auth_api="${BASE_URL%/}/api/v1/auth"
          response="$(curl --silent --show-error --fail-with-body \
            -X POST "$auth_api/login" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg e "$G2_ADMIN_EMAIL" --arg p "$G2_ADMIN_PASSWORD" --arg t "$G2_TENANT_ID" '{email:$e,password:$p,tenantId:$t}')")"
          token="$(jq -r '.accessToken // empty' <<<"$response")"
          test -n "$token"
          echo "::add-mask::$token"
          code="$(curl --silent --show-error -o /dev/null -w '%{http_code}' \
            -X POST "$auth_api/admin-reconcile-credential/00000000-0000-0000-0000-000000000000" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"credential":"disabled-proof-value"}' || true)"
          test "$code" = '404' || {
            echo "::error::Recovery endpoint is not proven disabled (HTTP $code)"
            exit 1
          }

      - name: Dispatch final exact-SHA production release
        if: steps.scope.outputs.credential_drift == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-release.yml \
            --repo "$GITHUB_REPOSITORY" --ref main \
            -f commit_sha="$TARGET_SHA" \
            -f pull_request_number='1196' \
            -f rollback_on_failure='true'
