name: G2 Production Canonical HR Bootstrap

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact current main commit whose API contract is used for bootstrap
        required: true

permissions:
  contents: read

concurrency:
  group: g2-production-canonical-hr-bootstrap
  cancel-in-progress: false

env:
  PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/snad-backend

jobs:
  canonical-hr-bootstrap:
    name: Bootstrap canonical G2 HR graph and restore prior image
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      G2_TENANT_ID: ${{ secrets.AUTH_SMOKE_TENANT_B_ID }}
      G2_ADMIN_EMAIL: ${{ secrets.AUTH_SMOKE_TENANT_B_EMAIL }}
      G2_ADMIN_PASSWORD: ${{ secrets.AUTH_SMOKE_TENANT_B_PASSWORD }}
      G2_EMPLOYEE_EMAIL: ${{ secrets.G2_PROD_EMPLOYEE_EMAIL }}
      G2_MANAGER_EMAIL: ${{ secrets.G2_PROD_MANAGER_EMAIL }}
      G2_HR_EMAIL: ${{ secrets.G2_PROD_HR_EMAIL }}
    steps:
      - name: Validate governed bootstrap inputs
        shell: bash
        run: |
          set -euo pipefail
          for var in RENDER_API_KEY RENDER_SERVICE_ID PRODUCTION_BASE_URL G2_TENANT_ID \
                     G2_ADMIN_EMAIL G2_ADMIN_PASSWORD G2_EMPLOYEE_EMAIL G2_MANAGER_EMAIL G2_HR_EMAIL; do
            test -n "${!var:-}" || { echo "::error::$var is required"; exit 1; }
          done
          [[ "${{ inputs.commit_sha }}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PRODUCTION_BASE_URL" == https://* ]]

      - name: Verify exact current main SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          remote_main=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')
          test "$remote_main" = "${{ inputs.commit_sha }}" || {
            echo "::error::Requested SHA is not current main"
            exit 1
          }
          echo "sha=$remote_main" >> "$GITHUB_OUTPUT"

      - name: Checkout exact bootstrap SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0

      - name: Verify exact immutable backend image exists
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${REGISTRY}/${IMAGE_NAME}:${{ steps.target.outputs.sha }}"
          echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin 2>/dev/null
          docker manifest inspect "$IMAGE_REF" >/dev/null
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Capture previous live image
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20" > /tmp/render-deploys.json
          previous_image=$(jq -r '[.[]? | (.deploy // .) | select((.status // "") == "live")] | .[0].image.ref // empty' /tmp/render-deploys.json)
          test -n "$previous_image" || { echo '::error::No previous live image available for mandatory restore'; exit 1; }
          echo "image_ref=$previous_image" >> "$GITHUB_OUTPUT"

      - name: Deploy exact candidate image temporarily
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg image '${{ steps.image.outputs.image_ref }}' '{imageUrl:$image,clearCache:"do_not_clear"}' > /tmp/g2-bootstrap-deploy.json
          curl --fail-with-body --silent --show-error \
            -X POST -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' \
            -H 'Content-Type: application/json' --data @/tmp/g2-bootstrap-deploy.json \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" > /tmp/g2-bootstrap-deployment.json
          id=$(jq -r '(.deploy // .).id // empty' /tmp/g2-bootstrap-deployment.json)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Wait for exact candidate image and readiness
        shell: bash
        run: |
          set -euo pipefail
          deploy_id='${{ steps.candidate.outputs.id }}'
          for attempt in $(seq 1 270); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" > /tmp/g2-bootstrap-state.json
            status=$(jq -r '(.deploy // .).status // "pending"' /tmp/g2-bootstrap-state.json)
            case "$status" in
              live)
                deployed=$(jq -r '(.deploy // .).image.ref // empty' /tmp/g2-bootstrap-state.json)
                test "$deployed" = '${{ steps.image.outputs.image_ref }}'
                break
                ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 10
          done
          for attempt in $(seq 1 72); do
            code=$(curl --silent --show-error -o /tmp/g2-bootstrap-ready.json -w '%{http_code}' --max-time 20 \
              "$PRODUCTION_BASE_URL/actuator/health/readiness" || true)
            if [ "$code" = 200 ] && jq -e '.status == "UP"' /tmp/g2-bootstrap-ready.json >/dev/null 2>&1; then exit 0; fi
            sleep 5
          done
          echo '::error::Candidate readiness did not become UP'
          exit 1

      - name: Authenticate governed tenant admin and resolve G2 users
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$G2_ADMIN_EMAIL"
          echo "::add-mask::$G2_ADMIN_PASSWORD"
          API="${PRODUCTION_BASE_URL%/}/api/v1"
          response=$(curl --silent --show-error -X POST "$API/auth/login" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg e "$G2_ADMIN_EMAIL" --arg p "$G2_ADMIN_PASSWORD" --arg t "$G2_TENANT_ID" '{email:$e,password:$p,tenantId:$t}')")
          ACCESS_TOKEN=$(echo "$response" | jq -r '.accessToken // empty')
          tenant=$(echo "$response" | jq -r '.user.tenantId // empty')
          test -n "$ACCESS_TOKEN" && test "$tenant" = "$G2_TENANT_ID" || {
            echo '::error::Governed tenant admin authentication/binding failed'; exit 1;
          }
          echo "::add-mask::$ACCESS_TOKEN"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

          caps=$(curl --silent --show-error -H "Authorization: Bearer $ACCESS_TOKEN" "$API/auth/me" | jq -r '.capabilities[]? // empty')
          for cap in USER.CREATE ORGANIZATION.READ HRM.EMPLOYEE.VIEW HRM.EMPLOYEE.CREATE HRM.EMPLOYEE.UPDATE \
                     HRM.USER_LINK.MANAGE HRM.ASSIGNMENT.VIEW HRM.ASSIGNMENT.MANAGE; do
            grep -Fxq "$cap" <<<"$caps" || { echo "::error::Admin missing required capability: $cap"; exit 1; }
          done

          ensure_user() {
            local label="$1" email="$2" existing body code id
            existing=$(curl --silent --show-error -H "Authorization: Bearer $ACCESS_TOKEN" \
              "$API/users?tenantId=$G2_TENANT_ID&email=$email" | \
              jq -r --arg e "$email" '[.[] | select(.email == $e)] | if length==1 then .[0].id elif length==0 then empty else "AMBIGUOUS" end')
            [ "$existing" != AMBIGUOUS ] || { echo "::error::HR_CONTEXT_AMBIGUOUS: duplicate $label users"; exit 1; }
            if [ -n "$existing" ]; then echo "$existing"; return; fi
            body="/tmp/g2-${label,,}-user.json"
            code=$(curl --silent --show-error -o "$body" -w '%{http_code}' -X POST "$API/users?tenantId=$G2_TENANT_ID" \
              -H "Authorization: Bearer $ACCESS_TOKEN" -H 'Content-Type: application/json' \
              -d "$(jq -n --arg e "$email" --arg d "G2 $label QA" '{email:$e,displayName:$d,status:"ACTIVE"}')")
            case "$code" in 200|201) ;; *) echo "::error::$label user create failed HTTP $code"; exit 1 ;; esac
            id=$(jq -r '.id // empty' "$body"); test -n "$id"; echo "$id"
          }

          EMP_USER_ID=$(ensure_user EMPLOYEE "$G2_EMPLOYEE_EMAIL")
          MGR_USER_ID=$(ensure_user MANAGER "$G2_MANAGER_EMAIL")
          HR_USER_ID=$(ensure_user HR "$G2_HR_EMAIL")
          echo "EMP_USER_ID=$EMP_USER_ID" >> "$GITHUB_ENV"
          echo "MGR_USER_ID=$MGR_USER_ID" >> "$GITHUB_ENV"
          echo "HR_USER_ID=$HR_USER_ID" >> "$GITHUB_ENV"

      - name: Bootstrap canonical User Person Employment Assignment graph
        env:
          BASE_URL: ${{ env.PRODUCTION_BASE_URL }}
        run: bash scripts/production/bootstrap-g2-canonical-hr.sh

      - name: Record canonical bootstrap evidence
        shell: bash
        run: |
          jq -n --arg sha '${{ steps.target.outputs.sha }}' --arg image '${{ steps.image.outputs.image_ref }}' \
            --arg previous '${{ steps.previous.outputs.image_ref }}' \
            '{result:"G2_CANONICAL_HR_BOOTSTRAP_PASS",commit:$sha,candidateImage:$image,restoreImage:$previous,directDatabaseMutation:false}' \
            > g2-canonical-hr-bootstrap-evidence.json

      - name: Restore previous live image
        if: always() && steps.previous.outputs.image_ref != ''
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg image '${{ steps.previous.outputs.image_ref }}' '{imageUrl:$image,clearCache:"do_not_clear"}' > /tmp/g2-bootstrap-restore.json
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data @/tmp/g2-bootstrap-restore.json \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" > /tmp/g2-bootstrap-restore-deployment.json
          id=$(jq -r '(.deploy // .).id // empty' /tmp/g2-bootstrap-restore-deployment.json)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Verify previous image restored
        if: always() && steps.restore.outputs.id != ''
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 270); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/${{ steps.restore.outputs.id }}" > /tmp/g2-bootstrap-restore-state.json
            status=$(jq -r '(.deploy // .).status // "pending"' /tmp/g2-bootstrap-restore-state.json)
            case "$status" in
              live)
                deployed=$(jq -r '(.deploy // .).image.ref // empty' /tmp/g2-bootstrap-restore-state.json)
                test "$deployed" = '${{ steps.previous.outputs.image_ref }}'
                echo 'PREVIOUS_PRODUCTION_IMAGE_RESTORED=PASS'
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 10
          done
          echo '::error::Restore deployment timed out'
          exit 1

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-canonical-hr-bootstrap-${{ github.run_id }}
          path: g2-canonical-hr-bootstrap-evidence.json
          if-no-files-found: warn
          retention-days: 90
