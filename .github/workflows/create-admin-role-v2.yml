name: Create Admin Role & User v2

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "create-admin" to confirm'
        required: true
        default: ''
        type: string
      admin_password:
        description: 'Password for admin user (leave empty to use CONTROL_PLANE_ADMIN_PASSWORD secret)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  create-admin:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    if: github.event.inputs.confirm == 'create-admin'

    steps:
      - name: Suspend backend to free DB connections
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Suspend HTTP %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/suspend" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" || true
          echo "Waiting 20s for connections to be released..."
          sleep 20

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          pip3 install bcrypt > /dev/null 2>&1

      - name: Generate BCrypt password hash
        id: bcrypt
        env:
          ADMIN_PASSWORD: ${{ inputs.admin_password || secrets.CONTROL_PLANE_ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::No admin password provided"
            exit 1
          fi
          HASH=$(python3 -c "
          import bcrypt, sys
          password = sys.argv[1].encode('utf-8')
          print(bcrypt.hashpw(password, bcrypt.gensalt(rounds=10)).decode('utf-8'))
          " "$ADMIN_PASSWORD")
          echo "::add-mask::$HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "BCrypt hash generated (length: ${#HASH})"

      - name: Write SQL file
        env:
          CONTROL_PLANE_TENANT_ID: ${{ secrets.CONTROL_PLANE_TENANT_ID }}
          ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          PASSWORD_HASH: ${{ steps.bcrypt.outputs.hash }}
        run: |
          mkdir -p /tmp/sql
          cat > /tmp/sql/admin_setup.sql << EOF
          SET search_path TO public;
          BEGIN;
          -- 1. Create control-plane tenant if missing (only V1 columns: id, name, subdomain, status, created_at, updated_at)
          INSERT INTO tenants (id, name, subdomain, status, created_at, updated_at)
          SELECT '${CONTROL_PLANE_TENANT_ID}'::uuid, 'SNAD Control Plane', 'control-plane', 'ACTIVE',
                 CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
          WHERE NOT EXISTS (SELECT 1 FROM tenants WHERE id = '${CONTROL_PLANE_TENANT_ID}'::uuid);

          -- 2. Create ADMIN role if missing
          INSERT INTO roles (id, tenant_id, code, name, description, status, created_at, updated_at)
          SELECT gen_random_uuid(), '${CONTROL_PLANE_TENANT_ID}'::uuid, 'ADMIN', 'Administrator',
                 'Full administrative access with all capabilities', 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
          WHERE NOT EXISTS (SELECT 1 FROM roles WHERE tenant_id = '${CONTROL_PLANE_TENANT_ID}'::uuid AND code = 'ADMIN');

          -- 3. Assign ALL ACTIVE capabilities to ADMIN role
          INSERT INTO role_capabilities (id, tenant_id, role_id, capability_id, created_at)
          SELECT gen_random_uuid(), r.tenant_id, r.id, ac.id, CURRENT_TIMESTAMP
          FROM roles r
          CROSS JOIN access_capabilities ac
          WHERE r.tenant_id = '${CONTROL_PLANE_TENANT_ID}'::uuid
            AND r.code = 'ADMIN' AND r.status = 'ACTIVE'
            AND ac.status = 'ACTIVE'
            AND NOT EXISTS (SELECT 1 FROM role_capabilities rc WHERE rc.tenant_id = r.tenant_id
              AND rc.role_id = r.id AND rc.capability_id = ac.id);

          -- 4. Create admin user if missing
          INSERT INTO users (id, tenant_id, email, display_name, status, password_hash, created_at, updated_at, platform_admin, must_change_password)
          SELECT gen_random_uuid(), '${CONTROL_PLANE_TENANT_ID}'::uuid, '${ADMIN_EMAIL}', 'SNAD Administrator',
                 'ACTIVE', '${PASSWORD_HASH}', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP, TRUE, FALSE
          WHERE NOT EXISTS (SELECT 1 FROM users WHERE tenant_id = '${CONTROL_PLANE_TENANT_ID}'::uuid AND email = '${ADMIN_EMAIL}');

          -- 5. Update password if user exists
          UPDATE users SET password_hash = '${PASSWORD_HASH}', status = 'ACTIVE', platform_admin = TRUE, updated_at = CURRENT_TIMESTAMP
          WHERE tenant_id = '${CONTROL_PLANE_TENANT_ID}'::uuid AND email = '${ADMIN_EMAIL}';

          -- 6. Assign ADMIN role to admin user
          INSERT INTO user_role_assignments (id, tenant_id, user_id, role_id, organization_id, status, created_at, updated_at)
          SELECT gen_random_uuid(), u.tenant_id, u.id, r.id, NULL, 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
          FROM users u
          JOIN roles r ON r.tenant_id = u.tenant_id AND r.code = 'ADMIN'
          WHERE u.tenant_id = '${CONTROL_PLANE_TENANT_ID}'::uuid AND u.email = '${ADMIN_EMAIL}'
            AND NOT EXISTS (SELECT 1 FROM user_role_assignments ura WHERE ura.tenant_id = u.tenant_id
              AND ura.user_id = u.id AND ura.role_id = r.id);

          -- Verify
          SELECT '=== Tenant ===' AS info;
          SELECT id, name, status FROM tenants WHERE id = '${CONTROL_PLANE_TENANT_ID}'::uuid;
          SELECT '=== ADMIN role ===' AS info;
          SELECT id, code, name, status FROM roles WHERE tenant_id = '${CONTROL_PLANE_TENANT_ID}'::uuid AND code = 'ADMIN';
          SELECT '=== Role capability count ===' AS info;
          SELECT count(*) AS cap_count FROM role_capabilities rc
            JOIN roles r ON r.id = rc.role_id
           WHERE r.tenant_id = '${CONTROL_PLANE_TENANT_ID}'::uuid AND r.code = 'ADMIN';
          SELECT '=== Admin user ===' AS info;
          SELECT id, email, status, platform_admin, (password_hash IS NOT NULL) AS has_password
            FROM users WHERE tenant_id = '${CONTROL_PLANE_TENANT_ID}'::uuid AND email = '${ADMIN_EMAIL}';
          SELECT '=== Role assignment ===' AS info;
          SELECT ura.status, r.code FROM user_role_assignments ura
            JOIN users u ON u.id = ura.user_id JOIN roles r ON r.id = ura.role_id
           WHERE u.email = '${ADMIN_EMAIL}';
          COMMIT;
          EOF
          echo "SQL file written ($(wc -l < /tmp/sql/admin_setup.sql) lines)"

      - name: Execute SQL
        env:
          PROD_JDBC_URL: ${{ secrets.PROD_JDBC_URL }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          set -euo pipefail
          JDBC_URL="$PROD_JDBC_URL"
          CONN_STR="${JDBC_URL#jdbc:postgresql://}"
          HOST_PORT="${CONN_STR%%/*}"
          HOST="${HOST_PORT%%:*}"
          PORT="${HOST_PORT##*:}"
          DB_PART="${CONN_STR#*/}"
          DB_NAME="${DB_PART%%\?*}"

          for attempt in 1 2 3 4 5; do
            echo "=== Attempt $attempt ==="
            if PGPASSWORD="$PROD_DB_PASSWORD" psql -h "$HOST" -p "$PORT" -U "$PROD_DB_USER" -d "$DB_NAME" -f /tmp/sql/admin_setup.sql; then
              echo "✓ Migration completed successfully!"
              exit 0
            else
              echo "Attempt $attempt failed. Waiting 15s..."
              sleep 15
            fi
          done
          echo "::error::All attempts failed"
          exit 1

      - name: Resume backend
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Resume HTTP %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/resume" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" || true

      - name: Verify login
        env:
          ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ inputs.admin_password || secrets.CONTROL_PLANE_ADMIN_PASSWORD }}
        run: |
          echo "Waiting 30s for backend to resume..."
          sleep 30
          echo "=== Test login ==="
          curl -sS --max-time 15 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -H "Origin: https://snad-app.vercel.app" \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            -w "\nHTTP %{http_code}\n"
