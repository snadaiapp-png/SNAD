name: Keep-Alive Backend

on:
  schedule:
    - cron: "*/10 * * * *"  # Every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render.com backend
        shell: bash
        run: |
          set -Eeuo pipefail

          BACKEND_URL="https://sanad-backend-mcrj.onrender.com"

          # Warm up the backend with a lightweight health check.
          # This prevents Render.com free-tier from sleeping and
          # eliminates the 504 Gateway Timeout on the first request
          # after inactivity (cold start exceeds BFF 25s timeout).
          for i in 1 2 3; do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
              --max-time 30 "${BACKEND_URL}/actuator/health" 2>/dev/null || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Backend is alive."
              exit 0
            fi
            sleep 5
          done

          echo "WARNING: Backend did not respond with 200 after 3 attempts"
          exit 1
