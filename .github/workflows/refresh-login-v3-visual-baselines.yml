name: Refresh Login v3 Visual Baselines

on:
  pull_request:
    paths:
      - '.github/workflows/refresh-login-v3-visual-baselines.yml'

permissions:
  contents: write

concurrency:
  group: refresh-login-v3-visual-baselines-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'design/auth-login-v3-full-visual-redesign'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Prove starting SHA
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js production
        run: npm run build

      - name: Start Next.js production server
        id: server
        shell: bash
        run: |
          set -euo pipefail
          NEXT_TELEMETRY_DISABLED=1 NODE_ENV=production \
            ./node_modules/.bin/next start -H 127.0.0.1 -p 3001 \
            > "$RUNNER_TEMP/frontend.log" 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3001/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done
          tail -100 "$RUNNER_TEMP/frontend.log" || true
          exit 1

      - name: Refresh only approved Login v3 baselines
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
        run: |
          set -euo pipefail
          npx playwright test e2e/visual-regression.spec.ts \
            --config=playwright.standard.config.ts \
            --grep 'login screen — Arabic RTL Light|login screen — English LTR Light|workspace redirect — Arabic RTL|control-plane redirect — English LTR' \
            --update-snapshots \
            --workers=1 \
            --reporter=list

      - name: Verify refreshed baselines are stable
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
        run: |
          set -euo pipefail
          npx playwright test e2e/visual-regression.spec.ts \
            --config=playwright.standard.config.ts \
            --grep 'login screen — Arabic RTL Light|login screen — English LTR Light|workspace redirect — Arabic RTL|control-plane redirect — English LTR' \
            --workers=1 \
            --reporter=list

      - name: Enforce baseline-only change set
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          apps/web/e2e/__screenshots__/control-plane-redirect-en-ltr.png
          apps/web/e2e/__screenshots__/login-ar-rtl-light.png
          apps/web/e2e/__screenshots__/login-en-ltr-light.png
          apps/web/e2e/__screenshots__/workspace-redirect-ar-rtl.png
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          echo 'Changed files:'
          cat /tmp/changed.txt
          test -s /tmp/changed.txt
          if comm -23 /tmp/changed.txt /tmp/allowed.txt | grep -q .; then
            echo '::error::Unexpected file changed while refreshing visual baselines'
            comm -23 /tmp/changed.txt /tmp/allowed.txt
            exit 1
          fi

      - name: Commit approved baselines to PR branch
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name 'snad-ci'
          git config user.email 'snad.ai.app@gmail.com'
          git add \
            apps/web/e2e/__screenshots__/login-ar-rtl-light.png \
            apps/web/e2e/__screenshots__/login-en-ltr-light.png \
            apps/web/e2e/__screenshots__/workspace-redirect-ar-rtl.png \
            apps/web/e2e/__screenshots__/control-plane-redirect-en-ltr.png
          git commit -m 'test(auth): refresh approved Login v3 visual baselines'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Stop server
        if: always()
        shell: bash
        run: |
          kill ${{ steps.server.outputs.pid }} 2>/dev/null || true
          wait ${{ steps.server.outputs.pid }} 2>/dev/null || true
