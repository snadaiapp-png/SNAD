# Zid integration CI: unit matrix + PostgreSQL-Direct tenant-isolation matrix.
# Host-native PostgreSQL only; Docker/Testcontainers are forbidden by repo policy.
# No production secrets: the integration is disabled by default and every test
# uses ephemeral runtime material. This workflow NEVER deploys and NEVER runs
# Flyway against any non-local host.
name: Zid Integration Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/integration/zid/**'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/integration/zid/**'
      - 'apps/sanad-platform/src/main/resources/db/migration/V20261022_1__zid_integration_schema.sql'
      - 'apps/web/app/integrations/zid/**'
      - 'apps/web/lib/api/zid-api.ts'
      - '.github/workflows/zid-integration-tests.yml'
  push:
    branches:
      - feature/zid-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zid-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zid-unit-tests:
    name: Zid unit and contract matrix (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Zid unit tests (no PostgreSQL required)
        working-directory: apps/sanad-platform
        env:
          # Fail-closed defaults: the integration stays disabled and no
          # secret material exists in CI. Tests generate their own
          # ephemeral values at runtime.
          SANAD_ZID_ENABLED: 'false'
        run: |
          set -euo pipefail
          mvn -B surefire:test \
            -Dtest='ZidWebhookVerifierTest,ZidWebhookIngestServiceTest,ZidAuthServiceTest,ZidSyncAuditRedactionTest,ZidWebhookProcessorTest,ZidTenantBindingServiceTest,ZidConnectorHttpStubTest' \
            -DfailIfNoTests=false

      - name: Publish surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zid-surefire-reports
          path: apps/sanad-platform/target/surefire-reports/
          if-no-files-found: warn

  zid-rls-isolation:
    name: Zid RLS tenant isolation (PostgreSQL Direct)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad_zid
      SPRING_DATASOURCE_USERNAME: sanad_zid
      SPRING_DATASOURCE_PASSWORD: ''
      DATABASE_NAME: sanad_zid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Start host-native PostgreSQL (no containers)
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || {
            echo "::error::ENVIRONMENT_BLOCKER=HOST_NATIVE_POSTGRESQL_UNAVAILABLE"
            exit 1
          }
          sudo systemctl start postgresql
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432

      - name: Provision disposable Zid role and database
        shell: bash
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 24)"
          echo "::add-mask::$db_password"
          echo "SPRING_DATASOURCE_PASSWORD=$db_password" >> "$GITHUB_ENV"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -v db_password="$db_password" <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad_zid') THEN
              CREATE ROLE sanad_zid WITH LOGIN;
            END IF;
          END $$;
          ALTER ROLE sanad_zid PASSWORD :'db_password';
          ALTER ROLE sanad_zid NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          SELECT 'CREATE DATABASE sanad_zid OWNER sanad_zid'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'sanad_zid')\gexec
          ALTER DATABASE sanad_zid OWNER TO sanad_zid;
          SQL

      - name: Run Zid RLS isolation matrix (real Flyway + FORCE RLS)
        working-directory: apps/sanad-platform
        run: |
          set -euo pipefail
          # The test itself refuses production-looking hosts and skips
          # gracefully when PostgreSQL is unreachable; here the DB is a
          # disposable local one provisioned above.
          mvn -B surefire:test -Dtest='ZidTenantIsolationPostgresTest' -DfailIfNoTests=false

      - name: Publish RLS test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zid-rls-reports
          path: apps/sanad-platform/target/surefire-reports/
          if-no-files-found: warn
