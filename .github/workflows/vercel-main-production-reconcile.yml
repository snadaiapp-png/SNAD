name: Vercel Main Production Reconcile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: vercel-main-production-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile Vercel Production to exact main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_WEB_BASE_URL: ${{ vars.WEB_PRODUCTION_BASE_URL || 'https://snad-app.vercel.app' }}

    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify immutable current main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_main="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$GITHUB_SHA" || {
            echo "::error::VERCEL_RECONCILE_NOT_CURRENT_MAIN expected=$GITHUB_SHA actual=$remote_main"
            exit 1
          }

      - name: Prepare exact-SHA artifact marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/public
          printf '%s\n' "$GITHUB_SHA" > apps/web/public/__snad_release_sha.txt

      - name: Pull Vercel production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build clean production artifact locally
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel/output
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN" 2>&1 | tee "$RUNNER_TEMP/vercel-build.log"

          marker="$(find .vercel/output -type f -name '__snad_release_sha.txt' -print -quit)"
          test -n "$marker" || {
            echo "::error::EXACT_SHA_MARKER_MISSING_FROM_PREBUILT_ARTIFACT"
            exit 1
          }
          test "$(tr -d '\r\n' < "$marker")" = "$GITHUB_SHA" || {
            echo "::error::EXACT_SHA_MARKER_MISMATCH_IN_PREBUILT_ARTIFACT"
            exit 1
          }

          echo "Prebuilt HRM route evidence:"
          find .vercel/output -type f | grep -E 'hr/performance/(goals|reviews)' || true

      - name: Deploy prebuilt artifact to Vercel Production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy             --prebuilt             --prod             --token="$VERCEL_TOKEN"             --meta "snadMainSha=$GITHUB_SHA"             --meta "snadMainRef=main"             2>&1 | tee "$RUNNER_TEMP/vercel-deploy.log"

          DEPLOYMENT_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' "$RUNNER_TEMP/vercel-deploy.log" | head -n 1 || true)"
          test -n "$DEPLOYMENT_URL" || {
            echo "::error::VERCEL_DEPLOYMENT_URL_NOT_FOUND"
            exit 1
          }
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

      - name: Mint GitHub OIDC token for protected Vercel probes
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Verify exact production deployment via Vercel REST API
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          expected = os.environ["GITHUB_SHA"]
          token = os.environ["VERCEL_TOKEN"]
          team_id = os.environ["VERCEL_ORG_ID"]
          deployment_url = os.environ["DEPLOYMENT_URL"]
          production_url = os.environ["PRODUCTION_WEB_BASE_URL"]

          deployment_host = urllib.parse.urlparse(deployment_url).netloc or deployment_url.removeprefix("https://")
          production_host = urllib.parse.urlparse(production_url).netloc
          endpoint = (
              "https://api.vercel.com/v13/deployments/"
              + urllib.parse.quote(deployment_host, safe="")
              + "?teamId="
              + urllib.parse.quote(team_id, safe="")
          )

          last = None
          for attempt in range(1, 37):
              request = urllib.request.Request(
                  endpoint,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "User-Agent": "SNAD-Vercel-Reconcile/2.0",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  last = json.load(response)

              meta = last.get("meta") if isinstance(last.get("meta"), dict) else {}
              observed_sha = str(meta.get("snadMainSha") or meta.get("githubCommitSha") or "")
              state = str(last.get("readyState") or last.get("state") or "")
              target = str(last.get("target") or "")
              aliases = last.get("alias") if isinstance(last.get("alias"), list) else []
              alias_ok = production_host in aliases

              print(
                  f"attempt={attempt}/36 state={state or 'UNKNOWN'} "
                  f"target={target or 'UNKNOWN'} sha={observed_sha or 'UNKNOWN'} "
                  f"productionAlias={alias_ok}"
              )

              if state == "READY" and target == "production" and observed_sha == expected and alias_ok:
                  evidence = {
                      "schemaVersion": 1,
                      "deploymentId": last.get("id") or last.get("uid"),
                      "deploymentUrl": last.get("url"),
                      "productionAlias": production_host,
                      "readyState": state,
                      "target": target,
                      "deploymentSha": observed_sha,
                      "expectedSha": expected,
                      "aliases": aliases,
                      "result": "PASS",
                  }
                  Path(os.environ["RUNNER_TEMP"], "vercel-production-identity.json").write_text(
                      json.dumps(evidence, indent=2, sort_keys=True) + "\n",
                      encoding="utf-8",
                  )
                  print("VERCEL_PRODUCTION_IDENTITY = PASS")
                  raise SystemExit(0)

              time.sleep(5)

          actual = "none"
          if isinstance(last, dict):
              meta = last.get("meta") if isinstance(last.get("meta"), dict) else {}
              actual = str(meta.get("snadMainSha") or meta.get("githubCommitSha") or "none")
          raise SystemExit(
              f"PRODUCTION_ARTIFACT_SHA_MISMATCH expected={expected} actual={actual}"
          )
          PY

      - name: Verify live HRM G3 routes
        shell: bash
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check-production-readiness.py             --frontend-routes-only             --attempts 6             --delay-seconds 5             --timeout-seconds 20             --production-url "$PRODUCTION_WEB_BASE_URL"             --evidence-file "$RUNNER_TEMP/hrm-g3-production-routes.json"

      - name: Capture production release identity
        if: always()
        shell: bash
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
            "$PRODUCTION_WEB_BASE_URL/api/system/release" \
            > "$RUNNER_TEMP/production-release.json" || true

      - name: Emit reconcile evidence
        if: always()
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          route_path = Path(os.environ["RUNNER_TEMP"]) / "hrm-g3-production-routes.json"
          release_path = Path(os.environ["RUNNER_TEMP"]) / "production-release.json"

          def load(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return None

          evidence = {
              "schemaVersion": 2,
              "method": "vercel-cli-prebuilt",
              "githubSha": os.environ.get("GITHUB_SHA"),
              "githubRef": os.environ.get("GITHUB_REF"),
              "deploymentUrl": os.environ.get("DEPLOYMENT_URL"),
              "productionUrl": os.environ.get("PRODUCTION_WEB_BASE_URL"),
              "releaseIdentity": load(release_path),
              "routes": load(route_path),
          }
          Path("vercel-main-reconcile-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Vercel reconcile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-main-reconcile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            vercel-main-reconcile-evidence.json
            ${{ runner.temp }}/vercel-build.log
            ${{ runner.temp }}/vercel-deploy.log
            ${{ runner.temp }}/vercel-production-identity.json
            ${{ runner.temp }}/hrm-g3-production-routes.json
            ${{ runner.temp }}/production-release.json
          if-no-files-found: warn
          retention-days: 90
