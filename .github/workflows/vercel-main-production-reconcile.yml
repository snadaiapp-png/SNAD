name: Vercel Main Production Reconcile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: vercel-main-production-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    name: Reconcile Vercel Production to exact main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_WEB_BASE_URL: ${{ vars.WEB_PRODUCTION_BASE_URL || 'https://snad-app.vercel.app' }}

    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify immutable current main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_main="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$GITHUB_SHA" || {
            echo "::error::VERCEL_RECONCILE_NOT_CURRENT_MAIN expected=$GITHUB_SHA actual=$remote_main"
            exit 1
          }

      - name: Prepare exact-SHA artifact marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apps/web/public
          printf '%s\n' "$GITHUB_SHA" > apps/web/public/__snad_release_sha.txt

      - name: Pull Vercel production configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify Vercel monorepo project settings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["VERCEL_TOKEN"]
          team_id = os.environ["VERCEL_ORG_ID"]
          project_id = os.environ["VERCEL_PROJECT_ID"]
          endpoint = (
              "https://api.vercel.com/v9/projects/"
              + urllib.parse.quote(project_id, safe="")
              + "?teamId="
              + urllib.parse.quote(team_id, safe="")
          )
          request = urllib.request.Request(
              endpoint,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "User-Agent": "SNAD-Vercel-Project-Contract/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              project = json.load(response)

          root_directory = str(project.get("rootDirectory") or "")
          outside_root = project.get("sourceFilesOutsideRootDirectory")
          framework = str(project.get("framework") or "")

          print(
              "VERCEL_PROJECT_SETTINGS "
              f"rootDirectory={root_directory or 'NONE'} "
              f"sourceFilesOutsideRootDirectory={outside_root!r} "
              f"framework={framework or 'NONE'}"
          )

          if root_directory != "apps/web":
              raise SystemExit(
                  "VERCEL_PROJECT_ROOT_DIRECTORY_MISMATCH "
                  f"expected=apps/web actual={root_directory or 'NONE'}"
              )
          if outside_root is not True:
              raise SystemExit(
                  "VERCEL_PROJECT_OUTSIDE_ROOT_DISABLED "
                  "expected=sourceFilesOutsideRootDirectory:true"
              )
          if framework != "nextjs":
              raise SystemExit(
                  "VERCEL_PROJECT_FRAMEWORK_MISMATCH "
                  f"expected=nextjs actual={framework or 'NONE'}"
              )

          print("VERCEL_MONOREPO_PROJECT_SETTINGS = PASS")
          PY

      - name: Build clean production artifact locally
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .vercel/output
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN" 2>&1 | tee "$RUNNER_TEMP/vercel-build.log"

          marker="$(find .vercel/output -type f -name '__snad_release_sha.txt' -print -quit)"
          test -n "$marker" || {
            echo "::error::EXACT_SHA_MARKER_MISSING_FROM_PREBUILT_ARTIFACT"
            exit 1
          }
          test "$(tr -d '\r\n' < "$marker")" = "$GITHUB_SHA" || {
            echo "::error::EXACT_SHA_MARKER_MISMATCH_IN_PREBUILT_ARTIFACT"
            exit 1
          }

          echo "Prebuilt HRM route evidence:"
          python3 - <<'PY'
          from pathlib import Path

          output = Path(".vercel/output")
          entries = [p.as_posix() for p in output.rglob("*")]
          config_text = ""
          config_path = output / "config.json"
          if config_path.is_file():
              config_text = config_path.read_text(encoding="utf-8", errors="replace")

          missing = []
          for route in ("/hr/performance/goals", "/hr/performance/reviews"):
              route_fragment = route.lstrip("/")
              matched = [entry for entry in entries if route_fragment in entry]
              if route in config_text:
                  matched.append("config.json")
              if not matched:
                  missing.append(route)
              else:
                  print(f"ROUTE_ARTIFACT_PRESENT {route}: {matched[:5]}")

          if missing:
              raise SystemExit(
                  "HRM_G3_ROUTE_ARTIFACT_MISSING " + ",".join(missing)
              )

          print("HRM_G3_PREBUILT_ROUTE_ARTIFACTS = PASS")
          PY

      - name: Create exact-SHA Git-source Production deployment via Vercel REST API
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          expected = os.environ["GITHUB_SHA"]
          token = os.environ["VERCEL_TOKEN"]
          team_id = os.environ["VERCEL_ORG_ID"]
          project_id = os.environ["VERCEL_PROJECT_ID"]
          repository = os.environ["GITHUB_REPOSITORY"]
          owner, repo = repository.split("/", 1)

          project_endpoint = (
              "https://api.vercel.com/v9/projects/"
              + urllib.parse.quote(project_id, safe="")
              + "?teamId="
              + urllib.parse.quote(team_id, safe="")
          )
          project_request = urllib.request.Request(
              project_endpoint,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "User-Agent": "SNAD-HRM-G3-Reconcile/3.1",
              },
          )
          try:
              with urllib.request.urlopen(project_request, timeout=30) as response:
                  project = json.load(response)
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              raise SystemExit(
                  f"VERCEL_PROJECT_LOOKUP_HTTP_{error.code} {body}"
              ) from error

          project_name = str(project.get("name") or "").strip()
          if not project_name:
              raise SystemExit("VERCEL_PROJECT_LOOKUP_MISSING_NAME")

          endpoint = (
              "https://api.vercel.com/v13/deployments"
              "?forceNew=1&skipAutoDetectionConfirmation=1&teamId="
              + urllib.parse.quote(team_id, safe="")
          )
          payload = {
              "name": project_name,
              "project": project_id,
              "target": "production",
              "gitSource": {
                  "type": "github",
                  "org": owner,
                  "repo": repo,
                  "ref": "main",
                  "sha": expected,
              },
              "gitMetadata": {
                  "remoteUrl": f"https://github.com/{repository}",
                  "commitRef": "main",
                  "commitSha": expected,
                  "dirty": False,
                  "ci": True,
                  "ciType": "github-actions",
                  "rootDirectory": "apps/web",
              },
              "meta": {
                  "snadMainSha": expected,
                  "snadMainRef": "main",
                  "snadDeploymentMethod": "git-source-rest",
              },
          }

          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "User-Agent": "SNAD-HRM-G3-Reconcile/3.0",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  deployment = json.load(response)
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              raise SystemExit(
                  f"VERCEL_GIT_SOURCE_DEPLOYMENT_HTTP_{error.code} {body}"
              ) from error

          deployment_id = str(deployment.get("id") or deployment.get("uid") or "")
          deployment_host = str(deployment.get("url") or "")
          if not deployment_id or not deployment_host:
              raise SystemExit(
                  "VERCEL_GIT_SOURCE_DEPLOYMENT_INVALID_RESPONSE "
                  + json.dumps(deployment, sort_keys=True)
              )

          deployment_url = (
              deployment_host
              if deployment_host.startswith("https://")
              else f"https://{deployment_host}"
          )
          evidence = {
              "schemaVersion": 1,
              "method": "git-source-rest",
              "expectedSha": expected,
              "deploymentId": deployment_id,
              "deploymentUrl": deployment_url,
              "initialReadyState": deployment.get("readyState") or deployment.get("status"),
          }
          Path(os.environ["RUNNER_TEMP"], "vercel-deploy.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"deployment_id={deployment_id}\n")
              output.write(f"deployment_url={deployment_url}\n")

          print(
              f"Created Git-source production deployment id={deployment_id} "
              f"url={deployment_url} sha={expected}"
          )
          PY

      - name: Mint GitHub OIDC token for protected Vercel probes
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Verify exact production deployment via Vercel REST API
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          expected = os.environ["GITHUB_SHA"]
          token = os.environ["VERCEL_TOKEN"]
          team_id = os.environ["VERCEL_ORG_ID"]
          deployment_url = os.environ["DEPLOYMENT_URL"]
          production_url = os.environ["PRODUCTION_WEB_BASE_URL"]

          deployment_host = urllib.parse.urlparse(deployment_url).netloc or deployment_url.removeprefix("https://")
          production_host = urllib.parse.urlparse(production_url).netloc
          endpoint = (
              "https://api.vercel.com/v13/deployments/"
              + urllib.parse.quote(deployment_host, safe="")
              + "?teamId="
              + urllib.parse.quote(team_id, safe="")
          )

          last = None
          for attempt in range(1, 37):
              request = urllib.request.Request(
                  endpoint,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "User-Agent": "SNAD-Vercel-Reconcile/2.0",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  last = json.load(response)

              meta = last.get("meta") if isinstance(last.get("meta"), dict) else {}
              observed_sha = str(meta.get("snadMainSha") or meta.get("githubCommitSha") or "")
              state = str(last.get("readyState") or last.get("state") or "")
              target = str(last.get("target") or "")
              aliases = last.get("alias") if isinstance(last.get("alias"), list) else []
              alias_ok = production_host in aliases

              print(
                  f"attempt={attempt}/36 state={state or 'UNKNOWN'} "
                  f"target={target or 'UNKNOWN'} sha={observed_sha or 'UNKNOWN'} "
                  f"productionAlias={alias_ok}"
              )

              if state == "READY" and target == "production" and observed_sha == expected and alias_ok:
                  evidence = {
                      "schemaVersion": 1,
                      "deploymentId": last.get("id") or last.get("uid"),
                      "deploymentUrl": last.get("url"),
                      "productionAlias": production_host,
                      "readyState": state,
                      "target": target,
                      "deploymentSha": observed_sha,
                      "expectedSha": expected,
                      "aliases": aliases,
                      "result": "PASS",
                  }
                  Path(os.environ["RUNNER_TEMP"], "vercel-production-identity.json").write_text(
                      json.dumps(evidence, indent=2, sort_keys=True) + "\n",
                      encoding="utf-8",
                  )
                  print("VERCEL_PRODUCTION_IDENTITY = PASS")
                  raise SystemExit(0)

              time.sleep(5)

          actual = "none"
          if isinstance(last, dict):
              meta = last.get("meta") if isinstance(last.get("meta"), dict) else {}
              actual = str(meta.get("snadMainSha") or meta.get("githubCommitSha") or "none")
          raise SystemExit(
              f"PRODUCTION_ARTIFACT_SHA_MISMATCH expected={expected} actual={actual}"
          )
          PY

      - name: Verify live HRM G3 routes
        shell: bash
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check-production-readiness.py \
            --frontend-routes-only \
            --attempts 6 \
            --delay-seconds 5 \
            --timeout-seconds 20 \
            --production-url "$PRODUCTION_WEB_BASE_URL" \
            --evidence-file "$RUNNER_TEMP/hrm-g3-production-routes.json"

      - name: Verify production alias still points to created deployment
        shell: bash
        env:
          EXPECTED_DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          expected_id = os.environ["EXPECTED_DEPLOYMENT_ID"]
          expected_sha = os.environ["GITHUB_SHA"]
          token = os.environ["VERCEL_TOKEN"]
          team_id = os.environ["VERCEL_ORG_ID"]
          production_host = urllib.parse.urlparse(
              os.environ["PRODUCTION_WEB_BASE_URL"]
          ).netloc

          endpoint = (
              "https://api.vercel.com/v13/deployments/"
              + urllib.parse.quote(production_host, safe="")
              + "?teamId="
              + urllib.parse.quote(team_id, safe="")
          )
          request = urllib.request.Request(
              endpoint,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
                  "User-Agent": "SNAD-Vercel-Alias-Lock/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              deployment = json.load(response)

          observed_id = str(deployment.get("id") or deployment.get("uid") or "")
          meta = deployment.get("meta") if isinstance(deployment.get("meta"), dict) else {}
          observed_sha = str(meta.get("snadMainSha") or meta.get("githubCommitSha") or "")
          state = str(deployment.get("readyState") or deployment.get("state") or "")
          target = str(deployment.get("target") or "")

          print(
              "PRODUCTION_ALIAS_IDENTITY "
              f"deploymentId={observed_id or 'NONE'} "
              f"sha={observed_sha or 'NONE'} state={state or 'NONE'} target={target or 'NONE'}"
          )

          if observed_id != expected_id:
              raise SystemExit(
                  "PRODUCTION_ALIAS_DEPLOYMENT_DRIFT "
                  f"expected={expected_id} actual={observed_id or 'NONE'}"
              )
          if observed_sha != expected_sha or state != "READY" or target != "production":
              raise SystemExit(
                  "PRODUCTION_ALIAS_IDENTITY_MISMATCH "
                  f"expectedSha={expected_sha} actualSha={observed_sha or 'NONE'} "
                  f"state={state or 'NONE'} target={target or 'NONE'}"
              )

          print("PRODUCTION_ALIAS_CREATED_DEPLOYMENT = PASS")
          PY

      - name: Capture production release identity
        if: always()
        shell: bash
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H "x-vercel-trusted-oidc-idp-token: $VERCEL_TRUSTED_OIDC_TOKEN" \
            "$PRODUCTION_WEB_BASE_URL/api/system/release" \
            > "$RUNNER_TEMP/production-release.json" || true

      - name: Emit reconcile evidence
        if: always()
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          route_path = Path(os.environ["RUNNER_TEMP"]) / "hrm-g3-production-routes.json"
          release_path = Path(os.environ["RUNNER_TEMP"]) / "production-release.json"

          def load(path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  return None

          evidence = {
              "schemaVersion": 2,
              "method": "vercel-git-source-rest",
              "githubSha": os.environ.get("GITHUB_SHA"),
              "githubRef": os.environ.get("GITHUB_REF"),
              "deploymentUrl": os.environ.get("DEPLOYMENT_URL"),
              "productionUrl": os.environ.get("PRODUCTION_WEB_BASE_URL"),
              "releaseIdentity": load(release_path),
              "routes": load(route_path),
          }
          Path("vercel-main-reconcile-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Vercel reconcile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-main-reconcile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            vercel-main-reconcile-evidence.json
            ${{ runner.temp }}/vercel-build.log
            ${{ runner.temp }}/vercel-deploy.json
            ${{ runner.temp }}/vercel-production-identity.json
            ${{ runner.temp }}/hrm-g3-production-routes.json
            ${{ runner.temp }}/production-release.json
          if-no-files-found: warn
          retention-days: 90
