name: G2 Credential Reconciliation TDD

on:
  push:
    branches:
      - fix/g2-governed-credential-reconciliation-tdd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-red-green:
    name: Targeted Credential Reconciliation Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/sanad-platform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/sanad-platform/pom.xml
      - name: Run targeted reconciliation tests
        run: >-
          mvn -B
          -Dtest=AdminCredentialReconciliationContractTest,AuthServiceCredentialReconciliationTest
          test
