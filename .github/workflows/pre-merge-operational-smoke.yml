name: Pre-Merge Operational Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: pre-merge-operational-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-smoke:
    name: Backend Operational Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: sanad
      SPRING_DATASOURCE_PASSWORD: sanad_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      FLYWAY_ENABLED: 'true'
      FLYWAY_BASELINE_ON_MIGRATE: 'true'
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      JPA_DDL_AUTO: validate

    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v4

      - name: Start host-native PostgreSQL (no containers)
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || {
            echo "::error::ENVIRONMENT_BLOCKER=HOST_NATIVE_POSTGRESQL_UNAVAILABLE"
            exit 1
          }
          psql --version
          sudo systemctl start postgresql || {
            echo "::error::ENVIRONMENT_BLOCKER=HOST_NATIVE_POSTGRESQL_START_FAILED"
            exit 1
          }
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Provision least-privilege PostgreSQL Direct roles
        shell: bash
        run: |
          set -euo pipefail
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $sanad$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad') THEN
              CREATE ROLE sanad WITH LOGIN PASSWORD 'sanad_pass';
            END IF;
          END $sanad$;
          ALTER ROLE sanad NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          SELECT 'CREATE DATABASE sanad OWNER sanad'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'sanad')\gexec
          ALTER DATABASE sanad OWNER TO sanad;
          SELECT 'CREATE DATABASE test_migration OWNER sanad'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'test_migration')\gexec
          GRANT CONNECT ON DATABASE postgres TO sanad;
          GRANT USAGE, CREATE ON SCHEMA public TO sanad;
          \c test_migration
          GRANT USAGE, CREATE ON SCHEMA public TO sanad;
          \c sanad
          DO $sanad_rls$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'crm_contact_rls_test_user') THEN
              CREATE ROLE crm_contact_rls_test_user WITH LOGIN PASSWORD 'rls_contact_test_pass';
            END IF;
          END $sanad_rls$;
          ALTER ROLE crm_contact_rls_test_user NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          SQL

          role_contract="$(sudo -u postgres psql -Atqc "SELECT rolsuper::text || '|' || rolcreatedb::text || '|' || rolcreaterole::text || '|' || rolbypassrls::text FROM pg_roles WHERE rolname='sanad'")"
          echo "PRE_MERGE_ROLE_CONTRACT=$role_contract"
          test "$role_contract" = "false|false|false|false"
          PGPASSWORD="$SPRING_DATASOURCE_PASSWORD" psql \
            -h 127.0.0.1 -U "$SPRING_DATASOURCE_USERNAME" -d sanad \
            -v ON_ERROR_STOP=1 -Atqc 'SELECT current_database(), current_user'

      - name: Generate ephemeral CRM encryption key
        shell: bash
        run: |
          set -euo pipefail
          key="$(openssl rand -base64 32 | tr -d '\n')"
          test -n "$key"
          echo "::add-mask::$key"
          echo "CRM_CUSTOM_FIELD_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"

      - name: Start backend and validate health
        shell: bash
        working-directory: apps/sanad-platform
        env:
          CRM_CUSTOM_FIELD_ENCRYPTION_KEY: ${{ env.CRM_CUSTOM_FIELD_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/backend.log"
          printf '%s\n' '{"status":"NOT_AVAILABLE"}' > "$RUNNER_TEMP/backend-health.json"
          printf '%s\n' '{"result":"FAIL","failureType":"NOT_COMPLETED"}' > "$RUNNER_TEMP/backend-smoke-metadata.json"

          cleanup_backend() {
            if [ -n "${BACKEND_PID:-}" ]; then
              kill "$BACKEND_PID" 2>/dev/null || true
              wait "$BACKEND_PID" 2>/dev/null || true
            fi
          }
          trap cleanup_backend EXIT

          SPRING_PROFILES_ACTIVE=local \
            SERVER_PORT=8081 \
            MANAGEMENT_SERVER_PORT=8082 \
            mvn --batch-mode --no-transfer-progress spring-boot:run \
            > "$RUNNER_TEMP/backend.log" 2>&1 &
          BACKEND_PID=$!

          BACKEND_READY=false
          for i in $(seq 1 60); do
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              echo "::error::Backend process exited before readiness"
              tail -200 "$RUNNER_TEMP/backend.log" || true
              exit 1
            fi
            if curl --fail --silent --show-error \
              http://127.0.0.1:8082/actuator/health >/dev/null 2>&1; then
              BACKEND_READY=true
              break
            fi
            sleep 3
          done

          if [ "$BACKEND_READY" != "true" ]; then
            echo "::error::Backend did not become ready within 180 seconds"
            tail -200 "$RUNNER_TEMP/backend.log" || true
            exit 1
          fi

          HTTP_STATUS="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/backend-health.json" \
            --write-out '%{http_code}' \
            http://127.0.0.1:8082/actuator/health)"

          python3 "$GITHUB_WORKSPACE/scripts/ci/validate_backend_smoke.py" \
            --health-file "$RUNNER_TEMP/backend-health.json" \
            --metadata-file "$RUNNER_TEMP/backend-smoke-metadata.json" \
            --http-status "$HTTP_STATUS" \
            --application-port 8081 \
            --management-port 8082 \
            --health-url http://127.0.0.1:8082/actuator/health

      # Evidence upload with bounded retry: transient (403) intermediary failures on
      # FinalizeArtifact must not fail an otherwise-successful smoke job, but the
      # evidence requirement itself is NOT weakened: the final attempt has no
      # continue-on-error, so three consecutive failures still fail the job.
      - name: Upload backend smoke evidence (attempt 1)
        id: upload_backend_evidence_a1
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pre-merge-backend-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/backend-health.json
            ${{ runner.temp }}/backend-smoke-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Backoff before backend evidence retry
        if: always() && steps.upload_backend_evidence_a1.outcome == 'failure'
        run: sleep 15

      - name: Upload backend smoke evidence (attempt 2)
        id: upload_backend_evidence_a2
        if: always() && steps.upload_backend_evidence_a1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pre-merge-backend-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/backend-health.json
            ${{ runner.temp }}/backend-smoke-metadata.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Backoff before backend evidence final retry
        if: always() && steps.upload_backend_evidence_a2.outcome == 'failure'
        run: sleep 30

      - name: Upload backend smoke evidence (final attempt)
        id: upload_backend_evidence_a3
        if: always() && steps.upload_backend_evidence_a2.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pre-merge-backend-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/backend-health.json
            ${{ runner.temp }}/backend-smoke-metadata.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  frontend-smoke:
    name: Frontend Operational Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build production frontend
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Start frontend and validate auth entry
        shell: bash
        working-directory: apps/web
        run: |
          set -euo pipefail
          FRONTEND_SMOKE_URL="http://127.0.0.1:3001/"
          : > "$RUNNER_TEMP/frontend.log"
          printf '%s\n' '<html>NOT_AVAILABLE</html>' > "$RUNNER_TEMP/frontend-auth.html"
          printf '%s\n' '{"result":"FAIL","failureType":"NOT_COMPLETED"}' > "$RUNNER_TEMP/frontend-smoke-metadata.json"

          cleanup_frontend() {
            if [ -n "${FRONTEND_PID:-}" ]; then
              kill "$FRONTEND_PID" 2>/dev/null || true
              wait "$FRONTEND_PID" 2>/dev/null || true
            fi
          }
          trap cleanup_frontend EXIT

          NEXT_TELEMETRY_DISABLED=1 NODE_ENV=production \
            ./node_modules/.bin/next start -H 127.0.0.1 -p 3001 \
            > "$RUNNER_TEMP/frontend.log" 2>&1 &
          FRONTEND_PID=$!

          FRONTEND_READY=false
          for i in $(seq 1 60); do
            if ! kill -0 "$FRONTEND_PID" 2>/dev/null; then
              echo "::error::Frontend process exited before readiness"
              tail -200 "$RUNNER_TEMP/frontend.log" || true
              exit 1
            fi
            if curl --fail --silent --show-error --connect-timeout 3 \
              "$FRONTEND_SMOKE_URL" >/dev/null 2>&1; then
              FRONTEND_READY=true
              break
            fi
            sleep 3
          done

          if [ "$FRONTEND_READY" != "true" ]; then
            echo "::error::Frontend did not become ready within 180 seconds"
            tail -200 "$RUNNER_TEMP/frontend.log" || true
            exit 1
          fi

          HTTP_STATUS="$(curl --silent --show-error --connect-timeout 3 \
            --output "$RUNNER_TEMP/frontend-auth.html" \
            --write-out '%{http_code}' \
            "$FRONTEND_SMOKE_URL")"

          python3 "$GITHUB_WORKSPACE/scripts/ci/validate_frontend_smoke.py" \
            --html-file "$RUNNER_TEMP/frontend-auth.html" \
            --metadata-file "$RUNNER_TEMP/frontend-smoke-metadata.json" \
            --http-status "$HTTP_STATUS" \
            --url "$FRONTEND_SMOKE_URL" \
            --port 3001

      - name: Verify production-alias HRM G3 routes
        id: g3_routes_production
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check-production-readiness.py \
            --frontend-routes-only \
            --attempts 1 \
            --delay-seconds 0 \
            --timeout-seconds 15 \
            --production-url https://snad-app.vercel.app \
            --evidence-file "$RUNNER_TEMP/hrm-g3-production-routes.json"

      - name: Verify git-main-alias HRM G3 routes
        id: g3_routes_git_main
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check-production-readiness.py \
            --frontend-routes-only \
            --attempts 1 \
            --delay-seconds 0 \
            --timeout-seconds 15 \
            --production-url https://snad-app-git-main-snad-team.vercel.app \
            --evidence-file "$RUNNER_TEMP/hrm-g3-git-main-routes.json"

      - name: Resolve Vercel incident preview URL
        id: g3_preview_url
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'incident/') }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100"
          PREVIEW_URL=""
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API_URL" > "$RUNNER_TEMP/pr-comments.json"
            PREVIEW_URL="$(python3 - "$RUNNER_TEMP/pr-comments.json" <<'PY'
          import json
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              comments = json.load(handle)

          for comment in reversed(comments):
              match = re.search(r"\[Preview\]\((https://[^)]+\.vercel\.app)\)", comment.get("body", ""))
              if match:
                  print(match.group(1))
                  break
          PY
          )"
            if [ -n "$PREVIEW_URL" ]; then
              echo "G3_PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
              printf '{"previewUrl":"%s"}\n' "$PREVIEW_URL" > "$RUNNER_TEMP/hrm-g3-preview-url.json"
              echo "Resolved Vercel preview: $PREVIEW_URL"
              exit 0
            fi
            sleep 5
          done
          echo "::error::VERCEL_PREVIEW_URL_NOT_FOUND_FOR_INCIDENT_PR"
          exit 1

      - name: Verify incident-preview HRM G3 routes
        id: g3_routes_preview
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'incident/') && steps.g3_preview_url.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/check-production-readiness.py \
            --frontend-routes-only \
            --attempts 1 \
            --delay-seconds 0 \
            --timeout-seconds 15 \
            --production-url "$G3_PREVIEW_URL" \
            --evidence-file "$RUNNER_TEMP/hrm-g3-preview-routes.json"

      - name: Enforce HRM G3 live route matrix
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "production=${{ steps.g3_routes_production.outcome }}"
          echo "git-main=${{ steps.g3_routes_git_main.outcome }}"
          test "${{ steps.g3_routes_production.outcome }}" = success
          test "${{ steps.g3_routes_git_main.outcome }}" = success
          if [[ "${GITHUB_HEAD_REF:-}" == incident/* ]]; then
            echo "preview-url=${{ steps.g3_preview_url.outcome }}"
            echo "preview-routes=${{ steps.g3_routes_preview.outcome }}"
            test "${{ steps.g3_preview_url.outcome }}" = success
            test "${{ steps.g3_routes_preview.outcome }}" = success
          fi

      # Evidence upload with bounded retry: transient (403) intermediary failures on
      # FinalizeArtifact must not fail an otherwise-successful smoke job, but the
      # evidence requirement itself is NOT weakened: the final attempt has no
      # continue-on-error, so three consecutive failures still fail the job.
      - name: Upload frontend smoke evidence (attempt 1)
        id: upload_frontend_evidence_a1
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pre-merge-frontend-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/frontend.log
            ${{ runner.temp }}/frontend-auth.html
            ${{ runner.temp }}/frontend-smoke-metadata.json
            ${{ runner.temp }}/hrm-g3-production-routes.json
            ${{ runner.temp }}/hrm-g3-git-main-routes.json
            ${{ runner.temp }}/hrm-g3-preview-url.json
            ${{ runner.temp }}/hrm-g3-preview-routes.json
          if-no-files-found: error
          retention-days: 14

      - name: Backoff before frontend evidence retry
        if: always() && steps.upload_frontend_evidence_a1.outcome == 'failure'
        run: sleep 15

      - name: Upload frontend smoke evidence (attempt 2)
        id: upload_frontend_evidence_a2
        if: always() && steps.upload_frontend_evidence_a1.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pre-merge-frontend-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/frontend.log
            ${{ runner.temp }}/frontend-auth.html
            ${{ runner.temp }}/frontend-smoke-metadata.json
            ${{ runner.temp }}/hrm-g3-production-routes.json
            ${{ runner.temp }}/hrm-g3-git-main-routes.json
            ${{ runner.temp }}/hrm-g3-preview-url.json
            ${{ runner.temp }}/hrm-g3-preview-routes.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

      - name: Backoff before frontend evidence final retry
        if: always() && steps.upload_frontend_evidence_a2.outcome == 'failure'
        run: sleep 30

      - name: Upload frontend smoke evidence (final attempt)
        id: upload_frontend_evidence_a3
        if: always() && steps.upload_frontend_evidence_a2.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pre-merge-frontend-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/frontend.log
            ${{ runner.temp }}/frontend-auth.html
            ${{ runner.temp }}/frontend-smoke-metadata.json
            ${{ runner.temp }}/hrm-g3-production-routes.json
            ${{ runner.temp }}/hrm-g3-git-main-routes.json
            ${{ runner.temp }}/hrm-g3-preview-url.json
            ${{ runner.temp }}/hrm-g3-preview-routes.json
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  smoke-summary:
    name: Pre-Merge Operational Smoke Summary
    if: always()
    needs:
      - backend-smoke
      - frontend-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Require both independent smokes
        shell: bash
        run: |
          set -euo pipefail
          echo "Backend smoke: ${{ needs.backend-smoke.result }}"
          echo "Frontend smoke: ${{ needs.frontend-smoke.result }}"
          test "${{ needs.backend-smoke.result }}" = success
          test "${{ needs.frontend-smoke.result }}" = success
