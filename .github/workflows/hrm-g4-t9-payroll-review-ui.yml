name: HRM G4 T9 Payroll Review UI

on:
  pull_request:
    paths:
      - 'apps/web/app/hr/payroll/**'
      - 'apps/web/app/hr/g4-t9-payroll-ui.contract.test.ts'
      - 'apps/web/app/hr/components/hr-workspace.tsx'
      - 'apps/web/lib/api/hr-payroll-api*'
      - '.github/workflows/hrm-g4-t9-payroll-review-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-vitest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: G4-T9 focused Vitest contracts
        run: npx vitest run app/hr/g4-t9-payroll-ui.contract.test.ts lib/api/hr-payroll-api.test.ts
      - name: TypeScript verification
        run: npm run typecheck
