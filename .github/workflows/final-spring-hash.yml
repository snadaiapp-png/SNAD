name: FINAL FIX — Spring Hash into PROD_JDBC_URL DB

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "final" to confirm'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    if: github.event.inputs.confirm == 'final'
    steps:
      - name: Install JDK + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jdk
          pip3 install psycopg2-binary

      - name: Download jars
        run: |
          curl -sS -L -o /tmp/spring-security-crypto.jar "https://repo1.maven.org/maven2/org/springframework/security/spring-security-crypto/6.3.1/spring-security-crypto-6.3.1.jar"
          curl -sS -L -o /tmp/spring-jcl.jar "https://repo1.maven.org/maven2/org/springframework/spring-jcl/6.1.6/spring-jcl-6.1.6.jar"

      - name: Generate BCrypt hash using Spring Security
        id: hash
        run: |
          python3 -c "
          with open('/tmp/GenHash.java', 'w') as f:
              f.write('import org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;\n')
              f.write('public class GenHash {\n')
              f.write('    public static void main(String[] args) {\n')
              f.write('        BCryptPasswordEncoder encoder = new BCryptPasswordEncoder(10);\n')
              f.write('        String hash = encoder.encode(\"SNad@2026\");\n')
              f.write('        System.out.println(hash);\n')
              f.write('        System.err.println(\"Verify: \" + encoder.matches(\"SNad@2026\", hash));\n')
              f.write('    }\n')
              f.write('}\n')
          "
          javac -cp /tmp/spring-security-crypto.jar:/tmp/spring-jcl.jar /tmp/GenHash.java -d /tmp/
          HASH=$(java -cp /tmp:/tmp/spring-security-crypto.jar:/tmp/spring-jcl.jar GenHash)
          echo "Hash: $HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Insert into PROD_JDBC_URL database
        env:
          PROD_JDBC_URL: ${{ secrets.PROD_JDBC_URL }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import psycopg2
          import os
          import sys

          jdbc_url = os.environ['PROD_JDBC_URL']
          db_user = os.environ['PROD_DB_USER']
          db_pass = os.environ['PROD_DB_PASSWORD']
          hash_val = os.environ['HASH']
          admin_email = 'admin@snad.ai'

          print(f"Hash from Spring Security: {hash_val}", file=sys.stderr)

          conn_str = jdbc_url.replace('jdbc:postgresql://', '')
          host_port = conn_str.split('/')[0]
          host = host_port.split(':')[0]
          port = host_port.split(':')[1] if ':' in host_port else '5432'
          db_name = conn_str.split('/')[1].split('?')[0] if '/' in conn_str else 'postgres'

          conn = psycopg2.connect(host=host, port=port, dbname=db_name,
                                  user=db_user, password=db_pass, sslmode='require')
          cur = conn.cursor()

          # Check existing user
          cur.execute("SELECT id, email, status, length(password_hash) FROM public.users WHERE email = %s", (admin_email,))
          existing = cur.fetchone()
          print(f"Existing user: {existing}", file=sys.stderr)

          # Update password with Spring Security's own hash!
          cur.execute("UPDATE public.users SET password_hash = %s, status = 'ACTIVE', updated_at = CURRENT_TIMESTAMP WHERE email = %s",
                      (hash_val, admin_email))
          print(f"Updated: {cur.rowcount} rows", file=sys.stderr)

          conn.commit()
          cur.close()
          conn.close()
          print("Done!", file=sys.stderr)
          PYEOF

      - name: Test login
        run: |
          echo "=== Login test ==="
          for i in 1 2 3 4 5; do
            RESULT=$(curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
              -H "Content-Type: application/json" \
              -d '{"email":"admin@snad.ai","password":"SNad@2026"}' \
              -w "\n%{http_code}" 2>/dev/null || echo "timeout\n000")
            CODE=$(echo "$RESULT" | tail -1)
            echo "  Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "🎉🎉🎉 LOGIN SUCCESSFUL! 🎉🎉🎉"
              exit 0
            fi
            sleep 30
          done
          echo "❌ Login failed"
