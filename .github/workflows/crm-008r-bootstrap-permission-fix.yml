name: CRM-008R Materialize Closure Workflow Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crm-008r-bootstrap-permission-fix.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: crm-008r-materialize-closure-fix
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize audited fixed workflow blob
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: .github/workflows/crm-008r-final-production-closure.yml
      OUTPUT: generated/crm-008r-final-production-closure.fixed.yml
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Materialize exact governed replacement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/crm-008r-final-production-closure.yml')
          output = Path('generated/crm-008r-final-production-closure.fixed.yml')
          lines = source.read_text(encoding='utf-8').splitlines()

          permission = '  actions: read'
          if lines.count(permission) != 1:
              raise SystemExit(f'Expected exactly one {permission!r}, found {lines.count(permission)}')
          lines[lines.index(permission)] = '  actions: write'

          start_line = '          test -n "$RENDER_OWNER_ID" || { echo "::error::Render owner ID unavailable"; exit 1; }'
          end_line = '            > "$EVIDENCE_DIR/runtime-error-summary.json"'
          if lines.count(start_line) != 1:
              raise SystemExit(f'Expected exactly one Render owner guard, found {lines.count(start_line)}')
          start = lines.index(start_line)
          ends = [i for i in range(start, len(lines)) if lines[i] == end_line]
          if len(ends) != 1:
              raise SystemExit(f'Expected exactly one runtime summary block end, found {len(ends)}')

          replacement = [
              '          if [ -z "$RENDER_OWNER_ID" ]; then',
              '            jq -n \'{result:"SKIPPED_UPSTREAM_FAILURE",unexpected_crm_http_500:null}\' > "$EVIDENCE_DIR/runtime-error-summary.json"',
              '          else',
              '            curl --get --fail-with-body --silent --show-error --max-time 45 \\',
              '              -H "Authorization: Bearer ${RENDER_API_KEY}" -H \'Accept: application/json\' \\',
              '              --data-urlencode "ownerId=${RENDER_OWNER_ID}" \\',
              '              --data-urlencode "resource=${RENDER_SERVICE_ID}" \\',
              '              --data-urlencode "startTime=${CRM008R_STARTED_AT}" \\',
              '              --data-urlencode "endTime=${END_TIME}" \\',
              '              --data-urlencode "type=request" \\',
              '              --data-urlencode "statusCode=500" \\',
              '              --data-urlencode "limit=100" \\',
              '              https://api.render.com/v1/logs > "$EVIDENCE_DIR/render-500-logs.json"',
              '            CRM_500_COUNT="$(jq \'[if type=="array" then .[] else (.logs // .items // [])[] end | tostring | select(test("/api/v2/crm"))] | length\' "$EVIDENCE_DIR/render-500-logs.json")"',
              '            test "$CRM_500_COUNT" = 0 || { echo "::error::Unexpected CRM HTTP 500 count: ${CRM_500_COUNT}"; exit 1; }',
              '            jq -n --argjson count "$CRM_500_COUNT" \'{result:"PASS",unexpected_crm_http_500:$count}\' > "$EVIDENCE_DIR/runtime-error-summary.json"',
              '          fi',
          ]
          expected_prefixes = [10, 12, 10, 12, 14, 14, 14, 14, 14, 14, 14, 14, 14, 12, 12, 12, 10]
          actual_prefixes = [len(line) - len(line.lstrip(' ')) for line in replacement]
          if actual_prefixes != expected_prefixes:
              raise SystemExit(f'Explicit indentation mismatch: {actual_prefixes}')
          end = ends[0]
          lines[start:end + 1] = replacement

          marker = 'CRM-008R Production FAILURE.'
          if any(marker in line for line in lines):
              raise SystemExit('Failure issue-comment block already exists')
          tail = '          } >> "$GITHUB_STEP_SUMMARY"'
          if lines[-1] != tail:
              raise SystemExit(f'Unexpected workflow tail: {lines[-1]!r}')
          lines.extend([
              '          if [ "$STATUS" != "success" ]; then',
              '            gh issue comment 725 --repo "$GITHUB_REPOSITORY" --body "CRM-008R Production FAILURE. Release: ${GITHUB_SHA}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Artifact: ${ARTIFACT_URL:-not-created}. Issue remains open; no closure is authorized."',
              '          fi',
          ])

          result = '\n'.join(lines) + '\n'
          checks = {
              'actions_write': result.count('  actions: write') == 1,
              'actions_read_removed': '  actions: read' not in result,
              'guarded_runtime_logs': result.count('SKIPPED_UPSTREAM_FAILURE') == 1,
              'failure_comment': result.count(marker) == 1,
              'if_indent': replacement[0].startswith('          if '),
              'body_indent': replacement[1].startswith('            jq '),
          }
          if not all(checks.values()):
              raise SystemExit(f'Post-materialization validation failed: {checks}')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(result, encoding='utf-8')
          print(checks)
          PY

          git diff --exit-code -- "$TARGET"
          test -s "$OUTPUT"
          grep -Fx '  actions: write' "$OUTPUT"
          grep -Fx '          if [ -z "$RENDER_OWNER_ID" ]; then' "$OUTPUT"
          grep -Fx '            jq -n '\''{result:"SKIPPED_UPSTREAM_FAILURE",unexpected_crm_http_500:null}'\'' > "$EVIDENCE_DIR/runtime-error-summary.json"' "$OUTPUT"
          grep -F 'CRM-008R Production FAILURE.' "$OUTPUT"

      - name: Publish materialized blob branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          branch="generated/crm-008r-final-closure-fixed-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$OUTPUT"
          git commit -m "build(crm-008r): materialize corrected closure workflow blob"
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" --draft \
            --title "build(crm-008r): materialized final-closure workflow blob" \
            --body "Machine-materialized corrected workflow content with explicit block indentation for connector-controlled installation. This Draft PR must not be merged. Final Production closure remains unauthorized.")"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          gh issue comment 725 --repo "$GITHUB_REPOSITORY" --body "CRM-008R explicitly-indented workflow blob materialized on branch ${branch}: ${pr_url}. It is staging evidence only and must not be treated as closure."

      - name: Summary
        shell: bash
        run: |
          echo "## CRM-008R materialized workflow fix" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source main SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Materialized branch: ${{ steps.publish.outputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Staging PR: ${{ steps.publish.outputs.pr_url }}" >> "$GITHUB_STEP_SUMMARY"
