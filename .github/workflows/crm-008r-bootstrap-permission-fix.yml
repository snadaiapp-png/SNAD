name: CRM-008R Materialize Tenant Resolution Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crm-008r-bootstrap-permission-fix.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: crm-008r-materialize-tenant-resolution-fix
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize audited tenant-resolution workflow fix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: .github/workflows/crm-008r-final-production-closure.yml
      OUTPUT: generated/crm-008r-final-production-closure.tenant-resolution-fixed.yml
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Materialize exact one-line correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/crm-008r-final-production-closure.yml')
          output = Path('generated/crm-008r-final-production-closure.tenant-resolution-fixed.yml')
          source_text = source.read_text(encoding='utf-8')
          lines = source_text.splitlines()

          baseline_checks = {
              'actions_write': lines.count('  actions: write') == 1,
              'actions_read_absent': '  actions: read' not in lines,
              'runtime_fail_safe': source_text.count('SKIPPED_UPSTREAM_FAILURE') == 1,
              'failure_comment': source_text.count('CRM-008R Production FAILURE.') == 1,
              'resolver_function': lines.count('          resolve_tenant() {') == 1,
          }
          if not all(baseline_checks.values()):
              raise SystemExit(f'Unexpected protected workflow baseline: {baseline_checks}')

          unsafe = '              echo "::add-mask::$candidate"'
          safe = '              echo "::add-mask::$candidate" >&2'
          if lines.count(unsafe) != 1:
              raise SystemExit(f'Expected exactly one stdout tenant mask line, found {lines.count(unsafe)}')
          if lines.count(safe) != 0:
              raise SystemExit(f'Tenant mask stderr line already exists: {lines.count(safe)}')

          lines[lines.index(unsafe)] = safe
          result = '\n'.join(lines) + '\n'
          result_lines = result.splitlines()
          post_checks = {
              'unsafe_removed': result_lines.count(unsafe) == 0,
              'safe_once': result_lines.count(safe) == 1,
              'actions_write_unchanged': result_lines.count('  actions: write') == 1,
              'runtime_fail_safe_unchanged': result.count('SKIPPED_UPSTREAM_FAILURE') == 1,
              'failure_comment_unchanged': result.count('CRM-008R Production FAILURE.') == 1,
              'resolver_output_only': result_lines.count('            printf \'%s\' "$resolved"') == 1,
          }
          if not all(post_checks.values()):
              raise SystemExit(f'Post-materialization validation failed: {post_checks}')

          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(result, encoding='utf-8')
          print({'baseline': baseline_checks, 'post': post_checks})
          PY

          git diff --exit-code -- "$TARGET"
          test -s "$OUTPUT"
          grep -Fx '              echo "::add-mask::$candidate" >&2' "$OUTPUT"
          if grep -Fx '              echo "::add-mask::$candidate"' "$OUTPUT"; then
            echo '::error::Unsafe stdout masking line remains'
            exit 1
          fi
          test "$(diff -U0 "$TARGET" "$OUTPUT" | grep -Ec '^[+-][^+-]')" = 2

      - name: Publish materialized blob branch
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          branch="generated/crm-008r-tenant-resolution-fixed-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "$OUTPUT"
          git commit -m "build(crm-008r): materialize tenant resolution stdout fix"
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" --draft \
            --title "build(crm-008r): materialized tenant-resolution workflow fix" \
            --body "Machine-materialized one-line correction redirecting tenant masking output to stderr. This Draft staging PR must not be merged. Final Production closure remains unauthorized.")"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          gh issue comment 725 --repo "$GITHUB_REPOSITORY" --body "CRM-008R tenant-resolution workflow fix materialized on branch ${branch}: ${pr_url}. Staging evidence only; no Production closure is authorized. Failed Production run remains 30182326310."

      - name: Summary
        shell: bash
        run: |
          echo "## CRM-008R tenant-resolution materialization" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source main SHA: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Root cause: add-mask command polluted command-substitution stdout" >> "$GITHUB_STEP_SUMMARY"
          echo "- Materialized branch: ${{ steps.publish.outputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Staging PR: ${{ steps.publish.outputs.pr_url }}" >> "$GITHUB_STEP_SUMMARY"
