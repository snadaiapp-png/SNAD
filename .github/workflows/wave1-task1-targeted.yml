name: Wave 1 Task 1 Targeted PostgreSQL Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/security/rls/UserPermissionOverrideRlsPostgresTest.java'
      - 'apps/sanad-platform/src/main/resources/db/migration/V20261001_1__uac_overrides_relationships_events.sql'
      - '.github/workflows/wave1-task1-targeted.yml'

permissions:
  contents: read

jobs:
  targeted-postgres:
    name: Wave 1 Task 1 PostgreSQL Direct
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: sanad
      SPRING_DATASOURCE_PASSWORD: sanad_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_PROFILES_ACTIVE: default
      CI: 'true'
    defaults:
      run:
        working-directory: apps/sanad-platform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start host-native PostgreSQL
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1
          sudo systemctl start postgresql
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432

      - name: Provision least-privilege application role and isolated databases
        run: |
          set -euo pipefail
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad') THEN
              CREATE ROLE sanad WITH LOGIN PASSWORD 'sanad_pass';
            END IF;
          END $$;
          ALTER ROLE sanad NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;

          SELECT 'CREATE DATABASE sanad OWNER sanad'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'sanad')\gexec
          ALTER DATABASE sanad OWNER TO sanad;

          SELECT 'CREATE DATABASE test_migration OWNER sanad'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'test_migration')\gexec
          ALTER DATABASE test_migration OWNER TO sanad;

          GRANT CONNECT ON DATABASE postgres TO sanad;

          \c sanad
          GRANT USAGE, CREATE ON SCHEMA public TO sanad;
          \c test_migration
          GRANT USAGE, CREATE ON SCHEMA public TO sanad;
          SQL

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run exact Task 1 PostgreSQL Direct contract
        run: mvn -B -ntp -Dsurefire.useFile=false -Dtest=com.sanad.platform.security.rls.UserPermissionOverrideRlsPostgresTest test
