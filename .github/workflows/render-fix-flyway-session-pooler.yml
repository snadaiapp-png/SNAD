name: Render Fix Flyway → Session Pooler + Deploy + Verify

# ROOT FIX for the Flyway advisory-lock failure:
# Supabase Supavisor TRANSACTION pooler (port 5432) orphans Flyway's PostgreSQL
# advisory lock on container crash-exit -> "Number of retries exceeded" -> exit 1.
# Fix: point Flyway at the SESSION-mode pooler (port 6543) via spring.flyway.url.
# Session mode pins a dedicated backend per client -> advisory locks acquire &
# release cleanly; reads hit the primary (no replica lag). The app datasource
# keeps using the transaction pooler (5432) for speed. No G7/RLS/auth/migration
# content changes. Reversible (unset SPRING_FLYWAY_URL to revert).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    name: Set SPRING_FLYWAY_URL + clear orphans + deploy + verify
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    steps:
      - name: Configure Flyway session-pooler, clear orphans, deploy, verify
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          FLYWAY_URL_VALUE: jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:6543/postgres
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          BASE="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"

          echo "=== STEP 1: Set SPRING_FLYWAY_URL = session-mode pooler (:6543) ==="
          jq -n --arg value "$FLYWAY_URL_VALUE" '{value:$value}' > /tmp/body.json
          HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" --max-time 45 -X PUT \
            -H "$AUTH" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data @/tmp/body.json "$BASE/env-vars/SPRING_FLYWAY_URL")
          echo "PUT SPRING_FLYWAY_URL -> HTTP $HTTP"
          test "$HTTP" -ge 200 -a "$HTTP" -lt 300 || { echo "::error::failed to set SPRING_FLYWAY_URL"; cat /tmp/r.json; exit 1; }

          echo ""
          echo "=== STEP 2: Clear orphaned JDBC sessions holding the advisory lock ==="
          DB_URL="$(curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/env-vars/DATABASE_URL" | jq -r '(.envVar // .).value // empty')"
          DB_USER="$(curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/env-vars/DATABASE_USERNAME" | jq -r '(.envVar // .).value // empty')"
          DB_PASS="$(curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/env-vars/DATABASE_PASSWORD" | jq -r '(.envVar // .).value // empty')"
          echo "::add-mask::$DB_URL"; echo "::add-mask::$DB_USER"; echo "::add-mask::$DB_PASS"
          # connect via SESSION mode (6543) to act on the primary
          HOST="$(printf '%s\n' "$DB_URL" | sed -E 's#.*://##; s#/.*##; s#:.*##; s#\?.*##')"
          SES_URL="postgresql://$HOST:6543/postgres"
          export PGPASSWORD="$DB_PASS"
          echo "Advisory locks BEFORE cleanup:"
          psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -c "SELECT pid, granted FROM pg_locks WHERE locktype='advisory';" || true
          echo "Terminating orphaned idle/idle-in-txn JDBC sessions (release locks)..."
          psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -c "SELECT pid, pg_terminate_backend(pid) FROM pg_stat_activity WHERE application_name='PostgreSQL JDBC Driver' AND state IN ('idle','idle in transaction') AND pid <> pg_backend_pid();" || true
          sleep 3
          echo "Advisory locks AFTER cleanup:"
          psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -c "SELECT pid, granted FROM pg_locks WHERE locktype='advisory';" || true

          echo ""
          echo "=== STEP 3: Trigger deploy (current image, do_not_clear) ==="
          HTTP=$(curl -s -o /tmp/d.json -w "%{http_code}" --max-time 30 -X POST "$BASE/deploys" \
            -H "$AUTH" -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data '{"clearCache":"do_not_clear"}')
          echo "POST /deploys -> HTTP $HTTP"
          DEPLOY_ID=$(jq -r '.id // empty' /tmp/d.json)
          echo "Deploy ID: $DEPLOY_ID"
          test -n "$DEPLOY_ID" || { echo "::error::no deploy id"; cat /tmp/d.json; exit 1; }

          echo ""
          echo "=== STEP 4: Poll deploy status until terminal (max ~24 min) ==="
          STATUS="unknown"
          for i in $(seq 1 95); do
            sleep 15
            STATUS=$(curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/deploys/$DEPLOY_ID" | jq -r '.status // "unknown"')
            echo "  Attempt $i ($((i*15))s): $STATUS"
            if [ "$STATUS" = "live" ]; then echo "::notice::DEPLOY LIVE"; break; fi
            if echo "$STATUS" | grep -qiE 'failed|canceled|deactivated'; then echo "::error::terminal: $STATUS"; exit 1; fi
          done
          [ "$STATUS" = "live" ] || { echo "::error::did not reach LIVE (last: $STATUS)"; exit 1; }

          echo ""
          echo "=== STEP 5: Health check /actuator/health ==="
          sleep 10
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /tmp/h.json -w "%{http_code}" --max-time 30 https://sanad-backend-mcrj.onrender.com/actuator/health || echo 000)
            BODY=$(jq -r '.status // empty' /tmp/h.json 2>/dev/null || echo "")
            echo "  Attempt $i: HTTP $CODE status=$BODY"
            [ "$CODE" = "200" ] && [ "$BODY" = "UP" ] && { echo "::notice::BACKEND HEALTHY"; break; }
            sleep 10
          done

          echo ""
          echo "=== STEP 6: Verify G7 tables + flyway_schema_history created (session mode) ==="
          psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -c "SELECT count(*) AS flyway_rows FROM public.flyway_schema_history;" || true
          psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('mobile_device_registry','mobile_sync_cursor','mobile_sync_log','mobile_conflict_log') ORDER BY table_name;" || true
          psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -c "SELECT count(*) AS public_tables FROM information_schema.tables WHERE table_schema='public';" || true
