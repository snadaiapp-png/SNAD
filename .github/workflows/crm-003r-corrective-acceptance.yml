name: CRM-003R Corrective Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/crm/**'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/crm/**'
      - 'docs/crm/**'
      - '.github/workflows/crm-003r-corrective-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-keyset-and-openapi-parity:
    name: PostgreSQL keyset and OpenAPI semantic parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run CRM-003R corrective acceptance
        id: acceptance
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B -ntp \
            -Dtest=CrmCoreKeysetPaginationPostgresTest,CrmOpenApiRuntimeSemanticParityTest \
            -DfailIfNoTests=true \
            test 2>&1 | tee crm-003r-maven.log

      - name: Assert tests actually executed
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -euo pipefail
          reports=(target/surefire-reports/TEST-*.xml)
          test -e "${reports[0]}"
          tests=$(grep -h '<testsuite ' "${reports[@]}" | sed -E 's/.* tests="([0-9]+)".*/\1/' | awk '{sum += $1} END {print sum+0}')
          failures=$(grep -h '<testsuite ' "${reports[@]}" | sed -E 's/.* failures="([0-9]+)".*/\1/' | awk '{sum += $1} END {print sum+0}')
          errors=$(grep -h '<testsuite ' "${reports[@]}" | sed -E 's/.* errors="([0-9]+)".*/\1/' | awk '{sum += $1} END {print sum+0}')
          skipped=$(grep -h '<testsuite ' "${reports[@]}" | sed -E 's/.* skipped="([0-9]+)".*/\1/' | awk '{sum += $1} END {print sum+0}')
          echo "tests=$tests failures=$failures errors=$errors skipped=$skipped"
          test "$tests" -ge 5
          test "$failures" -eq 0
          test "$errors" -eq 0
          test "$skipped" -eq 0

      - name: Upload immutable acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-003r-corrective-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/sanad-platform/crm-003r-maven.log
            apps/sanad-platform/target/surefire-reports
          if-no-files-found: error
          retention-days: 30
