name: ERP Receipt RED Gate

on:
  push:
    branches:
      - fix/erp-receipt-state-pg-direct-ci-20260816
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-state-regression:
    name: ERP Receipt State Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanad
          POSTGRES_PASSWORD: sanad_pass
          POSTGRES_DB: sanad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanad -d sanad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: sanad
      SPRING_DATASOURCE_PASSWORD: sanad_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_PROFILES_ACTIVE: default
      FLYWAY_ENABLED: 'true'
      FLYWAY_BASELINE_ON_MIGRATE: 'true'
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      JPA_DDL_AUTO: validate

    defaults:
      run:
        working-directory: apps/sanad-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run ERP receipt state regression
        env:
          CRM_CUSTOM_FIELD_ENCRYPTION_KEY: 'El3BbUMQ882dQYiAqNEEMxfTr3CVlf0FTbrCOrIKKsw='
        run: >-
          mvn test -B -ntp
          -Dsurefire.useFile=false
          -DfailIfNoTests=true
          -Dtest=ErpGoodsReceiptStateIntegrationTest
