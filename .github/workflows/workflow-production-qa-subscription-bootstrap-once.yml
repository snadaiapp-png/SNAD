name: Workflow Production QA Subscription Bootstrap (One-Time)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/workflow-production-qa-subscription-bootstrap-once.yml"

permissions:
  contents: read

concurrency:
  group: workflow-production-qa-subscription-bootstrap-once
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap governed Tenant B STARTER subscription
    if: contains(github.event.head_commit.message, '[workflow-qa-bootstrap-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      EXPECTED_PARENT_SHA: 1e6a537cc20df7732b1546029d1a3365a2daec57
      EXPECTED_MAIN_SHA: ${{ github.sha }}
      PRODUCTION_BASE_URL: ${{ vars.WEB_PRODUCTION_BASE_URL || 'https://snad-app.vercel.app' }}
      PROD_ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
      PROD_ADMIN_PASSWORD: ${{ secrets.CONTROL_PLANE_ADMIN_PASSWORD }}
      PROD_QA_ADMIN_EMAIL: ${{ secrets.AUTH_SMOKE_TENANT_B_EMAIL }}
      PROD_QA_ADMIN_PASSWORD: ${{ secrets.AUTH_SMOKE_TENANT_B_PASSWORD }}
      PROD_QA_TENANT_CODE: workflow-prod-qa
      PROD_QA_TENANT_NAME: Workflow Production QA
      IMAGE_REF: ghcr.io/snadaiapp-png/snad-backend:5bc39e17626ca3484bb2cb7a147c9322a6fa32dd
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      BOOTSTRAP_EVIDENCE_FILE: workflow-production-qa-subscription-bootstrap.json

    steps:
      - name: Checkout exact protected main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce one-time exact-parent and scoped-delta lock
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          remote_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          [ "$remote_main" = "$GITHUB_SHA" ] || { echo "::error::MAIN_DRIFT expected=$GITHUB_SHA actual=$remote_main"; exit 1; }
          parent="$(git rev-parse HEAD^)"
          [ "$parent" = "$EXPECTED_PARENT_SHA" ] || { echo "::error::ONE_TIME_PARENT_GUARD expected=$EXPECTED_PARENT_SHA actual=$parent"; exit 1; }
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/changed.txt"
          cat > "$RUNNER_TEMP/allowed.txt" <<'EOF'
          .github/workflows/ci.yml
          .github/workflows/workflow-production-3user-final-gate.yml
          .github/workflows/workflow-production-qa-subscription-bootstrap-once.yml
          scripts/production/bootstrap-workflow-production-qa-subscription.sh
          scripts/production/verify-workflow-production-3user-journey.sh
          tests/ci/test_workflow_final_closure_unified.py
          tests/ci/test_workflow_starter_bootstrap_contract.py
          EOF
          sort -o "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/allowed.txt"
          diff -u "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/changed.txt" || {
            echo "::error::One-time bootstrap merge contains unexpected or missing files"
            exit 1
          }

      - name: Wait for exact-main Vercel convergence
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --location --connect-timeout 12 --max-time 45 \
              --output "$RUNNER_TEMP/release.json" --write-out '%{http_code}' \
              "$PRODUCTION_BASE_URL/api/system/release" || true)"
            if [ "$code" = 200 ] && jq -e --arg sha "$EXPECTED_MAIN_SHA" '.commitSha==$sha and (.environment=="production" or .environment=="prod")' "$RUNNER_TEMP/release.json" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 15
          done
          [ "$ready" = true ] || { echo "::error::Vercel production did not converge to exact bootstrap main SHA"; exit 1; }

      - name: Execute application-native Tenant B identity + STARTER reconcile
        shell: bash
        run: bash scripts/production/bootstrap-workflow-production-qa-subscription.sh

      - name: Upload sanitized bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-production-qa-subscription-bootstrap-${{ github.run_id }}
          path: workflow-production-qa-subscription-bootstrap.json
          if-no-files-found: warn
          retention-days: 90

      - name: Record bootstrap summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Workflow Production QA Subscription Bootstrap'
            echo "- Exact main: $EXPECTED_MAIN_SHA"
            echo '- Tenant B identity: application-native bootstrap, code workflow-prod-qa'
            echo '- Credential rotation: one-time bootstrap credential -> canonical Tenant B secret'
            echo '- Bootstrap final state: DISABLED'
            echo '- Existing catalog: STARTER'
            echo '- Subscription mutation: create/provision only when absent'
            echo '- WORKFLOW entitlement: existing catalog + tenant recalculate'
            echo '- Plan/catalog/version mutations: NONE'
            echo '- Direct database writes: NONE'
            echo 'WORKFLOW_QA_RECONCILE=PASS'
          } >> "$GITHUB_STEP_SUMMARY"
