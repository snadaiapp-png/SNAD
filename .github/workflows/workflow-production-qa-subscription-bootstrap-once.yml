name: Workflow Production QA Subscription Bootstrap (One-Time)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/workflow-production-qa-subscription-bootstrap-once.yml"

permissions:
  contents: read

concurrency:
  group: workflow-production-qa-subscription-bootstrap-once
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap governed Tenant B STARTER subscription
    if: contains(github.event.head_commit.message, '[workflow-qa-bootstrap-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      EXPECTED_PARENT_SHA: 1e6a537cc20df7732b1546029d1a3365a2daec57
      EXPECTED_MAIN_SHA: ${{ github.sha }}
      PRODUCTION_BASE_URL: ${{ vars.WEB_PRODUCTION_BASE_URL || 'https://snad-app.vercel.app' }}
      PROD_ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
      PROD_ADMIN_PASSWORD: ${{ secrets.CONTROL_PLANE_ADMIN_PASSWORD }}
      PROD_QA_EMAIL: ${{ secrets.AUTH_SMOKE_TENANT_B_EMAIL }}
      PROD_QA_PASSWORD: ${{ secrets.AUTH_SMOKE_TENANT_B_PASSWORD }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      BOOTSTRAP_EVIDENCE_FILE: workflow-production-qa-subscription-bootstrap.json

    steps:
      - name: Checkout exact protected main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce one-time exact-parent and scoped-delta lock
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ]
          remote_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          [ "$remote_main" = "$GITHUB_SHA" ] || { echo "::error::MAIN_DRIFT expected=$GITHUB_SHA actual=$remote_main"; exit 1; }
          parent="$(git rev-parse HEAD^)"
          [ "$parent" = "$EXPECTED_PARENT_SHA" ] || { echo "::error::ONE_TIME_PARENT_GUARD expected=$EXPECTED_PARENT_SHA actual=$parent"; exit 1; }
          git diff --name-only HEAD^ HEAD | sort > "$RUNNER_TEMP/changed.txt"
          printf '%s\n' '.github/workflows/workflow-production-qa-subscription-bootstrap-once.yml' > "$RUNNER_TEMP/allowed.txt"
          diff -u "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/changed.txt" || {
            echo "::error::One-time bootstrap correction contains unexpected files"
            exit 1
          }

      - name: Resolve production Control Plane tenant
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 45 \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json' \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars?limit=100" > "$RUNNER_TEMP/render-env.json"
          test "$(jq 'length' "$RUNNER_TEMP/render-env.json")" -lt 100
          tenant_id="$(jq -r '[.[]? | (.envVar // .) | select(.key=="SANAD_CONTROL_PLANE_TENANT_ID")][0].value // empty' "$RUNNER_TEMP/render-env.json")"
          [[ "$tenant_id" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::SANAD_CONTROL_PLANE_TENANT_ID missing or invalid"; exit 1; }
          echo "::add-mask::$tenant_id"
          echo "PROD_TENANT_ID=$tenant_id" >> "$GITHUB_ENV"

      - name: Resolve Tenant B from canonical email-only login
        shell: bash
        run: |
          set -euo pipefail
          : "${PROD_QA_EMAIL:?AUTH_SMOKE_TENANT_B_EMAIL required}"
          : "${PROD_QA_PASSWORD:?AUTH_SMOKE_TENANT_B_PASSWORD required}"
          echo "::add-mask::$PROD_QA_EMAIL"
          echo "::add-mask::$PROD_QA_PASSWORD"
          payload="$(jq -cn --arg email "$PROD_QA_EMAIL" --arg password "$PROD_QA_PASSWORD" '{email:$email,password:$password}')"
          status="$(curl --silent --show-error --location --connect-timeout 12 --max-time 45 \
            --output "$RUNNER_TEMP/qa-login.json" --write-out '%{http_code}' \
            -H 'Accept: application/json' -H 'Content-Type: application/json' --data "$payload" \
            "${PRODUCTION_BASE_URL%/}/api/platform/api/v1/auth/login")"
          case "$status" in
            200) ;;
            401|403) echo "::error::Tenant B canonical credentials rejected (HTTP $status)"; exit 1 ;;
            409) echo "::error::Tenant B email-only login is ambiguous (HTTP 409)"; exit 1 ;;
            *) echo "::error::Tenant B identity resolution failed (HTTP $status)"; exit 1 ;;
          esac
          tenant_id="$(jq -r '.user.tenantId // .data.user.tenantId // empty' "$RUNNER_TEMP/qa-login.json")"
          [[ "$tenant_id" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Tenant B login returned no valid user.tenantId"; exit 1; }
          echo "::add-mask::$tenant_id"
          echo "PROD_QA_TENANT_ID=$tenant_id" >> "$GITHUB_ENV"

      - name: Wait for exact-main Vercel convergence
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --location --connect-timeout 12 --max-time 45 \
              --output "$RUNNER_TEMP/release.json" --write-out '%{http_code}' \
              "$PRODUCTION_BASE_URL/api/system/release" || true)"
            if [ "$code" = 200 ] && jq -e --arg sha "$EXPECTED_MAIN_SHA" '.commitSha==$sha and (.environment=="production" or .environment=="prod")' "$RUNNER_TEMP/release.json" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 15
          done
          [ "$ready" = true ] || { echo "::error::Vercel production did not converge to exact bootstrap main SHA"; exit 1; }

      - name: Execute governed QA subscription bootstrap
        shell: bash
        run: bash scripts/production/bootstrap-workflow-production-qa-subscription.sh

      - name: Upload sanitized bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-production-qa-subscription-bootstrap-${{ github.run_id }}
          path: workflow-production-qa-subscription-bootstrap.json
          if-no-files-found: warn
          retention-days: 90

      - name: Record bootstrap summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Workflow Production QA Subscription Bootstrap'
            echo "- Exact main: $EXPECTED_MAIN_SHA"
            echo '- Tenant: resolved from canonical Auth Smoke Tenant B email-only login'
            echo '- Existing catalog: STARTER'
            echo '- Subscription mutation: create/provision only when absent'
            echo '- WORKFLOW entitlement: existing catalog + tenant recalculate'
            echo '- Plan/catalog/version mutations: NONE'
            echo '- Direct database writes: NONE'
            echo 'WORKFLOW_QA_SUBSCRIPTION_BOOTSTRAP=PASS'
          } >> "$GITHUB_STEP_SUMMARY"
