name: Production Lifecycle CRM G1 Readonly Dispatcher

on:
  push:
    branches:
      - ops/production-lifecycle-probe-20260909

permissions:
  contents: read
  actions: write

jobs:
  dispatch-crm-g1:
    name: Dispatch canonical CRM G1 Production closure read-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify current main remains exact production SHA
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='b0498962f9a5cc1515b32432fdab98480dedcbe3'
          REMOTE_MAIN_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          test "$REMOTE_MAIN_SHA" = "$EXPECTED" || {
            echo "::error::Current main moved from the production target SHA."
            exit 1
          }

      - name: Dispatch existing Production-environment CRM G1 closure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body='{"ref":"main"}'
          code="$(curl -sS --show-error --max-time 30 -o "$RUNNER_TEMP/crm-g1-dispatch.json" -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            --data "$body" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/crm-g1-production-closure.yml/dispatches")"
          case "$code" in 200|204) ;; *) cat "$RUNNER_TEMP/crm-g1-dispatch.json"; echo "::error::CRM G1 dispatch failed HTTP $code"; exit 1 ;; esac
