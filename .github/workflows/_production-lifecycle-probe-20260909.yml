name: Production Lifecycle Probe Parked

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parked:
    name: Operational probe parked — no production mutation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify probe is parked
        shell: bash
        run: |
          set -euo pipefail
          echo 'PRODUCTION_LIFECYCLE_PROBE=PARKED'
          echo 'No production action is performed by this workflow.'
