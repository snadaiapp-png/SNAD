name: Production Lifecycle Repository Secret Probe

on:
  push:
    branches:
      - ops/production-lifecycle-probe-20260909

permissions:
  contents: read

jobs:
  repository-context:
    name: Verify exact source and secure repository production inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_BASE_URL: https://sanad-backend-mcrj.onrender.com
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SYNTHETIC_INBOX_BASE: ${{ secrets.SANAD_ADMIN_EMAIL }}
      CRM_TENANT_B_EMAIL: ${{ secrets.CRM_TENANT_B_EMAIL || secrets.AUTH_SMOKE_TENANT_B_EMAIL }}
      CRM_TENANT_B_PASSWORD: ${{ secrets.CRM_TENANT_B_PASSWORD || secrets.AUTH_SMOKE_TENANT_B_PASSWORD }}
      CRM_SECOND_TENANT_BEARER_TOKEN: ${{ secrets.CRM_SMOKE_SECOND_TENANT_BEARER_TOKEN }}
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v4
        with:
          ref: b0498962f9a5cc1515b32432fdab98480dedcbe3
          fetch-depth: 1
          submodules: false

      - name: Verify exact source and current main
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='b0498962f9a5cc1515b32432fdab98480dedcbe3'
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          REMOTE_MAIN_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          test "$REMOTE_MAIN_SHA" = "$EXPECTED" || {
            echo "::error::Current main moved from the production target SHA."
            exit 1
          }

      - name: Fail closed on missing secure inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in RESEND_API_KEY SYNTHETIC_INBOX_BASE; do
            test -n "${!name:-}" || {
              echo "::error::$name is not available to the temporary operational workflow."
              exit 1
            }
            echo "::add-mask::${!name}"
          done
          if [ -n "${CRM_TENANT_B_EMAIL:-}" ] && [ -n "${CRM_TENANT_B_PASSWORD:-}" ]; then
            echo "::add-mask::$CRM_TENANT_B_EMAIL"
            echo "::add-mask::$CRM_TENANT_B_PASSWORD"
          elif [ -n "${CRM_SECOND_TENANT_BEARER_TOKEN:-}" ]; then
            echo "::add-mask::$CRM_SECOND_TENANT_BEARER_TOKEN"
          else
            echo "::error::No second authenticated tenant input is available."
            exit 1
          fi
          [[ "$SYNTHETIC_INBOX_BASE" == *@* ]] || {
            echo "::error::SANAD_ADMIN_EMAIL is not a valid mailbox basis."
            exit 1
          }

      - name: Verify backend health and readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            "$PRODUCTION_BASE_URL/actuator/health" > "$RUNNER_TEMP/health.json"
          curl --fail-with-body --silent --show-error --max-time 30 \
            "$PRODUCTION_BASE_URL/actuator/health/readiness" > "$RUNNER_TEMP/readiness.json"
          jq -e '.status == "UP"' "$RUNNER_TEMP/health.json" >/dev/null
          jq -e '.status == "UP"' "$RUNNER_TEMP/readiness.json" >/dev/null

      - name: Verify Resend observation channel is readable
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 20 \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            'https://api.resend.com/emails?limit=1' > "$RUNNER_TEMP/resend-probe.json"
          jq -e 'has("data") and (.data | type == "array")' "$RUNNER_TEMP/resend-probe.json" >/dev/null
