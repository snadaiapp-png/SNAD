name: Migrator/Runtime Separation Certification (P0, Issue #1462)

# ============================================================
# SANAD P0 FINAL REMEDIATION — Article 4 acceptance matrix:
# dedicated `sanad_migrator` migration identity vs restricted
# `sanad` runtime identity, proven with REAL connections on an
# isolated host-native PostgreSQL 17.6 + project-pinned Flyway
# CLI 11.7.2. No production access. No test weakening.
#
# 96 probes: Flyway-as-migrator, runtime DML positives, DDL /
# TRUNCATE / flyway-history / SET ROLE / BYPASSRLS denials,
# Tenant A/B isolation, missing/empty GUC fail-closed, auth
# plane (user creation, refresh/reset tokens, trigger-maintained
# pre-auth index, pre-auth resolver), append-only subscription
# ledger, ownership/ACL/RLS catalog snapshot, S9 runtime
# append-only enforcement (identity + effective/inherited ACL +
# live DML on both append-only ledgers), the S10 7-case
# protected-deployment append-only gate self-test, plus the
# ORDER 11 V20261118_1/V20261118_2 control-plane contract (plain
# runtime denied tenants + access_capabilities lifecycle DML AND
# denied SET ROLE to the control-plane identity; dedicated
# sanad_control_plane CONNECTION lifecycle proven exactly;
# membership absence asserted in every direction; effective ACL
# matrices asserted), followed by the RED TEAM attack-surface
# battery v4 (79 fail-closed probes including the RT-36/RT-37
# dedicated-connection lifecycles, the RT-38 ACL matrix, the
# RT-39 SET ROLE denial and the RT-40 identity-isolation gates).
# ============================================================

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/migrator-runtime-separation.yml'
      - 'tests/security/migrator-separation/**'
      - 'tests/security/g1-c4/**'
      - 'apps/sanad-platform/src/main/resources/db/**'
      - 'scripts/production/verify-append-only-gate.sh'
      - 'docs/security/G1-RELEASE-CATALOG-GATE-2026-11-10.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrator-separation-cert-${{ github.ref }}
  cancel-in-progress: false

jobs:
  separation-certification:
    name: Isolated PG17.6 — sanad_migrator vs sanad acceptance matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install isolated PostgreSQL 17.x (prefer 17.6, record deviation; host-native)
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop postgresql 2>/dev/null || true
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          # Current pool (for dependencies) + superseded-version archive (for the exact 17.6 pin)
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt-archive.postgresql.org/pub/repos/apt noble-pgdg-archive main" \
            | sudo tee /etc/apt/sources.list.d/pgdg-archive.list >/dev/null
          echo "RUNNER_OS_RELEASE=$(cat /etc/os-release | grep VERSION_ID | head -1)"
          sudo apt-get update -qq
          PG_OK=no
          for v in "17.6-1.pgdg24.04+1" "17.6-*"; do
            if sudo apt-get install -y -qq --allow-downgrades "postgresql-17=$v" "postgresql-client-17=$v"; then PG_OK=yes; break; fi
          done
          if [ "$PG_OK" != "yes" ]; then
            echo '::warning::PostgreSQL 17.6 exact package unavailable; testing fallback 17.x, NOT 17.6 certification'
            echo "GATE_NOTE=PG_17_6_UNAVAILABLE_DEVIATION_TO_LATEST_17X_DOCUMENTED" >> "$GITHUB_ENV"
            sudo apt-get install -y -qq postgresql-17 postgresql-client-17
          fi
          sudo pg_dropcluster 16 main --stop 2>/dev/null || true
          sudo pg_dropcluster 17 main --stop 2>/dev/null || true
          sudo pg_createcluster 17 main --start >/dev/null
          sudo pg_lsclusters
          PGV=$(sudo -u postgres psql -Atqc "SHOW server_version;" | grep -oE '^17\.[0-9]+' | head -1)
          echo "POSTGRES_VERSION=$PGV (server)" >> "$GITHUB_ENV"
          test "${PGV%%.*}" = "17" || { echo "::error::UNEXPECTED_POSTGRES_MAJOR=$PGV"; exit 1; }
          if [ "$PGV" != "17.6" ]; then echo "::warning::POSTGRES_17_6_EXACT_PIN_UNVERIFIED_ACTUAL=$PGV"; fi
          echo "TOOLCHAIN: PostgreSQL server $PGV / client $(psql --version | grep -oE '17\.[0-9]+' | head -1) (isolated host-native cluster)"

      - name: Install Flyway CLI 11.7.2 (project-pinned version)
        shell: bash
        run: |
          set -euo pipefail
          fetch_mvn() { # $1=group path $2=filename $3=dest
            for base in "https://maven-central.storage-download.googleapis.com/maven2" "https://repo1.maven.org/maven2"; do
              if curl -fsS -m 600 -o "$3" "$base/$1/$2"; then return 0; fi
            done
            return 1
          }
          fetch_mvn "org/flywaydb/flyway-commandline/11.7.2" "flyway-commandline-11.7.2-linux-x64.tar.gz" /tmp/fw.tgz
          mkdir -p /tmp/flyway && tar -xzf /tmp/fw.tgz -C /tmp/flyway --strip-components=1
          # 11.7.2 CLI bundles lib/flyway/flyway-database-postgresql-11.7.2.jar,
          # drivers/postgresql-42.7.2.jar and a private JRE — no extra downloads.
          test -s /tmp/flyway/lib/flyway/flyway-database-postgresql-11.7.2.jar
          test -s /tmp/flyway/drivers/postgresql-42.7.2.jar
          /tmp/flyway/flyway -v | head -2

      - name: Run separation acceptance matrix
        shell: bash
        env:
          SEP_PGHOST: 127.0.0.1
          SEP_PGPORT: '5432'
          SEP_FLYWAY: /tmp/flyway/flyway
          SEP_ADMIN_PSQL: sudo -u postgres psql
        run: |
          set -euo pipefail
          # Ephemeral per-run migrator password: generated at runtime, masked,
          # never a repository literal (cluster is destroyed with the runner).
          # The certification script provisions roles only after isolated-cluster checks.
          other_dbs="$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d postgres -c "SELECT count(*) FROM pg_database WHERE datistemplate=false AND datname <> 'postgres'")"
          test "$other_dbs" = "0" || { echo "::error::Non-disposable PostgreSQL cluster; refusing role mutation"; exit 1; }
          mig_pw="$(openssl rand -hex 24)"
          echo "::add-mask::$mig_pw"
          # The runtime password is supplied explicitly (instead of being
          # generated inside the certification script) so the red-team battery
          # step can reuse the SAME disposable credential for its read-only
          # isolation proofs before rotating it.
          run_pw="$(openssl rand -hex 24)"
          echo "::add-mask::$run_pw"
          echo "SEP_RUN_PW=$run_pw" >> "$GITHUB_ENV"
          # ORDER 11: per-run ephemeral control-plane connection credential
          # for the dedicated sanad_control_plane LOGIN identity.
          cp_pw="$(openssl rand -hex 24)"
          echo "::add-mask::$cp_pw"
          echo "SEP_CP_PW=$cp_pw" >> "$GITHUB_ENV"
          SEP_ISOLATED_CLUSTER=1 SEP_KEEP_DB=1 SEP_MIG_PW="$mig_pw" SEP_RUN_PW="$run_pw" SEP_CP_PW="$cp_pw" bash tests/security/migrator-separation/run-separation-cert.sh 2>&1 | tee /tmp/separation-run.log

      - name: Capture read-only RLS and SECURITY DEFINER forensic inventory
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # Run only on the disposable separated-topology database from the
          # acceptance matrix. This is an inventory, not production proof.
          if ! sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d separation_cert \
            -f tests/security/rls_forensic_inventory.sql \
            > /tmp/separation-forensic-inventory.log 2>&1; then
            echo "::error::Forensic SQL failed; inspect the complete query error below."
            cat /tmp/separation-forensic-inventory.log
            exit 1
          fi
          test -s /tmp/separation-forensic-inventory.log
          # A non-empty inventory is not proof of an append-only ledger.
          # Assert effective permissions in the same isolated DB as the audit.
          ledger_acl="$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d separation_cert -c "
            SELECT (pg_get_userbyid(c.relowner) <> 'sanad')::text || '|' ||
                   has_table_privilege('sanad',c.oid,'SELECT')::text || '|' ||
                   has_table_privilege('sanad',c.oid,'INSERT')::text || '|' ||
                   has_table_privilege('sanad',c.oid,'UPDATE')::text || '|' ||
                   has_table_privilege('sanad',c.oid,'DELETE')::text || '|' ||
                   has_table_privilege('sanad',c.oid,'TRUNCATE')::text
            FROM pg_class c
            WHERE c.oid=to_regclass('public.subscription_commands');")"
          printf '%s\n' "LEDGER_EFFECTIVE_ACL=$ledger_acl" | tee -a /tmp/separation-forensic-inventory.log
          test "$ledger_acl" = "true|true|true|false|false|false"
          # S9 / V20261115_1: the audit ledger must be append-only as well
          # (SELECT/INSERT allowed; UPDATE/DELETE/TRUNCATE denied for runtime).
          audit_acl="$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d separation_cert -c "
            SELECT (pg_get_userbyid(c.relowner) <> 'sanad')::text || '|' ||
                   has_table_privilege('sanad',c.oid,'SELECT')::text || '|' ||
                   has_table_privilege('sanad',c.oid,'INSERT')::text || '|' ||
                   has_table_privilege('sanad',c.oid,'UPDATE')::text || '|' ||
                   has_table_privilege('sanad',c.oid,'DELETE')::text || '|' ||
                   has_table_privilege('sanad',c.oid,'TRUNCATE')::text
            FROM pg_class c
            WHERE c.oid=to_regclass('public.platform_audit_logs');")"
          printf '%s\n' "AUDIT_LEDGER_EFFECTIVE_ACL=$audit_acl" | tee -a /tmp/separation-forensic-inventory.log
          test "$audit_acl" = "true|true|true|false|false|false"
          echo "FORENSIC_INVENTORY_CAPTURED=PASS (isolated DB only; both append-only ledgers enforced)"

      - name: Verify G1 certificate amendment catalog controls (isolated only)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # All metadata, no secrets/customer data; runs only against disposable PG17.6.
          sudo -u postgres psql -X -t -A -F '|' -v ON_ERROR_STOP=1 \
            -d separation_cert \
            -f docs/security/G1-RELEASE-CATALOG-GATE-2026-11-10.sql \
            | tee /tmp/g1-addendum-catalog-gate.log
          if grep -q '|FAIL|' /tmp/g1-addendum-catalog-gate.log; then
            echo "::error::G1_ADDENDUM_CATALOG_GATE=FAIL (isolated source chain)"
            exit 1
          fi
          count="$(grep -c '|PASS|' /tmp/g1-addendum-catalog-gate.log)"
          test "$count" = "14" || {
            echo "::error::G1_ADDENDUM_CATALOG_GATE_MISSING_CHECKS=$count"
            exit 1
          }
          echo "G1_ADDENDUM_CATALOG_GATE=PASS (14/14 structural catalog, isolated PG17 only)"

      - name: G1 C4 — PostgreSQL 17 SECURITY DEFINER / owner / ACL catalog probes
        if: success()
        shell: bash
        env:
          C4_ISOLATED_CLUSTER: '1'
          C4_DB: separation_cert
          C4_ARTIFACTS: /tmp/c4-catalog-artifacts
        run: |
          set -euo pipefail
          bash tests/security/g1-c4/run-catalog-probes.sh 2>&1 | tee /tmp/c4-probe-run.log

      - name: G1 C4 — effective runtime/service/PUBLIC ACL and RLS-OFF risk inventory
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # Read-only catalog snapshot, only in disposable separated PG17.
          test "$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d separation_cert -c "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname=current_database()")" = 'sanad_migrator'
          test "$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d postgres -c "SELECT count(*) FROM pg_database WHERE datistemplate=false AND datname NOT IN ('postgres','separation_cert')")" = '0'
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 \
            -d separation_cert -f tests/security/g1-c4/c4-effective-privilege-inventory.sql \
            > /tmp/c4-catalog-artifacts/c4-effective-privilege-inventory.log 2>&1 || {
              cat /tmp/c4-catalog-artifacts/c4-effective-privilege-inventory.log
              exit 1
            }
          grep -q 'C4_INVENTORY_SCOPE_ONLY_NOT_SECURITY_PASS' /tmp/c4-catalog-artifacts/c4-effective-privilege-inventory.log
          echo 'C4_EFFECTIVE_PRIVILEGE_INVENTORY=CAPTURED (isolated DB only; full security adjudication remains HOLD)'

      - name: G1 C4 — HR SECURITY DEFINER 20-case runtime tenant-denial matrix
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # The prior job step created and verified an isolated disposable PG17
          # separation_cert DB. Never point this negative matrix at production.
          test "$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d separation_cert -c "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname=current_database()")" = 'sanad_migrator'
          test "$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d postgres -c "SELECT count(*) FROM pg_database WHERE datistemplate=false AND datname NOT IN ('postgres','separation_cert')")" = '0'
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -v VERBOSITY=verbose \
            -d separation_cert \
            -f tests/security/g1-c4/hr-definer-tenant-negative-matrix.sql \
            > /tmp/c4-catalog-artifacts/hr-tenant-negative-matrix.log 2>&1 || {
              cat /tmp/c4-catalog-artifacts/hr-tenant-negative-matrix.log
              exit 1
            }
          grep -q 'C4_HR_NEGATIVE_MATRIX=PASS 20/20' /tmp/c4-catalog-artifacts/hr-tenant-negative-matrix.log
          test "$(grep -c 'C4_HR_NEGATIVE_PASS function=' /tmp/c4-catalog-artifacts/hr-tenant-negative-matrix.log)" -eq 20
          echo 'C4_HR_RUNTIME_TENANT_DENIAL=PASS 20/20 (isolated PostgreSQL)'
          # Raw test transcript is uploaded by the following always() artifact step.

      - name: G1 C4 — HR synthetic authorized-positive scope (2 safe read-only calls)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d separation_cert -c "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname=current_database()")" = 'sanad_migrator'
          test "$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d postgres -c "SELECT count(*) FROM pg_database WHERE datistemplate=false AND datname NOT IN ('postgres','separation_cert')")" = '0'
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -v VERBOSITY=verbose \
            -d separation_cert \
            -f tests/security/g1-c4/hr-definer-positive-synthetic-scope.sql \
            > /tmp/c4-catalog-artifacts/hr-positive-synthetic-scope.log 2>&1 || {
              cat /tmp/c4-catalog-artifacts/hr-positive-synthetic-scope.log
              exit 1
            }
          grep -q 'C4_HR_POSITIVE_SYNTHETIC=PASS 2/2' /tmp/c4-catalog-artifacts/hr-positive-synthetic-scope.log
          echo 'C4_HR_POSITIVE_SYNTHETIC=PASS 2/2 (isolated PostgreSQL; not business-flow acceptance)'

      - name: G1 C4 — external action token rotation trigger regression (7 cases)
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # Only use the disposable separation_cert DB produced by earlier
          # isolated-cluster verification. Never execute against production.
          test "$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d separation_cert -c "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname=current_database()")" = 'sanad_migrator'
          test "$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d postgres -c "SELECT count(*) FROM pg_database WHERE datistemplate=false AND datname NOT IN ('postgres','separation_cert')")" = '0'
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -v VERBOSITY=verbose \
            -d separation_cert \
            -f tests/security/g1-c4/external-token-rotation-regression.sql \
            > /tmp/c4-catalog-artifacts/external-token-rotation-regression.log 2>&1 || {
              cat /tmp/c4-catalog-artifacts/external-token-rotation-regression.log
              exit 1
            }
          grep -q 'C4_TOKEN_ROTATION_REGRESSION=PASS 7/7 isolated' /tmp/c4-catalog-artifacts/external-token-rotation-regression.log
          echo 'C4_TOKEN_ROTATION_REGRESSION=PASS 7/7 (isolated PostgreSQL)'
          # Raw transcript uploaded by the always() evidence step.

      - name: G1 S10 — protected-deployment append-only gate 7-case self-test
        if: success()
        shell: bash
        env:
          S10_PGHOST: 127.0.0.1
          S10_PGPORT: '5432'
          S10_FLYWAY: /tmp/flyway/flyway
          S10_ADMIN_PSQL: sudo -u postgres psql
          S10_ARTIFACTS: /tmp/s10-gate-artifacts
        run: |
          set -euo pipefail
          # Only on the disposable isolated cluster provisioned by the
          # separation matrix above (roles sanad / sanad_migrator already
          # exist from S0). Never point this self-test at production.
          test "$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d postgres -c "SELECT count(*) FROM pg_database WHERE datistemplate=false AND datname NOT IN ('postgres','separation_cert')")" = "0"
          bash tests/security/g1-c4/run-s10-protected-deployment-gate.sh 2>&1 | tee /tmp/s10-run.log
          grep -q 'S10 GATE SELF-TEST: PASSED (7/7 cases)' /tmp/s10-run.log

      # S10 creates seven disposable databases and intentionally retains its evidence.
      # Red Team requires the same isolated cluster to contain ONLY separation_cert.
      # Remove exactly the S10 fixtures after their gate passed; fail closed for
      # unexpected databases or owners rather than weakening the RT precondition.
      - name: Remove certified S10 fixture databases before RED TEAM isolation proof
        shell: bash
        run: |
          set -euo pipefail
          expected=(s10_case_separated s10_case_fixture s10_case_missing s10_case_empty s10_case_unknown s10_case_session_override s10_case_inherited_bypass)
          for db in "${expected[@]}"; do
            owner="$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d postgres -c "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = '$db';")"
            test "$owner" = 'sanad_migrator' || { echo "::error::S10_FIXTURE_OWNER_MISMATCH db=$db owner=$owner"; exit 1; }
          done
          actual="$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d postgres -c "SELECT string_agg(datname, ',' ORDER BY datname) FROM pg_database WHERE datistemplate=false AND datname NOT IN ('postgres','separation_cert')")"
          expected_sorted="$(printf '%s\n' "${expected[@]}" | sort | paste -sd, -)"
          test "$actual" = "$expected_sorted" || { echo "::error::S10_FIXTURE_SET_MISMATCH"; exit 1; }
          for db in "${expected[@]}"; do
            sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d postgres -c "DROP DATABASE \"$db\";"
          done
          remaining="$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d postgres -c "SELECT count(*) FROM pg_database WHERE datistemplate=false AND datname NOT IN ('postgres','separation_cert')")"
          test "$remaining" = '0' || { echo "::error::S10_FIXTURE_CLEANUP_INCOMPLETE"; exit 1; }

      - name: G1 C4 — RED TEAM attack-surface battery (v3, control-plane compensating controls)
        if: success()
        shell: bash
        env:
          RT_PGHOST: 127.0.0.1
          RT_PGPORT: '5432'
          RT_DB: separation_cert
          RT_ISOLATED_CLUSTER: '1'
          RT_ARTIFACTS: /tmp/redteam-artifacts
        run: |
          set -euo pipefail
          # Official CI wiring of the red-team attack-surface confirmation
          # battery (previously maintained as a locally-invoked tool). It runs
          # ONLY on the disposable separated-topology separation_cert database
          # certified above (S0-S10 all green, S4 fixtures present) and NEVER
          # against production. The battery:
          #   - proves admin/runtime connection isolation (IP-01..IP-12),
          #   - asserts the RT-07/08/09 + RT-12/13/14 denials introduced by
          #     V20261118_1/V20261118_2 (control-plane ACL),
          #   - proves the DEDICATED control-plane connection lifecycle
          #     (RT-36/RT-37), the effective ACL matrix (RT-38), the runtime
          #     SET ROLE denial (RT-39) and connection-identity isolation
          #     (RT-40) — the ORDER 11 contract,
          #   - fail-closes on any unexpected outcome, missing SQLSTATE or
          #     skipped probe (exact probe-count assertion).
          test "$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d postgres -c "SELECT count(*) FROM pg_database WHERE datistemplate=false AND datname NOT IN ('postgres','separation_cert')")" = "0"
          test "$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d separation_cert -c "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname=current_database()")" = 'sanad_migrator'
          RT_EXPECTED_SYSID="$(sudo -u postgres psql -X -At -v ON_ERROR_STOP=1 -d postgres -c 'SELECT system_identifier::text FROM pg_control_system()')"
          test -n "$RT_EXPECTED_SYSID"
          # Reuse the disposable runtime credential provisioned by the
          # separation matrix S0 for the read-only isolation proofs; the
          # battery rotates it itself before any attack probe runs.
          test -n "$SEP_RUN_PW"
          echo "::add-mask::$SEP_RUN_PW"
          test -n "$SEP_CP_PW"
          echo "::add-mask::$SEP_CP_PW"
          RT_EXPECTED_SYSID="$RT_EXPECTED_SYSID" RT_BOOTSTRAP_PW="$SEP_RUN_PW" RT_BOOTSTRAP_CP_PW="$SEP_CP_PW" bash tests/security/g1-c4/redteam-attack-surface-battery.sh 2>&1 | tee /tmp/redteam-run.log
          grep -q 'REDTEAM_BATTERY=COMPLETE (all 79 probes executed with exact expected outcomes)' /tmp/redteam-run.log

      - name: Upload separation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migrator-runtime-separation-evidence
          path: |
            /tmp/separation-run.log
            /tmp/separation-forensic-inventory.log
            /tmp/g1-addendum-catalog-gate.log
            /tmp/c4-probe-run.log
            /tmp/s10-run.log
            /tmp/redteam-run.log
            /tmp/c4-catalog-artifacts/
            /tmp/separation-cert-artifacts/
            /tmp/s10-gate-artifacts/
            /tmp/redteam-artifacts/
          if-no-files-found: warn
          retention-days: 30
