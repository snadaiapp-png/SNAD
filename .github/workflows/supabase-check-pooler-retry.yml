name: Supabase Check Pooler + Pause/Resume + Retry Deploy

# Last autonomous attempt:
#   1. Query Supabase API for pooler status on the new project
#   2. Try to enable pooler if disabled
#   3. Pause the project (forces infrastructure deprovisioning)
#   4. Resume the project (forces infrastructure re-provisioning)
#   5. Wait for ACTIVE_HEALTHY again
#   6. Switch Render back to pooler connection
#   7. Trigger deploy + capture live logs
#   8. Verify health

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase project ref"
        required: true
        default: "urnoyiucumkjwhnxxtyc"

permissions:
  contents: read

jobs:
  check-and-retry:
    name: Check pooler + pause/resume + retry deploy
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 40
    steps:
      - name: Check + pause/resume + retry
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          PROJECT_REF: ${{ github.event.inputs.project_ref }}
        run: |
          set +e
          SB_AUTH="Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"
          RENDER_AUTH="Authorization: Bearer: Bearer ${RENDER_API_KEY}"
          RENDER_AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          RENDER_BASE="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"
          BACKEND_URL="https://sanad-backend-mcrj.onrender.com"
          POOLER_HOST="aws-0-eu-central-1.pooler.supabase.com"
          POOLER_URL="jdbc:postgresql://${POOLER_HOST}:5432/postgres?prepareThreshold=0&sslmode=require"
          POOLER_USERNAME="postgres.${PROJECT_REF}"
          SB_BASE="https://api.supabase.com/v1/projects/${PROJECT_REF}"

          echo "========================================"
          echo "CHECK POOLER + PAUSE/RESUME + RETRY"
          echo "========================================"
          echo "Project: $PROJECT_REF"
          echo ""

          # ===== STEP 1: Query project status =====
          echo "=== STEP 1: Query project status ==="
          HTTP=$(curl -s -o /tmp/proj.json -w "%{http_code}" --max-time 30 \
            -H "$SB_AUTH" "$SB_BASE")
          echo "GET /v1/projects/{ref} -> HTTP $HTTP"
          if [ "$HTTP" = "200" ]; then
            echo "Status: $(jq -r '.status // "?"' /tmp/proj.json)"
            echo "Region: $(jq -r '.region // "?"' /tmp/proj.json)"
            echo "Name: $(jq -r '.name // "?"' /tmp/proj.json)"
            echo "DB host: $(jq -r '.db_host // "<none>"' /tmp/proj.json)"
          else
            echo "Response:"
            cat /tmp/proj.json | head -c 500
          fi
          echo ""

          # ===== STEP 2: Try to enable pooler =====
          echo "=== STEP 2: Check/enable pooler ==="
          # Try PATCH /v1/projects/{ref} with pooler settings
          for endpoint in "/pooler" "/pooler/config" "/config/pooler" "/settings/pooler"; do
            HTTP=$(curl -s -o /tmp/pooler.json -w "%{http_code}" --max-time 30 \
              -H "$SB_AUTH" "${SB_BASE}${endpoint}")
            echo "  GET ${endpoint} -> HTTP $HTTP"
            if [ "$HTTP" = "200" ]; then
              echo "  Pooler config:"
              cat /tmp/pooler.json | head -c 500
              echo ""
              break
            fi
          done
          echo ""

          # ===== STEP 3: Pause project =====
          echo "=== STEP 3: Pause project (forces infrastructure reset) ==="
          HTTP=$(curl -s -o /tmp/pause.json -w "%{http_code}" --max-time 60 \
            -X POST -H "$SB_AUTH" "${SB_BASE}/pause")
          echo "POST /pause -> HTTP $HTTP"
          cat /tmp/pause.json | head -c 300
          echo ""
          
          # Wait for pause
          echo "Waiting 60s for pause to take effect..."
          sleep 60
          echo ""

          # ===== STEP 4: Resume project =====
          echo "=== STEP 4: Resume project (forces re-provisioning) ==="
          HTTP=$(curl -s -o /tmp/resume.json -w "%{http_code}" --max-time 60 \
            -X POST -H "$SB_AUTH" "${SB_BASE}/restore")
          echo "POST /restore -> HTTP $HTTP"
          cat /tmp/resume.json | head -c 300
          echo ""

          # ===== STEP 5: Wait for ACTIVE_HEALTHY =====
          echo "=== STEP 5: Wait for ACTIVE_HEALTHY (up to 15 min) ==="
          STATUS=""
          for wait_i in $(seq 1 45); do
            sleep 20
            HTTP=$(curl -s -o /tmp/proj-status.json -w "%{http_code}" --max-time 30 \
              -H "$SB_AUTH" "$SB_BASE")
            if [ "$HTTP" = "200" ]; then
              STATUS=$(jq -r '.status // "unknown"' /tmp/proj-status.json)
              echo "  [iter $wait_i ($((wait_i * 20))s)] status=$STATUS"
              if [ "$STATUS" = "ACTIVE_HEALTHY" ] || [ "$STATUS" = "ACTIVE" ]; then
                echo "  ✅ Project is healthy!"
                break
              fi
            else
              echo "  [iter $wait_i] HTTP $HTTP"
            fi
          done
          echo ""

          # ===== STEP 6: DNS check =====
          echo "=== STEP 6: DNS resolution check ==="
          DIRECT_HOST="db.${PROJECT_REF}.supabase.co"
          DIRECT_RESOLVE=$(getent hosts "$DIRECT_HOST" 2>/dev/null | head -1 || echo "")
          POOLER_RESOLVE=$(getent hosts "$POOLER_HOST" 2>/dev/null | head -1 || echo "")
          echo "Direct host $DIRECT_HOST: ${DIRECT_RESOLVE:-<unresolvable>}"
          echo "Pooler host $POOLER_HOST: ${POOLER_RESOLVE:-<unresolvable>}"
          echo ""

          # ===== STEP 7: Switch Render to pooler + deploy =====
          echo "=== STEP 7: Suspend Render + Update env vars + Resume + Deploy ==="
          
          HTTP=$(curl -s -o /tmp/suspend.json -w "%{http_code}" --max-time 30 -X POST -H "$RENDER_AUTH" "$RENDER_BASE/suspend")
          echo "POST /suspend -> HTTP $HTTP"
          sleep 15
          
          # PUT DATABASE_URL (pooler)
          HTTP=$(curl -s -o /tmp/db-resp.json -w "%{http_code}" --max-time 45 -X PUT \
            -H "$RENDER_AUTH" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data "$(jq -n --arg v "$POOLER_URL" '{value:$v}')" "$RENDER_BASE/env-vars/DATABASE_URL")
          echo "PUT DATABASE_URL -> HTTP $HTTP"
          
          # PUT SPRING_FLYWAY_URL
          HTTP=$(curl -s -o /tmp/sf-resp.json -w "%{http_code}" --max-time 45 -X PUT \
            -H "$RENDER_AUTH" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data "$(jq -n --arg v "$POOLER_URL" '{value:$v}')" "$RENDER_BASE/env-vars/SPRING_FLYWAY_URL")
          echo "PUT SPRING_FLYWAY_URL -> HTTP $HTTP"
          
          # PUT DATABASE_USERNAME (pooler format)
          HTTP=$(curl -s -o /tmp/user-resp.json -w "%{http_code}" --max-time 45 -X PUT \
            -H "$RENDER_AUTH" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data "$(jq -n --arg v "$POOLER_USERNAME" '{value:$v}')" "$RENDER_BASE/env-vars/DATABASE_USERNAME")
          echo "PUT DATABASE_USERNAME -> HTTP $HTTP"
          
          # Resume
          HTTP=$(curl -s -o /tmp/resume2.json -w "%{http_code}" --max-time 30 -X POST -H "$RENDER_AUTH" "$RENDER_BASE/resume")
          echo "POST /resume -> HTTP $HTTP"
          sleep 5
          
          # Trigger deploy
          HTTP=$(curl -s -o /tmp/deploy.json -w "%{http_code}" --max-time 30 -X POST \
            -H "$RENDER_AUTH" -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data '{"clearCache":"do_not_clear"}' "$RENDER_BASE/deploys")
          DEPLOY_ID=$(jq -r '.id // empty' /tmp/deploy.json)
          echo "POST /deploys -> HTTP $HTTP, Deploy ID: $DEPLOY_ID"
          echo ""

          # ===== STEP 8: Capture live logs =====
          echo "=== STEP 8: Capture live logs ==="
          OWNER_ID=$(curl -s --max-time 30 -H "$RENDER_AUTH" "$RENDER_BASE" | jq -r '.ownerId // .owner // empty')
          START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p /tmp/live-logs
          > /tmp/live-logs/all.txt

          DEPLOY_STATUS="update_in_progress"
          ITERATION=0
          MAX_ITERATIONS=80

          while [ "$DEPLOY_STATUS" = "update_in_progress" ] && [ "$ITERATION" -lt "$MAX_ITERATIONS" ]; do
            ITERATION=$((ITERATION + 1))
            sleep 10

            DEPLOY_STATUS=$(curl -s --max-time 15 -H "$RENDER_AUTH" "$RENDER_BASE/deploys/$DEPLOY_ID" | jq -r '.deploy.status // .status // "unknown"')
            echo "[iter $ITERATION] deploy status: $DEPLOY_STATUS"

            if [ -n "$OWNER_ID" ]; then
              URL="https://api.render.com/v1/logs?ownerId=${OWNER_ID}&resource=${RENDER_SERVICE_ID}&startTime=${START_TIME}&direction=forward&limit=200"
              curl -s --max-time 15 -H "$RENDER_AUTH" "$URL" > /tmp/live-logs/page.json
              jq -r 'if type=="array" then .[] elif .logs then .logs[] elif .lines then .lines[] else empty end | (if type=="object" then (.text // .message // .msg // (. | tostring)) else (tostring) end)' /tmp/live-logs/page.json 2>/dev/null >> /tmp/live-logs/all.txt
            fi

            if [ "$DEPLOY_STATUS" = "live" ]; then
              echo "::notice::DEPLOY LIVE after $((ITERATION * 10))s"
              break
            fi
            if echo "$DEPLOY_STATUS" | grep -qiE 'failed|canceled|deactivated'; then
              echo "::error::Deploy terminal: $DEPLOY_STATUS"
              break
            fi
          done
          echo ""

          # ===== STEP 9: Final logs + health =====
          echo "=== STEP 9: FINAL LOG DUMP (last 30 lines) ==="
          tail -30 /tmp/live-logs/all.txt
          echo ""

          echo "=== STEP 10: ERROR PATTERN SEARCH ==="
          echo "ENOIDENTIFIER: $(grep -c 'ENOIDENTIFIER' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "PKIX: $(grep -c 'PKIX\|SunCertPathBuilderException' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "UnknownHostException: $(grep -c 'UnknownHostException' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "password auth failed: $(grep -ci 'password.*failed\|authentication failed' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "BeanCreationException: $(grep -c 'BeanCreationException' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "Application run failed: $(grep -c 'Application run failed' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "Started SanadPlatformApplication: $(grep -c 'Started SanadPlatformApplication' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "Tomcat started: $(grep -c 'Tomcat started on port' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "Flyway: $(grep -c 'Successfully applied\|Schema .* is up to date\|Migrating schema' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo ""

          echo "=== STEP 11: Health probe ==="
          sleep 10
          HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 "$BACKEND_URL/actuator/health" || echo "000")
          HEALTH_STATUS=$(jq -r '.status // "unknown"' /tmp/health.json 2>/dev/null || echo "unknown")
          echo "HEALTH_HTTP: $HTTP_CODE"
          echo "HEALTH_STATUS: $HEALTH_STATUS"
          echo ""

          echo "========================================"
          echo "CHECK + PAUSE/RESUME + RETRY COMPLETE"
          echo "========================================"
          echo "PROJECT_REF=$PROJECT_REF"
          echo "PROJECT_STATUS=$STATUS"
          echo "DEPLOY_ID=$DEPLOY_ID"
          echo "DEPLOY_STATUS=$DEPLOY_STATUS"
          echo "HEALTH_HTTP=$HTTP_CODE"
          echo "HEALTH_STATUS=$HEALTH_STATUS"
          if [ "$DEPLOY_STATUS" = "live" ] && [ "$HTTP_CODE" = "200" ] && [ "$HEALTH_STATUS" = "UP" ]; then
            echo "FINAL_RESULT=SUCCESS ✅✅✅"
          elif [ "$DEPLOY_STATUS" = "live" ]; then
            echo "FINAL_RESULT=PARTIAL (live but health not UP)"
          else
            echo "FINAL_RESULT=FAILED — Supabase infrastructure may need more time"
          fi

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-pooler-logs
          path: /tmp/live-logs/
          if-no-files-found: warn
          retention-days: 30
