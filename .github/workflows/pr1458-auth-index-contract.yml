name: Auth Token Index Owner Separation
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sanad-platform/src/main/resources/db/migration/**'
      - 'tests/security/pr1458_auth_index_acl.sql'
      - '.github/workflows/pr1458-auth-index-contract.yml'
permissions:
  contents: read
jobs:
  postgres-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Isolated PostgreSQL contract (no production credentials)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          echo '${{ github.event.pull_request.head.sha }}' > evidence/source-sha.txt
          sudo systemctl start postgresql
          sudo -u postgres createdb pr1458_auth_contract
          correction=false
          if test -f apps/sanad-platform/src/main/resources/db/migration/V20261101_1__auth_token_index_acl_and_identity.sql; then
            correction=true
          fi
          sudo -u postgres psql -X -d pr1458_auth_contract -v apply_correction="$correction" \
            -f tests/security/pr1458_auth_index_acl.sql 2>&1 | tee evidence/postgres-direct.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-index-owner-separation-${{ github.event.pull_request.head.sha }}
          path: evidence/
