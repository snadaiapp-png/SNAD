name: CRM Deployment Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/sanad-platform/**'
      - 'scripts/ci/secret-scan-allowlist.json'
      - '.github/workflows/crm-deployment-readiness.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-deployment-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-readiness:
    name: CRM Deployment Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Compare runtime dependencies (base vs head)
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha || github.sha }}"
          git show "${BASE_SHA}:apps/web/package.json" > /tmp/base-package.json
          node scripts/ci/compare-runtime-dependencies.mjs /tmp/base-package.json apps/web/package.json

      - name: Governance drift check
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/crm/governance-drift-check.sh

      # CRM-029: Reference Issue #189 (CI-PLATFORM-01) in workflow evidence.
      # This step ensures Issue #189 is traceable from CI to governance docs.
      - name: Issue #189 traceability — CI-PLATFORM-01
        shell: bash
        run: |
          set -euo pipefail
          echo "## Issue #189 — CI-PLATFORM-01" >> "$GITHUB_STEP_SUMMARY"
          echo "Traceability: This workflow references Issue #189 per CRM-029." >> "$GITHUB_STEP_SUMMARY"
          echo "Status: OPEN — Restore GitHub Actions execution" >> "$GITHUB_STEP_SUMMARY"
