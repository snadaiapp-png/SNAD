name: NVD Database Maintenance

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nvd-database-maintenance
  cancel-in-progress: false

jobs:
  contract-validation:
    name: Validate NVD snapshot maintenance contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pytest pyyaml zstandard

      - name: Validate maintenance scripts
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/security/nvd_archive.py \
            scripts/security/nvd_snapshot_store.py \
            scripts/security/publish_nvd_snapshot.py \
            scripts/security/verify_nvd_snapshot.py
          python scripts/security/publish_nvd_snapshot.py --help >/dev/null
          python scripts/security/verify_nvd_snapshot.py --help >/dev/null

      - name: Discover NVD snapshot contract tests
        id: discover
        run: |
          set -euo pipefail
          mapfile -t tests < <(
            find tests/security scripts/security \
              -type f \
              \( -name 'test_*nvd*.py' -o -name 'test_*snapshot*.py' \) \
              -print | sort -u
          )
          if [ "${#tests[@]}" -eq 0 ]; then
            echo 'No NVD snapshot contract tests were found.' >&2
            exit 1
          fi
          printf '%s\n' "${tests[@]}" | tee nvd-contract-tests.txt
          {
            echo 'tests<<EOF'
            printf '%s\n' "${tests[@]}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run NVD snapshot contract tests
        run: |
          set -euo pipefail
          mapfile -t tests <<< "${{ steps.discover.outputs.tests }}"
          pytest -q --maxfail=1 --junitxml=nvd-contract-results.xml "${tests[@]}"

      - name: Validate Dependency-Check integration
        working-directory: apps/sanad-platform
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            -DskipTests \
            -DskipDependencyCheck=true \
            validate

      - name: Upload NVD contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvd-database-maintenance-${{ github.run_id }}
          path: |
            nvd-contract-tests.txt
            nvd-contract-results.xml
          if-no-files-found: warn
          retention-days: 90

      - name: Publish maintenance summary
        if: always()
        run: |
          {
            echo '## NVD Database Maintenance'
            echo ''
            echo "- Exact SHA: \`${{ github.sha }}\`"
            echo "- Contract-test outcome: \`${{ steps.discover.outcome }} / ${{ job.status }}\`"
            echo '- Snapshot archive, manifest, checksum, safe-extraction, freshness and publisher contracts are accepted only when this job succeeds.'
            echo '- Immutable snapshot publication remains fail-closed in the dedicated publisher scripts and storage backend.'
          } >> "$GITHUB_STEP_SUMMARY"
