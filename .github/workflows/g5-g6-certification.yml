name: G5/G6 Flyway Upgrade & Backup-Restore Certification (P0 G1)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Release candidate SHA to certify (frozen candidate = 177e27c...)'
        required: false
        default: '177e27c2648ce5ba02988413981a650d3d7a2a5a'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/g5-g6-certification.yml'
      - 'tests/security/g5/**'
      - 'apps/sanad-platform/src/main/resources/db/**'

permissions:
  contents: read

concurrency:
  group: g5g6-cert-${{ github.event.inputs.release_sha }}
  cancel-in-progress: false

jobs:
  certification:
    name: Isolated PG17.6 + Flyway 11.7.2 — Scenarios A/B/C + Backup/Restore
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_sha || '177e27c2648ce5ba02988413981a650d3d7a2a5a' }}
          fetch-depth: 0

      - name: Assert migration chain identity between candidate and latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin main
          MIG_LOC="apps/sanad-platform/src/main/resources/db/migration"
          VEN_LOC="apps/sanad-platform/src/main/resources/db/vendor/postgresql"
          diff_stat=$(git diff --stat "${{ github.event.inputs.release_sha || '177e27c2648ce5ba02988413981a650d3d7a2a5a' }}" origin/main -- "$MIG_LOC" "$VEN_LOC" || true)
          if [ -n "$diff_stat" ]; then
            echo "::error::MIGRATION_CHAIN_DRIFT between candidate and main: $diff_stat"
            exit 1
          fi
          echo "CHAIN_IDENTITY_OK: candidate == main for both Flyway locations"

      - name: Install isolated PostgreSQL 17.6 (exact pin, host-native, no containers)
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop postgresql 2>/dev/null || true
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          # Current pool (for dependencies) + superseded-version archive (for the exact 17.6 pin)
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt-archive.postgresql.org/pub/repos/apt noble-pgdg-archive main" \
            | sudo tee /etc/apt/sources.list.d/pgdg-archive.list >/dev/null
          sudo apt-get update -qq
          PG_OK=no
          for v in "17.6-1.pgdg24.04+1" "17.6-*"; do
            if sudo apt-get install -y -qq --allow-downgrades "postgresql-17=$v" "postgresql-client-17=$v"; then PG_OK=yes; break; fi
          done
          if [ "$PG_OK" != "yes" ]; then
            echo "GATE_NOTE=PG_17_6_UNAVAILABLE_DEVATION_TO_LATEST_17X_DOCUMENTED" >> "$GITHUB_ENV"
            sudo apt-get install -y -qq postgresql-17 postgresql-client-17
          fi
          sudo pg_dropcluster 16 main --stop 2>/dev/null || true
          sudo pg_dropcluster 17 main --stop 2>/dev/null || true
          sudo pg_createcluster 17 main --start >/dev/null
          sudo pg_lsclusters
          PGV=$(sudo -u postgres psql -Atqc "SHOW server_version;" | grep -oE '^17\.[0-9]+' | head -1)
          echo "POSTGRES_VERSION=$PGV (server)" >> "$GITHUB_ENV"
          echo "TOOLCHAIN: PostgreSQL server $PGV / client $(psql --version | grep -oE '17\.[0-9]+' | head -1) (isolated host-native cluster)"

      - name: Install Flyway CLI 11.7.2 (project-pinned version)
        shell: bash
        run: |
          set -euo pipefail
          df -h /tmp | tail -1
          # Maven Central rate-limits shared egress IPs (observed HTTP 429 / curl 23);
          # Google's official Central mirror first, repo1 as fallback.
          fetch_mvn() { # $1=group path $2=filename $3=dest
            for base in "https://maven-central.storage-download.googleapis.com/maven2" "https://repo1.maven.org/maven2"; do
              for i in 1 2; do
                if curl -fsSL --retry 3 --retry-delay 5 -o "$3" "$base/$1/$2" && test -s "$3"; then return 0; fi
                echo "download $2 from $base attempt $i failed"; sleep 5
              done
            done
            return 1
          }
          fetch_mvn "org/flywaydb/flyway-commandline/11.7.2" "flyway-commandline-11.7.2-linux-x64.tar.gz" /tmp/fw.tgz
          mkdir -p /tmp/flyway && tar -xzf /tmp/fw.tgz -C /tmp/flyway --strip-components=1
          fetch_mvn "org/flywaydb/flyway-database-postgresql/11.7.2" "flyway-database-postgresql-11.7.2.jar" /tmp/flyway/jars/flyway-database-postgresql-11.7.2.jar
          test -s /tmp/flyway/jars/flyway-database-postgresql-11.7.2.jar
          /tmp/flyway/flyway -v | head -2
          echo "FLYWAY_VERSION=$(/tmp/flyway/flyway -v 2>/dev/null | grep -oE 'by Red Gate.*|Flyway [0-9.]+' | head -1)" >> "$GITHUB_ENV" || true

      - name: Run G5/G6 certification engine
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.inputs.release_sha || '177e27c2648ce5ba02988413981a650d3d7a2a5a' }}
        run: |
          set -euo pipefail
          sudo -E bash tests/security/g5/run-cert.sh 2>&1 | tee /tmp/cert-run.log

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-g6-certification-evidence
          path: |
            /tmp/cert-run.log
            /tmp/g5-g6-report.md
            /tmp/g5-artifacts/
          if-no-files-found: warn
          retention-days: 30
