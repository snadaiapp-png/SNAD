name: G5/G6 Flyway Upgrade & Backup-Restore Certification (P0 G1)

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Optional SHA; must equal checkout HEAD if supplied'
        required: false
        default: ''
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/g5-g6-certification.yml'
      - 'tests/security/g5/**'
      - 'apps/sanad-platform/src/main/resources/db/**'

permissions:
  contents: read

concurrency:
  group: g5g6-cert-${{ github.event.inputs.release_sha }}
  cancel-in-progress: false

jobs:
  certification:
    name: Isolated PG17.6 + Flyway 11.7.2 — Scenarios A/B/C + Backup/Restore
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout certification branch (contains candidate tree + cert assets)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert certified migration chain identity against PR base
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin main
          MIG_LOC="apps/sanad-platform/src/main/resources/db/migration"
          VEN_LOC="apps/sanad-platform/src/main/resources/db/vendor/postgresql"
          # New migrations in this PR are intentional. Verify existing files were
          # not modified or deleted; preserve the immutable applied history.
          changed=$(git diff --name-status origin/main HEAD -- "$MIG_LOC" "$VEN_LOC")
          echo "$changed"
          # Versioned (V__) migration immutability remains absolute.
          # A Flyway repeatable (R__) is intentionally re-applied on content
          # checksum change; permit ONLY the reviewed HR repeatable file here,
          # never arbitrary historical edits, deletes, renames or copies.
          if echo "$changed" | grep -E '^(D|R|C)[[:space:]]'; then
            echo "::error::APPLIED_MIGRATION_REMOVED_RENAMED_OR_COPIED"
            exit 1
          fi
          # git --name-status output is separated by whitespace (tab by default).
          # The sole modified-file exception is the explicitly named repeatable.
          while read -r change file; do
            [ -n "$change" ] || continue
            if [ "$change" = "M" ] && [ "$file" != "$MIG_LOC/R__finalize_hr_backfill_closure.sql" ]; then
              echo "::error::APPLIED_VERSIONED_OR_UNAPPROVED_MIGRATION_MODIFIED"
              exit 1
            fi
          done <<< "$changed"
          # Pin to actual test tree; do not certify a historical release SHA.
          echo "CERTIFIED_TREE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CHAIN_ADDITIONS_REVIEWED: versioned migrations immutable; one explicit HR repeatable allowed"

      - name: Install isolated PostgreSQL 17.x (prefer 17.6, record deviation; host-native)
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop postgresql 2>/dev/null || true
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          # Current pool (for dependencies) + superseded-version archive (for the exact 17.6 pin)
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt-archive.postgresql.org/pub/repos/apt noble-pgdg-archive main" \
            | sudo tee /etc/apt/sources.list.d/pgdg-archive.list >/dev/null
          echo "RUNNER_OS_RELEASE=$(cat /etc/os-release | grep VERSION_ID | head -1)"
          sudo apt-get update -qq
          PG_OK=no
          for v in "17.6-1.pgdg24.04+1" "17.6-*"; do
            if sudo apt-get install -y -qq --allow-downgrades "postgresql-17=$v" "postgresql-client-17=$v"; then PG_OK=yes; break; fi
          done
          if [ "$PG_OK" != "yes" ]; then
            echo '::warning::PostgreSQL 17.6 exact package unavailable; testing fallback 17.x, NOT 17.6 certification'
            echo "GATE_NOTE=PG_17_6_UNAVAILABLE_DEVATION_TO_LATEST_17X_DOCUMENTED" >> "$GITHUB_ENV"
            sudo apt-get install -y -qq postgresql-17 postgresql-client-17
          fi
          sudo pg_dropcluster 16 main --stop 2>/dev/null || true
          sudo pg_dropcluster 17 main --stop 2>/dev/null || true
          sudo pg_createcluster 17 main --start >/dev/null
          sudo pg_lsclusters
          PGV=$(sudo -u postgres psql -Atqc "SHOW server_version;" | grep -oE '^17\.[0-9]+' | head -1)
          echo "POSTGRES_VERSION=$PGV (server)" >> "$GITHUB_ENV"
          test "${PGV%%.*}" = "17" || { echo "::error::UNEXPECTED_POSTGRES_MAJOR=$PGV"; exit 1; }
          if [ "$PGV" != "17.6" ]; then echo "::warning::POSTGRES_17_6_EXACT_PIN_UNVERIFIED_ACTUAL=$PGV"; fi
          echo "TOOLCHAIN: PostgreSQL server $PGV / client $(psql --version | grep -oE '17\.[0-9]+' | head -1) (isolated host-native cluster)"

      - name: Install Flyway CLI 11.7.2 (project-pinned version)
        shell: bash
        run: |
          set -euo pipefail
          df -h /tmp | tail -1
          # Maven Central rate-limits shared egress IPs (observed HTTP 429 / curl 23);
          # Google's official Central mirror first, repo1 as fallback.
          fetch_mvn() { # $1=group path $2=filename $3=dest
            for base in "https://maven-central.storage-download.googleapis.com/maven2" "https://repo1.maven.org/maven2"; do
              for i in 1 2; do
                if curl -fsSL --retry 3 --retry-delay 5 -o "$3" "$base/$1/$2" && test -s "$3"; then return 0; fi
                echo "download $2 from $base attempt $i failed"; sleep 5
              done
            done
            return 1
          }
          fetch_mvn "org/flywaydb/flyway-commandline/11.7.2" "flyway-commandline-11.7.2-linux-x64.tar.gz" /tmp/fw.tgz
          mkdir -p /tmp/flyway && tar -xzf /tmp/fw.tgz -C /tmp/flyway --strip-components=1
          # 11.7.2 CLI distribution ALREADY bundles lib/flyway/flyway-database-postgresql-11.7.2.jar,
          # drivers/postgresql-42.7.2.jar, and a private JRE — no extra downloads, no setup-java.
          test -s /tmp/flyway/lib/flyway/flyway-database-postgresql-11.7.2.jar
          test -s /tmp/flyway/drivers/postgresql-42.7.2.jar
          /tmp/flyway/flyway -v | head -2
          echo "FLYWAY_VERSION=$(/tmp/flyway/flyway -v 2>/dev/null | grep -E '^Flyway ' | head -1)" >> "$GITHUB_ENV" || true

      - name: Run G5/G6 certification engine
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sudo -E bash tests/security/g5/run-cert.sh 2>&1 | tee /tmp/cert-run.log

      - name: Upload certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-g6-certification-evidence
          path: |
            /tmp/cert-run.log
            /tmp/g5-g6-report.md
            /tmp/g5-artifacts/
          if-no-files-found: warn
          retention-days: 30
\t' read -r change file; do
            [ -n "$change" ] || continue
            if [ "$change" = "M" ] && [ "$file" != "$MIG_LOC/R__finalize_hr_backfill_closure.sql" ]; then
              echo "::error::APPLIED_VERSIONED_OR_UNAPPROVED_MIGRATION_MODIFIED: $file"
              exit 1
            fi
          done <<< "$changed"
          # Pin to actual test tree; do not certify a historical release SHA.
          echo "CERTIFIED_TREE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CHAIN_ADDITIONS_REVIEWED: new migrations allowed; existing migration changes rejected"

      - name: Install isolated PostgreSQL 17.x (prefer 17.6, record deviation; host-native)
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop postgresql 2>/dev/null || true
          sudo install -d /usr/share/postgresql-common/pgdg
