name: Auth Tenant Production Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-branch-access-probe:
    name: Production environment access from operational branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - name: Fail closed on required lifecycle inputs
        shell: bash
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SANAD_ADMIN_EMAIL: ${{ secrets.SANAD_ADMIN_EMAIL }}
          AUTH_SMOKE_TENANT_B_ID: ${{ secrets.AUTH_SMOKE_TENANT_B_ID }}
          AUTH_SMOKE_TENANT_B_EMAIL: ${{ secrets.AUTH_SMOKE_TENANT_B_EMAIL }}
          AUTH_SMOKE_TENANT_B_PASSWORD: ${{ secrets.AUTH_SMOKE_TENANT_B_PASSWORD }}
        run: |
          set -euo pipefail
          for name in PRODUCTION_BASE_URL RESEND_API_KEY SANAD_ADMIN_EMAIL AUTH_SMOKE_TENANT_B_ID AUTH_SMOKE_TENANT_B_EMAIL AUTH_SMOKE_TENANT_B_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing protected Production value: $name"
              exit 1
            fi
            echo "::add-mask::${!name}"
            echo "PRESENT: $name"
          done
          test "${PRODUCTION_BASE_URL%/}" = 'https://sanad-backend-mcrj.onrender.com' || {
            echo "::error::Unexpected production backend target"
            exit 1
          }
          echo 'PRODUCTION_BRANCH_ACCESS=PASS'
