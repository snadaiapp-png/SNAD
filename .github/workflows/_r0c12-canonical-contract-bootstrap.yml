name: R0C12 Canonical Contract Object Probe

"on": push

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r0c12-canonical-human-uat-contract
          fetch-depth: 0
      - name: Reproduce patched object identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/r0c12-canonical-contract-patch.py
          echo "PATCHED_CI_BLOB=$(git hash-object .github/workflows/ci.yml)"
          git diff --check
