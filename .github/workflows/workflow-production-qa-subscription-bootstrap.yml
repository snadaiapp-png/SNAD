name: Workflow Production QA Subscription Bootstrap

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main SHA authorized for the bootstrap
        required: true
        type: string
      confirm:
        description: Type bootstrap-workflow-production-qa
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workflow-production-qa-subscription-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap governed Workflow QA subscription
    if: github.event.inputs.confirm == 'bootstrap-workflow-production-qa'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      PRODUCTION_BASE_URL: ${{ vars.WEB_PRODUCTION_BASE_URL || 'https://snad-app.vercel.app' }}
      PROD_ADMIN_EMAIL: ${{ secrets.SANAD_ADMIN_EMAIL }}
      PROD_ADMIN_PASSWORD: ${{ secrets.SANAD_ADMIN_PASSWORD }}
      PROD_QA_TENANT_ID: ${{ secrets.AUTH_SMOKE_TENANT_B_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      BOOTSTRAP_EVIDENCE_FILE: workflow-production-qa-subscription-bootstrap.json

    steps:
      - name: Validate protected bootstrap inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::expected_main_sha must be a 40-char SHA'; exit 1; }
          [ "${{ github.event.inputs.confirm }}" = 'bootstrap-workflow-production-qa' ] || { echo '::error::Invalid confirmation phrase'; exit 1; }
          for name in PRODUCTION_BASE_URL PROD_ADMIN_EMAIL PROD_ADMIN_PASSWORD PROD_QA_TENANT_ID RENDER_API_KEY RENDER_SERVICE_ID; do
            test -n "${!name:-}" || { echo "::error::$name is required"; exit 1; }
          done

      - name: Verify exact current main
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          [ "$current" = "$EXPECTED_MAIN_SHA" ] || {
            echo "::error::MAIN_DRIFT expected=$EXPECTED_MAIN_SHA actual=$current"
            exit 1
          }

      - name: Checkout exact authorized main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_main_sha }}
          fetch-depth: 0

      - name: Verify bootstrap contract
        shell: bash
        run: python3 scripts/production/tests/test_workflow_production_3user_final_gate.py

      - name: Resolve production control-plane tenant
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 45             -H "Authorization: Bearer ${RENDER_API_KEY}" -H 'Accept: application/json'             "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars?limit=100" > "$RUNNER_TEMP/render-env.json"
          test "$(jq 'length' "$RUNNER_TEMP/render-env.json")" -lt 100 || { echo '::error::Cannot prove complete Render env pagination'; exit 1; }
          tenant_id="$(jq -r '[.[]? | (.envVar // .) | select(.key=="SANAD_CONTROL_PLANE_TENANT_ID")][0].value // empty' "$RUNNER_TEMP/render-env.json")"
          [[ "$tenant_id" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo '::error::SANAD_CONTROL_PLANE_TENANT_ID missing or invalid'; exit 1; }
          echo "::add-mask::$tenant_id"
          echo "PROD_TENANT_ID=$tenant_id" >> "$GITHUB_ENV"

      - name: Execute governed QA subscription bootstrap
        shell: bash
        run: bash scripts/production/bootstrap-workflow-production-qa-subscription.sh

      - name: Upload sanitized bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-production-qa-subscription-bootstrap-${{ github.run_id }}
          path: workflow-production-qa-subscription-bootstrap.json
          if-no-files-found: warn
          retention-days: 90

      - name: Record bootstrap summary
        if: success()
        shell: bash
        run: |
          {
            echo '## Workflow Production QA Subscription Bootstrap'
            echo "- Exact main: $EXPECTED_MAIN_SHA"
            echo '- Dedicated QA tenant: Auth Smoke Tenant B'
            echo '- Catalog: existing STARTER only'
            echo '- Creation path: non-zero trial only'
            echo '- Activation path: canonical /provision'
            echo '- WORKFLOW entitlement: recalculated and ACTIVE'
            echo '- Plan/catalog mutations: NONE'
            echo '- Direct database writes: NONE'
            echo '- Paid invoice path: NOT USED'
          } >> "$GITHUB_STEP_SUMMARY"
