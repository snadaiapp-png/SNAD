name: Render DB State Snapshot (read-only, comprehensive)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: flyway_schema_history + locks + sessions + G7 tables (one consistent read)
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 8
    steps:
      - name: Comprehensive read-only snapshot
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          BASE="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"
          DB_URL="$(curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/env-vars/DATABASE_URL" | jq -r '(.envVar // .).value // empty')"
          DB_USER="$(curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/env-vars/DATABASE_USERNAME" | jq -r '(.envVar // .).value // empty')"
          DB_PASS="$(curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/env-vars/DATABASE_PASSWORD" | jq -r '(.envVar // .).value // empty')"
          echo "::add-mask::$DB_URL"; echo "::add-mask::$DB_USER"; echo "::add-mask::$DB_PASS"
          PSQL_URL="postgresql://${DB_URL#jdbc:postgresql://}"
          PSQL_URL="postgresql://${PSQL_URL#postgresql://}"
          export PGPASSWORD="$DB_PASS"
          q() { psql "$PSQL_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -c "$1" 2>&1 || true; }

          echo "=== 1) flyway_schema_history: ALL rows ==="
          q "SELECT installed_rank, version, description, type, success, installed_on::timestamptz(0) AS installed_on FROM public.flyway_schema_history ORDER BY installed_rank;"

          echo ""
          echo "=== 2) current advisory locks + holder pid/state ==="
          q "SELECT l.pid, l.granted, a.state, a.application_name, age(now(), a.state_change) AS since_change FROM pg_locks l LEFT JOIN pg_stat_activity a ON a.pid=l.pid WHERE l.locktype='advisory';"

          echo ""
          echo "=== 3) idle-in-transaction JDBC sessions (stuck txns, incl destructive) ==="
          q "SELECT pid, state, age(now(), state_change) AS since_change, left(query,90) AS query FROM pg_stat_activity WHERE application_name='PostgreSQL JDBC Driver' AND (state='idle in transaction' OR state='active') ORDER BY backend_start;"

          echo ""
          echo "=== 4) public table count + G7 table existence ==="
          q "SELECT count(*) AS public_tables FROM information_schema.tables WHERE table_schema='public';"
          q "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('mobile_device_registry','mobile_sync_cursor','mobile_sync_log','mobile_conflict_log','crm_assignment_rules','crm_contacts') ORDER BY table_name;"
