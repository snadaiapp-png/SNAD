name: HRM G4 T1 RED PostgreSQL Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/hr/payroll/HrG4PayrollSnapshotPostgresTest.java'
      - 'apps/sanad-platform/src/main/resources/db/migration/**'
      - 'apps/sanad-platform/src/main/resources/db/vendor/postgresql/**'
      - 'apps/sanad-platform/pom.xml'
      - '.github/workflows/hrm-g4-t1-red-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/hr/payroll/HrG4PayrollSnapshotPostgresTest.java'
      - 'apps/sanad-platform/src/main/resources/db/migration/**'
      - 'apps/sanad-platform/src/main/resources/db/vendor/postgresql/**'
      - 'apps/sanad-platform/pom.xml'
      - '.github/workflows/hrm-g4-t1-red-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hrm-g4-t1-red-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payroll-snapshot-contract:
    name: G4 payroll snapshot PostgreSQL Direct
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad_g4_payroll?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: sanad_g4_payroll

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "candidate_sha=$CANDIDATE_SHA"

      - name: Generate ephemeral PostgreSQL credential
        shell: bash
        run: |
          set -euo pipefail
          DB_CRED="$(openssl rand -hex 24)"
          echo "::add-mask::$DB_CRED"
          echo "SPRING_DATASOURCE_PASSWORD=$DB_CRED" >> "$GITHUB_ENV"
          echo "PGPASSWORD=$DB_CRED" >> "$GITHUB_ENV"

      - name: Start host-native PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null
          command -v pg_isready >/dev/null
          sudo systemctl start postgresql
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1 && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432
          psql --version

      - name: Provision least-privilege PostgreSQL Direct role
        shell: bash
        env:
          DB_CRED: ${{ env.SPRING_DATASOURCE_PASSWORD }}
        run: |
          set -euo pipefail
          sudo -u postgres psql -v ON_ERROR_STOP=1 -v db_credential="$DB_CRED" <<'SQL'
          SELECT format('CREATE ROLE sanad_g4_payroll WITH LOGIN PASSWORD %L', :'db_credential')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad_g4_payroll')
          \gexec

          ALTER ROLE sanad_g4_payroll
            NOSUPERUSER
            NOCREATEDB
            NOCREATEROLE
            NOBYPASSRLS;

          SELECT 'CREATE DATABASE sanad_g4_payroll OWNER sanad_g4_payroll'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'sanad_g4_payroll')
          \gexec

          SELECT 'CREATE DATABASE test_migration OWNER sanad_g4_payroll'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'test_migration')
          \gexec

          ALTER DATABASE sanad_g4_payroll OWNER TO sanad_g4_payroll;
          ALTER DATABASE test_migration OWNER TO sanad_g4_payroll;
          SQL

          PGPASSWORD="$DB_CRED" psql -h 127.0.0.1 -U sanad_g4_payroll -d sanad_g4_payroll -v ON_ERROR_STOP=1 \
            -Atc "SELECT current_database() || '|' || current_user"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run G4 T1 RED contract
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            -Dtest=HrG4PayrollSnapshotPostgresTest \
            -DfailIfNoTests=true \
            test

      - name: Run complete HR RLS catalog gate
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            -Dtest=HrRlsFailClosedIntegrationTest \
            -DfailIfNoTests=true \
            test

      - name: Assert RED test actually executed
        if: always()
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -euo pipefail
          REPORT=target/surefire-reports/TEST-com.sanad.platform.hr.payroll.HrG4PayrollSnapshotPostgresTest.xml
          test -f "$REPORT" || { echo "::error::Missing Surefire report for HrG4PayrollSnapshotPostgresTest"; exit 1; }
          python3 - "$REPORT" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          path = sys.argv[1]
          root = ET.parse(path).getroot()
          tests = int(root.attrib.get('tests', '0'))
          failures = int(root.attrib.get('failures', '0'))
          errors = int(root.attrib.get('errors', '0'))
          skipped = int(root.attrib.get('skipped', '0'))
          print(f"tests={tests} failures={failures} errors={errors} skipped={skipped}")
          if tests < 1 or skipped != 0:
              raise SystemExit(1)
          PY
