name: G1 sanad Credential Rotation (DBA-authorized)

# DBA-authorized password rotation for the LEAST-PRIVILEGE role `sanad` ONLY
# (Supabase project tkbrvupemreqabwzdpyq). Issued 2026-10-11 as
# "Conditional DBA Authorization — APPROVED WITH CONDITIONS".
#
# Safety rails (fail-closed, enforced by scripts/security/g1_rotate_sanad.py):
#  1. Verifies role `sanad` exists with LOGIN and WITHOUT rolsuper/rolbypassrls
#     before any change; aborts otherwise.
#  2. Live-session impact probe (3 samples); aborts if `sanad` is in active use.
#  3. Proves ALTER privilege with a dry-run ALTER inside an explicitly
#     ROLLED BACK transaction; no privilege bypass attempted.
#  4. Rotates ONLY role `sanad`, to the value pre-staged in the dedicated
#     G1_DATASOURCE_PASSWORD environment secret (256-bit CSPRNG, staged
#     out-of-band). Shared backend secrets and other roles are untouched.
#  5. Secret values never pass through shell variables, argv, or logs; they
#     are masked and consumed inside the single Python step.
#  6. Verifies end-to-end by authenticating through the staged
#     G1_DATASOURCE_URL/USERNAME and asserting current_user='sanad',
#     rolsuper=false, rolbypassrls=false.
#
# Requires explicit typed confirmation and a main-ref dispatch.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "ROTATE_SANAD_PASSWORD" to confirm the DBA-authorized rotation'
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'scripts/security/g1_rotate_sanad.py'
      - '.github/workflows/g1-sanad-credential-rotation.yml'

permissions:
  contents: read

concurrency:
  group: g1-sanad-credential-rotation
  cancel-in-progress: false

jobs:
  pr-static-validation:
    name: Rotation PR static validation (no production secrets)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Python syntax validation
        run: python -m py_compile scripts/security/g1_rotate_sanad.py

  rotate-sanad:
    name: Verify preconditions, rotate role sanad, verify end-to-end
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.confirmation == 'ROTATE_SANAD_PASSWORD'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      G1_CONFIRMATION: ${{ github.event.inputs.confirmation }}
      PRODUCTION_DATABASE_PASSWORD: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRODUCTION_DATABASE_JDBC_URL: ${{ secrets.PRODUCTION_DATABASE_JDBC_URL }}
      SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      G1_DATASOURCE_URL: ${{ secrets.G1_DATASOURCE_URL }}
      G1_DATASOURCE_USERNAME: ${{ secrets.G1_DATASOURCE_USERNAME }}
      G1_DATASOURCE_PASSWORD: ${{ secrets.G1_DATASOURCE_PASSWORD }}
    steps:
      - name: Checkout exact main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact checkout and mask every secret defensively
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_main="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$GITHUB_SHA" || { echo "::error::Rotation requires exact current main"; exit 1; }
          for key in PRODUCTION_DATABASE_PASSWORD PRODUCTION_DATABASE_URL \
                     PRODUCTION_DATABASE_JDBC_URL SPRING_DATASOURCE_URL \
                     SPRING_DATASOURCE_PASSWORD G1_DATASOURCE_URL \
                     G1_DATASOURCE_USERNAME G1_DATASOURCE_PASSWORD; do
            value="${!key:-}"
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done
          test -n "${G1_DATASOURCE_PASSWORD:-}" || { echo "::error::Missing staged rotation target: G1_DATASOURCE_PASSWORD"; exit 1; }
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PostgreSQL driver
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10'
      - name: Rotate role sanad (fail-closed precondition chain)
        shell: bash
        run: python scripts/security/g1_rotate_sanad.py
      - name: Upload sanitized rotation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-sanad-rotation-${{ github.run_id }}-${{ github.run_attempt }}
          path: g1-sanad-rotation-evidence.json
          if-no-files-found: warn
