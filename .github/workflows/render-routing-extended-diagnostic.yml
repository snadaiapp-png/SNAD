name: Render Routing Extended Diagnostic (read-only)

# Extended read-only diagnostic per user Phase 3 + Phase 4 requirements.
# Adds the missing env vars (SPRING_DATASOURCE_USERNAME, SPRING_FLYWAY_USER,
# SPRING_FLYWAY_URL, SPRING_FLYWAY_PASSWORD) and fetches runtime logs to
# extract the ENOIDENTIFIER stack trace and identify the first caller
# above pgJDBC (Flyway / Hikari / Hibernate / Other).
#
# IMPORTANT:
# - 100% READ-ONLY. NO POST/PUT/PATCH/DELETE to Render.
# - Username values ARE printed (per user spec: "username is not a password").
# - Password values are NEVER printed (only length).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Extended Render routing diagnostic (read-only)
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 8
    steps:
      - name: Query Render service + env vars + logs (read-only)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          BASE="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"

          echo "========================================"
          echo "PHASE 2 — EFFECTIVE USERNAME AUDIT"
          echo "========================================"
          echo ""
          echo "Expected Supavisor routing username:"
          echo "  postgres.hxhvfqxzigrqoxxnnzje"
          echo ""

          # ----- Helper: print URL parsed (host/port/db/user-embedded) -----
          print_url_parsed() {
            local key="$1"
            local val="$2"
            if [ -z "$val" ]; then
              echo "$key = MISSING"
              return
            fi
            # Strip jdbc: prefix if present
            local stripped="${val#jdbc:}"
            # Extract host, port, db, user
            # Format: postgresql://[user[:pass]@]host[:port][/db][?params]
            local host_port_db
            host_port_db=$(echo "$stripped" | sed -E 's#^[a-z]+://##' | sed -E 's#\?.*$##')
            local user_part=""
            if echo "$host_port_db" | grep -q '@'; then
              user_part=$(echo "$host_port_db" | sed -E 's#@.*$##')
              host_port_db=$(echo "$host_port_db" | sed -E 's#^[^@]*@##')
            fi
            local host port db
            host=$(echo "$host_port_db" | sed -E 's#[:/].*$##')
            port=$(echo "$host_port_db" | sed -E 's#^[^:/]+:##' | sed -E 's#/.*$##')
            db=$(echo "$host_port_db" | sed -E 's#^[^/]*(/)?##')
            # Mask password if present in user_part
            local user_display=""
            if [ -n "$user_part" ]; then
              user_display=$(echo "$user_part" | sed -E 's#^[^:]+:.*$#\1***#')
            fi
            echo "$key = PRESENT"
            echo "  raw      = $val"
            echo "  host     = $host"
            echo "  port     = $port"
            echo "  database = $db"
            if [ -n "$user_display" ]; then
              echo "  username embedded = YES ($user_display)"
            else
              echo "  username embedded = NO"
            fi
          }

          # ----- Helper: print username value (not a password) -----
          print_username_value() {
            local key="$1"
            local val="$2"
            if [ -z "$val" ]; then
              echo "$key = MISSING (so DATABASE_USERNAME is inherited)"
            else
              echo "$key = PRESENT"
              echo "  value         = $val"
              echo "  length        = ${#val}"
              if [ "$val" = "postgres.hxhvfqxzigrqoxxnnzje" ]; then
                echo "  matches_expected = YES"
              else
                echo "  matches_expected = NO"
              fi
            fi
          }

          # ----- Helper: print password (length only) -----
          print_password_length() {
            local key="$1"
            local val="$2"
            if [ -z "$val" ]; then
              echo "$key = MISSING"
            else
              echo "$key = PRESENT (length=${#val} — value REDACTED)"
            fi
          }

          # ----- Fetch each required env var -----
          fetch_env_var() {
            local key="$1"
            local resp
            resp=$(curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/env-vars/$key" || true)
            echo "$resp" | jq -r '(.envVar // .).value // empty' 2>/dev/null || true
          }

          # URLs
          echo "=== URL Variables (parsed: host/port/db/username-embedded) ==="
          for kv in "DATABASE_URL" "SPRING_DATASOURCE_URL" "SPRING_FLYWAY_URL"; do
            val=$(fetch_env_var "$kv")
            print_url_parsed "$kv" "$val"
            echo ""
          done

          # Usernames (print actual value — not passwords)
          echo "=== Username Variables (actual values per user spec) ==="
          for kv in "DATABASE_USERNAME" "SPRING_DATASOURCE_USERNAME" "SPRING_FLYWAY_USER"; do
            val=$(fetch_env_var "$kv")
            print_username_value "$kv" "$val"
            echo ""
          done

          # Passwords (length only)
          echo "=== Password Variables (length only — never printed) ==="
          for kv in "DATABASE_PASSWORD" "SPRING_DATASOURCE_PASSWORD" "SPRING_FLYWAY_PASSWORD"; do
            val=$(fetch_env_var "$kv")
            print_password_length "$kv" "$val"
          done

          # Misc
          echo ""
          echo "=== Other Relevant Variables ==="
          for kv in "FLYWAY_ENABLED" "JPA_DDL_AUTO" "SPRING_PROFILES_ACTIVE" "SERVER_PORT" "SPRING_FLYWAY_ENABLED" "SPRING_FLYWAY_LOCATIONS" "SANAD_PRODUCTION_GUARD_ENABLED" "SKIP_SECURITY_GUARD"; do
            val=$(fetch_env_var "$kv")
            if [ -z "$val" ]; then
              echo "$kv = MISSING"
            else
              echo "$kv = $val"
            fi
          done

          # ----- EFFECTIVE resolution per application-prod.yml -----
          echo ""
          echo "========================================"
          echo "EFFECTIVE RESOLUTION (per application-prod.yml)"
          echo "========================================"
          echo ""
          echo "application-prod.yml precedence:"
          echo "  spring.datasource.url      = \${SPRING_DATASOURCE_URL:\${DATABASE_URL:}}"
          echo "  spring.datasource.username = \${SPRING_DATASOURCE_USERNAME:\${DATABASE_USERNAME:}}"
          echo "  spring.datasource.password = \${SPRING_DATASOURCE_PASSWORD:\${DATABASE_PASSWORD:}}"
          echo "  spring.flyway.*            = inherits from spring.datasource.* (no override)"
          echo ""

          DB_USER_VAL=$(fetch_env_var "DATABASE_USERNAME")
          SD_USER_VAL=$(fetch_env_var "SPRING_DATASOURCE_USERNAME")
          SF_USER_VAL=$(fetch_env_var "SPRING_FLYWAY_USER")
          DB_URL_VAL=$(fetch_env_var "DATABASE_URL")
          SD_URL_VAL=$(fetch_env_var "SPRING_DATASOURCE_URL")

          # Resolve effective username
          if [ -n "$SD_USER_VAL" ]; then
            EFF_USER="$SD_USER_VAL"
            EFF_USER_SOURCE="SPRING_DATASOURCE_USERNAME (overrides DATABASE_USERNAME)"
          elif [ -n "$DB_USER_VAL" ]; then
            EFF_USER="$DB_USER_VAL"
            EFF_USER_SOURCE="DATABASE_USERNAME"
          else
            EFF_USER=""
            EFF_USER_SOURCE="<neither set — empty default>"
          fi

          # Resolve effective URL
          if [ -n "$SD_URL_VAL" ]; then
            EFF_URL="$SD_URL_VAL"
            EFF_URL_SOURCE="SPRING_DATASOURCE_URL"
          elif [ -n "$DB_URL_VAL" ]; then
            EFF_URL="$DB_URL_VAL"
            EFF_URL_SOURCE="DATABASE_URL"
          else
            EFF_URL=""
            EFF_URL_SOURCE="<neither set>"
          fi

          echo "EFFECTIVE_DATASOURCE_USERNAME = $EFF_USER"
          echo "EFFECTIVE_USERNAME_SOURCE     = $EFF_USER_SOURCE"
          echo "EFFECTIVE_DATASOURCE_URL      = $EFF_URL"
          echo "EFFECTIVE_URL_SOURCE          = $EFF_URL_SOURCE"
          echo ""
          if [ -n "$SF_USER_VAL" ]; then
            echo "NOTE: SPRING_FLYWAY_USER is set; Flyway uses it INSTEAD of spring.datasource.username."
            echo "      This could cause Flyway to use a different identity than Hikari/Hibernate."
          else
            echo "NOTE: SPRING_FLYWAY_USER is MISSING; Flyway inherits spring.datasource.username."
          fi

          # ----- PROJECT REF presence check -----
          echo ""
          echo "========================================"
          echo "PROJECT REF IN USERNAME CHECK"
          echo "========================================"
          if echo "$EFF_USER" | grep -q "hxhvfqxzigrqoxxnnzje"; then
            echo "PROJECT_REF_IN_EFFECTIVE_USERNAME = YES"
          else
            echo "PROJECT_REF_IN_EFFECTIVE_USERNAME = NO — ROOT CAUSE CONFIRMED"
          fi
          if [ -n "$SF_USER_VAL" ] && echo "$SF_USER_VAL" | grep -q "hxhvfqxzigrqoxxnnzje"; then
            echo "PROJECT_REF_IN_FLYWAY_USERNAME    = YES"
          elif [ -n "$SF_USER_VAL" ]; then
            echo "PROJECT_REF_IN_FLYWAY_USERNAME    = NO — Flyway override missing project ref"
          else
            echo "PROJECT_REF_IN_FLYWAY_USERNAME    = N/A (Flyway inherits datasource)"
          fi

          # ----- Phase 4: runtime logs -----
          echo ""
          echo "========================================"
          echo "PHASE 4 — RENDER RUNTIME LOGS (READ-ONLY)"
          echo "========================================"
          echo ""
          echo "Fetching last 500 log lines..."
          LOGS=$(curl -s --max-time 30 -H "$AUTH" "$BASE/logs?limit=500" || true)
          if [ -z "$LOGS" ]; then
            echo "WARN: /logs endpoint returned empty. Render may not expose logs via API."
            echo "      Trying alternative endpoints..."
            # Try the events endpoint
            LOGS=$(curl -s --max-time 30 -H "$AUTH" "$BASE/events?limit=50" || true)
            if [ -n "$LOGS" ]; then
              echo "Events endpoint returned data (showing first 50 events):"
              echo "$LOGS" | jq -r '.[]? | "\(.createdAt // .timestamp // "?") [\(.type // .level // "?")] \(.message // .data // .summary // "" // "")"' 2>/dev/null | head -50 || echo "$LOGS" | head -50
            else
              echo "Events endpoint also empty."
            fi
          else
            echo "Logs fetched. Searching for ENOIDENTIFIER..."
            echo ""
            echo "=== ENOIDENTIFIER matches ==="
            echo "$LOGS" | grep -n "ENOIDENTIFIER" || echo "(no ENOIDENTIFIER in fetched logs)"
            echo ""
            echo "=== Stack trace context (50 lines around first ENOIDENTIFIER) ==="
            LINE_NUM=$(echo "$LOGS" | grep -n "ENOIDENTIFIER" | head -1 | cut -d: -f1)
            if [ -n "$LINE_NUM" ]; then
              START=$((LINE_NUM > 30 ? LINE_NUM - 30 : 1))
              END=$((LINE_NUM + 20))
              echo "$LOGS" | sed -n "${START},${END}p" || echo "(could not extract)"
            else
              echo "(no ENOIDENTIFIER found — cannot extract stack trace)"
            fi
            echo ""
            echo "=== Looking for first caller above pgJDBC ==="
            echo "$LOGS" | grep -E "FlywayMigrationInitializer|HikariPool|HikariDataSource|DataSourceUtils|JdbcTemplate|EntityManagerFactory|LocalContainerEntityManagerFactoryBean|^.*Flyway\.| org\.flyway| org\.postgresql| hibernate" | head -30 || echo "(no caller found)"
          fi

          # ----- Phase 1 output summary -----
          echo ""
          echo "========================================"
          echo "PHASE 1 OUTPUT"
          echo "========================================"
          if [ -n "$SF_USER_VAL" ] && [ -z "$SF_USER_VAL_HAS_REF" ]; then
            ENOIDENTIFIER_ORIGIN="FLYWAY (SPRING_FLYWAY_USER override does not contain project ref)"
          elif [ -n "$SD_USER_VAL" ] && [ "$SD_USER_VAL" != "postgres.hxhvfqxzigrqoxxnnzje" ]; then
            ENOIDENTIFIER_ORIGIN="HIKARI (SPRING_DATASOURCE_USERNAME override does not contain project ref)"
          elif [ -z "$EFF_USER" ]; then
            ENOIDENTIFIER_ORIGIN="HIKARI (empty effective username)"
          else
            ENOIDENTIFIER_ORIGIN="UNKNOWN — check stack trace above"
          fi
          echo "ENOIDENTIFIER_ORIGIN=$ENOIDENTIFIER_ORIGIN"
          echo "FIRST_CALLER_ABOVE_PGJDBC=<see stack trace above>"

          echo ""
          echo "========================================"
          echo "DIAGNOSTIC COMPLETE"
          echo "========================================"
