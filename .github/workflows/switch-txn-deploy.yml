name: Switch to Txn Mode + Deploy + Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "switch" to confirm'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    if: github.event.inputs.confirm == 'switch'
    steps:
      - name: Set env vars with transaction-mode DB URL
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
          CONTROL_PLANE_BOOTSTRAP_TOKEN: ${{ secrets.CONTROL_PLANE_BOOTSTRAP_TOKEN }}
          CONTROL_PLANE_ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          CONTROL_PLANE_ADMIN_PASSWORD: ${{ secrets.CONTROL_PLANE_ADMIN_PASSWORD }}
          CONTROL_PLANE_TENANT_ID: ${{ secrets.CONTROL_PLANE_TENANT_ID }}
          PROD_JDBC_URL: ${{ secrets.PROD_JDBC_URL }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # Convert session-mode URL to transaction-mode URL
          # Original: jdbc:postgresql://host:5432/db?sslmode=require
          # New:      jdbc:postgresql://host:6543/db?sslmode=require&prepareThreshold=0
          TXN_URL=$(echo "$PROD_JDBC_URL" | sed 's/:5432\//:6543\//' | sed 's/:5432$/:6543/')
          if [[ "$TXN_URL" != *":6543"* ]]; then
            TXN_URL=$(echo "$TXN_URL" | sed 's|//\([^/]*\)/|//\1:6543/|')
          fi
          if [[ "$TXN_URL" != *"prepareThreshold"* ]]; then
            if [[ "$TXN_URL" == *"?"* ]]; then
              TXN_URL="${TXN_URL}&prepareThreshold=0"
            else
              TXN_URL="${TXN_URL}?prepareThreshold=0"
            fi
          fi
          echo "Transaction-mode URL: ${TXN_URL:0:60}..."

          set_var() {
            local key="$1"
            local value="$2"
            local type="${3:-raw}"
            local payload
            if [ "$type" = "secret" ]; then
              payload=$(python3 -c 'import json,sys; print(json.dumps({"value": sys.argv[1], "type": "SECRET"}))' "$value")
            else
              payload=$(python3 -c 'import json,sys; print(json.dumps({"value": sys.argv[1]}))' "$value")
            fi
            curl -sS -o /dev/null -w "  $key: HTTP %{http_code}\n" --max-time 30 \
              -X PUT -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.render.com/v1/services/${BACKEND_ID}/env-vars/${key}"
          }

          echo "=== Setting env vars ==="
          # Use transaction-mode DB URL (port 6543, 200 connections)
          set_var "DATABASE_URL" "$TXN_URL" "secret"
          set_var "DATABASE_USERNAME" "$PROD_DB_USER" "secret"
          set_var "DATABASE_PASSWORD" "$PROD_DB_PASSWORD" "secret"

          # Bootstrap mode
          set_var "CONTROL_PLANE_BOOTSTRAP_ENABLED" "true"
          set_var "CONTROL_PLANE_BOOTSTRAP_TOKEN" "$CONTROL_PLANE_BOOTSTRAP_TOKEN" "secret"
          set_var "CONTROL_PLANE_ADMIN_EMAIL" "$CONTROL_PLANE_ADMIN_EMAIL" "secret"
          set_var "CONTROL_PLANE_ADMIN_PASSWORD" "$CONTROL_PLANE_ADMIN_PASSWORD" "secret"
          set_var "CONTROL_PLANE_TENANT_ID" "$CONTROL_PLANE_TENANT_ID" "secret"

          # Spring — minimal
          set_var "SPRING_PROFILES_ACTIVE" "prod"
          set_var "FLYWAY_ENABLED" "false"
          set_var "JPA_DDL_AUTO" "none"
          set_var "DATABASE_POOL_MAX" "2"
          set_var "DATABASE_POOL_MIN" "1"
          set_var "DATABASE_POOL_TIMEOUT" "30000"
          set_var "JWT_SECRET" "$(openssl rand -hex 32)" "secret"
          set_var "BOOTSTRAP_ENABLED" "false"
          set_var "SANAD_CONTROL_PLANE_TENANT_ID" "$CONTROL_PLANE_TENANT_ID" "secret"
          set_var "SANAD_CORS_ALLOWED_ORIGINS" "https://snad-app.vercel.app"
          set_var "SERVER_PORT" "8080"
          set_var "MANAGEMENT_ENDPOINTS" "health"
          set_var "SHUTDOWN_TIMEOUT" "30s"
          set_var "JAVA_OPTS" "-Xms64m -Xmx256m -XX:MaxDirectMemorySize=32m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m -Xss256k -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8"
          set_var "LOG_LEVEL_ROOT" "WARN"
          set_var "LOG_LEVEL_SANAD" "INFO"
          set_var "LAZY_INIT" "true"
          set_var "SECURITY_NOTIFICATION_PROVIDER" "disabled"
          set_var "APPLICATION_BASE_URL" "https://snad-app.vercel.app"
          set_var "FLYWAY_LOCATIONS" "classpath:db/migration,classpath:db/vendor/{vendor}"

      - name: Trigger deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          STATUS=$(curl -sS -o /tmp/deploy.json -w "%{http_code}" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            --data '{"clearCache":"do_not_clear"}')
          echo "Deploy HTTP ${STATUS}"
          DEPLOY_ID=$(python3 -c "import json; print(json.load(open('/tmp/deploy.json')).get('id',''))")
          echo "Deploy ID: ${DEPLOY_ID}"
          echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_ENV"

      - name: Wait 45s then poll bootstrap
        env:
          CONTROL_PLANE_BOOTSTRAP_TOKEN: ${{ secrets.CONTROL_PLANE_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          echo "Waiting 45s..."
          sleep 45
          echo "=== Polling bootstrap ==="
          for i in $(seq 1 60); do
            CODE=$(curl -sS -o /tmp/bs.json -w "%{http_code}" --max-time 10 \
              -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/internal/control-plane/bootstrap-admin" \
              -H "X-Control-Plane-Bootstrap-Token: $CONTROL_PLANE_BOOTSTRAP_TOKEN" \
              -H "Content-Type: application/json" 2>/dev/null || echo "000")
            echo "  Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✓ BOOTSTRAP SUCCESSFUL!"
              cat /tmp/bs.json
              echo ""
              echo "bootstrap_success=true" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 5
          done
          echo "Bootstrap timed out"
          echo "bootstrap_success=false" >> "$GITHUB_ENV"

      - name: Test login
        if: always()
        env:
          ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.CONTROL_PLANE_ADMIN_PASSWORD }}
        run: |
          echo "=== Login ==="
          curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            -w "\nHTTP %{http_code}\n" || true

      - name: Disable bootstrap
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          PAYLOAD=$(python3 -c 'import json; print(json.dumps({"value": "false"}))')
          curl -sS -o /dev/null -w "Disable HTTP %{http_code}\n" --max-time 30 \
            -X PUT -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://api.render.com/v1/services/${BACKEND_ID}/env-vars/CONTROL_PLANE_BOOTSTRAP_ENABLED"
