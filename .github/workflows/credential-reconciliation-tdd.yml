name: Credential Reconciliation TDD Probe

on:
  push:
    branches:
      - fix/production-g2-credential-reconciliation

permissions:
  contents: read

jobs:
  targeted-red-green:
    name: Targeted Auth Contract Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/sanad-platform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run targeted credential reconciliation contract test
        run: mvn -B -ntp -Dtest=AdminInitializeCredentialContractTest test -Dsurefire.useFile=false
