name: Fix Render Backend (v2)

# ============================================================
# Recovery workflow: find sanad-backend (Image service) and
# restore env vars + deploy on the CORRECT service.
# ------------------------------------------------------------
# The RENDER_SERVICE_ID secret points to sanad-backend-v2
# (Docker runtime), but the frontend BFF is hardcoded to
# https://sanad-backend-mcrj.onrender.com which is sanad-backend
# (Image runtime). We need to find sanad-backend's service ID
# and restore env vars + deploy on IT.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "fix-backend" to confirm'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  fix:
    name: Find and fix sanad-backend service
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    if: github.event.inputs.confirm == 'fix-backend'

    steps:
      - name: Find sanad-backend service ID
        id: find
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          echo "=== Listing all Render services (raw) ==="
          curl -sS --max-time 30 "https://api.render.com/v1/services?limit=50" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" > /tmp/services.json

          # Dump raw JSON to see the actual format
          echo "--- Raw services.json (first 2000 chars) ---"
          head -c 2000 /tmp/services.json
          echo ""
          echo ""

          # Parse and find the service with URL sanad-backend-mcrj.onrender.com
          TARGET_URL="sanad-backend-mcrj.onrender.com"
          TARGET_SERVICE_ID=$(python3 -c "
          import json
          with open('/tmp/services.json') as f:
              data = json.load(f)

          services = data if isinstance(data, list) else data.get('services', data.get('results', []))

          for s in services:
              # Handle wrapped format
              svc = s.get('service', s) if isinstance(s, dict) else {}
              sid = svc.get('id', '')
              name = svc.get('name', '')
              url = svc.get('serviceUrl', '') or svc.get('url', '') or ''
              stype = svc.get('type', '')
              status = svc.get('status', '')
              print(f'  Service: name={name} id={sid} type={stype} status={status} url={url}')
              if 'sanad-backend-mcrj' in url or (name == 'sanad-backend' and stype != 'docker'):
                  print(f'  >>> FOUND TARGET: {sid}')
                  print(svc)
          ")

          echo ""
          echo "=== Finding service with URL containing: ${TARGET_URL} ==="
          python3 << 'PYEOF' > /tmp/target-id.txt
          import json
          with open('/tmp/services.json') as f:
              data = json.load(f)
          services = data if isinstance(data, list) else data.get('services', data.get('results', []))
          for s in services:
              svc = s.get('service', s) if isinstance(s, dict) else {}
              sid = svc.get('id', '')
              name = svc.get('name', '')
              url = svc.get('serviceUrl', '') or svc.get('url', '') or ''
              stype = svc.get('type', '')
              # Match the original sanad-backend (not v2)
              if 'sanad-backend-mcrj' in url:
                  print(sid)
                  break
              # Also match by name if URL is not set
              if name == 'sanad-backend' and 'v2' not in name:
                  # Check if this is the Image runtime (not Docker)
                  if stype == 'web' or 'image' in str(svc.get('image', {})):
                      print(sid)
                      break
          PYEOF

          TARGET_ID=$(cat /tmp/target-id.txt | tr -d '[:space:]')
          echo "Target service ID: ${TARGET_ID}"
          if [ -z "$TARGET_ID" ]; then
            echo "::error::Could not find sanad-backend service"
            exit 1
          fi
          echo "target_id=${TARGET_ID}" >> "$GITHUB_OUTPUT"

      - name: Generate fresh JWT_SECRET
        id: jwt
        run: |
          JWT_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$JWT_SECRET"
          echo "value=$JWT_SECRET" >> "$GITHUB_OUTPUT"

      - name: Restore env vars on sanad-backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TARGET_ID: ${{ steps.find.outputs.target_id }}
          PROD_JDBC_URL: ${{ secrets.PROD_JDBC_URL }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          CONTROL_PLANE_TENANT_ID: ${{ secrets.CONTROL_PLANE_TENANT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          JWT_SECRET: ${{ steps.jwt.outputs.value }}
        run: |
          set -euo pipefail

          set_render_var() {
            local key="$1"
            local value="$2"
            local value_type="${3:-raw}"
            local payload
            if [ "$value_type" = "secret" ]; then
              payload=$(python3 -c 'import json,sys; print(json.dumps({"value": sys.argv[1], "type": "SECRET"}))' "$value")
            else
              payload=$(python3 -c 'import json,sys; print(json.dumps({"value": sys.argv[1]}))' "$value")
            fi
            local status
            status=$(curl -sS -o /tmp/render-resp.json -w "%{http_code}" --max-time 45 \
              -X PUT \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.render.com/v1/services/${TARGET_ID}/env-vars/${key}")
            if [ "$status" != "200" ] && [ "$status" != "201" ] && [ "$status" != "204" ]; then
              echo "::error::Failed to set ${key}: HTTP ${status}"
              cat /tmp/render-resp.json
              exit 1
            fi
            echo "  ✓ ${key} set (HTTP ${status})"
          }

          echo "=== Restoring env vars on sanad-backend (ID: ${TARGET_ID}) ==="

          set_render_var "DATABASE_URL" "$PROD_JDBC_URL" "secret"
          set_render_var "DATABASE_USERNAME" "$PROD_DB_USER" "secret"
          set_render_var "DATABASE_PASSWORD" "$PROD_DB_PASSWORD" "secret"
          set_render_var "SPRING_PROFILES_ACTIVE" "prod"
          set_render_var "FLYWAY_ENABLED" "true"
          set_render_var "FLYWAY_LOCATIONS" "classpath:db/migration,classpath:db/vendor/{vendor}"
          set_render_var "FLYWAY_BASELINE_ON_MIGRATE" "false"
          set_render_var "FLYWAY_VALIDATE_ON_MIGRATE" "true"
          set_render_var "JPA_DDL_AUTO" "validate"
          set_render_var "JWT_SECRET" "$JWT_SECRET" "secret"
          set_render_var "BOOTSTRAP_ENABLED" "false"
          set_render_var "SANAD_CONTROL_PLANE_TENANT_ID" "$CONTROL_PLANE_TENANT_ID" "secret"
          set_render_var "SANAD_CORS_ALLOWED_ORIGINS" "https://snad-app.vercel.app"
          set_render_var "SERVER_PORT" "8080"
          set_render_var "MANAGEMENT_ENDPOINTS" "health"
          set_render_var "SHUTDOWN_TIMEOUT" "30s"
          set_render_var "JAVA_OPTS" "-Xms64m -Xmx128m -XX:MaxDirectMemorySize=32m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss256k -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8"
          set_render_var "DATABASE_POOL_MAX" "5"
          set_render_var "DATABASE_POOL_MIN" "1"
          set_render_var "DATABASE_POOL_TIMEOUT" "30000"
          set_render_var "LOG_LEVEL_ROOT" "WARN"
          set_render_var "LOG_LEVEL_SANAD" "INFO"
          set_render_var "LAZY_INIT" "true"
          set_render_var "SECURITY_NOTIFICATION_PROVIDER" "resend"
          set_render_var "SECURITY_NOTIFICATION_FROM" "no-reply@snad.ai"
          set_render_var "SECURITY_NOTIFICATION_RESEND_API_KEY" "$RESEND_API_KEY" "secret"
          set_render_var "SECURITY_NOTIFICATION_ENDPOINT" "https://snad-app.vercel.app/api/email-proxy"
          set_render_var "APPLICATION_BASE_URL" "https://snad-app.vercel.app"

          echo "=== All env vars restored ==="

      - name: Trigger deploy on sanad-backend
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TARGET_ID: ${{ steps.find.outputs.target_id }}
        run: |
          set -euo pipefail
          echo "=== Triggering deploy ==="
          STATUS=$(curl -sS -o /tmp/deploy.json -w "%{http_code}" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${TARGET_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{"clearCache":"do_not_clear"}')
          echo "Deploy trigger HTTP ${STATUS}"
          DEPLOY_ID=$(python3 -c "import json; print(json.load(open('/tmp/deploy.json')).get('id',''))")
          echo "Deploy ID: ${DEPLOY_ID}"
          echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TARGET_ID: ${{ steps.find.outputs.target_id }}
        run: |
          set -euo pipefail
          DEPLOY_ID="${{ steps.deploy.outputs.deploy_id }}"
          echo "Waiting for deploy ${DEPLOY_ID}..."
          for i in $(seq 1 80); do
            sleep 15
            STATUS=$(curl -sS --max-time 30 \
              "https://api.render.com/v1/services/${TARGET_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" | python3 -c "import json, sys; print(json.load(sys.stdin).get('status','unknown'))")
            echo "  Attempt ${i}: ${STATUS}"
            if [ "${STATUS}" = "live" ]; then echo "✓ DEPLOY LIVE!"; exit 0; fi
            if echo "${STATUS}" | grep -qE "failed|canceled|deactivated"; then
              echo "::error::Deploy ${STATUS}"
              exit 1
            fi
          done
          echo "::error::Timeout"
          exit 1

      - name: Verify health and login
        run: |
          sleep 10
          echo "=== Health ==="
          curl -sS --max-time 15 "https://sanad-backend-mcrj.onrender.com/actuator/health"
          echo ""
          echo "=== Login test (wrong password → expect 401) ==="
          curl -sS --max-time 15 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -H "Origin: https://snad-app.vercel.app" \
            -d '{"email":"admin@snad.ai","password":"wrong"}' \
            -w "\nHTTP %{http_code}\n"
