name: Check prod DB for existing encrypted CRM custom-field data (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - name: Read-only check for enc:v1: data
        env:
          DB_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          DB_USER: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          DB_PASS: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
        run: |
          set +e
          # SPRING_DATASOURCE_URL is a jdbc:postgresql:// URL; psql needs postgresql://
          PSQL_URL=$(echo "$DB_URL" | sed 's#^jdbc:postgresql:#postgresql:#')
          echo "=== Table existence ==="
          docker run --rm -e PGPASSWORD="$DB_PASS" postgres:17-alpine \
            psql "$PSQL_URL?user=$DB_USER" -tAc "
            SELECT table_name FROM information_schema.tables
            WHERE table_schema='public' AND table_name IN
            ('crm_custom_field_values','crm_custom_field_definitions','custom_field_values','custom_field_definitions');" 2>&1
          echo ""
          echo "=== Count of enc:v1: prefixed values (encrypted) ==="
          for t in crm_custom_field_values custom_field_values; do
            echo "-- $t --"
            docker run --rm -e PGPASSWORD="$DB_PASS" postgres:17-alpine \
              psql "$PSQL_URL?user=$DB_USER" -tAc "
              SELECT COUNT(*) FROM $t WHERE value_text LIKE 'enc:v1:%';" 2>&1 || echo "(table not found)"
          done
          echo ""
          echo "=== Total rows in custom field value tables ==="
          for t in crm_custom_field_values custom_field_values; do
            echo "-- $t --"
            docker run --rm -e PGPASSWORD="$DB_PASS" postgres:17-alpine \
              psql "$PSQL_URL?user=$DB_USER" -tAc "SELECT COUNT(*) FROM $t;" 2>&1 || echo "(table not found)"
          done
          echo ""
          echo "=== Sensitive field definitions ==="
          for t in crm_custom_field_definitions custom_field_definitions; do
            echo "-- $t.sensitive --"
            docker run --rm -e PGPASSWORD="$DB_PASS" postgres:17-alpine \
              psql "$PSQL_URL?user=$DB_USER" -tAc "
              SELECT COUNT(*) FILTER (WHERE sensitive=true) AS sensitive_count, COUNT(*) AS total FROM $t;" 2>&1 || echo "(table/column not found)"
          done
          exit 0
