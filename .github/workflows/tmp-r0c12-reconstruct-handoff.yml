name: R0C12 One-Shot Exact Restore Seven

on:
  push:
    branches:
      - fix/r0c12-human-uat-authz-comprehensive

permissions:
  contents: write

jobs:
  restore-seven:
    if: contains(github.event.head_commit.message, '[R0C12_RESTORE7]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@v4
        with:
          ref: fix/r0c12-human-uat-authz-comprehensive
          fetch-depth: 0
          persist-credentials: true

      - name: Restore exact Z handoff subset and remove transport artifacts
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_MAIN='b0498962f9a5cc1515b32432fdab98480dedcbe3'
          EXPECTED_ARCHIVE_SHA='0a45127823595a705355e7032854a2843d55c121341d473b811c7247a8eec051'
          EXPECTED_B64_SHA='e40f8a6e3a947caebc3475bec3b5615e4666663cda4ccfb78316eeecc8f9dca6'

          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          cat .github/r0c12-final25.part00 .github/r0c12-final25.part01 .github/r0c12-final25.part02 > /tmp/r0c12-final25.b64
          echo "$EXPECTED_B64_SHA  /tmp/r0c12-final25.b64" | sha256sum -c -
          base64 -d /tmp/r0c12-final25.b64 > /tmp/r0c12-final25.tar.gz
          echo "$EXPECTED_ARCHIVE_SHA  /tmp/r0c12-final25.tar.gz" | sha256sum -c -

          rm -rf /tmp/r0c12-final25
          mkdir -p /tmp/r0c12-final25
          tar -xzf /tmp/r0c12-final25.tar.gz -C /tmp/r0c12-final25

          cat > /tmp/restore7.sha256 <<'EOF'
          abc5c9be203ee292ef8377ce3e20cbd08aa80670d7de9a5fd1fb4ed96158d042  apps/sanad-platform/src/test/java/com/sanad/platform/module/api/ModuleRegistryUatPostgresAcceptanceTest.java
          339c047d6dd41047ca0abf877dd7ed95a106fca5c3dc50f41004ee35d69819b1  apps/web/app/executive/_components/scp-access.test.tsx
          9405c9f080ca9818fe7974fbfa99187e500408425b2291c4f90c1b5bc97ee0cb  apps/web/app/executive/_components/scp-mutation-gating.test.tsx
          627a7b2d3e1494343c2fe9604ad50f35490ae7169517845b3f994f8ea5d97912  apps/web/app/executive/_components/scp-states.test.tsx
          8f5fd66623b35e66caaca410b0e45d12130fbf3d26922e949c24927168470b66  apps/web/app/executive/audit/audit-page.test.tsx
          e2dd54ed4a6ff6476d4e745cd61a1befabe7dc5f2a294c0ef24dcb782af938c7  apps/web/app/executive/subscriptions/[id]/subscription-detail-gating.test.tsx
          2b13b3bf1f0d0425549fda0eee42b4079fe6d3eb8b857b2500c6a94c0d52fa6d  apps/web/lib/api/scp-api.ts
          EOF
          sed -i 's/^          //' /tmp/restore7.sha256

          while read -r expected path; do
            src="/tmp/r0c12-final25/$path"
            test -f "$src"
            actual="$(sha256sum "$src" | awk '{print $1}')"
            test "$actual" = "$expected"
            mkdir -p "$(dirname "$path")"
            cp -f "$src" "$path"
            cmp -s "$src" "$path"
            target="$(sha256sum "$path" | awk '{print $1}')"
            test "$target" = "$expected"
          done < /tmp/restore7.sha256

          rm -f .github/r0c12-final25.part00
          rm -f .github/r0c12-final25.part01
          rm -f .github/r0c12-final25.part02
          rm -f .github/workflows/tmp-r0c12-reconstruct-handoff.yml
          rm -f .github/r0c12-restore7.trigger

          git add -A

          for p in \
            .github/r0c12-final25.part00 \
            .github/r0c12-final25.part01 \
            .github/r0c12-final25.part02 \
            .github/workflows/tmp-r0c12-reconstruct-handoff.yml \
            .github/r0c12-restore7.trigger; do
            test ! -e "$p"
          done

          if git diff --cached --name-only | grep -F 'apps/sanad-platform/.release/workflow-y2-production-release-authorized.md'; then
            echo '::error::release authorization ledger must not be touched'
            exit 1
          fi

          if git diff --cached -U0 | grep '^+' | grep -F 'PRODUCTION-RELEASE-AUTHORIZED'; then
            echo '::error::new production authorization marker detected'
            exit 1
          fi

          git commit -m 'fix(r0c12): restore exact Z handoff subset and remove transport artifacts'
          git push origin HEAD:fix/r0c12-human-uat-authz-comprehensive

          {
            echo '## R0C-12 exact restore result'
            echo "- source archive SHA256: $EXPECTED_ARCHIVE_SHA"
            echo '- restored files: 7/7 byte-for-byte verified'
            echo '- transport artifacts remaining: 0'
            echo '- new production markers: 0'
            echo "- resulting head: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
