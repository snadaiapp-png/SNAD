name: G1 Datasource Credential Forensics

# Read-only forensic probe of sanctioned-store credentials for the G1
# certification effort. Prints and persists candidate NAMES and verdicts
# only — never secret values. Dispatchable on any ref for evidence gathering;
# it performs no writes to secrets, database, or repository state.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/security/g1_credential_probe.py'
      - '.github/workflows/g1-datasource-forensics.yml'

permissions:
  contents: read

concurrency:
  group: g1-datasource-forensics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: Probe sanctioned credentials for sanad role (no values emitted)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
      SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
      PRODUCTION_DATABASE_PASSWORD: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PRODUCTION_DATABASE_JDBC_URL: ${{ secrets.PRODUCTION_DATABASE_JDBC_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      Z_GITHUB_TOKEN: ${{ secrets.Z_GITHUB_TOKEN }}
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Mask every candidate value defensively
        shell: bash
        run: |
          set -euo pipefail
          for key in SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME \
                     SPRING_DATASOURCE_PASSWORD PRODUCTION_DATABASE_PASSWORD \
                     PRODUCTION_DATABASE_URL PRODUCTION_DATABASE_JDBC_URL \
                     SUPABASE_ACCESS_TOKEN Z_GITHUB_TOKEN; do
            value="${!key:-}"
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done
          for key in SPRING_DATASOURCE_PASSWORD PRODUCTION_DATABASE_PASSWORD \
                     PRODUCTION_DATABASE_URL PRODUCTION_DATABASE_JDBC_URL \
                     SPRING_DATASOURCE_URL; do
            echo "::add-mask::$(python3 - "$key" <<'PY'
          import os, sys
          from urllib.parse import urlparse
          raw = os.environ.get(sys.argv[1], "").removeprefix("jdbc:")
          p = urlparse(raw)
          print(p.password or "")
          PY
          )" 2>/dev/null || true
          done

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned PostgreSQL driver
        run: python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10'

      - name: Run credential probe (names and verdicts only)
        shell: bash
        run: python scripts/security/g1_credential_probe.py

      - name: Upload sanitized forensics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-datasource-forensics-${{ github.run_id }}-${{ github.run_attempt }}
          path: g1-forensics-evidence.json
          if-no-files-found: warn
