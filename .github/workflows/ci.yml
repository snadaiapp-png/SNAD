# ============================================================
# SANAD Platform — CI Pipeline
# DEFECT-010: API Regression Automation
# Governing backend test database: PostgreSQL 16 service
# CRM-022: CRM Integration Tests job (required status check)
# ============================================================
# Runs on every push to main and on pull requests.
# Database-dependent tests consume the PostgreSQL service declared by
# GitHub Actions. Test code does not create or manage database containers.
# ============================================================

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/sanad-platform/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Maven Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanad
          POSTGRES_PASSWORD: sanad_pass
          POSTGRES_DB: sanad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanad -d sanad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: sanad
      SPRING_DATASOURCE_PASSWORD: sanad_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_PROFILES_ACTIVE: default
      FLYWAY_ENABLED: 'true'
      FLYWAY_BASELINE_ON_MIGRATE: 'true'
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      JPA_DDL_AUTO: validate

    defaults:
      run:
        working-directory: apps/sanad-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Maven test suite
        shell: bash
        run: |
          set -euo pipefail
          export CRM_CUSTOM_FIELD_ENCRYPTION_KEY="$(openssl rand -base64 32)"
          mvn test -B -ntp -Dsurefire.useFile=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: apps/sanad-platform/target/surefire-reports/
          if-no-files-found: error
          retention-days: 14

      - name: Test summary
        if: always()
        run: |
          echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mvn test -q -DskipTests -Dmaven.test.skip=true 2>/dev/null || echo "Maven test summary not available"
          find target/surefire-reports -name "*.txt" -exec grep -H "Tests run:" {} \; 2>/dev/null | \
            awk -F'[, ]' '{runs+=$4; fail+=$6; err+=$8; skip+=$10} END {print "Total: "runs" tests, "fail" failures, "err" errors, "skip" skipped"}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  crm:
    name: CRM Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanad
          POSTGRES_PASSWORD: sanad_pass
          POSTGRES_DB: sanad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanad -d sanad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: sanad
      SPRING_DATASOURCE_PASSWORD: sanad_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_PROFILES_ACTIVE: default
      FLYWAY_ENABLED: 'true'
      FLYWAY_BASELINE_ON_MIGRATE: 'true'
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      JPA_DDL_AUTO: validate

    defaults:
      run:
        working-directory: apps/sanad-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run CRM integration tests
        run: |
          mvn test -B -ntp \
            -Dsurefire.useFile=true \
            -DfailIfNoTests=true \
            -Dtest='com.sanad.platform.crm.**.*IntegrationTest'

      - name: Upload CRM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-surefire-reports
          path: apps/sanad-platform/target/surefire-reports/
          if-no-files-found: error
          retention-days: 14

      - name: CRM test summary
        if: always()
        run: |
          echo "## CRM Integration Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          find target/surefire-reports -name "*.txt" -exec grep -H "Tests run:" {} \; 2>/dev/null | \
            awk -F'[, ]' '{runs+=$4; fail+=$6; err+=$8; skip+=$10} END {print "Total: "runs" tests, "fail" failures, "err" errors, "skip" skipped"}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  r11-postgresql-acceptance:
    name: R11 PostgreSQL Acceptance Certification
    if: github.event_name == 'pull_request' && github.head_ref == 'infra/backend-clean-room-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanad
          POSTGRES_PASSWORD: sanad_pass
          POSTGRES_DB: sanad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanad -d sanad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: sanad
      SPRING_DATASOURCE_PASSWORD: sanad_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      FLYWAY_ENABLED: 'true'
      FLYWAY_BASELINE_ON_MIGRATE: 'true'
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      JPA_DDL_AUTO: validate
      CRM_009_POSTGRES_MANDATORY: 'true'

    defaults:
      run:
        working-directory: apps/sanad-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run PostgreSQL acceptance certification
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/surefire-reports
          mvn test -B -ntp \
            -Dtest='RefreshTokenConcurrencyPostgresTest' \
            -DfailIfNoTests=true \
            -Dsurefire.useFile=true

      - name: Enforce PostgreSQL acceptance report
        shell: bash
        run: |
          set -euo pipefail
          report="target/surefire-reports/TEST-com.sanad.platform.security.service.RefreshTokenConcurrencyPostgresTest.xml"
          test -f "$report"
          python3 - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          tests = int(root.attrib.get('tests', 0))
          failures = int(root.attrib.get('failures', 0))
          errors = int(root.attrib.get('errors', 0))
          skipped = int(root.attrib.get('skipped', 0))
          print(f"tests={tests} failures={failures} errors={errors} skipped={skipped}")
          if tests <= 0 or failures or errors or skipped:
              raise SystemExit(1)
          PY

      - name: Upload R11 PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r11-postgresql-acceptance-${{ github.run_id }}
          path: apps/sanad-platform/target/surefire-reports/TEST-*RefreshTokenConcurrencyPostgresTest.xml
          if-no-files-found: error
          retention-days: 30

  r11-development-security:
    name: R11 Development Security Certification
    if: github.event_name == 'pull_request' && github.head_ref == 'infra/backend-clean-room-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanad
          POSTGRES_PASSWORD: sanad_pass
          POSTGRES_DB: sanad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanad -d sanad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: sanad
      SPRING_DATASOURCE_PASSWORD: sanad_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      FLYWAY_ENABLED: 'true'
      FLYWAY_BASELINE_ON_MIGRATE: 'true'
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      JPA_DDL_AUTO: validate
      CRM_009_POSTGRES_MANDATORY: 'true'

    defaults:
      run:
        working-directory: apps/sanad-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run development security certification
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/surefire-reports
          mvn test -B -ntp \
            -Dtest='AuthApiIntegrationTest,OrganizationTenantIsolationTest,UserMembershipControllerTest,RefreshTokenConcurrencyPostgresTest' \
            -Dspring.profiles.active=test \
            -DfailIfNoTests=true \
            -Dsurefire.useFile=true

      - name: Enforce development security reports
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AuthApiIntegrationTest
            OrganizationTenantIsolationTest
            UserMembershipControllerTest
            RefreshTokenConcurrencyPostgresTest
          )
          for test_class in "${required[@]}"; do
            report=$(find target/surefire-reports -name "TEST-*${test_class}.xml" -print -quit)
            if [[ -z "$report" ]]; then
              echo "::error::Missing report for $test_class"
              exit 1
            fi
            python3 - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          tests = int(root.attrib.get('tests', 0))
          failures = int(root.attrib.get('failures', 0))
          errors = int(root.attrib.get('errors', 0))
          skipped = int(root.attrib.get('skipped', 0))
          print(f"{root.attrib.get('name')}: tests={tests} failures={failures} errors={errors} skipped={skipped}")
          if tests <= 0 or failures or errors or skipped:
              raise SystemExit(1)
          PY
          done

      - name: Upload R11 development security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r11-development-security-${{ github.run_id }}
          path: apps/sanad-platform/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
          retention-days: 30
