# ============================================================
# SANAD Platform — CI Pipeline
# DEFECT-010: API Regression Automation
# CRM-022: CRM Integration Tests job (required status check)
# v20260816.10: PostgreSQL Direct only — Docker/Testcontainers removed.
# v20260824.1: Least-privilege `sanad` role provisioning.
#   The postgres:16-alpine image's POSTGRES_USER env var creates a SUPERUSER.
#   Multiple tests (ContactRlsPostgresTest, MigrationTestSchemaSupportLeastPrivilegePostgresTest,
#   CollaborationFoundationRlsPostgresTest, CrmEntityParticipantIntegrityPostgresTest,
#   JdbcEntityParticipantRepositoryPostgresTest, JdbcCrmEventOutboxPostgresTest,
#   ContactTransferSpringProxyPostgresTest) require a non-superuser `sanad` role
#   so that FORCE RLS / WITH CHECK policies actually enforce, and so that the
#   least-privilege contract (rolsuper=false, rolbypassrls=false, rolcreatedb=false,
#   rolcreaterole=false) holds. The `crm_contact_rls_test_user` role is also
#   pre-provisioned here so ContactRlsPostgresTest can validate fail-closed
#   RLS behavior from a non-table-owner perspective.
# ============================================================
# Runs on every push to main and on pull requests.
# Executes Maven tests against the GitHub-provided PostgreSQL 16 service
# and reports results.
# The `crm` job runs the CRM integration test classes in isolation and is
# intended as a required status check on main.
# ============================================================

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/sanad-platform/**'
      - '.github/workflows/ci.yml'
  # This workflow is a required status check and must report on every pull request.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Maven Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Use the default `postgres` superuser to bootstrap; we provision
          # a least-privilege `sanad` role in a separate step below.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_pass
          POSTGRES_DB: sanad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sanad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: sanad
      SPRING_DATASOURCE_PASSWORD: sanad_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_PROFILES_ACTIVE: default
      FLYWAY_ENABLED: 'true'
      FLYWAY_BASELINE_ON_MIGRATE: 'true'
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      JPA_DDL_AUTO: validate
      PGPASSWORD: postgres_pass

    defaults:
      run:
        working-directory: apps/sanad-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Provision least-privilege sanad role + crm_contact_rls_test_user
        # The postgres:16-alpine POSTGRES_USER env creates a SUPERUSER. Multiple
        # tests require a non-superuser `sanad` so FORCE RLS actually enforces.
        # We CREATE `sanad` as a least-privilege role (the postgres superuser
        # owns the database; sanad is granted full DB privileges but no
        # SUPERUSER/CREATEDB/CREATEROLE/BYPASSRLS) and pre-provision the
        # `crm_contact_rls_test_user` role used by ContactRlsPostgresTest.
        # We also pre-provision the `test_migration` database used by
        # MigrationTestSchemaSupportLeastPrivilegePostgresTest (sanad has
        # NOCREATEDB so it cannot CREATE DATABASE on its own).
        # NOTE: the heredoc body is SQL — only -- comments are allowed inside it,
        # bash-style # comments would be sent to psql as SQL and break it.
        run: |
          psql -h 127.0.0.1 -U postgres -d sanad -v ON_ERROR_STOP=1 <<'SQL'
          -- Create the least-privilege application role `sanad`.
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad') THEN
              CREATE ROLE sanad WITH LOGIN PASSWORD 'sanad_pass';
            END IF;
          END $$;
          ALTER ROLE sanad NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          -- Transfer database ownership from `postgres` to `sanad` so that
          -- tables created by Flyway (running as sanad) are owned by sanad
          -- AND sanad has full DB-level privileges. The FORCE RLS invariant
          -- makes the table owner subject to RLS — exactly the contract
          -- the tests rely on.
          ALTER DATABASE sanad OWNER TO sanad;
          -- Pre-provision the `test_migration` database used by
          -- MigrationTestSchemaSupport.ensureDatabase() (sanad has NOCREATEDB).
          SELECT 'CREATE DATABASE test_migration OWNER sanad'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'test_migration')\gexec
          -- Grant sanad full DDL+DML privileges on the schema.
          -- Flyway needs CREATE TABLE / ALTER TABLE; tests need INSERT/UPDATE/DELETE.
          GRANT ALL PRIVILEGES ON DATABASE sanad TO sanad;
          GRANT ALL PRIVILEGES ON DATABASE test_migration TO sanad;
          \c test_migration
          GRANT ALL ON SCHEMA public TO sanad;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO sanad;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO sanad;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT ALL PRIVILEGES ON TABLES TO sanad;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT ALL PRIVILEGES ON SEQUENCES TO sanad;
          \c sanad
          GRANT ALL ON SCHEMA public TO sanad;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO sanad;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO sanad;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT ALL PRIVILEGES ON TABLES TO sanad;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT ALL PRIVILEGES ON SEQUENCES TO sanad;
          -- Pre-provision the test RLS user (ContactRlsPostgresTest expects it).
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'crm_contact_rls_test_user') THEN
              CREATE ROLE crm_contact_rls_test_user WITH LOGIN PASSWORD 'rls_contact_test_pass';
            END IF;
          END $$;
          ALTER ROLE crm_contact_rls_test_user NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          SQL

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests (PostgreSQL Direct)
        env:
          # Required by ProductionSecurityGuard (prod profile) — must not be the test default
          CRM_CUSTOM_FIELD_ENCRYPTION_KEY: 'El3BbUMQ882dQYiAqNEEMxfTr3CVlf0FTbrCOrIKKsw='
        run: mvn test -B -ntp -Dsurefire.useFile=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: apps/sanad-platform/target/surefire-reports/
          if-no-files-found: error
          retention-days: 14

      - name: Test summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Parse surefire reports for summary
          find target/surefire-reports -name "*.txt" -exec grep -H "Tests run:" {} \; 2>/dev/null | \
            awk -F'[, ]' '{runs+=$4; fail+=$6; err+=$8; skip+=$10} END {print "Total: "runs" tests, "fail" failures, "err" errors, "skip" skipped"}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ============================================================
  # CRM-022 — CRM-specific test gate.
  # Runs the CRM integration test classes (package
  # com.sanad.platform.crm.**) in isolation from the full Maven
  # suite. Intended as a required status check on main.
  # Reference: docs/crm/CRM-ENTERPRISE-EXECUTION-ROADMAP.md
  #            (EXEC-PROMPT-CRM-022)
  # ============================================================
  crm:
    name: CRM Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Use the default `postgres` superuser to bootstrap; we provision
          # a least-privilege `sanad` role in a separate step below.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_pass
          POSTGRES_DB: sanad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sanad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: sanad
      SPRING_DATASOURCE_PASSWORD: sanad_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_PROFILES_ACTIVE: default
      FLYWAY_ENABLED: 'true'
      FLYWAY_BASELINE_ON_MIGRATE: 'true'
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      JPA_DDL_AUTO: validate
      PGPASSWORD: postgres_pass

    defaults:
      run:
        working-directory: apps/sanad-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Provision least-privilege sanad role + crm_contact_rls_test_user
        # Mirror of the test job's provisioning step (CRM integration tests
        # also use the same PostgreSQL service container).
        # NOTE: the heredoc body is SQL — only -- comments are allowed inside it.
        run: |
          psql -h 127.0.0.1 -U postgres -d sanad -v ON_ERROR_STOP=1 <<'SQL'
          -- Create the least-privilege application role `sanad`.
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad') THEN
              CREATE ROLE sanad WITH LOGIN PASSWORD 'sanad_pass';
            END IF;
          END $$;
          ALTER ROLE sanad NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          ALTER DATABASE sanad OWNER TO sanad;
          SELECT 'CREATE DATABASE test_migration OWNER sanad'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'test_migration')\gexec
          GRANT ALL PRIVILEGES ON DATABASE sanad TO sanad;
          GRANT ALL PRIVILEGES ON DATABASE test_migration TO sanad;
          \c test_migration
          GRANT ALL ON SCHEMA public TO sanad;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO sanad;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO sanad;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT ALL PRIVILEGES ON TABLES TO sanad;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT ALL PRIVILEGES ON SEQUENCES TO sanad;
          \c sanad
          GRANT ALL ON SCHEMA public TO sanad;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO sanad;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO sanad;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT ALL PRIVILEGES ON TABLES TO sanad;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT ALL PRIVILEGES ON SEQUENCES TO sanad;
          -- Pre-provision the test RLS user (ContactRlsPostgresTest expects it).
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'crm_contact_rls_test_user') THEN
              CREATE ROLE crm_contact_rls_test_user WITH LOGIN PASSWORD 'rls_contact_test_pass';
            END IF;
          END $$;
          ALTER ROLE crm_contact_rls_test_user NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          SQL

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run CRM integration tests
        # -Dsurefire.useFile=true emits per-class JUnit XML (TEST-*.xml)
        # under target/surefire-reports/ for the artifact upload below.
        # -DfailIfNoTests=true fails loudly if the CRM package scope ever
        # drifts to zero matching tests (guard against silent no-ops).
        # Note: CRM_CUSTOM_FIELD_ENCRYPTION_KEY is intentionally NOT set
        # here — CRM Integration Tests use the `default` profile which
        # generates an ephemeral key at startup. Setting the well-known
        # test key here would introduce a redundant gitleaks finding
        # (the same key is already committed in 8+ other workflow files
        # as a known test fixture, but adding a new occurrence here is
        # unnecessary and was reverted in v20260816.11).
        run: |
          mvn test -B -ntp \
            -Dsurefire.useFile=true \
            -DfailIfNoTests=true \
            -Dtest='com.sanad.platform.crm.**.*IntegrationTest'

      - name: Upload CRM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-surefire-reports
          path: apps/sanad-platform/target/surefire-reports/
          if-no-files-found: error
          retention-days: 14

      - name: CRM test summary
        if: always()
        run: |
          echo "## CRM Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Parse surefire reports for summary
          find target/surefire-reports -name "*.txt" -exec grep -H "Tests run:" {} \; 2>/dev/null | \
            awk -F'[, ]' '{runs+=$4; fail+=$6; err+=$8; skip+=$10} END {print "Total: "runs" tests, "fail" failures, "err" errors, "skip" skipped"}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
