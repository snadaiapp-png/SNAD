name: HRM G4 T5 Lifecycle Evidence

on:
  pull_request:
    paths:
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/hr/payroll/**'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/hr/payroll/PayrollLifecyclePostgresTest.java'
      - '.github/workflows/hrm-g4-t5-lifecycle.yml'
  workflow_dispatch:

jobs:
  payroll-lifecycle-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sanad
          POSTGRES_USER: sanad
          POSTGRES_PASSWORD: sanad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanad -d sanad"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad
      SPRING_DATASOURCE_USERNAME: sanad
      SPRING_DATASOURCE_PASSWORD: sanad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run G4-T5 PostgreSQL Direct lifecycle contract
        working-directory: apps/sanad-platform
        run: mvn --batch-mode --no-transfer-progress -Dtest=PayrollLifecyclePostgresTest -DfailIfNoTests=true test
