name: HRM G4 T5 Lifecycle Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/hr/payroll/**'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/hr/payroll/PayrollLifecyclePostgresTest.java'
      - 'apps/sanad-platform/src/main/resources/db/migration/**'
      - 'apps/sanad-platform/src/main/resources/db/vendor/postgresql/**'
      - 'apps/sanad-platform/pom.xml'
      - '.github/workflows/hrm-g4-t5-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hrm-g4-t5-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payroll-lifecycle-postgres:
    name: G4-T5 lifecycle PostgreSQL Direct
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad_g4_t5?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: sanad_g4_t5

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "candidate_sha=$CANDIDATE_SHA"

      - name: Generate ephemeral PostgreSQL credential
        shell: bash
        run: |
          set -euo pipefail
          DB_CRED="$(openssl rand -hex 24)"
          echo "::add-mask::$DB_CRED"
          echo "SPRING_DATASOURCE_PASSWORD=$DB_CRED" >> "$GITHUB_ENV"
          echo "PGPASSWORD=$DB_CRED" >> "$GITHUB_ENV"

      - name: Start host-native PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null
          command -v pg_isready >/dev/null
          sudo systemctl start postgresql
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1 && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432
          psql --version

      - name: Provision least-privilege PostgreSQL Direct role
        shell: bash
        env:
          DB_CRED: ${{ env.SPRING_DATASOURCE_PASSWORD }}
        run: |
          set -euo pipefail
          sudo -u postgres psql -v ON_ERROR_STOP=1 -v db_credential="$DB_CRED" <<'SQL'
          SELECT format('CREATE ROLE sanad_g4_t5 WITH LOGIN PASSWORD %L', :'db_credential')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad_g4_t5')
          \gexec

          ALTER ROLE sanad_g4_t5
            NOSUPERUSER
            NOCREATEDB
            NOCREATEROLE
            NOBYPASSRLS;

          SELECT 'CREATE DATABASE sanad_g4_t5 OWNER sanad_g4_t5'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'sanad_g4_t5')
          \gexec

          SELECT 'CREATE DATABASE test_migration OWNER sanad_g4_t5'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'test_migration')
          \gexec

          ALTER DATABASE sanad_g4_t5 OWNER TO sanad_g4_t5;
          ALTER DATABASE test_migration OWNER TO sanad_g4_t5;
          SQL

          PGPASSWORD="$DB_CRED" psql -h 127.0.0.1 -U sanad_g4_t5 -d sanad_g4_t5 -v ON_ERROR_STOP=1             -Atc "SELECT current_database() || '|' || current_user"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run G4-T5 lifecycle contract
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress             -Dtest=PayrollLifecyclePostgresTest             -DfailIfNoTests=true             test

      - name: Run complete HR RLS catalog gate
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress             -Dtest=HrRlsFailClosedIntegrationTest             -DfailIfNoTests=true             test

      - name: Assert T5 suite actually executed
        if: always()
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -euo pipefail
          REPORT=target/surefire-reports/TEST-com.sanad.platform.hr.payroll.PayrollLifecyclePostgresTest.xml
          test -f "$REPORT" || { echo "::error::Missing Surefire report for PayrollLifecyclePostgresTest"; exit 1; }
          python3 - "$REPORT" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          tests = int(root.attrib.get('tests', '0'))
          failures = int(root.attrib.get('failures', '0'))
          errors = int(root.attrib.get('errors', '0'))
          skipped = int(root.attrib.get('skipped', '0'))
          print(f"tests={tests} failures={failures} errors={errors} skipped={skipped}")
          if tests < 10 or failures != 0 or errors != 0 or skipped != 0:
              raise SystemExit(1)
          PY
