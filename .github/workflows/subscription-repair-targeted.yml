name: Subscription Repair Targeted

on:
  push:
    branches: [fix/subscription-module-comprehensive-repair-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    name: Subscription Repair Targeted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/sanad-platform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run targeted repair regressions
        run: mvn test -B -ntp -Dtest=PriceResolverStrictFallbackTest,PriceResolverTest,PriceRepositoryTest,SubscriptionChangeServiceTest,LifecycleControllerActorTest,SubscriptionCommandServiceTest,PlanVersionServiceTest,ExecutiveReadModelsTest -Dsurefire.useFile=false
