name: FINAL — ControlPlane Bootstrap API

# ============================================================
# USE THE CONTROL PLANE BOOTSTRAP ENDPOINT
# This endpoint uses Spring's OWN BCryptPasswordEncoder
# to set the admin password, guaranteeing compatibility.
#
# Steps:
# 1. Set CONTROL_PLANE_BOOTSTRAP_ENABLED=true
# 2. Set CONTROL_PLANE_ADMIN_EMAIL=admin@snad.ai
# 3. Set CONTROL_PLANE_ADMIN_PASSWORD=SNad@2026
# 4. Suspend+Resume to restart with new env vars
# 5. Wait for health
# 6. Call POST /api/v1/internal/control-plane/bootstrap-admin
#    with X-Control-Plane-Bootstrap-Token header
# 7. Test login
# 8. Disable bootstrap
# ============================================================

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "final" to confirm'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    if: github.event.inputs.confirm == 'final'
    steps:
      - name: Set bootstrap env vars
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
          CONTROL_PLANE_TENANT_ID: ${{ secrets.CONTROL_PLANE_TENANT_ID }}
        run: |
          set -euo pipefail
          set_var() {
            local key="$1"
            local value="$2"
            local payload
            payload=$(python3 -c 'import json,sys; print(json.dumps({"value": sys.argv[1]}))' "$value")
            curl -sS -o /dev/null -w "  $key: HTTP %{http_code}\n" --max-time 30 \
              -X PUT -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.render.com/v1/services/${BACKEND_ID}/env-vars/${key}"
          }

          echo "=== Setting ControlPlane bootstrap env vars ==="
          set_var "CONTROL_PLANE_BOOTSTRAP_ENABLED" "true"
          set_var "CONTROL_PLANE_ADMIN_EMAIL" "admin@snad.ai"
          set_var "CONTROL_PLANE_ADMIN_PASSWORD" "SNad@2026"
          set_var "CONTROL_PLANE_TENANT_ID" "$CONTROL_PLANE_TENANT_ID"
          set_var "BOOTSTRAP_ENABLED" "false"
          set_var "FLYWAY_ENABLED" "false"
          set_var "JPA_DDL_AUTO" "none"
          set_var "DATABASE_POOL_MAX" "1"
          set_var "SANAD_CONTROL_PLANE_TENANT_ID" "$CONTROL_PLANE_TENANT_ID"

      - name: Suspend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Suspend: %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/suspend" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" || true
          sleep 20

      - name: Resume
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Resume: %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/resume" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" || true

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://sanad-backend-mcrj.onrender.com/actuator/health" 2>/dev/null || echo "000")
            echo "  Health $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "✓ UP!"; exit 0; fi
            sleep 10
          done

      - name: Wait 60s for full warmup
        run: sleep 60

      - name: Call ControlPlane bootstrap endpoint
        env:
          BOOTSTRAP_TOKEN: ${{ secrets.CONTROL_PLANE_BOOTSTRAP_TOKEN }}
        run: |
          echo "=== Calling bootstrap endpoint ==="
          for i in $(seq 1 10); do
            CODE=$(curl -sS -o /tmp/bs.json -w "%{http_code}" --max-time 30 \
              -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/internal/control-plane/bootstrap-admin" \
              -H "X-Control-Plane-Bootstrap-Token: $BOOTSTRAP_TOKEN" \
              -H "Content-Type: application/json" 2>/dev/null || echo "000")
            echo "  Attempt $i: HTTP $CODE"
            cat /tmp/bs.json 2>/dev/null || true
            echo ""
            if [ "$CODE" = "200" ]; then
              echo "🎉 BOOTSTRAP SUCCESSFUL!"
              echo "bootstrap_success=true" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 10
          done
          echo "Bootstrap failed"
          echo "bootstrap_success=false" >> "$GITHUB_ENV"

      - name: Test login
        run: |
          echo "=== Login test ==="
          for i in 1 2 3 4 5; do
            RESULT=$(curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
              -H "Content-Type: application/json" \
              -d '{"email":"admin@snad.ai","password":"SNad@2026"}' \
              -w "\n%{http_code}" 2>/dev/null || echo "timeout\n000")
            CODE=$(echo "$RESULT" | tail -1)
            echo "  Login $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "🎉🎉🎉 LOGIN SUCCESSFUL! 🎉🎉🎉"
              exit 0
            fi
            sleep 30
          done
          echo "❌ Login failed"

      - name: Disable bootstrap
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          PAYLOAD=$(python3 -c 'import json; print(json.dumps({"value": "false"}))')
          curl -sS -o /dev/null -w "Disable: %{http_code}\n" --max-time 30 \
            -X PUT -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://api.render.com/v1/services/${BACKEND_ID}/env-vars/CONTROL_PLANE_BOOTSTRAP_ENABLED"
