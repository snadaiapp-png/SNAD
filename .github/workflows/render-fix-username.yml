name: Render Fix Username + Deploy

# The root cause of ENOIDENTIFIER has been found:
# Render's DATABASE_USERNAME is postgres.eyoupksefusnslvdnflt
# but this project ref does NOT exist on Supabase.
#
# Real projects are:
#   - hxhvfqxzigrqoxxnnzje (sanad-production-v2)
#   - qjwbnrfmxnwqubhksezy (sanad-staging-g7)
#
# This workflow sets DATABASE_USERNAME to a valid project ref
# and triggers deploy.

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase project ref to use (e.g., hxhvfqxzigrqoxxnnzje)"
        required: true
        default: "hxhvfqxzigrqoxxnnzje"

permissions:
  contents: read

jobs:
  fix-and-deploy:
    name: Fix username + deploy + capture
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    steps:
      - name: Fix username + deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          PROJECT_REF: ${{ github.event.inputs.project_ref }}
        run: |
          set +e
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          BASE="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"
          BACKEND_URL="https://sanad-backend-mcrj.onrender.com"
          POOLER_HOST="aws-0-eu-central-1.pooler.supabase.com"
          CLEAN_URL="jdbc:postgresql://${POOLER_HOST}:5432/postgres?prepareThreshold=0&sslmode=require"
          NEW_USERNAME="postgres.${PROJECT_REF}"

          echo "========================================"
          echo "FIX USERNAME + DEPLOY"
          echo "========================================"
          echo "Project ref: $PROJECT_REF"
          echo "New username: $NEW_USERNAME"
          echo ""

          # Suspend
          echo "=== STEP 1: Suspend service ==="
          HTTP=$(curl -s -o /tmp/suspend.json -w "%{http_code}" --max-time 30 -X POST -H "$AUTH" "$BASE/suspend")
          echo "POST /suspend -> HTTP $HTTP"
          sleep 15
          echo ""

          # PUT DATABASE_URL (clean, no SNI)
          echo "=== STEP 2: PUT DATABASE_URL (clean, no SNI factory) ==="
          HTTP=$(curl -s -o /tmp/db-resp.json -w "%{http_code}" --max-time 45 -X PUT \
            -H "$AUTH" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data "$(jq -n --arg v "$CLEAN_URL" '{value:$v}')" "$BASE/env-vars/DATABASE_URL")
          echo "PUT DATABASE_URL -> HTTP $HTTP"
          echo ""

          # PUT SPRING_FLYWAY_URL (same)
          echo "=== STEP 3: PUT SPRING_FLYWAY_URL ==="
          HTTP=$(curl -s -o /tmp/sf-resp.json -w "%{http_code}" --max-time 45 -X PUT \
            -H "$AUTH" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data "$(jq -n --arg v "$CLEAN_URL" '{value:$v}')" "$BASE/env-vars/SPRING_FLYWAY_URL")
          echo "PUT SPRING_FLYWAY_URL -> HTTP $HTTP"
          echo ""

          # PUT DATABASE_USERNAME
          echo "=== STEP 4: PUT DATABASE_USERNAME ==="
          HTTP=$(curl -s -o /tmp/user-resp.json -w "%{http_code}" --max-time 45 -X PUT \
            -H "$AUTH" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data "$(jq -n --arg v "$NEW_USERNAME" '{value:$v}')" "$BASE/env-vars/DATABASE_USERNAME")
          echo "PUT DATABASE_USERNAME -> HTTP $HTTP"
          echo ""

          # Resume
          echo "=== STEP 5: Resume service ==="
          HTTP=$(curl -s -o /tmp/resume.json -w "%{http_code}" --max-time 30 -X POST -H "$AUTH" "$BASE/resume")
          echo "POST /resume -> HTTP $HTTP"
          sleep 5
          echo ""

          # Trigger deploy
          echo "=== STEP 6: Trigger deploy ==="
          HTTP=$(curl -s -o /tmp/deploy.json -w "%{http_code}" --max-time 30 -X POST \
            -H "$AUTH" -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data '{"clearCache":"do_not_clear"}' "$BASE/deploys")
          DEPLOY_ID=$(jq -r '.id // empty' /tmp/deploy.json)
          echo "POST /deploys -> HTTP $HTTP, Deploy ID: $DEPLOY_ID"
          echo ""

          # Capture live logs
          echo "=== STEP 7: Capture live logs ==="
          OWNER_ID=$(curl -s --max-time 30 -H "$AUTH" "$BASE" | jq -r '.ownerId // .owner // empty')
          START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p /tmp/live-logs
          > /tmp/live-logs/all.txt

          DEPLOY_STATUS="update_in_progress"
          ITERATION=0
          MAX_ITERATIONS=80

          while [ "$DEPLOY_STATUS" = "update_in_progress" ] && [ "$ITERATION" -lt "$MAX_ITERATIONS" ]; do
            ITERATION=$((ITERATION + 1))
            sleep 10

            DEPLOY_STATUS=$(curl -s --max-time 15 -H "$AUTH" "$BASE/deploys/$DEPLOY_ID" | jq -r '.deploy.status // .status // "unknown"')
            echo "[iter $ITERATION] deploy status: $DEPLOY_STATUS"

            if [ -n "$OWNER_ID" ]; then
              URL="https://api.render.com/v1/logs?ownerId=${OWNER_ID}&resource=${RENDER_SERVICE_ID}&startTime=${START_TIME}&direction=forward&limit=200"
              curl -s --max-time 15 -H "$AUTH" "$URL" > /tmp/live-logs/page.json
              jq -r 'if type=="array" then .[] elif .logs then .logs[] elif .lines then .lines[] else empty end | (if type=="object" then (.text // .message // .msg // (. | tostring)) else (tostring) end)' /tmp/live-logs/page.json 2>/dev/null >> /tmp/live-logs/all.txt
            fi

            if [ "$DEPLOY_STATUS" = "live" ]; then
              echo "::notice::DEPLOY LIVE after $((ITERATION * 10))s"
              break
            fi
            if echo "$DEPLOY_STATUS" | grep -qiE 'failed|canceled|deactivated'; then
              echo "::error::Deploy terminal: $DEPLOY_STATUS"
              break
            fi
          done
          echo ""

          # Final logs
          echo "=== STEP 8: FINAL LOG DUMP (last 30 lines) ==="
          tail -30 /tmp/live-logs/all.txt
          echo ""

          # Error patterns
          echo "=== STEP 9: ERROR PATTERN SEARCH ==="
          echo "ENOIDENTIFIER: $(grep -c 'ENOIDENTIFIER' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "PKIX: $(grep -c 'PKIX\|SunCertPathBuilderException' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "UnknownHostException: $(grep -c 'UnknownHostException' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "BeanCreationException: $(grep -c 'BeanCreationException' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "ProductionGuard: $(grep -c 'ProductionWorkflowStubGuard\|Production startup refused' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "Application run failed: $(grep -c 'Application run failed' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "Started SanadPlatformApplication: $(grep -c 'Started SanadPlatformApplication' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "Tomcat started: $(grep -c 'Tomcat started on port' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo ""

          # Health probe
          echo "=== STEP 10: Health probe ==="
          HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 "$BACKEND_URL/actuator/health" || echo "000")
          HEALTH_STATUS=$(jq -r '.status // "unknown"' /tmp/health.json 2>/dev/null || echo "unknown")
          echo "HTTP_CODE: $HTTP_CODE"
          echo "STATUS: $HEALTH_STATUS"
          echo ""

          # Summary
          echo "========================================"
          echo "FIX + DEPLOY COMPLETE"
          echo "========================================"
          echo "DEPLOY_ID=$DEPLOY_ID"
          echo "DEPLOY_STATUS=$DEPLOY_STATUS"
          echo "HEALTH_HTTP=$HTTP_CODE"
          echo "HEALTH_STATUS=$HEALTH_STATUS"
          echo "TOTAL_LOG_LINES=$(wc -l < /tmp/live-logs/all.txt)"
          if [ "$DEPLOY_STATUS" = "live" ] && [ "$HTTP_CODE" = "200" ] && [ "$HEALTH_STATUS" = "UP" ]; then
            echo "FINAL_RESULT=SUCCESS ✅"
          elif [ "$DEPLOY_STATUS" = "live" ]; then
            echo "FINAL_RESULT=PARTIAL (live but health not UP)"
          else
            echo "FINAL_RESULT=FAILED — investigate next-error"
          fi

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-fix-username-logs
          path: /tmp/live-logs/
          if-no-files-found: warn
          retention-days: 14
