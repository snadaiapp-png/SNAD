name: CRM API Contract Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/crm/**'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/crm/**'
      - 'apps/sanad-platform/src/main/resources/db/migration/**'
      - 'apps/sanad-platform/pom.xml'
      - 'apps/web/lib/api/**'
      - 'docs/crm/contracts/**'
      - 'scripts/crm/**'
      - '.github/workflows/crm-api-contract-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crm-api-contract-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  JWT_SECRET: ci-only-non-production-validation-key-1234567890
  SANAD_SERVICE_AUTH_JWT_SECRET: 'ci-only-non-production-jwt-secret-key-32-chars-min'
  SANAD_WORKFLOW_ENGINE_BASE_URL: 'http://localhost:8081'
  SANAD_AI_GATEWAY_BASE_URL: 'http://localhost:8081'
  SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad_contract
  SPRING_DATASOURCE_USERNAME: sanad_contract
  SPRING_DATASOURCE_PASSWORD: sanad_contract_pass
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_FLYWAY_OUT_OF_ORDER: 'true'
  FLYWAY_ENABLED: 'true'
  JPA_DDL_AUTO: validate

jobs:
  contract-validation:
    name: CRM API Contract One-Shot Synchronization
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanad_contract
          POSTGRES_PASSWORD: sanad_contract_pass
          POSTGRES_DB: sanad_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanad_contract -d sanad_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact PR SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Validate governance inputs
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/crm/api-contract-governance-check.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/sanad-platform/src/test/java/com/sanad/platform/crm/contract/CrmOpenApiContractTest.java')
          text=p.read_text(encoding='utf-8')
          text=text.replace('EXPECTED_OPERATIONS = 192', 'EXPECTED_OPERATIONS = 193')
          if 'EXPECTED_PATHS = 147' not in text or 'EXPECTED_OPERATIONS = 193' not in text:
              raise SystemExit('CRM contract count markers not in expected state')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Start governed PostgreSQL-backed backend
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -euo pipefail
          nohup mvn -q -DskipTests spring-boot:run \
            -Dspring-boot.run.profiles=local \
            -Dspring-boot.run.arguments="--server.port=8081 --management.endpoints.web.exposure.include=health" \
            > /tmp/crm-openapi-backend.log 2>&1 &
          echo $! > /tmp/crm-openapi-backend.pid

      - name: Fetch runtime OpenAPI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            if ! kill -0 "$(cat /tmp/crm-openapi-backend.pid)" 2>/dev/null; then
              tail -200 /tmp/crm-openapi-backend.log
              exit 1
            fi
            code="$(curl -sS -o /tmp/platform-openapi.json -w '%{http_code}' http://localhost:8081/v3/api-docs || true)"
            if [ "$code" = '200' ] && [ -s /tmp/platform-openapi.json ]; then exit 0; fi
            sleep 2
          done
          tail -200 /tmp/crm-openapi-backend.log
          exit 1

      - name: Generate canonical CRM contract at 147 paths / 193 operations
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/crm/filter-runtime-openapi.py \
            --input /tmp/platform-openapi.json \
            --output docs/crm/contracts/openapi/crm-openapi.json \
            --prefix /api/v2/crm \
            --expected-paths 147 \
            --expected-operations 193

      - name: Regenerate TypeScript from canonical contract
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run crm:generate-api-types
          npx tsc --noEmit --skipLibCheck lib/api/generated/crm-api-types.ts

      - name: Run CRM contract tests against synchronized artifact
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -Dtest='Crm*ContractTest' test

      - name: Verify pipeline V2 create contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          spec=json.loads(Path('docs/crm/contracts/openapi/crm-openapi.json').read_text(encoding='utf-8'))
          methods={'get','post','put','patch','delete','head','options','trace'}
          operations=sum(1 for item in spec['paths'].values() for m in item if m in methods)
          assert len(spec['paths']) == 147
          assert operations == 193
          post=spec['paths']['/pipelines']['post']
          assert '201' in post['responses'] and '200' not in post['responses']
          assert any(p.get('name') == 'Idempotency-Key' and p.get('in') == 'header' and p.get('required') is True for p in post.get('parameters', []))
          assert post.get('operationId') == 'createPipeline'
          print('Pipeline V2 create contract: PASS')
          PY

      - name: Commit synchronized governed artifacts
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'snad-ci-contract-sync'
          git config user.email 'snad-ci-contract-sync@users.noreply.github.com'
          git add \
            docs/crm/contracts/openapi/crm-openapi.json \
            apps/web/lib/api/generated/crm-api-types.ts \
            apps/sanad-platform/src/test/java/com/sanad/platform/crm/contract/CrmOpenApiContractTest.java
          git diff --cached --check
          git commit -m 'chore(crm): synchronize pipeline V2 OpenAPI contract'
          git push origin HEAD:hotfix/post-881-final-gates

      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/crm-openapi-backend.pid ]; then
            kill "$(cat /tmp/crm-openapi-backend.pid)" 2>/dev/null || true
          fi
