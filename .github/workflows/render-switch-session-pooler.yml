name: Render Switch to Session Pooler (5432) + Verify

# Phase 7 single fix per user's EXEC prompt:
# Change ONLY the port in DATABASE_URL and SPRING_FLYWAY_URL from 6543 (Transaction
# pooler) to 5432 (Session pooler). The username is already correct
# (postgres.hxhvfqxzigrqoxxnnzje — verified via render-routing-extended-diagnostic.yml
# run 32010710882 on 2026-08-17). No password/JWT/CRM/heap/JPA/Flyway-mode changes.
#
# Flow:
#   1. Suspend srv-d8ragqkm0tmc73bviqq0
#   2. Verify ACTIVE_INSTANCES=0
#   3. Read current DATABASE_URL and SPRING_FLYWAY_URL
#   4. Compute new values with port=5432 (preserve all other params)
#   5. PUT DATABASE_URL (only the port changes)
#   6. PUT SPRING_FLYWAY_URL (only the port changes; if it was missing, leave missing)
#   7. Resume the SAME service (do not create sanad-backend-v2 or v3)
#   8. Poll /actuator/health for HTTP 200 / status=UP
#   9. Fetch logs, search for ENOIDENTIFIER (Phase 6 success condition)
#  10. Print ENOIDENTIFIER_AFTER_FIX=ABSENT|PRESENT
#
# This workflow uses Production environment secrets RENDER_API_KEY and
# RENDER_SERVICE_ID. It does NOT print passwords or JWT secrets.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'switch-to-5432' to confirm the single port change"
        required: true
        default: "no"

permissions:
  contents: read

jobs:
  switch-and-verify:
    name: Switch DATABASE_URL + SPRING_FLYWAY_URL port 6543→5432 and verify boot
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    steps:
      - name: Confirm intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "switch-to-5432" ]; then
            echo "::error::Confirmation input must be 'switch-to-5432'. Got: ${{ github.event.inputs.confirm }}"
            exit 1
          fi
          echo "Confirmation accepted: switch-to-5432"

      - name: Suspend + Switch port + Resume + Verify
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          BASE="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"
          EXPECTED_USERNAME="postgres.hxhvfqxzigrqoxxnnzje"

          echo "========================================"
          echo "PHASE 7 — SAFE RENDER MUTATION"
          echo "========================================"
          echo ""
          echo "Service: ${RENDER_SERVICE_ID}"
          echo "Single change: DATABASE_URL + SPRING_FLYWAY_URL port 6543 → 5432"
          echo "All other env vars: UNCHANGED"
          echo ""

          # ----- STEP 1: Suspend service -----
          echo "=== STEP 1: Suspend service ==="
          HTTP=$(curl -s -o /tmp/suspend.json -w "%{http_code}" --max-time 30 -X POST \
            -H "$AUTH" -H 'Accept: application/json' "$BASE/suspend")
          echo "POST /suspend -> HTTP $HTTP"
          cat /tmp/suspend.json | jq '. | {id, name, status, suspendedAt: (.suspendedAt // null)}' 2>/dev/null || cat /tmp/suspend.json
          echo ""
          echo "Waiting 15s for suspend to take effect..."
          sleep 15

          # ----- STEP 2: Verify ACTIVE_INSTANCES=0 -----
          echo "=== STEP 2: Verify ACTIVE_INSTANCES=0 ==="
          curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE" > /tmp/svc.json
          ACTIVE=$(jq -r '.serviceDetails.activeInstances // .activeInstances // "unknown"' /tmp/svc.json)
          STATUS=$(jq -r '.status // "unknown"' /tmp/svc.json)
          echo "ACTIVE_INSTANCES = $ACTIVE"
          echo "STATUS = $STATUS"
          if [ "$ACTIVE" != "0" ] && [ "$STATUS" != "suspended" ]; then
            echo "::warning::Service not yet fully suspended; waiting another 30s..."
            sleep 30
            curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE" > /tmp/svc.json
            ACTIVE=$(jq -r '.serviceDetails.activeInstances // .activeInstances // "unknown"' /tmp/svc.json)
            STATUS=$(jq -r '.status // "unknown"' /tmp/svc.json)
            echo "After 30s wait: ACTIVE_INSTANCES = $ACTIVE, STATUS = $STATUS"
          fi
          echo ""

          # ----- STEP 3: Read current DATABASE_URL and SPRING_FLYWAY_URL -----
          echo "=== STEP 3: Read current DATABASE_URL + SPRING_FLYWAY_URL ==="
          DB_URL=$(curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/env-vars/DATABASE_URL" | jq -r '(.envVar // .).value // empty')
          SF_URL=$(curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/env-vars/SPRING_FLYWAY_URL" | jq -r '(.envVar // .).value // empty')

          if [ -z "$DB_URL" ]; then
            echo "::error::DATABASE_URL is missing — cannot proceed"
            exit 1
          fi
          echo "Current DATABASE_URL:"
          # Mask password if embedded (there isn't one in current config)
          echo "  $DB_URL" | sed -E 's#(://[^:]+:)[^@]+@#\1***@#g'
          if [ -n "$SF_URL" ]; then
            echo "Current SPRING_FLYWAY_URL:"
            echo "  $SF_URL" | sed -E 's#(://[^:]+:)[^@]+@#\1***@#g'
          else
            echo "Current SPRING_FLYWAY_URL: MISSING (will leave as-is)"
          fi
          echo ""

          # ----- STEP 4: Compute new URL values (only port change) -----
          echo "=== STEP 4: Compute new URL values (port 6543 → 5432) ==="
          # Replace ONLY :6543 with :5432 in the URL. If URL doesn't contain :6543, no-op.
          NEW_DB_URL=$(echo "$DB_URL" | sed -E 's#:6543\b#:5432#g')
          if [ "$NEW_DB_URL" = "$DB_URL" ]; then
            echo "::warning::DATABASE_URL does not contain :6543 — no port change needed; URL unchanged"
          else
            echo "New DATABASE_URL:"
            echo "  $NEW_DB_URL" | sed -E 's#(://[^:]+:)[^@]+@#\1***@#g'
          fi

          if [ -n "$SF_URL" ]; then
            NEW_SF_URL=$(echo "$SF_URL" | sed -E 's#:6543\b#:5432#g')
            if [ "$NEW_SF_URL" = "$SF_URL" ]; then
              echo "::warning::SPRING_FLYWAY_URL does not contain :6543 — no port change; URL unchanged"
            else
              echo "New SPRING_FLYWAY_URL:"
              echo "  $NEW_SF_URL" | sed -E 's#(://[^:]+:)[^@]+@#\1***@#g'
            fi
          else
            NEW_SF_URL=""
          fi
          echo ""

          # ----- STEP 5: PUT DATABASE_URL -----
          if [ "$NEW_DB_URL" != "$DB_URL" ]; then
            echo "=== STEP 5: PUT DATABASE_URL (port 5432) ==="
            jq -n --arg value "$NEW_DB_URL" '{value:$value}' > /tmp/db-body.json
            HTTP=$(curl -s -o /tmp/db-resp.json -w "%{http_code}" --max-time 45 -X PUT \
              -H "$AUTH" -H 'Accept: application/json' -H 'Content-Type: application/json' \
              --data @/tmp/db-body.json "$BASE/env-vars/DATABASE_URL")
            echo "PUT DATABASE_URL -> HTTP $HTTP"
            test "$HTTP" -ge 200 -a "$HTTP" -lt 300 || { echo "::error::PUT DATABASE_URL failed"; cat /tmp/db-resp.json; exit 1; }
            echo ""
          else
            echo "=== STEP 5: Skipped (DATABASE_URL unchanged) ==="
            echo ""
          fi

          # ----- STEP 6: PUT SPRING_FLYWAY_URL -----
          if [ -n "$NEW_SF_URL" ] && [ "$NEW_SF_URL" != "$SF_URL" ]; then
            echo "=== STEP 6: PUT SPRING_FLYWAY_URL (port 5432) ==="
            jq -n --arg value "$NEW_SF_URL" '{value:$value}' > /tmp/sf-body.json
            HTTP=$(curl -s -o /tmp/sf-resp.json -w "%{http_code}" --max-time 45 -X PUT \
              -H "$AUTH" -H 'Accept: application/json' -H 'Content-Type: application/json' \
              --data @/tmp/sf-body.json "$BASE/env-vars/SPRING_FLYWAY_URL")
            echo "PUT SPRING_FLYWAY_URL -> HTTP $HTTP"
            test "$HTTP" -ge 200 -a "$HTTP" -lt 300 || { echo "::error::PUT SPRING_FLYWAY_URL failed"; cat /tmp/sf-resp.json; exit 1; }
            echo ""
          else
            echo "=== STEP 6: Skipped (SPRING_FLYWAY_URL unchanged or missing) ==="
            echo ""
          fi

          # ----- STEP 7: Resume the SAME service -----
          echo "=== STEP 7: Resume the SAME service (no sanad-backend-v2/v3) ==="
          HTTP=$(curl -s -o /tmp/resume.json -w "%{http_code}" --max-time 30 -X POST \
            -H "$AUTH" -H 'Accept: application/json' "$BASE/resume")
          echo "POST /resume -> HTTP $HTTP"
          cat /tmp/resume.json | jq '. | {id, name, status, resumedAt: (.resumedAt // null)}' 2>/dev/null || cat /tmp/resume.json
          echo ""

          # ----- STEP 8: Wait for boot + check /actuator/health -----
          echo "=== STEP 8: Wait for boot + check /actuator/health ==="
          echo "Waiting 60s for Spring Boot to start (Flyway + Hibernate init)..."
          sleep 60
          # Try to get the public URL
          SVC_URL=$(jq -r '.serviceDetails.url // .url // empty' /tmp/svc.json)
          if [ -z "$SVC_URL" ]; then
            # Fallback: hardcoded URL from previous diagnostics
            SVC_URL="https://sanad-backend-mcrj.onrender.com"
          fi
          echo "Service URL: $SVC_URL"

          # Poll /actuator/health up to 4 minutes
          HEALTH_STATUS="unknown"
          for i in $(seq 1 16); do
            sleep 15
            HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 15 "$SVC_URL/actuator/health" || echo "000")
            HEALTH_STATUS=$(jq -r '.status // "unknown"' /tmp/health.json 2>/dev/null || echo "unknown")
            echo "  Attempt $i ($((60+i*15))s): HTTP $HTTP_CODE, status=$HEALTH_STATUS"
            if [ "$HTTP_CODE" = "200" ] && [ "$HEALTH_STATUS" = "UP" ]; then
              echo "::notice::HEALTH=UP after $((60+i*15))s"
              break
            fi
          done
          echo ""
          echo "Final health:"
          echo "  HTTP=$HTTP_CODE"
          echo "  STATUS=$HEALTH_STATUS"
          echo ""

          # ----- STEP 9: Fetch logs + search ENOIDENTIFIER -----
          echo "=== STEP 9: Fetch runtime logs + search ENOIDENTIFIER ==="
          LOGS=$(curl -s --max-time 30 -H "$AUTH" "$BASE/logs?limit=500" || true)
          if [ -z "$LOGS" ]; then
            echo "WARN: /logs endpoint returned empty"
            ENOID_COUNT=0
          else
            ENOID_COUNT=$(echo "$LOGS" | grep -c "ENOIDENTIFIER" || echo "0")
            echo "ENOIDENTIFIER occurrences in last 500 log lines: $ENOID_COUNT"
            if [ "$ENOID_COUNT" -gt 0 ]; then
              echo ""
              echo "--- First ENOIDENTIFIER stack trace context ---"
              LINE_NUM=$(echo "$LOGS" | grep -n "ENOIDENTIFIER" | head -1 | cut -d: -f1)
              START=$((LINE_NUM > 30 ? LINE_NUM - 30 : 1))
              END=$((LINE_NUM + 20))
              echo "$LOGS" | sed -n "${START},${END}p"
            fi
          fi

          # ----- STEP 10: Print success/failure summary -----
          echo ""
          echo "========================================"
          echo "PHASE 6 — SUCCESS CONDITION"
          echo "========================================"
          if [ "$ENOID_COUNT" -eq 0 ] && [ "$HEALTH_STATUS" = "UP" ]; then
            echo "ENOIDENTIFIER_AFTER_FIX=ABSENT ✅"
            echo "HEALTH=UP"
            echo "ROOT_CAUSE=POOLER_PORT_WAS_TRANSACTION_MODE_6543 (username was always correct)"
            echo "PR879_REQUIRED=NO (already merged but unnecessary — port fix alone suffices)"
            echo "DEPLOY_STATUS=LIVE"
          elif [ "$ENOID_COUNT" -eq 0 ]; then
            echo "ENOIDENTIFIER_AFTER_FIX=ABSENT ✅"
            echo "HEALTH=$HEALTH_STATUS (not yet UP — investigate next runtime error)"
            echo "ROOT_CAUSE=POOLER_PORT_WAS_TRANSACTION_MODE_6543"
            echo "PR879_REQUIRED=NO"
            echo "DEPLOY_STATUS=PARTIAL"
          else
            echo "ENOIDENTIFIER_AFTER_FIX=PRESENT ❌"
            echo "HEALTH=$HEALTH_STATUS"
            echo "ROOT_CAUSE=NOT_THE_PORT — investigate Phase 7 SNI reproduction"
            echo "PR879_REQUIRED=POSSIBLY (still under investigation)"
            echo "DEPLOY_STATUS=FAILED"
          fi
          echo ""
          echo "========================================"
          echo "PHASE 6 COMPLETE"
          echo "========================================"
