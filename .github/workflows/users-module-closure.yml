name: Users Module Closure

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sanad-platform/**'
      - 'apps/web/app/management/users/**'
      - 'apps/web/app/management/access/**'
      - 'apps/web/app/executive/users/**'
      - 'apps/web/app/executive/access/**'
      - 'apps/web/e2e/users-module-authenticated.spec.ts'
      - 'apps/web/e2e/users-module-visual.spec.ts'
      - 'apps/web/e2e/users-module-visual-helpers.ts'
      - 'apps/web/playwright.users-module.config.ts'
      - 'apps/web/playwright.standard.config.ts'
      - 'tests/ci/test_users_module_closure_workflow.py'
      - '.github/workflows/users-module-closure.yml'
  push:
    branches: [main]
    paths:
      - 'apps/sanad-platform/**'
      - 'apps/web/app/management/users/**'
      - 'apps/web/app/management/access/**'
      - 'apps/web/app/executive/users/**'
      - 'apps/web/app/executive/access/**'
      - 'apps/web/e2e/users-module-*.ts'
      - 'apps/web/playwright.users-module.config.ts'
      - '.github/workflows/users-module-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: users-module-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  users-module-closure:
    name: Users Module Authenticated Closure
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/users_module_closure
      DATABASE_USERNAME: users_module_closure
      DATABASE_NAME: users_module_closure
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/users_module_closure
      SPRING_DATASOURCE_USERNAME: users_module_closure
      SPRING_PROFILES_ACTIVE: local
      SPRING_FLYWAY_OUT_OF_ORDER: 'true'
      FLYWAY_ENABLED: 'true'
      FLYWAY_BASELINE_ON_MIGRATE: 'true'
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      JPA_DDL_AUTO: validate
      SERVER_PORT: '8080'
      JWT_ISSUER: sanad-users-module-ci
      JWT_ACCESS_TOKEN_TTL: 60m
      REFRESH_TOKEN_TTL: 720h
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
      BOOTSTRAP_ENABLED: 'false'
      SECURITY_NOTIFICATION_PROVIDER: disabled
      SANAD_CORS_ALLOWED_ORIGINS: http://127.0.0.1:3001
      BACKEND_API_BASE_URL: http://127.0.0.1:8080
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
      USERS_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      USERS_TENANT_EMAIL: g2-hr@g2-acceptance.example
      USERS_TENANT_ID: 33333333-3333-4333-8333-333333333331
      USERS_CROSS_TENANT_ID: 00000000-0000-0000-0000-000000000001
      USERS_CONTROL_EMAIL: snad.ai.app@gmail.com
      USERS_CONTROL_TENANT_ID: 00000000-0000-0000-0000-000000000001
      CRM_TENANT_B_EMAIL: g2-hr@g2-acceptance.example
      CRM_TENANT_B_ID: 33333333-3333-4333-8333-333333333331

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "candidate_sha=$CANDIDATE_SHA"

      - name: Verify closure workflow contract
        shell: bash
        run: python3 tests/ci/test_users_module_closure_workflow.py

      - name: Generate ephemeral per-run credentials
        shell: bash
        run: |
          set -euo pipefail
          DB_CRED="$(openssl rand -hex 24)"
          E2E_CRED="$(openssl rand -hex 24)"
          CRM_KEY="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$DB_CRED"
          echo "::add-mask::$E2E_CRED"
          echo "::add-mask::$CRM_KEY"
          echo "DATABASE_PASSWORD=$DB_CRED" >> "$GITHUB_ENV"
          echo "SPRING_DATASOURCE_PASSWORD=$DB_CRED" >> "$GITHUB_ENV"
          echo "PGPASSWORD=$DB_CRED" >> "$GITHUB_ENV"
          echo "USERS_E2E_PASSWORD=$E2E_CRED" >> "$GITHUB_ENV"
          echo "USERS_TENANT_PASSWORD=$E2E_CRED" >> "$GITHUB_ENV"
          echo "USERS_CONTROL_PASSWORD=$E2E_CRED" >> "$GITHUB_ENV"
          echo "CRM_CUSTOM_FIELD_ENCRYPTION_KEY=$CRM_KEY" >> "$GITHUB_ENV"

      - name: Start host-native PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null
          command -v pg_isready >/dev/null
          sudo systemctl start postgresql
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432

      - name: Provision disposable database and least-privilege role
        shell: bash
        run: |
          set -euo pipefail
          sudo -u postgres psql \
            -v ON_ERROR_STOP=1 \
            -v db_credential="$DATABASE_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE users_module_closure WITH LOGIN PASSWORD %L', :'db_credential')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'users_module_closure')
          \gexec
          SELECT format('ALTER ROLE users_module_closure WITH LOGIN PASSWORD %L', :'db_credential')
          WHERE EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'users_module_closure')
          \gexec
          ALTER ROLE users_module_closure NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          SELECT 'CREATE DATABASE users_module_closure OWNER users_module_closure'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'users_module_closure')
          \gexec
          ALTER DATABASE users_module_closure OWNER TO users_module_closure;
          GRANT CONNECT ON DATABASE postgres TO users_module_closure;
          \c users_module_closure
          GRANT USAGE, CREATE ON SCHEMA public TO users_module_closure;
          SQL

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend JAR
        working-directory: apps/sanad-platform
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dmaven.test.skip=true clean package

      - name: Apply Flyway migrations
        working-directory: apps/sanad-platform
        run: >-
          mvn --batch-mode --no-transfer-progress flyway:migrate
          -Dflyway.url="$DATABASE_URL"
          -Dflyway.user="$DATABASE_USERNAME"
          -Dflyway.password="$DATABASE_PASSWORD"
          -Dflyway.locations=classpath:db/migration,classpath:db/vendor/postgresql
          -Dflyway.baselineOnMigrate=true
          -Dflyway.validateOnMigrate=false
          -Dflyway.outOfOrder=true
          -Dflyway.baselineVersion=0

      - name: Seed authenticated Tenant B and canonical control-plane owner
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" \
            -v ON_ERROR_STOP=1 \
            -v g2_e2e_password="$USERS_E2E_PASSWORD" \
            -f apps/sanad-platform/src/test/resources/sql/g2-acceptance-seed.sql
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" \
            -v ON_ERROR_STOP=1 \
            -v users_e2e_password="$USERS_E2E_PASSWORD" \
            -f apps/sanad-platform/src/test/resources/sql/users-module-closure-seed.sql

      - name: Verify authenticated fixtures
        shell: bash
        run: |
          set -euo pipefail
          tenant_psql() {
            PGPASSWORD="$DATABASE_PASSWORD" PGOPTIONS="-c app.tenant_id=$USERS_TENANT_ID" \
              psql -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" -Atc "$1"
          }
          control_psql() {
            PGPASSWORD="$DATABASE_PASSWORD" PGOPTIONS="-c app.tenant_id=$USERS_CONTROL_TENANT_ID" \
              psql -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" -Atc "$1"
          }
          test "$(tenant_psql "SELECT COUNT(*) FROM users WHERE tenant_id='$USERS_TENANT_ID' AND lower(email)=lower('$USERS_TENANT_EMAIL') AND status='ACTIVE'")" = "1"
          test "$(control_psql "SELECT COUNT(*) FROM users WHERE tenant_id='$USERS_CONTROL_TENANT_ID' AND lower(email)=lower('$USERS_CONTROL_EMAIL') AND status='ACTIVE'")" = "1"
          READ_CAPS=$(tenant_psql "SELECT COUNT(DISTINCT cap.code) FROM user_role_assignments ura JOIN role_capabilities rc ON rc.tenant_id=ura.tenant_id AND rc.role_id=ura.role_id JOIN access_capabilities cap ON cap.id=rc.capability_id WHERE ura.tenant_id='$USERS_TENANT_ID' AND ura.user_id='33333333-3333-4333-8333-333333333343' AND ura.status='ACTIVE' AND cap.code IN ('USER.READ','MEMBERSHIP.READ','ROLE.READ','CAPABILITY.READ')")
          test "$READ_CAPS" = "4"
          WRITE_CAPS=$(tenant_psql "SELECT COUNT(DISTINCT cap.code) FROM user_role_assignments ura JOIN role_capabilities rc ON rc.tenant_id=ura.tenant_id AND rc.role_id=ura.role_id JOIN access_capabilities cap ON cap.id=rc.capability_id WHERE ura.tenant_id='$USERS_TENANT_ID' AND ura.user_id='33333333-3333-4333-8333-333333333343' AND ura.status='ACTIVE' AND cap.code IN ('ROLE.MANAGE','CAPABILITY.MANAGE')")
          test "$WRITE_CAPS" = "0"

      - name: Start backend
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*original*' | head -n 1)"
          test -n "$JAR"
          nohup java -jar "$JAR" > "$RUNNER_TEMP/users-module-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/users-module-backend.pid"
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/users-module-backend.log"
          exit 1

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies and browser
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: apps/web
        run: npm run build

      - name: Verify dedicated spec routing
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          STANDARD="$(npx playwright test --config=playwright.standard.config.ts --list 2>&1 || true)"
          test "$(printf '%s' "$STANDARD" | grep -c 'users-module-authenticated.spec.ts' || true)" = "0"
          test "$(printf '%s' "$STANDARD" | grep -c 'users-module-visual.spec.ts' || true)" = "0"
          DEDICATED="$(npx playwright test --config=playwright.users-module.config.ts --list 2>&1)"
          test "$(printf '%s' "$DEDICATED" | grep -c 'users-module-authenticated.spec.ts' || true)" -ge "1"
          test "$(printf '%s' "$DEDICATED" | grep -c 'users-module-visual.spec.ts' || true)" -ge "2"

      - name: Start frontend
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run start -- -p 3001 > "$RUNNER_TEMP/users-module-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/users-module-web.pid"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/users-module-web.log"
          exit 1

      - name: Run users-module-authenticated.spec.ts and users-module-visual.spec.ts
        working-directory: apps/web
        run: |
          rm -rf test-results/users-module-visual-evidence
          npx playwright test --config=playwright.users-module.config.ts

      - name: Verify required desktop and mobile evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="apps/web/test-results/users-module-visual-evidence"
          test -s "$ROOT/manifest.ndjson"
          required=(
            desktop/management-users.png
            desktop/management-user-detail.png
            desktop/management-access.png
            desktop/executive-users.png
            desktop/executive-user-detail.png
            desktop/executive-access.png
            mobile/management-users.png
            mobile/management-user-detail.png
            mobile/management-access.png
            mobile/executive-users.png
            mobile/executive-user-detail.png
            mobile/executive-access.png
          )
          for rel in "${required[@]}"; do
            test -s "$ROOT/$rel" || { echo "::error::missing visual evidence $rel"; exit 1; }
            grep -q "\"file\":\"$rel\"" "$ROOT/manifest.ndjson" || { echo "::error::manifest missing $rel"; exit 1; }
          done
          LINES=$(wc -l < "$ROOT/manifest.ndjson")
          test "$LINES" -ge 12
          SHA_LINES=$(grep -c "$USERS_CANDIDATE_SHA" "$ROOT/manifest.ndjson" || true)
          test "$SHA_LINES" -ge 12

      - name: Upload exact-SHA Users Module evidence
        uses: actions/upload-artifact@v4
        with:
          name: users-module-visual-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/web/test-results/users-module-visual-evidence/
          if-no-files-found: error
          retention-days: 30
