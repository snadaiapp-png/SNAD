          sb_query "SELECT qual::text AS value FROM pg_policies WHERE tablename='crm_contacts' AND policyname='crm_contacts_tenant_isolation';" true
          [ "$sb_query_http" = "201" ] || { echo "::error::policy qual query failed"; exit 1; }
          # Item 2/3 (v6.1): Use sb_text_value (preserves whitespace) for policy text.
          # Semantic verification: tenant_id comparison + current_setting present,
          # no IS NULL bypass, no permissive OR bypass.
          POLICY_USING=$(sb_text_value)
          echo "POLICY_USING=$POLICY_USING"
          # Require tenant_id comparison present
          echo "$POLICY_USING" | grep -qi "tenant_id" || { echo "::error::Policy USING missing tenant_id comparison"; echo "POLICY_USING_TENANT_COMPARISON=FAIL"; exit 1; }
          echo "POLICY_USING_TENANT_COMPARISON=PASS"
          # Require current_setting('app.tenant_id', true) present
          echo "$POLICY_USING" | grep -qi "current_setting.*app.tenant_id" || { echo "::error::Policy USING missing current_setting('app.tenant_id')"; exit 1; }
          # No IS NULL bypass
          echo "$POLICY_USING" | grep -qi "IS NULL" && { echo "::error::Policy USING contains IS NULL — fail-open risk"; echo "POLICY_USING_FAIL_CLOSED=FAIL"; exit 1; }
          echo "POLICY_USING_FAIL_CLOSED=PASS"

          # Item 10: Verify WITH CHECK clause is fail-closed
          sb_query "SELECT with_check::text AS value FROM pg_policies WHERE tablename='crm_contacts' AND policyname='crm_contacts_tenant_isolation';" true
          [ "$sb_query_http" = "201" ] || { echo "::error::policy with_check query failed"; exit 1; }
          POLICY_WCHECK=$(sb_text_value)
          echo "POLICY_WITH_CHECK=$POLICY_WCHECK"
          # Require tenant_id comparison present
          echo "$POLICY_WCHECK" | grep -qi "tenant_id" || { echo "::error::Policy WITH CHECK missing tenant_id comparison"; echo "POLICY_WITH_CHECK_TENANT_COMPARISON=FAIL"; exit 1; }
          echo "POLICY_WITH_CHECK_TENANT_COMPARISON=PASS"
          # Require current_setting present
          echo "$POLICY_WCHECK" | grep -qi "current_setting.*app.tenant_id" || { echo "::error::Policy WITH CHECK missing current_setting('app.tenant_id')"; exit 1; }
          # No IS NULL bypass
          echo "$POLICY_WCHECK" | grep -qi "IS NULL" && { echo "::error::Policy WITH CHECK contains IS NULL — fail-open risk"; echo "POLICY_WITH_CHECK_FAIL_CLOSED=FAIL"; exit 1; }
          echo "POLICY_WITH_CHECK_FAIL_CLOSED=PASS"

          # =================================================================
          # Item 18: REVOKE flyway_schema_history write from sanad
          # =================================================================
          echo "===== Item 18: Revoke flyway_schema_history write from sanad ====="
          sb_query "REVOKE INSERT, UPDATE, DELETE ON TABLE public.flyway_schema_history FROM sanad;" false
          [ "$sb_query_http" = "201" ] || { echo "::error::REVOKE failed: HTTP $sb_query_http"; exit 1; }
          echo "REVOKE_FLYWAY_HISTORY_WRITE=PASS"

          # Verify: has_table_privilege should return false for INSERT/UPDATE/DELETE
          sb_query "SELECT (CASE WHEN has_table_privilege('sanad','public.flyway_schema_history','INSERT') THEN 't' ELSE 'f' END || '|' || CASE WHEN has_table_privilege('sanad','public.flyway_schema_history','UPDATE') THEN 't' ELSE 'f' END || '|' || CASE WHEN has_table_privilege('sanad','public.flyway_schema_history','DELETE') THEN 't' ELSE 'f' END) AS value;" true
          [ "$sb_query_http" = "201" ] || { echo "::error::has_table_privilege query failed"; exit 1; }
          FLYWAY_PRIVS=$(sb_value)
          echo "SANAD_FLYWAY_PRIVILEGES=$FLYWAY_PRIVS (expect f|f|f or false|false|false)"
          echo "$FLYWAY_PRIVS" | grep -qE "^(f|false)\|(f|false)\|(f|false)$" || { echo "::error::sanad still has write on flyway_schema_history"; echo "SANAD_FLYWAY_LEDGER_WRITE_ACCESS=YES"; exit 1; }
          echo "SANAD_FLYWAY_LEDGER_WRITE_ACCESS=NO"

          # Verify sanad does not own application tables
          sb_query "SELECT COUNT(*)::text AS value FROM pg_tables WHERE schemaname='public' AND tableowner='sanad';" true
          [ "$sb_query_http" = "201" ] || { echo "::error::table owner query failed"; exit 1; }
          SANAD_OWNER_COUNT=$(sb_value)
