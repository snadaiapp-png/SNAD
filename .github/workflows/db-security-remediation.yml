          VALUES ('$CONTACT_B'::uuid, '$TENANT_B'::uuid, 0, 'FixtureB', 'FixtureB', 'fixtureb', 'ACTIVE', 'UNKNOWN', '$USER_B'::uuid, '$USER_B'::uuid, now(), now(), NULL);
          INSERT INTO crm_entity_participants (id, tenant_id, version, entity_type, entity_id, user_id, role, added_at, added_by)
          VALUES ('$PARTICIPANT_B'::uuid, '$TENANT_B'::uuid, 0, 'CONTACT', '$CONTACT_B'::uuid, '$USER_B'::uuid, 'COLLABORATOR', now(), '$USER_B'::uuid);

          -- POSITIVE A PROOF: tenant A context → expect 1
          SELECT set_config('app.tenant_id', '$TENANT_A', true);
          SELECT 'POSITIVE_CONTACT_A' AS label, COUNT(*)::text AS value FROM crm_contacts WHERE id='$CONTACT_A'::uuid;
          SELECT 'POSITIVE_PARTICIPANT_A' AS label, COUNT(*)::text AS value FROM crm_entity_participants WHERE id='$PARTICIPANT_A'::uuid;

