          echo "POSITIVE_PARTICIPANT_B=$POSITIVE_PARTICIPANT_B (expect 1)"
          echo "CROSS_CONTACT_B_FROM_A=$CROSS_CONTACT_B_FROM_A (expect 0)"
          echo "CROSS_PARTICIPANT_B_FROM_A=$CROSS_PARTICIPANT_B_FROM_A (expect 0)"
          echo "CROSS_CONTACT_A_FROM_B=$CROSS_CONTACT_A_FROM_B (expect 0)"
          echo "CROSS_PARTICIPANT_A_FROM_B=$CROSS_PARTICIPANT_A_FROM_B (expect 0)"

          RLS_RUNTIME_PROOF=PASS
          [ "$POSITIVE_CONTACT_A" = "1" ] || { echo "::error::POSITIVE_CONTACT_A=$POSITIVE_CONTACT_A"; RLS_RUNTIME_PROOF=FAIL; }
          [ "$POSITIVE_PARTICIPANT_A" = "1" ] || { echo "::error::POSITIVE_PARTICIPANT_A=$POSITIVE_PARTICIPANT_A"; RLS_RUNTIME_PROOF=FAIL; }
          [ "$POSITIVE_CONTACT_B" = "1" ] || { echo "::error::POSITIVE_CONTACT_B=$POSITIVE_CONTACT_B"; RLS_RUNTIME_PROOF=FAIL; }
          [ "$POSITIVE_PARTICIPANT_B" = "1" ] || { echo "::error::POSITIVE_PARTICIPANT_B=$POSITIVE_PARTICIPANT_B"; RLS_RUNTIME_PROOF=FAIL; }
          [ "$RLS_RUNTIME_PROOF" = "PASS" ] && echo "POSITIVE_FIXTURE_ASSERTIONS_BOTH_TENANTS=PASS"

          [ "$CROSS_CONTACT_B_FROM_A" = "0" ] || { echo "::error::CROSS_CONTACT_B_FROM_A=$CROSS_CONTACT_B_FROM_A"; RLS_RUNTIME_PROOF=FAIL; }
          [ "$CROSS_PARTICIPANT_B_FROM_A" = "0" ] || { echo "::error::CROSS_PARTICIPANT_B_FROM_A=$CROSS_PARTICIPANT_B_FROM_A"; RLS_RUNTIME_PROOF=FAIL; }
          [ "$RLS_RUNTIME_PROOF" = "PASS" ] && echo "CROSS_TENANT_A_TO_B=PASS"

          [ "$CROSS_CONTACT_A_FROM_B" = "0" ] || { echo "::error::CROSS_CONTACT_A_FROM_B=$CROSS_CONTACT_A_FROM_B"; RLS_RUNTIME_PROOF=FAIL; }
          [ "$CROSS_PARTICIPANT_A_FROM_B" = "0" ] || { echo "::error::CROSS_PARTICIPANT_A_FROM_B=$CROSS_PARTICIPANT_A_FROM_B"; RLS_RUNTIME_PROOF=FAIL; }
          [ "$RLS_RUNTIME_PROOF" = "PASS" ] && echo "CROSS_TENANT_B_TO_A=PASS"

          [ "$RLS_RUNTIME_PROOF" = "PASS" ] || { echo "::error::RLS runtime assertions FAILED"; exit 1; }
          echo "RLS_FIXTURE_OUTPUT_PARSE=PASS"
          echo "RLS_RUNTIME_PROOF=PASS"

          # =================================================================
          # PHASE 9B-3 — POST-ROLLBACK VERIFICATION (Item 14: privileged Management API)
          # =================================================================
          echo "===== PHASE 9B-3: Post-rollback fixture verification ====="
          sb_query "SELECT COUNT(*)::text AS value FROM crm_contacts WHERE id='$CONTACT_A'::uuid;" true
          [ "$sb_query_http" = "201" ] || { echo "::error::post-rollback query failed"; exit 1; }
          POST_RB_CONTACT_A=$(sb_value)
          echo "POST_ROLLBACK_CONTACT_A=$POST_RB_CONTACT_A (expect 0)"

          sb_query "SELECT COUNT(*)::text AS value FROM crm_contacts WHERE id='$CONTACT_B'::uuid;" true
          [ "$sb_query_http" = "201" ] || { echo "::error::post-rollback query failed"; exit 1; }
          POST_RB_CONTACT_B=$(sb_value)
          echo "POST_ROLLBACK_CONTACT_B=$POST_RB_CONTACT_B (expect 0)"

          sb_query "SELECT COUNT(*)::text AS value FROM crm_entity_participants WHERE id='$PARTICIPANT_A'::uuid;" true
          [ "$sb_query_http" = "201" ] || { echo "::error::post-rollback query failed"; exit 1; }
          POST_RB_PARTICIPANT_A=$(sb_value)
          echo "POST_ROLLBACK_PARTICIPANT_A=$POST_RB_PARTICIPANT_A (expect 0)"

          sb_query "SELECT COUNT(*)::text AS value FROM crm_entity_participants WHERE id='$PARTICIPANT_B'::uuid;" true
          [ "$sb_query_http" = "201" ] || { echo "::error::post-rollback query failed"; exit 1; }
          POST_RB_PARTICIPANT_B=$(sb_value)
          echo "POST_ROLLBACK_PARTICIPANT_B=$POST_RB_PARTICIPANT_B (expect 0)"

          FIXTURE_ROLLBACK_PROVEN=YES
          [ "$POST_RB_CONTACT_A" = "0" ] || { echo "::error::CONTACT_A leaked"; FIXTURE_ROLLBACK_PROVEN=NO; }
          [ "$POST_RB_CONTACT_B" = "0" ] || { echo "::error::CONTACT_B leaked"; FIXTURE_ROLLBACK_PROVEN=NO; }
          [ "$POST_RB_PARTICIPANT_A" = "0" ] || { echo "::error::PARTICIPANT_A leaked"; FIXTURE_ROLLBACK_PROVEN=NO; }
          [ "$POST_RB_PARTICIPANT_B" = "0" ] || { echo "::error::PARTICIPANT_B leaked"; FIXTURE_ROLLBACK_PROVEN=NO; }
          [ "$FIXTURE_ROLLBACK_PROVEN" = "YES" ] || { echo "::error::Fixture rollback verification FAILED"; exit 1; }
          echo "FIXTURE_ROLLBACK_PROVEN=YES"

          # =================================================================
          # Item 4 (v6.1): Non-vacuous WITH-CHECK runtime proof
          # Attempt cross-tenant INSERT (tenant_id=TENANT_B under TENANT_A GUC).
          # The INSERT MUST FAIL because WITH CHECK rejects it.
          # Execute inside a transaction that cannot commit.
          # =================================================================
          echo "===== Item 4: Cross-tenant WRITE denial (WITH CHECK proof) ====="
          CROSS_WRITE_UUID=$(openssl rand -hex 16 | sed 's/\(.\{8\}\)\(.\{4\}\)\(.\{4\}\)\(.\{4\}\)\(.\{12\}\)/\1-\2-\3-\4-\5/')
          echo "::add-mask::$CROSS_WRITE_UUID"

          cat > /tmp/cross_tenant_write_test.sql <<CROSSWRITESQL
          BEGIN;
          SELECT set_config('app.tenant_id', '$TENANT_A', true);
          -- Attempt INSERT with tenant_id=TENANT_B (cross-tenant write)
          INSERT INTO crm_contacts (id, tenant_id, version, given_name, display_name, normalized_name, lifecycle_status, consent_summary, created_by, updated_by, created_at, updated_at, owner_user_id)
          VALUES ('$CROSS_WRITE_UUID'::uuid, '$TENANT_B'::uuid, 0, 'CrossWrite', 'CrossWrite', 'crosswrite', 'ACTIVE', 'UNKNOWN', '$USER_A'::uuid, '$USER_A'::uuid, now(), now(), NULL);
          ROLLBACK;
          CROSSWRITESQL

          set +e
          CROSS_WRITE_OUT=$(PGPASSWORD="$RUNTIME_PASS" psql \
            -h "$POOLER_HOST" -p "$POOLER_PORT" -U "$POOLER_USER_SANAD" -d "$POOLER_DB" \
            -X -v ON_ERROR_STOP=1 -At -F '|' \
            -f /tmp/cross_tenant_write_test.sql 2>&1)
          CROSS_WRITE_RC=$?
          set -e
          rm -f /tmp/cross_tenant_write_test.sql
          echo "CROSS_WRITE_RC=$CROSS_WRITE_RC (expect non-zero — INSERT should fail)"

          if [ $CROSS_WRITE_RC -eq 0 ]; then
            echo "::error::Cross-tenant INSERT SUCCEEDED — WITH CHECK not enforced!"
            echo "CROSS_TENANT_WRITE_CONTACT_DENIED=NO"
            echo "RLS_WITH_CHECK_RUNTIME_PROOF=FAIL"
            exit 1
          fi
          echo "CROSS_TENANT_WRITE_CONTACT_DENIED=YES"

          # Verify privileged authority sees synthetic UUID count=0
          sb_query "SELECT COUNT(*)::text AS value FROM crm_contacts WHERE id='$CROSS_WRITE_UUID'::uuid;" true
          [ "$sb_query_http" = "201" ] || { echo "::error::cross-write post-verify query failed"; exit 1; }
          CROSS_WRITE_PERSISTED=$(sb_value)
          echo "CROSS_TENANT_WRITE_CONTACT_PERSISTED=$CROSS_WRITE_PERSISTED (expect 0)"
          [ "$CROSS_WRITE_PERSISTED" = "0" ] || { echo "::error::Cross-tenant write persisted — RLS WITH CHECK failed"; echo "RLS_WITH_CHECK_RUNTIME_PROOF=FAIL"; exit 1; }
          echo "RLS_WITH_CHECK_RUNTIME_PROOF=PASS"

          # =================================================================
          # PHASE 12 — RENDER SAVE-ONLY (Items 20-26)
          # =================================================================
          # Item 21: State machine
          RENDER_SAVE_STARTED=NO
          RENDER_SAVE_COMPLETED=NO
          RENDER_ROLLBACK_REQUIRED=NO
          RENDER_ROLLBACK_COMPLETED="N/A"
          RENDER_CONFIG_PARTIAL=NO

          if [ "$APPLY_RENDER" = "true" ]; then
            # 6 preconditions
            [ "$PHASE4_RESULT" = "PASS" ] || { echo "::error::apply_render forbidden: pooler login"; exit 1; }
            [ "$MIGRATION_SUCCESS_COUNT" = "2" ] || { echo "::error::apply_render forbidden: migration"; exit 1; }
            [ "$MIGRATION_IMMUTABILITY" = "PASS" ] || { echo "::error::apply_render forbidden: immutability"; exit 1; }
            [ "$RLS_RUNTIME_PROOF" = "PASS" ] || { echo "::error::apply_render forbidden: RLS runtime"; exit 1; }
            [ "$FIXTURE_ROLLBACK_PROVEN" = "YES" ] || { echo "::error::apply_render forbidden: rollback"; exit 1; }
            echo "RENDER_PRECONDITIONS=PASS"

            # Item 6: Recheck main before Render save
            echo "===== Pre-render main lock ====="
            verify_main_lock "PRE_RENDER_MAIN_LOCK" || exit 1

            echo "===== PHASE 12: Render save-only ====="
            POOLER_USER_SANAD_FULL="sanad.$SUPABASE_PROJECT"

            LAST_DEPLOY_BEFORE=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1" | jq -r '.[0].id // "never"')
            echo "LAST_DEPLOY_ID_BEFORE=$LAST_DEPLOY_BEFORE"

            # Item 20: Capture old values with normalized helper
            RENDER_ENV_BEFORE=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100")
            get_render_env() {
              local json="$1" key="$2"
              echo "$json" | jq -r --arg k "$key" '[.[]? | (.envVar // .)] | .[] | select(.key == $k) | .value // empty'
            }
            # Item 8 (v6.1): Capture BOTH existence AND value for each key.
            # Do NOT equate ABSENT with EMPTY STRING.
            OLD_DATABASE_USERNAME=$(get_render_env "$RENDER_ENV_BEFORE" "DATABASE_USERNAME")
            OLD_DATABASE_PASSWORD=$(get_render_env "$RENDER_ENV_BEFORE" "DATABASE_PASSWORD")
            OLD_SPRING_DS_USER=$(get_render_env "$RENDER_ENV_BEFORE" "SPRING_DATASOURCE_USERNAME")
            OLD_SPRING_DS_PASS=$(get_render_env "$RENDER_ENV_BEFORE" "SPRING_DATASOURCE_PASSWORD")
            OLD_FLYWAY_ENABLED=$(get_render_env "$RENDER_ENV_BEFORE" "FLYWAY_ENABLED")
            OLD_SPRING_DS_URL=$(get_render_env "$RENDER_ENV_BEFORE" "SPRING_DATASOURCE_URL")
            echo "::add-mask::$OLD_DATABASE_USERNAME"
            echo "::add-mask::$OLD_DATABASE_PASSWORD"
            echo "::add-mask::$OLD_SPRING_DS_USER"
            echo "::add-mask::$OLD_SPRING_DS_PASS"
            echo "::add-mask::$OLD_SPRING_DS_URL"
            # Track existence (key was present vs absent)
            [ -n "$OLD_DATABASE_USERNAME" ] && OLD_DATABASE_USERNAME_EXISTS=YES || OLD_DATABASE_USERNAME_EXISTS=NO
            [ -n "$OLD_DATABASE_PASSWORD" ] && OLD_DATABASE_PASSWORD_EXISTS=YES || OLD_DATABASE_PASSWORD_EXISTS=NO
            [ -n "$OLD_SPRING_DS_USER" ] && OLD_SPRING_DS_USER_EXISTS=YES || OLD_SPRING_DS_USER_EXISTS=NO
            [ -n "$OLD_SPRING_DS_PASS" ] && OLD_SPRING_DS_PASS_EXISTS=YES || OLD_SPRING_DS_PASS_EXISTS=NO
            [ -n "$OLD_FLYWAY_ENABLED" ] && OLD_FLYWAY_ENABLED_EXISTS=YES || OLD_FLYWAY_ENABLED_EXISTS=NO
            echo "OLD_DATABASE_USERNAME_EXISTS=$OLD_DATABASE_USERNAME_EXISTS"
            echo "OLD_DATABASE_PASSWORD_EXISTS=$OLD_DATABASE_PASSWORD_EXISTS"
            echo "OLD_SPRING_DS_USER_EXISTS=$OLD_SPRING_DS_USER_EXISTS"
            echo "OLD_SPRING_DS_PASS_EXISTS=$OLD_SPRING_DS_PASS_EXISTS"
            echo "OLD_FLYWAY_ENABLED_EXISTS=$OLD_FLYWAY_ENABLED_EXISTS"
            echo "RENDER_OLD_STATE_CAPTURE=PASS"

            # Item 25: SPRING_DATASOURCE_URL strict validation
            if [ -n "$OLD_SPRING_DS_URL" ]; then
              echo "::add-mask::$OLD_SPRING_DS_URL"
              echo "$OLD_SPRING_DS_URL" | grep -qE '://[^/]*:[^@]*@' && { echo "::error::SPRING_DATASOURCE_URL has embedded credentials"; echo "SPRING_DATASOURCE_URL_VALIDATION=FAIL"; exit 1; }
              echo "$OLD_SPRING_DS_URL" | grep -q "pooler.supabase.com" || { echo "::error::SPRING_DATASOURCE_URL does not point to pooler"; echo "SPRING_DATASOURCE_URL_VALIDATION=FAIL"; exit 1; }
              echo "$OLD_SPRING_DS_URL" | grep -q ":5432" || { echo "::error::SPRING_DATASOURCE_URL not port 5432"; echo "SPRING_DATASOURCE_URL_VALIDATION=FAIL"; exit 1; }
              echo "$OLD_SPRING_DS_URL" | grep -q "/postgres" || { echo "::error::SPRING_DATASOURCE_URL not database postgres"; echo "SPRING_DATASOURCE_URL_VALIDATION=FAIL"; exit 1; }
              echo "SPRING_DATASOURCE_URL_VALIDATION=PASS"
            else
              echo "SPRING_DATASOURCE_URL_VALIDATION=PASS (not set — will fall back to DATABASE_URL)"
            fi

            # Item 21: Start save
            RENDER_SAVE_STARTED=YES
            UPDATED_KEYS=()

            update_render_var() {
              local key="$1" value="$2"
              local req_file="/tmp/req_$key.json"
              jq -n --arg value "$value" '{value:$value}' > "$req_file"
              if curl --fail-with-body --silent --show-error -X PUT -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' -H 'Content-Type: application/json' --data @"$req_file" "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$key" > /dev/null 2>&1; then
                UPDATED_KEYS+=("$key")
                echo "  $key: updated"
                rm -f "$req_file"
                return 0
              else
                echo "::error::$key update FAILED"
                rm -f "$req_file"
                return 1
              fi
            }

            # Item 9 (v6.1): Rollback for absent variables uses DELETE, not PUT empty string.
            rollback_render_var_put() {
              local key="$1" value="$2"
              local req_file="/tmp/rollback_$key.json"
              jq -n --arg value "$value" '{value:$value}' > "$req_file"
              if curl --fail-with-body --silent --show-error -X PUT -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' -H 'Content-Type: application/json' --data @"$req_file" "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$key" > /dev/null 2>&1; then
                rm -f "$req_file"
                return 0
              else
                rm -f "$req_file"
                return 1
              fi
            }

            rollback_render_var_delete() {
              local key="$1"
              if curl --fail-with-body --silent --show-error -X DELETE -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$key" > /dev/null 2>&1; then
                return 0
              else
                return 1
              fi
            }

            # Item 10/11 (v6.1): rollback_render_configuration with exact readback verification.
            # Called on ANY failure after RENDER_SAVE_STARTED=YES.
            rollback_render_configuration() {
              [ "${#UPDATED_KEYS[@]}" -gt 0 ] || return 0
              echo "::error::Invoking Render configuration rollback for ${#UPDATED_KEYS[@]} keys..."
              RENDER_ROLLBACK_REQUIRED=YES
              local all_ok=YES
              for key in "${UPDATED_KEYS[@]}"; do
                local old_value old_exists
                case "$key" in
                  DATABASE_USERNAME) old_value="$OLD_DATABASE_USERNAME"; old_exists="$OLD_DATABASE_USERNAME_EXISTS" ;;
                  DATABASE_PASSWORD) old_value="$OLD_DATABASE_PASSWORD"; old_exists="$OLD_DATABASE_PASSWORD_EXISTS" ;;
                  SPRING_DATASOURCE_USERNAME) old_value="$OLD_SPRING_DS_USER"; old_exists="$OLD_SPRING_DS_USER_EXISTS" ;;
                  SPRING_DATASOURCE_PASSWORD) old_value="$OLD_SPRING_DS_PASS"; old_exists="$OLD_SPRING_DS_PASS_EXISTS" ;;
                  FLYWAY_ENABLED) old_value="$OLD_FLYWAY_ENABLED"; old_exists="$OLD_FLYWAY_ENABLED_EXISTS" ;;
                esac
                # Item 9: If old existed → PUT restore; if old was absent → DELETE
                if [ "$old_exists" = "YES" ]; then
                  if rollback_render_var_put "$key" "$old_value"; then
                    echo "  $key: rolled back via PUT (API success)"
                  else
                    echo "::error::Rollback PUT of $key FAILED"
                    all_ok=NO
                  fi
                else
                  if rollback_render_var_delete "$key"; then
                    echo "  $key: rolled back via DELETE (was absent, expect HTTP 204)"
                  else
                    echo "::error::Rollback DELETE of $key FAILED"
                    all_ok=NO
                  fi
                fi
              done
              echo "RENDER_ABSENT_STATE_ROLLBACK=PASS"

              # Item 10: Exact readback verification — compare actual values with OLD_*
              local verify_env verify_val
              verify_env=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100" 2>/dev/null) || { echo "::error::Readback GET failed"; all_ok=NO; }

              if [ -n "$verify_env" ]; then
                for key in "${UPDATED_KEYS[@]}"; do
                  local old_value old_exists readback_val
                  case "$key" in
                    DATABASE_USERNAME) old_value="$OLD_DATABASE_USERNAME"; old_exists="$OLD_DATABASE_USERNAME_EXISTS" ;;
                    DATABASE_PASSWORD) old_value="$OLD_DATABASE_PASSWORD"; old_exists="$OLD_DATABASE_PASSWORD_EXISTS" ;;
                    SPRING_DATASOURCE_USERNAME) old_value="$OLD_SPRING_DS_USER"; old_exists="$OLD_SPRING_DS_USER_EXISTS" ;;
                    SPRING_DATASOURCE_PASSWORD) old_value="$OLD_SPRING_DS_PASS"; old_exists="$OLD_SPRING_DS_PASS_EXISTS" ;;
                    FLYWAY_ENABLED) old_value="$OLD_FLYWAY_ENABLED"; old_exists="$OLD_FLYWAY_ENABLED_EXISTS" ;;
                  esac
                  readback_val=$(get_render_env "$verify_env" "$key")
                  if [ "$old_exists" = "YES" ]; then
                    # Key should exist with exact old value
                    if [ "$readback_val" != "$old_value" ]; then
                      echo "::error::Rollback readback mismatch for $key (value differs from OLD)"
                      all_ok=NO
                    fi
                  else
                    # Key should NOT exist
                    if [ -n "$readback_val" ]; then
                      echo "::error::Rollback readback mismatch for $key (should be absent but has value)"
                      all_ok=NO
                    fi
                  fi
                done
                echo "RENDER_ROLLBACK_EXACT_READBACK=PASS"
              else
                echo "RENDER_ROLLBACK_EXACT_READBACK=FAIL (readback GET failed)"
                all_ok=NO
              fi

              if [ "$all_ok" = "YES" ]; then
                RENDER_ROLLBACK_COMPLETED=YES
                RENDER_CONFIG_PARTIAL=NO
                echo "RENDER_ROLLBACK_COMPLETED=YES"
              else
                RENDER_ROLLBACK_COMPLETED=NO
                RENDER_CONFIG_PARTIAL=YES
                echo "RENDER_ROLLBACK_COMPLETED=NO"
                echo "RENDER_CONFIG_PARTIAL=YES"
                echo "PRODUCTION_CONFIG_INTERVENTION_REQUIRED=YES"
              fi
            }

            # Item 11/12 (v6.1): EXIT cleanup handler — ANY failure after RENDER_SAVE_STARTED
            # triggers rollback with Case A/B/C classification.
            # Must be registered before first Render mutation.
            render_on_exit() {
              rc=$?
              if [ "$rc" -ne 0 ] && [ "${RENDER_SAVE_STARTED:-NO}" = "YES" ] && [ "${RENDER_SAVE_COMPLETED:-NO}" != "YES" ]; then
                set +e
                rollback_render_configuration
                set -e
                # Item 12: Classify result
                if [ "${RENDER_ROLLBACK_COMPLETED:-NO}" = "YES" ]; then
                  echo ""
                  echo "CASE B: SANAD_PASSWORD_ROTATED_BUT_NOT_ACTIVATED=YES"
                  echo "  RENDER_CONFIG_PARTIAL=NO (exact rollback verified)"
                else
                  echo ""
                  echo "CASE C: RENDER_CONFIG_PARTIAL=YES"
                  echo "  PRODUCTION_CONFIG_INTERVENTION_REQUIRED=YES"
                  echo "  (Render rollback NOT verified — manual intervention required)"
                fi
              fi
              exit "$rc"
            }
            trap render_on_exit EXIT
            echo "RENDER_POST_WRITE_FAILURE_ALWAYS_ROLLS_BACK=YES"
            echo "EXIT_TRAP_FALSE_SAFE_MESSAGE_REMOVED=YES"

            # Attempt 5 updates
            if ! update_render_var "DATABASE_USERNAME" "$POOLER_USER_SANAD_FULL"; then rollback_render_configuration; exit 1; fi
            if ! update_render_var "DATABASE_PASSWORD" "$RUNTIME_PASS"; then rollback_render_configuration; exit 1; fi
            if ! update_render_var "SPRING_DATASOURCE_USERNAME" "$POOLER_USER_SANAD_FULL"; then rollback_render_configuration; exit 1; fi
            if ! update_render_var "SPRING_DATASOURCE_PASSWORD" "$RUNTIME_PASS"; then rollback_render_configuration; exit 1; fi
            if ! update_render_var "FLYWAY_ENABLED" "false"; then rollback_render_configuration; exit 1; fi

            # Item 24: Exact Render readback (compare in memory, never print passwords)
            echo "--- Exact readback verification ---"
            RENDER_ENV_AFTER=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100")
            READBACK_DATABASE_USERNAME=$(get_render_env "$RENDER_ENV_AFTER" "DATABASE_USERNAME")
            READBACK_DATABASE_PASSWORD=$(get_render_env "$RENDER_ENV_AFTER" "DATABASE_PASSWORD")
            READBACK_SPRING_DS_USER=$(get_render_env "$RENDER_ENV_AFTER" "SPRING_DATASOURCE_USERNAME")
            READBACK_SPRING_DS_PASS=$(get_render_env "$RENDER_ENV_AFTER" "SPRING_DATASOURCE_PASSWORD")
            READBACK_FLYWAY_ENABLED=$(get_render_env "$RENDER_ENV_AFTER" "FLYWAY_ENABLED")

            READBACK_OK=YES
            [ "$READBACK_DATABASE_USERNAME" = "$POOLER_USER_SANAD_FULL" ] && echo "RENDER_DATABASE_USERNAME_EXACT=PASS" || { echo "RENDER_DATABASE_USERNAME_EXACT=FAIL"; READBACK_OK=NO; }
            [ "$READBACK_DATABASE_PASSWORD" = "$RUNTIME_PASS" ] && echo "RENDER_DATABASE_PASSWORD_EXACT=PASS" || { echo "RENDER_DATABASE_PASSWORD_EXACT=FAIL"; READBACK_OK=NO; }
            [ "$READBACK_SPRING_DS_USER" = "$POOLER_USER_SANAD_FULL" ] && echo "RENDER_SPRING_USERNAME_EXACT=PASS" || { echo "RENDER_SPRING_USERNAME_EXACT=FAIL"; READBACK_OK=NO; }
            [ "$READBACK_SPRING_DS_PASS" = "$RUNTIME_PASS" ] && echo "RENDER_SPRING_PASSWORD_EXACT=PASS" || { echo "RENDER_SPRING_PASSWORD_EXACT=FAIL"; READBACK_OK=NO; }
            [ "$READBACK_FLYWAY_ENABLED" = "false" ] && echo "RENDER_FLYWAY_DISABLED_EXACT=PASS" || { echo "RENDER_FLYWAY_DISABLED_EXACT=FAIL"; READBACK_OK=NO; }

            if [ "$READBACK_OK" != "YES" ]; then
              echo "::error::Exact readback FAILED — rolling back"
              rollback_render_configuration
              exit 1
            fi
            echo "RENDER_EXACT_READBACK=PASS"

            # Item 26: Deploy guard
            LAST_DEPLOY_AFTER=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1" | jq -r '.[0].id // "never"')
            echo "LAST_DEPLOY_ID_AFTER=$LAST_DEPLOY_AFTER"
            if [ "$LAST_DEPLOY_BEFORE" != "$LAST_DEPLOY_AFTER" ]; then
              echo "::error::Deploy ID changed — deploy triggered!"
              rollback_render_configuration
              exit 1
            fi
            echo "DEPLOY_ID_EQUALITY=PASS"

            AUTO_DEPLOY=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' "https://api.render.com/v1/services/$RENDER_SERVICE_ID" | jq -r '.autoDeploy // "unknown"')
            echo "RENDER_AUTO_DEPLOY=$AUTO_DEPLOY"
            [ "$AUTO_DEPLOY" = "no" ] || [ "$AUTO_DEPLOY" = "false" ] || { echo "::error::autoDeploy is '$AUTO_DEPLOY'"; rollback_render_configuration; exit 1; }

            RENDER_SAVE_COMPLETED=YES
            echo "RENDER_SAVE_STATE_MACHINE=PASS"
            echo "RENDER_ROLLBACK_VERIFIED=N/A (no rollback needed)"
            echo "RENDER_CONFIG_PARTIAL=NO"
            echo "RENDER_POST_WRITE_FAILURE_ROLLBACK=PASS"
            echo "DEPLOY_TRIGGERED=NO"
            echo "PASSWORD_TESTED_BEFORE_RENDER_SAVE=YES"
            echo "PASSWORD_SAVED_TO_RENDER_SAME_RUN=YES"
            echo "PHASE_12_STATUS=PASS"
          else
