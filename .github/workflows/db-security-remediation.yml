name: DB Security Audit + Remediation (One-Time)
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'audit | provision | rls_test | update_render'
        required: true
        default: 'audit'

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      SUPABASE_PROJECT: tkbrvupemreqabwzdpyq
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Fetch DB credentials from Render
        shell: bash
        run: |
          set -euo pipefail
          RENDER_ENV=$(curl --silent --show-error \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100")

          DATABASE_URL=$(echo "$RENDER_ENV" | jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "DATABASE_URL") | .value // empty')
          DATABASE_PASSWORD=$(echo "$RENDER_ENV" | jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "DATABASE_PASSWORD") | .value // empty')
          DATABASE_USERNAME=$(echo "$RENDER_ENV" | jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "DATABASE_USERNAME") | .value // empty')
          FLYWAY_ENABLED=$(echo "$RENDER_ENV" | jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "FLYWAY_ENABLED") | .value // empty')
          SPRING_DS_USER=$(echo "$RENDER_ENV" | jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "SPRING_DATASOURCE_USERNAME") | .value // empty')
          SPRING_DS_PASS=$(echo "$RENDER_ENV" | jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "SPRING_DATASOURCE_PASSWORD") | .value // empty')
          SPRING_DS_URL=$(echo "$RENDER_ENV" | jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "SPRING_DATASOURCE_URL") | .value // empty')

          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$DATABASE_PASSWORD"
          echo "::add-mask::$DATABASE_USERNAME"
          echo "::add-mask::$SPRING_DS_USER"
          echo "::add-mask::$SPRING_DS_PASS"
          echo "::add-mask::$SPRING_DS_URL"

          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "DATABASE_PASSWORD=$DATABASE_PASSWORD" >> "$GITHUB_ENV"
          echo "DATABASE_USERNAME=$DATABASE_USERNAME" >> "$GITHUB_ENV"
          echo "FLYWAY_ENABLED_VAL=$FLYWAY_ENABLED" >> "$GITHUB_ENV"
          echo "SPRING_DS_USER_VAL=$SPRING_DS_USER" >> "$GITHUB_ENV"
          echo "SPRING_DS_PASS_VAL=$SPRING_DS_PASS" >> "$GITHUB_ENV"
          echo "SPRING_DS_URL_VAL=$SPRING_DS_URL" >> "$GITHUB_ENV"

          # Parse host from DATABASE_URL
          RAW_URL="${DATABASE_URL#jdbc:}"
          RAW_URL="${RAW_URL#postgresql://}"
          RAW_URL="${RAW_URL#https://}"
          HOST_PORT="${RAW_URL%%/*}"
          PGHOST="${HOST_PORT%%:*}"
          PGPORT="${HOST_PORT#*:}"
          PGPORT="${PGPORT:-5432}"
          echo "PGHOST=$PGHOST" >> "$GITHUB_ENV"
          echo "PGPORT=$PGPORT" >> "$GITHUB_ENV"

          # Sanitized output
          echo "=== RENDER DB METADATA (sanitized) ==="
          echo "DATABASE_USERNAME class: $(echo "$DATABASE_USERNAME" | grep -q '^\.' && echo 'OTHER' || echo "$DATABASE_USERNAME" | grep -q '^postgres' && echo 'POSTGRES' || echo "$DATABASE_USERNAME" | grep -q '^sanad' && echo 'SANAD' || echo 'OTHER')"
          echo "DATABASE_URL host: $PGHOST port: $PGPORT"
          echo "FLYWAY_ENABLED: ${FLYWAY_ENABLED:-UNSET}"
          echo "SPRING_DATASOURCE_USERNAME override: $([ -n "$SPRING_DS_USER" ] && echo 'YES' || echo 'NO')"
          echo "SPRING_DATASOURCE_PASSWORD override: $([ -n "$SPRING_DS_PASS" ] && echo 'YES' || echo 'NO')"
          echo "SPRING_DATASOURCE_URL override: $([ -n "$SPRING_DS_URL" ] && echo 'YES' || echo 'NO')"

      - name: Audit — DB role state
        if: inputs.action == 'audit'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== AUDIT: Production DB Role State ==="
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h "$PGHOST" -p "$PGPORT" -U "$DATABASE_USERNAME" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="SELECT rolname, rolsuper, rolbypassrls, rolcreaterole, rolcreatedb, rolcanlogin FROM pg_roles WHERE rolname IN ('postgres','sanad') ORDER BY rolname;"

          echo ""
          echo "=== AUDIT: RLS/FORCE RLS Inventory ==="
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h "$PGHOST" -p "$PGPORT" -U "$DATABASE_USERNAME" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="
              SELECT
                (SELECT COUNT(*) FROM pg_tables WHERE schemaname='public') AS public_tables,
                (SELECT COUNT(*) FROM pg_tables WHERE schemaname='public' AND rowsecurity=true) AS rls_enabled,
                (SELECT COUNT(*) FROM pg_class c JOIN pg_tables t ON c.relname=t.tablename WHERE c.relrowsecurity=true AND c.relforcerowsecurity=true AND t.schemaname='public') AS force_rls,
                (SELECT COUNT(*) FROM pg_policies WHERE schemaname='public') AS rls_policies;
            "

          echo ""
          echo "=== AUDIT: Table Owners (sample) ==="
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h "$PGHOST" -p "$PGPORT" -U "$DATABASE_USERNAME" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="SELECT tableowner, COUNT(*) FROM pg_tables WHERE schemaname='public' GROUP BY tableowner ORDER BY COUNT(*) DESC;"

          echo ""
          echo "=== AUDIT: public schema owner ==="
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h "$PGHOST" -p "$PGPORT" -U "$DATABASE_USERNAME" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="SELECT pg_catalog.pg_get_userbyid(nspowner) FROM pg_namespace WHERE nspname='public';"

      - name: Provision — Create sanad role + grants
        if: inputs.action == 'provision'
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_PASS="$(openssl rand -base64 32 | tr -d '\n/=')"
          echo "::add-mask::$RUNTIME_PASS"
          echo "RUNTIME_DB_PASSWORD=$RUNTIME_PASS" >> "$GITHUB_ENV"

          # Supavisor pooler doesn't support DDL (CREATE ROLE, ALTER ROLE, GRANT).
          # Use the direct Supabase DB host for DDL operations.
          DIRECT_HOST="db.$SUPABASE_PROJECT.supabase.co"
          DIRECT_USER="postgres"
          echo "Using direct DB host for DDL: $DIRECT_HOST"

          echo "=== PROVISION: Creating sanad role ==="
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h "$DIRECT_HOST" -p 5432 -U "$DIRECT_USER" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 \
            --command="DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='sanad') THEN CREATE ROLE sanad WITH LOGIN PASSWORD '$RUNTIME_PASS'; END IF; END \$\$;"

          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h "$DIRECT_HOST" -p 5432 -U "$DIRECT_USER" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 \
            --command="ALTER ROLE sanad NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE;"

          echo "=== PROVISION: Grants ==="
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h "$DIRECT_HOST" -p 5432 -U "$DIRECT_USER" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 \
            --command="GRANT CONNECT ON DATABASE postgres TO sanad; GRANT USAGE ON SCHEMA public TO sanad; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO sanad; GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO sanad;"

          echo "=== PROVISION: Default privileges for future objects ==="
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h "$DIRECT_HOST" -p 5432 -U "$DIRECT_USER" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 \
            --command="ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO sanad; ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO sanad;"

          echo "=== PROVISION: Verify role ==="
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h "$DIRECT_HOST" -p 5432 -U "$DIRECT_USER" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="SELECT rolname, rolsuper, rolbypassrls, rolcreatedb, rolcreaterole, rolcanlogin FROM pg_roles WHERE rolname='sanad';"

          echo "=== PROVISION: Test pooler login ==="
          POOLER_USER="sanad.$SUPABASE_PROJECT"
          PGPASSWORD="$RUNTIME_PASS" psql \
            -h "$PGHOST" -p "$PGPORT" -U "$POOLER_USER" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="SELECT current_user;"

          echo "=== PROVISION: Negative privilege tests ==="
          PGPASSWORD="$RUNTIME_PASS" psql \
            -h "$PGHOST" -p "$PGPORT" -U "$POOLER_USER" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="SELECT rolname, rolsuper, rolbypassrls, rolcreatedb, rolcreaterole FROM pg_roles WHERE rolname='sanad';"

      - name: RLS Test — Fail-closed + isolation proof
        if: inputs.action == 'rls_test'
        shell: bash
        run: |
          set -euo pipefail
          POOLER_USER="sanad.$SUPABASE_PROJECT"
          # Get the sanad password from the provision step (stored in GITHUB_ENV)
          # For rls_test we need the password - re-provision if not set
          if [ -z "${RUNTIME_DB_PASSWORD:-}" ]; then
            echo "::error::RUNTIME_DB_PASSWORD not set - run 'provision' action first"
            exit 1
          fi

          echo "=== RLS TEST A: Missing tenant context (fail-closed) ==="
          PGPASSWORD="$RUNTIME_DB_PASSWORD" psql \
            -h "$PGHOST" -p "$PGPORT" -U "$POOLER_USER" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="BEGIN; SELECT COUNT(*) AS contacts_visible_without_guc FROM crm_contacts; ROLLBACK;"

          echo "=== RLS TEST B: Valid tenant context ==="
          # Get a real tenant ID
          TENANT_ID=$(PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h "$PGHOST" -p "$PGPORT" -U "$DATABASE_USERNAME" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="SELECT id FROM tenants WHERE status='ACTIVE' LIMIT 1;")
          echo "::add-mask::$TENANT_ID"

          PGPASSWORD="$RUNTIME_DB_PASSWORD" psql \
            -h "$PGHOST" -p "$PGPORT" -U "$POOLER_USER" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="BEGIN; SELECT set_config('app.tenant_id', '$TENANT_ID', true); SELECT COUNT(*) AS contacts_with_valid_guc FROM crm_contacts; ROLLBACK;"

          echo "=== RLS TEST C: Cross-tenant isolation ==="
          # Get a different tenant
          TENANT_B=$(PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h "$PGHOST" -p "$PGPORT" -U "$DATABASE_USERNAME" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="SELECT id FROM tenants WHERE status='ACTIVE' AND id != '$TENANT_ID' LIMIT 1;")
          echo "::add-mask::$TENANT_B"

          PGPASSWORD="$RUNTIME_DB_PASSWORD" psql \
            -h "$PGHOST" -p "$PGPORT" -U "$POOLER_USER" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="BEGIN; SELECT set_config('app.tenant_id', '$TENANT_ID', true); SELECT COUNT(*) AS cross_tenant_contacts_visible FROM crm_contacts WHERE tenant_id = '$TENANT_B'; ROLLBACK;"

      - name: Update Render — Save sanad credentials + FLYWAY_ENABLED=false
        if: inputs.action == 'update_render'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RUNTIME_DB_PASSWORD:-}" ]; then
            echo "::error::RUNTIME_DB_PASSWORD not set - run 'provision' first"
            exit 1
          fi
          POOLER_USER="sanad.$SUPABASE_PROJECT"

          echo "=== UPDATE: DATABASE_USERNAME ==="
          jq -n --arg value "$POOLER_USER" '{value:$value}' > /tmp/req.json
          curl --fail-with-body --silent --show-error -X PUT \
            -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data @/tmp/req.json \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/DATABASE_USERNAME" > /dev/null
          echo "DATABASE_USERNAME updated"

          echo "=== UPDATE: DATABASE_PASSWORD ==="
          jq -n --arg value "$RUNTIME_DB_PASSWORD" '{value:$value}' > /tmp/req.json
          curl --fail-with-body --silent --show-error -X PUT \
            -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data @/tmp/req.json \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/DATABASE_PASSWORD" > /dev/null
          echo "DATABASE_PASSWORD updated"

          echo "=== UPDATE: FLYWAY_ENABLED=false ==="
          jq -n --arg value "false" '{value:$value}' > /tmp/req.json
          curl --fail-with-body --silent --show-error -X PUT \
            -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data @/tmp/req.json \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/FLYWAY_ENABLED" > /dev/null
          echo "FLYWAY_ENABLED updated"

          echo "=== UPDATE: Verify (presence only) ==="
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" -H 'Accept: application/json' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100" | \
            jq -r '[.[]? | (.envVar // .)] | .[] | select(.key | test("DATABASE_USERNAME|DATABASE_PASSWORD|FLYWAY_ENABLED")) | "\(.key): present=\((.value // \"\" | length > 0))"'
