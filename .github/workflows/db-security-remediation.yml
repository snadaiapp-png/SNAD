          [ "$MIGRATION_IMMUTABILITY" = "PASS" ] || { echo "MIGRATION_IMMUTABILITY=FAIL"; exit 1; }
          echo "MIGRATION_IMMUTABILITY=PASS"

          # Item 17: Flyway history verification (exact version values)
          sb_query "SELECT COUNT(*)::text AS value FROM flyway_schema_history WHERE version IN ('20260823.1', '20260823.2') AND success=true;" true
          [ "$sb_query_http" = "201" ] || { echo "::error::flyway query failed"; exit 1; }
