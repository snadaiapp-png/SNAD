name: DB Security Audit + Remediation (One-Time)
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'audit | recovery_auth | recovery_full'
        required: true
        default: 'audit'
      apply_render:
        description: 'When action=recovery_full, also apply Phase 12 (Render save-only) if all preconditions PASS'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      SUPABASE_PROJECT: tkbrvupemreqabwzdpyq
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Checkout repository (for migration SHA256 verification + main lock)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch DB credentials from Render
        shell: bash
        run: |
          set -euo pipefail
          RENDER_ENV=$(curl --silent --show-error \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100")

          DATABASE_URL=$(echo "$RENDER_ENV" | jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "DATABASE_URL") | .value // empty')
          DATABASE_PASSWORD=$(echo "$RENDER_ENV" | jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "DATABASE_PASSWORD") | .value // empty')
          DATABASE_USERNAME=$(echo "$RENDER_ENV" | jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "DATABASE_USERNAME") | .value // empty')
          FLYWAY_ENABLED=$(echo "$RENDER_ENV" | jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "FLYWAY_ENABLED") | .value // empty')
          SPRING_DS_USER=$(echo "$RENDER_ENV" | jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "SPRING_DATASOURCE_USERNAME") | .value // empty')
          SPRING_DS_PASS=$(echo "$RENDER_ENV" | jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "SPRING_DATASOURCE_PASSWORD") | .value // empty')
          SPRING_DS_URL=$(echo "$RENDER_ENV" | jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == "SPRING_DATASOURCE_URL") | .value // empty')

          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$DATABASE_PASSWORD"
          echo "::add-mask::$DATABASE_USERNAME"
          echo "::add-mask::$SPRING_DS_USER"
          echo "::add-mask::$SPRING_DS_PASS"
          echo "::add-mask::$SPRING_DS_URL"

          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"
          echo "DATABASE_PASSWORD=$DATABASE_PASSWORD" >> "$GITHUB_ENV"
          echo "DATABASE_USERNAME=$DATABASE_USERNAME" >> "$GITHUB_ENV"
          echo "FLYWAY_ENABLED_VAL=$FLYWAY_ENABLED" >> "$GITHUB_ENV"
          echo "SPRING_DS_USER_VAL=$SPRING_DS_USER" >> "$GITHUB_ENV"
          echo "SPRING_DS_PASS_VAL=$SPRING_DS_PASS" >> "$GITHUB_ENV"
          echo "SPRING_DS_URL_VAL=$SPRING_DS_URL" >> "$GITHUB_ENV"

          # Parse host from DATABASE_URL
          RAW_URL="${DATABASE_URL#jdbc:}"
          RAW_URL="${RAW_URL#postgresql://}"
          RAW_URL="${RAW_URL#https://}"
          HOST_PORT="${RAW_URL%%/*}"
          PGHOST="${HOST_PORT%%:*}"
          PGPORT="${HOST_PORT#*:}"
          PGPORT="${PGPORT:-5432}"
          echo "PGHOST=$PGHOST" >> "$GITHUB_ENV"
          echo "PGPORT=$PGPORT" >> "$GITHUB_ENV"

          # Sanitized output
          echo "=== RENDER DB METADATA (sanitized) ==="
          echo "DATABASE_USERNAME class: $(echo "$DATABASE_USERNAME" | grep -q '^\.' && echo 'OTHER' || echo "$DATABASE_USERNAME" | grep -q '^postgres' && echo 'POSTGRES' || echo "$DATABASE_USERNAME" | grep -q '^sanad' && echo 'SANAD' || echo 'OTHER')"
          echo "DATABASE_URL host: $PGHOST port: $PGPORT"
          echo "FLYWAY_ENABLED: ${FLYWAY_ENABLED:-UNSET}"
          echo "SPRING_DATASOURCE_USERNAME override: $([ -n "$SPRING_DS_USER" ] && echo 'YES' || echo 'NO')"
          echo "SPRING_DATASOURCE_PASSWORD override: $([ -n "$SPRING_DS_PASS" ] && echo 'YES' || echo 'NO')"
          echo "SPRING_DATASOURCE_URL override: $([ -n "$SPRING_DS_URL" ] && echo 'YES' || echo 'NO')"

      - name: Audit — DB role state
        if: inputs.action == 'audit'
        shell: bash
        run: |
          set -euo pipefail
          echo "=== AUDIT: Production DB Role State ==="
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h "$PGHOST" -p "$PGPORT" -U "$DATABASE_USERNAME" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="SELECT rolname, rolsuper, rolbypassrls, rolcreaterole, rolcreatedb, rolcanlogin FROM pg_roles WHERE rolname IN ('postgres','sanad') ORDER BY rolname;"

          echo ""
          echo "=== AUDIT: RLS/FORCE RLS Inventory ==="
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h "$PGHOST" -p "$PGPORT" -U "$DATABASE_USERNAME" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="
              SELECT
                (SELECT COUNT(*) FROM pg_tables WHERE schemaname='public') AS public_tables,
                (SELECT COUNT(*) FROM pg_tables WHERE schemaname='public' AND rowsecurity=true) AS rls_enabled,
                (SELECT COUNT(*) FROM pg_class c JOIN pg_tables t ON c.relname=t.tablename WHERE c.relrowsecurity=true AND c.relforcerowsecurity=true AND t.schemaname='public') AS force_rls,
                (SELECT COUNT(*) FROM pg_policies WHERE schemaname='public') AS rls_policies;
            "

          echo ""
          echo "=== AUDIT: Table Owners (sample) ==="
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h "$PGHOST" -p "$PGPORT" -U "$DATABASE_USERNAME" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="SELECT tableowner, COUNT(*) FROM pg_tables WHERE schemaname='public' GROUP BY tableowner ORDER BY COUNT(*) DESC;"

          echo ""
          echo "=== AUDIT: public schema owner ==="
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h "$PGHOST" -p "$PGPORT" -U "$DATABASE_USERNAME" -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align \
            --command="SELECT pg_catalog.pg_get_userbyid(nspowner) FROM pg_namespace WHERE nspname='public';"

      # =====================================================================
      # RECOVERY_AUTH — Pre-migration safe subset.
      # Self-contained: generates own password, uses, discards.
      # Run BEFORE canonical Flyway migration.
      # =====================================================================
      - name: Recovery_auth — Phase 0-8 (probe + password + auth + privilege proof, NO RLS)
        if: inputs.action == 'recovery_auth'
        shell: bash
        run: |
          set -euo pipefail

          # Self-contained credential lifecycle: password generated, used, discarded in THIS run.
          # Item 6: If password rotation succeeds but any later step fails:
          # SANAD_PASSWORD_ROTATED_BUT_NOT_ACTIVATED=YES
          SANAD_PASSWORD_ROTATED=NO
          trap 'rc=$?; if [ $rc -ne 0 ] && [ "$SANAD_PASSWORD_ROTATED" = "YES" ]; then echo ""; echo "SANAD_PASSWORD_ROTATED_BUT_NOT_ACTIVATED=YES"; echo "  (Render still uses postgres — not a security emergency; future run may rotate again)"; fi' EXIT

          echo "PASSWORD_RESET_AUTHORITY_CANDIDATE=MANAGEMENT_API"
          echo "PASSWORD_RESET_AUTHORITY_PROVEN=NO (pending runtime verification)"

          POOLER_HOST="aws-0-eu-central-1.pooler.supabase.com"
          POOLER_PORT="5432"
          POOLER_DB="postgres"
          POOLER_USER_SANAD="sanad.$SUPABASE_PROJECT"
          SB_API="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT/database/query"

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is empty"
            echo "MANAGEMENT_API_PROBE=FAIL"
            exit 1
          fi
          SB_TOKEN="$SUPABASE_ACCESS_TOKEN"
          echo "MANAGEMENT_API_TOKEN_PRESENT=YES"
          echo "::add-mask::$SB_TOKEN"

          # Item 7: Named-field JSON parser. Uses SQL alias 'AS value'
          # and parses .[0].value instead of unnamed .[0][0].
          sb_query() {
            local sql="$1" read_only="${2:-false}"
            local payload
            payload=$(jq -n --arg q "$sql" --argjson ro "$read_only" '{query: $q, read_only: $ro}')
            local resp http_code body
            resp=$(curl --silent --show-error --write-out '\n%{http_code}' \
              -X POST "$SB_API" \
              -H "Authorization: Bearer $SB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" 2>&1)
            http_code=$(echo "$resp" | tail -1)
            body=$(echo "$resp" | sed '$d')
            sb_query_http="$http_code"
            sb_query_body="$body"
          }

          # Item 7: Parse named field 'value' from first row of Management API response.
          # Response format: [{"value":"f|f|f|f|t"}] or [{"value":"result"}]
          sb_value() {
            echo "$sb_query_body" | jq -r '
              if type == "array" then
                if length > 0 then .[0].value // empty else empty end
              elif type == "object" then
                .value // empty
              else
                .
              end' 2>/dev/null | tr -d '"' | tr -d '[:space:]'
          }

          # Item 7: Parse named field from specific row by label (for multi-row responses)
          sb_value_by_label() {
            local label="$1"
            echo "$sb_query_body" | jq -r --arg lbl "$label" '
              if type == "array" then
                .[] | select(.label == $lbl) | .value // empty
              else
                empty
              end' 2>/dev/null | tr -d '"' | tr -d '[:space:]'
          }

          # psql as sanad (runtime RLS channel)
          psql_sanad() {
            PGPASSWORD="$RUNTIME_PASS" psql \
              -h "$POOLER_HOST" -p "$POOLER_PORT" -U "$POOLER_USER_SANAD" -d "$POOLER_DB" \
              --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align "$@"
          }

          # Item 4: Main/SHA execution lock
          verify_main_lock() {
            local label="$1"
            git fetch origin main --quiet 2>/dev/null
            local dispatch_sha head_sha remote_main_sha
            dispatch_sha="${GITHUB_SHA:-$(git rev-parse HEAD)}"
            head_sha=$(git rev-parse HEAD)
            remote_main_sha=$(git rev-parse origin/main)
            echo "$label: GITHUB_SHA=$dispatch_sha HEAD=$head_sha origin/main=$remote_main_sha"
            if [ "$dispatch_sha" != "$remote_main_sha" ] || [ "$head_sha" != "$remote_main_sha" ]; then
              echo "::error::$label FAILED — SHAs do not match"
              return 1
            fi
            echo "$label=PASS"
            return 0
          }


          # ============ PHASE 0 — MANAGEMENT API PROBE ============
          echo "===== PHASE 0: Management API probe ====="
          sb_query "SELECT 1 AS value;" true
          PROBE_HTTP="$sb_query_http"
          echo "MANAGEMENT_API_PROBE_HTTP=$PROBE_HTTP"
          case "$PROBE_HTTP" in
            201) echo "MANAGEMENT_API_PROBE=PASS"; echo "MANAGEMENT_API_AUTH=PASS"; PROBE_PASS=YES ;;
            401|403|400|410|429|5*) echo "::error::Management API probe failed: HTTP $PROBE_HTTP"; exit 1 ;;
            *) echo "::error::Management API unexpected HTTP $PROBE_HTTP"; exit 1 ;;
          esac

          # ============ PHASE 0.1 — MAIN/SHA EXECUTION LOCK (Item 4) ============
          echo "===== PHASE 0.1: Main/SHA execution lock ====="
          verify_main_lock "PRODUCTION_REF_LOCK" || exit 1

          # ============ PHASE 1 — READ-ONLY ROLE STATE ============
          echo "===== PHASE 1: Read-only role state verification ====="
          sb_query "SELECT (rolsuper::text || '|' || rolbypassrls::text || '|' || rolcreatedb::text || '|' || rolcreaterole::text || '|' || rolcanlogin::text) AS value FROM pg_authid WHERE rolname='sanad';" true
          [ "$sb_query_http" = "201" ] || { echo "::error::Phase 1 failed: HTTP $sb_query_http"; exit 1; }
          ROLE_FLAGS_BEFORE=$(sb_value)
          echo "ROLE_FLAGS_BEFORE=$ROLE_FLAGS_BEFORE"
          [ -n "$ROLE_FLAGS_BEFORE" ] || { echo "::error::sanad role not found"; exit 1; }
          IFS='|' read -r ROLSUPER_B ROLBYPASS_B ROLCREATEDB_B ROLCREATEROLE_B ROLLOGIN_B <<< "$ROLE_FLAGS_BEFORE"
          [ "$ROLSUPER_B" = "f" ] && [ "$ROLBYPASS_B" = "f" ] && [ "$ROLCREATEDB_B" = "f" ] && [ "$ROLCREATEROLE_B" = "f" ] && [ "$ROLLOGIN_B" = "t" ] || { echo "::error::Pre-rotation invariant violated"; exit 1; }
          echo "PRE_ROTATION_INVARIANTS=PASS"

          # ============ PHASE 2 — POOLER LOGIN TEST ============
          echo "===== PHASE 2: Pooler login with current Render-stored password ====="
          PHASE2_ERR=$(PGPASSWORD="$DATABASE_PASSWORD" psql -h "$POOLER_HOST" -p "$POOLER_PORT" -U "$POOLER_USER_SANAD" -d "$POOLER_DB" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT 1;" 2>&1) || true
          echo "PHASE2_LOGIN_ERR_SANITIZED=$(echo "$PHASE2_ERR" | sed -E 's/[Pp]assword[^,}]*/password=***/g; s/PGPASSWORD=[^ ]*/PGPASSWORD=***/g')"

          # ============ PHASE 2.1 — PRE-WRITE MAIN LOCK (Item 5) ============
          echo "===== PHASE 2.1: Pre-write main lock ====="
          verify_main_lock "PRE_WRITE_MAIN_LOCK" || exit 1

          # ============ PHASE 3 — RESET PASSWORD ============
          echo "===== PHASE 3: Reset sanad password via Management API ====="
          RUNTIME_PASS="$(openssl rand -hex 32)"
          [ ${#RUNTIME_PASS} -ge 32 ] || { echo "::error::password too short"; exit 1; }
          echo "::add-mask::$RUNTIME_PASS"
          echo "PASSWORD_MASKED_BEFORE_USE=YES"
          echo "PASSWORD_EMIT_TARGETS_BLOCKED=GITHUB_OUTPUT,GITHUB_ENV,job_summary,artifact,console,file"

          ALTER_SQL="ALTER ROLE sanad PASSWORD '${RUNTIME_PASS}';"
          sb_query "$ALTER_SQL" false
          ALTER_HTTP="$sb_query_http"
          echo "ALTER_ROLE_HTTP_STATUS=$ALTER_HTTP"
          [ "$ALTER_HTTP" = "201" ] || { echo "::error::ALTER ROLE PASSWORD failed: HTTP $ALTER_HTTP"; echo "  request/response body REDACTED"; exit 1; }
          echo "ALTER_ROLE_SUCCEEDED=YES"
          SANAD_PASSWORD_ROTATED=YES

          # ============ PHASE 4 — POOLER RETEST ============
          echo "===== PHASE 4: Pooler retest with new password ====="
          PHASE4_OUT=$(PGPASSWORD="$RUNTIME_PASS" psql -h "$POOLER_HOST" -p "$POOLER_PORT" -U "$POOLER_USER_SANAD" -d "$POOLER_DB" --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align --command="SELECT current_user, current_database();" 2>&1) || true
          if echo "$PHASE4_OUT" | grep -q "^sanad|"; then
            echo "POOLER_LOGIN_WITH_NEW_PASSWORD=PASS"
            CURRENT_USER_SANAD="sanad"
            echo "CURRENT_USER_SANAD=$CURRENT_USER_SANAD"
            PHASE4_RESULT=PASS
          else
            echo "POOLER_LOGIN_WITH_NEW_PASSWORD=FAIL"
            echo "PHASE4_RETEST_ERR_SANITIZED=$(echo "$PHASE4_OUT" | sed -E 's/[Pp]assword[^,}]*/password=***/g; s/PGPASSWORD=[^ ]*/PGPASSWORD=***/g')"
            PHASE4_RESULT=FAIL
          fi
          [ "$PHASE4_RESULT" = "PASS" ] || { echo "::error::Pooler login failed"; exit 1; }

          # ============ PHASE 4.5 — POST-ROTATION INVARIANTS ============
          sb_query "SELECT (rolsuper::text || '|' || rolbypassrls::text || '|' || rolcreatedb::text || '|' || rolcreaterole::text || '|' || rolcanlogin::text) AS value FROM pg_authid WHERE rolname='sanad';" true
          [ "$sb_query_http" = "201" ] || { echo "::error::post-rotation query failed"; exit 1; }
          ROLE_FLAGS_AFTER=$(sb_value)
          echo "ROLE_FLAGS_AFTER=$ROLE_FLAGS_AFTER"
          [ "$ROLE_FLAGS_BEFORE" = "$ROLE_FLAGS_AFTER" ] || { echo "::error::Role flags changed"; exit 1; }
          echo "POST_ROTATION_INVARIANTS=PASS"
          echo "ROLE_FLAGS_PRESERVED=YES"

          [ "$PROBE_PASS" = "YES" ] && [ "$ALTER_HTTP" = "201" ] && [ "$PHASE4_RESULT" = "PASS" ] && echo "PASSWORD_RESET_AUTHORITY_PROVEN=YES" || { echo "PASSWORD_RESET_AUTHORITY_PROVEN=NO"; exit 1; }

          # ============ PHASE 7 — BASIC POSITIVE TESTS (Item 19: no || echo skip) ============
          echo "===== PHASE 7: Basic positive tests ====="
          TENANTS_COUNT=$(psql_sanad --command="SELECT COUNT(*)::text FROM tenants;" 2>&1) || { echo "::error::tenants query failed"; exit 1; }
          echo "TENANTS_VISIBLE=$TENANTS_COUNT"
          echo "LEAST_PRIVILEGE_POSITIVE_TESTS=PASS"

          # ============ PHASE 8 — PRIVILEGE ATTRIBUTE PROOF ============
          echo "===== PHASE 8: Privilege attribute proof ====="
          [ "$ROLCREATEDB_A" = "f" ] || { echo "::error::NOCREATEDB violated"; exit 1; }
          [ "$ROLCREATEROLE_A" = "f" ] || { echo "::error::NOCREATEROLE violated"; exit 1; }
          [ "$ROLSUPER_A" = "f" ] && [ "$ROLBYPASS_A" = "f" ] || { echo "::error::superuser/bypass violated"; exit 1; }
          echo "NOCREATEDB_PROVEN_BY_ATTRIBUTE=YES"
          echo "NOCREATEROLE_PROVEN_BY_ATTRIBUTE=YES"
          echo "NOSUPERUSER_NOBYPASSRLS_PROVEN_BY_ATTRIBUTE=YES"

          # Item 3: CREATE ROLE denial via if/else (no set +e needed)
          TEMP_ROLE="evil_temp_$(date +%s)_$$"
          if psql_sanad --command="BEGIN; CREATE ROLE $TEMP_ROLE; ROLLBACK;" 2>/dev/null; then
            echo "::error::CREATE ROLE succeeded — NOCREATEROLE violated"
            exit 1
          fi
          echo "CREATE_ROLE_DENIED=YES"
          echo "PRIVILEGE_NEGATIVE_TESTS=PASS"
          echo "RECOVERY_AUTH_STRICT_SHELL=PASS"

          echo "CRM_RLS_CERTIFICATION=SKIPPED (recovery_auth stage)"
          echo ""
          echo "=========================================="
          echo "RECOVERY_AUTH FINAL SUMMARY"
          echo "=========================================="
          echo "PASSWORD_RESET_AUTHORITY_CANDIDATE=MANAGEMENT_API"
          echo "PASSWORD_RESET_AUTHORITY_PROVEN=YES"
          echo "MANAGEMENT_API_PROBE=PASS"
          echo "MANAGEMENT_API_AUTH=PASS"
          echo "MANAGEMENT_API_TOKEN_PRESENT=YES"
          echo "ALTER_ROLE_HTTP_STATUS=201"
          echo "POOLER_LOGIN_WITH_NEW_PASSWORD=$PHASE4_RESULT"
          echo "CURRENT_USER_SANAD=$CURRENT_USER_SANAD"
          echo "PRE_ROTATION_INVARIANTS=PASS"
          echo "POST_ROTATION_INVARIANTS=PASS"
          echo "ROLE_FLAGS_PRESERVED=YES"
          echo "LEAST_PRIVILEGE_POSITIVE_TESTS=PASS"
          echo "PRIVILEGE_NEGATIVE_TESTS=PASS"
          echo "NOCREATEDB_PROVEN_BY_ATTRIBUTE=YES"
          echo "NOCREATEROLE_PROVEN_BY_ATTRIBUTE=YES"
          echo "PRODUCTION_REF_LOCK=PASS"
          echo "PRE_WRITE_MAIN_LOCK=PASS"
          echo "RECOVERY_AUTH_STRICT_SHELL=PASS"
          echo "CRM_RLS_CERTIFICATION=SKIPPED"
          echo "RECOVERY_AUTH_STATUS=PASS"
          echo "PASSWORD_MASKED_BEFORE_USE=YES"
          echo "PASSWORD_PERSISTED_BETWEEN_RUNS=NO"
          echo "READY_FOR_MIGRATION=YES"
          echo "READY_FOR_PRODUCTION_RELEASE=NO"
          echo "MIGRATION_WORKFLOW_HARDENING_REQUIRED=YES"
          echo "=========================================="

      # =====================================================================
      # RECOVERY_FULL — Post-migration complete certification.
      # Self-contained: generates own password, verifies migration + RLS,
      # optional Render save-only.
      # Run ONLY AFTER canonical Flyway migration succeeds.
      # =====================================================================
      - name: Recovery_full — Phase 0-9B + optional Phase 12 (full RLS certification)
        if: inputs.action == 'recovery_full'
        shell: bash
        run: |
          set -euo pipefail

          SANAD_PASSWORD_ROTATED=NO
          trap 'rc=$?; if [ $rc -ne 0 ] && [ "$SANAD_PASSWORD_ROTATED" = "YES" ]; then echo ""; echo "SANAD_PASSWORD_ROTATED_BUT_NOT_ACTIVATED=YES"; echo "  (Render still uses postgres — not a security emergency; future run may rotate again)"; fi' EXIT

          echo "PASSWORD_RESET_AUTHORITY_CANDIDATE=MANAGEMENT_API"
          echo "PASSWORD_RESET_AUTHORITY_PROVEN=NO (pending runtime verification)"

          POOLER_HOST="aws-0-eu-central-1.pooler.supabase.com"
          POOLER_PORT="5432"
          POOLER_DB="postgres"
          POOLER_USER_SANAD="sanad.$SUPABASE_PROJECT"
          SB_API="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT/database/query"

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is empty"
            echo "MANAGEMENT_API_PROBE=FAIL"
            exit 1
          fi
          SB_TOKEN="$SUPABASE_ACCESS_TOKEN"
          echo "MANAGEMENT_API_TOKEN_PRESENT=YES"
          echo "::add-mask::$SB_TOKEN"

          # Item 7: Named-field JSON parser. Uses SQL alias 'AS value'
          # and parses .[0].value instead of unnamed .[0][0].
          sb_query() {
            local sql="$1" read_only="${2:-false}"
            local payload
            payload=$(jq -n --arg q "$sql" --argjson ro "$read_only" '{query: $q, read_only: $ro}')
            local resp http_code body
            resp=$(curl --silent --show-error --write-out '\n%{http_code}' \
              -X POST "$SB_API" \
              -H "Authorization: Bearer $SB_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload" 2>&1)
            http_code=$(echo "$resp" | tail -1)
            body=$(echo "$resp" | sed '$d')
            sb_query_http="$http_code"
            sb_query_body="$body"
          }

          # Item 7: Parse named field 'value' from first row of Management API response.
          # Response format: [{"value":"f|f|f|f|t"}] or [{"value":"result"}]
          sb_value() {
            echo "$sb_query_body" | jq -r '
              if type == "array" then
                if length > 0 then .[0].value // empty else empty end
              elif type == "object" then
                .value // empty
              else
                .
              end' 2>/dev/null | tr -d '"' | tr -d '[:space:]'
          }

          # Item 7: Parse named field from specific row by label (for multi-row responses)
          sb_value_by_label() {
            local label="$1"
            echo "$sb_query_body" | jq -r --arg lbl "$label" '
              if type == "array" then
                .[] | select(.label == $lbl) | .value // empty
              else
                empty
              end' 2>/dev/null | tr -d '"' | tr -d '[:space:]'
          }

          # psql as sanad (runtime RLS channel)
          psql_sanad() {
            PGPASSWORD="$RUNTIME_PASS" psql \
              -h "$POOLER_HOST" -p "$POOLER_PORT" -U "$POOLER_USER_SANAD" -d "$POOLER_DB" \
              --no-psqlrc --set=ON_ERROR_STOP=1 --tuples-only --no-align "$@"
          }

          # Item 4: Main/SHA execution lock
          verify_main_lock() {
            local label="$1"
            git fetch origin main --quiet 2>/dev/null
            local dispatch_sha head_sha remote_main_sha
            dispatch_sha="${GITHUB_SHA:-$(git rev-parse HEAD)}"
            head_sha=$(git rev-parse HEAD)
            remote_main_sha=$(git rev-parse origin/main)
            echo "$label: GITHUB_SHA=$dispatch_sha HEAD=$head_sha origin/main=$remote_main_sha"
