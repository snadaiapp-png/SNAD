          # Item 9: FORCE-RLS structural queries (single named value)
          sb_query "SELECT (c.relrowsecurity::text || '|' || c.relforcerowsecurity::text) AS value FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname='crm_contacts';" true
