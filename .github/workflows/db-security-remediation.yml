          VALUES ('$CONTACT_A'::uuid, '$TENANT_A'::uuid, 0, 'FixtureA', 'FixtureA', 'fixturea', 'ACTIVE', 'UNKNOWN', '$USER_A'::uuid, '$USER_A'::uuid, now(), now(), NULL);
          INSERT INTO crm_entity_participants (id, tenant_id, version, entity_type, entity_id, user_id, role, added_at, added_by)
