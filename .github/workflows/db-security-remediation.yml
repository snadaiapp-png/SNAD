          echo "FRESH_CONNECTION_RC_CAPTURE=PASS"

          FRESH_GUC_IS_NULL=$(echo "$FRESH_OUT" | head -1 | tr -d '[:space:]')
          FRESH_NO_GUC_CONTACT_ROWS=$(echo "$FRESH_OUT" | tail -1 | tr -d '[:space:]')
          echo "FRESH_GUC_IS_NULL=$FRESH_GUC_IS_NULL (expect t)"
          echo "SANAD_NO_GUC_CONTACT_VISIBLE=$FRESH_NO_GUC_CONTACT_ROWS (expect 0)"

          [ "$FRESH_GUC_IS_NULL" = "t" ] || [ "$FRESH_GUC_IS_NULL" = "true" ] || { echo "::error::Fresh GUC is NOT null"; exit 1; }
