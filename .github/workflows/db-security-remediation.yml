          sb_query "SELECT t.id::text AS value FROM tenants t WHERE t.status='ACTIVE' AND t.id != '$TENANT_A' AND EXISTS (SELECT 1 FROM users u WHERE u.tenant_id=t.id AND u.status='ACTIVE') ORDER BY t.created_at DESC LIMIT 1;" true
