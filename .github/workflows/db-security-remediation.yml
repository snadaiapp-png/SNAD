          [ "$FRESH_NO_GUC_CONTACT_ROWS" = "0" ] || { echo "::error::Fresh no-GUC COUNT=$FRESH_NO_GUC_CONTACT_ROWS (expected 0)"; exit 1; }
          echo "FRESH_NO_GUC_CONTACT_PROOF=PASS"

          # Participant table is empty — VACUOUS proof
          echo "PARTICIPANT_MISSING_GUC_EXISTING_DATA_PROOF=VACUOUS"

          # =================================================================
          # PHASE 9B-2 — TRANSACTIONAL RLS FIXTURES VIA psql AS SANAD (Item 11)
          # The ENTIRE fixture MUST execute through psql as sanad, NOT Management API.
          # =================================================================
          echo "===== PHASE 9B-2: Transactional RLS fixtures (via psql as sanad) ====="

          # Discover two ACTIVE tenants with usable user IDs
          sb_query "SELECT t.id::text AS value FROM tenants t WHERE t.status='ACTIVE' AND EXISTS (SELECT 1 FROM users u WHERE u.tenant_id=t.id AND u.status='ACTIVE') ORDER BY t.created_at DESC LIMIT 1;" true
          [ "$sb_query_http" = "201" ] || { echo "::error::tenant A query failed"; exit 1; }
