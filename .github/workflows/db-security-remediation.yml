          SELECT set_config('app.tenant_id', '$TENANT_A', true);
          SELECT 'CROSS_CONTACT_B_FROM_A' AS label, COUNT(*)::text AS value FROM crm_contacts WHERE id='$CONTACT_B'::uuid;
          SELECT 'CROSS_PARTICIPANT_B_FROM_A' AS label, COUNT(*)::text AS value FROM crm_entity_participants WHERE id='$PARTICIPANT_B'::uuid;

          -- CROSS-TENANT B→A: tenant B context, select A → expect 0
          SELECT set_config('app.tenant_id', '$TENANT_B', true);
          SELECT 'CROSS_CONTACT_A_FROM_B' AS label, COUNT(*)::text AS value FROM crm_contacts WHERE id='$CONTACT_A'::uuid;
          SELECT 'CROSS_PARTICIPANT_A_FROM_B' AS label, COUNT(*)::text AS value FROM crm_entity_participants WHERE id='$PARTICIPANT_A'::uuid;

