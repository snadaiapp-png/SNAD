          echo "PRODUCTION_G6_MIGRATION=PASS"

          # Item 9: FORCE-RLS structural queries (single named value)
          sb_query "SELECT (CASE WHEN c.relrowsecurity THEN 't' ELSE 'f' END || '|' || CASE WHEN c.relforcerowsecurity THEN 't' ELSE 'f' END) AS value FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname='crm_contacts';" true
          [ "$sb_query_http" = "201" ] || { echo "::error::crm_contacts RLS query failed"; exit 1; }
          CONTACTS_RLS=$(sb_value)
          echo "CRM_CONTACTS_RLS_FLAGS=$CONTACTS_RLS (expect true|true or t|t)"
          # Item 1 (v6.1): explicit exact comparisons (case | is pattern separator, not literal)
          if [ "$CONTACTS_RLS" = "true|true" ] || [ "$CONTACTS_RLS" = "t|t" ]; then
