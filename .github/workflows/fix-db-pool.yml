name: Fix DB Pool Exhaustion

# ============================================================
# EMERGENCY FIX: Supabase DB pool exhaustion
# ------------------------------------------------------------
# Root cause: Supabase free tier session-mode pooler allows
# max 15 concurrent connections. Both sanad-backend AND
# sanad-backend-v2 are each trying to open 5+ connections,
# plus my psql test connections, exhausting the pool.
#
# Error: FATAL: (EMAXCONNSESSION) max clients reached in
#        session mode - max clients are limited to pool_size: 15
#
# Fix:
#   1. Suspend sanad-backend-v2 (frees ~5 connections)
#   2. Reduce DATABASE_POOL_MAX on sanad-backend to 2
#   3. Trigger deploy on sanad-backend
#   4. Verify login works
# ============================================================

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "fix-pool" to confirm'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  fix:
    name: Fix DB pool exhaustion
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    if: github.event.inputs.confirm == 'fix-pool'

    steps:
      - name: Suspend sanad-backend-v2 to free DB connections
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          V2_SERVICE_ID: srv-d9tk3g740ujc73ehekt0
        run: |
          set -euo pipefail
          echo "=== Suspending sanad-backend-v2 (srv-d9tk3g740ujc73ehekt0) ==="
          STATUS=$(curl -sS -o /tmp/suspend.json -w "%{http_code}" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${V2_SERVICE_ID}/suspend" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json")
          echo "Suspend HTTP ${STATUS}"
          cat /tmp/suspend.json || true
          echo ""
          echo "Waiting 15s for connections to be released..."
          sleep 15

      - name: Reduce DATABASE_POOL_MAX on sanad-backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          set -euo pipefail
          echo "=== Setting DATABASE_POOL_MAX=2 on sanad-backend ==="
          PAYLOAD=$(python3 -c 'import json; print(json.dumps({"value": "2"}))')
          STATUS=$(curl -sS -o /tmp/pool.json -w "%{http_code}" --max-time 30 \
            -X PUT \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://api.render.com/v1/services/${BACKEND_ID}/env-vars/DATABASE_POOL_MAX")
          echo "Set DATABASE_POOL_MAX HTTP ${STATUS}"
          echo ""
          echo "=== Setting DATABASE_POOL_MIN=1 ==="
          PAYLOAD=$(python3 -c 'import json; print(json.dumps({"value": "1"}))')
          STATUS=$(curl -sS -o /tmp/pool2.json -w "%{http_code}" --max-time 30 \
            -X PUT \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://api.render.com/v1/services/${BACKEND_ID}/env-vars/DATABASE_POOL_MIN")
          echo "Set DATABASE_POOL_MIN HTTP ${STATUS}"

      - name: Trigger deploy on sanad-backend
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          set -euo pipefail
          echo "=== Triggering deploy ==="
          STATUS=$(curl -sS -o /tmp/deploy.json -w "%{http_code}" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{"clearCache":"do_not_clear"}')
          echo "Deploy trigger HTTP ${STATUS}"
          DEPLOY_ID=$(python3 -c "import json; print(json.load(open('/tmp/deploy.json')).get('id',''))")
          echo "Deploy ID: ${DEPLOY_ID}"
          echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          set -euo pipefail
          DEPLOY_ID="${{ steps.deploy.outputs.deploy_id }}"
          echo "Waiting for deploy ${DEPLOY_ID}..."
          for i in $(seq 1 80); do
            sleep 15
            STATUS=$(curl -sS --max-time 30 \
              "https://api.render.com/v1/services/${BACKEND_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" | python3 -c "import json, sys; print(json.load(sys.stdin).get('status','unknown'))")
            echo "  Attempt ${i}: ${STATUS}"
            if [ "${STATUS}" = "live" ]; then echo "✓ DEPLOY LIVE!"; exit 0; fi
            if echo "${STATUS}" | grep -qE "failed|canceled|deactivated"; then
              echo "::error::Deploy ${STATUS}"
              exit 1
            fi
          done
          echo "::error::Timeout"
          exit 1

      - name: Verify health and login
        run: |
          sleep 10
          echo "=== Health ==="
          curl -sS --max-time 15 "https://sanad-backend-mcrj.onrender.com/actuator/health"
          echo ""
          echo "=== Login test (wrong password → expect 401 not 500) ==="
          curl -sS --max-time 15 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -H "Origin: https://snad-app.vercel.app" \
            -d '{"email":"admin@snad.ai","password":"wrong"}' \
            -w "\nHTTP %{http_code}\n"
          echo ""
          echo "=== Access-check ==="
          curl -sS --max-time 10 "https://sanad-backend-mcrj.onrender.com/api/v1/control-plane/access-check"
