name: Users Production Release

on:
  workflow_dispatch:
    inputs:
      governance_sha:
        description: Exact current main SHA containing only approved Users release-governance changes after the image SHA
        required: true
      deployment_image_sha:
        description: Exact immutable backend image SHA to deploy
        required: true
      rollback_on_failure:
        description: Redeploy and verify the previously live image if any Users production gate fails
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: read

concurrency:
  group: users-production-release
  cancel-in-progress: false

env:
  PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/snad-backend
  CANONICAL_OWNER_EMAIL: snad.ai.app@gmail.com
  CANONICAL_OWNER_ID: 00000000-0000-0000-0000-000000000010

jobs:
  deploy-and-verify-users:
    name: Deploy Users image and verify production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANONICAL_OWNER_PASSWORD: ${{ secrets.CANONICAL_OWNER_PASSWORD }}

    steps:
      - name: Validate protected Users release inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in RENDER_API_KEY RENDER_SERVICE_ID PRODUCTION_BASE_URL CANONICAL_OWNER_PASSWORD; do
            test -n "${!name:-}" || { echo "::error::$name is required"; exit 1; }
          done
          GOVERNANCE_SHA='${{ inputs.governance_sha }}'
          DEPLOYMENT_IMAGE_SHA='${{ inputs.deployment_image_sha }}'
          [[ "$GOVERNANCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::governance_sha must be a full lowercase SHA"; exit 1; }
          [[ "$DEPLOYMENT_IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::deployment_image_sha must be a full lowercase SHA"; exit 1; }
          [[ "$PRODUCTION_BASE_URL" == https://* ]] || { echo "::error::PRODUCTION_BASE_URL must use HTTPS"; exit 1; }
          echo "::add-mask::$CANONICAL_OWNER_PASSWORD"

      - name: Verify governance SHA is current main head
        id: governance
        shell: bash
        run: |
          set -euo pipefail
          GOVERNANCE_SHA='${{ inputs.governance_sha }}'
          remote_main=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')
          test "$remote_main" = "$GOVERNANCE_SHA" || {
            echo "::error::Requested governance SHA is not the current main head"
            echo "requested=$GOVERNANCE_SHA"
            echo "current_main=$remote_main"
            exit 1
          }
          echo "sha=$remote_main" >> "$GITHUB_OUTPUT"

      - name: Checkout exact governance SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.governance.outputs.sha }}
          fetch-depth: 0

      - name: Verify deployment image lineage is Users-governance only
        shell: bash
        run: |
          set -euo pipefail
          GOVERNANCE_SHA='${{ inputs.governance_sha }}'
          DEPLOYMENT_IMAGE_SHA='${{ inputs.deployment_image_sha }}'
          git cat-file -e "$DEPLOYMENT_IMAGE_SHA^{commit}"
          git merge-base --is-ancestor "$DEPLOYMENT_IMAGE_SHA" "$GOVERNANCE_SHA" || {
            echo "::error::deployment_image_sha is not an ancestor of governance_sha"
            exit 1
          }
          changed_paths="$(git diff --name-only "$DEPLOYMENT_IMAGE_SHA..$GOVERNANCE_SHA")"
          test -n "$changed_paths" || {
            echo "Image SHA equals governance SHA; no release-governance delta to validate."
            exit 0
          }
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/users-production-release.yml|\
              .github/workflows/users-production-certification.yml|\
              .github/workflows/users-module-closure.yml|\
              tests/ci/test_users_module_closure_workflow.py)
                ;;
              *)
                echo "::error::Non-Users-governance path exists between deployment image and current main: $path"
                exit 1
                ;;
            esac
          done <<< "$changed_paths"
          echo "Users release lineage: PASS"

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Verify exact immutable image exists without Docker
        id: image
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_IMAGE_SHA='${{ inputs.deployment_image_sha }}'
          IMAGE_REF="${REGISTRY}/${IMAGE_NAME}:${DEPLOYMENT_IMAGE_SHA}"
          token=$(curl --fail-with-body --silent --show-error \
            --user "$GITHUB_ACTOR:$GITHUB_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${IMAGE_NAME}:pull" | jq -r '.token // empty')
          test -n "$token" || { echo "::error::GHCR pull token was not issued"; exit 1; }
          echo "::add-mask::$token"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${IMAGE_NAME}/manifests/$DEPLOYMENT_IMAGE_SHA" \
            > /tmp/users-image-manifest.json
          jq -e '.schemaVersion == 2' /tmp/users-image-manifest.json >/dev/null
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          echo "Exact immutable image verified: $IMAGE_REF"

      - name: Validate Render runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100" \
            > /tmp/users-render-env.json
          test "$(jq 'length' /tmp/users-render-env.json)" -lt 100 || {
            echo "::error::Cannot prove complete Render environment pagination"
            exit 1
          }
          jq '[.[]? | (.envVar // .)]' /tmp/users-render-env.json > /tmp/users-render-env-normalized.json
          required=(SPRING_PROFILES_ACTIVE DATABASE_URL DATABASE_USERNAME DATABASE_PASSWORD JWT_SECRET BOOTSTRAP_ENABLED SANAD_CONTROL_PLANE_TENANT_ID)
          for key in "${required[@]}"; do
            jq -e --arg key "$key" 'any(.[]; .key == $key and ((.value // "") | length > 0))' /tmp/users-render-env-normalized.json >/dev/null || {
              echo "::error::Required Render environment value is missing: $key"
              exit 1
            }
          done
          test "$(jq -r '.[] | select(.key == "BOOTSTRAP_ENABLED") | .value' /tmp/users-render-env-normalized.json)" = "false" || {
            echo "::error::BOOTSTRAP_ENABLED must be false in production"
            exit 1
          }
          control_tenant_id=$(jq -r '.[] | select(.key == "SANAD_CONTROL_PLANE_TENANT_ID") | .value' /tmp/users-render-env-normalized.json)
          database_username=$(jq -r '.[] | select(.key == "DATABASE_USERNAME") | .value' /tmp/users-render-env-normalized.json)
          [[ "$control_tenant_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || {
            echo "::error::SANAD_CONTROL_PLANE_TENANT_ID is not a UUID"
            exit 1
          }
          echo "::add-mask::$control_tenant_id"
          echo "::add-mask::$database_username"
          echo "CONTROL_PLANE_TENANT_ID=$control_tenant_id" >> "$GITHUB_ENV"
          echo "DATABASE_USERNAME=$database_username" >> "$GITHUB_ENV"

      - name: Verify Control Plane tenant in production database
        shell: bash
        run: bash scripts/production/verify-control-plane-tenant.sh

      - name: Capture previous live image reference
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20" \
            > /tmp/users-render-deploys.json
          previous_image=$(jq -r '[.[]? | (.deploy // .) | select((.status // "") == "live")] | .[0].image.ref // empty' /tmp/users-render-deploys.json)
          test -n "$previous_image" || { echo "::error::No current live image could be captured for rollback"; exit 1; }
          echo "image_ref=$previous_image" >> "$GITHUB_OUTPUT"
          echo "Previous live image captured."

      - name: Deploy exact Users image to Render
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF='${{ steps.image.outputs.image_ref }}'
          jq -n --arg image "$IMAGE_REF" '{imageUrl:$image,clearCache:"do_not_clear"}' > users-render-request.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data @users-render-request.json \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            > users-render-deployment.json
          deploy_id=$(jq -r '(.deploy // .).id // empty' users-render-deployment.json)
          test -n "$deploy_id"
          echo "id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for exact Render deployment
        shell: bash
        run: |
          set -euo pipefail
          deploy_id='${{ steps.deploy.outputs.id }}'
          expected_image='${{ steps.image.outputs.image_ref }}'
          for attempt in $(seq 1 270); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" \
              > users-render-deployment-state.json
            status=$(jq -r '(.deploy // .).status // "pending"' users-render-deployment-state.json)
            echo "Render status: $status"
            case "$status" in
              live)
                deployed_image=$(jq -r '(.deploy // .).image.ref // empty' users-render-deployment-state.json)
                test "$deployed_image" = "$expected_image" || {
                  echo "::error::Live Render image does not match requested immutable image"
                  exit 1
                }
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "::error::Render deployment failed with status $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Render deployment timed out"
          exit 1

      - name: Wait for production readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            code=$(curl --silent --show-error --output /tmp/users-readiness.json --write-out '%{http_code}' --max-time 20 "$PRODUCTION_BASE_URL/actuator/health/readiness" || true)
            if [ "$code" = "200" ] && jq -e '.status == "UP"' /tmp/users-readiness.json >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production readiness did not become UP"
          exit 1

      - name: Verify Flyway runtime invariants on live service
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100" \
            > /tmp/users-render-live-env.json
          live_env() {
            jq -r '[.[]? | (.envVar // .)] | .[] | select(.key == $k) | .value // empty' --arg k "$1" /tmp/users-render-live-env.json
          }
          FLYWAY_ENABLED_LIVE="$(live_env FLYWAY_ENABLED)"
          FLYWAY_OUT_OF_ORDER_LIVE="$(live_env FLYWAY_OUT_OF_ORDER)"
          test "$FLYWAY_ENABLED_LIVE" = "true" || {
            echo "::error::FLYWAY_ENABLED must be true in production"
            exit 1
          }
          if [ -n "$FLYWAY_OUT_OF_ORDER_LIVE" ] && [ "$FLYWAY_OUT_OF_ORDER_LIVE" != "false" ]; then
            echo "::error::FLYWAY_OUT_OF_ORDER must be false or unset in production"
            exit 1
          fi
          echo "Flyway runtime invariants: PASS"

      - name: Verify Flyway production compatibility
        shell: bash
        run: bash scripts/production/verify-flyway.sh

      - name: Verify production security boundary
        shell: bash
        run: bash scripts/production/verify-auth-contract.sh

      - name: Verify Users production read-only contract
        shell: bash
        run: |
          set -euo pipefail
          base="${PRODUCTION_BASE_URL%/}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          login_payload=$(jq -n \
            --arg email "$CANONICAL_OWNER_EMAIL" \
            --arg password "$CANONICAL_OWNER_PASSWORD" \
            --arg tenant "$CONTROL_PLANE_TENANT_ID" \
            '{email:$email,password:$password,tenantId:$tenant}')
          login_status=$(curl --silent --show-error --location \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$login_payload" \
            --output "$work/login.json" \
            --write-out '%{http_code}' \
            "$base/api/v1/auth/login")
          test "$login_status" = "200" || { echo "::error::Canonical owner login failed with HTTP $login_status"; exit 1; }
          jq -e --arg owner "$CANONICAL_OWNER_ID" --arg tenant "$CONTROL_PLANE_TENANT_ID" '
            (.user.id // .user.userId // .userId) == $owner
            and (.user.tenantId // .tenantId) == $tenant
            and (.accessToken | type == "string" and length > 0)
          ' "$work/login.json" >/dev/null || {
            echo "::error::Canonical owner login identity/tenant binding is invalid"
            exit 1
          }
          token=$(jq -r '.accessToken // empty' "$work/login.json")
          test -n "$token" || { echo "::error::Login returned no accessToken"; exit 1; }
          echo "::add-mask::$token"
          auth="Authorization: Bearer $token"

          read_json() {
            local path="$1" output="$2"
            local status
            status=$(curl --silent --show-error --location \
              --request GET \
              --header "$auth" \
              --header 'Accept: application/json' \
              --output "$output" \
              --write-out '%{http_code}' \
              "$base$path")
            test "$status" = "200" || { echo "::error::GET $path returned HTTP $status"; exit 1; }
            jq -e . "$output" >/dev/null || { echo "::error::GET $path did not return JSON"; exit 1; }
          }

          read_json '/api/v1/executive/users' "$work/users.json"
          jq -e 'type == "array"' "$work/users.json" >/dev/null
          owner_id=$(jq -r --arg email "$CANONICAL_OWNER_EMAIL" \
            '[.[] | select((.email | ascii_downcase) == ($email | ascii_downcase) and .accountStatus == "ACTIVE" and .membershipStatus == "ACTIVE")][0].userId // empty' \
            "$work/users.json")
          test -n "$owner_id" || { echo "::error::Canonical owner is absent or inactive in executive users"; exit 1; }
          [[ "$owner_id" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Canonical owner userId is invalid"; exit 1; }
          test "$owner_id" = "$CANONICAL_OWNER_ID" || {
            echo "::error::Executive Users canonical owner ID does not match governed owner ID"
            exit 1
          }

          read_json '/api/v1/executive/roles' "$work/roles.json"
          jq -e 'type == "array" and any(.[]; .code == "PLATFORM_OWNER" and .status == "ACTIVE" and .roleType == "SYSTEM" and .protectedRole == true and .ownerRole == true)' \
            "$work/roles.json" >/dev/null || {
            echo "::error::Protected ACTIVE PLATFORM_OWNER role is not visible"
            exit 1
          }

          read_json '/api/v1/executive/capabilities' "$work/capabilities.json"
          jq -e 'type == "array" and any(.[]; .code == "PLATFORM.USER.READ" and .status == "ACTIVE") and any(.[]; .code == "PLATFORM.ROLE.READ" and .status == "ACTIVE")' \
            "$work/capabilities.json" >/dev/null || {
            echo "::error::Mandatory Users read capabilities are not visible"
            exit 1
          }

          read_json "/api/v1/executive/users/$owner_id/roles" "$work/owner-roles.json"
          jq -e 'type == "array" and any(.[]; .roleCode == "PLATFORM_OWNER" and .status == "ACTIVE")' \
            "$work/owner-roles.json" >/dev/null || {
            echo "::error::Canonical owner has no ACTIVE PLATFORM_OWNER assignment"
            exit 1
          }

          read_json "/api/v1/executive/users/$owner_id/permissions" "$work/owner-permissions.json"
          jq -e 'type == "array" and index("PLATFORM.USER.READ") != null and index("PLATFORM.ROLE.READ") != null' \
            "$work/owner-permissions.json" >/dev/null || {
            echo "::error::Canonical owner effective permissions are missing Users read capabilities"
            exit 1
          }

          echo "Users production read-only contract: PASS"

      - name: Write sanitized Users release evidence
        if: success()
        shell: bash
        run: |
          jq -n \
            --arg governanceSha '${{ inputs.governance_sha }}' \
            --arg deploymentImageSha '${{ inputs.deployment_image_sha }}' \
            --arg imageRef '${{ steps.image.outputs.image_ref }}' \
            --arg deploymentId '${{ steps.deploy.outputs.id }}' \
            --arg previousImageRef '${{ steps.previous.outputs.image_ref }}' \
            '{schema:"sanad.users.production-release.v1",result:"PASS",governanceSha:$governanceSha,deploymentImageSha:$deploymentImageSha,imageRef:$imageRef,deploymentId:$deploymentId,previousImageRef:$previousImageRef,readiness:"PASS",flyway:"PASS",securityBoundary:"PASS",usersReadContract:"PASS"}' \
            > users-production-release-evidence.json

      - name: Upload Users release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: users-production-release-${{ github.run_id }}
          path: |
            users-render-deployment.json
            users-render-deployment-state.json
            users-production-release-evidence.json
            users-render-rollback.json
            users-render-rollback-state.json
          if-no-files-found: warn
          retention-days: 90

      - name: Roll back failed Users release
        if: failure() && inputs.rollback_on_failure && steps.previous.outputs.image_ref != ''
        shell: bash
        run: |
          set -euo pipefail
          previous_image='${{ steps.previous.outputs.image_ref }}'
          jq -n --arg image "$previous_image" '{imageUrl:$image,clearCache:"do_not_clear"}' > users-rollback-request.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data @users-rollback-request.json \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            > users-render-rollback.json
          rollback_id=$(jq -r '(.deploy // .).id // empty' users-render-rollback.json)
          test -n "$rollback_id"
          for attempt in $(seq 1 270); do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$rollback_id" \
              > users-render-rollback-state.json
            status=$(jq -r '(.deploy // .).status // "pending"' users-render-rollback-state.json)
            case "$status" in
              live)
                rollback_image=$(jq -r '(.deploy // .).image.ref // empty' users-render-rollback-state.json)
                test "$rollback_image" = "$previous_image" || { echo "::error::Rollback became live on the wrong image"; exit 1; }
                echo "Rollback verified live."
                exit 0
                ;;
              build_failed|update_failed|canceled|deactivated)
                echo "::error::Rollback failed with status $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Rollback timed out"
          exit 1
