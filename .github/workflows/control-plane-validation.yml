name: Production Control Plane Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'render.yaml'
      - '.github/workflows/render-deploy.yml'
      - '.github/workflows/database-migrate.yml'
      - '.github/workflows/render-rollback.yml'
      - '.github/workflows/control-plane-validation.yml'
      - 'scripts/production/**'
      - 'docs/operations/render-production-control-plane.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          bash -n scripts/production/verify-flyway.sh
          bash -n scripts/production/verify-auth-contract.sh
      - name: Validate Clean-Room Blueprint contract
        run: |
          grep -q 'runtime: image' render.yaml
          grep -q 'ghcr.io/snadaiapp-png/snad-backend:' render.yaml
          grep -Eq 'autoDeployTrigger:[[:space:]]+("?off"?)' render.yaml
          grep -q 'healthCheckPath: /actuator/health/readiness' render.yaml
          grep -A1 'key: FLYWAY_ENABLED' render.yaml | grep -q 'value: "false"'
          grep -A1 'key: BOOTSTRAP_ENABLED' render.yaml | grep -q 'value: "false"'
          ! grep -Eq 'BOOTSTRAP_(TENANT_ID|ADMIN_EMAIL|ADMIN_CREDENTIAL|ADMIN_DISPLAY_NAME|AUDIT_ACTOR)' render.yaml
      - name: Validate canonical workflow YAML
        run: |
          ruby -e "require 'yaml'; %w[.github/workflows/render-deploy.yml .github/workflows/database-migrate.yml .github/workflows/render-rollback.yml].each { |f| YAML.load_file(f, aliases: true) }"
