# G1 P0: daemonless OCI publication. No Docker CLI, daemon, or Docker actions.
# Manual + protected only. This builds/publishes the artifact; NEVER deploys to Render.
# This workflow is a PROPOSED remediation and does not constitute G1/CAB approval.
name: Publish Render Backend Image

on:
  workflow_dispatch:
    inputs:
      change_ticket:
        description: 'Actual independently approved CAB ticket (G1-CHG-NNN); format alone is not approval'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: publish-render-backend-image
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and attest exact-main backend OCI image (no deployment)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 75
    steps:
      - name: Require exact main and approved ticket review
        shell: bash
        env:
          CHANGE_TICKET: ${{ inputs.change_ticket }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          ticket="$CHANGE_TICKET"
          [[ "$ticket" =~ ^G1-CHG-[0-9]+$ ]] || {
            echo "::error::Missing/invalid CAB ticket format (not proof of approval)"
            exit 1
          }
          current_main="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')"
          test "$current_main" = "$GITHUB_SHA" || {
            echo "::error::Current main differs from dispatched SHA"
            exit 1
          }
          echo "SOURCE_CURRENT_MAIN_VERIFIED=$GITHUB_SHA"
          echo "CAB_TICKET_FORMAT_VALID_ONLY; Production reviewers must verify the actual authorization."
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s apps/sanad-platform/Containerfile
      - name: Install daemonless OCI tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get -y -qq install buildah skopeo
          buildah --version
          skopeo --version
          command -v buildah
          # A hosted runner may have an unused daemon socket; this workflow never invokes it.
      - name: Build OCI image with Buildah (no Docker daemon)
        shell: bash
        run: |
          set -euo pipefail
          image_ref="ghcr.io/$GITHUB_REPOSITORY_OWNER/snad-backend:$GITHUB_SHA"
          sudo buildah bud --format oci --isolation chroot --layers=false \
            --build-arg "RENDER_GIT_COMMIT=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image_ref" -f apps/sanad-platform/Containerfile apps/sanad-platform
          sudo buildah inspect --type image "$image_ref" > "$RUNNER_TEMP/image-inspect.json"
          jq -e --arg sha "$GITHUB_SHA" '
            (.OCIv1.config.User == "sanad") and
            (.OCIv1.config.Env | any(. == "SPRING_PROFILES_ACTIVE=prod")) and
            (.OCIv1.config.Labels["org.opencontainers.image.revision"] == $sha)
          ' "$RUNNER_TEMP/image-inspect.json" >/dev/null
          echo "OCI_BUILD_CONFIG=PASS (non-root runtime, prod profile, exact SHA)"
      - name: Publish immutable SHA tag, verify registry digest
        id: publish
        shell: bash
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          set -euo pipefail
          umask 077
          image_name="ghcr.io/$GITHUB_REPOSITORY_OWNER/snad-backend"
          image_ref="$image_name:$GITHUB_SHA"
          auth="$RUNNER_TEMP/g1-ghcr-auth.json"
          digest_path="$RUNNER_TEMP/g1-oci-digest"
          trap 'rm -f "$auth"' EXIT
          printf '%s' "$GITHUB_TOKEN" | sudo buildah login --authfile "$auth" -u "$GITHUB_ACTOR" --password-stdin ghcr.io >/dev/null
          sudo buildah push --authfile "$auth" --digestfile "$digest_path" "$image_ref" "$image_ref"
          digest="$(sudo cat "$digest_path" | tr -d '\r\n')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Invalid immutable digest from OCI push"
            exit 1
          }
          sudo skopeo inspect --raw --authfile "$auth" "docker://$image_ref" > "$RUNNER_TEMP/manifest.json"
          observed="sha256:$(sha256sum "$RUNNER_TEMP/manifest.json" | awk '{print $1}')"
          test "$digest" = "$observed" || {
            echo "::error::Registry manifest digest mismatch"
            exit 1
          }
          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "OCI_SHA_TAG_AND_MANIFEST_DIGEST=PASS: $digest"
      - name: Stage GHCR credentials for attestation pushes (Docker-free)
        shell: bash
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: |
          set -euo pipefail
          # actions/attest resolves its registry credentials from the standard
          # OCI/docker credential store file. No Docker daemon and no docker
          # CLI are involved — only this JSON credentials file, written with
          # the ephemeral workflow token (packages: write). Without it the
          # attestation push fails with "No credentials found for registry
          # ghcr.io" (observed on the first real publication, run 42935530898).
          umask 077
          mkdir -p "$HOME/.docker"
          auth="$(printf '%s:%s' "$GITHUB_ACTOR" "$GITHUB_TOKEN" | base64 -w0)"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" > "$HOME/.docker/config.json"

      - name: Generate pinned SPDX image SBOM directly from OCI registry
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ${{ steps.publish.outputs.image_name }}@${{ steps.publish.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sanad-backend.spdx.json
          artifact-name: sanad-backend-${{ github.sha }}-sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Verify SBOM has actual OCI package inventory
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/sanad-backend.spdx.json"
          jq -e '.spdxVersion | startswith("SPDX-")' "$RUNNER_TEMP/sanad-backend.spdx.json" >/dev/null
          jq -e '(.packages | type=="array") and (.packages | length > 0)' "$RUNNER_TEMP/sanad-backend.spdx.json" >/dev/null
          echo "REGISTRY_OCI_SBOM=PASS (SPDX JSON, pinned Syft, direct registry scan)"
      - name: Attest SBOM to exact published image digest
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b
        with:
          subject-name: ${{ steps.publish.outputs.image_name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sanad-backend.spdx.json
          push-to-registry: true
      - name: Attest immutable OCI digest with GitHub provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: '${{ steps.publish.outputs.image_name }}'
          subject-digest: '${{ steps.publish.outputs.digest }}'
          push-to-registry: true
      - name: Publication evidence and explicit limitations
        shell: bash
        run: |
          {
            echo "## Daemonless OCI backend publication"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- OCI image: ${{ steps.publish.outputs.image_ref }}"
            echo "- Registry manifest digest: ${{ steps.publish.outputs.digest }}"
            echo "- GitHub build-provenance attestation: requested"
            echo "- Docker CLI/daemon/actions: not used in this workflow"
            echo "- No deployment or database mutation performed"
            echo "- Not G1/CAB authorization; Production review verifies real ticket"
            echo "- Pinned Syft SPDX SBOM: generated from immutable registry digest and attached as SBOM attestation (validate the actual workflow result before certification)"
          } >> "$GITHUB_STEP_SUMMARY"
