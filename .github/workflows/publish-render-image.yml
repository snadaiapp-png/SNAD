name: Publish Backend Image (Build Only)

# Clean-Room safety boundary:
# This workflow owns image construction and immutable GHCR publication
# certification only. It must never read Render credentials, mutate Render,
# run Production Flyway, or deploy Production.

on:
  push:
    branches:
      - main
      - infra/backend-clean-room-v1
    paths:
      - "apps/sanad-platform/**"
      - ".github/workflows/publish-render-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-backend-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/snad-backend

jobs:
  build-and-push:
    name: Build and publish immutable backend image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact-SHA image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/sanad-platform
          file: apps/sanad-platform/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            RENDER_GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify immutable published digest and revision
        id: verify
        shell: bash
        env:
          PUBLISHED_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ ! "$PUBLISHED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "BLOCKED: build output is not an immutable sha256 digest." >&2
            exit 2
          fi

          IMAGE_REPOSITORY="${REGISTRY}/${IMAGE_NAME}"
          IMMUTABLE_REF="${IMAGE_REPOSITORY}@${PUBLISHED_DIGEST}"

          # Verify the registry can resolve the exact manifest digest first,
          # then pull that exact immutable reference back from GHCR.
          docker buildx imagetools inspect "$IMMUTABLE_REF" >/dev/null
          docker pull "$IMMUTABLE_REF"

          REVISION=$(docker image inspect "$IMMUTABLE_REF" \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          if [[ "$REVISION" != "$GITHUB_SHA" ]]; then
            echo "BLOCKED: published image revision label does not match source SHA." >&2
            exit 3
          fi

          echo "immutable_ref=$IMMUTABLE_REF" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          echo "IMMUTABLE_DIGEST_GATE=PASS"
          echo "REVISION_LABEL_GATE=PASS"

      - name: Create immutable image evidence
        shell: bash
        env:
          PUBLISHED_DIGEST: ${{ steps.build.outputs.digest }}
          IMMUTABLE_REF: ${{ steps.verify.outputs.immutable_ref }}
          VERIFIED_REVISION: ${{ steps.verify.outputs.revision }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          jq -n \
            --arg sourceSha "$GITHUB_SHA" \
            --arg imageTag "$IMAGE_TAG" \
            --arg digest "$PUBLISHED_DIGEST" \
            --arg immutableRef "$IMMUTABLE_REF" \
            --arg revision "$VERIFIED_REVISION" \
            --arg sbom "true" \
            --arg provenance "mode=max" \
            '{sourceSha:$sourceSha,imageTag:$imageTag,digest:$digest,immutableRef:$immutableRef,revision:$revision,sbom:$sbom,provenance:$provenance,deploymentPerformed:false,renderMutationPerformed:false}' \
            > backend-image-evidence.json

          {
            echo "## Backend image — immutable publication certification"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Immutable tag: $IMAGE_TAG"
            echo "- Digest: $PUBLISHED_DIGEST"
            echo "- Immutable reference: $IMMUTABLE_REF"
            echo "- Revision label: $VERIFIED_REVISION"
            echo "- SBOM: ENABLED"
            echo "- Provenance: mode=max"
            echo "- Production deployment: NOT PERFORMED"
            echo "- Render configuration mutation: NOT PERFORMED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable image evidence
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-evidence-${{ github.run_id }}
          path: backend-image-evidence.json
          if-no-files-found: error
          retention-days: 90
