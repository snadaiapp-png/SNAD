name: Publish Backend Image (Build Only)

# Clean-Room safety boundary:
# This workflow owns image construction only. It must never read Render
# credentials, mutate Render, run Production Flyway, or deploy Production.

on:
  push:
    branches:
      - main
    paths:
      - "apps/sanad-platform/**"
      - ".github/workflows/publish-render-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-backend-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/snad-backend

jobs:
  build-and-push:
    name: Build and publish immutable backend image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish exact-SHA image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/sanad-platform
          file: apps/sanad-platform/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            RENDER_GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create immutable image evidence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ steps.build.outputs.digest }}" || {
            echo "::error::Image build did not return a digest"
            exit 1
          }

          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          cat > backend-image-evidence.json <<JSON
          {
            "sourceSha": "${{ github.sha }}",
            "imageTag": "${IMAGE_TAG}",
            "digest": "${{ steps.build.outputs.digest }}",
            "deploymentPerformed": false,
            "renderMutationPerformed": false
          }
          JSON

          {
            echo "## Backend image — build only"
            echo "- Source SHA: ${{ github.sha }}"
            echo "- Immutable tag: ${IMAGE_TAG}"
            echo "- Digest: ${{ steps.build.outputs.digest }}"
            echo "- Production deployment: NOT PERFORMED"
            echo "- Render configuration mutation: NOT PERFORMED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable image evidence
        uses: actions/upload-artifact@v4
        with:
          name: backend-image-evidence-${{ github.run_id }}
          path: backend-image-evidence.json
          if-no-files-found: error
          retention-days: 90
