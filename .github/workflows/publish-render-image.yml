name: Publish Backend Image (Build Only)

# Clean-Room R1 safety boundary:
# This workflow may build and publish backend images, but it MUST NOT read
# Render credentials, mutate Render environment variables, run Flyway against
# production, or trigger a production deployment. Deployment is owned by a
# separate protected release workflow introduced later in the clean-room plan.

on:
  push:
    branches:
      - main
    paths:
      - "apps/sanad-platform/**"
      - ".github/workflows/publish-render-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-backend-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/snad-backend

jobs:
  build-and-push:
    name: Build and publish immutable backend image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/sanad-platform
          file: apps/sanad-platform/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            RENDER_GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable image evidence
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ steps.build.outputs.digest }}" || {
            echo "::error::Image build did not return a digest"
            exit 1
          }
          {
            echo "## Backend image — build only"
            echo "- Source SHA: ${{ github.sha }}"
            echo "- Immutable tag: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            echo "- Digest: ${{ steps.build.outputs.digest }}"
            echo "- Production deployment: NOT PERFORMED"
            echo "- Render configuration mutation: NOT PERFORMED"
          } >> "$GITHUB_STEP_SUMMARY"
