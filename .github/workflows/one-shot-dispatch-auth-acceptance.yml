name: One-Shot Dispatch Auth Tenant Production Acceptance

on:
  push:
    branches:
      - ops/dispatch-auth-acceptance-19357501
    paths:
      - ".github/workflows/one-shot-dispatch-auth-acceptance.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch exact-main auth tenant acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_MAIN_SHA: 193575017b0ed587d8e4d5b810e90c540e5ec5a0
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Verify current main lock
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api --repo "$GITHUB_REPOSITORY" repos/$GITHUB_REPOSITORY/branches/main --jq '.commit.sha')"
          test "$current_main" = "$EXPECTED_MAIN_SHA" || {
            echo "::error::Main drift detected: expected=$EXPECTED_MAIN_SHA actual=$current_main"
            exit 1
          }

      - name: Dispatch new auth tenant production acceptance
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run auth-tenant-production-acceptance.yml             --repo "$GITHUB_REPOSITORY"             --ref main
          echo "dispatched_at=$dispatched_at" >> "$GITHUB_OUTPUT"

      - name: Resolve newly-created acceptance run
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          started="${{ steps.dispatch.outputs.dispatched_at }}"
          run_id=""
          for _ in $(seq 1 60); do
            response="$(gh api --repo "$GITHUB_REPOSITORY" "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXPECTED_MAIN_SHA&per_page=100")"
            run_id="$(jq -r --arg started "$started" '
              [.workflow_runs[]
                | select(
                    .name == "Auth Tenant Production Acceptance"
                    and .event == "workflow_dispatch"
                    and .head_sha == env.EXPECTED_MAIN_SHA
                    and .created_at >= $started
                  )
              ]
              | sort_by(.created_at)
              | first.id // empty
            ' <<<"$response")"
            [ -n "$run_id" ] && break
            sleep 5
          done
          test -n "$run_id" || {
            echo "::error::New exact-SHA auth acceptance run was not observed"
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "AUTH_ACCEPTANCE_RUN_ID=$run_id"

      - name: Wait for acceptance result
        shell: bash
        run: |
          set -euo pipefail
          run_id="${{ steps.resolve.outputs.run_id }}"
          for _ in $(seq 1 120); do
            state="$(gh api --repo "$GITHUB_REPOSITORY" "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            status="$(jq -r '.status' <<<"$state")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$state")"
            echo "Auth acceptance $run_id: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success" || exit 1
              echo "AUTH_TENANT_PRODUCTION_ACCEPTANCE=PASS"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for auth tenant production acceptance"
          exit 1
