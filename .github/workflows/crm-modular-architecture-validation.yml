name: CRM Modular Architecture Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/crm/**'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/crm/**'
      - 'apps/sanad-platform/pom.xml'
      - 'scripts/crm/**'
      - 'docs/crm/architecture/**'
      - 'docs/crm/adr/**'
      - '.github/workflows/crm-modular-architecture-validation.yml'
  push:
    branches: [main]
    paths:
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/crm/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-arch-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-validation:
    name: CRM Modular Architecture Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanad_arch
          POSTGRES_PASSWORD: sanad_arch_pass
          POSTGRES_DB: sanad_arch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanad_arch -d sanad_arch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad_arch
      SPRING_DATASOURCE_USERNAME: sanad_arch
      SPRING_DATASOURCE_PASSWORD: sanad_arch_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_FLYWAY_OUT_OF_ORDER: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision G1 restricted sanad runtime policy role
        shell: bash
        env:
          PGUSER: ${{ env.SPRING_DATASOURCE_USERNAME }}
          PGPASSWORD: ${{ env.SPRING_DATASOURCE_PASSWORD }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U "$SPRING_DATASOURCE_USERNAME" -d sanad_arch >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U "$SPRING_DATASOURCE_USERNAME" -d sanad_arch
          PGPASSWORD="$SPRING_DATASOURCE_PASSWORD" psql \
            -h 127.0.0.1 -p 5432 -U "$SPRING_DATASOURCE_USERNAME" -d sanad_arch \
            -v ON_ERROR_STOP=1 <<'SQL'
          -- G1: provision the restricted policy role BEFORE Flyway runs
          -- (via Spring Boot startup). The Docker POSTGRES_USER 'sanad_arch'
          -- is a superuser by default in the postgres:16-alpine image; the
          -- application's connection still inherits the sanad role so the
          -- users_tenant_isolation policy applies. RLS bypass is not granted
          -- to the application runtime.
          SELECT 'CREATE ROLE sanad NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad')
          \gexec
          ALTER ROLE sanad NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          GRANT sanad TO sanad_arch;
          -- Pre-Flyway CI cluster contract: migrator is a separate non-login role.
          SELECT 'CREATE ROLE sanad_migrator NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad_migrator')
          \gexec
          ALTER ROLE sanad_migrator NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;

          -- P0 V20261111_1 (service_callback_replay RLS closure): the chain
          -- requires the dedicated expired-row cleanup role cluster-wide, with a
          -- NON-INHERITING (SET-only) membership for the runtime identity — the
          -- scheduled sweep switches to it inside its own transaction, but the
          -- runtime must never inherit its cross-tenant expired-row visibility.
          SELECT 'CREATE ROLE sanad_callback_replay_cleanup NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad_callback_replay_cleanup')\gexec
          ALTER ROLE sanad_callback_replay_cleanup NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_auth_members m
                             JOIN pg_roles g ON g.oid = m.roleid
                             JOIN pg_roles r ON r.oid = m.member
                            WHERE g.rolname = 'sanad_callback_replay_cleanup'
                              AND r.rolname = 'sanad') THEN
              GRANT sanad_callback_replay_cleanup TO sanad WITH INHERIT FALSE;
            END IF;
          END $$;

          DO $guard$
          BEGIN
            IF pg_has_role('sanad', 'sanad_migrator', 'MEMBER') THEN
              RAISE EXCEPTION 'CI_RUNTIME_MIGRATOR_MEMBERSHIP_FORBIDDEN';
            END IF;
          END $guard$;
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles WHERE rolname = 'sanad'
                AND NOT rolsuper AND NOT rolbypassrls AND NOT rolcanlogin
            ) OR NOT pg_has_role('sanad_arch', 'sanad', 'USAGE') THEN
              RAISE EXCEPTION 'G1 runtime policy role missing or not inherited by sanad_arch';
            END IF;
          END $$;
          SQL
          role_flags="$(PGPASSWORD="$SPRING_DATASOURCE_PASSWORD" psql -h 127.0.0.1 -p 5432 -U "$SPRING_DATASOURCE_USERNAME" -d sanad_arch -Atc "SELECT rolsuper || '|' || rolbypassrls || '|' || rolcanlogin FROM pg_roles WHERE rolname='sanad'")"
          echo "G1_SANAD_ROLE_CONTRACT=$role_flags"
          test "$role_flags" = "false|false|false"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run modular architecture governance check
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/crm/modular-architecture-check.sh

      - name: Run architecture tests
        working-directory: apps/sanad-platform
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress \
            -Dtest='*ArchitectureTest,*ArchUnitTest,*ModuleWiringTest' \
            test

      - name: Verify architecture tests executed (not zero)
        working-directory: apps/sanad-platform
        run: |
          set -euo pipefail
          if [ ! -d target/surefire-reports ]; then
            echo "::error::No surefire reports found — architecture tests did not run"
            exit 1
          fi
          test_count="$(grep -h 'tests=' target/surefire-reports/TEST-*.xml 2>/dev/null | sed -E 's/.*tests="([0-9]+)".*/\1/' | awk '{sum += $1} END {print sum + 0}')"
          echo "Architecture tests run: $test_count"
          if [ "$test_count" -eq 0 ]; then
            echo "::error::Zero architecture tests executed — CRM-G3A requires at least 1"
            exit 1
          fi
          echo "Architecture validation: PASS ($test_count tests)"
