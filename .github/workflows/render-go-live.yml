name: Render GO-LIVE (suspend→clean→flyway-safe→deploy→verify)

# Full path to LIVE with chaos frozen:
# 1) ensure suspended (no crash-loop containers)
# 2) kill ALL orphan JDBC/Supavisor sessions (clear EMAXCONNSESSION + advisory locks)
# 3) read primary Flyway history (NO LOAD BALANCE) to know starting state
# 4) set safe Flyway env: CLEAN_DISABLED=true, VALIDATE_ON_MIGRATE=true,
#    BASELINE_ON_MIGRATE=true, DDL_AUTO=validate (Flyway still on :6543 session pooler)
# 5) resume service + single deploy + poll until LIVE
# 6) /actuator/health = 200 UP
# 7) verify 4 G7 tables + RLS via NO LOAD BALANCE
# No DROP/TRUNCATE/CLEAN. No G7 code change. Secrets never printed.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-live:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 35
    steps:
      - name: Clean + configure + deploy + verify
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -uo pipefail
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          BASE="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"
          fv() { curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/env-vars/$1" | jq -r '(.envVar // .).value // empty'; }
          put() { # key value
            jq -n --arg v "$2" '{value:$v}' > /tmp/b.json
            local h; h=$(curl -s -o /tmp/rr.json -w "%{http_code}" --max-time 45 -X PUT \
              -H "$AUTH" -H 'Accept: application/json' -H 'Content-Type: application/json' \
              --data @/tmp/b.json "$BASE/env-vars/$1")
            echo "PUT $1 -> HTTP $h"
          }
          DB_URL="$(fv DATABASE_URL)"; DB_USER="$(fv DATABASE_USERNAME)"; DB_PASS="$(fv DATABASE_PASSWORD)"
          echo "::add-mask::$DB_URL"; echo "::add-mask::$DB_USER"; echo "::add-mask::$DB_PASS"
          HOST="$(printf '%s\n' "$DB_URL" | sed -E 's#.*://##; s#/.*##; s#:.*##; s#\?.*##')"
          SES_URL="postgresql://$HOST:6543/postgres"; export PGPASSWORD="$DB_PASS"
          q() { psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 "$@" 2>&1 || true; }

          echo "=== STEP 1: ensure service suspended ==="
          curl -s --max-time 30 -X POST -H "$AUTH" -H 'Accept: application/json' "$BASE/suspend" >/dev/null || true
          echo "waiting 45s for containers to die..."; sleep 45

          echo ""
          echo "=== STEP 2: kill ALL orphan JDBC sessions (loop) ==="
          for round in 1 2 3; do
            n=$(q -tAc "SELECT count(*) FROM pg_stat_activity WHERE application_name='PostgreSQL JDBC Driver' AND pid <> pg_backend_pid();" | tr -d '[:space:]')
            echo "round $round: $n orphan JDBC sessions"
            [ "$n" = "0" ] && break
            q -c "SELECT pid, pg_terminate_backend(pid) FROM pg_stat_activity WHERE application_name='PostgreSQL JDBC Driver' AND pid <> pg_backend_pid();" >/dev/null
            sleep 5
          done

          echo ""
          echo "=== STEP 3: primary Flyway history BEFORE (NO LOAD BALANCE) ==="
          q -tAc "SELECT /*NO LOAD BALANCE*/ 'recovery='||pg_is_in_recovery() AS r;" | head -1
          q -tAc "SELECT /*NO LOAD BALANCE*/ count(*) FROM public.flyway_schema_history;" | sed 's/^/flyway_history_rows=/'
          q -tAc "SELECT /*NO LOAD BALANCE*/ count(*) FROM information_schema.tables WHERE table_schema='public';" | sed 's/^/public_tables=/'
          q -tAc "SELECT /*NO LOAD BALANCE*/ count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE 'mobile_%';" | sed 's/^/g7_tables=/'

          echo ""
          echo "=== STEP 4: set safe Flyway env ==="
          put FLYWAY_CLEAN_DISABLED true
          put FLYWAY_VALIDATE_ON_MIGRATE true
          put FLYWAY_BASELINE_ON_MIGRATE true
          put JPA_DDL_AUTO validate
          echo "confirm SPRING_FLYWAY_URL present: $([ -n "$(fv SPRING_FLYWAY_URL)" ] && echo yes || echo no)"

          echo ""
          echo "=== STEP 5: resume + single deploy ==="
          curl -s --max-time 30 -X POST -H "$AUTH" -H 'Accept: application/json' "$BASE/resume" >/dev/null || true
          sleep 10
          HTTP=$(curl -s -o /tmp/d.json -w "%{http_code}" --max-time 30 -X POST "$BASE/deploys" \
            -H "$AUTH" -H 'Content-Type: application/json' -H 'Accept: application/json' --data '{"clearCache":"do_not_clear"}')
          DEPLOY_ID=$(jq -r '.id // empty' /tmp/d.json); echo "POST /deploys HTTP $HTTP  Deploy ID: $DEPLOY_ID"

          echo ""
          echo "=== STEP 6: poll until LIVE (max ~25 min) ==="
          STATUS="unknown"
          for i in $(seq 1 100); do
            sleep 15
            STATUS=$(curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/deploys/$DEPLOY_ID" | jq -r '.status // "unknown"')
            echo "  Attempt $i ($((i*15))s): $STATUS"
            [ "$STATUS" = "live" ] && { echo "::notice::DEPLOY LIVE"; break; }
            echo "$STATUS" | grep -qiE 'failed|canceled|deactivated' && { echo "::error::terminal $STATUS"; break; }
          done

          echo ""
          echo "=== STEP 7: health check ==="
          sleep 12
          for i in $(seq 1 18); do
            CODE=$(curl -s -o /tmp/h.json -w "%{http_code}" --max-time 30 https://sanad-backend-mcrj.onrender.com/actuator/health || echo 000)
            B=$(jq -r '.status // empty' /tmp/h.json 2>/dev/null || echo "")
            echo "  attempt $i: HTTP $CODE status=$B"
            [ "$CODE" = "200" ] && [ "$B" = "UP" ] && { echo "::notice::HEALTHY"; break; }
            sleep 12
          done

          echo ""
          echo "=== STEP 8: verify G7 tables + RLS AFTER (NO LOAD BALANCE) ==="
          q -c "SELECT /*NO LOAD BALANCE*/ table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('mobile_device_registry','mobile_sync_cursor','mobile_sync_log','mobile_conflict_log') ORDER BY table_name;"
          q -tAc "SELECT /*NO LOAD BALANCE*/ count(*) FROM public.flyway_schema_history;" | sed 's/^/flyway_history_rows=/'
          q -tAc "SELECT /*NO LOAD BALANCE*/ count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE 'mobile_%';" | sed 's/^/g7_tables=/'
          echo "--- RLS on G7 tables ---"
          q -c "SELECT /*NO LOAD BALANCE*/ relname, relrowsecurity, relforcerowsecurity FROM pg_class WHERE relname IN ('mobile_device_registry','mobile_sync_cursor','mobile_sync_log','mobile_conflict_log');"
          echo "--- last 6 flyway migrations ---"
          q -c "SELECT /*NO LOAD BALANCE*/ installed_rank, version, description, success FROM public.flyway_schema_history ORDER BY installed_rank DESC LIMIT 6;"
