# G1 P0 test of fail-closed release audit identity; synthetic fixtures only.
name: G1 Flyway Auditor Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/production/verify-flyway.sh
      - scripts/production/tests/verify-flyway.test.sh
      - .github/workflows/production-release.yml
      - .github/workflows/g1-flyway-auditor-acceptance.yml
      - docs/security/G1-FLYWAY-AUDITOR-ACCEPTANCE-2026-11-11.md
      - tests/security/flyway-auditor/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-flyway-auditor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-audit:
    name: Fail-closed role, privilege, schema drift and checksum negative tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse shell scripts without production secrets
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production/verify-flyway.sh
          bash -n scripts/production/tests/verify-flyway.test.sh
          ! grep -Eq 'RENDER_API_KEY|DATABASE_PASSWORD|RENDER_ENV|sanad_migrator.*--username' scripts/production/verify-flyway.sh
          echo 'AUDITOR_SCRIPT_STATIC_DENY_RUNTIME_CREDENTIALS=PASS'
      - name: Execute actual release-auditor regression harness (synthetic SQL replies)
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/production/tests/verify-flyway.test.sh
      - name: Record scope limits
        shell: bash
        if: always()
        run: |
          {
            echo '## G1 Flyway auditor acceptance'
            echo "- SHA: $GITHUB_SHA"
            echo '- No production DB, Render or Supabase access'
            echo '- No live role provisioning, Flyway migration or production deployment'
            echo '- Separate real PostgreSQL 17 role/ACL rehearsal and independent G1/CAB approval still required'
          } >> "$GITHUB_STEP_SUMMARY"

  postgres17-real-auditor:
    name: Isolated PG17 real SQL auditor identity and negative ACL proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      G1_DISPOSABLE_PG17: "1"
      PGHOST: "127.0.0.1"
      PGPORT: "5432"
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install disposable host-native PostgreSQL 17 without Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop postgresql 2>/dev/null || true
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17 postgresql-client-17
          sudo pg_dropcluster 16 main --stop 2>/dev/null || true
          sudo pg_dropcluster 17 main --stop 2>/dev/null || true
          sudo pg_createcluster 17 main --start
          sudo pg_lsclusters
          sudo -u postgres psql -X -At -d postgres -c "SHOW server_version;"
      - name: Run actual PostgreSQL 17 auditor SQL/ACL test with synthetic objects
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/security/flyway-auditor/pg17-acceptance.sh
          bash tests/security/flyway-auditor/pg17-acceptance.sh
      - name: Record safe evidence scope
        if: always()
        shell: bash
        run: |
          {
            echo "## Isolated PostgreSQL 17 real SQL role tests"
            echo "- Source: $GITHUB_SHA"
            echo "- Host-native PostgreSQL 17, disposable runner, synthetic tables/roles"
            echo "- No Supabase/Render/Vercel production credentials or network access"
            echo "- This is NOT a production-derived restored catalog, CAB approval or G1 certificate"
          } >> "$GITHUB_STEP_SUMMARY"
