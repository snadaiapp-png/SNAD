name: HRM Human Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/web/app/hr/**'
      - 'apps/web/lib/i18n/locales/hrm-g2-i18n.ts'
      - 'apps/web/e2e/g2-auth-session.ts'
      - 'apps/web/e2e/g2-visual-helpers.ts'
      - 'apps/web/e2e/g2-visual.spec.ts'
      - 'apps/web/playwright-g2-visual.config.ts'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/hr/**'
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/workflow/**'
      - 'apps/sanad-platform/src/main/resources/**'
      - 'apps/sanad-platform/src/test/resources/sql/g2-acceptance-seed.sql'
      - 'apps/sanad-platform/pom.xml'
      - '.github/workflows/hrm-human-preview.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/app/hr/**'
      - 'apps/web/lib/i18n/locales/hrm-g2-i18n.ts'
      - 'apps/web/e2e/g2-auth-session.ts'
      - 'apps/web/e2e/g2-visual-helpers.ts'
      - 'apps/web/e2e/g2-visual.spec.ts'
      - 'apps/web/playwright-g2-visual.config.ts'
      - '.github/workflows/hrm-human-preview.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hrm-human-preview-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    name: Full-stack HRM human preview
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/sanad_hrm_visual
      DATABASE_USERNAME: sanad_hrm_visual
      DATABASE_NAME: sanad_hrm_visual
      SPRING_PROFILES_ACTIVE: local
      FLYWAY_ENABLED: 'true'
      FLYWAY_BASELINE_ON_MIGRATE: 'false'
      FLYWAY_VALIDATE_ON_MIGRATE: 'true'
      FLYWAY_OUT_OF_ORDER: 'false'
      JPA_DDL_AUTO: validate
      SERVER_PORT: '8080'
      JWT_ISSUER: sanad-platform-ci
      JWT_ACCESS_TOKEN_TTL: 60m
      REFRESH_TOKEN_TTL: 720h
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
      BOOTSTRAP_ENABLED: 'false'
      SANAD_CORS_ALLOWED_ORIGINS: http://127.0.0.1:3001
      SECURITY_NOTIFICATION_PROVIDER: disabled
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
      BACKEND_API_BASE_URL: http://127.0.0.1:8080
      E2E_EMPLOYEE_EMAIL: g2-employee@g2-acceptance.example
      E2E_MANAGER_EMAIL: g2-manager@g2-acceptance.example
      E2E_HR_EMAIL: g2-hr@g2-acceptance.example
      CI: '1'

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact-head provenance
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "${{ github.event.pull_request.head.repo.full_name }}" = "$GITHUB_REPOSITORY"
          fi
          echo "GITHUB_HEAD_SHA=$CANDIDATE_SHA" >> "$GITHUB_ENV"
          echo "candidate_sha=$CANDIDATE_SHA"

      - name: Generate ephemeral credentials
        shell: bash
        run: |
          set -euo pipefail
          DB_CRED="$(openssl rand -hex 24)"
          E2E_CRED="$(openssl rand -hex 24)"
          echo "::add-mask::$DB_CRED"
          echo "::add-mask::$E2E_CRED"
          {
            echo "DATABASE_PASSWORD=$DB_CRED"
            echo "SPRING_DATASOURCE_PASSWORD=$DB_CRED"
            echo "PGPASSWORD=$DB_CRED"
            echo "G2_E2E_PASSWORD=$E2E_CRED"
            echo "E2E_EMPLOYEE_PASSWORD=$E2E_CRED"
            echo "E2E_MANAGER_PASSWORD=$E2E_CRED"
            echo "E2E_HR_PASSWORD=$E2E_CRED"
          } >> "$GITHUB_ENV"

      - name: Start host-native PostgreSQL Direct
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null
          command -v pg_isready >/dev/null
          sudo systemctl start postgresql
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1 && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432

      - name: Provision least-privilege visual database
        shell: bash
        env:
          DB_CRED: ${{ env.DATABASE_PASSWORD }}
        run: |
          set -euo pipefail
          sudo -u postgres psql -v ON_ERROR_STOP=1 -v db_credential="$DB_CRED" <<'SQL'
          SELECT format('CREATE ROLE sanad_hrm_visual WITH LOGIN PASSWORD %L', :'db_credential')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad_hrm_visual')
          \gexec
          SELECT format('ALTER ROLE sanad_hrm_visual WITH LOGIN PASSWORD %L', :'db_credential')
          WHERE EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad_hrm_visual')
          \gexec
          ALTER ROLE sanad_hrm_visual NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          SELECT 'CREATE DATABASE sanad_hrm_visual OWNER sanad_hrm_visual'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'sanad_hrm_visual')
          \gexec
          ALTER DATABASE sanad_hrm_visual OWNER TO sanad_hrm_visual;
          \c sanad_hrm_visual
          GRANT USAGE, CREATE ON SCHEMA public TO sanad_hrm_visual;
          SQL
          test "$(sudo -u postgres psql -Atc "SELECT rolbypassrls FROM pg_roles WHERE rolname='sanad_hrm_visual'")" = "f"
          PGPASSWORD="$DB_CRED" psql -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" -v ON_ERROR_STOP=1 -Atc "SELECT current_database() || '|' || current_user"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend exact candidate
        working-directory: apps/sanad-platform
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dmaven.test.skip=true clean package

      - name: Apply strict Flyway schema
        working-directory: apps/sanad-platform
        run: >-
          mvn --batch-mode --no-transfer-progress flyway:migrate
          -Dflyway.url="$DATABASE_URL"
          -Dflyway.user="$DATABASE_USERNAME"
          -Dflyway.password="$DATABASE_PASSWORD"
          -Dflyway.locations=classpath:db/migration,classpath:db/vendor/postgresql
          -Dflyway.baselineOnMigrate=false
          -Dflyway.validateOnMigrate=true
          -Dflyway.outOfOrder=false

      - name: Validate Flyway history without mutation
        working-directory: apps/sanad-platform
        run: >-
          mvn --batch-mode --no-transfer-progress flyway:validate
          -Dflyway.url="$DATABASE_URL"
          -Dflyway.user="$DATABASE_USERNAME"
          -Dflyway.password="$DATABASE_PASSWORD"
          -Dflyway.locations=classpath:db/migration,classpath:db/vendor/postgresql
          -Dflyway.validateOnMigrate=true
          -Dflyway.outOfOrder=false

      - name: Seed deterministic Employee Manager HR visual identities
        shell: bash
        env:
          G2_E2E_PASSWORD: ${{ env.G2_E2E_PASSWORD }}
        run: |
          set -euo pipefail
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" \
            -v ON_ERROR_STOP=1 -v g2_e2e_password="$G2_E2E_PASSWORD" \
            -f apps/sanad-platform/src/test/resources/sql/g2-acceptance-seed.sql \
            2>&1 | tee "$RUNNER_TEMP/g2-visual-seed.log"
          G2_TENANT_ID='33333333-3333-4333-8333-333333333331'
          COUNT=$(PGPASSWORD="$DATABASE_PASSWORD" PGOPTIONS="-c app.tenant_id=$G2_TENANT_ID" \
            psql -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" -Atc \
            "SELECT COUNT(*) FROM users WHERE tenant_id='$G2_TENANT_ID'")
          test "$COUNT" = "3"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Build Next.js frontend
        working-directory: apps/web
        run: npm run build

      - name: Verify visual suite routing
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          GENERIC=$(npx playwright test --config=playwright.standard.config.ts --list 2>&1 | grep -c 'g2-visual.spec.ts' || true)
          VISUAL=$(npx playwright test --config=playwright-g2-visual.config.ts --list 2>&1 | grep -c 'g2-visual.spec.ts' || true)
          test "$GENERIC" = "0"
          test "$VISUAL" = "12"
          echo "visual routing generic=$GENERIC dedicated=$VISUAL"

      - name: Start Spring Boot backend
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -euo pipefail
          nohup java -jar target/sanad-platform-*.jar \
            --server.port=8080 \
            --spring.datasource.url="$DATABASE_URL" \
            --spring.datasource.username="$DATABASE_USERNAME" \
            --spring.datasource.password="$DATABASE_PASSWORD" \
            --spring.profiles.active=local \
            --spring.flyway.baseline-on-migrate=false \
            --spring.flyway.validate-on-migrate=true \
            --spring.flyway.out-of-order=false \
            --sanad.rls.enabled=true \
            > "$RUNNER_TEMP/hrm-visual-backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/hrm-visual-backend.pid"
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8080/actuator/health >/dev/null 2>&1 && break
            kill -0 "$(cat "$RUNNER_TEMP/hrm-visual-backend.pid")" 2>/dev/null || { tail -n 160 "$RUNNER_TEMP/hrm-visual-backend.log"; exit 1; }
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/actuator/health

      - name: Start Next.js frontend
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run start -- -p 3001 > "$RUNNER_TEMP/hrm-visual-frontend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/hrm-visual-frontend.pid"
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3001/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3001/ -o /dev/null

      - name: Run G2 Arabic English Desktop Mobile visual certification
        working-directory: apps/web
        run: npx playwright test --config=playwright-g2-visual.config.ts

      - name: Verify exact-SHA evidence manifest
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST='test-results/g2-visual-evidence/manifest.ndjson'
          test -s "$MANIFEST"
          EXPECTED=60
          ACTUAL=$(wc -l < "$MANIFEST" | tr -d ' ')
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::visual evidence rows=$ACTUAL expected=$EXPECTED"; exit 1; }
          if grep -v "\"sha\":\"$GITHUB_HEAD_SHA\"" "$MANIFEST"; then
            echo "::error::visual evidence contains non-exact-head SHA"
            exit 1
          fi
          for role in employee manager hr; do grep -q "\"role\":\"$role\"" "$MANIFEST"; done
          for project in g2-visual-ar-desktop g2-visual-ar-mobile g2-visual-en-desktop g2-visual-en-mobile; do
            grep -q "\"viewport\":\"$project\"" "$MANIFEST"
          done

      - name: Upload exact-head G2 visual screenshots and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-visual-evidence-${{ env.GITHUB_HEAD_SHA }}
          path: apps/web/test-results/g2-visual-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Upload G2 visual Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-visual-report-${{ env.GITHUB_HEAD_SHA }}
          path: apps/web/playwright-g2-visual-report/
          if-no-files-found: error
          retention-days: 30

      - name: Upload visual server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-visual-server-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hrm-visual-backend.log
            ${{ runner.temp }}/hrm-visual-frontend.log
            ${{ runner.temp }}/g2-visual-seed.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop preview processes
        if: always()
        shell: bash
        run: |
          set +e
          [ -f "$RUNNER_TEMP/hrm-visual-backend.pid" ] && kill "$(cat "$RUNNER_TEMP/hrm-visual-backend.pid")" 2>/dev/null || true
          [ -f "$RUNNER_TEMP/hrm-visual-frontend.pid" ] && kill "$(cat "$RUNNER_TEMP/hrm-visual-frontend.pid")" 2>/dev/null || true
