name: Workflow Y2 Self Approval TDD

on:
  push:
    branches:
      - fix/workflow-y2-self-approval-override

permissions:
  contents: read

jobs:
  targeted-test:
    name: Task 9 self-approval authorization regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run targeted Task 9 regression test
        working-directory: apps/sanad-platform
        run: mvn -B -ntp -Dtest=WorkflowApprovalSelfApprovalAuthorizationTest test
