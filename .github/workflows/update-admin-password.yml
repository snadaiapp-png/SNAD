name: Update Admin Password

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "update-password" to confirm'
        required: true
        default: ''
        type: string
      password:
        description: 'New password for admin@snad.ai'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    if: github.event.inputs.confirm == 'update-password'
    steps:
      - name: Suspend backend to free DB connections
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Suspend HTTP %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/suspend" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" || true
          echo "Waiting 15s..."
          sleep 15

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          pip3 install bcrypt > /dev/null 2>&1

      - name: Generate BCrypt hash and update password
        env:
          PROD_JDBC_URL: ${{ secrets.PROD_JDBC_URL }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          CONTROL_PLANE_TENANT_ID: ${{ secrets.CONTROL_PLANE_TENANT_ID }}
          ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          NEW_PASSWORD: ${{ inputs.password }}
        run: |
          set -euo pipefail
          # Generate BCrypt hash
          HASH=$(python3 -c "
          import bcrypt, sys
          print(bcrypt.hashpw(sys.argv[1].encode('utf-8'), bcrypt.gensalt(rounds=10)).decode('utf-8'))
          " "$NEW_PASSWORD")
          echo "Generated BCrypt hash (length: ${#HASH})"

          # Parse JDBC URL
          JDBC_URL="$PROD_JDBC_URL"
          CONN_STR="${JDBC_URL#jdbc:postgresql://}"
          HOST_PORT="${CONN_STR%%/*}"
          HOST="${HOST_PORT%%:*}"
          PORT="${HOST_PORT##*:}"
          DB_PART="${CONN_STR#*/}"
          DB_NAME="${DB_PART%%\?*}"

          # Write SQL to file
          printf '%s\n' \
            "SET search_path TO public;" \
            "UPDATE users SET password_hash = '$HASH', status = 'ACTIVE', updated_at = CURRENT_TIMESTAMP WHERE email = '$ADMIN_EMAIL';" \
            "SELECT email, status, (password_hash IS NOT NULL) AS has_password FROM users WHERE email = '$ADMIN_EMAIL';" \
            > /tmp/update.sql

          for attempt in 1 2 3 4 5; do
            echo "=== Attempt $attempt ==="
            if PGPASSWORD="$PROD_DB_PASSWORD" psql -h "$HOST" -p "$PORT" -U "$PROD_DB_USER" -d "$DB_NAME" -f /tmp/update.sql; then
              echo "✓ Password updated!"
              break
            fi
            echo "Attempt $attempt failed. Waiting 10s..."
            sleep 10
          done

      - name: Resume backend
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Resume HTTP %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/resume" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" || true

      - name: Verify login
        env:
          ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          NEW_PASSWORD: ${{ inputs.password }}
        run: |
          echo "Waiting 30s for backend to resume..."
          sleep 30
          echo "=== Login test ==="
          curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -H "Origin: https://snad-app.vercel.app" \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$NEW_PASSWORD\"}" \
            -w "\nHTTP %{http_code}\n" || true
