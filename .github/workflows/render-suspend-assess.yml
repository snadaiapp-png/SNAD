name: Render Suspend + Drain + Assess (break connection exhaustion)

# EMAXCONNSESSION (session pool 15/15 saturated by crash-looping containers)
# is a hard blocker: the app cannot obtain a DB connection. Suspend the service
# to kill all containers and release pooled connections, drain, terminate any
# lingering JDBC sessions, then assess the true primary schema state. Read-only
# after suspend. Resume/deploy is a separate, deliberate step.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suspend:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Suspend + drain + assess
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set +e
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          BASE="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"
          fv() { curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/env-vars/$1" | jq -r '(.envVar // .).value // empty'; }

          echo "=== service status BEFORE suspend ==="
          curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE" | jq '{status, suspended, autoDeploy}'

          echo ""
          echo "=== STEP 1: Suspend service (kill all containers, release conns) ==="
          curl -s --max-time 30 -X POST -H "$AUTH" -H 'Accept: application/json' "$BASE/suspend" | jq '{status, suspended}' || echo "suspend call done"

          echo "waiting 60s for containers to die + connections to drain..."
          sleep 60

          echo ""
          echo "=== STEP 2: terminate any lingering JDBC sessions via session pooler ==="
          DB_URL="$(fv DATABASE_URL)"; DB_USER="$(fv DATABASE_USERNAME)"; DB_PASS="$(fv DATABASE_PASSWORD)"
          echo "::add-mask::$DB_URL"; echo "::add-mask::$DB_USER"; echo "::add-mask::$DB_PASS"
          HOST="$(printf '%s\n' "$DB_URL" | sed -E 's#.*://##; s#/.*##; s#:.*##; s#\?.*##')"
          SES_URL="postgresql://$HOST:6543/postgres"; export PGPASSWORD="$DB_PASS"
          echo "active JDBC sessions:"
          psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -c "SELECT pid, state, application_name FROM pg_stat_activity WHERE application_name='PostgreSQL JDBC Driver';" || true
          psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -c "SELECT pid, pg_terminate_backend(pid) FROM pg_stat_activity WHERE application_name='PostgreSQL JDBC Driver' AND pid <> pg_backend_pid();" || true
          sleep 5

          echo ""
          echo "=== STEP 3: assess pool + primary schema (NO LOAD BALANCE) ==="
          echo "EMAXCONNSESSION check on :5432 (should connect now):"
          psql "postgresql://$HOST:5432/postgres" -U "$DB_USER" -v ON_ERROR_STOP=0 -tAc "SELECT /*NO LOAD BALANCE*/ 'OK', pg_is_in_recovery();" 2>&1 | head -2
          echo "PRIMARY flyway_schema_history count:"
          psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -tAc "SELECT /*NO LOAD BALANCE*/ count(*) FROM public.flyway_schema_history;" 2>&1 | head -1
          echo "PRIMARY public table count:"
          psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -tAc "SELECT /*NO LOAD BALANCE*/ count(*) FROM information_schema.tables WHERE table_schema='public';" 2>&1 | head -1
          echo "PRIMARY G7 mobile_ tables:"
          psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -tAc "SELECT /*NO LOAD BALANCE*/ count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name LIKE 'mobile_%';" 2>&1 | head -1
          echo "PRIMARY last 8 flyway migrations:"
          psql "$SES_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -c "SELECT /*NO LOAD BALANCE*/ installed_rank, version, description, success FROM public.flyway_schema_history ORDER BY installed_rank DESC LIMIT 8;" 2>&1 | head -16

          echo ""
          echo "=== service status AFTER suspend ==="
          curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE" | jq '{status, suspended, autoDeploy}'
