name: Frontend Lockfile Regeneration

on:
  push:
    branches:
      - infra/backend-clean-room-v1
    paths:
      - 'apps/web/package.json'
      - '.github/workflows/frontend-lockfile-regeneration.yml'

permissions:
  contents: write

concurrency:
  group: frontend-lockfile-regeneration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate and certify frontend lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: infra/backend-clean-room-v1
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate package lock and verify production audit
        working-directory: apps/web
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit only regenerated package lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/web/package-lock.json; then
            echo 'LOCKFILE_ALREADY_CURRENT=PASS'
            exit 0
          fi
          test "$(git diff --name-only | tr '\n' ' ')" = "apps/web/package-lock.json "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package-lock.json
          git commit -m 'fix(frontend): regenerate audited package lock'
          git push origin HEAD:infra/backend-clean-room-v1
      - name: Upload regenerated lockfile evidence
        uses: actions/upload-artifact@v4
        with:
          name: frontend-regenerated-lockfile-${{ github.run_id }}
          path: apps/web/package-lock.json
          if-no-files-found: error
          retention-days: 1
