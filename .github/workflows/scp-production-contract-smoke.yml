name: SCP Production Contract Smoke

# Incident-prevention gate for the Executive / Subscription Control Plane.
# The smoke tenant is resolved from the authoritative Render runtime env rather
# than from a duplicated GitHub tenant secret.

on:
  workflow_dispatch:
    inputs:
      transport:
        description: 'Transport under test: backend-direct or vercel-bff'
        required: false
        default: 'backend-direct'
        type: choice
        options:
          - backend-direct
          - vercel-bff

permissions:
  contents: read

concurrency:
  group: scp-contract-smoke
  cancel-in-progress: true

jobs:
  scp-contract-smoke:
    name: Verify SCP contract in production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve main head SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Resolve runtime control-plane tenant from Render
        id: tenant
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_SERVICE_ID"
          status="$(curl --silent --show-error \
            --output /tmp/runtime-tenant.json \
            --write-out '%{http_code}' \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/SANAD_CONTROL_PLANE_TENANT_ID")"
          [ "$status" = "200" ] || { echo "::error::Unable to resolve runtime control-plane tenant from Render"; exit 1; }
          tenant="$(jq -r '(.envVar // .).value // empty' /tmp/runtime-tenant.json)"
          [[ "$tenant" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo "::error::Runtime control-plane tenant is missing or invalid"; exit 1; }
          echo "::add-mask::$tenant"
          echo "id=$tenant" >> "$GITHUB_OUTPUT"
          rm -f /tmp/runtime-tenant.json

      - name: Run SCP contract smoke
        env:
          SCP_SMOKE_BASE_URL: ${{ inputs.transport == 'vercel-bff' && format('{0}/api/platform', vars.WEB_PRODUCTION_BASE_URL || 'https://snad-app.vercel.app') || vars.PRODUCTION_BASE_URL }}
          CONTROL_PLANE_ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          CONTROL_PLANE_ADMIN_PASSWORD: ${{ secrets.CONTROL_PLANE_ADMIN_PASSWORD }}
          CONTROL_PLANE_TENANT_ID: ${{ steps.tenant.outputs.id }}
          SCP_SMOKE_TENANT_ID: ${{ steps.tenant.outputs.id }}
          DEPLOYED_COMMIT_SHA: ${{ steps.target.outputs.sha }}
          SCP_SMOKE_EVIDENCE_FILE: scp-contract-smoke.json
        shell: bash
        run: |
          set -euo pipefail
          for name in SCP_SMOKE_BASE_URL CONTROL_PLANE_ADMIN_EMAIL CONTROL_PLANE_ADMIN_PASSWORD CONTROL_PLANE_TENANT_ID; do
            test -n "${!name:-}" || { echo "::error::$name is required"; exit 1; }
          done
          bash scripts/production/verify-scp-contract-smoke.sh

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scp-contract-smoke-${{ github.run_id }}
          path: scp-contract-smoke.json
          if-no-files-found: warn
          retention-days: 90
