name: Workflow Y2 Playwright Release Gate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - design/workflow-orchestration-spec
    paths:
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/workflow/**'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/workflow/**'
      - 'apps/sanad-platform/src/main/resources/**'
      - 'apps/web/app/workflow/**'
      - 'apps/web/e2e/workflow-y2-release.spec.ts'
      - 'apps/web/e2e/crm-auth-session.ts'
      - 'apps/web/playwright.workflow-y2.config.ts'
      - '.github/workflows/workflow-y2-playwright.yml'
  push:
    branches:
      - design/workflow-orchestration-spec
    paths:
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/workflow/**'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/workflow/**'
      - 'apps/sanad-platform/src/main/resources/**'
      - 'apps/web/app/workflow/**'
      - 'apps/web/e2e/workflow-y2-release.spec.ts'
      - 'apps/web/e2e/crm-auth-session.ts'
      - 'apps/web/playwright.workflow-y2.config.ts'
      - '.github/workflows/workflow-y2-playwright.yml'

permissions:
  contents: read

concurrency:
  group: wf-y2-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-y2-playwright:
    name: Workflow Y2 Playwright Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_pass
          POSTGRES_DB: sanad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sanad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad
      SPRING_DATASOURCE_USERNAME: sanad
      SPRING_DATASOURCE_PASSWORD: sanad_pass
      SPRING_PROFILES_ACTIVE: workflow-e2e
      SERVER_PORT: '8080'
      SANAD_CORS_ALLOWED_ORIGINS: http://127.0.0.1:3001
      WF_E2E_EMAIL: wf-e2e-admin@snad-e2e.example
      WF_E2E_PASSWORD: WfE2eTest!2026
      PGPASSWORD: postgres_pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision application role
        run: |
          psql -h 127.0.0.1 -U postgres -d sanad -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad') THEN
              CREATE ROLE sanad WITH LOGIN PASSWORD 'sanad_pass';
            END IF;
          END $$;
          ALTER ROLE sanad NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          ALTER DATABASE sanad OWNER TO sanad;
          GRANT USAGE, CREATE ON SCHEMA public TO sanad;
          SQL

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run Workflow backend tests on PostgreSQL Direct
        working-directory: apps/sanad-platform
        env:
          SPRING_PROFILES_ACTIVE: local
        run: mvn --batch-mode --no-transfer-progress -Dtest='Workflow*Test' test

      - name: Build Spring Boot JAR
        working-directory: apps/sanad-platform
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dmaven.test.skip=true clean package

      - name: Start Spring Boot backend
        id: backend
        run: |
          set -euo pipefail
          BACKEND_LOG="$RUNNER_TEMP/workflow-y2-backend.log"
          JAR_PATH="$(find apps/sanad-platform/target -name 'sanad-platform-*.jar' ! -name '*-sources.jar' | head -n1)"
          test -n "$JAR_PATH"
          java -jar "$JAR_PATH" --spring.profiles.active=local,workflow-e2e > "$BACKEND_LOG" 2>&1 &
          BACKEND_PID=$!
          echo "pid=$BACKEND_PID" >> "$GITHUB_OUTPUT"
          echo "log=$BACKEND_LOG" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              echo "Backend ready after $((i*3))s"; exit 0
            fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              tail -120 "$BACKEND_LOG" || true; exit 1
            fi
            sleep 3
          done
          tail -120 "$BACKEND_LOG" || true; exit 1

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Next.js
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
        run: npm run build

      - name: Start Next.js
        id: frontend
        working-directory: apps/web
        env:
          BACKEND_API_BASE_URL: http://127.0.0.1:8080
        run: |
          set -euo pipefail
          FRONTEND_LOG="$RUNNER_TEMP/workflow-y2-frontend.log"
          NEXT_TELEMETRY_DISABLED=1 NODE_ENV=production \
            ./node_modules/.bin/next start -H 127.0.0.1 -p 3001 > "$FRONTEND_LOG" 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/ >/dev/null; then
              echo "Frontend ready"; exit 0
            fi
            sleep 2
          done
          tail -100 "$FRONTEND_LOG" || true; exit 1

      - name: Run Workflow Y2 Playwright tests
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
          SANAD_BACKEND_BASE_URL: http://127.0.0.1:8080
        run: |
          npx playwright install chromium --with-deps
          npx playwright test --config=playwright.workflow-y2.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-y2-playwright-report
          path: apps/web/wf-playwright-report/

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-y2-playwright-results
          path: apps/web/test-results/

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-y2-backend-log
          path: /home/runner/work/_temp/workflow-y2-backend.log

      - name: Stop services
        if: always()
        run: |
          kill ${{ steps.backend.outputs.pid }} 2>/dev/null || true
          kill ${{ steps.frontend.outputs.pid }} 2>/dev/null || true
