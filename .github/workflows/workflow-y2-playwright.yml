name: Workflow Y2 Playwright Release Gate

on:
  workflow_dispatch:
  push:
    branches:
      - design/workflow-orchestration-spec
    paths:
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/workflow/**'
      - 'apps/sanad-platform/src/main/resources/**'
      - 'apps/web/e2e/workflow-y2-release.spec.ts'
      - 'apps/web/playwright.workflow-y2.config.ts'
      - '.github/workflows/workflow-y2-playwright.yml'

permissions:
  contents: read

concurrency:
  group: wf-y2-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-y2-playwright:
    name: Workflow Y2 Playwright Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_pass
          POSTGRES_DB: sanad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sanad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad
      SPRING_DATASOURCE_USERNAME: sanad
      SPRING_DATASOURCE_PASSWORD: sanad_pass
      SPRING_PROFILES_ACTIVE: workflow-e2e
      SERVER_PORT: '8080'
      SANAD_CORS_ALLOWED_ORIGINS: http://127.0.0.1:3001
      WF_E2E_EMAIL: wf-e2e-admin@snad-e2e.example
      WF_E2E_PASSWORD: WfE2eTest!2026
      PGPASSWORD: postgres_pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Provision application role
        run: |
          psql -h 127.0.0.1 -U postgres -d sanad -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad') THEN
              CREATE ROLE sanad WITH LOGIN PASSWORD 'sanad_pass';
            END IF;
          END $$;
          ALTER ROLE sanad NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          ALTER DATABASE sanad OWNER TO sanad;
          GRANT USAGE, CREATE ON SCHEMA public TO sanad;
          SQL

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build Spring Boot JAR
        working-directory: apps/sanad-platform
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dmaven.test.skip=true clean package

      - name: Start Spring Boot backend
        id: backend
        run: |
          set -euo pipefail
          BACKEND_LOG="$RUNNER_TEMP/workflow-y2-backend.log"
          JAR_PATH="$(find apps/sanad-platform/target -name 'sanad-platform-*.jar' ! -name '*-sources.jar' | head -n1)"
          test -n "$JAR_PATH"
          java -jar "$JAR_PATH" --spring.profiles.active=local > "$BACKEND_LOG" 2>&1 &
          BACKEND_PID=$!
          echo "pid=$BACKEND_PID" >> "$GITHUB_OUTPUT"
          echo "log=$BACKEND_LOG" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              echo "Backend ready after $((i*3))s"; exit 0
            fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              tail -120 "$BACKEND_LOG" || true; exit 1
            fi
            sleep 3
          done
          tail -120 "$BACKEND_LOG" || true; exit 1

      - name: Seed E2E test user with WORKFLOW capabilities
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d sanad -v ON_ERROR_STOP=1 <<'SQL'
          -- Create tenant
          INSERT INTO tenants (id, name, subdomain, status, created_at, updated_at)
          VALUES ('11111111-1111-4111-8111-111111111111', 'WF E2E Tenant', 'wf-e2e', 'ACTIVE', NOW(), NOW())
          ON CONFLICT (id) DO NOTHING;
          -- Create admin user
          INSERT INTO users (id, tenant_id, email, display_name, status, password_hash, created_at, updated_at)
          VALUES ('22222222-2222-4222-8222-222222222222', '11111111-1111-4111-8111-111111111111',
                  'wf-e2e-admin@snad-e2e.example', 'WF E2E Admin', 'ACTIVE', '$2a$10$dummyHashForBCrypt$0', NOW(), NOW())
          ON CONFLICT (id) DO NOTHING;
          -- Create ADMIN role
          INSERT INTO roles (id, tenant_id, code, name, status, created_at, updated_at)
          VALUES ('33333333-3333-4333-8333-333333333333', '11111111-1111-4111-8111-111111111111',
                  'ADMIN', 'Administrator', 'ACTIVE', NOW(), NOW())
          ON CONFLICT (id) DO NOTHING;
          -- Bind ADMIN role to user
          INSERT INTO user_role_assignments (id, tenant_id, user_id, role_id, status, created_at, updated_at)
          VALUES ('44444444-4444-4444-8444-444444444444', '11111111-1111-4111-8111-111111111111',
                  '22222222-2222-4222-8222-222222222222', '33333333-3333-4333-8333-333333333333',
                  'ACTIVE', NOW(), NOW())
          ON CONFLICT (id) DO NOTHING;
          -- Grant all WORKFLOW.* capabilities to ADMIN
          INSERT INTO role_capabilities (id, tenant_id, role_id, capability_id, created_at)
          SELECT gen_random_uuid(), '11111111-1111-4111-8111-111111111111',
                 '33333333-3333-4333-8333-333333333333', ac.id, NOW()
          FROM access_capabilities ac
          WHERE ac.code LIKE 'WORKFLOW.%'
          AND NOT EXISTS (
              SELECT 1 FROM role_capabilities rc
              WHERE rc.tenant_id = '11111111-1111-4111-8111-111111111111'
              AND rc.role_id = '33333333-3333-4333-8333-333333333333'
              AND rc.capability_id = ac.id
          );
          SQL

      - name: Set test user password (bootstrap)
        run: |
          set -euo pipefail
          BACKEND_LOG="$RUNNER_TEMP/workflow-y2-backend.log"
          # Use the backend bootstrap endpoint to set a real password hash
          curl --fail --silent --show-error             -X POST http://127.0.0.1:8080/api/v1/internal/bootstrap/set-password             -H 'Content-Type: application/json'             -d '{"email":"wf-e2e-admin@snad-e2e.example","password":"E2eTestPass123!"}'             || echo "Bootstrap endpoint may not exist — using DB password update"
          # If bootstrap endpoint unavailable, update password hash directly
          psql -h 127.0.0.1 -U postgres -d sanad -c             "UPDATE users SET password_hash = '\$2a\$10\$EixZaYVK1fsbw1ZfbX3OXePaWxn96p36PsrFEpOkMB.Stl9GjWH9q' WHERE email = 'wf-e2e-admin@snad-e2e.example'"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Next.js
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
        run: npm run build

      - name: Start Next.js
        id: frontend
        working-directory: apps/web
        env:
          BACKEND_API_BASE_URL: http://127.0.0.1:8080
        run: |
          set -euo pipefail
          FRONTEND_LOG="$RUNNER_TEMP/workflow-y2-frontend.log"
          NEXT_TELEMETRY_DISABLED=1 NODE_ENV=production \
            ./node_modules/.bin/next start -H 127.0.0.1 -p 3001 > "$FRONTEND_LOG" 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/ >/dev/null; then
              echo "Frontend ready"; exit 0
            fi
            sleep 2
          done
          tail -100 "$FRONTEND_LOG" || true; exit 1

      - name: Run Workflow Y2 Playwright tests
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
          SANAD_BACKEND_BASE_URL: http://127.0.0.1:8080
        run: |
          npx playwright install chromium --with-deps
          npx playwright test --config=playwright.workflow-y2.config.ts --reporter=html,list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-y2-playwright-report
          path: apps/web/wf-playwright-report/

      - name: Stop services
        if: always()
        run: |
          kill ${{ steps.backend.outputs.pid }} 2>/dev/null || true
          kill ${{ steps.frontend.outputs.pid }} 2>/dev/null || true
