name: TEMP Flyway HRM Prerequisite TDD

on:
  push:
    branches:
      - fix/flyway-hrm-prerequisite-forward-reconciliation

permissions:
  contents: read

jobs:
  targeted-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/sanad-platform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run HRM prerequisite ordering regression only
        run: mvn test -B -ntp -Dsurefire.useFile=false -Dtest=HrmPlatformPrerequisiteFlywayOrderingTest
