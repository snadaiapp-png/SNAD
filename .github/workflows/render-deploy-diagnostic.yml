name: Render Deploy Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    name: Render deploy diagnostic
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Get detailed deploy info
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Latest deploy details ==="
          DEPLOY_JSON=$(curl -s --header "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1")
          echo "$DEPLOY_JSON" | jq '.[0] | {id, status, finishReason, commit, createdAt, finishedAt, image: .image}' 2>/dev/null || \
          echo "$DEPLOY_JSON" | head -c 2000

          echo ""
          echo "=== Full latest deploy (first 3000 chars) ==="
          echo "$DEPLOY_JSON" | head -c 3000

          echo ""
          echo "=== Service env vars (DATABASE_URL pattern) ==="
          curl -s --header "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars" | \
            jq '[.[]? | select(.key | test("DATABASE|JAVA|FLYWAY|SPRING|BOOTSTRAP")) | {key, value: (.value[:20] + "...")}]' 2>/dev/null || \
            echo "Could not fetch env vars"

          echo ""
          echo "=== Service logs (last 50 lines) ==="
          curl -s --header "Authorization: Bearer $RENDER_API_KEY" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/logs?limit=50" 2>/dev/null | \
            head -c 3000 || echo "Could not fetch logs"
