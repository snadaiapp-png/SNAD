# Trigger for cleanup PR
# Trigger for validate fix PR
# Trigger for repair PR
# Trigger for diagnostic control-flow fix
# Trigger for diagnostic fix PR
# Trigger for ERP PR #912
# Trigger for diagnostic PR
# Trigger for boolean fix PR
# Trigger for expression fix PR
# Trigger for migration hardening PR
# G6 recovery PR trigger: touch own file to satisfy required check
# PostgreSQL Direct governance: host-native only; Docker/Testcontainers forbidden.
name: CRM G1 Schema Isolation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'apps/sanad-platform/src/main/resources/db/migration/**'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/crm/**'
      - 'scripts/crm/verify-g1-tenant-isolation.sql'
      - 'docs/crm/**'
      - '.github/workflows/crm-g1-schema-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-g1-schema-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-g1-schema-isolation:
    name: Verify 8 tables, 26 indexes, and tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/sanad_g1
      DATABASE_USERNAME: sanad_g1
      DATABASE_PASSWORD: sanad_g1_pass
      DATABASE_NAME: sanad_g1
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "candidate_sha=$CANDIDATE_SHA"
          echo "event_sha=$GITHUB_SHA"

      - name: Start host-native PostgreSQL (no containers)
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || {
            echo "::error::ENVIRONMENT_BLOCKER=HOST_NATIVE_POSTGRESQL_UNAVAILABLE (psql not found on runner)"
            exit 1
          }
          command -v pg_isready >/dev/null 2>&1 || {
            echo "::error::ENVIRONMENT_BLOCKER=HOST_NATIVE_POSTGRESQL_UNAVAILABLE (pg_isready not found on runner)"
            exit 1
          }
          psql --version
          sudo systemctl start postgresql || {
            echo "::error::ENVIRONMENT_BLOCKER=HOST_NATIVE_POSTGRESQL_UNAVAILABLE (cluster failed to start)"
            exit 1
          }
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432

      - name: Provision CRM G1 role and database
        shell: bash
        run: |
          set -euo pipefail
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad_g1') THEN
              CREATE ROLE sanad_g1 WITH LOGIN PASSWORD 'sanad_g1_pass';
            END IF;
          END $$;
          ALTER ROLE sanad_g1 NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;

          SELECT 'CREATE DATABASE sanad_g1 OWNER sanad_g1'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'sanad_g1')\gexec
          ALTER DATABASE sanad_g1 OWNER TO sanad_g1;
          GRANT CONNECT ON DATABASE postgres TO sanad_g1;

          \c sanad_g1
          GRANT USAGE, CREATE ON SCHEMA public TO sanad_g1;
          SQL

          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h 127.0.0.1 \
            -U "$DATABASE_USERNAME" \
            -d "$DATABASE_NAME" \
            -v ON_ERROR_STOP=1 \
            -Atc "SELECT current_database() || '|' || current_user"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build migration classpath
        working-directory: apps/sanad-platform
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dmaven.test.skip=true clean package

      - name: Apply all Flyway migrations to PostgreSQL
        working-directory: apps/sanad-platform
        run: >-
          mvn --batch-mode --no-transfer-progress flyway:migrate
          -Dflyway.url="$DATABASE_URL"
          -Dflyway.user="$DATABASE_USERNAME"
          -Dflyway.password="$DATABASE_PASSWORD"
          -Dflyway.locations=classpath:db/migration,classpath:db/vendor/postgresql
          -Dflyway.baselineOnMigrate=true
          -Dflyway.validateOnMigrate=true
          -Dflyway.outOfOrder=true
          -Dflyway.baselineVersion=0

      - name: Execute read-only CRM-G1 catalog verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/crm-g1-evidence"
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h 127.0.0.1 \
            -U "$DATABASE_USERNAME" \
            -d "$DATABASE_NAME" \
            -v ON_ERROR_STOP=1 \
            -f scripts/crm/verify-g1-tenant-isolation.sql \
            2>&1 | tee "$RUNNER_TEMP/crm-g1-evidence/catalog-verification.txt"

      - name: Run migration, history assertion, and behavioral tenant-isolation tests
        working-directory: apps/sanad-platform
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=CrmPostgresMigrationTest,CrmFlywayHistoryAssertionTest,CrmG1TenantIsolationPostgresTest test

      - name: Record immutable schema evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/crm-g1-evidence/schema-inventory.txt"
          {
            echo "candidate_sha=${CANDIDATE_SHA}"
            echo "event_sha=${GITHUB_SHA}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo '[flyway]'
            PGPASSWORD="$DATABASE_PASSWORD" psql -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" -Atc \
              "SELECT version || '|' || description || '|' || success FROM flyway_schema_history WHERE version='20260717.6'"
            echo
            echo '[tables]'
            PGPASSWORD="$DATABASE_PASSWORD" psql -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" -Atc \
              "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('crm_tasks','crm_assignments','crm_transfers','crm_notes','crm_audit_logs','crm_reports','crm_phone_numbers','crm_contact_lookup_index') ORDER BY table_name"
            echo
            echo '[indexes]'
            PGPASSWORD="$DATABASE_PASSWORD" psql -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" -Atc \
              "SELECT tablename || '|' || indexname FROM pg_indexes WHERE schemaname='public' AND tablename IN ('crm_tasks','crm_assignments','crm_transfers','crm_notes','crm_audit_logs','crm_reports','crm_phone_numbers','crm_contact_lookup_index') AND indexname LIKE 'idx_crm_%' ORDER BY tablename,indexname"
            echo
            echo '[tenant_foreign_keys]'
            PGPASSWORD="$DATABASE_PASSWORD" psql -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" -Atc \
              "SELECT table_row.relname || '|' || constraint_row.conname FROM pg_constraint constraint_row JOIN pg_class table_row ON table_row.oid=constraint_row.conrelid WHERE constraint_row.contype='f' AND constraint_row.confrelid='tenants'::regclass AND table_row.relname IN ('crm_tasks','crm_assignments','crm_transfers','crm_notes','crm_audit_logs','crm_reports','crm_phone_numbers','crm_contact_lookup_index') ORDER BY table_row.relname,constraint_row.conname"
          } > "$evidence"

      - name: Upload CRM-G1 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-g1-schema-isolation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/crm-g1-evidence
            apps/sanad-platform/target/surefire-reports
          if-no-files-found: error
          retention-days: 30
