name: CRM-008 Database Verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    env:
      POOLER_HOST: aws-0-eu-central-1.pooler.supabase.com
      DB_USERNAME: postgres.tkbrvupemreqabwzdpyq
      DB_PASSWORD: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
      DATABASE_NAME: postgres
    steps:
      - name: Install psql
        run: sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
      - name: Verify CRM-008 tables
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          set +e
          for table in crm_shift_templates crm_shift_assignments crm_staff_availability crm_staff_skills crm_capacity_plans crm_workload_assignments crm_service_assignments; do
            echo "=== $table ==="
            EXISTS=$(psql -h "$POOLER_HOST" -p 5432 -U "$DB_USERNAME" -d "$DATABASE_NAME" -t -A -c "SELECT count(*) FROM information_schema.tables WHERE table_name='$table' AND table_schema='public';" 2>/dev/null)
            echo "EXISTS=$EXISTS"
            if [ "$EXISTS" = "1" ]; then
              COLS=$(psql -h "$POOLER_HOST" -p 5432 -U "$DB_USERNAME" -d "$DATABASE_NAME" -t -A -c "SELECT count(*) FROM information_schema.columns WHERE table_name='$table';" 2>/dev/null)
              IDX=$(psql -h "$POOLER_HOST" -p 5432 -U "$DB_USERNAME" -d "$DATABASE_NAME" -t -A -c "SELECT count(*) FROM pg_indexes WHERE tablename='$table';" 2>/dev/null)
              HAS_TENANT=$(psql -h "$POOLER_HOST" -p 5432 -U "$DB_USERNAME" -d "$DATABASE_NAME" -t -A -c "SELECT count(*) FROM information_schema.columns WHERE table_name='$table' AND column_name='tenant_id';" 2>/dev/null)
              RLS=$(psql -h "$POOLER_HOST" -p 5432 -U "$DB_USERNAME" -d "$DATABASE_NAME" -t -A -c "SELECT rowsecurity FROM pg_tables WHERE tablename='$table';" 2>/dev/null)
              POLICIES=$(psql -h "$POOLER_HOST" -p 5432 -U "$DB_USERNAME" -d "$DATABASE_NAME" -t -A -c "SELECT count(*) FROM pg_policies WHERE tablename='$table';" 2>/dev/null)
              echo "COLUMNS=$COLS INDEXES=$IDX TENANT_ID=$HAS_TENANT RLS=$RLS POLICIES=$POLICIES"
            fi
          done
