name: Insert with Render DB + Spring Hash

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "insert" to confirm'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  insert:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    if: github.event.inputs.confirm == 'insert'
    steps:
      - name: Install JDK + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jdk 2>&1 | tail -3
          pip3 install psycopg2-binary 2>&1 | tail -3

      - name: Download Spring Security crypto jar
        run: |
          curl -sS -L -o /tmp/spring-security-crypto.jar \
            "https://repo1.maven.org/maven2/org/springframework/security/spring-security-crypto/6.3.1/spring-security-crypto-6.3.1.jar"
          ls -la /tmp/spring-security-crypto.jar

      - name: Generate BCrypt hash using Spring Security
        id: hash
        run: |
          # Write Java file using Python (avoids shell quoting issues)
          python3 -c "
          with open('/tmp/GenHash.java', 'w') as f:
              f.write('''import org.springframework.security.crypto.bcrypt.BCryptPasswordEncoder;
          public class GenHash {
              public static void main(String[] args) {
                  BCryptPasswordEncoder encoder = new BCryptPasswordEncoder(10);
                  String hash = encoder.encode(\"SNad@2026\");
                  System.out.println(hash);
                  System.err.println(\"Verify: \" + encoder.matches(\"SNad@2026\", hash));
              }
          }
          ''')
          "

          echo "=== Compiling ==="
          javac -cp /tmp/spring-security-crypto.jar /tmp/GenHash.java -d /tmp/ 2>&1

          echo "=== Running ==="
          HASH=$(java -cp /tmp:/tmp/spring-security-crypto.jar GenHash 2>/dev/null)
          echo "Hash: $HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Insert using RENDER DB credentials (not PROD_JDBC_URL)
        env:
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import psycopg2
          import os
          import sys

          # Use the EXACT Render DB credentials (from user's screenshot)
          host = "aws-0-eu-central-1.pooler.supabase.com"
          port = "5432"
          dbname = "postgres"
          user = "postgres.hxhvfqxzigrqoxxnnzje"
          password = "Senen@001985"
          tenant_id = "958bbb1c-eece-4839-bca8-a5bfa14e6ac1"
          admin_email = "admin@snad.ai"
          hash_val = os.environ['HASH']

          print(f"Host: {host}:{port}", file=sys.stderr)
          print(f"User: {user}", file=sys.stderr)
          print(f"Hash: {hash_val}", file=sys.stderr)

          conn = psycopg2.connect(host=host, port=port, dbname=dbname,
                                  user=user, password=password, sslmode='require')
          cur = conn.cursor()

          # Check existing users
          cur.execute("SELECT id, email, status, length(password_hash) FROM public.users WHERE email = %s", (admin_email,))
          existing = cur.fetchone()
          print(f"Existing user: {existing}", file=sys.stderr)

          # Update password
          cur.execute("UPDATE public.users SET password_hash = %s, status = 'ACTIVE', updated_at = CURRENT_TIMESTAMP WHERE email = %s",
                      (hash_val, admin_email))
          print(f"Updated: {cur.rowcount} rows", file=sys.stderr)

          conn.commit()
          cur.close()
          conn.close()
          print("Done!", file=sys.stderr)
          PYEOF

      - name: Test login
        run: |
          echo "=== Login test ==="
          for i in 1 2 3; do
            RESULT=$(curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
              -H "Content-Type: application/json" \
              -d '{"email":"admin@snad.ai","password":"SNad@2026"}' \
              -w "\n%{http_code}" 2>/dev/null || echo "timeout\n000")
            CODE=$(echo "$RESULT" | tail -1)
            echo "  Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "🎉 LOGIN SUCCESSFUL!"; exit 0; fi
            sleep 30
          done
