name: Set Render Env Var (One-Time)
on:
  workflow_dispatch:
    inputs:
      key:
        description: Render env var key
        required: true
      value:
        description: Render env var value
        required: true

permissions:
  contents: read

jobs:
  set-env-var:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Set single Render environment variable
        shell: bash
        run: |
          set -euo pipefail
          echo "Setting ${{ inputs.key }} in Render service..."
          jq -n --arg value "${{ inputs.value }}" '{value:$value}' > /tmp/env-update.json
          curl --fail-with-body --silent --show-error --max-time 45 \
            -X PUT \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data @/tmp/env-update.json \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/${{ inputs.key }}" \
            > /tmp/env-response.json
          echo "Render API response:"
          jq '{key: .envVar.key, value_present: ((.envVar.value // "") | length > 0)}' /tmp/env-response.json
          echo "DONE: ${{ inputs.key }} set successfully"

      - name: Verify the variable was set
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 45 \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/${{ inputs.key }}" \
            > /tmp/verify.json
          value_present=$(jq -r '(.envVar // .).value // empty' /tmp/verify.json)
          if [ -n "$value_present" ]; then
            echo "VERIFIED: ${{ inputs.key }} is present in Render environment"
          else
            echo "::error::${{ inputs.key }} was not set correctly"
            exit 1
          fi
