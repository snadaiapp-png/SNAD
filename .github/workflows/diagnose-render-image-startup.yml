name: Diagnose Render Image Startup

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (commit sha) to diagnose. Leave empty for latest main HEAD."
        required: false
        default: ""
      flyway_enabled:
        description: "FLYWAY_ENABLED (true|false)"
        required: false
        default: "true"
      flyway_validate_on_migrate:
        description: "FLYWAY_VALIDATE_ON_MIGRATE (true|false)"
        required: false
        default: "true"
      flyway_out_of_order:
        description: "FLYWAY_OUT_OF_ORDER (true|false)"
        required: false
        default: "false"
      lazy_init:
        description: "LAZY_INIT (true|false) - set false to force eager Flyway init"
        required: false
        default: "true"
      crm_encryption_key:
        description: "CRM_CUSTOM_FIELD_ENCRYPTION_KEY (base64-encoded AES-256 key). Leave empty to skip."
        required: false
        default: ""
      sanad_service_auth_jwt_secret:
        description: "SANAD_SERVICE_AUTH_JWT_SECRET (>=32 chars)"
        required: false
        default: "test-jwt-secret-please-override-in-workflow-dispatch-32chars-min"
      sanad_workflow_engine_base_url:
        description: "SANAD_WORKFLOW_ENGINE_BASE_URL (must be HTTPS, not localhost)"
        required: false
        default: "https://sanad-backend-mcrj.onrender.com"
      sanad_ai_gateway_base_url:
        description: "SANAD_AI_GATEWAY_BASE_URL (must be HTTPS, not localhost)"
        required: false
        default: "https://sanad-backend-mcrj.onrender.com"
      sanad_production_guard_enabled:
        description: "SANAD_PRODUCTION_GUARD_ENABLED (true|false)"
        required: false
        default: "true"
      jwt_secret:
        description: "JWT_SECRET (>=32 bytes) — for JwtTokenProvider.validateSecret"
        required: false
        default: "c35ee4f36fcd6dc36156b07d2f28520dc01fb4eb5da539836e7cfe5891b33107"
      sanad_cors_allowed_origins:
        description: "SANAD_CORS_ALLOWED_ORIGINS (HTTPS origin of frontend)"
        required: false
        default: "https://snad-app.vercel.app"
      database_url:
        description: "DATABASE_URL (pooler URL works best from GitHub runners)"
        required: true
        default: "jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:5432/postgres?prepareThreshold=0&sslmode=require"
      database_username:
        description: "DATABASE_USERNAME"
        required: true
        default: "postgres.tkbrvupemreqabwzdpyq"
      database_password:
        description: "DATABASE_PASSWORD"
        required: true

permissions:
  contents: read
  packages: read

jobs:
  run-image:
    name: Pull image, run locally, capture startup logs
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15

    env:
      IMAGE_TAG: ${{ github.sha }}
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/snad-backend

    steps:
      - name: Resolve image tag
        run: |
          echo "Repo HEAD sha: ${{ github.sha }}"
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> $GITHUB_ENV
          fi
          echo "Will diagnose image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          docker pull ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          echo "=== Pulled images ==="
          docker images --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}" | head -10 || true

      - name: Run container with prod DB + capture logs
        env:
          DATABASE_URL: ${{ inputs.database_url }}
          DATABASE_USERNAME: ${{ inputs.database_username }}
          DATABASE_PASSWORD: ${{ inputs.database_password }}
          FLYWAY_ENABLED: ${{ inputs.flyway_enabled }}
          FLYWAY_VALIDATE_ON_MIGRATE: ${{ inputs.flyway_validate_on_migrate }}
          FLYWAY_OUT_OF_ORDER: ${{ inputs.flyway_out_of_order }}
          SPRING_FLYWAY_OUT_OF_ORDER: ${{ inputs.flyway_out_of_order }}
          JPA_DDL_AUTO: none
          SPRING_PROFILES_ACTIVE: prod
          LAZY_INIT: ${{ inputs.lazy_init }}
          SERVER_PORT: 8080
          CRM_CUSTOM_FIELD_ENCRYPTION_KEY: ${{ inputs.crm_encryption_key }}
          SANAD_SERVICE_AUTH_JWT_SECRET: ${{ inputs.sanad_service_auth_jwt_secret }}
          SANAD_WORKFLOW_ENGINE_BASE_URL: ${{ inputs.sanad_workflow_engine_base_url }}
          SANAD_AI_GATEWAY_BASE_URL: ${{ inputs.sanad_ai_gateway_base_url }}
          SANAD_PRODUCTION_GUARD_ENABLED: ${{ inputs.sanad_production_guard_enabled }}
          JWT_SECRET: ${{ inputs.jwt_secret }}
          SANAD_CORS_ALLOWED_ORIGINS: ${{ inputs.sanad_cors_allowed_origins }}
        run: |
          set +e
          mkdir -p logs
          echo "=== Run container for 240s with 512MB memory limit (mimic Render free tier) ==="
          docker run --rm \
            --name sanad-diag \
            --memory=512m --memory-swap=512m \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DATABASE_USERNAME="$DATABASE_USERNAME" \
            -e DATABASE_PASSWORD="$DATABASE_PASSWORD" \
            -e FLYWAY_ENABLED="$FLYWAY_ENABLED" \
            -e FLYWAY_VALIDATE_ON_MIGRATE="$FLYWAY_VALIDATE_ON_MIGRATE" \
            -e FLYWAY_OUT_OF_ORDER="$FLYWAY_OUT_OF_ORDER" \
            -e SPRING_FLYWAY_OUT_OF_ORDER="$SPRING_FLYWAY_OUT_OF_ORDER" \
            -e JPA_DDL_AUTO="$JPA_DDL_AUTO" \
            -e SPRING_PROFILES_ACTIVE="$SPRING_PROFILES_ACTIVE" \
            -e LAZY_INIT="$LAZY_INIT" \
            -e SERVER_PORT="$SERVER_PORT" \
            -e CRM_CUSTOM_FIELD_ENCRYPTION_KEY="$CRM_CUSTOM_FIELD_ENCRYPTION_KEY" \
            -e SANAD_SERVICE_AUTH_JWT_SECRET="$SANAD_SERVICE_AUTH_JWT_SECRET" \
            -e SANAD_WORKFLOW_ENGINE_BASE_URL="$SANAD_WORKFLOW_ENGINE_BASE_URL" \
            -e SANAD_AI_GATEWAY_BASE_URL="$SANAD_AI_GATEWAY_BASE_URL" \
            -e SANAD_PRODUCTION_GUARD_ENABLED="$SANAD_PRODUCTION_GUARD_ENABLED" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e SANAD_CORS_ALLOWED_ORIGINS="$SANAD_CORS_ALLOWED_ORIGINS" \
            ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG} \
            > logs/container.log 2>&1 &
          CONTAINER_PID=$!
          echo "Container PID: $CONTAINER_PID"
          # Wait up to 240s for container to either succeed (healthcheck up) or crash
          for i in $(seq 1 48); do
            sleep 5
            if ! kill -0 $CONTAINER_PID 2>/dev/null; then
              echo "Container exited at attempt $i (~$((i*5))s)"
              break
            fi
            # Check if health endpoint is up
            CONTAINER_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' sanad-diag 2>/dev/null || true)
            if [ -n "$CONTAINER_IP" ]; then
              HEALTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 "http://${CONTAINER_IP}:8080/actuator/health" 2>/dev/null || echo "000")
              echo "  attempt $i (~$((i*5))s): container up, health=$HEALTH"
              if [ "$HEALTH" = "200" ]; then
                echo "  ✅ Spring Boot started successfully!"
                # Wait a bit more for all migrations to complete
                sleep 10
                docker kill sanad-diag 2>/dev/null || true
                break
              fi
            fi
          done
          # Kill container if still running
          docker kill sanad-diag 2>/dev/null || true
          wait $CONTAINER_PID 2>/dev/null || true
          echo "=== Container log size: $(wc -c < logs/container.log) bytes, $(wc -l < logs/container.log) lines ==="

      - name: Show last 200 lines of container log
        run: |
          echo "==================== LAST 200 LINES OF CONTAINER LOG ===================="
          tail -200 logs/container.log || true
          echo "==================== END LOG ===================="

      - name: Search log for known error patterns
        run: |
          echo "==================== ERROR PATTERN SEARCH ===================="
          for pattern in "Exception" "Caused by" "APPLICATION FAILED TO START" "OutOfMemoryError" "Metaspace" "BeanCreationException" "BeanInstantiationException" "FlywayException" "Migration of" "duplicate_object" "ERROR:" "FATAL"; do
            echo ""
            echo "--- Pattern: $pattern ---"
            grep -n -E "$pattern" logs/container.log 2>/dev/null | head -10 || true
          done

      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-image-startup-logs-${{ env.IMAGE_TAG }}
          path: logs/
          retention-days: 14
