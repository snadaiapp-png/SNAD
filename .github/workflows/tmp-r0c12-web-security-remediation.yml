name: TEMP R0C12 Web Security Remediation

on:
  push:
    branches:
      - fix/r0c12-web-production-dependency-security

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/r0c12-web-production-dependency-security
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: RED — reproduce production dependency audit failure
        shell: bash
        run: |
          set -euo pipefail
          cd apps/web
          npm ci
          set +e
          npm audit --omit=dev --audit-level=high > /tmp/audit-red.txt 2>&1
          rc=$?
          set -e
          cat /tmp/audit-red.txt
          test "$rc" -ne 0
          grep -q '^next ' /tmp/audit-red.txt
          grep -q '^sharp ' /tmp/audit-red.txt
          echo "RED_PROVEN=YES"

      - name: Apply minimal patched dependency versions
        shell: bash
        run: |
          set -euo pipefail
          cd apps/web
          npm pkg set overrides.sharp=0.35.4
          npm install next@16.3.3 --save --package-lock-only --ignore-scripts
          node - <<'NODE'
          const p = require('./package.json');
          if (p.dependencies.next !== '^16.3.3') throw new Error(`unexpected next range: ${p.dependencies.next}`);
          if (p.overrides?.sharp !== '0.35.4') throw new Error(`unexpected sharp override: ${p.overrides?.sharp}`);
          NODE

      - name: GREEN — audit and web regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd apps/web
          npm ci
          node -e "console.log('next=' + require('next/package.json').version); if (require('next/package.json').version !== '16.3.3') process.exit(2)"
          node -e "console.log('sharp=' + require('sharp/package.json').version); if (require('sharp/package.json').version !== '0.35.4') process.exit(3)"
          npm audit --omit=dev --audit-level=high
          npm run lint
          npx tsc --noEmit
          npm test
          npm run build
          echo "GREEN_PROVEN=YES"

      - name: Commit exact two-file remediation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm .github/workflows/tmp-r0c12-web-security-remediation.yml
          git add apps/web/package.json apps/web/package-lock.json

          actual_staged="$(git diff --cached --name-only --no-renames | sort)"
          expected_staged="$(printf '%s\n' \
            '.github/workflows/tmp-r0c12-web-security-remediation.yml' \
            'apps/web/package-lock.json' \
            'apps/web/package.json' | sort)"
          printf 'STAGED:\n%s\n' "$actual_staged"
          test "$actual_staged" = "$expected_staged"

          git commit -m 'fix(web): patch production dependency vulnerabilities'

          actual_net="$(git diff --name-only --no-renames 4c0098aa67371edf37fd095eaffe66eeb120c0dc...HEAD | sort)"
          expected_net="$(printf '%s\n' 'apps/web/package-lock.json' 'apps/web/package.json' | sort)"
          printf 'NET_DIFF:\n%s\n' "$actual_net"
          test "$actual_net" = "$expected_net"

          git push origin HEAD:fix/r0c12-web-production-dependency-security
