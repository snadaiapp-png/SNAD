name: G1 Shared Credential Sync

# Copies the CURRENT forensically-verified `sanad` password (staged in
# G1_DATASOURCE_PASSWORD by the DBA-authorized rotation of 2026-10-11) into
# SPRING_DATASOURCE_PASSWORD and PRODUCTION_DATABASE_PASSWORD, in BOTH the
# repository scope and the production environment scope.
#
# Root cause fixed (RC-1): the 2026-10-11 rotation intentionally left shared
# backend secrets untouched, so they hold the stale pre-rotation value
# (forensics runs 39223217596 / 39236371817: AUTH_FAIL on every endpoint).
# This sync requires NO database change: the value written is the password
# the role already uses, so consumers resume authenticating immediately.
#
# Fail-closed rails (in scripts/security/g1_sync_shared_credentials.py):
# the source must authenticate as restricted `sanad` BEFORE any write, an
# admin token is auto-probed from the sanctioned store (name recorded, value
# never), and all writes use libsodium sealed boxes in memory. Dispatch-only
# from main (production environment policy).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-shared-credential-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync SPRING/PRODUCTION datasource passwords from G1_DATASOURCE (values never emitted)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      G1_DATASOURCE_PASSWORD: ${{ secrets.G1_DATASOURCE_PASSWORD }}
      Z_GITHUB_TOKEN: ${{ secrets.Z_GITHUB_TOKEN }}
      BRANCH_PROTECTION_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
      G4_BOOTSTRAP_PAT: ${{ secrets.G4_BOOTSTRAP_PAT }}
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Mask every candidate value defensively
        shell: bash
        run: |
          set -euo pipefail
          for key in G1_DATASOURCE_PASSWORD Z_GITHUB_TOKEN \
                     BRANCH_PROTECTION_TOKEN G4_BOOTSTRAP_PAT; do
            value="${!key:-}"
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
          done
          test -n "${G1_DATASOURCE_PASSWORD:-}" \
            || { echo "::error::Missing source secret: G1_DATASOURCE_PASSWORD"; exit 1; }

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned PostgreSQL driver and sealed-box library
        run: |-
          python -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10' 'pynacl==1.5.0'

      - name: Sync shared credentials (single in-memory pass)
        shell: bash
        run: python scripts/security/g1_sync_shared_credentials.py

      - name: Upload sanitized sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-credential-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: g1-credential-sync-evidence.json
          if-no-files-found: warn
