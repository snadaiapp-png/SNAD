name: Flyway Production One-Shot Out-of-Order Recovery

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/flyway-production-out-of-order-recovery.yml"

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: flyway-production-one-shot-out-of-order-recovery
  cancel-in-progress: false

jobs:
  recover-and-release:
    name: Recover exact pending Flyway lineage and release
    if: contains(github.event.head_commit.message, '[flyway-ooo-recovery]')
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 90
    env:
      EXPECTED_APP_SOURCE_SHA: 113a989a632f80709f098e41049040e3856b9a20
      DB_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
      DB_USER: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
      DB_PASS: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      GH_TOKEN: ${{ github.token }}
      FLYWAY_VERSION: "10.19.0"

    steps:
      - name: Checkout exact recovery commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact main and application-source lock
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          REMOTE_MAIN_SHA="$(git rev-parse origin/main)"
          test "$REMOTE_MAIN_SHA" = "$GITHUB_SHA" || {
            echo "::error::Main drift detected: recovery SHA=$GITHUB_SHA current main=$REMOTE_MAIN_SHA"
            exit 1
          }
          git cat-file -e "$EXPECTED_APP_SOURCE_SHA^{commit}"
          if ! git diff --quiet "$EXPECTED_APP_SOURCE_SHA" "$GITHUB_SHA" -- apps/sanad-platform apps/web; then
            echo "::error::Application source changed after the certified recovery target $EXPECTED_APP_SOURCE_SHA"
            git diff --name-only "$EXPECTED_APP_SOURCE_SHA" "$GITHUB_SHA" -- apps/sanad-platform apps/web
            exit 1
          fi
          echo "EXACT_MAIN_LOCK=PASS"
          echo "APPLICATION_SOURCE_LOCK=PASS"

      - name: Install PostgreSQL client and Flyway CLI
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql --version

          BASE="https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/$FLYWAY_VERSION"
          ARCHIVE="flyway-commandline-$FLYWAY_VERSION-linux-x64.tar.gz"
          curl --fail --silent --show-error --location "$BASE/$ARCHIVE" -o "/tmp/$ARCHIVE"
          curl --fail --silent --show-error --location "$BASE/$ARCHIVE.sha1" -o "/tmp/$ARCHIVE.sha1"
          EXPECTED_SHA1="$(tr -d '[:space:]' < "/tmp/$ARCHIVE.sha1")"
          ACTUAL_SHA1="$(sha1sum "/tmp/$ARCHIVE" | awk '{print $1}')"
          test "$EXPECTED_SHA1" = "$ACTUAL_SHA1" || {
            echo "::error::Flyway CLI archive checksum mismatch"
            exit 1
          }
          tar -xzf "/tmp/$ARCHIVE" -C /tmp
          test -x "/tmp/flyway-$FLYWAY_VERSION/flyway"
          echo "/tmp/flyway-$FLYWAY_VERSION" >> "$GITHUB_PATH"
          echo "FLYWAY_CLI_CHECKSUM=PASS"

      - name: Certify exact pending migration set read-only
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          : "${DB_URL:?DB_URL is required}"
          : "${DB_USER:?DB_USER is required}"
          : "${DB_PASS:?DB_PASS is required}"

          export PGPASSWORD="$DB_PASS"
          PSQL_URL="${DB_URL#jdbc:}"

          FAILED_ROWS="$(psql "$PSQL_URL" -U "$DB_USER" -X -v ON_ERROR_STOP=1 -Atc             "select count(*) from public.flyway_schema_history where success = false;")"
          test "$FAILED_ROWS" = "0" || {
            echo "::error::Production flyway_schema_history contains failed rows: $FAILED_ROWS"
            exit 1
          }

          python3 - <<'PY' > "$RUNNER_TEMP/repo-versions.txt"
          from pathlib import Path
          roots = [
              Path("apps/sanad-platform/src/main/resources/db/migration"),
              Path("apps/sanad-platform/src/main/resources/db/vendor/postgresql"),
          ]
          versions = set()
          for root in roots:
              for path in root.glob("V*.sql"):
                  name = path.name
                  if "__" not in name:
                      continue
                  versions.add(name[1:].split("__", 1)[0].replace("_", "."))
          def key(v):
              return tuple(int(x) for x in v.split("."))
          for version in sorted(versions, key=key):
              print(version)
          PY

          psql "$PSQL_URL" -U "$DB_USER" -X -v ON_ERROR_STOP=1 -Atc             "select version from public.flyway_schema_history where success = true and version is not null;"             > "$RUNNER_TEMP/applied-versions.txt"

          python3 - <<'PY'
          from pathlib import Path
          expected = [
              "20260908.2",
              "20260908.3",
              "20260908.4",
              "20260913.1",
              "20260914.2",
              "20260914.3",
              "20260918.1",
          ]
          repo = set(Path("/tmp/placeholder").read_text().splitlines()) if False else set()
          repo = set(Path(__import__("os").environ["RUNNER_TEMP"]).joinpath("repo-versions.txt").read_text().splitlines())
          applied = set(Path(__import__("os").environ["RUNNER_TEMP"]).joinpath("applied-versions.txt").read_text().splitlines())
          def key(v):
              return tuple(int(x) for x in v.split("."))
          missing = sorted(repo - applied, key=key)
          print("Expected pending:", ",".join(expected))
          print("Observed pending:", ",".join(missing))
          if missing != expected:
              raise SystemExit("FAIL_CLOSED: production pending migration set is not the certified seven-version set")
          PY

          echo "FAILED_ROWS_BEFORE=0" >> "$GITHUB_OUTPUT"
          echo "PENDING_SET_CERTIFIED=YES" >> "$GITHUB_OUTPUT"
          echo "PENDING_SET_CERTIFIED=YES"

      - name: Apply certified pending migrations with one-shot out-of-order
        shell: bash
        env:
          FLYWAY_URL: ${{ env.DB_URL }}
          FLYWAY_USER: ${{ env.DB_USER }}
          FLYWAY_PASSWORD: ${{ env.DB_PASS }}
          FLYWAY_TABLE: flyway_schema_history
          FLYWAY_CLEAN_DISABLED: "true"
          FLYWAY_BASELINE_ON_MIGRATE: "false"
          FLYWAY_VALIDATE_ON_MIGRATE: "true"
          FLYWAY_OUT_OF_ORDER: "true"
          FLYWAY_VALIDATE_MIGRATION_NAMING: "false"
        run: |
          set -euo pipefail
          export FLYWAY_LOCATIONS="filesystem:$GITHUB_WORKSPACE/apps/sanad-platform/src/main/resources/db/migration,filesystem:$GITHUB_WORKSPACE/apps/sanad-platform/src/main/resources/db/vendor/postgresql"
          echo "ONE_SHOT_OUT_OF_ORDER=true"
          flyway info
          flyway validate
          flyway migrate
          echo "FLYWAY_ONE_SHOT_MIGRATE=PASS"

      - name: Verify Flyway history complete and normal mode valid
        shell: bash
        env:
          FLYWAY_URL: ${{ env.DB_URL }}
          FLYWAY_USER: ${{ env.DB_USER }}
          FLYWAY_PASSWORD: ${{ env.DB_PASS }}
          FLYWAY_TABLE: flyway_schema_history
          FLYWAY_CLEAN_DISABLED: "true"
          FLYWAY_BASELINE_ON_MIGRATE: "false"
          FLYWAY_VALIDATE_ON_MIGRATE: "true"
          FLYWAY_OUT_OF_ORDER: "false"
          FLYWAY_VALIDATE_MIGRATION_NAMING: "false"
        run: |
          set -euo pipefail
          export PGPASSWORD="$DB_PASS"
          PSQL_URL="${DB_URL#jdbc:}"
          export FLYWAY_LOCATIONS="filesystem:$GITHUB_WORKSPACE/apps/sanad-platform/src/main/resources/db/migration,filesystem:$GITHUB_WORKSPACE/apps/sanad-platform/src/main/resources/db/vendor/postgresql"

          TARGET_COUNT="$(psql "$PSQL_URL" -U "$DB_USER" -X -v ON_ERROR_STOP=1 -Atc             "select count(*) from public.flyway_schema_history where success = true and version in ('20260908.2','20260908.3','20260908.4','20260913.1','20260914.2','20260914.3','20260918.1');")"
          FAILED_ROWS="$(psql "$PSQL_URL" -U "$DB_USER" -X -v ON_ERROR_STOP=1 -Atc             "select count(*) from public.flyway_schema_history where success = false;")"
          test "$TARGET_COUNT" = "7" || {
            echo "::error::Expected seven certified recovery migrations, found $TARGET_COUNT"
            exit 1
          }
          test "$FAILED_ROWS" = "0" || {
            echo "::error::Flyway failed rows after recovery: $FAILED_ROWS"
            exit 1
          }

          psql "$PSQL_URL" -U "$DB_USER" -X -v ON_ERROR_STOP=1 -Atc             "select version from public.flyway_schema_history where success = true and version is not null;"             > "$RUNNER_TEMP/applied-after.txt"

          python3 - <<'PY'
          from pathlib import Path
          import os
          repo = set(Path(os.environ["RUNNER_TEMP"]).joinpath("repo-versions.txt").read_text().splitlines())
          applied = set(Path(os.environ["RUNNER_TEMP"]).joinpath("applied-after.txt").read_text().splitlines())
          missing = repo - applied
          if missing:
              def key(v): return tuple(int(x) for x in v.split("."))
              raise SystemExit("FAIL_CLOSED: migrations still pending after recovery: " + ",".join(sorted(missing, key=key)))
          print("PENDING_MIGRATIONS_AFTER=0")
          PY

          flyway validate
          echo "NORMAL_OUT_OF_ORDER_FALSE_VALIDATE=PASS"

      - name: Verify Render keeps out-of-order disabled
        shell: bash
        run: |
          set -euo pipefail
          : "${RENDER_API_KEY:?RENDER_API_KEY is required}"
          : "${RENDER_SERVICE_ID:?RENDER_SERVICE_ID is required}"
          curl --fail --silent --show-error --location             -H "Authorization: Bearer $RENDER_API_KEY"             "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100"             > "$RUNNER_TEMP/render-env.json"
          test "$(jq 'length' "$RUNNER_TEMP/render-env.json")" -lt 100 || {
            echo "::error::Cannot prove complete Render environment pagination"
            exit 1
          }
          jq '[.[]? | (.envVar // .)]' "$RUNNER_TEMP/render-env.json" > "$RUNNER_TEMP/render-env-normalized.json"
          for key in FLYWAY_OUT_OF_ORDER SPRING_FLYWAY_OUT_OF_ORDER; do
            value="$(jq -r --arg key "$key" '[.[] | select(.key == $key) | .value][0] // ""' "$RUNNER_TEMP/render-env-normalized.json")"
            case "$value" in
              ""|false) echo "$key=SAFE_FALSE_OR_UNSET" ;;
              *) echo "::error::$key must remain false or unset after one-shot recovery"; exit 1 ;;
            esac
          done
          echo "RENDER_OUT_OF_ORDER_PERSISTENTLY_DISABLED=PASS"

      - name: Write sanitized migration evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flyway-ooo-recovery"
          jq -n             --arg sourceSha "$GITHUB_SHA"             --arg applicationSourceSha "$EXPECTED_APP_SOURCE_SHA"             '{
              result:"MIGRATION_RECOVERY_PASS",
              sourceSha:$sourceSha,
              applicationSourceSha:$applicationSourceSha,
              expectedPending:["20260908.2","20260908.3","20260908.4","20260913.1","20260914.2","20260914.3","20260918.1"],
              appliedCount:7,
              failedRows:0,
              databaseMode:"PostgreSQL Direct",
              docker:"NOT_USED",
              flywayOutOfOrder:"ONE_SHOT_ONLY",
              renderPersistentOutOfOrder:"FALSE_OR_UNSET",
              manualSchemaHistoryEdit:"NONE",
              flywayRepair:"NONE"
            }' > "$RUNNER_TEMP/flyway-ooo-recovery/evidence.json"
          sha256sum "$RUNNER_TEMP/flyway-ooo-recovery/evidence.json" > "$RUNNER_TEMP/flyway-ooo-recovery/SHA256SUMS.txt"

      - name: Upload migration recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: flyway-ooo-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/flyway-ooo-recovery
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact immutable backend image for recovery merge SHA
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$CURRENT_MAIN" = "$GITHUB_SHA" || {
            echo "::error::Main drift before image publication: $CURRENT_MAIN"
            exit 1
          }
          DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "dispatched_at=$DISPATCHED_AT" >> "$GITHUB_OUTPUT"
          gh workflow run publish-render-image.yml --ref main

          RUN_ID=""
          for _ in $(seq 1 180); do
            RESPONSE="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/publish-render-image.yml/runs?event=workflow_dispatch&branch=main&per_page=20")"
            RUN_ID="$(jq -r --arg sha "$GITHUB_SHA" --arg started "$DISPATCHED_AT"               '[.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started)] | sort_by(.created_at) | first.id // empty' <<<"$RESPONSE")"
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          test -n "$RUN_ID" || { echo "::error::Exact-SHA image publication run was not observed"; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          for _ in $(seq 1 270); do
            STATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
            STATUS="$(jq -r '.status' <<<"$STATE")"
            CONCLUSION="$(jq -r '.conclusion // ""' <<<"$STATE")"
            echo "Image publication run $RUN_ID: status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success" || { echo "::error::Exact-SHA image publication failed"; exit 1; }
              echo "EXACT_IMAGE_PUBLICATION=PASS"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for exact-SHA image publication"
          exit 1

      - name: Dispatch SANAD Production Release for exact recovery SHA
        id: release
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$CURRENT_MAIN" = "$GITHUB_SHA" || {
            echo "::error::Main drift before production release: $CURRENT_MAIN"
            exit 1
          }

          PR_NUMBER="$(gh api -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')"
          test -n "$PR_NUMBER" || {
            echo "::error::Could not resolve recovery PR number for release evidence"
            exit 1
          }
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          DISPATCHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "dispatched_at=$DISPATCHED_AT" >> "$GITHUB_OUTPUT"
          gh workflow run production-release.yml --ref main             -f commit_sha="$GITHUB_SHA"             -f pull_request_number="$PR_NUMBER"             -f rollback_on_failure=true

          RUN_ID=""
          for _ in $(seq 1 180); do
            RESPONSE="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/production-release.yml/runs?event=workflow_dispatch&branch=main&per_page=20")"
            RUN_ID="$(jq -r --arg sha "$GITHUB_SHA" --arg started "$DISPATCHED_AT"               '[.workflow_runs[] | select(.head_sha == $sha and .created_at >= $started)] | sort_by(.created_at) | first.id // empty' <<<"$RESPONSE")"
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          test -n "$RUN_ID" || { echo "::error::Production release run was not observed"; exit 1; }
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          for _ in $(seq 1 390); do
            STATE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
            STATUS="$(jq -r '.status' <<<"$STATE")"
            CONCLUSION="$(jq -r '.conclusion // ""' <<<"$STATE")"
            echo "Production release run $RUN_ID: status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success" || { echo "::error::SANAD Production Release failed"; exit 1; }
              echo "SANAD_PRODUCTION_RELEASE=PASS"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for SANAD Production Release"
          exit 1

      - name: Verify live Render image exact after release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             -H "Authorization: Bearer $RENDER_API_KEY"             "https://api.render.com/v1/services/$RENDER_SERVICE_ID"             > "$RUNNER_TEMP/render-service-after.json"
          LIVE_IMAGE="$(jq -r '.imagePath // .serviceDetails.image.imageRef // .image.imageRef // empty' "$RUNNER_TEMP/render-service-after.json")"
          EXPECTED_IMAGE="ghcr.io/$GITHUB_REPOSITORY_OWNER/snad-backend:$GITHUB_SHA"
          test "$LIVE_IMAGE" = "$EXPECTED_IMAGE" || {
            echo "::error::Render live image mismatch after certified release"
            echo "Expected: $EXPECTED_IMAGE"
            echo "Observed: $LIVE_IMAGE"
            exit 1
          }
          echo "LIVE_RENDER_IMAGE_EXACT=PASS"
