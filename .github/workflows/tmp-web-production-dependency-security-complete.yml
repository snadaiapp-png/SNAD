name: Temporary Web Production Dependency Security Completion

on:
  push:
    branches:
      - fix/web-production-dependency-security-complete

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: RED — prove production audit is not fully clean
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          set +e
          npm audit --omit=dev --audit-level=low > /tmp/red-production-audit.txt 2>&1
          rc=$?
          set -e
          cat /tmp/red-production-audit.txt
          if [ "$rc" -eq 0 ]; then
            echo "RED invalid: production dependency audit is already clean"
            exit 1
          fi
          grep -q "baseline-browser-mapping" /tmp/red-production-audit.txt
          echo "RED proven: remaining production advisory is reproducible"

      - name: Apply minimal complete production dependency remediation
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (pkg.dependencies?.next !== '^16.3.3') {
            throw new Error(`Unexpected Next.js baseline: ${pkg.dependencies?.next}`);
          }
          if (pkg.overrides?.sharp !== '0.35.4') {
            throw new Error(`Unexpected sharp baseline: ${pkg.overrides?.sharp}`);
          }
          pkg.overrides = pkg.overrides || {};
          pkg.overrides['baseline-browser-mapping'] = '2.11.21';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Verify locked install
        working-directory: apps/web
        run: npm ci

      - name: GREEN — zero production dependency vulnerabilities
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=low
          npm ls next sharp baseline-browser-mapping --all

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: TypeScript
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: apps/web
        run: npm test

      - name: Production build
        working-directory: apps/web
        run: npm run build

      - name: Commit remediation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-web-production-dependency-security-complete.yml
          git add apps/web/package.json apps/web/package-lock.json
          git diff --cached --check
          git commit -m "fix(web): eliminate remaining production dependency advisory"
          git push origin HEAD:fix/web-production-dependency-security-complete
