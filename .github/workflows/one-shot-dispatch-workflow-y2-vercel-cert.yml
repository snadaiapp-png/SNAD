name: One-Shot Dispatch Workflow Y2 Vercel Certification

on:
  push:
    branches:
      - ops/dispatch-vercel-cert-93b66b0c
    paths:
      - ".github/workflows/one-shot-dispatch-workflow-y2-vercel-cert.yml"

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch exact-main Vercel certification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_MAIN_SHA: 93b66b0c0b5dc8def2e297052147e9b506cbe7ed
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Verify current main remains exact certified release
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq '.commit.sha')"
          test "$current_main" = "$EXPECTED_MAIN_SHA" || {
            echo "::error::Main drift detected: expected=$EXPECTED_MAIN_SHA actual=$current_main"
            exit 1
          }
          echo "CURRENT_MAIN_LOCK=PASS"

      - name: Dispatch new Vercel production certification
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run workflow-y2-vercel-production-certification.yml             --ref main             -f backend_release_sha="$EXPECTED_MAIN_SHA"             -f confirm="run-vercel-workflow-certification"
          echo "dispatched_at=$dispatched_at" >> "$GITHUB_OUTPUT"

      - name: Resolve newly-created certification run
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          started="${{ steps.dispatch.outputs.dispatched_at }}"
          run_id=""
          for _ in $(seq 1 60); do
            response="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$EXPECTED_MAIN_SHA&per_page=100")"
            run_id="$(jq -r --arg started "$started" '
              [.workflow_runs[]
                | select(
                    .name == "Workflow Y2 Vercel Production Certification"
                    and .event == "workflow_dispatch"
                    and .head_sha == env.EXPECTED_MAIN_SHA
                    and .created_at >= $started
                  )
              ]
              | sort_by(.created_at)
              | first.id // empty
            ' <<<"$response")"
            [ -n "$run_id" ] && break
            sleep 5
          done
          test -n "$run_id" || {
            echo "::error::New exact-SHA certification run was not observed"
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "CERT_RUN_ID=$run_id"

      - name: Wait for certification result
        shell: bash
        run: |
          set -euo pipefail
          run_id="${{ steps.resolve.outputs.run_id }}"
          for _ in $(seq 1 180); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            status="$(jq -r '.status' <<<"$state")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$state")"
            echo "Certification run $run_id: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success" || {
                echo "::error::Vercel production certification did not succeed"
                exit 1
              }
              echo "WORKFLOW_Y2_VERCEL_CERTIFICATION=PASS"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for Vercel production certification"
          exit 1
