name: G7 Mobile Closure

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'G7_*.md'
      - '.github/workflows/g7-mobile-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-verification:
    name: Mobile Tests and Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck mobile client
        run: npm run typecheck

      - name: Run mobile test suite
        run: npm test -- --runInBand
