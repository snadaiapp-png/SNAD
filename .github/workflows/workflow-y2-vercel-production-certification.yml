# Certification trigger: exact production-aligned main d84f5e4a6e8ceace0d4263e1d7740b3172d32d20 — 2026-09-15
name: Workflow Y2 Vercel Production Certification

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/workflow-y2-vercel-production-certification.yml"
      - "scripts/production/verify-workflow-vercel-production-runtime.sh"
      - "scripts/production/tests/mock_workflow_vercel_runtime.py"
      - "scripts/production/tests/verify-workflow-vercel-production-runtime.test.sh"
      - "scripts/production/tests/test_workflow_y2_vercel_production_certification.py"
      - "apps/web/app/workflow/**"
      - "apps/web/lib/api/workflow-api.ts"
      - "apps/web/lib/workflow/**"
      - "apps/web/app/api/platform/**"
      - "apps/sanad-platform/.release/workflow-y2-production-release-authorized.md"
  workflow_dispatch:
    inputs:
      backend_release_sha:
        description: "Exact immutable backend SHA currently live on Render"
        required: true
        type: string
      confirm:
        description: "Type 'run-vercel-workflow-certification' to authorize read-only Vercel production certification"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: workflow-y2-vercel-production-certification
  cancel-in-progress: false

jobs:
  certify-vercel-workflow:
    name: Certify Workflow module through Vercel production BFF
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    env:
      # Push certification resolves the exact live backend identity from Render.
      # Manual dispatch keeps an explicit pin and must match that live identity.
      BACKEND_RELEASE_SHA_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_release_sha || '' }}
      CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm || 'auto-main-certification' }}
      WEB_PRODUCTION_BASE_URL: ${{ vars.WEB_PRODUCTION_BASE_URL || 'https://snad-app.vercel.app' }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      WORKFLOW_RUNTIME_ADMIN_EMAIL: ${{ secrets.SANAD_ADMIN_EMAIL }}
      WORKFLOW_RUNTIME_ADMIN_PASSWORD: ${{ secrets.SANAD_ADMIN_PASSWORD }}

    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard current-main, backend source parity, and authorization
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              [ "$CONFIRM" = "run-vercel-workflow-certification" ] || {
                echo "::error::confirm must equal run-vercel-workflow-certification"
                exit 1
              }
              ;;
            push)
              [ "$CONFIRM" = "auto-main-certification" ] || {
                echo "::error::automatic main certification confirmation is invalid"
                exit 1
              }
              ;;
            *)
              echo "::error::Unsupported certification event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [[ "$BACKEND_RELEASE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]] || {
              echo "::error::backend_release_sha must be a full lowercase 40-hex SHA"
              exit 1
            }
          fi
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::Vercel production certification must be dispatched from main"
            exit 1
          }
          remote_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          [ "$remote_main" = "$GITHUB_SHA" ] || {
            echo "::error::Workflow checkout is not exact current main"
            exit 1
          }
          for name in WEB_PRODUCTION_BASE_URL RENDER_API_KEY RENDER_SERVICE_ID WORKFLOW_RUNTIME_ADMIN_EMAIL WORKFLOW_RUNTIME_ADMIN_PASSWORD; do
            test -n "${!name:-}" || { echo "::error::$name is required"; exit 1; }
          done
          [[ "$WEB_PRODUCTION_BASE_URL" == https://* ]] || {
            echo "::error::WEB_PRODUCTION_BASE_URL must use HTTPS"
            exit 1
          }
          echo "Source parity and authorization guard: PASS"

      - name: Resolve exact live backend image and verify source parity
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 45 \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=50" \
            > "$RUNNER_TEMP/render-deploys.json"

          jq '
            [if type == "array" then .[] else (.deploys // .items // [])[] end
              | (.deploy // .)
              | select(.status == "live")]
            | sort_by(.finishedAt // .updatedAt // .createdAt)
            | reverse
            | first // empty
          ' "$RUNNER_TEMP/render-deploys.json" > "$RUNNER_TEMP/render-live.json"

          live_id="$(jq -r '.id // empty' "$RUNNER_TEMP/render-live.json")"
          live_image_ref="$(jq -r '(.image.ref // .imageRef) // empty' "$RUNNER_TEMP/render-live.json")"
          test -n "$live_id" || {
            echo "::error::Render API returned no live backend deployment"
            exit 1
          }
          [[ "$live_image_ref" =~ ^ghcr\.io/snadaiapp-png/snad-backend:([0-9a-f]{40})$ ]] || {
            echo "::error::Live Render image is not an immutable SNAD backend SHA image"
            exit 1
          }
          live_sha="${BASH_REMATCH[1]}"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$BACKEND_RELEASE_SHA_INPUT" = "$live_sha" ] || {
              echo "::error::Pinned backend_release_sha does not match the exact live Render backend image"
              exit 1
            }
          fi

          git cat-file -e "${live_sha}^{commit}"
          git merge-base --is-ancestor "$live_sha" HEAD || {
            echo "::error::Live Render backend SHA is not an ancestor of current main"
            exit 1
          }
          git diff --quiet "$live_sha" HEAD -- apps/sanad-platform || {
            echo "::error::Backend source differs between live Render SHA and current main"
            exit 1
          }

          echo "BACKEND_RELEASE_SHA=$live_sha" >> "$GITHUB_ENV"
          jq --arg backendReleaseSha "$live_sha" '
            {
              deploymentId:.id,
              status:.status,
              backendReleaseSha:$backendReleaseSha,
              imageRef:(.image.ref // .imageRef)
            }
          ' "$RUNNER_TEMP/render-live.json" > render-vercel-workflow-backend-evidence.json
          echo "Exact live backend image and source parity: VERIFIED"

      - name: Resolve production tenant identity without exposing it
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 45 \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100" \
            > "$RUNNER_TEMP/render-env.json"
          test "$(jq 'length' "$RUNNER_TEMP/render-env.json")" -lt 100 || {
            echo "::error::Cannot prove complete Render environment pagination"
            exit 1
          }
          jq '[.[]? | (.envVar // .)]' "$RUNNER_TEMP/render-env.json" > "$RUNNER_TEMP/render-env-normalized.json"
          tenant_id="$(jq -r '.[] | select(.key == "SANAD_CONTROL_PLANE_TENANT_ID") | .value // empty' "$RUNNER_TEMP/render-env-normalized.json")"
          [[ "$tenant_id" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || {
            echo "::error::SANAD_CONTROL_PLANE_TENANT_ID is missing or invalid"
            exit 1
          }
          echo "::add-mask::$tenant_id"
          echo "WORKFLOW_RUNTIME_TENANT_ID=$tenant_id" >> "$GITHUB_ENV"

      - name: Certify Workflow module through Vercel production
        shell: bash
        env:
          VERCEL_BASE_URL: ${{ env.WEB_PRODUCTION_BASE_URL }}
          VERCEL_EXPECTED_SHA: ${{ github.sha }}
          WORKFLOW_VERCEL_EVIDENCE_FILE: workflow-vercel-production-runtime.json
        run: |
          set -euo pipefail
          bash scripts/production/verify-workflow-vercel-production-runtime.sh

      - name: Upload sanitized Vercel Workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-vercel-production-certification-${{ github.run_id }}
          path: |
            workflow-vercel-production-runtime.json
            render-vercel-workflow-backend-evidence.json
          if-no-files-found: warn
          retention-days: 90

      - name: Record certification summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Workflow Y2 — Vercel Production Certification"
            echo "- Vercel exact main SHA: $GITHUB_SHA"
            echo "- Backend live SHA: $BACKEND_RELEASE_SHA"
            echo "- Vercel production release identity: PASS"
            echo "- Workflow route on Vercel: PASS"
            echo "- Vercel BFF backend reachability: PASS"
            echo "- Auth login + /auth/me through Vercel BFF: PASS"
            echo "- Workflow definitions/catalog entitlement enforcement/instances/monitoring/notifications through Vercel BFF: PASS"
            echo "- Side-effect-free validate/simulate POST through Vercel BFF: PASS"
            echo "- Production business-state mutation: NONE"
            echo "- Result: PASS"
          } >> "$GITHUB_STEP_SUMMARY"
