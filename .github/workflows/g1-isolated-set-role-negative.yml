name: G1 Isolated PostgreSQL SET ROLE Denial

on:
  pull_request:
    paths:
      - ".github/workflows/g1-isolated-set-role-negative.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-isolated-set-role-negative
  cancel-in-progress: false

jobs:
  isolated-postgres-negative-test:
    name: Prove restricted role cannot SET ROLE to elevated role
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install and start isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-client
          sudo service postgresql start
          hba_file="$(sudo -u postgres psql --no-psqlrc -Atqc 'SHOW hba_file')"
          sudo sed -i '1ihost postgres g1_restricted_probe 127.0.0.1/32 trust' "$hba_file"
          sudo service postgresql reload
          sudo -u postgres psql --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL'
          DO $version_check$
          BEGIN
            IF current_setting('server_version_num')::integer < 160000 THEN
              RAISE EXCEPTION 'PostgreSQL 16+ required for explicit role membership SET option';
            END IF;
          END
          $version_check$;
          CREATE ROLE g1_elevated_probe NOLOGIN CREATEDB NOCREATEROLE NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE g1_restricted_probe LOGIN
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT g1_elevated_probe TO g1_restricted_probe WITH INHERIT FALSE, SET FALSE;
          SQL

      - name: Assert membership cannot be used to assume elevated identity
        shell: bash
        run: |
          set -euo pipefail
          initial_role="$(psql --no-psqlrc -h 127.0.0.1 -U g1_restricted_probe -d postgres -Atqc 'SELECT current_user')"
          test "$initial_role" = 'g1_restricted_probe'
          set_option="$(sudo -u postgres psql --no-psqlrc -Atqc "SELECT set_option::text FROM pg_auth_members WHERE roleid='g1_elevated_probe'::regrole AND member='g1_restricted_probe'::regrole")"
          test "$set_option" = 'false'
          if output="$(psql --no-psqlrc -v VERBOSITY=verbose -h 127.0.0.1 -U g1_restricted_probe -d postgres -c 'SET ROLE g1_elevated_probe' 2>&1)"; then
            echo "::error::SECURITY FAILURE: restricted role assumed elevated role"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -q '42501' <<< "$output" || {
            echo "::error::SET ROLE failed for an unexpected reason; SQLSTATE 42501 was not observed"
            exit 1
          }
          final_role="$(psql --no-psqlrc -h 127.0.0.1 -U g1_restricted_probe -d postgres -Atqc 'SELECT current_user')"
          test "$final_role" = 'g1_restricted_probe'
          echo "ISOLATED_SET_ROLE_DENIAL_PASS"

      - name: Verify privileged attributes remain unavailable to restricted role
        shell: bash
        run: |
          set -euo pipefail
          sudo -u postgres psql --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align <<'SQL'
          DO $$
          DECLARE
            is_super boolean;
            can_create_db boolean;
            can_bypass_rls boolean;
          BEGIN
            SELECT rolsuper, rolcreatedb, rolbypassrls
              INTO is_super, can_create_db, can_bypass_rls
            FROM pg_roles WHERE rolname = 'g1_restricted_probe';

            IF is_super OR can_create_db OR can_bypass_rls THEN
              RAISE EXCEPTION 'Restricted role has a prohibited elevated attribute';
            END IF;
          END
          $$;
          SQL
          echo "ISOLATED_RESTRICTED_ROLE_ATTRIBUTES_PASS"
