# ============================================================
# SANAD Platform — Forensic Diagnostic (Read-Only)
# ============================================================
# Read-only forensic diagnostic to identify the actual
# production user and trace the RBAC query path.
# Does NOT modify any data.
# ============================================================

name: RBAC Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Production RBAC forensic diagnostic
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Run forensic diagnostic
        env:
          PSQL_URL: ${{ secrets.PROD_JDBC_URL }}
          PSQL_USER: ${{ secrets.PROD_DB_USER }}
          PSQL_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          JDBC_URL="$PSQL_URL"
          if [[ "$JDBC_URL" == jdbc:postgresql://* ]]; then
            JDBC_URL="${JDBC_URL#jdbc:}"
          fi
          export PGPASSWORD="$PSQL_PASSWORD"

          echo "════════════════════════════════════════════════════════════"
          echo "PHASE A: IDENTIFY ACTUAL PRODUCTION USER"
          echo "════════════════════════════════════════════════════════════"

          echo ""
          echo "--- A1: All active users ---"
          psql "$JDBC_URL" -U "$PSQL_USER" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT u.id || '|' || u.display_name || '|' || u.email || '|' || u.tenant_id || '|' || u.status || '|' || u.platform_admin FROM users u WHERE u.status = 'ACTIVE' ORDER BY u.created_at LIMIT 20"

          echo ""
          echo "--- A2: User memberships with role assignments ---"
          psql "$JDBC_URL" -U "$PSQL_USER" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT m.user_id || '|' || m.tenant_id || '|' || m.role_id || '|' || r.code || '|' || m.status FROM memberships m JOIN roles r ON r.id = m.role_id WHERE m.status = 'ACTIVE' ORDER BY m.created_at"

          echo ""
          echo "--- A3: Focus on 'Control Plane Admin' user ---"
          psql "$JDBC_URL" -U "$PSQL_USER" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT u.id || '|' || u.display_name || '|' || u.email || '|' || u.tenant_id || '|' || u.platform_admin || '|' || u.status FROM users u WHERE u.display_name ILIKE '%Control Plane%' OR u.display_name ILIKE '%SANAD%' OR u.email ILIKE '%admin%' ORDER BY u.created_at"

          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "PHASE B: TRACE ROLE → CAPABILITY FOR ACTUAL USER"
          echo "════════════════════════════════════════════════════════════"

          echo ""
          echo "--- B1: role_capabilities per role (tenant-scoped) ---"
          psql "$JDBC_URL" -U "$PSQL_USER" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT r.code || '|' || rc.tenant_id || '|' || COUNT(rc.id) || '|' || SUM(CASE WHEN ac.code LIKE 'CRM.%' THEN 1 ELSE 0 END) FROM role_capabilities rc JOIN roles r ON r.id = rc.role_id JOIN access_capabilities ac ON ac.id = rc.capability_id WHERE r.code != 'ADMIN' GROUP BY r.code, rc.tenant_id ORDER BY r.code, rc.tenant_id"

          echo ""
          echo "--- B2: ADMIN CRM capabilities (tenant-scoped) ---"
          psql "$JDBC_URL" -U "$PSQL_USER" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT rc.tenant_id || '|' || COUNT(rc.id) FROM role_capabilities rc JOIN roles r ON r.id = rc.role_id JOIN access_capabilities ac ON ac.id = rc.capability_id WHERE r.code = 'ADMIN' AND ac.code LIKE 'CRM.%' GROUP BY rc.tenant_id ORDER BY rc.tenant_id"

          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "PHASE C: VERIFY DATABASE IDENTIFIERS"
          echo "════════════════════════════════════════════════════════════"

          echo ""
          echo "--- C1: Table existence check ---"
          psql "$JDBC_URL" -U "$PSQL_USER" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('users', 'roles', 'memberships', 'role_capabilities', 'access_capabilities', 'tenants') ORDER BY table_name"

          echo ""
          echo "--- C2: role_capabilities columns ---"
          psql "$JDBC_URL" -U "$PSQL_USER" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT column_name || '|' || data_type || '|' || is_nullable FROM information_schema.columns WHERE table_name = 'role_capabilities' ORDER BY ordinal_position"

          echo ""
          echo "--- C3: roles columns ---"
          psql "$JDBC_URL" -U "$PSQL_USER" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT column_name || '|' || data_type || '|' || is_nullable FROM information_schema.columns WHERE table_name = 'roles' ORDER BY ordinal_position"

          echo ""
          echo "--- C4: memberships columns ---"
          psql "$JDBC_URL" -U "$PSQL_USER" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT column_name || '|' || data_type || '|' || is_nullable FROM information_schema.columns WHERE table_name = 'memberships' ORDER BY ordinal_position"

          echo ""
          echo "--- C5: tenants ---"
          psql "$JDBC_URL" -U "$PSQL_USER" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT id || '|' || code || '|' || name || '|' || status FROM tenants WHERE status = 'ACTIVE' LIMIT 5"

          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "PHASE D: 14 NAVIGATION CAPABILITIES EXISTENCE CHECK"
          echo "════════════════════════════════════════════════════════════"

          echo ""
          echo "--- D1: Navigation capabilities ---"
          psql "$JDBC_URL" -U "$PSQL_USER" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT ac.code || '|' || ac.status FROM access_capabilities ac WHERE ac.code IN ('CRM.ACCOUNT.READ', 'CRM.ACTIVITY.READ', 'CRM.ADMIN', 'CRM.CASE.READ', 'CRM.CONTACT.READ', 'CRM.CUSTOMER_INTELLIGENCE.READ', 'CRM.CUSTOM_FIELD.READ', 'CRM.IMPORT.READ', 'CRM.LEAD.READ', 'CRM.NOTE.READ', 'CRM.OPPORTUNITY.READ', 'CRM.REPORTS.READ', 'CRM.TAG.READ', 'CRM.TASK.READ') ORDER BY ac.code"

          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "PHASE E: NAV-RELEVANT CAPABILITY GRANTS PER ROLE"
          echo "════════════════════════════════════════════════════════════"

          echo ""
          echo "--- E1: ADMIN nav-relevant CRM caps ---"
          psql "$JDBC_URL" -U "$PSQL_USER" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT ac.code FROM role_capabilities rc JOIN roles r ON r.id = rc.role_id JOIN access_capabilities ac ON ac.id = rc.capability_id WHERE r.code = 'ADMIN' AND ac.code IN ('CRM.ACCOUNT.READ','CRM.ACTIVITY.READ','CRM.CASE.READ','CRM.CONTACT.READ','CRM.CUSTOMER_INTELLIGENCE.READ','CRM.CUSTOM_FIELD.READ','CRM.IMPORT.READ','CRM.LEAD.READ','CRM.NOTE.READ','CRM.OPPORTUNITY.READ','CRM.REPORTS.READ','CRM.TAG.READ','CRM.TASK.READ') ORDER BY ac.code"

          echo ""
          echo "--- E2: MEMBER nav-relevant CRM caps ---"
          psql "$JDBC_URL" -U "$PSQL_USER" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT ac.code FROM role_capabilities rc JOIN roles r ON r.id = rc.role_id JOIN access_capabilities ac ON ac.id = rc.capability_id WHERE r.code = 'MEMBER' AND ac.code IN ('CRM.ACCOUNT.READ','CRM.ACTIVITY.READ','CRM.CASE.READ','CRM.CONTACT.READ','CRM.CUSTOMER_INTELLIGENCE.READ','CRM.CUSTOM_FIELD.READ','CRM.IMPORT.READ','CRM.LEAD.READ','CRM.NOTE.READ','CRM.OPPORTUNITY.READ','CRM.REPORTS.READ','CRM.TAG.READ','CRM.TASK.READ') ORDER BY ac.code"

          echo ""
          echo "--- E3: SALES_REPRESENTATIVE nav-relevant CRM caps ---"
          psql "$JDBC_URL" -U "$PSQL_USER" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT ac.code FROM role_capabilities rc JOIN roles r ON r.id = rc.role_id JOIN access_capabilities ac ON ac.id = rc.capability_id WHERE r.code = 'SALES_REPRESENTATIVE' AND ac.code IN ('CRM.ACCOUNT.READ','CRM.ACTIVITY.READ','CRM.CASE.READ','CRM.CONTACT.READ','CRM.CUSTOMER_INTELLIGENCE.READ','CRM.CUSTOM_FIELD.READ','CRM.IMPORT.READ','CRM.LEAD.READ','CRM.NOTE.READ','CRM.OPPORTUNITY.READ','CRM.REPORTS.READ','CRM.TAG.READ','CRM.TASK.READ') ORDER BY ac.code"

          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "PHASE F: EXACT ROLE → CAPABILITY CHAIN FOR USER"
          echo "════════════════════════════════════════════════════════════"

          echo ""
          echo "--- F1: Complete chain for 'Control Plane' user ---"
          psql "$JDBC_URL" -U "$PSQL_USER" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT u.display_name || '|' || u.email || '|' || m.tenant_id || '|' || m.role_id || '|' || r.code || '|' || m.status || '|' || u.platform_admin FROM users u JOIN memberships m ON m.user_id = u.id AND m.tenant_id = u.tenant_id JOIN roles r ON r.id = m.role_id WHERE u.display_name ILIKE '%Control Plane%'"

          echo ""
          echo "--- F2: Capability codes for 'Control Plane' user's role (scoped to tenant) ---"
          psql "$JDBC_URL" -U "$PSQL_USER" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT DISTINCT ac.code || '|' || r.code FROM users u JOIN memberships m ON m.user_id = u.id AND m.tenant_id = u.tenant_id JOIN role_capabilities rc ON rc.role_id = m.role_id AND rc.tenant_id = m.tenant_id JOIN access_capabilities ac ON ac.id = rc.capability_id WHERE u.display_name ILIKE '%Control Plane%' AND ac.status = 'ACTIVE' ORDER BY ac.code"

          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "PHASE G: FLYWAY STATE"
          echo "════════════════════════════════════════════════════════════"

          echo ""
          echo "--- G1: Flyway history (last 10) ---"
          psql "$JDBC_URL" -U "$PSQL_USER" -X -v ON_ERROR_STOP=1 -At \
            -c "SELECT version || '|' || success || '|' || description FROM flyway_schema_history ORDER BY installed_rank DESC LIMIT 10"

          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "DIAGNOSTIC COMPLETE"
          echo "════════════════════════════════════════════════════════════"
