# ============================================================
# SNAD Platform — G3 Authenticated Acceptance (PostgreSQL Direct + Spring Boot + Next.js + Playwright)
# ------------------------------------------------------------
# Dedicated required G3 authenticated acceptance job. Provisions:
#   - host-native PostgreSQL 16 (no Docker, no Testcontainers)
#   - Spring Boot backend with the `local` profile
#   - G3 acceptance seed (tenant + Employee/Manager/Unauthorized users +
#     canonical Person -> Employment -> PRIMARY Assignment identity graph +
#     G3 RBAC capabilities + seeded performance goal)
#   - Next.js frontend
#   - E2E_<ROLE>_EMAIL/PASSWORD env vars for g3-authenticated.spec.ts
#
# Security model follows the G2 authenticated acceptance pattern:
#   - NO committed password literals. Both the PostgreSQL application role
#     password AND the G3 E2E user password are generated at runtime as
#     cryptographically random per-run values.
#   - The cleartext values are masked via `::add-mask::` and exported to
#     GITHUB_ENV so subsequent steps can use them without re-derivation.
#   - The seed SQL receives the G3 E2E password via psql variable binding
#     (`-v g3_e2e_password="$G3_E2E_PASSWORD"`) so the cleartext never
#     appears in SQL text either; the bcrypt hash is computed at runtime
#     via `crypt(:'g3_e2e_password', gen_salt('bf', 10))`.
#
# Missing credentials or failed provisioning FAILS this job (no test.skip,
# no Assumptions soft-skip, no continue-on-error).
# ============================================================
name: G3 Authenticated Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/hr/performance/**'
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/hr/api/v2/performance/**'
      - 'apps/sanad-platform/src/main/resources/**'
      - 'apps/sanad-platform/src/test/resources/sql/g3-acceptance-seed.sql'
      - 'apps/sanad-platform/pom.xml'
      - 'apps/web/app/hr/performance/**'
      - 'apps/web/e2e/g3-auth-session.ts'
      - 'apps/web/e2e/g3-authenticated.spec.ts'
      - 'apps/web/playwright-g3.config.ts'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - '.github/workflows/g3-authenticated-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/hr/performance/**'
      - 'apps/sanad-platform/src/main/resources/**'
      - 'apps/sanad-platform/src/test/resources/sql/g3-acceptance-seed.sql'
      - 'apps/web/app/hr/performance/**'
      - 'apps/web/e2e/g3-authenticated.spec.ts'
      - '.github/workflows/g3-authenticated-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g3-authenticated-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g3-authenticated-acceptance:
    name: G3 Authenticated Acceptance (PostgreSQL Direct + Spring Boot + Next.js + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/sanad_g3
      DATABASE_USERNAME: sanad_g3
      DATABASE_NAME: sanad_g3
      SPRING_PROFILES_ACTIVE: local
      SPRING_FLYWAY_OUT_OF_ORDER: 'true'
      FLYWAY_ENABLED: 'true'
      FLYWAY_BASELINE_ON_MIGRATE: 'true'
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      JPA_DDL_AUTO: validate
      SERVER_PORT: '8080'
      JWT_ISSUER: sanad-platform-ci
      JWT_ACCESS_TOKEN_TTL: 60m
      REFRESH_TOKEN_TTL: 720h
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
      BOOTSTRAP_ENABLED: 'false'
      SANAD_CORS_ALLOWED_ORIGINS: http://127.0.0.1:3001
      SECURITY_NOTIFICATION_PROVIDER: disabled
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
      BACKEND_API_BASE_URL: http://127.0.0.1:8080
      E2E_EMPLOYEE_EMAIL: g3-employee@g3-acceptance.example
      E2E_MANAGER_EMAIL: g3-manager@g3-acceptance.example
      E2E_UNAUTHORIZED_EMAIL: g3-unauthorized@g3-acceptance.example
    defaults:
      run:
        working-directory: apps/sanad-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start host-native PostgreSQL
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1
          sudo systemctl start postgresql
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432

      - name: Provision least-privilege application role and isolated database
        run: |
          set -euo pipefail
          DB_APP_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$DB_APP_PASSWORD"
          echo "DATABASE_PASSWORD=$DB_APP_PASSWORD" >> "$GITHUB_ENV"

          sudo -u postgres psql -v ON_ERROR_STOP=1 <<SQL
          DO \$\$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad_g3') THEN
              CREATE ROLE sanad_g3 WITH LOGIN PASSWORD '${DB_APP_PASSWORD}';
            END IF;
          END \$\$;
          ALTER ROLE sanad_g3 NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;

          SELECT 'CREATE DATABASE sanad_g3 OWNER sanad_g3'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'sanad_g3')\gexec
          ALTER DATABASE sanad_g3 OWNER TO sanad_g3;
          GRANT CONNECT ON DATABASE postgres TO sanad_g3;
          SQL

          \c sanad_g3
          GRANT USAGE, CREATE ON SCHEMA public TO sanad_g3;

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build backend JAR
        run: |
          set -euo pipefail
          mvn -B -ntp -DskipTests clean package

      - name: Apply Flyway migrations
        run: |
          set -euo pipefail
          mvn -B -ntp flyway:migrate \
            -Dflyway.url="${DATABASE_URL}" \
            -Dflyway.user="${DATABASE_USERNAME}" \
            -Dflyway.password="${DATABASE_PASSWORD}" \
            -Dflyway.locations=classpath:db/migration,classpath:db/vendor/postgresql \
            -Dflyway.baselineOnMigrate=true \
            -Dflyway.outOfOrder=true \
            -Dflyway.validateOnMigrate=false

      - name: Generate ephemeral G3 E2E password
        run: |
          set -euo pipefail
          G3_E2E_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$G3_E2E_PASSWORD"
          echo "G3_E2E_PASSWORD=$G3_E2E_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_EMPLOYEE_PASSWORD=$G3_E2E_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_MANAGER_PASSWORD=$G3_E2E_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_UNAUTHORIZED_PASSWORD=$G3_E2E_PASSWORD" >> "$GITHUB_ENV"

      - name: Execute G3 acceptance seed
        run: |
          set -euo pipefail
          PGPASSWORD="${DATABASE_PASSWORD}" psql \
            -h 127.0.0.1 -U "${DATABASE_USERNAME}" -d "${DATABASE_NAME}" \
            -v g3_e2e_password="${G3_E2E_PASSWORD}" \
            -v ON_ERROR_STOP=1 \
            -f src/test/resources/sql/g3-acceptance-seed.sql

      - name: Start Spring Boot backend
        run: |
          set -euo pipefail
          nohup java -jar target/*.jar \
            --spring.datasource.url="${DATABASE_URL}" \
            --spring.datasource.username="${DATABASE_USERNAME}" \
            --spring.datasource.password="${DATABASE_PASSWORD}" \
            --spring.profiles.active=local \
            --server.port=8080 \
            --flyway.enabled=false \
            > backend.log 2>&1 &
          echo "Backend PID: $!"
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then
              echo "Backend is UP"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/actuator/health || { echo "::error::Backend failed to start"; tail -100 backend.log; exit 1; }

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Build Next.js frontend
        working-directory: apps/web
        run: npm run build

      - name: Start Next.js frontend
        working-directory: apps/web
        run: |
          set -euo pipefail
          PORT=3001 nohup npm start > frontend.log 2>&1 &
          echo "Frontend PID: $!"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001 >/dev/null 2>&1; then
              echo "Frontend is UP"
              break
            fi
            sleep 2
          done

      - name: Verify Playwright routing
        working-directory: apps/web
        run: |
          set -euo pipefail
          echo "=== Generic config should show 0 G3 specs ==="
          GENERIC_COUNT=$(npx playwright test --config=playwright.standard.config.ts --list 2>/dev/null | grep -c "g3-authenticated" || echo "0")
          echo "GENERIC_G3_SPEC_COUNT=$GENERIC_COUNT"
          if [ "$GENERIC_COUNT" != "0" ]; then
            echo "::error::G3 spec found in generic config — must be excluded"
            exit 1
          fi
          echo "=== Dedicated config should show >=1 G3 spec ==="
          DEDICATED_COUNT=$(npx playwright test --config=playwright-g3.config.ts --list 2>/dev/null | grep -c "g3-authenticated" || echo "0")
          echo "DEDICATED_G3_SPEC_COUNT=$DEDICATED_COUNT"
          if [ "$DEDICATED_COUNT" = "0" ]; then
            echo "::error::G3 spec not found in dedicated config"
            exit 1
          fi

      - name: Run G3 authenticated acceptance
        working-directory: apps/web
        run: |
          set -euo pipefail
          npx playwright test --config=playwright-g3.config.ts

      - name: Upload artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3-authenticated-acceptance
          path: |
            apps/web/playwright-g3-report/
            apps/web/test-results/
            apps/sanad-platform/backend.log
            apps/web/frontend.log
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          set +e
          pkill -f "java -jar.*sanad" 2>/dev/null || true
          pkill -f "next start" 2>/dev/null || true
