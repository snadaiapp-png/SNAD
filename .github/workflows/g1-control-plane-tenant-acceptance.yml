# G1 P0 regression tests for the Control Plane tenant gate psql parsing
# (production release incident 43189957654); synthetic fixtures only.
name: G1 Control Plane Tenant Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/production/verify-control-plane-tenant.sh
      - scripts/production/tests/verify-control-plane-tenant.test.sh
      - scripts/production/tests/pg17-control-plane-tenant-acceptance.sh
      - .github/workflows/production-release.yml
      - .github/workflows/users-production-release.yml
      - .github/workflows/render-production-preflight.yml
      - .github/workflows/g1-control-plane-tenant-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g1-cp-tenant-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synthetic-parse:
    name: Fail-closed SET+SELECT parse regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static contract and stub harness
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production/verify-control-plane-tenant.sh
          bash -n scripts/production/tests/verify-control-plane-tenant.test.sh
          bash scripts/production/tests/verify-control-plane-tenant.test.sh
      - name: Record scope limits
        if: always()
        shell: bash
        run: |
          {
            echo '## G1 Control Plane tenant acceptance'
            echo "- SHA: $GITHUB_SHA"
            echo '- Stub psql/curl only; no production DB, Render or Supabase access'
            echo '- No credential material beyond ephemeral synthetic values'
          } >> "$GITHUB_STEP_SUMMARY"

  postgres17-real:
    name: Isolated PG17 real psql, RLS and fail-closed proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      G1_DISPOSABLE_PG17: "1"
      PGHOST: "127.0.0.1"
      PGPORT: "5432"
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install disposable host-native PostgreSQL 17 without Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop postgresql 2>/dev/null || true
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-17 postgresql-client-17
          sudo pg_dropcluster 16 main --stop 2>/dev/null || true
          sudo pg_dropcluster 17 main --stop 2>/dev/null || true
          sudo pg_createcluster 17 main --start
          sudo pg_lsclusters
          sudo -u postgres psql -X -At -d postgres -c "SHOW server_version;"
      - name: Run actual PostgreSQL 17 tenant-gate acceptance with synthetic objects
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/production/tests/pg17-control-plane-tenant-acceptance.sh
          bash scripts/production/tests/pg17-control-plane-tenant-acceptance.sh
      - name: Record safe evidence scope
        if: always()
        shell: bash
        run: |
          {
            echo "## Isolated PostgreSQL 17 real psql/RLS tests"
            echo "- Source: $GITHUB_SHA"
            echo "- Host-native PostgreSQL 17, disposable runner, synthetic tables/roles"
            echo "- No Supabase/Render/Vercel production credentials or network access"
            echo "- This is NOT a production database, CAB approval or G1 certificate"
          } >> "$GITHUB_STEP_SUMMARY"
