name: Stage 30 P0 Database Runtime Identity Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage30-p0-database-identity
  cancel-in-progress: false

jobs:
  identity:
    name: Protected DB identity and CRM RLS configuration
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Verify production-secret identity (read-only; fail closed)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.PRODUCTION_DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for v in DATABASE_URL DATABASE_USERNAME DATABASE_PASSWORD; do
            if [ -z "${!v:-}" ]; then echo "::error::Missing required secret $v"; exit 1; fi
            echo "::add-mask::${!v}"
          done
          python3 - <<'PY'
          import os, urllib.parse, pathlib, shlex
          raw = os.environ['DATABASE_URL']
          if not raw.startswith('jdbc:postgresql://'):
              raise SystemExit('::error::PRODUCTION_DATABASE_URL must be JDBC PostgreSQL URL')
          u = urllib.parse.urlsplit(raw[5:])
          if not u.hostname or not u.path or not u.path.strip('/'):
              raise SystemExit('::error::Database host or name missing')
          query = urllib.parse.parse_qs(u.query)
          if query.get('user') or query.get('password'):
              raise SystemExit('::error::Database URL must not override explicit credentials')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'stage30-db-connection.env'
          fields = {'PGHOST':u.hostname, 'PGPORT':str(u.port or 5432),
                    'PGDATABASE':u.path.lstrip('/'), 'PGSSLMODE':'require'}
          out.write_text(''.join(f'export {key}={shlex.quote(value)}\n' for key,value in fields.items()), encoding='utf-8')
          out.chmod(0o600)
          PY
          conn_env="$RUNNER_TEMP/stage30-db-connection.env"
          trap 'rm -f "$conn_env"' EXIT
          source "$conn_env"
          export PGUSER="$DATABASE_USERNAME" PGPASSWORD="$DATABASE_PASSWORD"
          if ! actual_role="$(psql --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align -c 'SELECT current_user')"; then
            echo "::error::Production database connection failed"; exit 1
          fi
          if [ "$actual_role" != "$DATABASE_USERNAME" ]; then
            echo "::notice::Pooler login differs from effective role; verifying strict application role"
          fi
          # Fail before policy inspection if the authenticated session maps to an
          # owner/admin account. A pooler login may be "sanad.<project-ref>",
          # but the effective current_user MUST be the restricted role "sanad".
          if [ "$actual_role" != "sanad" ]; then
            echo "::error::Protected connection does not map to the approved restricted application role (sanad). Correct GitHub Production credentials and independently verify Render runtime identity; never weaken RLS."
            exit 1
          fi
          psql --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align <<'SQL'
          DO $$
          DECLARE u text := current_user; bypass boolean; privileged boolean; owner_role text;
          BEGIN
            SELECT rolbypassrls, rolsuper INTO bypass, privileged FROM pg_roles WHERE rolname = u;
            SELECT pg_get_userbyid(relowner) INTO owner_role FROM pg_class
              WHERE oid='public.crm_accounts'::regclass;
            -- Sanitized classification only: no DB URL, password or login identifier.
            RAISE NOTICE 'P0 role class: sanad=%, postgres=%, owner=%, bypass=%, superuser=%',
              (u = 'sanad'), (u = 'postgres'), (u = owner_role),
              COALESCE(bypass, true), COALESCE(privileged, true);
            IF u <> 'sanad' THEN
              RAISE EXCEPTION 'Unexpected effective role: approved application role required';
            END IF;
            IF bypass IS DISTINCT FROM FALSE OR privileged IS DISTINCT FROM FALSE
               OR owner_role IS NULL OR u = owner_role THEN
              RAISE EXCEPTION 'CRM RLS ineffective for configured runtime role (owner/bypass/superuser/unknown)';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_class WHERE oid='public.crm_accounts'::regclass AND relrowsecurity) THEN
              RAISE EXCEPTION 'crm_accounts row security is not enabled';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_policies
              WHERE schemaname='public' AND tablename='crm_accounts'
                AND policyname='tenant_isolation'
                AND qual LIKE '%current_setting%'
                AND with_check LIKE '%current_setting%'
            ) THEN
              RAISE EXCEPTION 'crm_accounts strict USING/WITH CHECK policy missing';
            END IF;
          END $$;
          SELECT 'RUNTIME_ROLE_RLS_GATE_PASS' AS result;
          SQL
          echo "Protected database role and CRM RLS configuration checks passed."
