name: SCP Final Identity Reconcile (One-Time)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scp-final-identity-reconcile-once.yml"

permissions:
  contents: read

concurrency:
  group: scp-final-identity-reconcile-once
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile production Control Plane identity
    if: contains(github.event.head_commit.message, '[scp-final-reconcile-once]')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      EXPECTED_PARENT_SHA: 15b1b08a398af667c3a5d45f139ba0177c9dd9f9
      IMAGE_REF: ghcr.io/snadaiapp-png/snad-backend:5bc39e17626ca3484bb2cb7a147c9322a6fa32dd
      MODE: reconcile
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      DATABASE_USERNAME: ${{ secrets.PROD_DB_USER }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
      CONTROL_PLANE_ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
      CONTROL_PLANE_ADMIN_PASSWORD: ${{ secrets.CONTROL_PLANE_ADMIN_PASSWORD }}
      CONTROL_PLANE_BOOTSTRAP_TOKEN: ${{ secrets.CONTROL_PLANE_BOOTSTRAP_TOKEN }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce one-time exact-parent lock
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          remote_main="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$GITHUB_SHA" || {
            echo "::error::MAIN_DRIFT expected=$GITHUB_SHA actual=$remote_main"
            exit 1
          }
          parent="$(git rev-parse HEAD^)"
          test "$parent" = "$EXPECTED_PARENT_SHA" || {
            echo "::error::ONE_TIME_PARENT_GUARD expected=$EXPECTED_PARENT_SHA actual=$parent"
            exit 1
          }
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/scp-final-identity-reconcile-once.yml" || {
            echo "::error::One-time reconcile merge contains unexpected files"
            printf '%s\n' "$changed"
            exit 1
          }
          echo "One-time reconcile authorized on exact protected main lineage."

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Execute canonical surgical reconcile
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/production/scp-smoke-identity-reconcile.sh reconcile

      - name: Record closure handoff
        if: success()
        run: |
          echo "SCP_IDENTITY_RECONCILE=PASS"
          echo "Bootstrap disabled and steady-state protected Executive access re-verified."
