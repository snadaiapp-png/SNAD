name: TEMP CRM Runtime OpenAPI Extraction

on:
  push:
    branches:
      - remediation/final-full-corrective-closure
    paths:
      - '.github/workflows/crm-openapi-extract-temp.yml'

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanad_contract
          POSTGRES_PASSWORD: sanad_contract_pass
          POSTGRES_DB: sanad_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanad_contract -d sanad_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      JWT_SECRET: ci-only-non-production-validation-key-1234567890
      SANAD_SERVICE_AUTH_JWT_SECRET: ci-only-non-production-jwt-secret-key-32-chars-min
      SANAD_WORKFLOW_ENGINE_BASE_URL: http://localhost:8081
      SANAD_AI_GATEWAY_BASE_URL: http://localhost:8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad_contract
      SPRING_DATASOURCE_USERNAME: sanad_contract
      SPRING_DATASOURCE_PASSWORD: sanad_contract_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_FLYWAY_OUT_OF_ORDER: 'true'
      FLYWAY_ENABLED: 'true'
      JPA_DDL_AUTO: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start backend
        working-directory: apps/sanad-platform
        run: |
          set -euo pipefail
          nohup mvn -q -DskipTests spring-boot:run -Dspring-boot.run.profiles=local -Dspring-boot.run.arguments="--server.port=8081 --management.endpoints.web.exposure.include=health" >/tmp/crm-openapi-backend.log 2>&1 &
          echo $! >/tmp/crm-openapi-backend.pid
      - name: Fetch runtime OpenAPI
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            if ! kill -0 "$(cat /tmp/crm-openapi-backend.pid)" 2>/dev/null; then cat /tmp/crm-openapi-backend.log; exit 1; fi
            code="$(curl -sS -o /tmp/platform-openapi.json -w '%{http_code}' http://localhost:8081/v3/api-docs || true)"
            if [ "$code" = '200' ] && [ -s /tmp/platform-openapi.json ]; then break; fi
            sleep 2
          done
          test -s /tmp/platform-openapi.json
      - name: Filter CRM OpenAPI
        run: |
          python3 scripts/crm/filter-runtime-openapi.py \
            --input /tmp/platform-openapi.json \
            --output /tmp/crm-openapi.runtime.json \
            --prefix /api/v2/crm \
            --expected-paths 152 \
            --expected-operations 198
      - name: Stage artifact
        run: |
          mkdir -p artifacts/crm-openapi
          cp /tmp/crm-openapi.runtime.json artifacts/crm-openapi/crm-openapi.runtime.json
      - uses: actions/upload-artifact@v4
        with:
          name: temp-crm-runtime-openapi
          path: artifacts/crm-openapi/crm-openapi.runtime.json
          retention-days: 1
      - name: Stop backend
        if: always()
        run: if [ -f /tmp/crm-openapi-backend.pid ]; then kill "$(cat /tmp/crm-openapi-backend.pid)" 2>/dev/null || true; fi
