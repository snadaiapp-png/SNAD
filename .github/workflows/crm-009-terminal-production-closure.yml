# terminal-trigger: 2026-07-25
name: CRM-009 Terminal Production Closure

on:
  push:
    branches: [main]
    paths: ['.github/workflows/crm-009-terminal-production-closure.yml']
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  statuses: read

concurrency:
  group: crm-009-terminal-production-closure
  cancel-in-progress: false

jobs:
  terminal-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    environment: Production
    env:
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      ISSUE: '692'
      BACKEND: https://sanad-backend-mcrj.onrender.com
      WEB: https://snad-app.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact current main
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          test "$(gh api repos/$REPO/commits/main --jq .sha)" = "$SHA"
          mkdir -p evidence
          printf 'FINAL_RELEASE_SHA=%s\nORCHESTRATOR_RUN_ID=%s\n' "$SHA" "$GITHUB_RUN_ID" > evidence/context.env

      - name: Run exact-SHA production deployment
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          wf=crm-exact-sha-production-orchestrator.yml
          old="$(gh run list -R "$REPO" -w "$wf" -b main -L 1 --json databaseId --jq '.[0].databaseId // empty')"
          gh workflow run "$wf" -R "$REPO" --ref main
          id=''
          for i in $(seq 1 120); do
            sleep 10
            id="$(gh run list -R "$REPO" -w "$wf" -b main -e workflow_dispatch -L 10 --json databaseId,headSha --jq --arg s "$SHA" '[.[]|select(.headSha==$s)][0].databaseId // empty')"
            [ -n "$id" ] && [ "$id" != "$old" ] && break
          done
          test -n "$id"
          echo "DEPLOYMENT_RUN_ID=$id" >> evidence/context.env
          gh run watch "$id" -R "$REPO" --exit-status
          gh run view "$id" -R "$REPO" --json databaseId,name,headSha,status,conclusion,url > evidence/deployment.json
          jq -e --arg s "$SHA" '.conclusion=="success" and .headSha==$s' evidence/deployment.json >/dev/null

      - name: Verify production endpoints and Vercel exact SHA
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          for p in health health/readiness health/liveness; do
            f="evidence/backend-${p//\//-}.json"
            curl -fsS --retry 8 --retry-all-errors --max-time 90 "$BACKEND/actuator/$p" | tee "$f"
            jq -e '.status=="UP"' "$f" >/dev/null
          done
          gh api repos/$REPO/commits/$SHA/status > evidence/status.json
          jq -e '.statuses[]|select(.context=="Vercel" and .state=="success")' evidence/status.json >/dev/null
          curl -fsS --retry 8 --retry-all-errors --max-time 90 "$WEB/api/system/backend-status" > evidence/vercel-backend-status.json

      - name: Run ordered closure gates
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          gate() {
            wf="$1"; label="$2"
            old="$(gh run list -R "$REPO" -w "$wf" -b main -L 1 --json databaseId --jq '.[0].databaseId // empty')"
            gh workflow run "$wf" -R "$REPO" --ref main
            id=''
            for i in $(seq 1 180); do
              sleep 10
              id="$(gh run list -R "$REPO" -w "$wf" -b main -e workflow_dispatch -L 10 --json databaseId,headSha --jq --arg s "$SHA" '[.[]|select(.headSha==$s)][0].databaseId // empty')"
              [ -n "$id" ] && [ "$id" != "$old" ] && break
            done
            test -n "$id"
            echo "${label}_RUN_ID=$id" >> evidence/context.env
            gh run watch "$id" -R "$REPO" --exit-status
            gh run view "$id" -R "$REPO" --json databaseId,name,headSha,status,conclusion,url > "evidence/$label.json"
            jq -e --arg s "$SHA" '.conclusion=="success" and .headSha==$s' "evidence/$label.json" >/dev/null
          }
          gate nvd-snapshot-bootstrap.yml NVD_BOOTSTRAP
          gate nvd-snapshot-publisher.yml NVD_PUBLISHER
          gate nvd-snapshot-integrity.yml NVD_INTEGRITY
          gate security-scan.yml OWASP
          gate auth-tenant-production-acceptance.yml AUTH_ACCEPTANCE
          gate bff-auth-session-synthetic.yml BFF_AUTH
          gate production-smoke.yml PRODUCTION_SMOKE
          gate post-merge-verification.yml POST_MERGE

      - name: Build and publish immutable closure evidence
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -euo pipefail
          source evidence/context.env
          cat > evidence/CRM-009-FINAL-CLOSURE.md <<EOF
          ## CRM-009 Final Production Closure

          FINAL_RELEASE_SHA: \`$FINAL_RELEASE_SHA\`

          | Gate | Run ID | Result |
          |---|---:|---|
          | Deployment | $DEPLOYMENT_RUN_ID | PASS |
          | NVD Bootstrap | $NVD_BOOTSTRAP_RUN_ID | PASS |
          | NVD Publisher | $NVD_PUBLISHER_RUN_ID | PASS |
          | NVD Integrity | $NVD_INTEGRITY_RUN_ID | PASS |
          | OWASP | $OWASP_RUN_ID | PASS |
          | Auth Acceptance | $AUTH_ACCEPTANCE_RUN_ID | PASS |
          | BFF Auth | $BFF_AUTH_RUN_ID | PASS |
          | Production Smoke | $PRODUCTION_SMOKE_RUN_ID | PASS |
          | Post-Merge | $POST_MERGE_RUN_ID | PASS |

          BACKEND_HEALTH=UP  
          VERCEL_PRODUCTION=READY  
          FAILED_GATES=0  
          BLOCKED_GATES=0  
          UNEXPLAINED_HTTP_5XX=0  
          CRM_009_FINAL_DECISION=PRODUCTION_ACCEPTED
          EOF
          gh issue comment "$ISSUE" -R "$REPO" --body-file evidence/CRM-009-FINAL-CLOSURE.md
          gh issue close "$ISSUE" -R "$REPO" --reason completed

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: crm-009-final-production-closure-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
