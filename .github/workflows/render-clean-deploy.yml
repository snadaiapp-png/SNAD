name: Render Clean Deploy (Fresh Build)

# After successful Flyway migration from GitHub Actions:
#   1. Set FLYWAY_ENABLED=false (migrations are now CI responsibility)
#   2. Set JPA_DDL_AUTO=validate (Hibernate validates schema)
#   3. Clean DATABASE_URL (remove sslfactory, sslfactoryarg, ssl=true)
#   4. Clean SPRING_FLYWAY_URL (remove it — not needed with FLYWAY_ENABLED=false)
#   5. Verify DATABASE_USERNAME = postgres.tkbrvupemreqabwzdpyq
#   6. Suspend + Update + Resume + Deploy + Capture logs + Health

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-deploy:
    name: Clean Render config + deploy
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 25
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Clean config + deploy + capture
        env:
          BACKEND_URL: https://sanad-backend-mcrj.onrender.com
          POOLER_HOST: aws-0-eu-central-1.pooler.supabase.com
          PROJECT_REF: tkbrvupemreqabwzdpyq
          DB_PASSWORD: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
        run: |
          set +e
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          BASE="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"
          
          # Clean JDBC URL — no SNI factory, no ssl=true, just sslmode=require
          CLEAN_URL="jdbc:postgresql://${POOLER_HOST}:5432/postgres?prepareThreshold=0&sslmode=require"
          POOLER_USERNAME="postgres.${PROJECT_REF}"

          echo "========================================"
          echo "CLEAN RENDER DEPLOY (Fresh Build)"
          echo "========================================"
          echo "DATABASE_URL: $CLEAN_URL"
          echo "DATABASE_USERNAME: $POOLER_USERNAME"
          echo "FLYWAY_ENABLED: false (migrations applied via GitHub Actions)"
          echo "JPA_DDL_AUTO: validate"
          echo ""

          # ===== STEP 1: Suspend =====
          echo "=== STEP 1: Suspend ==="
          HTTP=$(curl -s -o /tmp/s.json -w "%{http_code}" --max-time 30 -X POST -H "$AUTH" "$BASE/suspend")
          echo "POST /suspend -> HTTP $HTTP"
          sleep 15
          echo ""

          # ===== STEP 2: Clean all DB env vars =====
          echo "=== STEP 2: Update env vars (clean baseline) ==="
          
          put_env() {
            local key="$1" val="$2"
            HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" --max-time 45 -X PUT \
              -H "$AUTH" -H 'Accept: application/json' -H 'Content-Type: application/json' \
              --data "$(jq -n --arg v "$val" '{value:$v}')" "$BASE/env-vars/$key")
            echo "  PUT $key -> HTTP $HTTP"
          }

          # Clean DATABASE_URL (no SNI, no ssl=true)
          put_env "DATABASE_URL" "$CLEAN_URL"
          
          # Clean SPRING_FLYWAY_URL — set to same as DATABASE_URL (harmless when FLYWAY_ENABLED=false)
          put_env "SPRING_FLYWAY_URL" "$CLEAN_URL"
          
          # DATABASE_USERNAME — correct project ref
          put_env "DATABASE_USERNAME" "$POOLER_USERNAME"
          
          # DATABASE_PASSWORD — ensure it's set
          put_env "DATABASE_PASSWORD" "$DB_PASSWORD"
          
          # FLYWAY_ENABLED=false — migrations done via CI
          put_env "FLYWAY_ENABLED" "false"
          
          # JPA_DDL_AUTO=validate — Hibernate validates existing schema
          put_env "JPA_DDL_AUTO" "validate"
          
          # BOOTSTRAP_ENABLED=false — no bootstrap needed for fresh build
          put_env "BOOTSTRAP_ENABLED" "false"
          
          # Production guard enabled
          put_env "SANAD_PRODUCTION_GUARD_ENABLED" "true"
          
          # Lazy init — helps with startup speed
          put_env "LAZY_INIT" "true"
          echo ""

          # ===== STEP 3: Resume =====
          echo "=== STEP 3: Resume ==="
          HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" --max-time 30 -X POST -H "$AUTH" "$BASE/resume")
          echo "POST /resume -> HTTP $HTTP"
          sleep 5
          echo ""

          # ===== STEP 4: Trigger deploy =====
          echo "=== STEP 4: Trigger deploy ==="
          HTTP=$(curl -s -o /tmp/d.json -w "%{http_code}" --max-time 30 -X POST \
            -H "$AUTH" -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data '{"clearCache":"do_not_clear"}' "$BASE/deploys")
          DEPLOY_ID=$(jq -r '.id // empty' /tmp/d.json)
          echo "POST /deploys -> HTTP $HTTP, Deploy ID: $DEPLOY_ID"
          echo ""

          # ===== STEP 5: Capture live logs + monitor deploy =====
          echo "=== STEP 5: Capture live logs ==="
          OWNER_ID=$(curl -s --max-time 30 -H "$AUTH" "$BASE" | jq -r '.ownerId // .owner // empty')
          START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p /tmp/live-logs
          > /tmp/live-logs/all.txt

          DEPLOY_STATUS="update_in_progress"
          ITERATION=0
          MAX_ITERATIONS=100

          while [ "$DEPLOY_STATUS" = "update_in_progress" ] && [ "$ITERATION" -lt "$MAX_ITERATIONS" ]; do
            ITERATION=$((ITERATION + 1))
            sleep 10

            DEPLOY_STATUS=$(curl -s --max-time 15 -H "$AUTH" "$BASE/deploys/$DEPLOY_ID" | jq -r '.deploy.status // .status // "unknown"')
            echo "[iter $ITERATION ($((ITERATION*10))s)] deploy: $DEPLOY_STATUS"

            if [ -n "$OWNER_ID" ]; then
              URL="https://api.render.com/v1/logs?ownerId=${OWNER_ID}&resource=${RENDER_SERVICE_ID}&startTime=${START_TIME}&direction=forward&limit=200"
              curl -s --max-time 15 -H "$AUTH" "$URL" > /tmp/live-logs/page.json
              jq -r 'if type=="array" then .[] elif .logs then .logs[] elif .lines then .lines[] else empty end | (if type=="object" then (.text // .message // .msg // (. | tostring)) else (tostring) end)' /tmp/live-logs/page.json 2>/dev/null >> /tmp/live-logs/all.txt
            fi

            if [ "$DEPLOY_STATUS" = "live" ]; then
              echo "::notice::DEPLOY LIVE after $((ITERATION*10))s"
              break
            fi
            if echo "$DEPLOY_STATUS" | grep -qiE 'failed|canceled|deactivated'; then
              echo "::error::Deploy terminal: $DEPLOY_STATUS"
              break
            fi
          done
          echo ""

          # ===== STEP 6: Final logs =====
          echo "=== STEP 6: FINAL LOG DUMP (last 40 lines) ==="
          tail -40 /tmp/live-logs/all.txt
          echo ""

          # ===== STEP 7: Error pattern search =====
          echo "=== STEP 7: ERROR PATTERN SEARCH ==="
          echo "ENOIDENTIFIER: $(grep -c 'ENOIDENTIFIER' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "PKIX: $(grep -c 'PKIX\|SunCertPathBuilderException' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "UnknownHostException: $(grep -c 'UnknownHostException' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "password auth failed: $(grep -ci 'password.*failed\|authentication failed' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "BeanCreationException: $(grep -c 'BeanCreationException' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "ProductionGuard: $(grep -c 'ProductionWorkflowStubGuard\|Production startup refused' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "Application run failed: $(grep -c 'Application run failed' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "Started SanadPlatformApplication: $(grep -c 'Started SanadPlatformApplication' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "Tomcat started: $(grep -c 'Tomcat started on port' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "Hibernate validate: $(grep -c 'HHH.*schema\|schema.*validate\|Schema.*validated' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo "Hikari connected: $(grep -c 'HikariPool.*Start completed\|HikariPool-1.*Start completed' /tmp/live-logs/all.txt 2>/dev/null || echo 0)"
          echo ""

          # ===== STEP 8: Health probe =====
          echo "=== STEP 8: Health probe ==="
          sleep 10
          HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 "$BACKEND_URL/actuator/health" || echo "000")
          HEALTH_STATUS=$(jq -r '.status // "unknown"' /tmp/health.json 2>/dev/null || echo "unknown")
          echo "HEALTH_HTTP: $HTTP_CODE"
          echo "HEALTH_STATUS: $HEALTH_STATUS"
          
          LIVENESS_HTTP=$(curl -s -o /tmp/liv.json -w "%{http_code}" --max-time 15 "$BACKEND_URL/actuator/health/liveness" || echo "000")
          LIVENESS_STATUS=$(jq -r '.status // "unknown"' /tmp/liv.json 2>/dev/null || echo "unknown")
          echo "LIVENESS_HTTP: $LIVENESS_HTTP"
          echo "LIVENESS_STATUS: $LIVENESS_STATUS"
          
          READINESS_HTTP=$(curl -s -o /tmp/rdy.json -w "%{http_code}" --max-time 15 "$BACKEND_URL/actuator/health/readiness" || echo "000")
          READINESS_STATUS=$(jq -r '.status // "unknown"' /tmp/rdy.json 2>/dev/null || echo "unknown")
          echo "READINESS_HTTP: $READINESS_HTTP"
          echo "READINESS_STATUS: $READINESS_STATUS"
          echo ""

          # ===== FINAL SUMMARY =====
          echo "========================================"
          echo "CLEAN DEPLOY COMPLETE"
          echo "========================================"
          echo "DEPLOY_ID=$DEPLOY_ID"
          echo "DEPLOY_STATUS=$DEPLOY_STATUS"
          echo "HEALTH_HTTP=$HTTP_CODE"
          echo "HEALTH_STATUS=$HEALTH_STATUS"
          echo "LIVENESS_HTTP=$LIVENESS_HTTP"
          echo "LIVENESS_STATUS=$LIVENESS_STATUS"
          echo "READINESS_HTTP=$READINESS_HTTP"
          echo "READINESS_STATUS=$READINESS_STATUS"
          if [ "$DEPLOY_STATUS" = "live" ] && [ "$HTTP_CODE" = "200" ] && [ "$HEALTH_STATUS" = "UP" ]; then
            echo "FINAL_RESULT=SUCCESS ✅✅✅"
          elif [ "$DEPLOY_STATUS" = "live" ]; then
            echo "FINAL_RESULT=PARTIAL (live but health not UP)"
          else
            echo "FINAL_RESULT=FAILED — investigate next-error"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-deploy-logs
          path: /tmp/live-logs/
          if-no-files-found: warn
          retention-days: 30
