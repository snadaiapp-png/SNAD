name: HRM G4 T5 Payroll Lifecycle

on:
  pull_request:
    paths:
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/hr/payroll/**'
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/hr/idempotency/JdbcHrRequestIdempotencyService.java'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/hr/payroll/PayrollLifecycleTest.java'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/hr/payroll/PayrollLifecyclePostgresTest.java'
      - '.github/workflows/hrm-g4-t5-payroll-lifecycle.yml'
  workflow_dispatch:

jobs:
  focused-lifecycle:
    runs-on: ubuntu-latest
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sanad
      SPRING_DATASOURCE_USERNAME: sanad
    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral PostgreSQL Direct credential
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          test -n "$password"
          echo "::add-mask::$password"
          echo "SPRING_DATASOURCE_PASSWORD=$password" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install PostgreSQL client and server
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          sudo systemctl start postgresql

      - name: Provision PostgreSQL Direct database
        shell: bash
        run: |
          set -euo pipefail
          : "${SPRING_DATASOURCE_PASSWORD:?ephemeral PostgreSQL password missing}"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -v sanad_password="$SPRING_DATASOURCE_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE sanad WITH LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS', :'sanad_password')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad')\gexec
          ALTER ROLE sanad WITH LOGIN PASSWORD :'sanad_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;

          -- P0 V20261111_1 (service_callback_replay RLS closure): the chain
          -- requires the dedicated expired-row cleanup role cluster-wide, with a
          -- NON-INHERITING (SET-only) membership for the runtime identity — the
          -- scheduled sweep switches to it inside its own transaction, but the
          -- runtime must never inherit its cross-tenant expired-row visibility.
          SELECT 'CREATE ROLE sanad_callback_replay_cleanup NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad_callback_replay_cleanup')\gexec
          ALTER ROLE sanad_callback_replay_cleanup NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_auth_members m
                             JOIN pg_roles g ON g.oid = m.roleid
                             JOIN pg_roles r ON r.oid = m.member
                            WHERE g.rolname = 'sanad_callback_replay_cleanup'
                              AND r.rolname = 'sanad') THEN
              GRANT sanad_callback_replay_cleanup TO sanad WITH INHERIT FALSE;
            END IF;
          END $$;

          SELECT 'role-ready';
          SQL
          sudo -u postgres dropdb --if-exists sanad
          sudo -u postgres createdb -O sanad sanad
          sudo -u postgres dropdb --if-exists test_migration
          sudo -u postgres createdb -O sanad test_migration

      - name: Run T5 unit and PostgreSQL Direct lifecycle contracts
        working-directory: apps/sanad-platform
        run: |
          mvn --batch-mode --no-transfer-progress             -Dtest=PayrollLifecycleTest,PayrollLifecyclePostgresTest,HrModuleBoundaryArchitectureTest             -DfailIfNoTests=true test
