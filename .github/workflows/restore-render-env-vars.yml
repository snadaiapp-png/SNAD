name: Restore Render Env Vars

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    name: Restore production env vars on Render
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Restore critical env vars via per-key endpoint
        shell: bash
        run: |
          set -euo pipefail

          set_render_var() {
            local key="$1" value="$2"
            echo "Setting $key on Render..."
            jq -n --arg value "$value" '{value:$value}' > /tmp/env-update.json
            STATUS=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
              --max-time 45 \
              -X PUT \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              --data @/tmp/env-update.json \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${key}")
            if [ "$STATUS" != "200" ] && [ "$STATUS" != "201" ]; then
              echo "::error::Failed to set $key: HTTP $STATUS"
              cat /tmp/response.json
              exit 1
            fi
            echo "  $key set (HTTP $STATUS)"
          }

          # Use PROD_JDBC_URL / PROD_DB_USER / PROD_DB_PASSWORD (current production DB)
          set_render_var "DATABASE_URL" "${{ secrets.PROD_JDBC_URL }}"
          set_render_var "DATABASE_USERNAME" "${{ secrets.PROD_DB_USER }}"
          set_render_var "DATABASE_PASSWORD" "${{ secrets.PROD_DB_PASSWORD }}"
          set_render_var "SPRING_PROFILES_ACTIVE" "prod"
          set_render_var "FLYWAY_ENABLED" "true"
          set_render_var "FLYWAY_LOCATIONS" "classpath:db/migration,classpath:db/vendor/{vendor}"
          set_render_var "SANAD_CORS_ALLOWED_ORIGINS" "https://snad-app.vercel.app,https://streak-train-empower.ngrok-free.dev"

          echo ""
          echo "=== All critical env vars restored ==="

      - name: Trigger Render deploy
        shell: bash
        run: |
          set -euo pipefail
          echo "Triggering Render deploy..."
          STATUS=$(curl -sS -o /tmp/deploy.json -w "%{http_code}" \
            --max-time 30 \
            -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Accept: application/json' \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys")
          echo "Deploy trigger: HTTP $STATUS"
          DEPLOY_ID=$(python3 -c "import json; print(json.load(open('/tmp/deploy.json')).get('id', 'unknown'))")
          echo "Deploy ID: $DEPLOY_ID"

      - name: Wait for deploy
        shell: bash
        run: |
          sleep 180
          echo "Waiting for health check..."
          for i in $(seq 1 12); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 \
              "https://sanad-backend-mcrj.onrender.com/actuator/health" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Health: UP (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE"
            sleep 15
          done
          echo "::warning::Health check did not pass — check Render logs"
