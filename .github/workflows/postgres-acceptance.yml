# ============================================================
# SANAD Platform — PostgreSQL Acceptance Workflow
# ============================================================
# Governing database-test path: explicit PostgreSQL 16 service.
# Test code consumes the datasource via environment variables and does not
# create or manage database containers.
# ============================================================

name: PostgreSQL Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/security/**'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/api/ProductionProfileTest.java'
      - '.github/workflows/postgres-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/security/**'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/api/ProductionProfileTest.java'
      - '.github/workflows/postgres-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: postgres-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-acceptance:
    name: PostgreSQL Service Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanad
          POSTGRES_PASSWORD: sanad_pass
          POSTGRES_DB: sanad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanad -d sanad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: sanad
      SPRING_DATASOURCE_PASSWORD: sanad_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      FLYWAY_ENABLED: 'true'
      FLYWAY_BASELINE_ON_MIGRATE: 'true'
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      JPA_DDL_AUTO: validate
      CRM_009_POSTGRES_MANDATORY: 'true'

    defaults:
      run:
        working-directory: apps/sanad-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run RefreshTokenConcurrencyPostgresTest
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/surefire-reports
          mvn test \
            -Dtest='RefreshTokenConcurrencyPostgresTest' \
            --batch-mode \
            --no-transfer-progress

      - name: Verify PostgreSQL acceptance report
        shell: bash
        run: |
          set -euo pipefail
          report="target/surefire-reports/TEST-com.sanad.platform.security.service.RefreshTokenConcurrencyPostgresTest.xml"
          if [[ ! -f "$report" ]]; then
            echo "::error::Surefire report not found: $report"
            exit 1
          fi
          python3 - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          tests = int(root.attrib.get("tests", 0))
          failures = int(root.attrib.get("failures", 0))
          errors = int(root.attrib.get("errors", 0))
          skipped = int(root.attrib.get("skipped", 0))
          print(f"tests={tests} failures={failures} errors={errors} skipped={skipped}")
          if tests <= 0 or failures > 0 or errors > 0 or skipped > 0:
              raise SystemExit(1)
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-acceptance-reports-${{ github.run_id }}
          path: apps/sanad-platform/target/surefire-reports/
          if-no-files-found: error
          retention-days: 30

      - name: Write acceptance summary
        if: always()
        shell: bash
        run: |
          {
            echo '## PostgreSQL Service Acceptance'
            echo ''
            echo "**Tested SHA:** \`${{ github.sha }}\`"
            echo "**Run ID:** ${{ github.run_id }}"
            echo ''
            echo '| Parameter | Value |'
            echo '|-----------|-------|'
            echo '| Database authority | GitHub Actions PostgreSQL service |'
            echo '| PostgreSQL image | postgres:16-alpine |'
            echo '| Application-managed database containers | disabled |'
            echo '| Required test | RefreshTokenConcurrencyPostgresTest |'
            echo ''
            echo '**Gate:** tests > 0, failures = 0, errors = 0, skipped = 0'
          } >> "$GITHUB_STEP_SUMMARY"
