name: CRM Contract One-Shot Sync

on:
  push:
    branches:
      - hotfix/post-881-final-gates
    paths:
      - '.github/workflows/crm-contract-one-shot-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crm-contract-one-shot-sync
  cancel-in-progress: false

env:
  JWT_SECRET: ci-only-non-production-validation-key-1234567890
  SANAD_SERVICE_AUTH_JWT_SECRET: ci-only-non-production-jwt-secret-key-32-chars-min
  SANAD_WORKFLOW_ENGINE_BASE_URL: http://localhost:8081
  SANAD_AI_GATEWAY_BASE_URL: http://localhost:8081
  SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad_contract_sync
  SPRING_DATASOURCE_USERNAME: sanad_contract_sync
  SPRING_DATASOURCE_PASSWORD: sanad_contract_sync_pass
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
  SPRING_FLYWAY_OUT_OF_ORDER: 'true'
  FLYWAY_ENABLED: 'true'
  JPA_DDL_AUTO: validate

jobs:
  sync:
    name: Generate canonical CRM contract from governed runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanad_contract_sync
          POSTGRES_PASSWORD: sanad_contract_sync_pass
          POSTGRES_DB: sanad_contract_sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanad_contract_sync -d sanad_contract_sync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Start backend for runtime OpenAPI
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -euo pipefail
          nohup mvn -q -DskipTests spring-boot:run \
            -Dspring-boot.run.profiles=local \
            -Dspring-boot.run.arguments="--server.port=8081 --management.endpoints.web.exposure.include=health" \
            > /tmp/crm-contract-sync-backend.log 2>&1 &
          echo $! > /tmp/crm-contract-sync-backend.pid

      - name: Fetch runtime OpenAPI
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            if ! kill -0 "$(cat /tmp/crm-contract-sync-backend.pid)" 2>/dev/null; then
              cat /tmp/crm-contract-sync-backend.log
              exit 1
            fi
            code="$(curl -sS -o /tmp/platform-openapi.json -w '%{http_code}' http://localhost:8081/v3/api-docs || true)"
            if [ "$code" = '200' ] && [ -s /tmp/platform-openapi.json ]; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/crm-contract-sync-backend.log
          exit 1

      - name: Generate governed CRM-only contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/crm/filter-runtime-openapi.py \
            --input /tmp/platform-openapi.json \
            --output /tmp/crm-openapi.runtime.json \
            --prefix /api/v2/crm \
            --expected-paths 147 \
            --expected-operations 192
          cp /tmp/crm-openapi.runtime.json docs/crm/contracts/openapi/crm-openapi.json

      - name: Regenerate TypeScript contract
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run crm:generate-api-types

      - name: Update governed expected counts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/crm-api-contract-validation.yml')
          text = path.read_text(encoding='utf-8')
          old = text
          text = text.replace("EXPECTED_CRM_PATHS: '142'", "EXPECTED_CRM_PATHS: '147'")
          text = text.replace("EXPECTED_CRM_OPERATIONS: '181'", "EXPECTED_CRM_OPERATIONS: '192'")
          if text == old:
              raise SystemExit('Expected CRM contract count markers were not found')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify generated contract before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          spec = json.loads(Path('docs/crm/contracts/openapi/crm-openapi.json').read_text(encoding='utf-8'))
          methods = {'get','post','put','patch','delete','head','options','trace'}
          operations = sum(1 for item in spec['paths'].values() for method in item if method in methods)
          assert len(spec['paths']) == 147, len(spec['paths'])
          assert operations == 192, operations
          assert '/tags' in spec['paths']
          assert '/tags/{tagId}/assignments' in spec['paths']
          assert '/pipelines/{pipelineId}/stages/{stageId}' in spec['paths']
          assert spec['servers'] == [{'url':'/api/v2/crm'}]
          print('Governed CRM contract verified: 147 paths / 192 operations')
          PY
          test -s apps/web/lib/api/generated/crm-api-types.ts

      - name: Remove one-shot workflow and commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/crm-contract-one-shot-sync.yml
          git config user.name 'snad-ci-contract-sync'
          git config user.email 'snad-ci-contract-sync@users.noreply.github.com'
          git add \
            docs/crm/contracts/openapi/crm-openapi.json \
            apps/web/lib/api/generated/crm-api-types.ts \
            .github/workflows/crm-api-contract-validation.yml \
            .github/workflows/crm-contract-one-shot-sync.yml
          git diff --cached --check
          git commit -m 'chore(crm): sync canonical OpenAPI to governed runtime'
          git push origin HEAD:hotfix/post-881-final-gates

      - name: Stop backend
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/crm-contract-sync-backend.pid ]; then
            kill "$(cat /tmp/crm-contract-sync-backend.pid)" 2>/dev/null || true
          fi
