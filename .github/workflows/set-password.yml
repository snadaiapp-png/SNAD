name: Set Admin Password

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "set" to confirm'
        required: true
        default: ''
        type: string
      password:
        description: 'Password for admin user'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  set-password:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    if: github.event.inputs.confirm == 'set'
    steps:
      - name: Suspend backend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Suspend HTTP %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/suspend" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" || true
          sleep 15

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1
          pip3 install bcrypt > /dev/null 2>&1

      - name: Generate hash and update password
        env:
          PROD_JDBC_URL: ${{ secrets.PROD_JDBC_URL }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          NEW_PASSWORD: ${{ inputs.password }}
        run: |
          set -euo pipefail
          # Write Python script to file to avoid heredoc indentation issues
          cat > /tmp/gen_hash.py << 'PYSCRIPT'
import bcrypt
import os
password = os.environ.get('NEW_PASSWORD', '').encode('utf-8')
print(bcrypt.hashpw(password, bcrypt.gensalt(rounds=10)).decode('utf-8'))
PYSCRIPT
          HASH=$(python3 /tmp/gen_hash.py)
          echo "Hash length: ${#HASH}"

          JDBC_URL="$PROD_JDBC_URL"
          CONN_STR="${JDBC_URL#jdbc:postgresql://}"
          HOST_PORT="${CONN_STR%%/*}"
          HOST="${HOST_PORT%%:*}"
          PORT="${HOST_PORT##*:}"
          DB_PART="${CONN_STR#*/}"
          DB_NAME="${DB_PART%%\?*}"

          printf '%s\n' \
            "SET search_path TO public;" \
            "UPDATE users SET password_hash = '$HASH', status = 'ACTIVE', updated_at = CURRENT_TIMESTAMP;" \
            "SELECT email, status FROM users;" \
            > /tmp/update.sql

          for attempt in 1 2 3 4 5; do
            echo "=== Attempt $attempt ==="
            if PGPASSWORD="$PROD_DB_PASSWORD" psql -h "$HOST" -p "$PORT" -U "$PROD_DB_USER" -d "$DB_NAME" -f /tmp/update.sql; then
              echo "✓ Password updated!"
              break
            fi
            sleep 10
          done

      - name: Resume backend
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Resume HTTP %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/resume" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" || true

      - name: Verify
        env:
          NEW_PASSWORD: ${{ inputs.password }}
        run: |
          sleep 30
          echo "=== Login with admin@snad.ai ==="
          curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"admin@snad.ai\",\"password\":\"$NEW_PASSWORD\"}" \
            -w "\nHTTP %{http_code}\n" || true
