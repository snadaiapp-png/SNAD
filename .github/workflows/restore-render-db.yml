name: Restore Render DB URL

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "restore" to confirm'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    if: github.event.inputs.confirm == 'restore'
    steps:
      - name: Set ORIGINAL Render DB credentials
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          set -euo pipefail
          set_var() {
            local key="$1"
            local value="$2"
            local type="${3:-raw}"
            local payload
            if [ "$type" = "secret" ]; then
              payload=$(python3 -c 'import json,sys; print(json.dumps({"value": sys.argv[1], "type": "SECRET"}))' "$value")
            else
              payload=$(python3 -c 'import json,sys; print(json.dumps({"value": sys.argv[1]}))' "$value")
            fi
            curl -sS -o /dev/null -w "  $key: HTTP %{http_code}\n" --max-time 30 \
              -X PUT -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.render.com/v1/services/${BACKEND_ID}/env-vars/${key}"
          }

          echo "=== Restoring ORIGINAL Render DB credentials ==="
          set_var "DATABASE_URL" "jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require" "secret"
          set_var "DATABASE_USERNAME" "postgres.hxhvfqxzigrqoxxnnzje" "secret"
          set_var "DATABASE_PASSWORD" "Senen@001985" "secret"
          set_var "BOOTSTRAP_ENABLED" "false"
          set_var "FLYWAY_ENABLED" "false"
          set_var "JPA_DDL_AUTO" "none"
          set_var "DATABASE_POOL_MAX" "1"

      - name: Suspend
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Suspend: %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/suspend" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" || true
          sleep 20

      - name: Resume
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          curl -sS -o /dev/null -w "Resume: %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/resume" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" -H "Accept: application/json" || true

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://sanad-backend-mcrj.onrender.com/actuator/health" 2>/dev/null || echo "000")
            echo "  Health $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "✓ UP!"; exit 0; fi
            sleep 10
          done

      - name: Wait 90s
        run: sleep 90

      - name: Test login
        run: |
          echo "=== Login ==="
          curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@snad.ai","password":"SNad@2026"}' \
            -w "\nHTTP %{http_code}\n" 2>&1 || true
