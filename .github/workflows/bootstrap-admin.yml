name: Bootstrap Admin via API

# ============================================================
# Use Spring Boot's built-in bootstrap endpoint to create
# the admin user. This avoids Supabase pooler connection
# issues because the backend handles DB access internally.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "bootstrap" to confirm'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    if: github.event.inputs.confirm == 'bootstrap'

    steps:
      - name: Enable bootstrap mode on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
          CONTROL_PLANE_BOOTSTRAP_TOKEN: ${{ secrets.CONTROL_PLANE_BOOTSTRAP_TOKEN }}
          CONTROL_PLANE_ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          CONTROL_PLANE_ADMIN_PASSWORD: ${{ secrets.CONTROL_PLANE_ADMIN_PASSWORD }}
          CONTROL_PLANE_TENANT_ID: ${{ secrets.CONTROL_PLANE_TENANT_ID }}
        run: |
          set -euo pipefail

          set_var() {
            local key="$1"
            local value="$2"
            local type="${3:-raw}"
            local payload
            if [ "$type" = "secret" ]; then
              payload=$(python3 -c 'import json,sys; print(json.dumps({"value": sys.argv[1], "type": "SECRET"}))' "$value")
            else
              payload=$(python3 -c 'import json,sys; print(json.dumps({"value": sys.argv[1]}))' "$value")
            fi
            local status
            status=$(curl -sS -o /tmp/r.json -w "%{http_code}" --max-time 30 \
              -X PUT \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.render.com/v1/services/${BACKEND_ID}/env-vars/${key}")
            echo "  $key: HTTP $status"
          }

          echo "=== Setting bootstrap env vars ==="
          set_var "CONTROL_PLANE_BOOTSTRAP_ENABLED" "true"
          set_var "CONTROL_PLANE_BOOTSTRAP_TOKEN" "$CONTROL_PLANE_BOOTSTRAP_TOKEN" "secret"
          set_var "CONTROL_PLANE_ADMIN_EMAIL" "$CONTROL_PLANE_ADMIN_EMAIL" "secret"
          set_var "CONTROL_PLANE_ADMIN_PASSWORD" "$CONTROL_PLANE_ADMIN_PASSWORD" "secret"
          set_var "CONTROL_PLANE_TENANT_ID" "$CONTROL_PLANE_TENANT_ID" "secret"
          # Keep other working env vars
          set_var "FLYWAY_ENABLED" "false"
          set_var "JPA_DDL_AUTO" "none"
          set_var "DATABASE_POOL_MAX" "1"
          set_var "SPRING_PROFILES_ACTIVE" "prod"
          set_var "JWT_SECRET" "$(openssl rand -hex 32)" "secret"
          set_var "SANAD_CONTROL_PLANE_TENANT_ID" "$CONTROL_PLANE_TENANT_ID" "secret"
          set_var "SANAD_CORS_ALLOWED_ORIGINS" "https://snad-app.vercel.app"
          set_var "SERVER_PORT" "8080"
          set_var "MANAGEMENT_ENDPOINTS" "health"
          set_var "SHUTDOWN_TIMEOUT" "30s"
          set_var "JAVA_OPTS" "-Xms64m -Xmx384m -XX:MaxDirectMemorySize=64m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss256k -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8"
          set_var "DATABASE_POOL_MIN" "1"
          set_var "DATABASE_POOL_TIMEOUT" "60000"
          set_var "LOG_LEVEL_ROOT" "WARN"
          set_var "LOG_LEVEL_SANAD" "INFO"
          set_var "LAZY_INIT" "true"
          set_var "SECURITY_NOTIFICATION_PROVIDER" "disabled"
          set_var "APPLICATION_BASE_URL" "https://snad-app.vercel.app"
          set_var "BOOTSTRAP_ENABLED" "false"
          set_var "FLYWAY_LOCATIONS" "classpath:db/migration,classpath:db/vendor/{vendor}"

      - name: Trigger deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          STATUS=$(curl -sS -o /tmp/deploy.json -w "%{http_code}" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{"clearCache":"do_not_clear"}')
          echo "Deploy trigger HTTP ${STATUS}"
          DEPLOY_ID=$(python3 -c "import json; print(json.load(open('/tmp/deploy.json')).get('id',''))")
          echo "Deploy ID: ${DEPLOY_ID}"
          echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_ENV"

      - name: Wait for deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          set -euo pipefail
          DEPLOY_ID="${deploy_id}"
          if [ -z "$DEPLOY_ID" ]; then echo "No deploy ID"; exit 1; fi
          echo "Waiting for deploy ${DEPLOY_ID}..."
          for i in $(seq 1 80); do
            sleep 15
            STATUS=$(curl -sS --max-time 30 \
              "https://api.render.com/v1/services/${BACKEND_ID}/deploys/${DEPLOY_ID}" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" | python3 -c "import json, sys; print(json.load(sys.stdin).get('status','unknown'))")
            echo "  Attempt ${i}: ${STATUS}"
            if [ "${STATUS}" = "live" ]; then echo "✓ DEPLOY LIVE!"; exit 0; fi
            if echo "${STATUS}" | grep -qE "failed|canceled|deactivated"; then
              echo "Deploy ${STATUS}"
              exit 1
            fi
          done
          echo "Timeout"
          exit 1

      - name: Wait for backend to be ready
        run: |
          echo "Waiting 30s for backend to start..."
          sleep 30
          echo "=== Health check ==="
          for i in $(seq 1 12); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://sanad-backend-mcrj.onrender.com/actuator/health" || echo "000")
            echo "  Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✓ Backend is UP!"
              exit 0
            fi
            sleep 10
          done
          echo "Backend did not become healthy"
          exit 1

      - name: Call bootstrap endpoint
        env:
          CONTROL_PLANE_BOOTSTRAP_TOKEN: ${{ secrets.CONTROL_PLANE_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== Calling bootstrap endpoint ==="
          sleep 5
          STATUS=$(curl -sS -o /tmp/bootstrap.json -w "%{http_code}" --max-time 120 \
            -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/internal/control-plane/bootstrap-admin" \
            -H "X-Control-Plane-Bootstrap-Token: $CONTROL_PLANE_BOOTSTRAP_TOKEN" \
            -H "Content-Type: application/json")
          echo "Bootstrap HTTP ${STATUS}"
          cat /tmp/bootstrap.json || true
          echo ""

      - name: Test login
        env:
          ADMIN_EMAIL: ${{ secrets.CONTROL_PLANE_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.CONTROL_PLANE_ADMIN_PASSWORD }}
        run: |
          echo "=== Login test ==="
          curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            -w "\nHTTP %{http_code}\n" || true

      - name: Disable bootstrap mode
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          set -euo pipefail
          echo "=== Disabling bootstrap mode ==="
          PAYLOAD=$(python3 -c 'import json; print(json.dumps({"value": "false"}))')
          curl -sS -o /dev/null -w "Disable bootstrap HTTP %{http_code}\n" --max-time 30 \
            -X PUT \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://api.render.com/v1/services/${BACKEND_ID}/env-vars/CONTROL_PLANE_BOOTSTRAP_ENABLED"

          echo "=== Triggering redeploy to apply bootstrap=false ==="
          curl -sS -o /dev/null -w "Redeploy HTTP %{http_code}\n" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data '{"clearCache":"do_not_clear"}' || true
