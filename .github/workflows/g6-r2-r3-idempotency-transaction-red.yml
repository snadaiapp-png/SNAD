name: G6 R2 R3 Idempotency Transaction GREEN

on:
  push:
    branches:
      - g6/human-acceptance-remediation
    paths:
      - 'apps/sanad-platform/src/**'
      - '.github/workflows/g6-r2-r3-idempotency-transaction-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r2-r3-green-gate:
    name: R2/R3 GREEN — Transaction + Concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_pass
          POSTGRES_DB: sanad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sanad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: sanad
      SPRING_DATASOURCE_PASSWORD: sanad_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_PROFILES_ACTIVE: default
      FLYWAY_ENABLED: 'true'
      FLYWAY_BASELINE_ON_MIGRATE: 'true'
      FLYWAY_VALIDATE_ON_MIGRATE: 'false'
      JPA_DDL_AUTO: validate
      CRM_009_POSTGRES_MANDATORY: 'true'
      PGPASSWORD: postgres_pass

    defaults:
      run:
        working-directory: apps/sanad-platform

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4

      - name: Provision least-privilege application role and isolated database
        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d sanad -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad') THEN
              CREATE ROLE sanad WITH LOGIN PASSWORD 'sanad_pass';
            END IF;
          END $$;
          ALTER ROLE sanad NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          ALTER DATABASE sanad OWNER TO sanad;
          SELECT 'CREATE DATABASE test_migration OWNER sanad'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'test_migration')\gexec
          GRANT CONNECT ON DATABASE postgres TO sanad;
          GRANT USAGE, CREATE ON SCHEMA public TO sanad;
          \c test_migration
          GRANT USAGE, CREATE ON SCHEMA public TO sanad;
          SQL

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Generate ephemeral CRM encryption key
        shell: bash
        run: |
          set -euo pipefail
          key="$(openssl rand -base64 32 | tr -d '\n')"
          test -n "$key"
          echo "::add-mask::$key"
          echo "CRM_CUSTOM_FIELD_ENCRYPTION_KEY=$key" >> "$GITHUB_ENV"

      - name: Execute R2/R3 GREEN contract tests
        shell: bash
        run: |
          set -euo pipefail
          rm -f target/surefire-reports/*CrmIdempotencyTransactionConcurrencyPostgresTest* 2>/dev/null || true
          mvn test -B -ntp \
            -Dtest=CrmIdempotencyTransactionConcurrencyPostgresTest \
            -DfailIfNoTests=true \
            -Dsurefire.useFile=true

      - name: Verify exact GREEN evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          files = glob.glob('target/surefire-reports/TEST-*CrmIdempotencyTransactionConcurrencyPostgresTest*.xml')
          if len(files) != 1:
              print(f'::error::Expected exactly one R2/R3 Surefire XML report, found {len(files)}')
              raise SystemExit(1)

          root = ET.parse(files[0]).getroot()
          tests = int(root.attrib.get('tests', 0))
          failures = int(root.attrib.get('failures', 0))
          errors = int(root.attrib.get('errors', 0))
          skipped = int(root.attrib.get('skipped', 0))
          print(f'R2/R3 results: tests={tests} failures={failures} errors={errors} skipped={skipped}')

          if (tests, failures, errors, skipped) != (2, 0, 0, 0):
              print('::error::R2/R3 GREEN contract not satisfied')
              raise SystemExit(1)

          print('R2_R3_GREEN_CONFIRMED=YES')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write('## G6 R2/R3 — GREEN confirmed\n\n')
              fh.write('- Tests: 2\n- Failures: 0\n- Errors: 0\n- Skipped: 0\n')
              fh.write('- `R2_R3_GREEN_CONFIRMED=YES`\n')
              fh.write('- Next permitted step: targeted CRM idempotency regression, then R4 schema hardening\n')
          PY

      - name: Upload R2/R3 Surefire evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g6-r2-r3-idempotency-green-${{ github.sha }}
          path: apps/sanad-platform/target/surefire-reports/TEST-*CrmIdempotencyTransactionConcurrencyPostgresTest*.xml
          if-no-files-found: error
          retention-days: 30
