name: Render Multi-Retry Deploy Until Live

# Supavisor's ENOIDENTIFIER is intermittent (~25% success rate observed).
# This workflow triggers up to N deploys sequentially until one becomes LIVE
# with health=UP, or all attempts fail.

on:
  workflow_dispatch:
    inputs:
      max_attempts:
        description: "Max deploy attempts (default 8)"
        required: true
        default: "8"

permissions:
  contents: read

jobs:
  multi-retry:
    name: Multi-retry deploy until live
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 60
    steps:
      - name: Multi-retry loop
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          MAX_ATTEMPTS: ${{ github.event.inputs.max_attempts }}
        run: |
          # Disable set -e so curl failures don't kill the script
          set +e
          
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          BASE="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"
          BACKEND_URL="https://sanad-backend-mcrj.onrender.com"

          echo "========================================"
          echo "MULTI-RETRY DEPLOY (max $MAX_ATTEMPTS attempts)"
          echo "========================================"
          echo ""

          SUCCESS="no"
          FINAL_DEPLOY_ID=""
          FINAL_DEPLOY_STATUS=""
          FINAL_HEALTH_HTTP=""
          FINAL_HEALTH_STATUS=""

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo ""
            echo "======================================"
            echo "ATTEMPT $attempt / $MAX_ATTEMPTS"
            echo "======================================"

            # Trigger deploy
            HTTP=$(curl -s -o /tmp/deploy.json -w "%{http_code}" --max-time 30 -X POST \
              -H "$AUTH" -H 'Content-Type: application/json' -H 'Accept: application/json' \
              --data '{"clearCache":"do_not_clear"}' "$BASE/deploys")
            DEPLOY_ID=$(jq -r '.id // empty' /tmp/deploy.json)
            echo "Trigger deploy -> HTTP $HTTP, ID=$DEPLOY_ID"

            if [ -z "$DEPLOY_ID" ]; then
              echo "  No deploy ID returned — wait 30s and retry"
              cat /tmp/deploy.json
              sleep 30
              continue
            fi
            FINAL_DEPLOY_ID=$DEPLOY_ID

            # Poll deploy status (up to 12 minutes per attempt)
            DEPLOY_STATUS="update_in_progress"
            for iter in $(seq 1 72); do
              sleep 10
              DEPLOY_STATUS=$(curl -s --max-time 15 -H "$AUTH" "$BASE/deploys/$DEPLOY_ID" | jq -r '.deploy.status // .status // "unknown"')
              echo "  iter $iter ($((iter*10))s): $DEPLOY_STATUS"

              if [ "$DEPLOY_STATUS" = "live" ]; then
                echo "  ✅ DEPLOY LIVE!"
                break
              fi
              if echo "$DEPLOY_STATUS" | grep -qiE 'failed|canceled|deactivated'; then
                echo "  ❌ Deploy terminal: $DEPLOY_STATUS"
                break
              fi
            done
            FINAL_DEPLOY_STATUS=$DEPLOY_STATUS

            # If deploy is live, check health
            if [ "$DEPLOY_STATUS" = "live" ]; then
              echo "  Health probe..."
              sleep 10  # Give the app a moment to settle
              HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 "$BACKEND_URL/actuator/health" || echo "000")
              HEALTH_STATUS=$(jq -r '.status // "unknown"' /tmp/health.json 2>/dev/null || echo "unknown")
              echo "  HTTP=$HTTP_CODE STATUS=$HEALTH_STATUS"
              FINAL_HEALTH_HTTP=$HTTP_CODE
              FINAL_HEALTH_STATUS=$HEALTH_STATUS

              if [ "$HTTP_CODE" = "200" ] && [ "$HEALTH_STATUS" = "UP" ]; then
                echo "  ✅✅✅ HEALTH=UP! SUCCESS!"
                SUCCESS="yes"
                break
              fi
            fi

            # Wait 30s before next attempt (let Render settle)
            echo "  Waiting 30s before next attempt..."
            sleep 30
          done

          echo ""
          echo "========================================"
          echo "FINAL RESULT"
          echo "========================================"
          echo "SUCCESS=$SUCCESS"
          echo "FINAL_DEPLOY_ID=$FINAL_DEPLOY_ID"
          echo "FINAL_DEPLOY_STATUS=$FINAL_DEPLOY_STATUS"
          echo "FINAL_HEALTH_HTTP=$FINAL_HEALTH_HTTP"
          echo "FINAL_HEALTH_STATUS=$FINAL_HEALTH_STATUS"
          if [ "$SUCCESS" = "yes" ]; then
            echo "FINAL_RESULT=SUCCESS ✅"
            exit 0
          else
            echo "FINAL_RESULT=FAILED after $MAX_ATTEMPTS attempts"
            exit 1
          fi
