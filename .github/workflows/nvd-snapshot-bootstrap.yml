# ============================================================
# SANAD — NVD Snapshot Bootstrap (GitHub-hosted, Datafeed)
# ============================================================
name: NVD Snapshot Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: snad-nvd-snapshot-single-writer
  cancel-in-progress: false

env:
  DEPENDENCY_CHECK_VERSION: "12.1.0"
  PYTHONUNBUFFERED: "1"
  PYTHONFAULTHANDLER: "1"
  NVD_SNAPSHOT_BACKEND: github-releases
  NVD_SOURCE_MODE: datafeed

jobs:
  bootstrap:
    name: Initial NVD Database Bootstrap (Datafeed)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: nvd-publisher

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml pytest
          sudo apt-get install -y zstd || true

      - name: Run Bootstrap (Datafeed Mode)
        shell: bash
        env:
          NVD_SNAPSHOT_BACKEND: github-releases
          NVD_SOURCE_MODE: datafeed
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          WORK_DIR="${{ runner.temp }}/nvd-work"
          CANONICAL_DIR="${{ runner.temp }}/nvd-canonical"
          LKG_DIR="${{ runner.temp }}/nvd-lkg"
          LOG_DIR="${{ runner.temp }}/nvd-diagnostics"
          rm -rf "$WORK_DIR" "$CANONICAL_DIR" "$LKG_DIR" "$LOG_DIR"
          mkdir -p "$WORK_DIR" "$CANONICAL_DIR" "$LKG_DIR" "$LOG_DIR"

          python3 -c 'from scripts.security.nvd_datafeed_runtime_hardening import install; install(); import runpy; runpy.run_path("scripts/security/publish_nvd_snapshot.py", run_name="__main__")' \
            --mode bootstrap \
            --source-mode datafeed \
            --update-timeout-minutes 240 \
            --work-dir "$WORK_DIR" \
            --canonical-dir "$CANONICAL_DIR" \
            --lkg-dir "$LKG_DIR" \
            --publisher-commit-sha "${{ github.sha }}" \
            --publisher-run-id "${{ github.run_id }}" 2>&1 | tee "$LOG_DIR/bootstrap.log"

      - name: Upload NVD bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nvd-bootstrap-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/nvd-diagnostics/
          if-no-files-found: warn
          retention-days: 30

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## NVD Snapshot Bootstrap — hardened datafeed mode"
            echo ""
            echo "**Run ID:** ${{ github.run_id }}"
            echo "**SHA:** \`${{ github.sha }}\`"
            echo "**Backend:** GitHub Releases"
            echo "**Runtime metadata hardening:** ENABLED"
            echo "**Complete diagnostic artifact:** ENABLED"
            echo "**Direct NVD API:** PROHIBITED"
          } >> "$GITHUB_STEP_SUMMARY"
