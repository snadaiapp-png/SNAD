name: G2 Admin Password Reset Once

on:
  push:
    branches:
      - chore/g2-admin-password-reset-once

permissions:
  contents: read

jobs:
  request-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request production password setup link
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/reset-response.json"
          status="$(curl --silent --show-error --location \
            --connect-timeout 15 --max-time 60 \
            --output "$response_file" --write-out '%{http_code}' \
            -X POST 'https://snad-app.vercel.app/api/platform/api/v1/auth/forgot-password' \
            -H 'Content-Type: application/json' \
            --data '{"email":"snad.ai.app+g2@gmail.com"}')"
          cat "$response_file" | jq -c '{message:(.message // null)}'
          test "$status" = '200' || {
            echo "::error::forgot-password returned HTTP $status"
            exit 1
          }
          echo 'G2_ADMIN_PASSWORD_RESET_REQUEST=PASS'
