name: Provision Auth Smoke Tenants

# Idempotently provisions the AUTH_SMOKE_TENANT_A/B tenants + users
# directly in the production database using the secret credentials.
# Once provisioned, the auth-tenant-production-acceptance workflow
# can login with the same credentials and exercise authenticated
# session/tenant-isolation/refresh-replay flows.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    name: Provision Auth Smoke Tenants A+B in prod DB
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10

    steps:
      - name: Install psql + Python deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client python3-bcrypt
          pip install --break-system-packages bcrypt
          psql --version
          python3 -c "import bcrypt; print('bcrypt', bcrypt.__version__)"

      - name: Provision tenants + users
        env:
          DATABASE_USERNAME: ${{ secrets.PRODUCTION_DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
          TENANT_A_ID: ${{ secrets.AUTH_SMOKE_TENANT_A_ID }}
          TENANT_A_EMAIL: ${{ secrets.AUTH_SMOKE_TENANT_A_EMAIL }}
          TENANT_A_PASSWORD: ${{ secrets.AUTH_SMOKE_TENANT_A_PASSWORD }}
          TENANT_B_ID: ${{ secrets.AUTH_SMOKE_TENANT_B_ID }}
          TENANT_B_EMAIL: ${{ secrets.AUTH_SMOKE_TENANT_B_EMAIL }}
          TENANT_B_PASSWORD: ${{ secrets.AUTH_SMOKE_TENANT_B_PASSWORD }}
          PGPASSWORD: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
        run: |
          set -euo pipefail

          # Supabase pooler connection (psql uses system libpq with proper SNI support)
          export PGHOST='aws-0-eu-central-1.pooler.supabase.com'
          export PGPORT='5432'
          export PGDATABASE='postgres'
          export PGUSER="$DATABASE_USERNAME"
          # PGPASSWORD is set above
          export PGSSLMODE='require'

          echo "=== Verify connectivity ==="
          psql -c "SELECT version();" 2>&1 | head -3

          echo ""
          echo "=== Provision Tenant A + B (idempotent upserts) ==="
          # Generate bcrypt hashes for A and B (using Spring's $2a$ prefix)
          HASH_A=$(python3 -c "import bcrypt, os; print(bcrypt.hashpw(os.environ['TENANT_A_PASSWORD'].encode(), bcrypt.gensalt(rounds=10, prefix=b'2a')).decode())")
          HASH_B=$(python3 -c "import bcrypt, os; print(bcrypt.hashpw(os.environ['TENANT_B_PASSWORD'].encode(), bcrypt.gensalt(rounds=10, prefix=b'2a')).decode())")
          echo "Hash A length: ${#HASH_A}, Hash B length: ${#HASH_B}"

          for label in A B; do
            case "$label" in
              A) TID="$TENANT_A_ID"; EMAIL="$TENANT_A_EMAIL"; HASH="$HASH_A";;
              B) TID="$TENANT_B_ID"; EMAIL="$TENANT_B_EMAIL"; HASH="$HASH_B";;
            esac
            echo ""
            echo "=== Provisioning Tenant $label (tenant_id=$TID, email=$EMAIL) ==="

            # 1. Tenant upsert
            psql -v ON_ERROR_STOP=1 -c "INSERT INTO tenants (id, name, status, created_at, updated_at) VALUES ('$TID'::uuid, 'Auth Smoke $label', 'ACTIVE', NOW(), NOW()) ON CONFLICT (id) DO UPDATE SET status = 'ACTIVE', updated_at = NOW() RETURNING id, name, status;"

            # 2. Organization upsert
            psql -v ON_ERROR_STOP=1 -c "INSERT INTO organizations (id, tenant_id, name, status, created_at, updated_at) SELECT gen_random_uuid(), '$TID'::uuid, 'Auth Smoke Org $label', 'ACTIVE', NOW(), NOW() WHERE NOT EXISTS (SELECT 1 FROM organizations WHERE tenant_id = '$TID'::uuid AND name = 'Auth Smoke Org $label');"

            # 3. ADMIN role upsert + grant all capabilities
            psql -v ON_ERROR_STOP=1 -c "INSERT INTO roles (id, tenant_id, code, name, description, status, created_at, updated_at) SELECT gen_random_uuid(), '$TID'::uuid, 'ADMIN', 'Auth Smoke Admin $label', 'Auth smoke admin', 'ACTIVE', NOW(), NOW() WHERE NOT EXISTS (SELECT 1 FROM roles WHERE tenant_id = '$TID'::uuid AND code = 'ADMIN');"
            psql -v ON_ERROR_STOP=1 -c "INSERT INTO role_capabilities (id, tenant_id, role_id, capability_id, created_at) SELECT gen_random_uuid(), '$TID'::uuid, r.id, ac.id, NOW() FROM roles r, access_capabilities ac WHERE r.tenant_id = '$TID'::uuid AND r.code = 'ADMIN' AND ac.status = 'ACTIVE' AND NOT EXISTS (SELECT 1 FROM role_capabilities rc WHERE rc.tenant_id = '$TID'::uuid AND rc.role_id = r.id AND rc.capability_id = ac.id);"

            # 4. User upsert (with bcrypt password hash)
            psql -v ON_ERROR_STOP=1 -c "INSERT INTO users (id, tenant_id, email, display_name, status, password_hash, must_change_password, platform_admin, session_version, created_at, updated_at) VALUES (gen_random_uuid(), '$TID'::uuid, '$EMAIL', 'Auth Smoke User $label', 'ACTIVE', '$HASH', FALSE, FALSE, 0, NOW(), NOW()) ON CONFLICT (tenant_id, email) DO UPDATE SET password_hash = EXCLUDED.password_hash, status = 'ACTIVE', must_change_password = FALSE, updated_at = NOW() RETURNING id, email;"

            # 5. Membership upsert
            psql -v ON_ERROR_STOP=1 -c "INSERT INTO organization_memberships (id, tenant_id, organization_id, user_id, status, created_at, updated_at) SELECT gen_random_uuid(), '$TID'::uuid, o.id, u.id, 'ACTIVE', NOW(), NOW() FROM organizations o, users u WHERE o.tenant_id = '$TID'::uuid AND o.name = 'Auth Smoke Org $label' AND u.tenant_id = '$TID'::uuid AND u.email = '$EMAIL' AND NOT EXISTS (SELECT 1 FROM organization_memberships m WHERE m.tenant_id = '$TID'::uuid AND m.user_id = u.id AND m.organization_id = o.id);"

            # 6. user_role_assignments upsert
            psql -v ON_ERROR_STOP=1 -c "INSERT INTO user_role_assignments (id, tenant_id, user_id, role_id, status, created_at, updated_at) SELECT gen_random_uuid(), '$TID'::uuid, u.id, r.id, 'ACTIVE', NOW(), NOW() FROM users u, roles r WHERE u.tenant_id = '$TID'::uuid AND u.email = '$EMAIL' AND r.tenant_id = '$TID'::uuid AND r.code = 'ADMIN' AND NOT EXISTS (SELECT 1 FROM user_role_assignments ura WHERE ura.tenant_id = '$TID'::uuid AND ura.user_id = u.id AND ura.role_id = r.id);"

            # 7. auth_credentials upsert (if table exists)
            psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF to_regclass('public.auth_credentials') IS NOT NULL THEN INSERT INTO auth_credentials (user_id, tenant_id, password_hash, status, created_at, updated_at) SELECT u.id, '$TID'::uuid, '$HASH', 'ACTIVE', NOW(), NOW() FROM users u WHERE u.tenant_id = '$TID'::uuid AND u.email = '$EMAIL' ON CONFLICT (user_id, tenant_id) DO UPDATE SET password_hash = EXCLUDED.password_hash, status = 'ACTIVE', updated_at = NOW(); END IF; END \$\$;"

            echo "Tenant $label provisioned"
          done

          echo ""
          echo "=== ALL TENANTS PROVISIONED ==="

          # Verify by querying
          echo ""
          echo "=== Verify (final state) ==="
          psql -c "SELECT t.id, t.name, t.status FROM tenants t WHERE t.id IN ('$TENANT_A_ID'::uuid, '$TENANT_B_ID'::uuid) ORDER BY t.name;"
          psql -c "SELECT u.tenant_id, u.email, u.status FROM users u WHERE u.tenant_id IN ('$TENANT_A_ID'::uuid, '$TENANT_B_ID'::uuid) ORDER BY u.email;"
