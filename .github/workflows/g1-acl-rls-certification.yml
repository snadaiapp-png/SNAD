# G1 ACL/RLS certification. Manual and protected (Production environment).
# Companion to g1-production-backup-restore-proof.yml and g1-durable-backup.yml:
# the rehearsal proves restorability with --no-acl (ACLs explicitly not
# certified); this workflow closes that gap. It restores a FRESH production
# dump WITH ACL entries (no --no-acl) into a disposable local PostgreSQL 17
# database and proves STRUCTURAL EQUIVALENCE of the security catalog between
# production and the restored copy, fail-closed on any difference.
#
# v20261109.1 — validated end-to-end on a local PostgreSQL 17.11 simulation
#   against the real encrypted production backup (decrypted offline):
#   filter kept 364 public-schema ACL entries + 6 DEFAULT ACL entries,
#   restore with ACLs exited 0, and the equivalence queries returned
#   319 tables (with RLS enablement/force flags), 283 RLS policies,
#   6377 table grants, 24 sequence grants, 8 schema grants, 0 column
#   grants, 78 default ACL entries. Real TOC format confirmed:
#     <dumpid>; <oids> ACL <namespace|-> <TYPE> <tag> <role>
#   Policies restore cleanly because they reference current_setting() and
#   stub-able roles, never auth.uid() (which does not exist on vanilla PG).
#
# Certification scope (public schema only; platform schemas are not
# restorable on vanilla PostgreSQL by design):
#   - RLS enablement and force flags per table
#   - full pg_policies rows (permissive, roles, cmd, qual, with_check)
#   - table/sequence/schema/column grants via aclexplode (grantee+privilege;
#     grantor provenance is not part of effective permissions and is excluded)
#   - default ACLs (pg_default_acl) for schema public
# Comparison is byte-exact after normalization (sorted catalog output);
# any difference fails the run and the diff (schema metadata only) is
# printed. This does NOT by itself close the G1 security hold: independent
# approval remains required.
name: G1 ACL RLS Certification

on:
  workflow_dispatch:
    inputs:
      change_ticket:
        description: 'Approved ACL/RLS certification ticket ID'
        required: true
        type: string
      expected_flyway:
        description: 'Expected production Flyway version before backup'
        required: true
        default: '20261021.1'
        type: string

permissions:
  contents: read

concurrency:
  group: g1-acl-rls-certification
  cancel-in-progress: false

jobs:
  acl-rls-certification:
    name: ACL/RLS equivalence of restored copy vs production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: Production
    env:
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      EXPECTED_FLYWAY: ${{ inputs.expected_flyway }}
      CHANGE_TICKET: ${{ inputs.change_ticket }}
    steps:
      - name: Check approved change reference and protected credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CHANGE_TICKET" =~ ^G1-CHG-[0-9]+$ ]] || { echo "::error::INVALID_CHANGE_TICKET_FORMAT"; exit 1; }
          echo "CHANGE_REFERENCE_FORMAT_VALID=yes"
          # A valid change reference is not an approval. Production protection reviewers
          # must independently verify explicit approval and rotated credentials.
          test -n "${PRODUCTION_DATABASE_URL:-}" || { echo "::error::NO_PROTECTED_PRODUCTION_DB_URL"; exit 1; }
          echo "CHANGE_REFERENCE_PRESENT=yes"
          echo "NOTE=Production environment reviewer must authorize this run"

      - name: Install matching native PostgreSQL 17 clients and server
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --retry 5 --retry-delay 3 --retry-all-errors -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=5 update -qq; then break; fi
            echo "APT update attempt ${attempt} failed; retrying in 15s"
            test "$attempt" -eq 3 && { echo "::error::APT_UPDATE_FAILED_AFTER_RETRIES"; exit 1; }
            sleep 15
          done
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=5 install -y -qq postgresql-client-17 postgresql-17; then break; fi
            echo "APT install attempt ${attempt} failed; retrying in 20s"
            test "$attempt" -eq 3 && { echo "::error::APT_INSTALL_FAILED_AFTER_RETRIES"; exit 1; }
            sleep 20
          done
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          pg_dump --version | grep -E 'PostgreSQL[)] 17[.]'
          if ! pg_lsclusters --no-header | awk '$1=="17" && $2=="main" {found=1} END {exit !found}'; then
            sudo pg_createcluster 17 main
          fi
          if ! sudo pg_ctlcluster 17 main status >/dev/null 2>&1; then
            sudo pg_ctlcluster 17 main start
          fi
          local_port="$(pg_lsclusters --no-header | awk '$1=="17" && $2=="main" {print $3}')"
          test -n "$local_port" || { echo "::error::PG17_CLUSTER_PORT_MISSING"; exit 1; }
          sudo -u postgres psql -p "$local_port" -Atqc "SHOW server_version" | grep -E '^17[.]'
          echo "LOCAL_PGPORT=$local_port" >> "$GITHUB_ENV"

      - name: ACL/RLS equivalence certification of a restored copy
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          # postgres (via sudo -u postgres pg_restore) must traverse this directory
          # to reach its postgres-owned 0400 restore copy and the 0644 toc.
          chmod 0711 "$work"
          trap 'rm -rf "$work"' EXIT
          # PostgreSQL connection URL comes only from protected Actions secret.
          # Do not print the URL, password, query results containing user data, or dump.
          python3 - "$work" <<'PY'
          import os, sys
          from urllib.parse import urlsplit, parse_qs, unquote
          raw=os.environ['PRODUCTION_DATABASE_URL']
          if raw.startswith('jdbc:'): raw=raw[5:]
          p=urlsplit(raw)
          if p.scheme not in ('postgresql','postgres'): raise SystemExit('INVALID_CONNECTION_SCHEME')
          host=p.hostname or ''
          u=unquote(p.username or '')
          query=parse_qs(p.query)
          if not u: u=query.get('user',[''])[0]
          password=unquote(p.password or '') or query.get('password',[''])[0]
          # Exact production-project binding; accept Supabase pooler username postgres.<project-ref>.
          ref='tkbrvupemreqabwzdpyq'
          if ref not in host and ref not in u: raise SystemExit('PRODUCTION_IDENTITY_NOT_MATCHED')
          if not (host and u and password): raise SystemExit('INCOMPLETE_DATABASE_CONNECTION')
          env=os.environ.copy()
          env.update(PGHOST=host, PGPORT=str(p.port or 5432),
                     PGUSER=u, PGPASSWORD=password,
                     PGDATABASE=unquote((p.path or '/postgres').lstrip('/')),
                     PGSSLMODE='require', PGCONNECT_TIMEOUT='15')
          import subprocess, hashlib, json
          def pq(sql):
              r=subprocess.run(['psql','-X','-A','-t','-F','\t','-v','ON_ERROR_STOP=1','-c',sql],
                               env=env,check=True,capture_output=True)
              return r.stdout.decode().strip()
          sql="SELECT version FROM public.flyway_schema_history WHERE success AND version IS NOT NULL ORDER BY installed_rank DESC LIMIT 1"
          head=pq(sql)
          if head!=os.environ['EXPECTED_FLYWAY']: raise SystemExit('FLYWAY_HEAD_MISMATCH')
          archive=os.path.join(sys.argv[1],'production.dump')
          subprocess.run(['pg_dump','-Fc','-f',archive],env=env,check=True)
          if os.path.getsize(archive)==0: raise SystemExit('EMPTY_BACKUP')
          sha=hashlib.sha256(open(archive,'rb').read()).hexdigest()
          # Isolated destination is a new PostgreSQL database on the ephemeral runner;
          # there is no write access to production in this step.
          local=os.environ.copy()
          for k in ('PGHOST','PGPORT','PGUSER','PGPASSWORD','PGDATABASE','PGSSLMODE'):local.pop(k,None)
          port=os.environ['LOCAL_PGPORT']
          def sudo_pg(args, **kw):
              return subprocess.run(['sudo','-u','postgres']+args, env=local, **kw)
          def lq(sql, db='snad_g1_aclcert'):
              r=subprocess.run(['sudo','-u','postgres','psql','-p',port,'-X','-A','-t','-F','\t',
                                '-v','ON_ERROR_STOP=1','-d',db,'-c',sql],
                               env=local,check=True,capture_output=True)
              return r.stdout.decode().strip()
          # 1) Fresh destination database on the disposable local cluster.
          sudo_pg(['dropdb','-p',port,'--if-exists','snad_g1_aclcert'], check=True)
          sudo_pg(['createdb','-p',port,'snad_g1_aclcert'], check=True)
          # 2) Restore-only stub roles (NOLOGIN) for ALL production roles so that
          #    GRANT ... TO <role> statements and policy TO clauses resolve locally.
          proles=[r for r in pq("SELECT rolname FROM pg_roles ORDER BY 1").split('\n') if r]
          stubs=[r for r in proles if r!='postgres' and not r.startswith('pg_')]
          arr=','.join("'"+r.replace("'","''")+"'" for r in stubs)
          stub_sql=("DO $do$ DECLARE r text; BEGIN "
                    "FOREACH r IN ARRAY ARRAY["+arr+"] LOOP "
                    "IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname=r) THEN "
                    "EXECUTE format('CREATE ROLE %I NOLOGIN', r); END IF; END LOOP; END $do$;")
          sudo_pg(['psql','-p',port,'-X','-v','ON_ERROR_STOP=1','-d','postgres','-c',stub_sql], check=True)
          # 2b) btree_gist: application EXCLUDE USING gist constraints on uuid
          #     columns need it (run 8/9 fix; ships in PGDG contrib on the runner).
          sudo_pg(['psql','-p',port,'-X','-v','ON_ERROR_STOP=1','-d','snad_g1_aclcert',
                   '-c','CREATE EXTENSION IF NOT EXISTS btree_gist'], check=True)
          # 3) Selective TOC restore: rehearsal allowlist, but KEEP public-schema
          #    ACL entries, the SCHEMA public grant, and public DEFAULT ACLs.
          #    Real TOC format: <dumpid>; <oids> ACL <ns|-> <TYPE> <tag> <role>
          platform={'auth','storage','extensions','vault','net','graphql','graphql_public',
                    'supabase_functions','pgsodium','pgsodium_keys','cron','realtime','_realtime',
                    '_analytics','_supabase','supabase_admin'}
          toc=subprocess.run(['pg_restore','-l',archive],
                             stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True).stdout.decode()
          kept=[]
          dropped={'extension':0,'platform_schema_object':0,'acl':0,'out_of_public_scope':0}
          acl_kept=0; defacl_kept=0
          multi=('TABLE DATA ','MATERIALIZED VIEW DATA ','MATERIALIZED VIEW ',
                 'FK CONSTRAINT ','DEFAULT PRIVILEGES','DEFAULT ACL','LARGE OBJECT ',
                 'SEQUENCE OWNED BY ','SEQUENCE SET ','PUBLICATION TABLE ',
                 'ROW SECURITY ','EVENT TRIGGER ','TEXT SEARCH ',
                 'OPERATOR CLASS ','OPERATOR FAMILY ')
          for line in toc.splitlines():
              if not line.strip() or line.lstrip().startswith(';'):
                  kept.append(line); continue      # header/comment/blank lines
              if ';' not in line:
                  kept.append(line); continue      # unrecognized line: keep verbatim
              fields=line.split(';',1)[1].split()
              k=0
              while k<len(fields) and fields[k].isdigit():
                  k+=1                             # skip leading integer catalog oids
              if k>=len(fields):
                  kept.append(line); continue
              desc=' '.join(fields[k:])
              typ=''; after=[]
              for pref in multi:
                  if desc.startswith(pref):
                      typ=pref.strip(); after=desc[len(pref):].split(); break
              if not typ:
                  w=desc.split()
                  typ=w[0] if w else ''
                  after=w[1:]
              ns=after[0] if after else ''              # namespace; '-' = database-level
              tag=after[1] if len(after)>1 else ''     # first tag word (schema name for SCHEMA)
              if typ=='EXTENSION':
                  dropped['extension']+=1; continue
              if typ=='SCHEMA':
                  # public already exists in a fresh database; Supabase platform
                  # schemas are not restorable on vanilla PG 17.
                  if tag=='public' or tag in platform:
                      dropped['platform_schema_object']+=1
                  else:
                      dropped['out_of_public_scope']+=1
                  continue
              if typ=='ACL':
                  # Certify ACLs: keep entries whose object lives in schema public,
                  # plus the database-level grant ON SCHEMA public itself.
                  keep_acl = (ns=='public') or (ns=='-' and after[1:3]==['SCHEMA','public'])
                  if keep_acl:
                      kept.append(line); acl_kept+=1
                  else:
                      dropped['acl']+=1
                  continue
              if typ=='DEFAULT ACL':
                  # ALTER DEFAULT PRIVILEGES entries for schema public are part of
                  # the security posture; all other namespaces are dropped.
                  if ns=='public':
                      kept.append(line); defacl_kept+=1
                  else:
                      dropped['acl']+=1
                  continue
              if ns=='public':
                  kept.append(line); continue      # application scope: public schema only
              dropped['out_of_public_scope']+=1
          toc_path=os.path.join(sys.argv[1],'toc.filtered')
          with open(toc_path,'w') as f: f.write('\n'.join(kept)+'\n')
          os.chmod(toc_path,0o644)  # object names only; postgres user must be able to read it
          # 4) Restore WITH ACLs (no --no-acl), by filename via a postgres-owned
          #    0400 copy of the private archive; never streamed through stdin.
          arch_restore=os.path.join(sys.argv[1],'production.restore.dump')
          subprocess.run(['sudo','install','-o','postgres','-g','postgres','-m','0400',
                          archive,arch_restore], check=True)
          res=sudo_pg(['pg_restore','--exit-on-error','--no-owner',
                       '-p',port,'-L',toc_path,'-d','snad_g1_aclcert',arch_restore],
                      stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          try:
              if res.returncode:
                  err_lines=res.stderr.decode('utf-8','replace').splitlines()
                  shown=[l[:240] for l in err_lines
                         if l.startswith('pg_restore: error:')
                         and not l.startswith(('pg_restore: error: DETAIL',
                                               'pg_restore: error: CONTEXT',
                                               'pg_restore: error: HINT'))][:10]
                  print('RESTORE_ERROR_SUMMARY (object names only; data values suppressed):')
                  for l in shown: print(l)
                  raise SystemExit('RESTORE_FAILED: see RESTORE_ERROR_SUMMARY above')
          finally:
              subprocess.run(['sudo','rm','-f',arch_restore], check=False)
          # 5) Fail-closed structural equivalence: identical catalog output on
          #    production and the restored copy for every security dimension.
          Q={
            'rels':("SELECT c.relname, c.relkind, c.relrowsecurity::int, c.relforcerowsecurity::int "
                    "FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace "
                    "WHERE n.nspname='public' AND c.relkind IN ('r','p') ORDER BY 1"),
            'pol':("SELECT tablename, policyname, permissive, roles::text, cmd, coalesce(qual,''), coalesce(with_check,'') "
                   "FROM pg_policies WHERE schemaname='public' ORDER BY 1,2"),
            'tab':("SELECT c.relname, CASE a.grantee WHEN 0 THEN 'PUBLIC' ELSE r.rolname END, a.privilege_type "
                   "FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace "
                   "JOIN LATERAL aclexplode(c.relacl) a ON true "
                   "LEFT JOIN pg_roles r ON r.oid=a.grantee "
                   "WHERE n.nspname='public' AND c.relkind IN ('r','p') ORDER BY 1,2,3"),
            'seq':("SELECT c.relname, CASE a.grantee WHEN 0 THEN 'PUBLIC' ELSE r.rolname END, a.privilege_type "
                   "FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace "
                   "JOIN LATERAL aclexplode(c.relacl) a ON true "
                   "LEFT JOIN pg_roles r ON r.oid=a.grantee "
                   "WHERE n.nspname='public' AND c.relkind='S' ORDER BY 1,2,3"),
            'schema':("SELECT CASE a.grantee WHEN 0 THEN 'PUBLIC' ELSE r.rolname END, a.privilege_type "
                      "FROM pg_namespace n JOIN LATERAL aclexplode(n.nspacl) a ON true "
                      "LEFT JOIN pg_roles r ON r.oid=a.grantee "
                      "WHERE n.nspname='public' ORDER BY 1,2"),
            'col':("SELECT c.relname, a2.attname, CASE x.grantee WHEN 0 THEN 'PUBLIC' ELSE r.rolname END, x.privilege_type "
                   "FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace "
                   "JOIN pg_attribute a2 ON a2.attrelid=c.oid "
                   "JOIN LATERAL aclexplode(a2.attacl) x ON true "
                   "LEFT JOIN pg_roles r ON r.oid=x.grantee "
                   "WHERE n.nspname='public' AND c.relkind IN ('r','p') AND a2.attnum>0 AND NOT a2.attisdropped "
                   "ORDER BY 1,2,3,4"),
            'defacl':("SELECT n.nspname, d.defaclobjtype, CASE a.grantee WHEN 0 THEN 'PUBLIC' ELSE r.rolname END, a.privilege_type "
                      "FROM pg_default_acl d JOIN pg_namespace n ON n.oid=d.defaclnamespace "
                      "JOIN LATERAL aclexplode(d.defaclacl) a ON true "
                      "LEFT JOIN pg_roles r ON r.oid=a.grantee "
                      "WHERE n.nspname='public' ORDER BY 1,2,3,4"),
          }
          sets={}
          for name,q in Q.items():
              sets[name]=(pq(q), lq(q))
          restored_head=lq(sql)
          if restored_head!=head: raise SystemExit('RESTORED_FLYWAY_MISMATCH')
          diffs=[k for k,(a,b) in sets.items() if a!=b]
          if diffs:
              print('ACL_RLS_MISMATCH: '+','.join(diffs))
              for k,(a,b) in sets.items():
                  if a!=b:
                      la=[l for l in a.split('\n') if l] if a else []
                      lb=[l for l in b.split('\n') if l] if b else []
                      sa=set(la); sb=set(lb)
                      print('--- '+k+': only_in_production ---')
                      for l in sorted(sa-sb)[:15]: print(l[:200])
                      print('--- '+k+': only_in_restored ---')
                      for l in sorted(sb-sa)[:15]: print(l[:200])
              raise SystemExit('ACL_RLS_MISMATCH: see differences above (schema metadata only)')
          counts={k: len([l for l in v[0].split('\n') if l]) for k,v in sets.items()}
          summary={'result':'ACL_RLS_EQUIVALENCE_VERIFIED',
                   'source_project':'tkbrvupemreqabwzdpyq','source_flyway':head,
                   'restored_flyway':restored_head,'change_ticket':os.environ['CHANGE_TICKET'],
                   'archive_sha256':sha,
                   'compared':{'tables_and_rls_flags':counts['rels'],'rls_policies':counts['pol'],
                               'table_grants':counts['tab'],'sequence_grants':counts['seq'],
                               'schema_grants':counts['schema'],'column_grants':counts['col'],
                               'default_acls':counts['defacl']},
                   'acl_toc_entries_kept':acl_kept,'default_acl_toc_entries_kept':defacl_kept,
                   'toc_dropped':dropped,
                   'scope':'public schema: RLS enablement+force flags, policies, table/sequence/schema/column grants, default ACLs; grantee+privilege compared (grantor provenance excluded)',
                   'limitations':['ownership not certified (--no-owner restore)',
                                  'database-level default privileges outside public not compared',
                                  'platform schemas (auth/storage/extensions) out of scope',
                                  'functional RLS enforcement not exercised; structural equivalence only',
                                  'G1 security hold remains ACTIVE until independent approval']}
          with open(os.path.join(sys.argv[1],'evidence.json'),'w') as f: json.dump(summary,f,indent=2)
          print('ACL_RLS_CERTIFICATION=PASS')
          print('TABLES_AND_RLS_FLAGS='+str(counts['rels']))
          print('RLS_POLICIES='+str(counts['pol']))
          print('TABLE_GRANTS='+str(counts['tab']))
          print('SEQUENCE_GRANTS='+str(counts['seq']))
          print('SCHEMA_GRANTS='+str(counts['schema']))
          print('COLUMN_GRANTS='+str(counts['col']))
          print('DEFAULT_ACLS='+str(counts['defacl']))
          print('ARCHIVE_SHA256='+sha)
          print('NOTE=G1_REMAINING_CONDITION=INDEPENDENT_APPROVAL')
          PY
          out="$RUNNER_TEMP/acl-cert"
          rm -rf "$out"
          mkdir -p "$out"
          cp "$work/evidence.json" "$out/"

      - name: Upload certification evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: g1-acl-rls-certification
          path: ${{ runner.temp }}/acl-cert
          retention-days: 90
          if-no-files-found: error

      - name: State certification limitations
        shell: bash
        run: |
          echo "ACL/RLS structural equivalence verified between production and a restored copy (public schema)."
          echo "G1 remaining condition: independent approval, then set G1_SECURITY_APPROVED=true."
          echo "G1_SECURITY_HOLD=ACTIVE until independent approval"
