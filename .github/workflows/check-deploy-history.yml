name: Check Render Deploy History

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - name: Get recent deploys
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          set -euo pipefail
          echo "=== Last 10 deploys on sanad-backend ==="
          curl -sS --max-time 30 "https://api.render.com/v1/services/${BACKEND_ID}/deploys?limit=10" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" > /tmp/deploys.json
          python3 -c "
          import json
          with open('/tmp/deploys.json') as f:
              data = json.load(f)
          deploys = data if isinstance(data, list) else data.get('deploys', [])
          for d in deploys:
              deploy = d.get('deploy', d) if isinstance(d, dict) else {}
              print(f\"  id={deploy.get('id','?')[:30]} status={deploy.get('status','?')} created={deploy.get('createdAt','?')} finished={deploy.get('finishedAt','?')}\")
              if deploy.get('commit'):
                  print(f\"    commit={deploy['commit'].get('id','?')[:10]}\")
              if deploy.get('image'):
                  print(f\"    image={deploy['image'].get('ref','?')[:60]}\")
          "
          echo ""
          echo "=== Current service status ==="
          curl -sS --max-time 30 "https://api.render.com/v1/services/${BACKEND_ID}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f\"  name: {d.get('name','?')}\")
          print(f\"  status: {d.get('status','?')}\")
          print(f\"  url: {d.get('serviceUrl','?')}\")
          print(f\"  image: {d.get('imagePath','?')[:60]}\")
          print(f\"  createdAt: {d.get('createdAt','?')}\")
          print(f\"  updatedAt: {d.get('updatedAt','?')}\")
          "
