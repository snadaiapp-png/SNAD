name: Render DB Advisory Lock Diagnostic (read-only)

# Read-only: fetches DB creds from Render, inspects who holds Flyway's
# PostgreSQL advisory lock and the Flyway schema_history. No mutations.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: Inspect advisory locks + Flyway history (read-only)
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 8
    steps:
      - name: Query pg_locks + pg_stat_activity + flyway_schema_history
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer ${RENDER_API_KEY}"
          BASE="https://api.render.com/v1/services/${RENDER_SERVICE_ID}"
          DB_URL="$(curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/env-vars/DATABASE_URL" | jq -r '(.envVar // .).value // empty')"
          DB_USER="$(curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/env-vars/DATABASE_USERNAME" | jq -r '(.envVar // .).value // empty')"
          DB_PASS="$(curl -s --max-time 30 -H "$AUTH" -H 'Accept: application/json' "$BASE/env-vars/DATABASE_PASSWORD" | jq -r '(.envVar // .).value // empty')"
          echo "::add-mask::$DB_URL"; echo "::add-mask::$DB_USER"; echo "::add-mask::$DB_PASS"
          [ -n "$DB_URL" ] && [ -n "$DB_USER" ] && [ -n "$DB_PASS" ] || { echo "::error::missing DB creds"; exit 1; }
          # RenderDatabaseUrlConverter accepts jdbc: or postgresql:// ; psql needs a libpq URI
          PSQL_URL="${DB_URL#jdbc:}"           # jdbc:postgresql://... -> postgresql://...
          PSQL_URL="${PSQL_URL#postgresql://}"  # fallback if bare
          PSQL_URL="postgresql://${PSQL_URL}"
          echo "::add-mask::$PSQL_URL"
          export PGPASSWORD="$DB_PASS"

          echo "=== Connection target (host only) ==="
          echo "$DB_URL" | sed -E 's#(://[^:]+:)[^@]+@#\1***@#'

          run_sql () { psql "$PSQL_URL" -U "$DB_USER" -v ON_ERROR_STOP=0 -c "$1" 2>&1 || true; }

          echo ""
          echo "=== A) ALL advisory locks + granted status ==="
          run_sql "SELECT pid, locktype, objid, classid, granted, transactionid FROM pg_locks WHERE locktype = 'advisory' ORDER BY pid;"

          echo ""
          echo "=== B) Sessions holding/awaiting advisory locks (state + query + age) ==="
          run_sql "SELECT a.pid, a.state, a.application_name, a.client_addr, a.backend_start, a.state_change, age(now(), a.state_change) AS idle_for, left(a.query,120) AS query FROM pg_stat_activity a WHERE a.pid IN (SELECT pid FROM pg_locks WHERE locktype='advisory') ORDER BY a.backend_start;"

          echo ""
          echo "=== C) ALL active/idle-in-txn sessions (broad view of contention) ==="
          run_sql "SELECT pid, state, application_name, age(now(), state_change) AS since_change, left(query,80) AS query FROM pg_stat_activity WHERE state <> 'active' OR query <> '<insufficient privilege>' ORDER BY backend_start DESC LIMIT 30;"

          echo ""
          echo "=== D) Flyway schema_history (latest 12) ==="
          run_sql "SELECT installed_rank, version, description, type, script, success, installed_on FROM flyway_schema_history ORDER BY installed_rank DESC LIMIT 12;"

          echo ""
          echo "=== E) Flyway schema_history table existence + count ==="
          run_sql "SELECT count(*) AS total_rows FROM flyway_schema_history;"
