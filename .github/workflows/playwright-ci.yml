name: Playwright E2E & Visual Regression

# ============================================================
# SNAD Platform — Playwright CI Hardening (Gate 8F Item 5)
# ------------------------------------------------------------
# The visual matrix remains frontend-focused. Stateful authenticated CRM
# workflows execute once in a dedicated PostgreSQL + Spring Boot job below.
# ============================================================

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/crm/**'
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/subscription/**'
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/admin/**'
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/executive/**'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/subscription/**'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/crm/**'
      - 'apps/sanad-platform/src/main/resources/**'
      - 'apps/sanad-platform/src/test/resources/**'
      - 'docs/crm/**'
      - '.github/workflows/playwright-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/crm/**'
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/subscription/**'
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/admin/**'
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/executive/**'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/subscription/**'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/crm/**'
      - 'apps/sanad-platform/src/main/resources/**'
      - 'apps/sanad-platform/src/test/resources/**'
      - 'docs/crm/**'
      - '.github/workflows/playwright-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright E2E & Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove checked-out SHA
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci

      - name: Verify runner Chrome
        run: |
          set -euo pipefail
          google-chrome --version

      - name: Build Next.js production
        run: |
          set -euo pipefail
          npm run build

      - name: Start Next.js production server
        id: server
        shell: bash
        run: |
          set -euo pipefail
          NEXT_TELEMETRY_DISABLED=1 \
          NODE_ENV=production \
          ./node_modules/.bin/next start -H 127.0.0.1 -p 3001 \
            > "$RUNNER_TEMP/frontend.log" 2>&1 &
          SERVER_PID=$!
          echo "pid=$SERVER_PID" >> "$GITHUB_OUTPUT"

          for i in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3001/ > /dev/null 2>&1; then
              echo "Server ready after $((i*3))s"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Server did not become ready within 60s"
          tail -50 "$RUNNER_TEMP/frontend.log" || true
          exit 1

      - name: Run Playwright tests (E2E matrix + Visual Regression)
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.standard.config.ts --reporter=html,list

      - name: Stop server
        if: always()
        shell: bash
        run: |
          kill ${{ steps.server.outputs.pid }} 2>/dev/null || true
          wait ${{ steps.server.outputs.pid }} 2>/dev/null || true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: apps/web/playwright-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test results (screenshots, traces, videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload frontend server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-server-log-${{ github.run_id }}
          path: ${{ runner.temp }}/frontend.log
          if-no-files-found: warn
          retention-days: 14

  crm-authenticated:
    name: CRM Authenticated E2E (PostgreSQL Direct + Spring Boot + Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/sanad_test
      DATABASE_USERNAME: sanad_test
      DATABASE_NAME: sanad_test
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad_test
      SPRING_DATASOURCE_USERNAME: sanad_test
      SPRING_PROFILES_ACTIVE: crm-acceptance
      SPRING_FLYWAY_OUT_OF_ORDER: 'true'
      FLYWAY_ENABLED: 'true'
      FLYWAY_BASELINE_ON_MIGRATE: 'true'
      FLYWAY_VALIDATE_ON_MIGRATE: 'true'
      JPA_DDL_AUTO: validate
      SERVER_PORT: '8080'
      JWT_ISSUER: sanad-platform-ci
      JWT_ACCESS_TOKEN_TTL: 60m
      REFRESH_TOKEN_TTL: 720h
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
      BOOTSTRAP_ENABLED: 'false'
      SANAD_CORS_ALLOWED_ORIGINS: http://127.0.0.1:3001
      SANAD_CRM_IMPORT_WORKER_ENABLED: 'true'
      SANAD_CRM_IMPORT_WORKER_INITIAL_DELAY_MS: '2000'
      SANAD_CRM_IMPORT_WORKER_DELAY_MS: '2000'
      SECURITY_NOTIFICATION_PROVIDER: disabled
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
      SANAD_SERVICE_AUTH_JWT_SECRET: 'ci-only-non-production-jwt-secret-key-32-chars-min'
      SANAD_WORKFLOW_ENGINE_BASE_URL: 'http://127.0.0.1:8080'
      SANAD_AI_GATEWAY_BASE_URL: 'http://127.0.0.1:8080'
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"

      - name: Generate ephemeral CRM acceptance database password
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          test -n "$password"
          echo "::add-mask::$password"
          echo "DATABASE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "SPRING_DATASOURCE_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start host-native PostgreSQL (no containers)
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || {
            echo "::error::ENVIRONMENT_BLOCKER=HOST_NATIVE_POSTGRESQL_UNAVAILABLE"
            exit 1
          }
          psql --version
          sudo systemctl start postgresql || {
            echo "::error::ENVIRONMENT_BLOCKER=HOST_NATIVE_POSTGRESQL_START_FAILED"
            exit 1
          }
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432

      - name: Provision least-privilege CRM acceptance database
        shell: bash
        run: |
          set -euo pipefail
          : "${DATABASE_PASSWORD:?ephemeral database password missing}"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -v database_password="$DATABASE_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE sanad_test WITH LOGIN PASSWORD %L', :'database_password')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad_test')\gexec
          SELECT format('ALTER ROLE sanad_test WITH LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS', :'database_password')\gexec
          SELECT 'CREATE DATABASE sanad_test OWNER sanad_test'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'sanad_test')\gexec
          ALTER DATABASE sanad_test OWNER TO sanad_test;
          \c sanad_test
          GRANT USAGE, CREATE ON SCHEMA public TO sanad_test;
          SQL
          role_contract="$(sudo -u postgres psql -Atqc "SELECT rolsuper::text || '|' || rolcreatedb::text || '|' || rolcreaterole::text || '|' || rolbypassrls::text FROM pg_roles WHERE rolname='sanad_test'")"
          echo "CRM_ACCEPTANCE_ROLE_CONTRACT=$role_contract"
          test "$role_contract" = "false|false|false|false"
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" \
            -v ON_ERROR_STOP=1 -Atqc 'SELECT current_database(), current_user'

      - name: Provision and verify restricted sanad runtime role before Flyway
        shell: bash
        run: |
          set -euo pipefail
          # This role is required by V20261011_3. It is a restricted policy
          # principal in the isolated runner cluster, not a migration owner.
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $role$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad') THEN
              CREATE ROLE sanad LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
            END IF;
          END $role$;
          ALTER ROLE sanad NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          SQL
          contract="$(sudo -u postgres psql -Atqc "SELECT rolcanlogin::text || '|' || rolsuper::text || '|' || rolcreatedb::text || '|' || rolcreaterole::text || '|' || rolinherit::text || '|' || rolbypassrls::text FROM pg_roles WHERE rolname='sanad'")"
          test "$contract" = "true|false|false|false|false|false" || {
            echo "::error::G1_RESTRICTED_ROLE_CONTRACT_FAILED"
            exit 1
          }
          echo 'G1_RESTRICTED_RUNTIME_ROLE_PRESENT=YES'
          # PostgreSQL 16+: policy role membership is inheritable without
          # permitting SET ROLE. The CI login remains non-superuser/NOBYPASSRLS.
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          GRANT sanad TO sanad_test WITH INHERIT TRUE, SET FALSE;
          SQL
          inherited="$(sudo -u postgres psql -Atqc "SELECT pg_has_role('sanad_test', 'sanad', 'USAGE')::text")"
          test "$inherited" = true || {
            echo "::error::G1_RLS_POLICY_ROLE_NOT_INHERITED"
            exit 1
          }
          role_guard="$(sudo -u postgres psql -Atqc "SELECT rolsuper::text || '|' || rolbypassrls::text FROM pg_roles WHERE rolname='sanad_test'")"
          test "$role_guard" = 'false|false'
          echo 'G1_RLS_POLICY_ROLE_INHERITED=YES'
          # Does not assert full G1 isolation certification: the CI application
          # session still uses its dedicated per-job acceptance database role.

      - name: Generate isolated CI credentials
        shell: bash
        run: |
          set -euo pipefail
          echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "SANAD_CONTROL_PLANE_TENANT_ID=$(uuidgen)" >> "$GITHUB_ENV"
          echo "CRM_CUSTOM_FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo 'CRM_TENANT_A_EMAIL=tenant-a-admin@snad-crm-acceptance.example' >> "$GITHUB_ENV"
          echo 'CRM_TENANT_A_PASSWORD=TestPass123!' >> "$GITHUB_ENV" # gitleaks:allow -- synthetic isolated CI fixture
          echo 'CRM_TENANT_B_EMAIL=tenant-b-admin@snad-crm-acceptance.example' >> "$GITHUB_ENV"
          echo 'CRM_TENANT_A_ID=11111111-1111-4111-8111-111111111111' >> "$GITHUB_ENV"
          echo 'CRM_TENANT_B_ID=22222222-2222-4222-8222-222222222222' >> "$GITHUB_ENV"
          echo 'CRM_TENANT_B_PASSWORD=TestPass123!' >> "$GITHUB_ENV" # gitleaks:allow -- synthetic isolated CI fixture
          echo 'CRM_READONLY_EMAIL=tenant-a-readonly@snad-crm-acceptance.example' >> "$GITHUB_ENV"
          echo 'CRM_READONLY_PASSWORD=TestPass123!' >> "$GITHUB_ENV" # gitleaks:allow -- synthetic isolated CI fixture
          echo 'CRM_LEAD_WRITER_EMAIL=tenant-a-lead-writer@snad-crm-acceptance.example' >> "$GITHUB_ENV"
          echo 'CRM_LEAD_WRITER_PASSWORD=TestPass123!' >> "$GITHUB_ENV" # gitleaks:allow -- synthetic isolated CI fixture
          echo 'CRM_IMPORT_READER_EMAIL=tenant-a-import-reader@snad-crm-acceptance.example' >> "$GITHUB_ENV"
          echo 'CRM_IMPORT_READER_PASSWORD=TestPass123!' >> "$GITHUB_ENV" # gitleaks:allow -- synthetic isolated CI fixture

      - name: Validate acceptance seed
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/crm/validate_seed_uuids.py apps/sanad-platform/src/test/resources/sql/crm-acceptance-seed.sql

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build Spring Boot backend
        working-directory: apps/sanad-platform
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dmaven.test.skip=true clean package

      - name: Run Flyway migrations
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress --update-snapshots org.flywaydb:flyway-maven-plugin:11.7.2:migrate \
            -Dflyway.url="$DATABASE_URL" \
            -Dflyway.user="$DATABASE_USERNAME" \
            -Dflyway.password="$DATABASE_PASSWORD" \
            -Dflyway.locations=classpath:db/migration,classpath:db/vendor/postgresql \
            -Dflyway.baselineOnMigrate=true \
            -Dflyway.validateOnMigrate=true \
            -Dflyway.outOfOrder=true \
            -Dflyway.baselineVersion=0

      - name: Seed CRM acceptance data
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" \
            -v ON_ERROR_STOP=1 \
            -f src/test/resources/sql/crm-acceptance-seed.sql
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" \
            -v ON_ERROR_STOP=1 \
            -f src/test/resources/sql/crm-acceptance-subscription-seed.sql

      - name: Verify seeded identities under tenant-scoped RLS
        shell: bash
        run: |
          set -euo pipefail
          # Verify using the restricted CI login, not the postgres owner.
          # Each transaction has exactly one tenant-local context.
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" \
            -X -v ON_ERROR_STOP=1 -At <<'SQL'
          BEGIN;
          SELECT set_config('app.tenant_id', '11111111-1111-4111-8111-111111111111', true);
          DO $check$
          DECLARE own_count integer; foreign_count integer;
          BEGIN
            SELECT count(*) INTO own_count FROM users WHERE
              email IN ('tenant-a-admin@snad-crm-acceptance.example',
                        'tenant-a-readonly@snad-crm-acceptance.example',
                        'tenant-a-lead-writer@snad-crm-acceptance.example',
                        'tenant-a-import-reader@snad-crm-acceptance.example');
            SELECT count(*) INTO foreign_count FROM users
              WHERE email='tenant-b-admin@snad-crm-acceptance.example';
            IF own_count <> 4 OR foreign_count <> 0 THEN
              RAISE EXCEPTION 'G1_SEED_TENANT_A_ISOLATION_FAILED own=%, foreign=%', own_count, foreign_count;
            END IF;
          END $check$;
          COMMIT;
          BEGIN;
          SELECT set_config('app.tenant_id', '22222222-2222-4222-8222-222222222222', true);
          DO $check$
          DECLARE own_count integer; foreign_count integer;
          BEGIN
            SELECT count(*) INTO own_count FROM users
              WHERE email='tenant-b-admin@snad-crm-acceptance.example';
            SELECT count(*) INTO foreign_count FROM users
              WHERE email LIKE 'tenant-a-%@snad-crm-acceptance.example';
            IF own_count <> 1 OR foreign_count <> 0 THEN
              RAISE EXCEPTION 'G1_SEED_TENANT_B_ISOLATION_FAILED own=%, foreign=%', own_count, foreign_count;
            END IF;
          END $check$;
          COMMIT;
          BEGIN;
          SELECT set_config('app.tenant_id', '', true);
          DO $check$
          BEGIN
            IF (SELECT count(*) FROM users) <> 0 THEN
              RAISE EXCEPTION 'G1_SEED_FAIL_CLOSED_MISSING_CONTEXT';
            END IF;
          END $check$;
          ROLLBACK;
          SQL
          echo 'G1_SEEDED_USERS_RLS_ISOLATION=PASS'

      - name: Start Spring Boot backend
        id: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/crm-acceptance"
          BACKEND_LOG="$RUNNER_TEMP/crm-acceptance/backend.log"
          JAR_PATH="$(find apps/sanad-platform/target -name 'sanad-platform-*.jar' ! -name '*-sources.jar' | head -n1)"
          test -n "$JAR_PATH"
          java -jar "$JAR_PATH" --spring.profiles.active=crm-acceptance --spring.flyway.out-of-order=true > "$BACKEND_LOG" 2>&1 &
          BACKEND_PID=$!
          echo "pid=$BACKEND_PID" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then exit 0; fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              tail -120 "$BACKEND_LOG" || true
              exit 1
            fi
            sleep 3
          done
          tail -120 "$BACKEND_LOG" || true
          exit 1

      - name: Smoke-test all seeded logins
        shell: bash
        run: |
          set -euo pipefail
          login_check() {
            local email="$1"
            local password="$2"
            local tenant_id="$3"
            curl --fail --silent --show-error \
              -X POST http://127.0.0.1:8080/api/v1/auth/login \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"${email}\",\"password\":\"${password}\",\"tenantId\":\"${tenant_id}\"}" \
              | python3 -c 'import json,sys; assert json.load(sys.stdin).get("accessToken")'
          }
          login_check "$CRM_TENANT_A_EMAIL" "$CRM_TENANT_A_PASSWORD" "11111111-1111-4111-8111-111111111111"
          login_check "$CRM_TENANT_B_EMAIL" "$CRM_TENANT_B_PASSWORD" "22222222-2222-4222-8222-222222222222"
          login_check "$CRM_READONLY_EMAIL" "$CRM_READONLY_PASSWORD" "11111111-1111-4111-8111-111111111111"
          login_check "$CRM_LEAD_WRITER_EMAIL" "$CRM_LEAD_WRITER_PASSWORD" "11111111-1111-4111-8111-111111111111"
          login_check "$CRM_IMPORT_READER_EMAIL" "$CRM_IMPORT_READER_PASSWORD" "11111111-1111-4111-8111-111111111111"

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Verify runner Chrome
        working-directory: apps/web
        run: google-chrome --version

      - name: Build Next.js production bundle
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
        run: npm run build

      - name: Start Next.js frontend
        id: frontend
        working-directory: apps/web
        env:
          BACKEND_API_BASE_URL: http://127.0.0.1:8080
        shell: bash
        run: |
          set -euo pipefail
          FRONTEND_LOG="$RUNNER_TEMP/crm-acceptance/frontend.log"
          NEXT_TELEMETRY_DISABLED=1 NODE_ENV=production \
            ./node_modules/.bin/next start -H 127.0.0.1 -p 3001 > "$FRONTEND_LOG" 2>&1 &
          FRONTEND_PID=$!
          echo "pid=$FRONTEND_PID" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/ >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -100 "$FRONTEND_LOG" || true
          exit 1

      - name: Run stateful authenticated CRM suites exactly once
        working-directory: apps/web
        env:
          SANAD_BACKEND_BASE_URL: http://127.0.0.1:8080
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.crm-acceptance.config.ts --reporter=html,list

      - name: Stop services
        if: always()
        shell: bash
        run: |
          kill ${{ steps.frontend.outputs.pid }} 2>/dev/null || true
          kill ${{ steps.backend.outputs.pid }} 2>/dev/null || true

      - name: Upload CRM acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-authenticated-e2e-${{ github.run_id }}
          path: |
            apps/web/crm-playwright-report/
            apps/web/test-results/
            ${{ runner.temp }}/crm-acceptance/*.log
          if-no-files-found: warn
          retention-days: 30


  subscription-authenticated:
    name: Subscription E2E (PostgreSQL Direct + Spring Boot + Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/sanad_subscription_test
      DATABASE_USERNAME: sanad_subscription_test
      DATABASE_NAME: sanad_subscription_test
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad_subscription_test
      SPRING_DATASOURCE_USERNAME: sanad_subscription_test
      SPRING_PROFILES_ACTIVE: crm-acceptance
      SPRING_FLYWAY_OUT_OF_ORDER: 'true'
      FLYWAY_ENABLED: 'true'
      FLYWAY_BASELINE_ON_MIGRATE: 'true'
      FLYWAY_VALIDATE_ON_MIGRATE: 'true'
      JPA_DDL_AUTO: validate
      SERVER_PORT: '8080'
      JWT_ISSUER: sanad-platform-ci
      JWT_ACCESS_TOKEN_TTL: 60m
      REFRESH_TOKEN_TTL: 720h
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
      BOOTSTRAP_ENABLED: 'false'
      SANAD_CORS_ALLOWED_ORIGINS: http://127.0.0.1:3001
      SANAD_CRM_IMPORT_WORKER_ENABLED: 'false'
      SECURITY_NOTIFICATION_PROVIDER: disabled
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
      SANAD_SERVICE_AUTH_JWT_SECRET: 'ci-only-non-production-jwt-secret-key-32-chars-min'
      SANAD_WORKFLOW_ENGINE_BASE_URL: 'http://127.0.0.1:8080'
      SANAD_AI_GATEWAY_BASE_URL: 'http://127.0.0.1:8080'
      SANAD_CONTROL_PLANE_TENANT_ID: '11111111-1111-4111-8111-111111111111'
      SUBSCRIPTION_ACCEPTANCE_ID: '44444444-4444-4444-8444-444444444444'
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          echo "expected=$expected actual=$actual"
          test "$actual" = "$expected"

      - name: Generate ephemeral subscription database password
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          test -n "$password"
          echo "::add-mask::$password"
          echo "DATABASE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "SPRING_DATASOURCE_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start host-native PostgreSQL (no containers)
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || {
            echo "::error::ENVIRONMENT_BLOCKER=HOST_NATIVE_POSTGRESQL_UNAVAILABLE"
            exit 1
          }
          sudo systemctl start postgresql
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432

      - name: Provision least-privilege subscription acceptance database
        shell: bash
        run: |
          set -euo pipefail
          : "${DATABASE_PASSWORD:?ephemeral database password missing}"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -v database_password="$DATABASE_PASSWORD" <<'SQL'
          SELECT format('CREATE ROLE sanad_subscription_test WITH LOGIN PASSWORD %L', :'database_password')
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad_subscription_test')\gexec
          SELECT format('ALTER ROLE sanad_subscription_test WITH LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS', :'database_password')\gexec
          SELECT 'CREATE DATABASE sanad_subscription_test OWNER sanad_subscription_test'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'sanad_subscription_test')\gexec
          ALTER DATABASE sanad_subscription_test OWNER TO sanad_subscription_test;
          \c sanad_subscription_test
          GRANT USAGE, CREATE ON SCHEMA public TO sanad_subscription_test;
          SQL
          role_contract="$(sudo -u postgres psql -Atqc "SELECT rolsuper::text || '|' || rolcreatedb::text || '|' || rolcreaterole::text || '|' || rolbypassrls::text FROM pg_roles WHERE rolname='sanad_subscription_test'")"
          echo "SUBSCRIPTION_ACCEPTANCE_ROLE_CONTRACT=$role_contract"
          test "$role_contract" = "false|false|false|false"

      - name: Provision and verify restricted sanad runtime role before Flyway
        shell: bash
        run: |
          set -euo pipefail
          # This role is required by V20261011_3. It is a restricted policy
          # principal in the isolated runner cluster, not a migration owner.
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $role$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad') THEN
              CREATE ROLE sanad LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
            END IF;
          END $role$;
          ALTER ROLE sanad NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          SQL
          contract="$(sudo -u postgres psql -Atqc "SELECT rolcanlogin::text || '|' || rolsuper::text || '|' || rolcreatedb::text || '|' || rolcreaterole::text || '|' || rolinherit::text || '|' || rolbypassrls::text FROM pg_roles WHERE rolname='sanad'")"
          test "$contract" = "true|false|false|false|false|false" || {
            echo "::error::G1_RESTRICTED_ROLE_CONTRACT_FAILED"
            exit 1
          }
          echo 'G1_RESTRICTED_RUNTIME_ROLE_PRESENT=YES'
          # PostgreSQL 16+: policy role membership is inheritable without
          # permitting SET ROLE. The CI login remains non-superuser/NOBYPASSRLS.
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          GRANT sanad TO sanad_subscription_test WITH INHERIT TRUE, SET FALSE;
          SQL
          inherited="$(sudo -u postgres psql -Atqc "SELECT pg_has_role('sanad_subscription_test', 'sanad', 'USAGE')::text")"
          test "$inherited" = true || {
            echo "::error::G1_RLS_POLICY_ROLE_NOT_INHERITED"
            exit 1
          }
          role_guard="$(sudo -u postgres psql -Atqc "SELECT rolsuper::text || '|' || rolbypassrls::text FROM pg_roles WHERE rolname='sanad_subscription_test'")"
          test "$role_guard" = 'false|false'
          echo 'G1_RLS_POLICY_ROLE_INHERITED=YES'
          # Does not assert full G1 isolation certification: the CI application
          # session still uses its dedicated per-job acceptance database role.

      - name: Generate isolated CI credentials
        shell: bash
        run: |
          set -euo pipefail
          echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"
          echo "CRM_CUSTOM_FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')" >> "$GITHUB_ENV"
          echo 'CRM_TENANT_A_EMAIL=tenant-a-admin@snad-crm-acceptance.example' >> "$GITHUB_ENV"
          echo 'CRM_TENANT_A_PASSWORD=TestPass123!' >> "$GITHUB_ENV" # gitleaks:allow -- synthetic isolated CI fixture
          echo 'CRM_TENANT_A_ID=11111111-1111-4111-8111-111111111111' >> "$GITHUB_ENV"
          echo 'SUBSCRIPTION_ADMIN_EMAIL=tenant-a-admin@snad-crm-acceptance.example' >> "$GITHUB_ENV"
          echo 'SUBSCRIPTION_ADMIN_PASSWORD=TestPass123!' >> "$GITHUB_ENV" # gitleaks:allow -- synthetic isolated CI fixture

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build Spring Boot backend
        working-directory: apps/sanad-platform
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dmaven.test.skip=true clean package

      - name: Run Flyway migrations
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress --update-snapshots org.flywaydb:flyway-maven-plugin:11.7.2:migrate \
            -Dflyway.url="$DATABASE_URL" \
            -Dflyway.user="$DATABASE_USERNAME" \
            -Dflyway.password="$DATABASE_PASSWORD" \
            -Dflyway.locations=classpath:db/migration,classpath:db/vendor/postgresql \
            -Dflyway.baselineOnMigrate=true \
            -Dflyway.validateOnMigrate=true \
            -Dflyway.outOfOrder=true \
            -Dflyway.baselineVersion=0

      - name: Seed control-plane admin and subscription fixture
        working-directory: apps/sanad-platform
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" \
            -v ON_ERROR_STOP=1 -f src/test/resources/sql/crm-acceptance-seed.sql
          PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" \
            -v ON_ERROR_STOP=1 -f src/test/resources/sql/subscription-acceptance-seed.sql

      - name: Verify seeded subscription contract
        shell: bash
        run: |
          set -euo pipefail
          # tenant_subscriptions is fail-closed FORCE RLS (V20261029_1): the
          # verification read runs under the owning tenant's transaction-local
          # scope (SET LOCAL dies with the statement's transaction).
          state="$(PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" -Atqc \
            "BEGIN; SELECT set_config('app.tenant_id', '${SANAD_CONTROL_PLANE_TENANT_ID}', true); SELECT status || '|' || plan_id::text || '|' || plan_version_id::text FROM tenant_subscriptions WHERE id = '$SUBSCRIPTION_ACCEPTANCE_ID'; COMMIT;")"
          test "$state" = "ACTIVE|33333333-3333-4333-8333-333333333333|33333333-3333-4333-8333-333333333334"

      - name: Start Spring Boot backend
        id: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/subscription-acceptance"
          BACKEND_LOG="$RUNNER_TEMP/subscription-acceptance/backend.log"
          JAR_PATH="$(find apps/sanad-platform/target -name 'sanad-platform-*.jar' ! -name '*-sources.jar' | head -n1)"
          test -n "$JAR_PATH"
          java -jar "$JAR_PATH" --spring.profiles.active=crm-acceptance --spring.flyway.out-of-order=true > "$BACKEND_LOG" 2>&1 &
          BACKEND_PID=$!
          echo "pid=$BACKEND_PID" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then exit 0; fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              tail -120 "$BACKEND_LOG" || true
              exit 1
            fi
            sleep 3
          done
          tail -120 "$BACKEND_LOG" || true
          exit 1

      - name: Smoke-test control-plane admin login
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$SUBSCRIPTION_ADMIN_EMAIL\",\"password\":\"$SUBSCRIPTION_ADMIN_PASSWORD\",\"tenantId\":\"$SANAD_CONTROL_PLANE_TENANT_ID\"}" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("accessToken"); assert data["user"]["tenantId"]=="11111111-1111-4111-8111-111111111111"'

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Verify runner Chrome
        working-directory: apps/web
        run: google-chrome --version

      - name: Build Next.js production bundle
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8080
        run: npm run build

      - name: Start Next.js frontend
        id: frontend
        working-directory: apps/web
        env:
          BACKEND_API_BASE_URL: http://127.0.0.1:8080
        shell: bash
        run: |
          set -euo pipefail
          FRONTEND_LOG="$RUNNER_TEMP/subscription-acceptance/frontend.log"
          NEXT_TELEMETRY_DISABLED=1 NODE_ENV=production \
            ./node_modules/.bin/next start -H 127.0.0.1 -p 3001 > "$FRONTEND_LOG" 2>&1 &
          FRONTEND_PID=$!
          echo "pid=$FRONTEND_PID" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/ >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -100 "$FRONTEND_LOG" || true
          exit 1

      - name: Run subscription authenticated acceptance exactly once
        working-directory: apps/web
        env:
          SANAD_BACKEND_BASE_URL: http://127.0.0.1:8080
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.subscription-acceptance.config.ts --reporter=html,list

      - name: Verify durable cancellation state and ledgers
        shell: bash
        run: |
          set -euo pipefail
          state="$(PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" -Atqc \
            "SELECT status || '|' || cancel_at_period_end::text FROM tenant_subscriptions WHERE id = '$SUBSCRIPTION_ACCEPTANCE_ID'")"
          echo "SUBSCRIPTION_FINAL_STATE=$state"
          test "$state" = "CANCELLED|false"

          commands="$(PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" -Atqc \
            "SELECT COUNT(*) FROM subscription_commands WHERE subscription_id = '$SUBSCRIPTION_ACCEPTANCE_ID' AND command = 'CANCEL' AND from_status = 'ACTIVE' AND to_status = 'CANCELLED' AND actor_user_id IS NOT NULL")"
          test "$commands" = "1"

          events="$(PGPASSWORD="$DATABASE_PASSWORD" psql \
            -h 127.0.0.1 -U "$DATABASE_USERNAME" -d "$DATABASE_NAME" -Atqc \
            "SELECT COUNT(*) FROM subscription_change_events WHERE subscription_id = '$SUBSCRIPTION_ACCEPTANCE_ID' AND action = 'SUBSCRIPTION.CANCELLED'")"
          test "$events" = "1"

      - name: Stop subscription acceptance services
        if: always()
        shell: bash
        run: |
          kill ${{ steps.frontend.outputs.pid }} 2>/dev/null || true
          kill ${{ steps.backend.outputs.pid }} 2>/dev/null || true

      - name: Upload subscription acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subscription-authenticated-e2e-${{ github.run_id }}
          path: |
            apps/web/subscription-playwright-report/
            apps/web/test-results/
            ${{ runner.temp }}/subscription-acceptance/*.log
          if-no-files-found: warn
          retention-days: 30
