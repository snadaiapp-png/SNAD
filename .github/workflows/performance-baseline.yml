name: Performance Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sanad-platform/**'
      - 'performance/k6/**'
      - '.github/workflows/performance-baseline.yml'
      - 'docs/production-readiness/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  JWT_SECRET: ci-only-non-production-validation-key-1234567890
  SANAD_SERVICE_AUTH_JWT_SECRET: 'ci-only-non-production-jwt-secret-key-32-chars-min'
  SANAD_WORKFLOW_ENGINE_BASE_URL: 'http://localhost:8081'
  SANAD_AI_GATEWAY_BASE_URL: 'http://localhost:8081'

jobs:
  crm-033-authenticated-benchmark:
    name: CRM-033 Authenticated Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # Deterministic HMAC key for the perf-test profile (CI-only value; the
      # profile is never active in production). Secrets are environment-driven.
      PERF_TEST_JWT_SECRET: ci-only-non-production-validation-key-1234567890
      SANAD_SERVICE_AUTH_JWT_SECRET: 'ci-only-non-production-jwt-secret-key-32-chars-min'
      SANAD_WORKFLOW_ENGINE_BASE_URL: 'http://localhost:8081'
      SANAD_AI_GATEWAY_BASE_URL: 'http://localhost:8081'
      PERF_TEST_ADMIN_EMAIL: perf-admin@sanad.local
      PERF_TEST_ADMIN_PASSWORD: CiOnlyPerfAdmin!2026
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad_perf
      SPRING_DATASOURCE_USERNAME: sanad_perf
      SPRING_DATASOURCE_PASSWORD: sanad_perf_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_FLYWAY_OUT_OF_ORDER: 'true'
      FLYWAY_ENABLED: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start host-native PostgreSQL (no containers)
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || {
            echo "::error::ENVIRONMENT_BLOCKER=HOST_NATIVE_POSTGRESQL_UNAVAILABLE"
            exit 1
          }
          psql --version
          sudo systemctl start postgresql || {
            echo "::error::ENVIRONMENT_BLOCKER=HOST_NATIVE_POSTGRESQL_START_FAILED"
            exit 1
          }
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432

      - name: Provision least-privilege performance database
        shell: bash
        run: |
          set -euo pipefail
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $sanad_perf$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad_perf') THEN
              CREATE ROLE sanad_perf WITH LOGIN PASSWORD 'sanad_perf_pass';
            END IF;
          END $sanad_perf$;
          ALTER ROLE sanad_perf NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          SELECT 'CREATE DATABASE sanad_perf OWNER sanad_perf'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'sanad_perf')\gexec
          ALTER DATABASE sanad_perf OWNER TO sanad_perf;
          \c sanad_perf
          GRANT USAGE, CREATE ON SCHEMA public TO sanad_perf;
          SQL
          role_contract="$(sudo -u postgres psql -Atqc "SELECT rolsuper::text || '|' || rolcreatedb::text || '|' || rolcreaterole::text || '|' || rolbypassrls::text FROM pg_roles WHERE rolname='sanad_perf'")"
          echo "PERF_ROLE_CONTRACT=$role_contract"
          test "$role_contract" = "false|false|false|false"
          PGPASSWORD="$SPRING_DATASOURCE_PASSWORD" psql \
            -h 127.0.0.1 -U "$SPRING_DATASOURCE_USERNAME" -d sanad_perf \
            -v ON_ERROR_STOP=1 -Atqc 'SELECT current_database(), current_user'


      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up host-native k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: 0.55.0

      - name: Start backend on perf-test profile
        working-directory: apps/sanad-platform
        run: |
          set -euo pipefail
          mkdir -p ../../performance/results
          nohup mvn -q -DskipTests spring-boot:run \
            -Dspring-boot.run.profiles=perf-test \
            -Dspring-boot.run.arguments="--server.port=8080" \
            > ../../performance/results/crm-perf-backend-startup.log 2>&1 &
          echo $! > /tmp/sanad-crm-perf-app.pid

      - name: Wait for health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if ! kill -0 "$(cat /tmp/sanad-crm-perf-app.pid)" 2>/dev/null; then
              echo "::error::sanad perf-test app process exited before becoming healthy"
              cat performance/results/crm-perf-backend-startup.log || true
              exit 1
            fi

            code=$(curl -sS -o /tmp/crm-perf-health.json -w '%{http_code}' http://localhost:8080/actuator/health || true)
            echo "attempt=$attempt health_http=$code"
            [ -s /tmp/crm-perf-health.json ] && cat /tmp/crm-perf-health.json || true
            echo
            if [ "$code" = '200' ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::SANAD perf-test profile did not become healthy for CRM-033 benchmark"
          cat performance/results/crm-perf-backend-startup.log || true
          exit 1

      - name: Run CRM-033 k6 benchmark
        run: |
          set -euo pipefail
          mkdir -p performance/results
          BASE_URL=http://localhost:8080 \
          PERF_TEST_ADMIN_EMAIL="$PERF_TEST_ADMIN_EMAIL" \
          PERF_TEST_ADMIN_PASSWORD="$PERF_TEST_ADMIN_PASSWORD" \
          OUTPUT_FILE="$PWD/performance/results/crm-perf-baseline.json" \
          k6 run \
            --summary-export="$PWD/performance/results/crm-perf-summary.json" \
            "$PWD/performance/k6/crm-performance-baseline.js"

      - name: Publish CRM-033 summary
        if: always()
        run: |
          {
            echo '## CRM-033 Authenticated Performance Benchmark'
            echo ''
            echo '- Scenario: 50 RPS constant-arrival-rate for 10 minutes'
            echo '- Endpoints: dashboard, accounts-list, customer-360, lead-conversion'
            echo '- Authentication: automatic login via /api/v1/auth/login (perf-test profile seed)'
            echo '- Failure threshold: less than 1%'
            echo '- p95 target: below 500 ms'
            echo '- p99 target: below 1000 ms'
            echo '- Runtime database: host-native PostgreSQL Direct (least-privilege role)'
            echo '- Startup log artifact: `crm-perf-backend-startup.log`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CRM-033 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-033-performance-results
          path: performance/results/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/sanad-crm-perf-app.pid ]; then
            kill "$(cat /tmp/sanad-crm-perf-app.pid)" 2>/dev/null || true
          fi

  backend-health-baseline:
    name: Backend Health Load Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad_health
      SPRING_DATASOURCE_USERNAME: sanad_health
      SPRING_DATASOURCE_PASSWORD: sanad_health_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_FLYWAY_OUT_OF_ORDER: 'true'
      FLYWAY_ENABLED: 'true'
      JPA_DDL_AUTO: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start host-native PostgreSQL (no containers)
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || {
            echo "::error::ENVIRONMENT_BLOCKER=HOST_NATIVE_POSTGRESQL_UNAVAILABLE"
            exit 1
          }
          psql --version
          sudo systemctl start postgresql || {
            echo "::error::ENVIRONMENT_BLOCKER=HOST_NATIVE_POSTGRESQL_START_FAILED"
            exit 1
          }
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432

      - name: Provision least-privilege health baseline database
        shell: bash
        run: |
          set -euo pipefail
          sudo -u postgres psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $sanad_health$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sanad_health') THEN
              CREATE ROLE sanad_health WITH LOGIN PASSWORD 'sanad_health_pass';
            END IF;
          END $sanad_health$;
          ALTER ROLE sanad_health NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          SELECT 'CREATE DATABASE sanad_health OWNER sanad_health'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'sanad_health')\gexec
          ALTER DATABASE sanad_health OWNER TO sanad_health;
          \c sanad_health
          GRANT USAGE, CREATE ON SCHEMA public TO sanad_health;
          SQL
          role_contract="$(sudo -u postgres psql -Atqc "SELECT rolsuper::text || '|' || rolcreatedb::text || '|' || rolcreaterole::text || '|' || rolbypassrls::text FROM pg_roles WHERE rolname='sanad_health'")"
          echo "HEALTH_ROLE_CONTRACT=$role_contract"
          test "$role_contract" = "false|false|false|false"
          PGPASSWORD="$SPRING_DATASOURCE_PASSWORD" psql \
            -h 127.0.0.1 -U "$SPRING_DATASOURCE_USERNAME" -d sanad_health \
            -v ON_ERROR_STOP=1 -Atqc 'SELECT current_database(), current_user'


      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up host-native k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: 0.55.0

      - name: Start backend on local CI profile
        working-directory: apps/sanad-platform
        run: |
          set -euo pipefail
          mkdir -p ../../performance/results
          nohup mvn -q -DskipTests spring-boot:run \
            -Dspring-boot.run.profiles=local \
            -Dspring-boot.run.arguments="--server.port=8080 --management.endpoints.web.exposure.include=health,info --management.endpoint.health.show-details=always" \
            > ../../performance/results/backend-startup.log 2>&1 &
          echo $! > /tmp/sanad-perf-app.pid

      - name: Wait for health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if ! kill -0 "$(cat /tmp/sanad-perf-app.pid)" 2>/dev/null; then
              echo "::error::sanad local performance app process exited before becoming healthy"
              cat performance/results/backend-startup.log || true
              exit 1
            fi

            code=$(curl -sS -o /tmp/perf-health.json -w '%{http_code}' http://localhost:8080/actuator/health || true)
            echo "attempt=$attempt health_http=$code"
            [ -s /tmp/perf-health.json ] && cat /tmp/perf-health.json || true
            echo
            if [ "$code" = '200' ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::SANAD local profile did not become healthy for performance baseline"
          cat performance/results/backend-startup.log || true
          exit 1

      - name: Run k6 baseline
        run: |
          set -euo pipefail
          mkdir -p performance/results
          BASE_URL=http://localhost:8080 \
          k6 run \
            --summary-export="$PWD/performance/results/health-baseline-summary.json" \
            "$PWD/performance/k6/health-baseline.js"

      - name: Publish baseline summary
        if: always()
        run: |
          {
            echo '## SANAD Performance Baseline'
            echo ''
            echo '- Scenario: 10 constant virtual users for 60 seconds'
            echo '- Endpoint: `/actuator/health`'
            echo '- Failure threshold: less than 1%'
            echo '- p95 target: below 500 ms'
            echo '- p99 target: below 1000 ms'
            echo '- Scope: CI baseline only; not a production capacity certification'
            echo '- Runtime database: host-native PostgreSQL Direct (least-privilege role)'
            echo '- Startup log artifact: `backend-startup.log`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline-results
          path: performance/results/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/sanad-perf-app.pid ]; then
            kill "$(cat /tmp/sanad-perf-app.pid)" 2>/dev/null || true
          fi
