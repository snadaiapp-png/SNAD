name: Performance Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sanad-platform/**'
      - 'performance/k6/**'
      - '.github/workflows/performance-baseline.yml'
      - 'docs/production-readiness/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crm-033-authenticated-benchmark:
    name: CRM-033 Authenticated Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanad
          POSTGRES_PASSWORD: sanad_pass
          POSTGRES_DB: sanad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanad -d sanad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PERF_TEST_ADMIN_EMAIL: perf-admin@sanad.local
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: sanad
      SPRING_DATASOURCE_PASSWORD: sanad_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_PROFILES_ACTIVE: perf-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up pinned k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.53.0'

      - name: Generate per-run benchmark secrets
        shell: bash
        run: |
          set -euo pipefail
          jwt_secret="$(openssl rand -base64 48 | tr -d '\n')"
          admin_password="$(openssl rand -base64 30 | tr -d '\n')Aa1!"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_password"
          {
            echo "JWT_SECRET=$jwt_secret"
            echo "PERF_TEST_JWT_SECRET=$jwt_secret"
            echo "PERF_TEST_ADMIN_PASSWORD=$admin_password"
          } >> "$GITHUB_ENV"

      - name: Build backend resources
        working-directory: apps/sanad-platform
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dmaven.test.skip=true clean package

      - name: Migrate isolated PostgreSQL
        working-directory: apps/sanad-platform
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress flyway:migrate \
            -Dflyway.url="$SPRING_DATASOURCE_URL" \
            -Dflyway.user="$SPRING_DATASOURCE_USERNAME" \
            -Dflyway.password="$SPRING_DATASOURCE_PASSWORD" \
            -Dflyway.locations=classpath:db/migration,classpath:db/vendor/postgresql \
            -Dflyway.baselineOnMigrate=true \
            -Dflyway.validateOnMigrate=true \
            -Dflyway.outOfOrder=true \
            -Dflyway.baselineVersion=0

      - name: Validate isolated PostgreSQL migrations
        working-directory: apps/sanad-platform
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress flyway:validate \
            -Dflyway.url="$SPRING_DATASOURCE_URL" \
            -Dflyway.user="$SPRING_DATASOURCE_USERNAME" \
            -Dflyway.password="$SPRING_DATASOURCE_PASSWORD" \
            -Dflyway.locations=classpath:db/migration,classpath:db/vendor/postgresql

      - name: Start backend on PostgreSQL with runtime Flyway off
        working-directory: apps/sanad-platform
        run: |
          set -euo pipefail
          mkdir -p ../../performance/results
          nohup mvn -q -DskipTests spring-boot:run \
            -Dspring-boot.run.arguments="--server.port=8080 --spring.flyway.enabled=false --spring.jpa.hibernate.ddl-auto=validate" \
            > ../../performance/results/crm-perf-backend-startup.log 2>&1 &
          echo $! > /tmp/sanad-crm-perf-app.pid

      - name: Wait for health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if ! kill -0 "$(cat /tmp/sanad-crm-perf-app.pid)" 2>/dev/null; then
              echo "::error::sanad backend process exited before becoming healthy"
              cat performance/results/crm-perf-backend-startup.log || true
              exit 1
            fi
            code=$(curl -sS -o /tmp/crm-perf-health.json -w '%{http_code}' http://localhost:8080/actuator/health || true)
            if [ "$code" = '200' ]; then exit 0; fi
            sleep 5
          done
          echo "::error::SNAD backend did not become healthy for CRM-033 benchmark"
          cat performance/results/crm-perf-backend-startup.log || true
          exit 1

      - name: Verify authenticated login before load
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({'email': os.environ['PERF_TEST_ADMIN_EMAIL'], 'password': os.environ['PERF_TEST_ADMIN_PASSWORD']}))
          PY
          )"
          code="$(curl -sS -o /tmp/crm033-login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            http://localhost:8080/api/v1/auth/login)"
          if [ "$code" != '200' ]; then
            echo "::error::CRM-033 preflight login failed with HTTP $code"
            cat /tmp/crm033-login.json
            exit 1
          fi
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/crm033-login.json', encoding='utf-8'))
          assert data.get('accessToken'), 'login response missing accessToken'
          print('CRM-033 authenticated login preflight: PASS')
          PY

      - name: Run CRM-033 k6 benchmark
        env:
          BASE_URL: http://localhost:8080
          OUTPUT_FILE: performance/results/crm-perf-baseline.json
        run: |
          set -euo pipefail
          mkdir -p performance/results
          k6 version
          k6 run \
            --summary-export=performance/results/crm-perf-summary.json \
            performance/k6/crm-performance-baseline.js

      - name: Publish CRM-033 summary
        if: always()
        run: |
          {
            echo '## CRM-033 Authenticated Performance Benchmark'
            echo ''
            echo '- Scenario: 50 RPS constant-arrival-rate for 10 minutes'
            echo '- Endpoints: dashboard, accounts-list, customer-360, lead-conversion'
            echo '- Authentication: automatic login via /api/v1/auth/login'
            echo '- Failure threshold: less than 1%'
            echo '- p95 target: below 500 ms'
            echo '- p99 target: below 1000 ms'
            echo '- Runtime: isolated PostgreSQL CI service; Flyway migrated before startup; web runtime Flyway OFF; JPA validate'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CRM-033 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crm-033-performance-results
          path: performance/results/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/sanad-crm-perf-app.pid ]; then
            kill "$(cat /tmp/sanad-crm-perf-app.pid)" 2>/dev/null || true
          fi

  backend-health-baseline:
    name: Backend Health Load Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanad
          POSTGRES_PASSWORD: sanad_pass
          POSTGRES_DB: sanad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sanad -d sanad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/sanad?prepareThreshold=0
      SPRING_DATASOURCE_USERNAME: sanad
      SPRING_DATASOURCE_PASSWORD: sanad_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_PROFILES_ACTIVE: default

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up pinned k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: '0.53.0'

      - name: Generate per-run JWT secret
        shell: bash
        run: |
          set -euo pipefail
          jwt_secret="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$jwt_secret"
          echo "JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"

      - name: Build backend resources
        working-directory: apps/sanad-platform
        run: mvn --batch-mode --no-transfer-progress -DskipTests -Dmaven.test.skip=true clean package

      - name: Migrate isolated PostgreSQL
        working-directory: apps/sanad-platform
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress flyway:migrate \
            -Dflyway.url="$SPRING_DATASOURCE_URL" \
            -Dflyway.user="$SPRING_DATASOURCE_USERNAME" \
            -Dflyway.password="$SPRING_DATASOURCE_PASSWORD" \
            -Dflyway.locations=classpath:db/migration,classpath:db/vendor/postgresql \
            -Dflyway.baselineOnMigrate=true \
            -Dflyway.validateOnMigrate=true \
            -Dflyway.outOfOrder=true \
            -Dflyway.baselineVersion=0

      - name: Validate isolated PostgreSQL migrations
        working-directory: apps/sanad-platform
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress flyway:validate \
            -Dflyway.url="$SPRING_DATASOURCE_URL" \
            -Dflyway.user="$SPRING_DATASOURCE_USERNAME" \
            -Dflyway.password="$SPRING_DATASOURCE_PASSWORD" \
            -Dflyway.locations=classpath:db/migration,classpath:db/vendor/postgresql

      - name: Start backend on PostgreSQL with runtime Flyway off
        working-directory: apps/sanad-platform
        run: |
          set -euo pipefail
          mkdir -p ../../performance/results
          nohup mvn -q -DskipTests spring-boot:run \
            -Dspring-boot.run.arguments="--server.port=8080 --management.endpoints.web.exposure.include=health,info --management.endpoint.health.show-details=always --spring.flyway.enabled=false --spring.jpa.hibernate.ddl-auto=validate" \
            > ../../performance/results/backend-startup.log 2>&1 &
          echo $! > /tmp/sanad-perf-app.pid

      - name: Wait for health
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if ! kill -0 "$(cat /tmp/sanad-perf-app.pid)" 2>/dev/null; then
              echo "::error::sanad backend process exited before becoming healthy"
              cat performance/results/backend-startup.log || true
              exit 1
            fi
            code=$(curl -sS -o /tmp/perf-health.json -w '%{http_code}' http://localhost:8080/actuator/health || true)
            if [ "$code" = '200' ]; then exit 0; fi
            sleep 5
          done
          echo "::error::SNAD backend did not become healthy for performance baseline"
          cat performance/results/backend-startup.log || true
          exit 1

      - name: Run k6 baseline
        env:
          BASE_URL: http://localhost:8080
        run: |
          set -euo pipefail
          mkdir -p performance/results
          k6 version
          k6 run \
            --summary-export=performance/results/health-baseline-summary.json \
            performance/k6/health-baseline.js

      - name: Publish baseline summary
        if: always()
        run: |
          {
            echo '## SNAD Performance Baseline'
            echo ''
            echo '- Scenario: 10 constant virtual users for 60 seconds'
            echo '- Endpoint: `/actuator/health`'
            echo '- Failure threshold: less than 1%'
            echo '- p95 target: below 500 ms'
            echo '- p99 target: below 1000 ms'
            echo '- Scope: CI baseline only; not a production capacity certification'
            echo '- Runtime: isolated PostgreSQL CI service; Flyway migrated before startup; web runtime Flyway OFF; JPA validate'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline-results
          path: performance/results/
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/sanad-perf-app.pid ]; then
            kill "$(cat /tmp/sanad-perf-app.pid)" 2>/dev/null || true
          fi
