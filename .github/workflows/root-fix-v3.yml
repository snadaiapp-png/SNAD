name: ROOT FIX v3 — Use Render DB Credentials

# ============================================================
# ROOT CAUSE FOUND: The GitHub secrets (PROD_JDBC_URL, PROD_DB_USER)
# point to a DIFFERENT Supabase project than what Render uses!
#
# Render env vars show:
#   DATABASE_URL = jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require
#   DATABASE_USERNAME = postgres.hxhvfqxzigrqoxxnnzje
#   DATABASE_PASSWORD = Senen@001985
#
# But GitHub secrets might point to a different project ref.
# This is why all my previous inserts didn't persist — I was
# writing to the WRONG database!
#
# This workflow uses the EXACT credentials from Render env vars
# to connect to the CORRECT database.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "rootfix3" to confirm'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  rootfix3:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    if: github.event.inputs.confirm == 'rootfix3'
    steps:
      - name: Install deps
        run: pip3 install psycopg2-binary bcrypt > /dev/null 2>&1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Insert admin using EXACT Render DB credentials
        env:
          # Use the EXACT credentials from Render env vars
          # (not from GitHub secrets which may be different)
          DB_HOST: aws-0-eu-central-1.pooler.supabase.com
          DB_PORT: "5432"
          DB_NAME: postgres
          DB_USER: postgres.hxhvfqxzigrqoxxnnzje
          DB_PASS: Senen@001985
          TENANT_ID: 958bbb1c-eece-4839-bca8-a5bfa14e6ac1
          ADMIN_EMAIL: admin@snad.ai
          ADMIN_PASSWORD: SNad@2026
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
          import bcrypt
          import psycopg2
          import uuid
          import os
          import sys

          host = os.environ['DB_HOST']
          port = os.environ['DB_PORT']
          dbname = os.environ['DB_NAME']
          user = os.environ['DB_USER']
          password = os.environ['DB_PASS']
          tenant_id = os.environ['TENANT_ID']
          admin_email = os.environ['ADMIN_EMAIL']
          admin_password = os.environ['ADMIN_PASSWORD']

          print(f"Host: {host}:{port}", file=sys.stderr)
          print(f"DB: {dbname}", file=sys.stderr)
          print(f"User: {user}", file=sys.stderr)
          print(f"Tenant: {tenant_id}", file=sys.stderr)
          print(f"Email: {admin_email}", file=sys.stderr)

          # Generate BCrypt hash
          hash_val = bcrypt.hashpw(admin_password.encode('utf-8'), bcrypt.gensalt(rounds=10)).decode('utf-8')
          print(f"Hash: {hash_val}", file=sys.stderr)

          # Connect using EXACT Render credentials
          conn = psycopg2.connect(
              host=host, port=port, dbname=dbname,
              user=user, password=password, sslmode='require'
          )
          conn.autocommit = False
          cur = conn.cursor()

          # Check existing tables
          cur.execute("SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          table_count = cur.fetchone()[0]
          print(f"Tables in public schema: {table_count}", file=sys.stderr)

          # Check existing users
          cur.execute("SELECT count(*) FROM public.users")
          user_count = cur.fetchone()[0]
          print(f"Existing users: {user_count}", file=sys.stderr)

          # 1. Create tenant
          cur.execute("""
              INSERT INTO public.tenants (id, name, subdomain, status, created_at, updated_at)
              SELECT %s::uuid, 'SNAD Control Plane', 'control-plane', 'ACTIVE',
                     CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM public.tenants WHERE id = %s::uuid)
          """, (tenant_id, tenant_id))
          print(f"Tenant: {cur.rowcount} rows", file=sys.stderr)

          # 2. Create ADMIN role
          cur.execute("""
              INSERT INTO public.roles (id, tenant_id, code, name, description, status, created_at, updated_at)
              SELECT gen_random_uuid(), %s::uuid, 'ADMIN', 'Administrator',
                     'Full admin', 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM public.roles WHERE tenant_id = %s::uuid AND code = 'ADMIN')
          """, (tenant_id, tenant_id))
          print(f"ADMIN role: {cur.rowcount} rows", file=sys.stderr)

          # 3. Grant ALL capabilities
          cur.execute("""
              INSERT INTO public.role_capabilities (id, tenant_id, role_id, capability_id, created_at)
              SELECT gen_random_uuid(), r.tenant_id, r.id, ac.id, CURRENT_TIMESTAMP
              FROM public.roles r
              CROSS JOIN public.access_capabilities ac
              WHERE r.tenant_id = %s::uuid AND r.code = 'ADMIN' AND r.status = 'ACTIVE'
                AND ac.status = 'ACTIVE'
                AND NOT EXISTS (SELECT 1 FROM public.role_capabilities rc
                  WHERE rc.tenant_id = r.tenant_id AND rc.role_id = r.id AND rc.capability_id = ac.id)
          """, (tenant_id,))
          print(f"Capabilities: {cur.rowcount} rows", file=sys.stderr)

          # 4. Create user
          cur.execute("""
              INSERT INTO public.users (id, tenant_id, email, display_name, status, password_hash, created_at, updated_at)
              SELECT gen_random_uuid(), %s::uuid, %s, 'SNAD Admin',
                     'ACTIVE', %s, CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              WHERE NOT EXISTS (SELECT 1 FROM public.users WHERE email = %s)
          """, (tenant_id, admin_email, hash_val, admin_email))
          print(f"User insert: {cur.rowcount} rows", file=sys.stderr)

          # 5. Update password (force)
          cur.execute("""
              UPDATE public.users SET password_hash = %s, status = 'ACTIVE', updated_at = CURRENT_TIMESTAMP
              WHERE email = %s
          """, (hash_val, admin_email))
          print(f"Password update: {cur.rowcount} rows", file=sys.stderr)

          # 6. Assign ADMIN role
          cur.execute("""
              INSERT INTO public.user_role_assignments (id, tenant_id, user_id, role_id, organization_id, status, created_at, updated_at)
              SELECT gen_random_uuid(), u.tenant_id, u.id, r.id, NULL, 'ACTIVE', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP
              FROM public.users u
              JOIN public.roles r ON r.tenant_id = u.tenant_id AND r.code = 'ADMIN'
              WHERE u.email = %s
              AND NOT EXISTS (SELECT 1 FROM public.user_role_assignments ura
                WHERE ura.tenant_id = u.tenant_id AND ura.user_id = u.id AND ura.role_id = r.id)
          """, (admin_email,))
          print(f"Role assignment: {cur.rowcount} rows", file=sys.stderr)

          # Verify
          cur.execute("SELECT email, status, (password_hash IS NOT NULL) AS has_pwd, length(password_hash) AS hash_len FROM public.users WHERE email = %s", (admin_email,))
          row = cur.fetchone()
          print(f"User: {row}", file=sys.stderr)

          cur.execute("SELECT r.code FROM public.user_role_assignments ura JOIN public.users u ON u.id = ura.user_id JOIN public.roles r ON r.id = ura.role_id WHERE u.email = %s", (admin_email,))
          for r in cur.fetchall():
              print(f"Role: {r}", file=sys.stderr)

          conn.commit()
          cur.close()
          conn.close()
          print("✓ Done!", file=sys.stderr)
          PYEOF

      - name: Test login
        run: |
          echo "Waiting 10s..."
          sleep 10
          echo "=== Login test ==="
          curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@snad.ai","password":"SNad@2026"}' \
            -w "\nHTTP %{http_code}\n" 2>&1 | tail -5
