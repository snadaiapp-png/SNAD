name: Render Blueprint Validation

on:
  push:
    branches:
      - main
      - infra/backend-clean-room-v1
    paths:
      - 'render.yaml'
      - 'apps/sanad-platform/Dockerfile'
      - 'apps/sanad-platform/.dockerignore'
      - 'apps/sanad-platform/src/main/resources/application-prod.yml'
      - 'scripts/ops/test_runtime_clean_room.py'
      - '.github/workflows/render-blueprint-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'render.yaml'
      - 'apps/sanad-platform/Dockerfile'
      - 'apps/sanad-platform/.dockerignore'
      - 'apps/sanad-platform/src/main/resources/application-prod.yml'
      - 'scripts/ops/test_runtime_clean_room.py'
      - '.github/workflows/render-blueprint-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Render clean-room contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: pip install pyyaml

      - name: Run runtime clean-room contract
        run: python scripts/ops/test_runtime_clean_room.py

      - name: Structural and governance validation
        run: |
          python3 << 'PYEOF'
          import re
          import sys
          import yaml

          with open('render.yaml', encoding='utf-8') as handle:
              bp = yaml.safe_load(handle) or {}

          errors = []
          services = bp.get('services') or []
          web_services = [s for s in services if s.get('type') == 'web']
          if not web_services:
              errors.append('Blueprint must define at least one web service')

          for svc in web_services:
              name = svc.get('name', 'unnamed')
              for required in ('runtime', 'region', 'plan', 'healthCheckPath'):
                  if required not in svc:
                      errors.append(f"Service '{name}' missing {required}")

              if svc.get('runtime') != 'image':
                  errors.append(f"Service '{name}' must use runtime=image")

              image_url = ((svc.get('image') or {}).get('url') or '').strip()
              if not image_url:
                  errors.append(f"Service '{name}' missing image.url")
              if re.search(r'(?i):latest$', image_url):
                  errors.append(f"Service '{name}' uses forbidden mutable :latest image")
              immutable = bool(
                  re.search(r'@sha256:[0-9a-f]{64}$', image_url)
                  or re.search(r':[0-9a-f]{40}$', image_url)
              )
              if image_url and not immutable:
                  errors.append(
                      f"Service '{name}' image must be pinned to a 40-char Git SHA tag or sha256 digest"
                  )

              if svc.get('autoDeployTrigger') != 'off':
                  errors.append(f"Service '{name}' must set autoDeployTrigger: off")
              if svc.get('healthCheckPath') != '/actuator/health/readiness':
                  errors.append(
                      f"Service '{name}' healthCheckPath must be /actuator/health/readiness"
                  )

              env = {item.get('key'): item for item in svc.get('envVars', []) if item.get('key')}
              def env_value(key):
                  value = (env.get(key) or {}).get('value')
                  return '' if value is None else str(value).strip().lower()

              if env_value('FLYWAY_ENABLED') != 'false':
                  errors.append('FLYWAY_ENABLED must be false in Render runtime')
              if env_value('DATABASE_POOL_MIN') != '0':
                  errors.append('DATABASE_POOL_MIN must be 0 in Render runtime')
              if env_value('JPA_DDL_AUTO') not in ('', 'validate', 'none'):
                  errors.append('JPA_DDL_AUTO must not mutate schema')
              if env_value('FLYWAY_BASELINE_ON_MIGRATE') == 'true':
                  errors.append('FLYWAY_BASELINE_ON_MIGRATE=true is forbidden')

              for key, item in env.items():
                  upper = key.upper()
                  sensitive = any(token in upper for token in ('PASSWORD', 'SECRET', 'API_KEY'))
                  if sensitive and 'value' in item and str(item.get('value', '')).strip():
                      errors.append(f"Sensitive env var '{key}' must not contain a literal value")

          if errors:
              print('Blueprint clean-room validation FAILED:')
              for error in errors:
                  print(f' - {error}')
              sys.exit(1)

          print('Blueprint clean-room validation PASS')
          for svc in web_services:
              print(
                  f"service={svc.get('name')} plan={svc.get('plan')} "
                  f"autoDeploy={svc.get('autoDeployTrigger')} health={svc.get('healthCheckPath')}"
              )
          PYEOF
