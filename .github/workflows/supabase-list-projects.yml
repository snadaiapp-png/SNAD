name: Supabase List All Projects + Pick Primary

# Lists ALL Supabase projects on the user's account.
# Identifies which projects exist, their regions, statuses, and creation dates.
# Picks the "primary" project (most recent active one).
# Does NOT delete anything (read-only).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-projects:
    name: List Supabase projects
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - name: List all Supabase projects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CURRENT_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set +e
          SB_AUTH="Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"
          
          echo "========================================"
          echo "SUPABASE PROJECTS — LIST ALL"
          echo "========================================"
          echo "Current SUPABASE_PROJECT_REF (in GitHub secret): $CURRENT_PROJECT_REF"
          echo ""

          # List all projects
          echo "=== GET /v1/projects ==="
          HTTP=$(curl -s -o /tmp/projects.json -w "%{http_code}" --max-time 30 \
            -H "$SB_AUTH" "https://api.supabase.com/v1/projects")
          echo "HTTP $HTTP"
          echo ""

          if [ "$HTTP" = "200" ]; then
            PROJECT_COUNT=$(jq 'if type=="array" then length else 0 end' /tmp/projects.json)
            echo "Total projects found: $PROJECT_COUNT"
            echo ""
            echo "========================================"
            echo "PROJECT LIST"
            echo "========================================"
            echo ""
            # Print each project with key fields
            jq -r '.[] | "PROJECT: \(.id // .ref // "?")\n  name: \(.name // "?")\n  status: \(.status // "?")\n  region: \(.region // "?")\n  created: \(.created_at // "?")\n  db_host: \(.db_host // "<none>")\n  db_port: \(.db_port // "5432")\n  organization_id: \(.organization_id // "?")\n"' /tmp/projects.json
            echo "========================================"
            echo ""

            # Identify primary project
            echo "=== Primary candidate selection ==="
            
            # 1. Match current SUPABASE_PROJECT_REF (if it still exists)
            CURRENT_MATCH=$(jq -r --arg ref "$CURRENT_PROJECT_REF" '.[] | select(.id == $ref or .ref == $ref) | .id // .ref' /tmp/projects.json | head -1)
            
            # 2. Most recently created active project
            MOST_RECENT=$(jq -r '[.[] | select(.status != "paused" and .status != "suspended")] | sort_by(.created_at) | reverse | .[0] | .id // .ref // "<none>"' /tmp/projects.json)
            
            # 3. Any project with "snad" or "sanad" in the name
            SNAD_MATCH=$(jq -r '.[] | select((.name // "") | test("snad|sanad"; "i")) | .id // .ref' /tmp/projects.json | head -1)
            
            echo "Current SUPABASE_PROJECT_REF matches: ${CURRENT_MATCH:-<no match — was deleted>}"
            echo "Most recent active project: $MOST_RECENT"
            echo "Project named snad/sanad: ${SNAD_MATCH:-<none>}"
            echo ""

            # Print summary table
            echo "=== Summary table ==="
            printf "%-40s %-20s %-15s %-25s %s\n" "ID/REF" "NAME" "STATUS" "REGION" "CREATED"
            jq -r '.[] | "[\(.id // .ref // "?"), \(.name // "?"), \(.status // "?"), \(.region // "?"), \(.created_at // "?")]"' /tmp/projects.json | jq -r '.[0] + " | " + .[1] + " | " + .[2] + " | " + .[3] + " | " + .[4]' 2>/dev/null || \
              jq -r '.[] | "\(.id // .ref // "?") | \(.name // "?") | \(.status // "?") | \(.region // "?") | \(.created_at // "?")"' /tmp/projects.json
            
            echo ""
            echo "========================================"
            echo "PRIMARY PROJECT SELECTION"
            echo "========================================"
            if [ -n "$SNAD_MATCH" ] && [ "$SNAD_MATCH" != "null" ]; then
              PRIMARY=$SNAD_MATCH
              echo "Selected primary: $PRIMARY (named snad/sanad)"
            elif [ -n "$CURRENT_MATCH" ] && [ "$CURRENT_MATCH" != "null" ]; then
              PRIMARY=$CURRENT_MATCH
              echo "Selected primary: $PRIMARY (matches current SUPABASE_PROJECT_REF)"
            elif [ -n "$MOST_RECENT" ] && [ "$MOST_RECENT" != "null" ] && [ "$MOST_RECENT" != "<none>" ]; then
              PRIMARY=$MOST_RECENT
              echo "Selected primary: $PRIMARY (most recent active)"
            else
              PRIMARY=""
              echo "No primary project identified"
            fi
            echo ""
            echo "PRIMARY_PROJECT_REF=$PRIMARY"

          else
            echo "::error::Failed to list projects"
            cat /tmp/projects.json
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "LIST COMPLETE"
          echo "========================================"
          echo ""
          echo "No projects were modified."
          echo "To consolidate to a single project, the user must:"
          echo "  1. Review this list"
          echo "  2. Identify the primary project to keep"
          echo "  3. Provide the DB password for the primary project"
          echo "  4. Authorize deletion of the others"
