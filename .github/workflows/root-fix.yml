name: ROOT FIX — RETIRED

# Retired by PR #919.
# This workflow previously embedded a legacy owner email and plaintext bootstrap
# credential and could recreate an identity that is no longer authoritative.
# Owner recovery now uses the canonical Flyway migration plus the normal
# password-recovery flow and production-release workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy bootstrap
        run: |
          echo "This legacy credential bootstrap is retired."
          echo "Use the canonical owner recovery path for snad.ai.app@gmail.com."
          exit 1
