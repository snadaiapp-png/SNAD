name: ROOT FIX — Bootstrap + Restart + Login

# ============================================================
# ROOT FIX: Force the backend to restart with BOOTSTRAP_ENABLED=true
# so Spring Boot creates the admin user with its OWN BCryptPasswordEncoder.
#
# Strategy:
#   1. Set ALL env vars (BOOTSTRAP_ENABLED=true, admin email/password)
#   2. Suspend the service (stops the old container)
#   3. Resume the service (starts with NEW env vars)
#   4. Wait for health
#   5. Wait extra 60s for bootstrap to complete
#   6. Test login
#   7. Disable bootstrap
# ============================================================

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "rootfix" to confirm'
        required: true
        default: ''
        type: string

permissions:
  contents: read

jobs:
  rootfix:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    if: github.event.inputs.confirm == 'rootfix'

    steps:
      - name: Set ALL env vars
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
          CONTROL_PLANE_TENANT_ID: ${{ secrets.CONTROL_PLANE_TENANT_ID }}
          PROD_JDBC_URL: ${{ secrets.PROD_JDBC_URL }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          set -euo pipefail

          set_var() {
            local key="$1"
            local value="$2"
            local type="${3:-raw}"
            local payload
            if [ "$type" = "secret" ]; then
              payload=$(python3 -c 'import json,sys; print(json.dumps({"value": sys.argv[1], "type": "SECRET"}))' "$value")
            else
              payload=$(python3 -c 'import json,sys; print(json.dumps({"value": sys.argv[1]}))' "$value")
            fi
            curl -sS -o /dev/null -w "  $key: HTTP %{http_code}\n" --max-time 30 \
              -X PUT -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" -H "Content-Type: application/json" \
              --data "$payload" \
              "https://api.render.com/v1/services/${BACKEND_ID}/env-vars/${key}"
          }

          echo "=== Setting ALL env vars ==="

          # Bootstrap — THIS IS THE KEY! Spring Boot will create the user
          # on startup using its OWN BCryptPasswordEncoder
          set_var "BOOTSTRAP_ENABLED" "true"
          set_var "BOOTSTRAP_ADMIN_EMAIL" "admin@snad.ai"
          set_var "BOOTSTRAP_ADMIN_PASSWORD" "SNad@2026"
          set_var "BOOTSTRAP_TENANT_ID" "$CONTROL_PLANE_TENANT_ID"
          set_var "BOOTSTRAP_FORCE_RESET" "true"

          # Database
          set_var "DATABASE_URL" "$PROD_JDBC_URL" "secret"
          set_var "DATABASE_USERNAME" "$PROD_DB_USER" "secret"
          set_var "DATABASE_PASSWORD" "$PROD_DB_PASSWORD" "secret"

          # Spring — minimal config for startup
          set_var "SPRING_PROFILES_ACTIVE" "prod"
          set_var "FLYWAY_ENABLED" "false"
          set_var "FLYWAY_LOCATIONS" "classpath:db/migration,classpath:db/vendor/{vendor}"
          set_var "JPA_DDL_AUTO" "none"
          set_var "DATABASE_POOL_MAX" "1"
          set_var "DATABASE_POOL_MIN" "1"
          set_var "DATABASE_POOL_TIMEOUT" "60000"

          # Auth
          set_var "JWT_SECRET" "$(openssl rand -hex 32)" "secret"
          set_var "SANAD_CONTROL_PLANE_TENANT_ID" "$CONTROL_PLANE_TENANT_ID" "secret"

          # CORS + Server
          set_var "SANAD_CORS_ALLOWED_ORIGINS" "https://snad-app.vercel.app"
          set_var "SERVER_PORT" "8080"
          set_var "MANAGEMENT_ENDPOINTS" "health"
          set_var "SHUTDOWN_TIMEOUT" "30s"

          # Java — moderate heap (256MB worked before)
          set_var "JAVA_OPTS" "-Xms64m -Xmx256m -XX:MaxDirectMemorySize=32m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss256k -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError -Dfile.encoding=UTF-8"

          # Logging
          set_var "LOG_LEVEL_ROOT" "WARN"
          set_var "LOG_LEVEL_SANAD" "INFO"
          set_var "LAZY_INIT" "true"
          set_var "SECURITY_NOTIFICATION_PROVIDER" "disabled"
          set_var "APPLICATION_BASE_URL" "https://snad-app.vercel.app"

          echo "=== All env vars set ==="

      - name: Suspend service (stop old container)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          echo "=== Suspending service ==="
          STATUS=$(curl -sS -o /tmp/suspend.json -w "%{http_code}" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/suspend" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json")
          echo "Suspend HTTP ${STATUS}"
          echo "Waiting 20s..."
          sleep 20

      - name: Resume service (start with NEW env vars)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          echo "=== Resuming service ==="
          STATUS=$(curl -sS -o /tmp/resume.json -w "%{http_code}" --max-time 30 \
            -X POST "https://api.render.com/v1/services/${BACKEND_ID}/resume" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json")
          echo "Resume HTTP ${STATUS}"

      - name: Wait for health (up to 5 min)
        run: |
          echo "=== Waiting for backend to become healthy ==="
          for i in $(seq 1 30); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
              "https://sanad-backend-mcrj.onrender.com/actuator/health" 2>/dev/null || echo "000")
            echo "  Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✓ Backend is UP!"
              break
            fi
            sleep 10
          done

      - name: Wait 90s for bootstrap to complete
        run: |
          echo "=== Waiting 90s for CredentialBootstrapConfig to run ==="
          echo "Spring Boot will create/update admin@snad.ai with SNad@2026"
          echo "using its OWN BCryptPasswordEncoder..."
          sleep 90

      - name: Test login with correct credentials
        env:
          ADMIN_EMAIL: admin@snad.ai
          ADMIN_PASSWORD: SNad@2026
        run: |
          echo "=== Login test ==="
          RESULT=$(curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            -w "\n%{http_code}" 2>/dev/null || echo "timeout")
          HTTP_CODE=$(echo "$RESULT" | tail -1)
          BODY=$(echo "$RESULT" | head -n -1)
          echo "HTTP: $HTTP_CODE"
          echo "Body: $BODY"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "🎉🎉🎉 LOGIN SUCCESSFUL! 🎉🎉🎉"
            echo "bootstrap_success=true" >> "$GITHUB_ENV"
          elif [ "$HTTP_CODE" = "401" ]; then
            echo "❌ 401 — password still wrong"
            echo "bootstrap_success=false" >> "$GITHUB_ENV"
          elif [ "$HTTP_CODE" = "500" ]; then
            echo "⚠️ 500 — backend still warming up, retrying..."
            sleep 30
            RESULT2=$(curl -sS --max-time 30 -X POST "https://sanad-backend-mcrj.onrender.com/api/v1/auth/login" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
              -w "\n%{http_code}" 2>/dev/null || echo "timeout")
            HTTP_CODE2=$(echo "$RESULT2" | tail -1)
            echo "Retry HTTP: $HTTP_CODE2"
            if [ "$HTTP_CODE2" = "200" ]; then
              echo "🎉🎉🎉 LOGIN SUCCESSFUL ON RETRY! 🎉🎉🎉"
              echo "bootstrap_success=true" >> "$GITHUB_ENV"
            fi
          fi

      - name: Test BFF login
        env:
          ADMIN_EMAIL: admin@snad.ai
          ADMIN_PASSWORD: SNad@2026
        run: |
          echo "=== BFF login test ==="
          curl -sS --max-time 30 -X POST "https://snad-app.vercel.app/api/platform/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -H "Origin: https://snad-app.vercel.app" \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            -w "\nHTTP %{http_code}\n" 2>&1 || true

      - name: Disable bootstrap (security)
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_ID: srv-d8ragqkm0tmc73bviqq0
        run: |
          echo "=== Disabling bootstrap ==="
          PAYLOAD=$(python3 -c 'import json; print(json.dumps({"value": "false"}))')
          curl -sS -o /dev/null -w "Disable HTTP %{http_code}\n" --max-time 30 \
            -X PUT -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "https://api.render.com/v1/services/${BACKEND_ID}/env-vars/BOOTSTRAP_ENABLED"

      - name: Final summary
        if: always()
        run: |
          echo "============================================"
          echo "         ROOT FIX SUMMARY"
          echo "============================================"
          echo "Bootstrap: ${{ env.bootstrap_success || 'unknown' }}"
          echo ""
          if [ "${{ env.bootstrap_success }}" = "true" ]; then
            echo "✅ LOGIN WORKS!"
            echo "   URL: https://snad-app.vercel.app"
            echo "   Email: admin@snad.ai"
            echo "   Password: SNad@2026"
          else
            echo "❌ Login still fails"
            echo "   The CredentialBootstrapConfig may not have run"
            echo "   or the bootstrap env vars were not picked up"
          fi
          echo "============================================"
