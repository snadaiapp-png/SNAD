name: G2 Canonical Identity TDD

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/sanad-platform/src/main/java/com/sanad/platform/hr/time/application/**'
      - 'apps/sanad-platform/src/test/java/com/sanad/platform/hr/time/**'
      - '.github/workflows/_g2-canonical-identity-tdd.yml'

permissions:
  contents: read

jobs:
  targeted:
    name: G2 Canonical Identity Targeted Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/sanad-platform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run canonical identity resolver tests
        run: mvn -B -ntp -Dtest=HrEmploymentScopeResolverTest test
