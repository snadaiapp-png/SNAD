name: G2 Canonical Identity TDD

on:
  push:
    branches: [fix/g2-canonical-hr-identity]

permissions:
  contents: read

concurrency:
  group: g2-canonical-identity-tdd
  cancel-in-progress: true

jobs:
  targeted:
    name: G2 Canonical Identity Targeted Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate canonical provisioning shell
        run: |
          bash -n scripts/g2/provision-canonical-hr.sh
          grep -Fq 'hr_people person' apps/sanad-platform/src/main/java/com/sanad/platform/hr/time/application/HrEmploymentScopeResolver.java
          grep -Fq 'reports_to_assignment_id = manager_assignment.id' apps/sanad-platform/src/main/java/com/sanad/platform/hr/time/application/HrG2ScopedReadService.java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run canonical identity resolver tests
        working-directory: apps/sanad-platform
        run: mvn -B -ntp -Dtest=HrEmploymentScopeResolverTest,HrG2ScopedReadServiceTest test
