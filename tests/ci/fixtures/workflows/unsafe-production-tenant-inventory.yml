name: Unsafe Production Tenant Inventory
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Dump tenant inventory
        env:
          DATABASE_URL: ${{ secrets.PROD_JDBC_URL }}
          DATABASE_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          PGHOST="prod-db.internal"
          DB_NAME="snad"
          echo "Connection set candidate: host=${PGHOST} db=${DB_NAME}"
          psql --command="SELECT id, name, subdomain, status FROM tenants ORDER BY created_at;"
