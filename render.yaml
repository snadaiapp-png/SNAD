# Render Blueprint for SANAD Backend
# ============================================================
# Clean-Room contract:
# - GitHub builds immutable GHCR images.
# - Runtime never owns Flyway migrations.
# - Render auto-deploy is disabled; canonical deploy workflow will deploy an
#   exact digest after PostgreSQL Direct migration and certification gates pass.
# - plan remains free until an instance upgrade is explicitly authorized.
# ============================================================

services:
  - type: web
    name: sanad-backend
    runtime: image
    image:
      # Integration source pin only. Production deployment authority is the
      # exact digest supplied by the future canonical render-deploy workflow.
      url: ghcr.io/snadaiapp-png/snad-backend:5a6feecc24c2b2bc2615e7f14a3834818c09030f
    region: frankfurt
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /actuator/health/readiness
    maxShutdownDelaySeconds: 30
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "8080"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_DRIVER
        value: org.postgresql.Driver
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JPA_DDL_AUTO
        value: validate
      - key: FLYWAY_ENABLED
        value: "false"
      - key: SANAD_CORS_ALLOWED_ORIGINS
        value: https://snad-app.vercel.app
      - key: BOOTSTRAP_ENABLED
        value: "false"
      - key: SANAD_CONTROL_PLANE_TENANT_ID
        sync: false
      - key: LOG_LEVEL_ROOT
        value: WARN
      - key: LOG_LEVEL_SANAD
        value: INFO
      - key: LAZY_INIT
        value: "true"
      - key: MANAGEMENT_ENDPOINTS
        value: health
      - key: SHUTDOWN_TIMEOUT
        value: 30s
      - key: DATABASE_POOL_MAX
        value: "3"
      - key: DATABASE_POOL_MIN
        value: "0"
      - key: DATABASE_POOL_TIMEOUT
        value: "30000"
      - key: SECURITY_NOTIFICATION_PROVIDER
        value: resend
      - key: SECURITY_NOTIFICATION_FROM
        sync: false
      - key: SECURITY_NOTIFICATION_RESEND_API_KEY
        sync: false
      - key: SECURITY_NOTIFICATION_ENDPOINT
        value: https://snad-app.vercel.app/api/email-proxy
      - key: APPLICATION_BASE_URL
        value: https://snad-app.vercel.app
