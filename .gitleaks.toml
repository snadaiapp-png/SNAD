# Gitleaks configuration for SANAD Platform
#
# This configuration extends the default Gitleaks rule set.
# Only line-specific gitleaks:allow comments or exact-fingerprint
# exceptions in .gitleaksignore are used for unavoidable non-sensitive
# test fixtures.
#
# Real secrets must NEVER be added to any exclusion mechanism.

[extend]
  useDefault = true

# ---------------------------------------------------------------------------
# Path exclusions (narrow, justified, build-artifact only)
# ---------------------------------------------------------------------------
# These paths are gitignored build outputs containing generated transient
# values. They are excluded from tracked-source scanning, but their values
# must never be committed, published, or included in logs.
#
# These exclusions do NOT cover source files, test files, or documentation.
# Real secrets in source files are still detected by the default rules.

[allowlist]
description = "Gitignored generated build outputs and secret scanner test fixtures excluded from scanning"
paths = [
  '''^apps/sanad-platform/target/''',
  '''^apps/web/\.next/''',
  '''^SNAD-https/''',
  '''^node_modules/''',
  '''^apps/web/node_modules/''',
  # Test fixture files with synthetic keys — NOT real secrets
  '^apps/sanad-platform/src/test/java/com/sanad/platform/config/ProductionSecurityGuardTest.java$',
  '^apps/sanad-platform/src/test/java/com/sanad/platform/crm/legacy/infrastructure/CrmEncryptionKeyValidatorTest.java$',
  # CI/CD workflow files with test-only encryption key fixtures
  '^.github/workflows/business-process-e2e-validation.yml$',
  '^.github/workflows/ci.yml$',
  '^.github/workflows/crm-authenticated-acceptance.yml$',
  '^.github/workflows/post-merge-verification.yml$',
  # Generated performance artifact with test JWT
  '^performance/results/crm-perf-summary.json$',
]

# No global regex exclusions.
# Default detection rules are fully active for all source files.
