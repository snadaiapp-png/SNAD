# Gitleaks configuration for SANAD Platform
#
# This configuration extends the default Gitleaks rule set.
# Only line-specific gitleaks:allow comments or exact-fingerprint
# exceptions in .gitleaksignore are used for unavoidable non-sensitive
# test fixtures.
#
# Real secrets must NEVER be added to any exclusion mechanism.

[extend]
  useDefault = true

# ---------------------------------------------------------------------------
# Path exclusions (build-artifact only)
# ---------------------------------------------------------------------------
# These paths are generated/gitignored outputs. Source, tests, workflows,
# documentation, and tracked performance evidence are NOT blanket-allowlisted.

[allowlist]
description = "Gitignored generated build outputs only"
paths = [
  '''^apps/sanad-platform/target/''',
  '''^apps/web/\.next/''',
  '''^SNAD-https/''',
  '''^node_modules/''',
  '''^apps/web/node_modules/''',
]

# No global regex exclusions.
# Default detection rules are fully active for source, tests and workflows.
